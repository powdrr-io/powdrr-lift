name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      - name: Test frontend
        run: npm --prefix ui test

      - name: Typecheck frontend
        run: npm --prefix ui run typecheck

      - name: Lint frontend
        run: npm --prefix ui run lint

      - name: Build frontend
        run: npm --prefix ui run build

  portable-lock-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync --extra dev

      - name: Verify portable locks and workflow imports
        run: uv run pytest tests/test_file_lock.py -q

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RTK
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/master/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify RTK
        run: rtk --version

      - name: Sync environment
        run: uv sync --extra dev

      - name: Run formatter check
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check .

      - name: Run type checker
        run: uv run mypy src tests

      - name: Validate Procedrr process catalog
        run: uv run powdrr-lift validate-procedrr-processes docs/procedrr/processes

      - name: Run tests
        run: uv run pytest -n auto --cov=powdrr_lift --cov-branch --cov-report=term-missing --cov-report=xml tests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: Run deterministic workflow scenario suite
        run: ./scripts/run-deterministic-workflow-suite.sh

      - name: Upload deterministic workflow suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-workflow-suite-report
          path: workflow-scenario-suite-report.json
          if-no-files-found: ignore
