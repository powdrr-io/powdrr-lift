name: Publish requirement execution receipts

on:
  workflow_call:
    inputs:
      powdrr_ref:
        description: Full Git commit SHA of powdrr-lift containing the producer.
        required: true
        type: string
      input_artifact_name:
        description: Artifact uploaded by the verifier job in this workflow run.
        required: false
        default: powdrr-verification-receipt-input
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact caller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Check out pinned Powdrr producer
        uses: actions/checkout@v4
        with:
          repository: powdrr-io/powdrr-lift
          ref: ${{ inputs.powdrr_ref }}
          path: .powdrr-lift

      - name: Download verifier evidence input
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.input_artifact_name }}
          path: .powdrr-verification-receipt-input

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install pinned Powdrr producer
        run: uv sync --project .powdrr-lift --frozen --no-dev

      - name: Produce exact-commit receipts
        env:
          PYTHONPATH: .powdrr-lift/src:.powdrr-lift/packages/agent/src:.powdrr-lift/packages/contracts/src:.powdrr-lift/packages/local/src:.powdrr-lift/packages/service/src
        run: >-
          uv run --project .powdrr-lift --frozen powdrr-lift
          publish-execution-receipts
          --input .powdrr-verification-receipt-input/receipt-input.json
          --output .powdrr-receipt-output
          --pinned-commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --repo-root .

      - name: Upload receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: powdrr-requirement-execution-receipts
          path: .powdrr-receipt-output/powdrr-requirement-execution-receipts/
          if-no-files-found: error
          retention-days: 90
