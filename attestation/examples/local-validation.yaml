version: 1
freshness:
  max_age_seconds: 86400
environment:
  toolchain: macos-14-arm64
  network: allowed
defaults:
  timeout_seconds: 3600
steps:
  - id: setup
    argv: [make, bootstrap]
  - id: tests
    argv: [make, test]
    timeout_seconds: 7200
  - id: quality
    shell: ./scripts/check-quality.sh
