  type: modified
  span: {start_line: 8, end_line: 8}
  summary: Import iterable support for the shared subject coalescer.
  rationale: Accept subject records from both pages and complete page sequences.
- path: packages/service/src/powdrr_service/planning/structrr.py
  type: modified
  span: {start_line: 105, end_line: 151}
  summary: Merge compatible planned-file subjects by section and stable subject ID.
  rationale: Preserve all units, requirements, and source references when a file recurs on another page.
- path: packages/service/src/powdrr_service/planning/structrr.py
  type: modified
  span: {start_line: 337, end_line: 339}
  summary: Permit an already enumerated ID only for planned file paths that can be coalesced.
  rationale: Keep duplicate rejection for entities and other non-file subjects.
