schema: https://powdrr.io/schema/changelog-v2
change_id: 0
title: Coalesce planned file subjects across pages
intent:
  problem: A planned file referenced on multiple structural-subject pages is rejected as already enumerated, even when separate work units legitimately share that file.
  goal: Look up subjects by section and stable ID, merging compatible planned-file references across pages while retaining all requirement and evidence links.
human-decisions: []
structured_files: []
