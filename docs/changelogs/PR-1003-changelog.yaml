schema: https://powdrr.io/schema/changelog-v2
change_id: 1003
title: Generate per-item workflows from reviewed plans
intent:
  problem: The plan command wrote queue YAML whose items referenced caller-supplied
    workflow folders, but it did not generate those workflows or provide structured
    plan context to them.
  goal: Generate a complete review bundle containing the queue plan, per-item context
    documents, and validated execute-proposed-pr workflows with correct issue-queue
    references.
