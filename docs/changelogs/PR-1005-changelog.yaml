schema: https://powdrr.io/schema/changelog-v2
change_id: 1005
title: Open a review pull request from plan generation
intent:
  problem: The plan command generated and staged a complete artifact bundle but left
    branch creation, commit, push, and PR opening to the caller.
  goal: Make plan generation publish its generated artifacts as a focused pull request
    while preserving unrelated staged changes.
