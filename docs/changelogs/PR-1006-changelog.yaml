    rationale: Keep the saved coding input traceable to the repaired probes.
  - path: tests/test_implement_feature_e2e.py
    type: modified
    span: {start_line: 1028, end_line: 1028}
    summary: Assert the coding prompt includes the repaired observable outcome.
