  - path: tests/test_probe_repair.py
    type: added
    span: {start_line: 1, end_line: 194}
    summary: Cover successful, rejected, malformed-response, and canonicalized-scenario faithfulness outcomes.
    rationale: Protect fail-open behavior, ensure only faithfulness-accepted revisions replace the original probe, and allow safe rechecks after pipeline canonicalization.
