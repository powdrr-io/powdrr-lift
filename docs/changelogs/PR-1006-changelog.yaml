    summary: Provide deterministic repaired probe and faithfulness responses for the end-to-end flow.
    rationale: Exercise the extra pre-coding model boundary without live providers.
  - path: tests/test_implement_feature_e2e.py
    type: modified
    span: {start_line: 641, end_line: 661}
    summary: Add a planning client that deliberately generates one weak probe.
