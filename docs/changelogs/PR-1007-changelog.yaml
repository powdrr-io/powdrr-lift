schema: https://powdrr.io/schema/changelog-v2
change_id: 1007
title: Generate compact template-based plan workflows
intent:
  problem: Plan generation expands the same packaged workflow into many task files
    for every proposed PR, duplicating the workflow definition in each plan review.
  goal: Keep one parameterized workflow definition per plan item and have the issue
    worker instantiate the packaged template when executing it.
