schema: https://powdrr.io/schema/changelog-v2
change_id: 1008
title: Persist workflow task checkpoints on GitHub issues
intent:
  problem: GitHub issue workers recorded claim and final status comments but did not record intermediate completed workflow task state on the issue.
  goal: Append a structured issue comment after each workflow task is durably committed and pushed, linking its output state to the corresponding commit.
human-decisions: []
structured_files: []
