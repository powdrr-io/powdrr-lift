    type: modified
    span: {start_line: 33, end_line: 33}
    summary: Add the stable marker used to recognize checkpoint comments.
    rationale: Let issue history distinguish task checkpoint records from status comments.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 91, end_line: 106}
    summary: Define a typed workflow task checkpoint and callback contract.
    rationale: Carry task output and its persisted commit to the issue-specific checkpoint writer.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 456, end_line: 466}
