schema: https://powdrr.io/schema/changelog-v2
change_id: 1009
title: Keep plan issues aligned with their dependency frontier
intent:
  problem: Plan publication marks every work item ready even when its prerequisites are still open, so GitHub issue state hides the reviewed dependency graph.
  goal: Publish only dependency-free items as ready and promote dependent items after prerequisite issues close.
human-decisions: []
structured_files: []
