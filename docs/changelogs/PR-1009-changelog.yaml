    type: modified
    span: {start_line: 629, end_line: 689}
    summary: Promote dependency-blocked items after all prerequisite issues close.
    rationale: Advance the queue as work is accepted while preventing execution with unmet dependencies.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
