schema: https://powdrr.io/schema/changelog-v2
change_id: 1009
title: Keep plan issues aligned with their dependency frontier
intent:
  problem: Plan publication marks every work item ready even when its prerequisites are still open, so GitHub issue state hides the reviewed dependency graph.
  goal: Publish only dependency-free items as ready and promote dependent items after prerequisite issues close.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 29, end_line: 29}
    summary: Add a distinct queue label for work blocked on plan dependencies.
    rationale: Keep dependency waits distinguishable from execution failures that need human retry.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 384, end_line: 384}
    summary: Assign new issues their initial status from plan dependencies.
    rationale: Keep dependent work out of the ready queue until prerequisites close.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 388, end_line: 388}
    summary: Apply the dependency-derived status label when creating a GitHub issue.
    rationale: Publish a visible ready frontier that reflects the reviewed plan.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 392, end_line: 418}
    summary: Reconcile existing ready and dependency-blocked issues against closed prerequisites.
    rationale: Make issue status reflect the reviewed plan's currently executable frontier.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 474, end_line: 478}
    summary: Refresh dependency-blocked issue statuses before selecting worker tasks.
    rationale: Advance eligible work whenever the worker runs.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 524, end_line: 527}
    summary: Move stale ready issues with unmet prerequisites into dependency-blocked state.
    rationale: Prevent execution with unmet dependencies while migrating older queue issues.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 590, end_line: 650}
    summary: Promote dependency-blocked items after all prerequisite issues close.
    rationale: Advance the queue as work is accepted while preventing execution with unmet dependencies.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 908, end_line: 908}
    summary: Assign a GitHub color to the dependency-blocked label.
    rationale: Ensure the new queue state label is created consistently.
  - path: tests/test_github_issue_queue.py
    type: modified
    span: {start_line: 305, end_line: 307}
    summary: Assert only dependency-free work starts ready.
    rationale: Verify initial publication exposes the plan's dependency frontier.
  - path: tests/test_github_issue_queue.py
    type: modified
    span: {start_line: 359, end_line: 360}
    summary: Assert a dependent issue stays blocked while its prerequisite remains open.
    rationale: Prevent dependent work from appearing ready prematurely.
  - path: tests/test_github_issue_queue.py
    type: modified
    span: {start_line: 387, end_line: 387}
    summary: Add spacing before the migration regression test.
    rationale: Keep the related queue behavior tests grouped clearly.
  - path: tests/test_github_issue_queue.py
    type: modified
    span: {start_line: 391, end_line: 419}
    summary: Cover promotion after closure and migration of old ready issues.
    rationale: Prevent the publisher and worker from exposing or executing dependent work too early.
  - path: docs/plans/github-issue-plan-worker.md
    type: modified
    span: {start_line: 12, end_line: 14}
    summary: Document dependency-blocked issue state.
    rationale: Describe how reviewers and operators can interpret the queue labels.
  - path: docs/plans/github-issue-plan-worker.md
    type: modified
    span: {start_line: 70, end_line: 84}
    summary: Document the initial dependency frontier and worker promotion behavior.
    rationale: Explain how publication and worker runs keep issue labels aligned with plan dependencies.
  - path: docs/plans/github-issue-plan-worker.md
    type: modified
    span: {start_line: 108, end_line: 111}
    summary: Document that dependent work stays blocked until prerequisite issues close.
    rationale: Give operators the correct queue status expectations.
invariants:
  - id: only-satisfied-dependency-frontier-is-ready
    description: Open plan issues with unmet dependencies carry the dependency-blocked label rather than the ready label.
    action: added
  - id: dependency-promotion-waits-for-closure
    description: A dependency-blocked issue becomes ready only after every prerequisite issue is closed.
    action: added
  - id: execution-failure-blocks-remain-manual
    description: Dependency refresh does not change generic blocked issues created by failed execution.
    action: added
guidance:
  - id: close-prerequisite-after-merge
    description: Close a plan issue only after the corresponding implementation PR has merged so dependent work can become ready.
    action: added
