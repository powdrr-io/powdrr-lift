    rationale: Advance eligible work whenever the worker runs.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 524, end_line: 527}
    summary: Move stale ready issues with unmet prerequisites into dependency-blocked state.
    rationale: Prevent execution with unmet dependencies while migrating older queue issues.
