invariants:
  - id: only-satisfied-dependency-frontier-is-ready
    description: Open plan issues with unmet dependencies carry the dependency-blocked label rather than the ready label.
    action: added
  - id: dependency-promotion-waits-for-closure
    description: A dependency-blocked issue becomes ready only after every prerequisite issue is closed.
    action: added
  - id: execution-failure-blocks-remain-manual
    description: Dependency refresh does not change generic blocked issues created by failed execution.
    action: added
guidance:
  - id: close-prerequisite-after-merge
    description: Close a plan issue only after the corresponding implementation PR has merged so dependent work can become ready.
    action: added
