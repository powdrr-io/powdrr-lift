entities:
- id: procedrr-process-catalog
  type: Module
  action: added
- id: procedrr-execution-service
  type: Module
  action: added
- id: procedrr-runtime-regression-tests
  type: Regression test
  action: added
entity_relationships:
- id: catalog-validates-process-inputs
  type: validates
  source: procedrr-process-catalog
  target: procedrr-execution-service
  action: added
  description: The catalog validates process identity and declared input bindings before execution.
- id: runtime-tests-verify-contract
  type: verifies
  source: procedrr-runtime-regression-tests
  target: procedrr-execution-service
  action: added
  description: Tests cover catalog validation, revision-bound events, and terminal outcomes.
invariants:
- id: process-revision-identifies-execution
  description: Execution events carry the validated process identity and definition fingerprint
  action: added
- id: declared-terminal-stops-evaluation
  description: Evaluation halts at a declared terminal node and reports its terminal status
  action: added
guidance:
- id: callers-use-process-catalog
  description: New integrations should load declarations through ProcessCatalog and execute them through
    ProcedrrExecutionService
  action: added
