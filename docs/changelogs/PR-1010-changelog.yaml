schema: https://powdrr.io/schema/changelog-v2
change_id: 1010
title: Add the shared Procedrr runtime foundation
intent:
  problem: The Procedrr evaluator had no shared catalog or caller-facing execution
    contract, and the feature endpoint invoked evaluator control flow directly.
  goal: Add typed process identity, input validation, execution events, and terminal
    outcomes as the foundation for migrating workflow callers.
