schema: https://powdrr.io/schema/changelog-v2
change_id: 1010
title: Migrate workflow runtime to Procedrr
intent:
  problem: Workflow chat and durable tasks still depended on legacy skill definitions
    and parallel step interpreters.
  goal: Route supported workflow behavior through the Procedrr catalog and shared
    evaluator, persist durable task execution state, and remove the checked-in legacy
    definition catalog and validation entry points.
