schema: https://powdrr.io/schema/changelog-v2
change_id: 1014
title: Port reusable workflow templates to Procedrr
intent:
  problem: The reusable proposed-PR and full-review workflows still live in legacy
    task-template files, and callers depend on those definitions.
  goal: Move both workflows into the Procedrr process catalog, run proposed-PR work
    as durable process-backed tasks, and remove the legacy template files.
