schema: https://powdrr.io/schema/changelog-v2
change_id: 1017
title: Run plan tasks from durable worker runtime directories
intent:
  problem: The issue worker loads plan descriptor files as Procedrr task files, so a claimed plan issue fails before its task can execute.
  goal: Instantiate each planned process workflow in the integration worktree and persist its worker state beside the generated tasks.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/cli.py
    type: modified
    span: {start_line: 14, end_line: 14}
    summary: Remove the temporary-directory dependency from issue worker setup.
    rationale: Store the generated runtime workflow in the integration worktree so it persists across task checkpoints.
  - path: src/powdrr_lift/cli.py
    type: modified
    span: {start_line: 204, end_line: 204}
    summary: Remove the unused integration branch helper import.
    rationale: Use the branch returned when creating or reusing the workflow worktree.
  - path: src/powdrr_lift/cli.py
    type: modified
    span: {start_line: 2687, end_line: 2714}
    summary: Instantiate plan tasks in a dedicated runtime directory in the integration worktree.
    rationale: Keep generated Procedrr task files separate from the plan descriptor and available for execution.
  - path: src/powdrr_lift/cli.py
    type: modified
    span: {start_line: 2716, end_line: 2720}
    summary: Save workflow Git state with the runtime directory path and plan dependencies.
    rationale: Allow checkpoint and task discovery code to find the durable workflow state.
  - path: src/powdrr_lift/cli.py
    type: modified
    span: {start_line: 2722, end_line: 2739}
    summary: Run the generated Procedrr task from its runtime directory.
    rationale: Prevent plan descriptor YAML files from being interpreted as task files.
  - path: tests/test_github_issue_plan_generation.py
    type: modified
    span: {start_line: 3, end_line: 3}
    summary: Import argument parsing helpers for the issue worker regression test.
    rationale: Construct the CLI argument namespace required by the worker entry point.
  - path: tests/test_github_issue_plan_generation.py
    type: modified
    span: {start_line: 5, end_line: 5}
    summary: Import a lightweight fake worker report type for the regression test.
    rationale: Return a deterministic worker outcome without invoking GitHub or an agent.
  - path: tests/test_github_issue_plan_generation.py
    type: modified
    span: {start_line: 112, end_line: 114}
    summary: Assert the generated plan workflow path exists before loading it.
    rationale: Make the test's optional workflow path explicit to type checkers.
  - path: tests/test_github_issue_plan_generation.py
    type: modified
    span: {start_line: 136, end_line: 216}
    summary: Verify plan issue execution uses the durable runtime directory and saves workflow state there.
    rationale: Prevent regressions where plan descriptor files are mistaken for Procedrr task definitions.
  - path: src/powdrr_lift/builtin_tool_help.py
    type: modified
    span: {start_line: 61, end_line: 64}
    summary: Document the bounded Git operations exposed by the built-in Git tool.
    rationale: Make the supported HEAD read operation discoverable to workflow agents.
  - path: src/powdrr_lift/execution/builtin_tools.py
    type: modified
    span: {start_line: 69, end_line: 69}
    summary: Allow the intrinsic repository adapter to validate HEAD reads.
    rationale: Permit checkpoint code to request the current commit through the bounded Git interface.
  - path: src/powdrr_lift/intrinsic_git_gh.py
    type: modified
    span: {start_line: 186, end_line: 187}
    summary: Translate the HEAD operation to `git rev-parse HEAD`.
    rationale: Give workflow checkpoints the current commit identifier through an allowlisted operation.
  - path: src/powdrr_lift/intrinsic_git_gh.py
    type: modified
    span: {start_line: 219, end_line: 219}
    summary: Permit the bounded `rev-parse` command in the intrinsic Git executor.
    rationale: Execute the supported HEAD lookup while keeping other Git commands restricted.
  - path: src/powdrr_lift/process/task_step.py
    type: modified
    span: {start_line: 57, end_line: 57}
    summary: Add HEAD reads to the task process read-only Git tool package.
    rationale: Make the operation available to generated workflow tasks.
  - path: src/powdrr_lift/workrr/task_agent.py
    type: modified
    span: {start_line: 2720, end_line: 2721}
    summary: Map checkpoint commit lookups to the structured HEAD operation.
    rationale: Keep task-agent Git access within the intrinsic repository boundary.
  - path: tests/test_intrinsic_git_gh.py
    type: modified
    span: {start_line: 13, end_line: 13}
    summary: Import the internal Git operation translator for regression coverage.
    rationale: Verify task-agent checkpoint commands map to the supported intrinsic operation.
  - path: tests/test_intrinsic_git_gh.py
    type: modified
    span: {start_line: 21, end_line: 25}
    summary: Assert HEAD lookups map to the bounded intrinsic Git command.
    rationale: Prevent checkpoint failures from unsupported `rev-parse HEAD` operations.
  - path: src/powdrr_lift/workrr/git.py
    type: modified
    span: {start_line: 652, end_line: 653}
    summary: Run interrupted task checkpoint recovery before restoring workflow files.
    rationale: Return a task from locked to its last consistent state before retrying a worker.
  - path: src/powdrr_lift/workrr/git.py
    type: modified
    span: {start_line: 655, end_line: 655}
    summary: Record the reset task checkpoint recovery result.
    rationale: Include checkpoint rollback in the workflow recovery report.
  - path: src/powdrr_lift/workrr/git.py
    type: modified
    span: {start_line: 657, end_line: 666}
    summary: Restore generated workflow files after rolling back interrupted task state.
    rationale: Preserve the initial workflow definition while clearing only interrupted progress.
  - path: tests/test_workflow_git.py
    type: modified
    span: {start_line: 334, end_line: 416}
    summary: Verify recovery restores a remotely published locked task to its pending checkpoint.
    rationale: Prevent stale locks from permanently blocking a retried workflow task.
