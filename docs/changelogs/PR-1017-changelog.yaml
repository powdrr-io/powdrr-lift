    span: {start_line: 14, end_line: 14}
    summary: Remove the temporary-directory dependency from issue worker setup.
    rationale: Store the generated runtime workflow in the integration worktree so it persists across task checkpoints.
  - path: src/powdrr_lift/cli.py
    type: modified
    span: {start_line: 204, end_line: 204}
