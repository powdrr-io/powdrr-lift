schema: https://powdrr.io/schema/changelog-v2
change_id: 1021
title: Make planned PR workflows executable
intent:
  problem: Generated plans can group too much work into one PR, and their workers receive no concrete implementation action contract.
  goal: Bound plan items to small reviewed slices and require the worker to map and complete every planned implementation step.
human-decisions: []
structured_files: []
