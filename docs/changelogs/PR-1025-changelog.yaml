entities:
- id: worker-prompt-evaluation-report
  type: Configuration file
  action: added
- id: prompt-score-summary-function
  type: Function
  action: added
- id: prompt-score-contract-tests
  type: Regression test
  action: added
entity_relationships: []
invariants:
- id: prompt-score-is-reproducible-from-findings
  description: The versioned score is calculated only from criterion verdicts and
    declared importance weights, and its parameters are recorded in the report.
  action: added
- id: critical-prompt-findings-fail-the-gate
  description: Any critical criterion not supported fails the prompt gate regardless
    of aggregate score.
  action: added
- id: evaluator-failures-are-distinct-from-prompt-findings
  description: Judge and evidence-protocol failures are recorded as evaluation errors
    and produce an error gate rather than a prompt pass.
  action: added
guidance:
- id: preserve-score-schema-and-dimension-labels
  description: Update scoring weights or dimension definitions only through a versioned
    scoring contract, and keep dimension assignments on rubric criteria.
  action: added
