schema: https://powdrr.io/schema/changelog-v2
change_id: 1025
title: Add scored prompt evaluation reports
intent:
  problem: Prompt evaluations expose weighted coverage and criterion findings but
    do not provide a versioned 0–100 score, dimension breakdown, or distinct evaluation-error
    gate.
  goal: Produce reproducible prompt scores with auditable findings and distinguish
    prompt shortcomings from judge/evidence failures.
human-decisions: []
