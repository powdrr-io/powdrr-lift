schema: https://powdrr.io/schema/changelog-v2
change_id: 1028
title: Generalize prompt evaluation cases
intent:
  problem: Prompt grading only accepts DeepSWE task directories and task-specific rubric files.
  goal: Evaluate captured prompts from any case through the same scoring, provenance, and evidence checks while preserving the DeepSWE command.
