    end_line: 1795
  summary: Add the compare-prompt-benchmark CLI arguments.
  rationale: Accept a prompt report, completed benchmark run, and optional output path.
- path: src/powdrr_lift/cli.py
  type: modified
  span:
    start_line: 5783
    end_line: 5818
  summary: Write comparison reports and print score, gate, pass rate, unresolved, and unmapped counts.
  rationale: Make evaluation outcomes and validation status visible in the command result.
- path: src/powdrr_lift/workrr/prompt_benchmark_comparison.py
  type: added
  span:
    start_line: 1
