schema: https://powdrr.io/schema/changelog-v2
change_id: 1030
title: Compare prompt grades with benchmark validation
intent:
  problem: Prompt reports cannot be connected to completed benchmark validation, leaving prompt findings and implementation outcomes disconnected.
  goal: Emit an auditable comparison linked to an immutable prompt report and final validation artifacts, with explicit mappings and inconclusive states.
human-decisions: []
structured_files: []
files:
- path: docs/evaluations/deepswe-design-evaluation.md
  type: modified
  span:
    start_line: 167
    end_line: 200
  summary: Document the benchmark comparison command, supported report formats, mappings, and result interpretation.
  rationale: Explain how to compare a completed Powdrr run with its prompt evaluation without changing the original score.
- path: src/powdrr_lift/cli.py
  type: modified
  span:
    start_line: 232
    end_line: 235
  summary: Import benchmark comparison support into the CLI.
  rationale: Expose comparison of prompt and validation evidence through the command interface.
- path: src/powdrr_lift/cli.py
  type: modified
  span:
