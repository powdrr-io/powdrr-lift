schema: https://powdrr.io/schema/changelog-v2
change_id: 1038
title: Keep MiniSWE probe prompts within process limits
intent:
  problem: MiniSWE probe authoring passes its task as a command-line argument, and long generated contexts can exceed the operating system argument limit before any probe is authored.
  goal: Compact the behavior context and support file-backed MiniSWE task input so large probe prompts can reach the authoring agent safely.
