  description: Compact probe context preserves scenario identifiers and the given, when, then, subject, and assumption fields while excluding verbose metadata.
  action: added
- id: probe-api-call-in-function
  description: A generated probe contains a public software call somewhere in its test function and an assertion of observable behavior.
  action: added
- id: worker-commit-is-scoped-and-recorded
  description: Worker-created commits are accepted only when they descend from the request base and all committed paths are in scope; accepted commit IDs and committed status are included in the attempt artifact.
  action: added
guidance:
- id: keep-probe-authoring-context-focused
  description: Use the task instruction, implementation acceptance context, concise proposal descriptions, and core behavior scenario fields when authoring independent probes.
  action: added
