schema: https://powdrr.io/schema/changelog-v2
change_id: 1038
title: Keep MiniSWE probe authoring reliable within process limits
intent:
  problem: MiniSWE probe authoring passes its task as a command-line argument, and long generated contexts can exceed the operating system argument limit before any probe is authored. Generated probes can also fail the runner when compound statements are split across body entries or when API calls happen before the final assertion. Correction attempts can be rejected when MiniSWE commits scoped changes because the runner only recognizes uncommitted worktree changes.
  goal: Compact the behavior context, support file-backed MiniSWE task input, align authoring guidance and validation with the rendered probe function, and accept and report scoped worker commits.
human-decisions: []
structured_files: []
