- id: miniswe-probe-authoring
  type: Function
  action: added
- id: typed-probe-suite-validation
  type: Function
  action: added
- id: miniswe-probe-workflow-end-to-end-tests
  type: End-to-end test
  action: added
- id: probe-suite-evaluation-version
  type: Constant
  action: added
entity_relationships:
- id: probe-suite-e2e-tests-verify-miniswe-authoring
  type: verifies
  source: miniswe-probe-workflow-end-to-end-tests
  target: miniswe-probe-authoring
  action: added
  description: End-to-end tests verify MiniSWE authors the suite and the feature workflow
    executes those probes after coding.
- id: suite-validator-checks-typed-obligations
  type: verifies
  source: typed-probe-suite-validation
  target: miniswe-probe-authoring
  action: added
  description: The validator checks obligation categories, rules, exact source quotes,
    scenario links, and probe coverage.
invariants:
- id: miniswe-is-the-only-probe-author
  description: Every coding-agent mode uses MiniSWE to classify obligations and author
    the executable probe module before implementation begins.
  action: added
- id: probe-obligations-are-source-grounded
  description: Supported obligations cite exact instruction or baseline repository-contract
    text; unsupported obligations are marked unresolved, and verifier tests are not
    generation input.
  action: added
- id: baseline-probes-fail-by-assertion
  description: A generated probe suite is frozen only after each probe executes against
    the untouched baseline and fails through an assertion.
  action: added
guidance:
