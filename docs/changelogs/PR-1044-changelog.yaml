schema: https://powdrr.io/schema/changelog-v2
change_id: 1044
title: Use MiniSWE as the sole typed probe author
intent:
  problem: Probe suites were authored through different paths depending on the coding
    agent, and the MiniSWE path did not classify instruction-derived obligations.
  goal: Use MiniSWE to classify typed obligations and author executable probes in
    one baseline-checked module for every coding-agent mode.
human-decisions: []
structured_files: []
