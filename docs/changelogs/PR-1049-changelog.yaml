schema: https://powdrr.io/schema/changelog-v2
change_id: 1049
title: Accept scoped MiniSWE probe commits
intent:
  problem: MiniSWE probe authoring commits its generated suite, but the coding-agent guard rejected every HEAD change and discarded the probes.
  goal: Accept forward commits whose changed files are within the request's allowed paths, preserve their diff evidence, and continue to reject out-of-scope changes and rewritten history.
human-decisions: []
structured_files: []
