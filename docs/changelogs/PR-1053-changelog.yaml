schema: https://powdrr.io/schema/changelog-v2
change_id: 1053
title: Keep empty and failed interaction plans distinct
intent:
  problem: Interaction-planning failures stopped MiniSWE from authoring individual scenario probes, and persisted artifacts did not distinguish an empty plan from a planner failure.
  goal: Preserve interaction-planning outcomes explicitly, continue individual probe authoring after empty or failed planning, and expose failures for final review.
