schema: https://powdrr.io/schema/changelog-v2
change_id: 1056
title: Retain valid partial behavior-probe repairs
intent:
  problem: One omitted or malformed revision caused the legacy JSON repair path to reject the entire response and discard valid revisions.
  goal: Repair flagged scenarios in bounded batches, retain each valid source-faithful revision, and record omitted, malformed, or failed outcomes distinctly for review.
