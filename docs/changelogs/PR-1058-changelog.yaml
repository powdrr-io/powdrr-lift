schema: https://powdrr.io/schema/changelog-v2
change_id: 1058
title: Add deterministic feature matching and JEV planning reviews
intent:
  problem: Feature-context matching and selected planning judgments depended on general LLM responses,
    allowing inconsistent feature selection and unreviewed planning claims.
  goal: Resolve feature context deterministically and use JEV to independently review PR-effect assignments
    and code-quality evidence before planning reconciliation.
