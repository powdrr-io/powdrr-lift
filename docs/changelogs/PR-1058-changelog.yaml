invariants:
- id: feature-context-selection-is-deterministic
  description: A unique best normalized proposal or current-feature match is selected deterministically;
    ties and no-match results ask the user for clarification.
  action: added
- id: jev-reviews-feed-planning-reconciliation
  description: JEV review results inform the planning model, which reconciles unsupported or unclear claims
    before deterministic proposed-plan evaluation.
  action: added
- id: authoritative-effect-identities-remain-unchanged
  description: Effect-allocation review may change ownership assignments but may not edit authoritative
    effect references or source text.
  action: added
guidance:
- id: keep-feature-context-matching-deterministic
  description: Derive canonical feature and workflow paths from deterministic candidate matching; ask
    for clarification only for missing or tied candidates.
  action: added
- id: treat-jev-planning-results-as-independent-evidence
  description: Use JEV dispositions as review evidence for a planning reconciliation step, not as an automatic
    change to requirements or effect ownership.
  action: added
