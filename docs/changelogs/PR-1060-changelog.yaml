schema: https://powdrr.io/schema/changelog-v2
change_id: 1060
title: Enforce inherited Structrr decisions in PR execution
intent:
  problem: Execute-PR tasks could omit a proposed Structrr diff, and inherited decisions in the accepted Structrr
    baseline were not consistently checked before and after coding.
  goal: Require and validate a Structrr diff for each planned PR, review inherited decisions during planning and
    after coding, and feed post-code failures into the existing repair loop.
