invariants:
- id: every-execute-pr-has-a-validated-structrr-proposal
  description: Every generated execute-PR task has a valid proposal diff for its plan item, and missing or mismatched
    proposals prevent execution from proceeding.
  action: added
- id: inherited-decisions-are-reviewed-before-and-after-coding
  description: Each inherited decision in the accepted Structrr baseline is reviewed during planning and against
    the post-code implementation evidence; fail or unknown outcomes block completion or enter repair.
  action: added
- id: structrr-bootstrap-and-applied-diffs-remain-the-decision-source
  description: Inherited decisions are derived from the Structrr bootstrap plus accepted proposal diffs, without
    creating a separate decision ledger.
  action: added
guidance:
- id: repair-with-specific-inherited-decision-evidence
  description: Post-code repair instructions identify the inherited decision at issue and require code or test evidence
    showing how the correction preserves it.
  action: added
