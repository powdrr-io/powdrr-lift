schema: https://powdrr.io/schema/changelog-v2
change_id: 1066
title: Add independent integration tests to execute PR
intent:
  problem: Execute-PR completion relied on the implementation agent's verification and repository tests, which can miss failures in requested public behavior.
  goal: Have a separate MiniSWE step write tests before implementation, prove they fail behaviorally on the untouched baseline, freeze and run them during coding, and repair failures before completion.
human-decisions: []
structured_files: []
