- id: execute-pr-plan-defect-recovery
  type: Workflow
  action: added
- id: execute-pr-plan-amendment-agent
  type: Function
  action: added
- id: execute-pr-plan-amendment-tests
  type: Regression test
  action: added
entity_relationships:
- id: plan-defect-classification-routes-to-amendment
  type: triggers
  source: execute-pr-plan-defect-recovery
  target: execute-pr-plan-amendment-agent
  action: added
  description: A failure classified as a plan defect with concrete evidence invokes
    the constrained amendment agent and opens a separate PR.
- id: amendment-tests-exercise-recovery
  type: exercises
  source: execute-pr-plan-amendment-tests
  target: execute-pr-plan-defect-recovery
  action: added
  description: Workflow tests verify that supported plan defects reach PR creation
    and other failure classes do not.
invariants:
- id: plan-amendment-requires-concrete-plan-defect-evidence
  description: Failed implementation alone is insufficient to amend a plan; the workflow
    requires a plan-defect classification supported by concrete evidence.
  action: added
- id: plan-amendment-isolated-from-product-implementation
  description: A plan amendment may change only the execution plan, its Structrr proposal,
    and the affected generated workflow; unrelated plan items and dependency edges
    are preserved.
  action: added
guidance:
- id: review-plan-amendment-separately
  description: Publish plan corrections as a separate PR so the plan defect and its
    correction are reviewed before a subsequent worker executes the corrected item.
  action: added
