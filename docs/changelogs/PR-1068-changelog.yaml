schema: https://powdrr.io/schema/changelog-v2
change_id: 1068
title: Open plan amendment PRs for proven plan defects
intent:
  problem: Execute-PR failures stop without a durable correction path even when execution
    evidence proves the reviewed plan item is defective.
  goal: Classify failed execution with evidence and create a separate PR that amends
    the affected generated plan artifacts when the plan is at fault.
human-decisions: []
structured_files: []
files:
- path: docs/procedrr/processes/amend-plan-and-open-pr.yaml
  type: added
  span:
    start_line: 1
    end_line: 75
  summary: Amend plan artifacts and publish a dedicated correction PR
  rationale: Make plan defects reviewable and durable without mixing plan edits into
    the failed implementation PR.
- path: docs/procedrr/processes/execute-proposed-pr-workflow.yaml
  type: modified
  span:
    start_line: 3
    end_line: 3
  summary: Route failed execution through evidence-based failure classification
  rationale: Open a plan amendment PR only for a supported plan defect while keeping
    implementation defects and unclear results blocked.
