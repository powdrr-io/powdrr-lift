    type: modified
    span:
      start_line: 21
      end_line: 175
    summary: Validate coverage plans, test links, review verdicts, and pytest case-count evidence
    rationale: Enforce a structured contract that connects each acceptance criterion and behavior partition to executable tests and measurable runtime evidence.
  - path: src/powdrr_lift/workrr/task_agent.py
    type: modified
