invariants:
  - id: every-acceptance-criterion-has-planned-tests
    description: The coverage contract represents every acceptance criterion and maps each partition to one or more real pytest functions.
    action: added
  - id: candidate-executes-planned-case-volume
    description: Execute-PR succeeds only when pytest reports at least the total minimum case count declared in the coverage plan.
    action: added
guidance:
  - id: review-real-behavior-not-mock-activity
    description: Review test bodies for observable public behavior, realistic application wiring, useful boundary/error partitions, and broad generated cases where the domain warrants them.
    action: added
