invariants:
  - id: failed-execute-pr-results-have-explicit-status
    description: Every nested execute-PR result consumed by the parent workflow contains a boolean passed field.
    action: added
  - id: coverage-plan-repair-is-bounded
    description: An invalid generated test coverage plan receives at most one repair call before the attempt fails.
    action: added
guidance:
  - id: classify-only-with-evidence
    description: A normalized execution error is not itself proof of a plan defect; the parent workflow requires concrete evidence before opening a plan amendment PR.
    action: added
