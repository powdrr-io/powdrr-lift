schema: https://powdrr.io/schema/changelog-v2
change_id: 1071
title: Route execute PR errors into plan review
intent:
  problem: A retryable execute-PR error can omit the passed field and stop the parent workflow before it classifies the failure.
  goal: Repair one invalid coverage-plan response and route failed execute-PR results through the existing evidence-based recovery decision.
human-decisions: []
structured_files: []
files:
  - path: docs/procedrr/processes/execute-proposed-pr-workflow.yaml
    type: modified
    span: {start_line: 30, end_line: 70}
    summary: Send failed or unshaped attempts to evidence-based classification
    rationale: Allow the workflow to choose a plan amendment only when evidence supports that classification.
  - path: docs/procedrr/processes/execute-proposed-pr-workflow.yaml
    type: modified
    span: {start_line: 31, end_line: 70}
    summary: Route failed attempts to classification and plan amendment
    rationale: Keep plan correction separate from implementation failure handling.
  - path: docs/procedrr/processes/execute-proposed-pr.yaml
    type: modified
    span: {start_line: 8, end_line: 8}
    summary: Allow failed coding attempts to omit success-only fields
    rationale: Preserve an output for failures that happen before implementation checks run.
  - path: docs/procedrr/processes/execute-proposed-pr.yaml
    type: modified
    span: {start_line: 11, end_line: 12}
    summary: Declare error details on coding attempts
    rationale: Keep retryable execution errors available to the parent process.
  - path: docs/procedrr/processes/execute-proposed-pr.yaml
    type: modified
    span: {start_line: 24, end_line: 25}
    summary: Make integration-test evidence optional on early failure
