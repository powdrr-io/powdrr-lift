schema: https://powdrr.io/schema/changelog-v2
change_id: 1081
title: Requeue plan items after amendment merges
intent:
  problem: A plan-amendment PR can merge while its work issue remains awaiting review and pinned to the defective plan revision.
  goal: Detect merged plan-amendment PRs, repin the affected issue to the amended plan commit, and return it to the queue according to its dependencies.
