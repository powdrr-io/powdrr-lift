change_id: 1083
title: Pin integration test author to its isolated worktree
intent:
  problem: The pre-coding test author can write generated tests into the caller's checkout instead of the temporary baseline worktree.
  goal: Tell the test author the exact worktree path and require it to verify that path before inspecting or editing files.
