    type: verifies
    source: generated-acceptance-test-scope-regression-test
    target: issue-worker-structrr-candidate-comparison
    action: added
    description: The worker regression test verifies exact generated test paths are included in the candidate Structrr comparison.
invariants:
  - id: generated-acceptance-tests-remain-visible-in-structrr
    description: Frozen acceptance tests included in an implementation PR remain visible in the Structrr candidate diff and are classified as validation changes.
    action: added
