entities:
- id: github-issue-worker-attempt-branch
  type: Branch
  action: added
  summary: Each issue worker attempt now uses a distinct branch based on the current
    main commit.
  rationale: Isolate retries from stale candidate changes while keeping each final
    PR based on main.
entity_relationships: []
invariants:
- id: issue-worker-attempt-starts-at-main
  action: added
  description: Every newly started GitHub issue worker attempt creates its branch
    and worktree from the latest fetched base branch and does not reuse another attempt's
    candidate tree.
  rationale: Ensure the Structrr baseline and candidate bootstrap compare the same
    main-based repository state against the attempt's changes.
