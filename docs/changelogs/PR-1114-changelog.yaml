schema: https://powdrr.io/schema/changelog-v2
change_id: 1114
title: Start issue worker attempts from fresh main branches
intent:
  problem: Issue worker retries reused a persistent integration branch that could
    contain files and workflow state from older attempts.
  goal: Give each issue worker attempt a new branch and worktree based on the current
    main commit while retaining dependency checks and recovery support.
