    type: verifies
    source: planning-checkpoint-resume-regression-tests
    target: github-issue-comment-rate-limit-retry
    action: added
    description: The tests verify rate-limited checkpoint comments back off and retry while unrelated 403 responses fail immediately.
  - id: checkpoint-tests-verify-source-pagination
    type: verifies
    source: planning-checkpoint-resume-regression-tests
    target: source-block-pagination-cursor-contract
    action: added
    description: The tests verify adjacent source-block anchors are not accepted or suggested as pagination cursors.
invariants:
  - id: accepted-planning-answers-remain-durable
    description: Each accepted planning answer is durably checkpointed, and a resumed session does not reissue accepted questions.
    action: altered
  - id: unanswered-planning-questions-are-recomputable
    description: An unanswered question has no accepted checkpoint and is recomputed from the latest accepted journal state after interruption.
    action: added
  - id: pagination-cursors-belong-to-the-current-source-block
    description: A next_anchor cursor must be a later anchor from the current block; adjacent-block anchors remain eligible only as citations.
    action: altered
  - id: github-rate-limit-retries-are-bounded
    description: Issue comment writes retry only HTTP 429 and rate-limit 403 responses, honoring server retry timing and using bounded exponential backoff otherwise.
    action: added
guidance: []
