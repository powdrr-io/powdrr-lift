schema: https://powdrr.io/schema/changelog-v2
change_id: 1162
title: Keep resumed planning schemas compatible and question inputs bounded
intent:
  problem: DeepInfra rejects uniqueItems in structured-output schemas, and coverage questions can repeat already-validated source excerpts until their input exceeds the planner's size limit.
  goal: Adapt DeepInfra's wire schema without weakening local validation, and assess coverage from the source-validated requirement statement plus pinned evidence instead of repeating source text.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/workrr/providers.py
    type: modified
    span: {start_line: 361, end_line: 361}
    summary: Accept provider-specific unsupported schema keywords in the OpenAI-compatible client.
    rationale: Keep constrained JSON output available for DeepInfra without weakening the planner's local answer validation.
  - path: src/powdrr_lift/workrr/providers.py
    type: modified
    span: {start_line: 378, end_line: 378}
    summary: Store the unsupported schema keyword set for each client instance.
    rationale: Use provider-specific schema compatibility when building structured-output requests.
  - path: src/powdrr_lift/workrr/providers.py
    type: modified
    span: {start_line: 414, end_line: 416}
    summary: Remove provider-unsupported schema keywords recursively when building the API request.
    rationale: Send DeepInfra a compatible schema while leaving caller-owned schemas unchanged.
  - path: src/powdrr_lift/workrr/providers.py
    type: modified
    span: {start_line: 921, end_line: 939}
    summary: Copy schemas recursively while omitting only provider-declared unsupported keywords.
    rationale: Preserve the full caller schema for local validation and avoid mutating shared schema constants.
  - path: src/powdrr_lift/workrr/providers.py
    type: modified
    span: {start_line: 1112, end_line: 1116}
    summary: Declare uniqueItems unsupported for DeepInfra clients.
    rationale: Avoid DeepInfra's grammar error for array uniqueness constraints in planning response schemas.
  - path: tests/test_provider_schema_compatibility.py
    type: added
    span: {start_line: 1, end_line: 100}
    summary: Verify DeepInfra schema compatibility configuration, recursive keyword removal, and the transmitted request schema.
    rationale: Prevent the provider grammar error from recurring and ensure the original schema remains intact for local validation.
  - path: tests/test_workflow_task_agent.py
    type: modified
    span: {start_line: 3912, end_line: 3912}
    summary: Accept the DeepInfra schema compatibility argument in the provider test double.
    rationale: Keep the workflow-task provider test compatible with the client factory contract.
  - path: tests/test_workflow_task_agent.py
    type: modified
    span: {start_line: 3922, end_line: 3924}
    summary: Record the unsupported schema keyword passed by the DeepInfra client factory.
    rationale: Verify that provider construction wires the grammar capability through to the client.
  - path: tests/test_workflow_task_agent.py
    type: modified
    span: {start_line: 3951, end_line: 3951}
    summary: Verify the DeepInfra client builder passes its schema compatibility capability.
    rationale: Keep workflow-task provider construction aligned with the OpenAI-compatible client contract.
  - path: src/powdrr_lift/workrr/planning/evidence.py
    type: modified
    span: {start_line: 29, end_line: 29}
    summary: Remove the source-excerpt request dependency from coverage question construction.
    rationale: Coverage uses the already accepted requirement statement and repository evidence.
  - path: src/powdrr_lift/workrr/planning/evidence.py
    type: modified
    span: {start_line: 370, end_line: 372}
    summary: Validate requirement anchor references without serializing their source text again.
    rationale: Keep anchor integrity checks while avoiding repeated large source excerpts.
  - path: src/powdrr_lift/workrr/planning/evidence.py
    type: modified
    span: {start_line: 466, end_line: 466}
    summary: Limit coverage context references to supplied evidence and the requirement.
    rationale: Avoid carrying unused source anchor IDs into the model question.
  - path: src/powdrr_lift/workrr/planning/evidence.py
    type: modified
    span: {start_line: 471, end_line: 473}
    summary: State that the fidelity-checked requirement is the coverage assessment unit.
    rationale: Preserve the proper assessment boundary without repeating source text.
  - path: src/powdrr_lift/workrr/planning/evidence.py
    type: modified
    span: {start_line: 483, end_line: 486}
    summary: Build coverage questions from the fidelity-checked requirement and supplied pinned evidence without repeating source excerpts.
    rationale: Avoid oversized prompts while retaining the validated obligation and evidence needed to judge existing implementation.
  - path: src/powdrr_lift/workrr/planning/questions.py
    type: modified
    span: {start_line: 32, end_line: 39}
    summary: Include the deterministic question ID and kind in oversized-input errors.
    rationale: Identify which bounded planning question needs subdivision when its context still exceeds the limit.
  - path: src/powdrr_lift/workrr/planning/questions.py
    type: modified
    span: {start_line: 42, end_line: 43}
    summary: Store code-generated question identity on oversized-input errors.
    rationale: Track the failing planning question without asking the model to mint identifiers.
  - path: src/powdrr_lift/workrr/planning/questions.py
    type: modified
    span: {start_line: 45, end_line: 49}
    summary: Format the code-generated question identity in oversized-input errors.
    rationale: Make the failing bounded question identifiable in diagnostics.
  - path: src/powdrr_lift/workrr/planning/questions.py
    type: modified
    span: {start_line: 51, end_line: 51}
    summary: Include question identity in the oversized-input error message.
