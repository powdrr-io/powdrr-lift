schema: https://powdrr.io/schema/changelog-v2
change_id: 1163
title: Search pinned repository evidence during plan coverage
intent:
  problem: Coverage questions can omit repository evidence entirely, leaving the model to classify requirements
    without inspecting the current implementation.
  goal: Search bounded code and test candidates at the pinned commit, present those results with the accepted
    requirement, and let missing requirements continue into implementation planning while keeping stable
    identifiers code-generated.
