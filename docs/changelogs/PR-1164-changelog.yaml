schema: https://powdrr.io/schema/changelog-v2
change_id: 1164
title: Search pinned repository evidence during plan coverage
intent:
  problem: Coverage questions can receive no repository evidence, leaving the model to classify requirements without inspecting current code.
  goal: Search bounded code and test candidates at the pinned commit, present them with the accepted requirement, and let missing requirements continue into implementation planning while keeping stable identifiers code-generated.
human-decisions: []
structured_files: []
