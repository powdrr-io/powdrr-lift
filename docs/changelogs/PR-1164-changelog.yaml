schema: https://powdrr.io/schema/changelog-v2
change_id: 1164
title: Search pinned repository evidence during plan coverage
intent:
  problem: Coverage questions in the Procedrr planner can lack repository evidence, so the model may classify
    requirements without inspecting current code.
  goal: Batch basedpyright symbol searches for Python and local rg searches for other relevant code, attach
    bounded pinned evidence to coverage questions, and let missing requirements proceed into implementation
    planning with code-generated IDs.
