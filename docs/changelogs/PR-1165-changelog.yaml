schema: https://powdrr.io/schema/changelog-v2
change_id: 1165
title: Keep planning bootstrap artifacts outside the checkout
intent:
  problem: Planning writes its Structrr bootstrap files into the pinned repository before repository evidence search, making the checkout appear dirty.
  goal: Keep the Structrr baseline available to planning while ensuring generated bootstrap artifacts cannot invalidate pinned basedpyright and rg searches.
