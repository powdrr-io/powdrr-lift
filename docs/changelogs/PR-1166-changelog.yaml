invariants:
- id: planning-question-frontiers-share-one-accepted-snapshot
  description: Every question in a frontier is derived from the same accepted-answer
    snapshot and retains its input digest when resumed.
  action: added
- id: planning-checkpoint-appends-remain-serialized
  description: Concurrent provider calls never append hash-linked planning checkpoints
    concurrently; accepted results are committed by one coordinator in frontier order.
  action: added
- id: planning-pagination-and-structrr-projection-order
  description: Pagination within a question stream and Structrr projected baselines
    across plan items remain sequential.
  action: altered
