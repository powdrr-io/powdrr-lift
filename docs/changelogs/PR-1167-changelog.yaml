schema: https://powdrr.io/schema/changelog-v2
change_id: 1167
title: Include repository search in coverage question context
intent:
  problem: Coverage questions referenced repository-search data that was not included among their supplied context records, causing request validation to fail during plan resume.
  goal: Include repository-search data in the model context while keeping the validated requirement as the accepted fact.
