schema: https://powdrr.io/schema/changelog-v2
change_id: 1171
title: Keep planning checkpoints outside the pinned checkout
intent:
  problem: Importing legacy planning checkpoints into .powdrr made the pinned repository checkout unclean, so repository evidence lookup stopped before parallel planning could continue.
  goal: Store local planning journals under Git metadata so journal persistence does not modify the pinned checkout.
