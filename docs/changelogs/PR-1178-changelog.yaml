schema: https://powdrr.io/schema/changelog-v2
change_id: 1178
title: Bound planning replay and work-unit proposals
intent:
  problem: Plan resume reread pinned evidence files repeatedly, work-unit proposal pages could exceed the durable 4,000-character answer limit, and generated work-unit proposals could fail on placeholder paths or replay with a different batch shape.
  goal: Cache immutable source reads, bound proposal pages, and make generated proposal paths and checkpoint replay validate consistently.
human-decisions: []
structured_files: []
