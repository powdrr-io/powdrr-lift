schema: https://powdrr.io/schema/changelog-v2
change_id: 1179
title: Move planning algorithms into the service package
intent:
  problem: Planning and re-planning policy still lives under the legacy powdrr_lift
    package even though service contracts, questions, and source semantics have already
    moved.
  goal: Give core planning policy modules a service-owned package location, preserve
    legacy imports as tested re-exports, and retain the current planning and resume
    behavior.
human-decisions: []
