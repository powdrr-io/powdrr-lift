schema: https://powdrr.io/schema/changelog-v2
change_id: 1180
title: Reduce planning model call count
intent:
  problem: Planning asks independent questions individually and confirms dependencies through pairwise
    prompts, increasing model calls and serial latency.
  goal: Batch compatible planning questions, review candidate dependencies as a graph, and process independent
    Structrr items in parallel while preserving per-question validation and checkpoints.
