schema: https://powdrr.io/schema/changelog-v2
change_id: 1180
title: Move planning coverage policy into service
intent:
  problem: Requirement coverage judgments and their generated question contract still lived in the agent-side
    planning evidence module, leaving private planning policy coupled to local repository access.
  goal: Move coverage policy, validation, residual creation, and question construction into the service
    package while the agent supplies verified excerpts from the pinned repository.
human-decisions: []
structured_files: []
