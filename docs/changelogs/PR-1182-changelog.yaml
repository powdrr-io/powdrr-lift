schema: https://powdrr.io/schema/changelog-v2
change_id: 1182
title: Make large plan generation scale and recover
intent:
  problem: CP-SAT plan partition searches can consume hours of CPU on large plans, and an item description with four one-unit scope entries repeatedly fails the three-entry contract.
  goal: Preserve plan-sizing constraints with deterministic dynamic programming and combine valid adjacent scope entries when a model answer exceeds the contract's scope-entry limit.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 10, end_line: 11}
    summary: Remove the CP-SAT dependency from plan sizing.
    rationale: Use exact dynamic programming for this bounded contiguous-partition problem.
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 110, end_line: 112}
    summary: Start constructing valid work-unit segments with accumulated constraints.
    rationale: Limit candidate groups by size, criteria count, component count, runtime, and standalone status.
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 114, end_line: 117}
    summary: Track component, runtime, criteria, and standalone facts incrementally.
    rationale: Avoid rebuilding every candidate segment from its full item slice.
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 119, end_line: 155}
    summary: Build valid segments and minimize work-unit group count and cohesion with dynamic programming.
    rationale: Preserve the former objective while ensuring predictable optimization cost.
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 157, end_line: 168}
    summary: Reconstruct the selected work-unit groups from predecessor states.
    rationale: Return the globally minimum partition in original plan order.
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 171, end_line: 171}
    summary: Return the objective value computed by dynamic programming.
    rationale: Keep the allocation result's score available to callers.
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 181, end_line: 181}
    summary: Document dynamic programming as the plan-item sizing method.
    rationale: Describe the deterministic optimizer used by this function.
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 211, end_line: 211}
    summary: Store valid plan-item group edges by their starting position.
    rationale: Represent compatible adjacent merges for the shortest-path calculation.
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 222, end_line: 222}
    summary: Record each compatible item group and its target-size cost.
    rationale: Make each valid merge an edge in the sizing graph.
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 224, end_line: 240}
    summary: Find the minimum-cost contiguous partition and retain predecessor positions.
    rationale: Select compatible groups without invoking an unbounded generic solver.
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 240, end_line: 240}
    summary: Reject input when no complete valid partition exists.
    rationale: Preserve an explicit error for impossible plan-item sizing.
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 242, end_line: 242}
    summary: Raise the deterministic no-partition error.
    rationale: Keep failure reporting specific when group constraints prevent coverage.
  - path: src/powdrr_lift/workrr/plan_sizing.py
    type: modified
    span: {start_line: 244, end_line: 252}
    summary: Reconstruct the minimum-cost plan-item groups from predecessor positions.
    rationale: Preserve each input item exactly once and in order.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 279, end_line: 279}
    summary: Rename the target-size test to describe sizing behavior without naming the removed solver.
    rationale: Keep the test name aligned with the implementation's contract.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 289, end_line: 289}
    summary: Rename the mixed-runtime sizing test.
    rationale: Keep test naming independent of the optimization library.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 301, end_line: 301}
    summary: Rename the explicit runtime sizing test.
    rationale: Keep test naming focused on deterministic sizing behavior.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 312, end_line: 325}
    summary: Cover a 1,000-work-unit allocation.
    rationale: Verify deterministic sizing preserves ordered coverage and the maximum group size at planning scale.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 1167, end_line: 1170}
    summary: Normalize excess scope entries before validating the item description.
    rationale: Recover valid work-unit coverage when the model returns one scope record per unit.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 1197, end_line: 1241}
    summary: Merge the shortest adjacent scope records while retaining their descriptions and unit IDs.
    rationale: Reduce scope to the contract limit deterministically without dropping or reordering assigned work.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 1278, end_line: 1282}
    summary: Explain how to describe four supplied units with at most three scope records.
    rationale: Give the model an explicit instruction that matches the parser contract.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 359, end_line: 386}
    summary: Verify four valid scope records normalize to three without losing unit assignments.
    rationale: Prevent a repeated description-shape error from blocking planning.
