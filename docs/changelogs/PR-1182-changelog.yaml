schema: https://powdrr.io/schema/changelog-v2
change_id: 1182
title: Move local planning persistence behind adapters
intent:
  problem: Planning checkpoint records and reducers were mixed with Git metadata writes, file locking,
    diagnostic files, and other local filesystem effects in the service package.
  goal: Keep checkpoint formats and reduction in service code while moving local journal and diagnostic
    persistence to the local adapter package without changing stored formats.
