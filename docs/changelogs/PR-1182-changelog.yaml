schema: https://powdrr.io/schema/changelog-v2
change_id: 1182
title: Make large plan generation scale and recover
intent:
  problem: CP-SAT plan partition searches can consume hours of CPU on large plans, an item description with four one-unit scope entries repeatedly fails the three-entry contract, and dependency discovery can schedule a producer/consumer question for every pair of work units.
  goal: Preserve plan-sizing constraints with deterministic dynamic programming, recover valid item descriptions that exceed the scope-entry limit, and bound dependency review to deterministic shared-file ordering plus evidence-based individual questions.
human-decisions: []
structured_files: []
