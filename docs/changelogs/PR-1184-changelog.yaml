schema: https://powdrr.io/schema/changelog-v2
change_id: 1184
title: Move GitHub checkpoint persistence behind local adapters
intent:
  problem: The service checkpoint module included GitHub issue-comment reads and writes alongside checkpoint
    serialization and append validation.
  goal: Keep checkpoint formats, reduction, and append policy in service code while moving GitHub comment
    persistence into powdrr_local.
