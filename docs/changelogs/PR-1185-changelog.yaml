schema: https://powdrr.io/schema/changelog-v2
change_id: 1185
title: Move plan repair publication effects to the local adapter
intent:
  problem: The service repair module performed local Git mutations, pushed branches, and opened GitHub pull requests.
  goal: Keep repair validation and pull request content preparation in service code while moving repository and GitHub effects into the local adapter.
human-decisions: []
structured_files: []
files:
- path: packages/local/src/powdrr_local/planning/repair_publication.py
  type: added
  span:
    start_line: 1
    end_line: 143
  summary: Add a local adapter that validates prepared repair paths, creates a branch from fresh main, commits only changed artifacts, and opens the pull request.
  rationale: Keep user repository and GitHub mutations on the agent side of the service boundary.
- path: packages/service/src/powdrr_service/planning/repair_service.py
  type: modified
  span:
