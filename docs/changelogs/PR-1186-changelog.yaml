schema: https://powdrr.io/schema/changelog-v2
change_id: 1186
title: Move planning tracker GitHub access into the local adapter
intent:
  problem: The planning service imported GitHub client and issue types to create and load planning session trackers.
  goal: Keep session validation and metadata policy in service code while routing tracker issue calls through a local adapter.
human-decisions: []
structured_files: []
files:
