  type: added
  span:
    start_line: 1
    end_line: 32
  summary: Add a local planning issue store that delegates label and issue calls to the existing GitHub client.
  rationale: Keep external GitHub operations in the agent-owned local adapter package.
- path: packages/service/src/powdrr_service/planning/service.py
  type: modified
  span:
    start_line: 22
    end_line: 26
  summary: Remove the legacy GitHub client, error, and issue imports from the planning service.
  rationale: Keep the service dependent on an adapter interface rather than the GitHub implementation.
