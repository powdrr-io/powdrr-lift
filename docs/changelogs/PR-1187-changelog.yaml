schema: https://powdrr.io/schema/changelog-v2
change_id: 1187
title: Route plan repair through the service operation API
intent:
  problem: The plan-repair CLI performed plan mutation and artifact compilation directly in the agent process.
  goal: Send a pinned plan artifact snapshot and repair request through the public replan operation, leaving the agent to publish the prepared result.
