title: Move planning question ordering into the service package
intent:
  problem: The deterministic source-ledger question machine and planning assembly still lived under the agent's legacy workrr package.
  goal: Make the planning question machine service-owned, keep evidence excerpt reads local, and retain a compatibility adapter for old imports.
