schema: https://powdrr.io/schema/changelog-v2
change_id: 1189
title: Audit and prune redundant test cases
intent:
  problem: The test suite has grown, but its collection count alone does not reveal
    which cases duplicate behavior or assert tautologies.
  goal: Remove verified redundant cases, correct a tautological fingerprint assertion,
    and document an evidence-based test reduction plan.
human-decisions: []
structured_files: []
files:
- path: docs/plans/test-suite-rationalization-audit.md
  type: added
  span:
    start_line: 1
    end_line: 55
  summary: Record test-count, test-body, and test-context coverage findings with a staged reduction plan.
  rationale: Distinguish genuine redundancy from cases that only share code coverage.
- path: tests/test_procedrr_evaluator.py
  type: modified
  span:
    start_line: 360
    end_line: 376
  summary: Remove seven cases whose error branch ignored the other matrix inputs.
  rationale: Retain one error case plus all combinations that exercise implementation, publication, and plan-defect behavior.
- path: tests/test_tool_capability.py
  type: modified
  span:
    start_line: 48
    end_line: 48
  summary: Rename the manifest fingerprint test to describe its cross-instance guarantee.
  rationale: Make the test intent explicit.
- path: tests/test_tool_capability.py
  type: modified
  span:
    start_line: 50
    end_line: 55
  summary: Compare fingerprints from independently constructed equivalent manifests.
  rationale: Replace a same-object tautology with a meaningful determinism check.
entities: []
entity_relationships: []
invariants:
- id: test-removals-require-behavior-evidence
  description: Remove test cases only when retained coverage exercises the same input class and observable outcome.
  action: added
guidance:
- id: test-reduction-target
  description: Continue the full-source coverage and assertion audit before targeting the requested 400-case reduction.
  action: added
