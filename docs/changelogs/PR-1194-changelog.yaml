schema: https://powdrr.io/schema/changelog-v2
change_id: 1194
title: Move reviewed plan records into service package
intent:
  problem: Service planning policy imported its core reviewed-plan data records from the legacy GitHub issue queue module.
  goal: Make reviewed plan records service-owned while preserving the legacy import names for existing callers.
human-decisions: []
structured_files: []
