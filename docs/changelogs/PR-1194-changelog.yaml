    type: modified
    span: {start_line: 73, end_line: 82}
    summary: Remove allowlist entries for service imports of legacy plan record types.
    rationale: Planning modules now import the service-owned model definitions.
  - path: docs/architecture/agent-service-module-ownership.json
    type: modified
    span: {start_line: 486, end_line: 486}
    summary: Remove the plan queue import from service repair policy ownership metadata.
    rationale: Service repair now imports its records from the service package.
  - path: docs/architecture/agent-service-module-ownership.json
    type: modified
    span: {start_line: 530, end_line: 530}
