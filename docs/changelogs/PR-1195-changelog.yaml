schema: https://powdrr.io/schema/changelog-v2
change_id: 1195
title: Reask stale planning inputs and preserve manual setup requirements
intent:
  problem: Resumed planning could treat answers from obsolete question context as current, reject valid file references returned by the model, and fail when a plan included explicit human setup requirements.
  goal: Replay checkpoint state consistently, reask invalidated questions, constrain structural subject references to supplied identifiers, and compile human setup requirements into their owning plan item.
human-decisions: []
