change_id: 1197
title: Remove dead helpers and duplicate test executions
intent:
  problem: The suite repeated a checked-in workflow scenario, contained an uncollected
    live test body, and retained private helpers with no call sites.
  goal: Remove proven duplicate or unreachable code and document the evidence and
    remaining audit candidates.
