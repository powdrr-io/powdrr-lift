    rationale: Keep prompt assembly aware of schemas supplied through the model call.
  - path: packages/service/src/powdrr_service/planning/questions.py
    type: modified
    span: {start_line: 399, end_line: 403}
    summary: Build answer fields without repeating the provider-supplied schema in correction prompts.
    rationale: Reduce correction input size while retaining the schema through structured response mode.
  - path: packages/service/src/powdrr_service/planning/questions.py
