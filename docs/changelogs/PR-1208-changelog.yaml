schema: https://powdrr.io/schema/changelog-v2
change_id: 1208
title: Keep provider schemas out of correction prompt duplicates
intent:
  problem: A semantic correction could exceed the planning input limit because the full JSON schema was included both in the prompt and as the provider response schema, alongside the prior answer.
  goal: Omit the duplicate prompt copy of the schema during corrections when the provider already receives it, preserving the schema contract while keeping correction context within bounds.
