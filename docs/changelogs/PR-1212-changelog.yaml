schema: https://powdrr.io/schema/changelog-v2
change_id: 1212
title: Move workflow slug policy into service
intent:
  problem: Stable workflow identifiers were normalized in the agent's Git module even though planning
    creates and repairs those identifiers as service-owned behavior.
  goal: Give the service ownership of workflow slug normalization and have agent and planning callers
    import that policy directly.
