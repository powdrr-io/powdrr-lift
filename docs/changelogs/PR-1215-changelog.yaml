schema: https://powdrr.io/schema/changelog-v2
change_id: 1215
title: Remove planning compatibility re-exports
intent:
  problem: Agent modules and tests still depended on service-owned planning through legacy powdrr_lift
    re-export modules, leaving duplicate public paths after the service extraction.
  goal: Import planning policy directly from powdrr_service, delete the obsolete re-export modules, and
    keep the ownership inventory aligned with the resulting package boundary.
human-decisions: []
structured_files: []
