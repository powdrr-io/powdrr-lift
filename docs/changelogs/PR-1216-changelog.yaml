schema: https://powdrr.io/schema/changelog-v2
change_id: 1216
title: Remove legacy planning source adapters
intent:
  problem: Agent-side planning modules still re-export service source, driver, and checkpoint APIs, while
    a pinned repository read adapter lives in the legacy package.
  goal: Put pinned-source composition in the local package, import service policy directly, and remove
    the remaining planning facades.
