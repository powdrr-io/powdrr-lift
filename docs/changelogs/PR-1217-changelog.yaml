  "change_id": 1217,
  "title": "Add versioned workspace contracts and migration",
  "intent": {
    "problem": "The next browser workspace packages need strict durable records and revision-safe updates while retaining compatibility with existing databases.",
    "goal": "Add typed versioned workspace contracts and migrate schema v1 conversations to revision-aware schema v2 without changing existing records or event cursors."
  },
