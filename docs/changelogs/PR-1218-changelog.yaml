{
  "schema": "https://powdrr.io/schema/changelog-v2",
  "change_id": 1218,
  "title": "Make workspace mutations request-idempotent",
  "intent": {
    "problem": "Clients can lose a response after a mutation commits and retry, which can create duplicate chats/jobs or advance a job more than once.",
    "goal": "Persist request payload digests and original typed results atomically with workspace mutations so identical retries replay safely and conflicting reuse is rejected."
  },
  "human-decisions": [],
  "structured_files": [],
