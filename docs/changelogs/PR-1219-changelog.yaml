change_id: 1219
title: Move Structrr snapshot digest into service
intent:
  problem: Canonical Structrr snapshot normalization and fingerprinting still lived in the legacy agent package
    and was imported by service planning.
  goal: Make snapshot digest policy service-owned, migrate callers directly, and remove the legacy export and allowlist
    exception.
