  "schema": "https://powdrr.io/schema/changelog-v2",
  "change_id": 1221,
  "title": "Persist conversation turns and resumable questions",
  "intent": {
    "problem": "Chat transcripts alone cannot safely represent an in-progress interview, preserve a question across restart, or ensure its answer reaches the same workflow continuation once.",
    "goal": "Persist revisioned turns and questions, validate answers, recover undelivered responses, and bind delivery to the original run and attempt."
  },
