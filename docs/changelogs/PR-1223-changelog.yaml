{
  "schema": "https://powdrr.io/schema/changelog-v2",
  "change_id": 1223,
  "title": "Bind durable job inputs to execution attempts",
  "intent": {
    "problem": "A job cannot be resumed or audited safely if its selected spec or approved change, provider configuration, checkpoint, or attempt identity can drift between acceptance and dispatch.",
    "goal": "Atomically bind each new job attempt to immutable source references and validated inputs before the job enters the running state, without persisting provider secrets."
  },
