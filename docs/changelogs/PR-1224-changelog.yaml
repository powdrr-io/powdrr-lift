schema: https://powdrr.io/schema/changelog-v2
change_id: 1224
title: Move Structrr rebase policy into service
intent:
  problem: The deterministic Structrr rebase algorithm and report types still lived in the legacy agent package,
    including a service-planning dependency on agent code.
  goal: Move the rebase policy into the service package, migrate callers to direct imports, and remove the legacy
    module and its allowlist exception.
