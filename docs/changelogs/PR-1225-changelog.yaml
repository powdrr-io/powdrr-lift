{
  "schema": "https://powdrr.io/schema/changelog-v2",
  "change_id": 1225,
  "title": "Add supervisor leases and worker ownership",
  "intent": {
    "problem": "Multiple local launchers or a delayed worker can otherwise run the same job attempt concurrently, and a restart cannot reliably identify stale ownership or pending cancellation.",
    "goal": "Persist one supervisor lease per workspace and generation-fence worker claims, heartbeats, cancellation, and dispatch intent for each job attempt."
  },
