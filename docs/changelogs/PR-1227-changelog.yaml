schema: https://powdrr.io/schema/changelog-v2
change_id: 1227
title: Add bounded workspace snapshots and versioned events
intent:
  problem: Workspace refreshes can load unbounded histories, and separate reads of
    current state and the event cursor can leave a reconnecting UI with gaps.
  goal: Provide bounded history pages, an atomic repository snapshot with its replay
    cursor, and versioned event records that carry attempt and revision metadata.
human-decisions: []
