invariants:
- id: snapshot-cursor-atomicity
  description: Repository projection records and the high-water event cursor are read
    from the same SQLite transaction.
  action: added
- id: bounded-workspace-history
  description: Conversation, message, job, operation, and event list reads require
    a bounded limit no greater than 1000.
  action: added
- id: legacy-event-readability
  description: Events stored before schema version eight remain readable as event
    envelope version one.
  action: added
