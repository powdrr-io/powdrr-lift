schema: https://powdrr.io/schema/changelog-v2
change_id: 1228
title: Move active-intent resolution into service
intent:
  problem: Active-intent clause normalization and overlay resolution remained in the legacy agent package and accepted
    an unused local worktree path.
  goal: Move active-intent semantics into the service package, pass only documents across the boundary, and remove
    legacy exports and the old module.
