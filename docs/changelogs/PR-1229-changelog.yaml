  - path: packages/service/src/powdrr_service/planning/structrr.py
    type: modified
    span: {start_line: 1293, end_line: 1293}
    summary: Make the existing unordered subject conflict check public.
    rationale: Apply the same dependency conflict rule before projecting each newly completed batch.
  - path: packages/service/src/powdrr_service/planning/structrr.py
    type: modified
    span: {start_line: 1465, end_line: 1465}
