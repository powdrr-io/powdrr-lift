schema: https://powdrr.io/schema/changelog-v2
change_id: 1231
title: Replace POSIX-only file locks with portable process locks
intent:
  problem: Five execution and persistence modules import fcntl directly, preventing
    them from loading on Windows.
  goal: Share a native cross-platform exclusive file-lock adapter that preserves blocking
    and nonblocking behavior and releases locks when a process exits.
