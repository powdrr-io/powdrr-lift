invariants:
- id: portable-exclusive-file-locking
  description: All affected persistence and workflow modules use the shared native
    OS lock adapter with soft-lock fallback disabled.
  action: added
- id: process-exit-releases-file-lock
  description: Terminating a process that owns a lock releases the native lock so
    another process can acquire it.
  action: added
- id: issue-worker-lock-is-nonblocking
  description: A second issue worker fails immediately with the existing busy-worker
    error while another worker owns the lock.
  action: altered
