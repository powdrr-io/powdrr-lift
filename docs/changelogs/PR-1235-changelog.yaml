schema: https://powdrr.io/schema/changelog-v2
change_id: 1235
title: Add secured local workspace HTTP API foundation
intent:
  problem: The browser workspace needs a same-origin local API for repository and design-chat data.
  goal: Add a loopback-only FastAPI application with shared-database sessions, bounded reads, and stable API errors.
human-decisions: []
