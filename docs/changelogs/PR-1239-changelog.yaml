    span: {start_line: 2990, end_line: 2997}
    summary: Import recent archived comments and publish the current journal at resume boundaries.
    rationale: Bring legacy issues forward and make the latest recovered or terminal state available in GitHub.
  - path: tests/test_planning_checkpoints.py
    type: modified
    span: {start_line: 443, end_line: 521}
    summary: Cover archive round trips, archive publication, and the legacy event tail.
    rationale: Verify compressed history restores the same chain and accepted answers.
