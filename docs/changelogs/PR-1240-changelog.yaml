schema: https://powdrr.io/schema/changelog-v2
change_id: 1240
title: Stream durable workspace events over SSE
intent:
  problem: Browser clients need ordered workspace updates that survive reconnects and service process changes.
  goal: Stream bounded event-log batches with durable cursors, heartbeat comments, and an explicit snapshot resync response.
