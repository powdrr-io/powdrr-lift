invariants:
- id: event-replay-uses-exclusive-durable-cursor
  description: An event stream emits only events whose durable sequence is greater than the supplied cursor.
  action: added
- id: future-event-cursor-requires-snapshot-resync
  description: A cursor ahead of the repository event log returns resync_required with the current event cursor.
  action: added
- id: event-stream-is-multiprocess-readable
  description: A subscriber observes events committed through another store instance sharing the workspace database.
  action: added
- id: event-stream-does-not-buffer-subscriber-backlog
  description: Event reads are bounded and a disconnected subscriber does not retain an unbounded in-memory queue.
  action: added
