- id: turn-acceptance-and-dispatch-intent-are-atomic
  description: A user message, accepted turn, idempotency result, and pending dispatch intent commit in one SQLite transaction.
  action: added
- id: message-retry-replays-original-acceptance
  description: The same request ID and payload returns the original turn and message; reusing the request ID with a different payload conflicts.
  action: added
- id: one-active-turn-per-conversation
  description: A conversation with an active turn rejects a second new turn.
  action: added
guidance:
