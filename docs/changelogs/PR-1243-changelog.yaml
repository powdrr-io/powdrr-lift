schema: https://powdrr.io/schema/changelog-v2
change_id: 1243
title: Accept chat messages as durable turns
intent:
  problem: The browser API can read committed conversation messages but cannot submit a user message as resumable work.
  goal: Accept chat messages through an idempotent API command and persist a supervisor-readable dispatch intent before returning HTTP 202.
