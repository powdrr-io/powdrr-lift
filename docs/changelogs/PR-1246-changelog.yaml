schema: https://powdrr.io/schema/changelog-v2
change_id: 1246
title: Create jobs with pinned workspace inputs
intent:
  problem: The workspace API cannot create jobs while preserving the exact specification, approved change, and provider configuration intended for execution.
  goal: Add idempotent job creation that validates and stores immutable pinned inputs before any later start command.
