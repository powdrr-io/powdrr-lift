change_id: 1248
title: Move behavior-scenario contracts into service
intent:
  problem: The behavior-scenario schema, compiler, and validation policy lived in the legacy core package and were imported throughout agent orchestration.
  goal: Make service the sole owner of behavior-scenario contracts and update every consumer to use the service module directly.
