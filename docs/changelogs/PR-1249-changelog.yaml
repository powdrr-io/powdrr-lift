- id: workspace-job-detail-route
  type: Route
  action: added
- id: workspace-job-detail-contract
  type: Struct
  action: added
- id: workspace-job-action-enum
  type: Enum
  action: added
- id: workspace-job-detail-tests
  type: Integration test
  action: added
entity_relationships:
- id: job-detail-is-tested
  type: verifies
  source: workspace-job-detail-tests
  target: workspace-job-detail-route
  action: added
  description: Tests verify the sanitized detail response, blockers, actions, and repository scope.
invariants:
- id: job-detail-read-is-consistent-and-bounded
  description: Job, attempts, and dependency blockers are read from one SQLite snapshot and attempt history is capped at 100 entries.
  action: added
- id: job-detail-does-not-expose-local-paths-or-provider-config
  description: Attempt summaries omit workflow paths, checkpoint paths, and provider configuration references.
  action: added
- id: allowed-job-actions-follow-state
  description: The detail response exposes only actions permitted by the persisted job state.
  action: added
guidance:
- id: stage-and-question-require-structured-workflow-data
  description: Keep stage and question null until the workflow adapter records structured stage and job-specific question relationships.
  action: added
