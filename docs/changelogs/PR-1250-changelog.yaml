schema: https://powdrr.io/schema/changelog-v2
change_id: 1250
title: Move external research policy into service
intent:
  problem: External contract retrieval, search caching, evidence capture, and shared HTTP retry logic still lived in the agent package despite being service-owned policy.
  goal: Move those modules into powdrr_service and update all consumers to use the service-owned implementations directly.
