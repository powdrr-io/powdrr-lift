  type: Integration test
  action: added
entity_relationships:
- id: action-route-persists-outbox-intent
  type: writes to
  source: workspace-job-action-route
  target: workspace-job-action-outbox
  action: added
  description: The route commits an action intent with the request replay result in one SQLite transaction.
- id: action-api-tests-verify-route
  type: verifies
  source: workspace-job-action-api-tests
  target: workspace-job-action-route
  action: added
  description: Tests verify idempotency, revision conflicts, persistence, and action availability.
invariants:
- id: job-action-acceptance-is-atomic-and-idempotent
  description: The action intent, job event, job revision update, and request replay result commit together.
  action: added
- id: at-most-one-active-job-action
  description: A job has at most one pending or claimed action intent; a pending non-cancel action can be superseded by cancellation.
  action: added
- id: http-job-action-does-not-run-workflow
  description: The API records accepted intent only; a supervisor applies it outside the request handler.
  action: added
guidance:
- id: preserve-job-action-supervisor-boundary
  description: Keep workflow startup, retry recovery, and worker cancellation in the supervisor when implementing outbox consumption.
  action: added
