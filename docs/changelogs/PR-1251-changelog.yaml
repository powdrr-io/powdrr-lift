schema: https://powdrr.io/schema/changelog-v2
change_id: 1251
title: Accept durable workspace job actions
intent:
  problem: The browser workspace can show job actions but has no safe API for accepting them across service processes.
  goal: Add a revision-checked, idempotent job action endpoint backed by a transactional SQLite outbox.
human-decisions: []
