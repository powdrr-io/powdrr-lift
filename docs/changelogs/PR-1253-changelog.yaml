schema: https://powdrr.io/schema/changelog-v2
change_id: 1253
title: Expose pending job actions to the supervisor
intent:
  problem: Durable job action requests have no typed repository-scoped read for the supervisor.
  goal: Provide a bounded read model for pending intents so a supervisor can consume accepted work after restart.
human-decisions: []
structured_files: []
files:
- path: packages/contracts/src/powdrr_contracts/workspace.py
  type: modified
  span:
    start_line: 40
    end_line: 47
  summary: Define the lifecycle states for durable job action intents.
  rationale: Share a validated state vocabulary between persistence and supervisor adapters.
- path: packages/contracts/src/powdrr_contracts/workspace.py
  type: modified
  span:
    start_line: 679
    end_line: 746
  summary: Add a typed serializable job action intent record.
  rationale: Give supervisor consumers a stable contract without exposing storage rows.
- path: packages/local/src/powdrr_local/workspace.py
  type: modified
  span:
    start_line: 27
    end_line: 27
  summary: Import the durable action state enum.
  rationale: Filter pending intents using the shared contract.
- path: packages/local/src/powdrr_local/workspace.py
  type: modified
  span:
    start_line: 41
    end_line: 41
  summary: Import the typed job action intent record.
  rationale: Return validated records from workspace storage.
- path: packages/local/src/powdrr_local/workspace.py
  type: modified
  span:
    start_line: 3127
    end_line: 3154
  summary: List pending job actions in a bounded, repository-scoped query.
  rationale: Let the supervisor discover durable requests without polling GitHub or reading unrelated repositories.
- path: tests/test_ui_workspace.py
  type: modified
  span:
    start_line: 15
    end_line: 15
