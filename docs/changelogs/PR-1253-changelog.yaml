  type: modified
  span:
    start_line: 32
    end_line: 32
  summary: Import the typed action intent contract for round-trip coverage.
  rationale: Verify supervisor-facing records serialize and validate consistently.
- path: tests/test_ui_workspace.py
  type: modified
  span:
    start_line: 382
    end_line: 393
  summary: Verify the job action intent contract round-trips.
  rationale: Ensure the supervisor record has a stable validated representation.
- path: tests/test_ui_workspace.py
  type: modified
  span:
    start_line: 429
    end_line: 472
  summary: Verify pending intent reads are bounded and scoped to one repository.
  rationale: Ensure a supervisor cannot receive other repositories' actions or unbounded results.
