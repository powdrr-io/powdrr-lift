schema: https://powdrr.io/schema/changelog-v2
change_id: 1254
title: Move packaged taxonomy resource into service
intent:
  problem: The software development entity taxonomy is service-owned policy but is packaged under the legacy powdrr_lift namespace.
  goal: Move the packaged taxonomy into powdrr_service and update all runtime consumers to load the service-owned resource.
