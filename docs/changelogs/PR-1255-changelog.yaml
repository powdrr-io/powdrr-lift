invariants:
- id: only-active-supervisor-generation-can-finish-action-claim
  description: Claim completion, failure, and release require the current supervisor lease and the exact claim token and generation.
  action: added
- id: stale-supervisor-claims-are-recoverable
  description: A replacement supervisor generation can reclaim an intent left claimed by an older generation.
  action: added
- id: action-finish-is-idempotent-for-the-owning-claim
  description: Repeating the same terminal outcome with the same claim token returns the saved action result.
  action: added
guidance:
- id: keep-action-effects-deduplicated-by-action-id
  description: Supervisor adapters must use action IDs to deduplicate effects when recovering intents after a crash.
  action: added
