schema: https://powdrr.io/schema/changelog-v2
change_id: 1255
title: Fence job action claims by supervisor generation
intent:
  problem: Pending job action intents can be read, but supervisors cannot claim or finish them safely across multiple processes and restarts.
  goal: Add lease-fenced claim, release, and completion operations that allow a new supervisor generation to recover stale claims.
