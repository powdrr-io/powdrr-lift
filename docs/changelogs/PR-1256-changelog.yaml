schema: https://powdrr.io/schema/changelog-v2
change_id: 1256
title: Normalize duplicated planned file references
intent:
  problem: Structural subject enumeration can return a planned file path duplicated around the `::` reference separator, causing a valid planned file to be rejected as absent from the projected baseline.
  goal: Resolve an exactly repeated path only when it matches an allocated planned write and is absent from the projected baseline.
human-decisions: []
structured_files: []
files:
- path: packages/service/src/powdrr_service/planning/structrr.py
  type: modified
  span: {start_line: 177, end_line: 179}
  summary: Resolve repeated planned file references when the subject is mislabeled as an entity.
  rationale: Map an exact duplicated planned path to the plan's new file subject deterministically.
- path: packages/service/src/powdrr_service/planning/structrr.py
  type: modified
  span: {start_line: 203, end_line: 204}
  summary: Document the accepted planned file reference forms.
  rationale: Keep the normalization rule aligned with the parser behavior.
- path: packages/service/src/powdrr_service/planning/structrr.py
  type: modified
  span: {start_line: 206, end_line: 207}
  summary: Normalize a duplicated planned path in a file subject reference.
  rationale: Recover the exact path from the observed malformed model response.
- path: packages/service/src/powdrr_service/planning/structrr.py
  type: modified
  span: {start_line: 1220, end_line: 1235}
  summary: Recognize only prefixed references or a path repeated exactly twice.
  rationale: Keep deterministic recovery bounded to a single unambiguous planned write.
- path: tests/test_planning_structrr.py
  type: modified
  span: {start_line: 949, end_line: 976}
  summary: Reproduce the duplicated path reference and verify it binds as a new file.
  rationale: Prevent this observed planner response from blocking the full plan again.
