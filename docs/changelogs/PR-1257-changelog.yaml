title: Compact prior subjects in planning context
intent:
  problem: Structural subject page corrections can exceed the bounded prompt size because every previously accepted subject is repeated with full metadata.
  goal: Keep the prior identity context needed to avoid duplicate subjects while making correction prompts fit the input bound.
