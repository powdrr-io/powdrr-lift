schema: https://powdrr.io/schema/changelog-v2
change_id: 1258
title: Move provider configuration into service package
intent:
  problem: Model mappings, provider definitions, and context limits were stored in the legacy agent namespace even though they control private provider routing.
  goal: Move provider configuration into powdrr_service and update every consumer to use the service-owned module.
