schema: https://powdrr.io/schema/changelog-v2
change_id: 1259
title: Add supervisor-side job action delivery
intent:
  problem: Durable actions can be claimed but lack a supervisor component to deliver them to an adapter and record the dispatch outcome.
  goal: Provide a one-action-at-a-time supervisor delivery boundary with retryable, failed, and accepted outcomes.
human-decisions: []
structured_files: []
files:
- path: docs/design/browser-workspace-api.md
  type: modified
  span:
    start_line: 120
    end_line: 128
  summary: Document supervisor action delivery, retries, action idempotency, and event notification behavior.
  rationale: Clarify the meaning of a completed action intent and the dispatcher responsibilities.
- path: packages/local/src/powdrr_local/job_action_supervisor.py
  type: added
  span:
    start_line: 1
    end_line: 129
  summary: Add an async supervisor component that claims one intent, dispatches it, and records the outcome.
  rationale: Keep workflow action execution behind a supervisor-owned boundary outside the HTTP request handler.
- path: tests/test_workspace_action_supervisor.py
  type: added
  span:
    start_line: 1
    end_line: 142
  summary: Cover successful dispatch, retryable release, permanent failure, and notification errors.
  rationale: Verify the durable claim lifecycle and ensure a failed wake-up does not wedge accepted work.
entities:
- id: workspace-job-action-supervisor
  type: Class
  action: added
- id: workspace-job-action-dispatcher-interface
  type: Interface
  action: added
- id: retryable-job-action-error
  type: Class
  action: added
- id: workspace-job-action-supervisor-tests
  type: Integration test
  action: added
entity_relationships:
- id: supervisor-dispatches-through-injected-interface
  type: uses
  source: workspace-job-action-supervisor
  target: workspace-job-action-dispatcher-interface
  action: added
  description: The supervisor delivers claimed action records through an injected dispatcher implementation.
- id: supervisor-tests-verify-action-delivery
  type: verifies
  source: workspace-job-action-supervisor-tests
  target: workspace-job-action-supervisor
  action: added
  description: Tests verify action delivery and persistence of retryable and terminal outcomes.
invariants:
- id: action-completion-means-dispatched-not-job-finished
  description: A completed action intent confirms dispatcher acceptance; the associated job remains in its workflow state until a worker reports progress.
  action: added
- id: retryable-dispatch-returns-action-to-pending
  description: Retryable dispatch failures release the claim and leave the action available for the supervisor's retry policy.
  action: added
- id: permanent-dispatch-errors-fail-action
  description: Non-retryable dispatcher exceptions mark the intent failed and propagate to the caller.
  action: added
- id: action-dispatch-effects-deduplicate-by-action-id
  description: Adapters deduplicate effects by action ID because a crash can occur after the effect and before durable completion.
  action: added
- id: event-wakeup-does-not-control-action-delivery
  description: Durable events remain authoritative; notification errors do not block dispatch or outcome recording.
  action: added
guidance:
- id: adapter-controls-action-specific-execution
  description: Keep action-specific workflow behavior in the injected dispatcher; this supervisor only claims and records delivery outcomes.
  action: added
