schema: https://powdrr.io/schema/changelog-v2
change_id: 1260
title: Move provider credential resolution into service package
intent:
  problem: Provider credentials, local Codex token discovery, and credential provenance were implemented in the legacy agent package even though the service must own provider access and secrets.
  goal: Move credential resolution and credential-based provider discovery into powdrr_service, then update consumers to use the service-owned API.
