schema: https://powdrr.io/schema/changelog-v2
change_id: 1262
title: Extract reusable planned workflow task adapter
intent:
  problem: Plan-item execution is embedded in a CLI callback, preventing the workspace supervisor from invoking the same behavior directly.
  goal: Expose a reusable application function for one reviewed plan item while leaving GitHub queue management and CLI presentation at the CLI boundary.
