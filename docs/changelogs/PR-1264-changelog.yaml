schema: https://powdrr.io/schema/changelog-v2
change_id: 1264
title: Move concrete provider clients into service package
intent:
  problem: Concrete model-provider request handling still lives in the agent package,
    coupling provider transport to workflow execution.
  goal: Make provider clients service-owned and keep only workflow error adaptation
    and local model setup in the agent.
