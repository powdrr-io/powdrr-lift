schema: https://powdrr.io/schema/changelog-v2
change_id: 1267
title: Move decision API classifier into service package
intent:
  problem: JEV and SubQ network requests, retries, response mapping, and fallback
    behavior remain in the legacy agent module.
  goal: Place decision API classifier transports and policy in the service package
    while keeping workflow callers and behavior intact.
