schema: https://powdrr.io/schema/changelog-v2
change_id: 1269
title: Extract reusable planning session application
intent:
  problem: Planning session creation and resumption are coupled to CLI parsing and presentation, preventing a workspace worker from invoking them directly.
  goal: Move planning orchestration behind a typed application function that returns structured results while preserving existing service, provider, checkpoint, and PR publication behavior.
