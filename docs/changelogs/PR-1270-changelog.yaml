schema: https://powdrr.io/schema/changelog-v2
change_id: 1270
title: Implement service-side chat inference forwarding
intent:
  problem: The public service inference method is unimplemented, so callers cannot
    route MiniSWE-compatible chat requests through service-owned provider credentials.
  goal: Implement bounded OpenAI-compatible chat-completion forwarding through DeepInfra
    and return validated assistant, tool-call, usage, and provider response data.
human-decisions: []
structured_files: []
files:
- path: docs/architecture/agent-service-module-ownership.json
  type: modified
  span:
    start_line: 3183
    end_line: 3194
  summary: Register the service inference provider module in the ownership inventory.
  rationale: Track ownership and forbidden dependencies for the new service inference
    implementation.
- path: packages/service/src/powdrr_service/local_service.py
  type: modified
  span:
    start_line: 24
    end_line: 28
  summary: Delegate the public infer operation to an injectable service inference
    client.
  rationale: Implement the previously unhandled inference operation without exposing
    provider credentials to callers.
