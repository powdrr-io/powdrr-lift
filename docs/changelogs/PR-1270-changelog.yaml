- path: packages/service/src/powdrr_service/providers/inference.py
  type: added
  span:
    start_line: 1
    end_line: 155
  summary: Forward chat requests to DeepInfra and validate the returned completion.
  rationale: Keep provider credentials and HTTP transport inside the service while
    preserving tool calls, usage, and response metadata.
- path: tests/test_module_boundaries.py
  type: modified
  span:
    start_line: 146
    end_line: 146
  summary: Enforce the service-only dependency boundary for inference forwarding.
  rationale: Prevent provider inference from importing agent modules.
- path: tests/test_service_inference.py
  type: added
  span:
    start_line: 1
    end_line: 156
  summary: Verify request forwarding, response preservation, credential ownership,
    and malformed/error cases.
  rationale: Prove the service inference operation and JSON bridge behavior with deterministic
    provider responses.
