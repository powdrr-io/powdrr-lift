schema: https://powdrr.io/schema/changelog-v2
change_id: 1271
title: Extract reusable PR execution session application
intent:
  problem: The GitHub issue worker setup is embedded in CLI parsing and presentation, preventing a workspace dispatcher from invoking the execution flow directly.
  goal: Provide a typed application function for one PR execution worker attempt while preserving the existing queue, task, checkpoint, and reporting semantics.
human-decisions: []
structured_files: []
