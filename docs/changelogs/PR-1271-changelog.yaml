  type: added
  span: {start_line: 1, end_line: 110}
  summary: Add typed PR execution configuration and a reusable worker application function.
  rationale: Allow CLI and workspace adapters to invoke existing worker behavior through a stable application boundary.
- path: src/powdrr_lift/cli.py
  type: modified
  span: {start_line: 236, end_line: 236}
  summary: Import the PR execution application entry point.
  rationale: Keep CLI execution delegated to the reusable application module.
- path: src/powdrr_lift/cli.py
  type: modified
  span: {start_line: 243, end_line: 243}
  summary: Remove CLI ownership of the queue runner import.
  rationale: The application module now owns worker invocation.
