schema: https://powdrr.io/schema/changelog-v2
change_id: 1272
title: Route MiniSWE model inference through service IPC
intent:
  problem: MiniSWE runs as a child process and currently calls LLM providers directly,
    which exposes provider credentials in the agent process and bypasses the service
    inference boundary.
  goal: Keep MiniSWE's agent loop in its worker while sending model requests to the
    parent service process over a bounded local IPC protocol, with provider credentials
    held only by the parent.
human-decisions: []
structured_files: []
