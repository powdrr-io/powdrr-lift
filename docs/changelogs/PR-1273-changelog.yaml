schema: https://powdrr.io/schema/changelog-v2
change_id: 1273
title: Compose MiniSWE inference in the local package
intent:
  problem: The MiniSWE agent provider still constructs the local service and DeepInfra
    client, mixing agent worker code with service-side provider composition.
  goal: Move inference handler construction to powdrr_local and require callers to
    inject that handler into each MiniSWE worker path.
human-decisions: []
structured_files: []
