  type: modified
  span:
    start_line: 397
    end_line: 409
  summary: Register the local MiniSWE inference composition module and its service/bridge
    dependencies.
  rationale: Make composition ownership explicit in the agent/service extraction inventory.
- path: packages/local/src/powdrr_local/__init__.py
  type: modified
  span:
    start_line: 6
    end_line: 6
  summary: Export the MiniSWE inference composition factory from the local package.
  rationale: Allow application call sites to obtain service inference without constructing
    provider clients in the worker.
