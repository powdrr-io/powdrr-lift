- path: packages/local/src/powdrr_local/miniswe_inference.py
  type: added
  span:
    start_line: 1
    end_line: 31
  summary: Compose DeepInfra inference through LocalPowdrrService and JsonServiceBridge
    with a bounded provider timeout.
  rationale: Keep provider and service construction in the local composition layer
    while preserving serialized contracts.
