schema: https://powdrr.io/schema/changelog-v2
change_id: 1273
title: Add structured Procedrr chat workflow events
intent:
  problem: Procedrr chat exposes terminal-oriented progress and file callbacks but
    no shared typed event stream for workspace adapters to persist assistant messages,
    questions, stages, artifacts, retries, and outcomes.
  goal: Emit ordered structured chat events through a typed callback and local replay
    log while preserving existing terminal presentation and resume behavior.
