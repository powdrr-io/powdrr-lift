schema: https://powdrr.io/schema/changelog-v2
change_id: 1275
title: Move execute-PR test authoring prompt policy into service
intent:
  problem: The execute-PR integration-test authoring prompt contains proprietary quality
    and authoring policy in the mixed task agent module.
  goal: Make service code own the authoring prompt while the local agent inserts its
    workspace path only at worker launch time.
