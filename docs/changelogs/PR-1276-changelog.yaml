schema: https://powdrr.io/schema/changelog-v2
change_id: 1276
title: Move execute-PR test review policy into service
intent:
  problem: The execute-PR test-quality rubric, prompt construction, evidence shaping,
    and review-note policy live inside the local task orchestration module.
  goal: Make the service verification package own test-review policy while the local
    agent retains only provider calls, retries, and workflow orchestration.
human-decisions: []
structured_files: []
files:
- path: packages/service/src/powdrr_service/verification/execute_pr_test_quality.py
  type: added
  span: {start_line: 1, end_line: 365}
  summary: Define the service-owned rubric, schemas, prompt builders, evidence extraction,
    and advisory note rendering.
  rationale: Keep proprietary review policy in the service layer and expose focused
    functions for local workflow orchestration.
- path: src/powdrr_lift/workrr/task_agent.py
  type: modified
  span: {start_line: 46, end_line: 59}
  summary: Import execute-PR test-quality policy functions from the service package.
  rationale: Route local workflow execution through the service-owned policy module.
