schema: https://powdrr.io/schema/changelog-v2
change_id: 1276
title: Connect durable workspace turns to Procedrr chat
intent:
  problem: Workspace conversations can persist turns and questions, but accepted turns do not yet run through the Procedrr chat workflow or persist its messages and progress.
  goal: Run accepted workspace turns through Procedrr, persist assistant messages and typed questions, resume saved executions from answers, and record attempt-fenced workflow activity.
