invariants:
  - id: planned-file-subjects-are-deterministic
    description: Every planned write path is registered once per plan item, with all owning requirements, units, and source references coalesced; existing paths produce no file-identity change.
    action: added
  - id: structural-pages-must-not-repeat-file-subjects
    description: Model-generated structural pages enumerate entities and relationships only; a planned file subject cannot recur on a later page.
    action: altered
