    rationale: Keep examples consistent with the entity and relationship schema.
  - path: packages/service/src/powdrr_service/planning/structrr.py
    type: modified
    span: {start_line: 956, end_line: 958}
    summary: Parameterize structural page schemas by allowed section names.
    rationale: The enumeration request can enforce its narrower model output contract.
  - path: packages/service/src/powdrr_service/planning/structrr.py
    type: modified
