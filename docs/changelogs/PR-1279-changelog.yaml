schema: https://powdrr.io/schema/changelog-v2
change_id: 1279
title: Add durable workspace chat turn dispatch
intent:
  problem: Accepted workspace turns and answered interview questions have durable dispatch rows but lack supervisor-generation claims for safe multi-process delivery.
  goal: Claim eligible turns under the current supervisor lease, requeue answered questions, and fence running turns from automatic duplicate dispatch after supervisor replacement.
