- path: src/powdrr_lift/workrr/execute_pr_tests.py
  type: modified
  span: {start_line: 504, end_line: 504}
  summary: Remove the local behavioral-red policy from the module exports.
  rationale: Avoid retaining a second local policy surface.
- path: src/powdrr_lift/workrr/task_agent.py
  type: modified
  span: {start_line: 3, end_line: 3}
  summary: Drop the local AST import after moving case comparison policy.
  rationale: Remove unused policy dependencies from workflow orchestration.
- path: src/powdrr_lift/workrr/task_agent.py
  type: modified
  span: {start_line: 45, end_line: 50}
  summary: Import test correction policy from the service verification package.
  rationale: Route acceptance decisions through the service boundary.
- path: src/powdrr_lift/workrr/task_agent.py
  type: modified
  span: {start_line: 139, end_line: 139}
  summary: Stop importing behavioral-red policy from local test execution helpers.
  rationale: Remove the duplicate local policy dependency.
- path: src/powdrr_lift/workrr/task_agent.py
  type: modified
  span: {start_line: 1351, end_line: 1351}
  summary: Delegate comparison of original and corrected test cases to service policy.
  rationale: Have the service decide whether a correction preserves and changes cases.
- path: src/powdrr_lift/workrr/task_agent.py
  type: modified
  span: {start_line: 1364, end_line: 1365}
  summary: Delegate corrected-case baseline acceptance to the service.
  rationale: Ensure each changed case fails through behavior on the clean baseline.
- path: src/powdrr_lift/workrr/task_agent.py
  type: modified
  span: {start_line: 1393, end_line: 1399}
  summary: Handle the service verification error during test-author validation.
