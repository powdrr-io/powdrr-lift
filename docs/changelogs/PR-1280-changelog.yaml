schema: https://powdrr.io/schema/changelog-v2
change_id: 1280
title: Move execute-PR correction acceptance into service
intent:
  problem: The local task agent decides whether corrected integration tests preserve
    the generated suite and still fail behaviorally against an untouched baseline.
  goal: Put correction acceptance and baseline-failure rules in the service while the
    local agent continues to manage worktrees and execute pytest.
human-decisions: []
structured_files: []
files:
- path: docs/architecture/agent-service-module-ownership.json
  type: modified
  span: {start_line: 3247, end_line: 3264}
  summary: Register the execute-PR quality and correction policy modules as service-owned.
  rationale: Keep the staged ownership boundary visible to inventory validation.
- path: docs/architecture/agent-service-module-ownership.json
  type: modified
  span: {start_line: 3414, end_line: 3416}
  summary: Record the service verification policy imports used by task orchestration.
  rationale: Reflect the local agent's new explicit calls into service policy modules.
- path: packages/service/src/powdrr_service/verification/execute_pr_test_corrections.py
  type: added
  span: {start_line: 1, end_line: 112}
  summary: Define service-owned correction case comparison and behavioral baseline
    acceptance rules.
  rationale: Centralize proprietary acceptance decisions and give them an explicit
    service error type.
- path: src/powdrr_lift/workrr/execute_pr_tests.py
  type: modified
  span: {start_line: 388, end_line: 425}
  summary: Remove local behavioral-red acceptance policy after it moved to service.
