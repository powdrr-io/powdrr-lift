schema: https://powdrr.io/schema/changelog-v2
change_id: 1281
title: Run workspace chat dispatch from service lifespan
intent:
  problem: The durable turn supervisor has no API service lifecycle integration, so accepted chats remain queued unless an external caller dispatches them.
  goal: Start an optional turn dispatch runtime with the local FastAPI app, use the database supervisor lease across service processes, and expose its status through health.
human-decisions: []
structured_files: []
files:
- path: packages/local/src/powdrr_local/turn_dispatch_runtime.py
  type: added
  span:
    start_line: 1
    end_line: 228
  summary: Run the turn supervisor while the API process is alive and renew its database lease.
  rationale: Dispatch eligible accepted turns across repositories without filesystem locks and keep an expired or lost lease from starting a second local dispatch.
- path: packages/local/src/powdrr_local/web.py
  type: modified
