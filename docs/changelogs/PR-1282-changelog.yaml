schema: https://powdrr.io/schema/changelog-v2
change_id: 1282
title: Move execute-PR test validation policy into service
intent:
  problem: The local execute-PR module owns deterministic generated-test path, source,
    coverage, correction, and execution-evidence acceptance rules.
  goal: Move test-authoring validation policy into the service while retaining subprocess
    and filesystem operations in the agent.
