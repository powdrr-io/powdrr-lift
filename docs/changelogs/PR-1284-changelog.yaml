schema: https://powdrr.io/schema/changelog-v2
change_id: 1284
title: Move execute-PR final acceptance into service
intent:
  problem: The local task agent combines integration-test evidence and independently
    decides whether an execute-PR implementation attempt succeeded.
  goal: Move evidence aggregation and blocking final acceptance rules into the service
    while retaining local execution and collection.
