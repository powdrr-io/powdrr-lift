schema: https://powdrr.io/schema/changelog-v2
change_id: 1285
title: Move reviewed plan defect decisions into service
intent:
  problem: The local task agent interprets reviewed implementation steps and decides
    whether they conflict with files already present in the base commit.
  goal: Move plan-defect interpretation to service policy while keeping Git reads
    on the agent and passing their hashes as evidence.
