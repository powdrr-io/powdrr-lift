  type: added
  span:
    start_line: 1
    end_line: 59
  summary: Compose the workspace API, persistent store, and Procedrr chat dispatcher.
  rationale: Provide the application-level integration point for the local workspace service.
- path: src/powdrr_lift/workrr/workspace_chat_turn.py
  type: modified
  span:
