schema: https://powdrr.io/schema/changelog-v2
change_id: 1286
title: Compose workspace app with Procedrr chat
intent:
  problem: The workspace API has lifecycle-managed chat dispatch, but no application
    composition that connects it to the real Procedrr workflow and registered repositories.
  goal: Provide a workspace app factory that persists workspace state and dispatches
    each design chat with its registered repository context.
human-decisions: []
structured_files: []
