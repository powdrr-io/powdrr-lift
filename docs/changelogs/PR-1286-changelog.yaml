  span:
    start_line: 18
    end_line: 18
  summary: Import the registered repository model used by the dispatcher.
  rationale: Resolve persisted repository metadata for each chat turn.
- path: src/powdrr_lift/workrr/workspace_chat_turn.py
  type: modified
  span:
    start_line: 262
    end_line: 265
  summary: Define the repository registry contract for chat dispatch.
  rationale: Keep repository lookup explicit at the workspace boundary.
