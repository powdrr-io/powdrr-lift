    type: part_of
    source: build-review-feedback-ledger
    target: review-feedback-ledger
    action: added
    description: Service policy filters thread state and retains the full current conversation.
invariants:
  - id: review-feedback-empty-is-not-invalid
    description: A valid response with no current unresolved threads succeeds with status empty; malformed evidence fails.
    action: added
