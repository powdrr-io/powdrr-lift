schema: https://powdrr.io/schema/changelog-v2
change_id: 1291
title: Record compact planning cost telemetry
intent:
  problem: Large planning runs expose too little structured timing and provider usage data to identify their slow phases and costly questions.
  goal: Record local, privacy-bounded planning call metrics and summarize resumed work without expanding the GitHub answer journal.
human-decisions: []
structured_files: []
files:
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 11, end_line: 11}
    summary: Import inspection support for schema-compatible call instrumentation.
    rationale: Attribute planning cost to concrete question kinds while keeping concurrent call measurements isolated.
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 15, end_line: 15}
    summary: Import monotonic timing for planning provider calls.
    rationale: Measure elapsed provider-call time without wall-clock adjustments.
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 17, end_line: 17}
    summary: Add the typed telemetry callback to planning options.
    rationale: Pass call records to local storage without coupling the service to filesystem persistence.
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 37, end_line: 37}
    summary: Import bounded question serialization for request-size measurement.
    rationale: Measure input size using the same prompt builder as execution.
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 271, end_line: 272}
    summary: Add the provider route and optional metrics sink to planning options.
    rationale: Attribute model cost while keeping storage optional for other service callers.
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 279, end_line: 327}
    summary: Add a per-question client wrapper that captures API calls, response sizes, and thread-safe available usage.
    rationale: Keep concurrent call metrics isolated and record absent token metadata as unknown.
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 648, end_line: 648}
    summary: Extend one question worker result with its call telemetry.
    rationale: Keep instrumentation attached to the request that produced it.
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 650, end_line: 664}
    summary: Measure the initial serialized request size and initialize per-request capture.
    rationale: Keep telemetry best-effort and let normal question validation own errors.
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 667, end_line: 667}
    summary: Route question execution through its isolated metrics wrapper.
    rationale: Capture retries and token usage across the actual provider invocations.
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 675, end_line: 728}
    summary: Build a privacy-bounded record with question identity, sizes, attempts, result, timing, and usage.
    rationale: Provide comparable cost data without storing prompts, answers, or evidence.
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 737, end_line: 737}
    summary: Carry each metrics record through ordered batch completion.
    rationale: Preserve stable output order after concurrent provider calls.
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 740, end_line: 746}
    summary: Send records to the optional telemetry sink without failing planning on a metrics-write error.
    rationale: Telemetry must remain observational and not alter planning outcomes.
  - path: packages/service/src/powdrr_service/planning/service.py
    type: modified
    span: {start_line: 750, end_line: 753}
    summary: Preserve the existing question-batch result interface for checkpoint reduction.
    rationale: Keep telemetry independent from answer persistence.
  - path: packages/service/src/powdrr_service/providers/clients.py
    type: modified
    span: {start_line: 11, end_line: 11}
    summary: Import per-thread state for provider usage metadata.
    rationale: Prevent one question from reading another concurrent question's token counts.
  - path: packages/service/src/powdrr_service/providers/clients.py
    type: modified
    span: {start_line: 87, end_line: 87}
    summary: Initialize thread-local provider usage storage.
    rationale: Prevent concurrent calls from overwriting each other's token counts.
  - path: packages/service/src/powdrr_service/providers/clients.py
    type: modified
    span: {start_line: 91, end_line: 100}
    summary: Expose usage metadata for the current provider-calling thread.
    rationale: Let the planning wrapper collect accurate token counts from concurrent requests.
  - path: packages/local/src/powdrr_local/planning/checkpoints.py
    type: modified
    span: {start_line: 9, end_line: 10}
    summary: Import identifiers and grouping for local telemetry records.
    rationale: Keep operational metrics out of the durable GitHub answer history and avoid serializing it to summarize a run.
  - path: packages/local/src/powdrr_local/planning/checkpoints.py
    type: modified
    span: {start_line: 432, end_line: 630}
    summary: Persist restricted local telemetry records and aggregate compact per-kind and per-run summaries.
    rationale: Keep operational metrics out of the durable GitHub answer history and summarize records incrementally.
  - path: src/powdrr_lift/workrr/planning_session.py
    type: modified
    span: {start_line: 22, end_line: 22}
    summary: Import the local telemetry store into planning execution.
    rationale: Make planning cost visible on completion and failure while allowing planning to continue if telemetry cannot be written.
  - path: src/powdrr_lift/workrr/planning_session.py
    type: modified
    span: {start_line: 121, end_line: 122}
    summary: Track the local telemetry store and invocation identity for this planning session.
    rationale: Separate current work from earlier resumed executions.
  - path: src/powdrr_lift/workrr/planning_session.py
    type: modified
    span: {start_line: 244, end_line: 257}
    summary: Initialize local metrics best-effort and attach the current invocation to each record.
    rationale: Keep telemetry local and ensure initialization failures do not block planning.
  - path: src/powdrr_lift/workrr/planning_session.py
    type: modified
    span: {start_line: 282, end_line: 283}
    summary: Pass the provider identity and telemetry sink into the planning service.
    rationale: Attribute model requests to the configured provider and persist metrics locally.
  - path: src/powdrr_lift/workrr/planning_session.py
    type: modified
    span: {start_line: 287, end_line: 289}
    summary: Print a compact summary after the Procedrr planning run.
    rationale: Surface progress and cost without loading the full checkpoint history.
  - path: src/powdrr_lift/workrr/planning_session.py
    type: modified
    span: {start_line: 345, end_line: 348}
    summary: Print telemetry totals when planning stops with an error.
    rationale: Make partial runs measurable and resumable.
  - path: src/powdrr_lift/workrr/planning_session.py
    type: modified
    span: {start_line: 379, end_line: 422}
    summary: Render per-kind, per-execution, and slow-call summaries without answer content.
    rationale: Identify major planning costs while keeping detailed operational data local.
  - path: tests/test_planning_service.py
    type: modified
    span: {start_line: 751, end_line: 751}
    summary: Collect metrics from concurrent question execution.
    rationale: Verify provider route instrumentation is independent from answer replay.
  - path: tests/test_planning_service.py
    type: modified
    span: {start_line: 757, end_line: 762}
    summary: Enable telemetry collection in the concurrent question test.
    rationale: Verify call records preserve the question provider route.
  - path: tests/test_planning_service.py
    type: modified
    span: {start_line: 770, end_line: 775}
    summary: Enable telemetry collection across subsequent bounded transitions.
    rationale: Verify only newly executed questions are measured.
  - path: tests/test_planning_service.py
    type: modified
    span: {start_line: 789, end_line: 794}
    summary: Verify concurrent question calls emit separate provider and size metrics while missing token data stays unknown.
    rationale: Protect concurrent instrumentation from dropping or inventing provider usage.
  - path: tests/test_planning_checkpoints.py
    type: modified
    span: {start_line: 15, end_line: 15}
    summary: Import the local telemetry store in checkpoint tests.
    rationale: Verify the local metrics format and summary boundaries.
  - path: tests/test_planning_checkpoints.py
    type: modified
    span: {start_line: 788, end_line: 841}
    summary: Verify a thousand local records summarize by question kind and execution without exposing prompt or source text.
    rationale: Keep summaries compact and make resumed versus current execution counts reviewable.
