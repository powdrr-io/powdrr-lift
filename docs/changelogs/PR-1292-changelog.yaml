schema: https://powdrr.io/schema/changelog-v2
change_id: 1292
title: Answer design interview questions in workspace chat
intent:
  problem: The workspace persists design interview questions, but the browser client cannot show them or submit answers.
  goal: Let users answer schema-defined interview questions in chat and resume the design interview with durable, idempotent answers.
human-decisions: []
structured_files: []
