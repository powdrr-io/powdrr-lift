schema: https://powdrr.io/schema/changelog-v2
change_id: 1293
title: Reduce planning calls with deterministic filtering
intent:
  problem: Large plan generation spends excessive time asking repeated or derivable questions and its operational cost is difficult to inspect.
  goal: Batch independent planning questions, derive safe answers and candidate sets from pinned facts, reduce model response size, preserve title quality, and record privacy-conscious cost summaries.
human-decisions: []
structured_files: []
