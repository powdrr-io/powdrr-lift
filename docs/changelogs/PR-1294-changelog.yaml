schema: https://powdrr.io/schema/changelog-v2
change_id: 1294
title: Add workspace job navigation and status view
intent:
  problem: The workspace stores autonomous jobs and exposes detailed status, but the browser UI only shows a placeholder for jobs.
  goal: Let developers browse active and ready jobs in the sidebar and inspect a selected job's current status in the main workspace.
