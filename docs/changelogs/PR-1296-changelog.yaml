schema: https://powdrr.io/schema/changelog-v2
change_id: 1296
title: Move execute-PR quality review calls into service
intent:
  problem: The execute-PR agent still owns Jev and LLM review orchestration, including provider access
    and retry handling, after the rubric itself moved into the service.
  goal: Route pre-coding and correction quality reviews through the serialized service operation so provider
    calls, credentials, and retry policy stay service-side while findings remain advisory.
human-decisions: []
