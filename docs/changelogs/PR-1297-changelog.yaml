schema: https://powdrr.io/schema/changelog-v2
change_id: 1297
title: Add history and context to workspace jobs
intent:
  problem: Workspace jobs lose visibility after completion, and job details do not expose useful timing or related work context.
  goal: Add filterable job history and connect job status to its dependencies and originating design chat.
human-decisions: []
