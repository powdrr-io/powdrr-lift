invariants:
- id: executable-probes-authored-by-miniswe
  action: added
  description: MiniSWE remains the only author of executable behavior probes; service repair only revises pre-coding scenario text.
- id: local-faithfulness-paths-stay-agent-side
  action: added
  description: The agent reads local faithfulness artifacts and contracts, and sends JSON evidence plus fingerprints without filesystem paths to the service.
- id: source-faithfulness-before-scenario-acceptance
  action: added
  description: A revised scenario is included only after the service faithfulness policy accepts it; rejected or unavailable reviews retain the original scenario.
