schema: https://powdrr.io/schema/changelog-v2
change_id: 1298
title: Move behavior probe repair policy into service
intent:
  problem: Behavior-probe repair and scenario-faithfulness decisions still run in the agent with direct client dependencies.
  goal: Route repair and faithfulness review through the service while keeping local evidence loading and executable probe generation on the agent side.
