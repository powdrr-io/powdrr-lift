schema: https://powdrr.io/schema/changelog-v2
change_id: 1299
title: Create planning and PR execution jobs from the workspace UI
intent:
  problem: The workspace can inspect autonomous jobs but has no UI for submitting planning or PR execution work.
  goal: Create reviewable, pinned jobs from linked specifications and completed planning outputs.
human-decisions: []
structured_files: []
files:
  - path: ui/src/App.css
    type: modified
    span: {start_line: 176, end_line: 178}
    summary: Style the create-job action in the jobs section.
    rationale: Make job creation accessible from the existing sidebar workflow.
  - path: ui/src/App.css
    type: modified
    span: {start_line: 403, end_line: 421}
    summary: Style the job creation dialog, review summary, and approval form.
    rationale: Keep submission clear, accessible, and usable across workspace themes.
  - path: ui/src/App.test.tsx
    type: modified
    span: {start_line: 1, end_line: 1}
    summary: Import explicit cleanup for rendered UI tests.
    rationale: Isolate UI scenarios when exercising the job dialog.
  - path: ui/src/App.test.tsx
    type: modified
    span: {start_line: 3, end_line: 3}
    summary: Import the test cleanup lifecycle hook.
    rationale: Ensure the rendered workspace is removed between scenarios.
  - path: ui/src/App.test.tsx
    type: modified
    span: {start_line: 16, end_line: 16}
    summary: Add the job creation API mock.
    rationale: Exercise submission and selection without a live service.
  - path: ui/src/App.test.tsx
    type: modified
    span: {start_line: 69, end_line: 70}
    summary: Clean up rendered workspace instances after each test.
    rationale: Prevent dialog and selection state leaking between scenarios.
  - path: ui/src/App.test.tsx
    type: modified
    span: {start_line: 81, end_line: 95}
    summary: Provide a successful job creation response in the workspace fixture.
    rationale: Verify the UI selects a newly created job.
  - path: ui/src/App.test.tsx
    type: modified
    span: {start_line: 159, end_line: 238}
    summary: Test planning submission from a pinned spec and approved PR execution from a plan artifact.
    rationale: Protect the required source selection, approval confirmation, request identity, and post-create navigation.
  - path: ui/src/App.tsx
    type: modified
    span: {start_line: 6, end_line: 6}
    summary: Import the job creation input contract.
    rationale: Type workspace submission data at the app boundary.
  - path: ui/src/App.tsx
    type: modified
    span: {start_line: 9, end_line: 9}
    summary: Import the job creation dialog.
    rationale: Add job submission to the workspace shell.
  - path: ui/src/App.tsx
    type: modified
    span: {start_line: 133, end_line: 133}
    summary: Track whether the job creation dialog is open.
    rationale: Keep the dialog state in the workspace shell.
  - path: ui/src/App.tsx
    type: modified
    span: {start_line: 450, end_line: 457}
    summary: Submit jobs, refresh workspace state, and select the result.
    rationale: Connect the form to the existing job API and navigation model.
  - path: ui/src/App.tsx
    type: modified
    span: {start_line: 609, end_line: 609}
    summary: Allow the shell and modal to render as one app tree.
    rationale: Display the creation dialog above workspace content.
  - path: ui/src/App.tsx
    type: modified
    span: {start_line: 648, end_line: 648}
    summary: Add a create-job action to the jobs section.
    rationale: Provide a direct entry point for planning and execution work.
  - path: ui/src/App.tsx
    type: modified
    span: {start_line: 786, end_line: 795}
    summary: Render the dialog with repository, conversation, and job context.
    rationale: Offer eligible sources and return successful submissions to the selected job.
  - path: ui/src/api/client.ts
    type: modified
    span: {start_line: 7, end_line: 7}
    summary: Import the workspace job response type.
    rationale: Type the response from job creation.
  - path: ui/src/api/client.ts
    type: modified
    span: {start_line: 10, end_line: 10}
    summary: Import the job creation request type.
    rationale: Type the payload sent to the job endpoint.
  - path: ui/src/api/client.ts
    type: modified
    span: {start_line: 101, end_line: 108}
    summary: Call the repository job creation endpoint.
    rationale: Send pinned job inputs through the existing authenticated client.
  - path: ui/src/api/types.ts
    type: modified
    span: {start_line: 114, end_line: 125}
    summary: Define the workspace job creation payload.
    rationale: Match the backend request contract for both supported job kinds.
  - path: ui/src/components/JobCreateDialog.tsx
    type: added
    span: {start_line: 1, end_line: 165}
    summary: Add a reviewable form for planning and PR execution job creation.
    rationale: Require a linked spec and pinned chat revision for planning; require a completed plan artifact and explicit approval for one selected PR execution change.
entities: []
entity_relationships: []
invariants:
  - id: planning-jobs-pin-linked-spec-and-chat-revision
    description: Planning submissions use a specification linked from a selected design chat and pin the chat revision that supplied it.
    action: added
  - id: pr-execution-uses-selected-approved-plan-artifact
    description: PR execution submissions depend on one completed planning job, select one of its output references, and require explicit approval confirmation.
    action: added
  - id: job-submission-excludes-provider-credentials
    description: Job submissions carry provider configuration references and do not include provider secrets.
    action: added
guidance: []
