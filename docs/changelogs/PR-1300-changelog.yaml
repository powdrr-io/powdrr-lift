invariants:
- id: planning-frontier-respects-concurrency-window
  description: The planning state machine constructs at most four candidate questions per configured concurrent
    request, preserving the existing four-question batch limit.
  action: added
- id: structural-review-context-is-subject-scoped
  description: Existing Structrr subjects already accepted for an item are summarized rather than repeated
    in later enumeration prompts, and candidate review context contains only the subject and its direct
    references.
  action: added
guidance:
- id: mocked-planning-timings-are-not-live-provider-proof
  description: Deterministic scale profiles measure local planner overhead and interaction counts; the
    two-hour target requires a separate run with documented live provider settings, concurrency, and hardware.
  action: added
