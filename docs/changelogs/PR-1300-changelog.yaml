schema: https://powdrr.io/schema/changelog-v2
change_id: 1300
title: Measure and bound large planning runs
intent:
  problem: Planning runtime had no deterministic full-flow scale measurement, and large runs repeatedly
    rebuilt accepted state and oversized Structrr context.
  goal: Add reproducible scale profiles, bound question construction to the active concurrency window,
    and avoid repeated work while reviewing large projected baselines.
human-decisions: []
