schema: https://powdrr.io/schema/changelog-v2
change_id: 1303
title: Add live planning scale benchmark
intent:
  problem: Deterministic profiles measured local planner overhead but could not record live provider latency or expose differences between fixture and model-generated planning results.
  goal: Add an opt-in single-profile provider run that reports execution metrics and fails when generated requirement, work-unit, or item counts differ from the fixture.
