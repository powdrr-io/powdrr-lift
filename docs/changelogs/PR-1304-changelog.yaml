schema: https://powdrr.io/schema/changelog-v2
change_id: 1304
title: Move Procedrr runtime and workflows into service
intent:
  problem: The legacy Procedrr interpreter, evaluator, and proprietary process catalog still ship from
    the agent repository root, outside the service package ownership boundary.
  goal: Package the interpreter, evaluator, and all 36 first-party process definitions in the service
    distribution, update callers and packaging, and verify the service package has no agent imports.
human-decisions: []
structured_files: []
