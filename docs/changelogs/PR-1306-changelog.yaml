schema: https://powdrr.io/schema/changelog-v2
change_id: 1306
title: Move Structrr proposal policy into service
intent:
  problem: Structrr proposal, source-manifest, actual-diff, and candidate-comparison policy still lived in the agent
    package, leaving service planning dependent on agent-owned modules.
  goal: Move these policy modules into powdrr_service, update all production and test imports directly, and remove
    the legacy imports without compatibility shims.
human-decisions: []
