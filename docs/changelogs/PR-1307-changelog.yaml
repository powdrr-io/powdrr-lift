schema: https://powdrr.io/schema/changelog-v2
change_id: 1307
title: Improve live planning quality and source deduplication
intent:
  problem: Live planning duplicated obligations from aliased source anchors and fragmented cohesive requirements into one work unit per requirement, making benchmark results misleading.
  goal: Preserve distinct source obligations, collapse exact duplicate extractions, guide cohesive work-unit proposals, and evaluate live plan shape against bounded sizing expectations.
