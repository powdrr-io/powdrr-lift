schema: https://powdrr.io/schema/changelog-v2
change_id: 1308
title: Move Structrr verification and review policy into service
intent:
  problem: Structrr verification-contract, obligation, proposal-gate, intent-lineage, and invariant-review policy
    still lived under the agent package, with agent package exports preserving the old import surface.
  goal: Move the policy modules into powdrr_service, update production and test callers to use service imports directly,
    remove old re-exports, and record the ownership boundary.
