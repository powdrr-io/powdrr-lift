schema: https://powdrr.io/schema/changelog-v2
change_id: 1309
title: Report checkpoint availability in job recovery details
intent:
  problem: The recovery review shows checkpoint status as unreported because the workspace job detail API has no recovery assessment.
  goal: Add a safe, optional checkpoint inspection boundary and expose its availability to the browser without revealing internal checkpoint or worktree references.
