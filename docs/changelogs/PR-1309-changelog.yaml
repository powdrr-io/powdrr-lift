invariants:
  - id: checkpoint-inspection-is-private
    description: The browser-facing recovery assessment never includes the stored checkpoint reference, worktree path, or raw inspector error text.
    action: added
  - id: checkpoint-status-is-conservative
    description: Recovery details report unknown when checkpoint validation is not configured or fails.
    action: added
  - id: checkpoint-status-does-not-enable-resume
    description: A checkpoint availability assessment does not add a resume action; available actions remain controlled by the backend job state.
    action: added
