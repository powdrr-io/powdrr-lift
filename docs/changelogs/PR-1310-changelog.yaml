change_id: 1310
title: Move DeepSWE evaluation policy into service
intent:
  problem: DeepSWE prompt/probe evaluation and prompt-to-benchmark comparison logic, including the default state-data
    rubric, still shipped from the agent source tree and documentation path.
  goal: Package evaluation policy and its bundled default rubric with the service, update CLI and tests to use service
    imports, and document the new resource location.
