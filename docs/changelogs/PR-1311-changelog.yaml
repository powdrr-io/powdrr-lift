schema: https://powdrr.io/schema/changelog-v2
change_id: 1311
title: Add BasedPyright dependency candidates
intent:
  problem: Dependency candidate discovery can miss real code dependencies when planned work-unit prose has little lexical overlap.
  goal: Add bounded BasedPyright references between planned Python files as evidence for focused dependency confirmation.
human-decisions: []
structured_files: []
