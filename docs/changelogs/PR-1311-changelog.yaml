    type: modified
    span: {start_line: 221, end_line: 226}
    summary: Record the BasedPyright dependency-evidence progress and remaining recall work.
    rationale: Keep the implementation plan aligned with the dependency-candidate behavior.
  - path: packages/agent/src/powdrr_agent/repository.py
    type: modified
    span: {start_line: 216, end_line: 226}
    summary: Expose the bounded BasedPyright reference search through the repository adapter.
    rationale: Let planning use language-server evidence through the existing repository boundary.
  - path: packages/service/src/powdrr_service/planning/dependencies.py
    type: modified
