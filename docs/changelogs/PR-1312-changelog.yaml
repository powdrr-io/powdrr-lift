change_id: 1312
title: Move semantic instruction policy into service
intent:
  problem: Semantic instruction classification, contract compilation, prompt-case evaluation, and their corpus still
    lived in the agent source tree or docs.
  goal: Move semantic instruction policy and its evaluation corpus into the service package, update all runtime
    and research imports directly, and verify both distributions package the intended boundary.
