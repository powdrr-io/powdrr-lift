    type: modified
    span: {start_line: 107, end_line: 122}
    summary: Document how to launch the browser workspace and use its one-time token.
    rationale: Make the new local UI available from the existing developer setup guide.
  - path: docs/design/browser-workspace-api.md
    type: modified
    span: {start_line: 7, end_line: 18}
    summary: Describe launch options, OS data locations, token bootstrap, and port conflict behavior.
    rationale: Keep the local API and launcher contract discoverable.
  - path: packages/local/src/powdrr_local/web.py
