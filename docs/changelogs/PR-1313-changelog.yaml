schema: https://powdrr.io/schema/changelog-v2
change_id: 1313
title: Add a packaged local workspace launcher
intent:
  problem: The browser workspace API and frontend exist, but developers have no supported command to start the bundled UI with persistent local data.
  goal: Add a loopback-only CLI launcher, OS-specific user data paths, static asset serving from the Python package, and a documented local startup flow.
human-decisions: []
structured_files: []
