invariants:
  - id: workspace-launch-is-loopback-only
    description: The UI launcher binds only to 127.0.0.1 and rejects an occupied port without connecting to an unverified service.
    action: added
  - id: workspace-data-is-outside-the-repository
    description: Workspace data defaults to the operating system's per-user application data location and supports an explicit override.
    action: added
  - id: browser-assets-are-packaged
    description: The Python local package includes the built frontend assets used by the UI launcher.
    action: added
