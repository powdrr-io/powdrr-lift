schema: https://powdrr.io/schema/changelog-v2
change_id: 1314
title: Move changelog parsing into service
intent:
  problem: Changelog schema parsing and its result models were implemented in the agent-side Powdrr Lift package
    and re-exported through legacy package APIs.
  goal: Move parsing and models into the service package, switch all callers to direct service imports, remove old
    parser modules and exports, and update ownership records.
