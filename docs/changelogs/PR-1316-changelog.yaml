schema: https://powdrr.io/schema/changelog-v2
change_id: 1316
title: Reuse a running local workspace safely
intent:
  problem: Launching a second local workspace process fails even when the same workspace is already healthy, while blindly connecting to an occupied port could attach to an unrelated service.
  goal: Persist a per-data-directory instance identity, reuse only a healthy matching instance, and keep the selected port reserved through server startup.
human-decisions: []
structured_files: []
