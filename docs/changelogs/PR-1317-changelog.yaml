schema: https://powdrr.io/schema/changelog-v2
change_id: 1317
title: Move changelog template policy into service
intent:
  problem: Changelog template formatting and plan-diff enrichment still lived in the agent package, mixing
    Powdrr policy with local Git and repository evidence collection.
  goal: Move template formatting and plan-diff enrichment into the service package, keep local evidence
    collection in the agent, remove the old renderer exports, and record the ownership boundary.
