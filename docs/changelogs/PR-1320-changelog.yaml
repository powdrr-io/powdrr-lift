schema: https://powdrr.io/schema/changelog-v2
change_id: 1320
title: Move changelog validation policy into service
intent:
  problem: Changelog structure and cross-reference validation still lived in the agent module alongside
    Git, filesystem, and repository-evidence collection.
  goal: Move deterministic changelog structure, span, entity, lifecycle, and reference rules into service
    policy while keeping repository evidence collection and CLI report composition in the agent.
