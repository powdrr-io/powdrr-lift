schema: https://powdrr.io/schema/changelog-v2
change_id: 1322
title: Move system specification validation policy to service
intent:
  problem: System-specification semantic validation still lived in an agent core module alongside local
    template and repository code.
  goal: Move system-specification content validation to the service while keeping template file operations
    and CLI report formatting in the agent.
