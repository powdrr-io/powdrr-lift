schema: https://powdrr.io/schema/changelog-v2
change_id: 1324
title: Move architecture specification policy to service
intent:
  problem: Architecture specification rules and shared specification-v1 policies still
    lived in agent core modules.
  goal: Move semantic rules into the service and pass repository evidence from the
    agent adapter as content.
