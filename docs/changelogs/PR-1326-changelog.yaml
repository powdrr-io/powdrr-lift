schema: https://powdrr.io/schema/changelog-v2
change_id: 1326
title: Save compact planning benchmark reports
intent:
  problem: Large planning benchmark output can overwhelm command capture and lose the timing, phase, request, and shape metrics needed to evaluate a run.
  goal: Persist the complete report as a local artifact while printing a compact, bounded summary that retains the measurements needed for analysis.
