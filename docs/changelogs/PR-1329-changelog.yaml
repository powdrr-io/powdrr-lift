schema: https://powdrr.io/schema/changelog-v2
change_id: 1329
title: Move proposed PR validation policy to service
intent:
  problem: Proposed PR specification validation still performed semantic checks and
    dependency decisions in the agent.
  goal: Move the complete validator policy into the service while the agent supplies
    feature IDs and repository documents.
