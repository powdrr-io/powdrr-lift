schema: https://powdrr.io/schema/changelog-v2
change_id: 1331
title: Move artifact state inspection into the service
intent:
  problem: Artifact state outside workflow inspection still bypassed the agent/service
    boundary, and the service imported the legacy projection from the agent application
    package.
  goal: Collect pinned source files and Git provenance in the agent, then reconstruct
    every selected artifact-state area through the serialized service operation.
