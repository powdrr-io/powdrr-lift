schema: https://powdrr.io/schema/changelog-v2
change_id: 1332
title: Measure live planning PR sizes
intent:
  problem: Live planning benchmarks treat any difference from the deterministic fixture's item count as a structural failure, even when each generated PR stays within the planner's allocation bounds.
  goal: Report actual PR sizing and gate live structural acceptance on completeness and allocation limits while retaining exact fixture counts for deterministic runs.
