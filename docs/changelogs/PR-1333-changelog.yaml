schema: https://powdrr.io/schema/changelog-v2
change_id: 1333
title: Add BasedPyright symbols to Structrr planning
intent:
  problem: Structrr planning relies on baseline path bindings and semantic enumeration but does not expose current BasedPyright symbols from the planned Python files to the item-level reviewer.
  goal: Query a bounded set of planned Python files once, add each item's own symbol inventory to its durable enumeration context, and preserve safe resume behavior through the question input digest.
