schema: https://powdrr.io/schema/changelog-v2
change_id: 1334
title: Route changelog template generation through the service
intent:
  problem: The agent directly imported service template formatting and plan-diff enrichment
    policy, while template-value preservation still ran in the legacy application
    package.
  goal: Keep Git diff and source-index collection local, and perform changelog rendering,
    plan-diff enrichment, and template-value preservation through serialized service
    operations.
