schema: https://powdrr.io/schema/changelog-v2
change_id: 1335
title: Move planning inference retry policy into service
intent:
  problem: Planning question execution depended on legacy application modules for
    model typing, malformed-response classification, and transient retry/backoff.
  goal: Keep planning inference contracts and retry behavior service-owned while
    preserving bounded retries, provider schema forwarding, malformed JSON repair,
    and planning outcomes.
