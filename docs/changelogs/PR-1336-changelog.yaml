schema: https://powdrr.io/schema/changelog-v2
change_id: 1336
title: Bind Structrr candidates from BasedPyright symbols
intent:
  problem: Path-based Structrr planning seeds every baseline entity associated with a planned file and still frames model review as broad enumeration, despite a pinned BasedPyright symbol inventory being available.
  goal: Match current declarations to baseline source subjects and entity bindings, deterministically seed only supported symbol candidates and their existing relationships, then ask the model only for additional subjects.
