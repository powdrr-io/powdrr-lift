schema: https://powdrr.io/schema/changelog-v2
change_id: 1337
title: Use BasedPyright references in Structrr candidate review
intent:
  problem: Structrr's additional-subject review cannot use the cross-file BasedPyright references already gathered for dependency planning, so code relationships may be missed or require another static-analysis session.
  goal: Reuse pinned BasedPyright symbols and references, pass only item-scoped path-pair evidence into Structrr review, and bind that evidence to the durable question digest without treating references as proof of a structural change.
