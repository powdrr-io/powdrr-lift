schema: https://powdrr.io/schema/changelog-v2
change_id: 1338
title: Move Procedrr model and operation runtime into service
intent:
  problem: The service still imported Procedrr model repair and command dispatch from
    the legacy application package.
  goal: Own Procedrr model retries, structured response repair, and operation validation
    in the service, then update all callers without compatibility shims.
