schema: https://powdrr.io/schema/changelog-v2
change_id: 1340
title: Move Structrr bootstrap and validation discovery into service
intent:
  problem: The service still depended on bootstrap and validation policy in the legacy
    agent package.
  goal: Move Structrr bootstrap, taxonomy, topology, and validation discovery into
    the service and remove the final legacy import exception.
