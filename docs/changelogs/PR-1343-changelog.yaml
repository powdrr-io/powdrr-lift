schema: https://powdrr.io/schema/changelog-v2
change_id: 1343
title: Move local worker runtime into agent package
intent:
  problem: Local MiniSWE and OpenCode worker execution still lived in the legacy application package, so the agent distribution could not launch its own worker runtime.
  goal: Package local worker monitoring, session execution, and the inference IPC adapter with the open-source agent, while keeping model inference routed through the existing service boundary.
