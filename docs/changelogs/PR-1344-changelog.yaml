schema: https://powdrr.io/schema/changelog-v2
change_id: 1344
title: Batch Jev review of dependency candidates
intent:
  problem: The planner asks a generative model to establish every discovered dependency, including
    false candidates, and sends independent Jev decisions through separate provider calls.
  goal: Use Jev to accept or reject each dependency candidate, generate explanatory details
    only for accepted candidates, and batch independent Jev reviews within provider limits.
human-decisions: []
