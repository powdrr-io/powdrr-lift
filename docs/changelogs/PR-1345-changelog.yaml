schema: https://powdrr.io/schema/changelog-v2
change_id: 1345
title: Move local verification runners into agent package
intent:
  problem: Verification command discovery and execution still lived in the legacy application package,
    tying local test running to service and application modules.
  goal: Move local exact-selector test execution and frozen generated-test handling into the agent package
    while preserving service-owned obligation and evidence policy.
