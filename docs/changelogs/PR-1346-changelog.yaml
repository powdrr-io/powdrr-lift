schema: https://powdrr.io/schema/changelog-v2
change_id: 1346
title: Scope and batch work-unit proposals
intent:
  problem: Work-unit planning made 125 provider calls in the latest large run, and each request repeated broad repository
    evidence and batch instructions.
  goal: Scope repository context to each proposal, compact compatible batch prompts, and preserve individual answer
    validation and durable retries.
