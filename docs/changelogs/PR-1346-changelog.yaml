invariants:
- id: work-unit-proposal-context-is-requirement-scoped
  description: When requirement-indexed evidence is available, a proposal question and its parser use only evidence
    associated with its requirements; an explicitly empty index supplies no evidence.
  action: added
- id: proposal-batches-preserve-member-validation-and-checkpoints
  description: Batched proposal answers remain validated by each member's strict parser, and valid siblings may
    be checkpointed independently from members requiring correction.
  action: added
