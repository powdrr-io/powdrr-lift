invariants:
- id: exact-source-fidelity-requires-single-anchor-equality
  description: The planner skips fidelity review only when the requirement text equals its sole pinned source anchor
    after whitespace normalization; paraphrases and multi-anchor requirements remain semantic questions.
  action: added
- id: deterministic-planning-reaches-a-stable-frontier-before-provider-calls
  description: Newly enabled deterministic answers are journaled and applied until no more deterministic answers
    are available before a provider question is issued.
  action: added
