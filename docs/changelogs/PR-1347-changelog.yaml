schema: https://powdrr.io/schema/changelog-v2
change_id: 1347
title: Skip exact-source fidelity reviews
intent:
  problem: The large planning run spent 125 provider calls checking source fidelity, including requirements copied
    exactly from one pinned source anchor; deterministic answers could also unlock additional deterministic work
    that was not checked before the next provider request.
  goal: Accept only exact single-anchor copies through a journaled deterministic rule and resolve newly enabled
    deterministic answers before requesting more model work.
