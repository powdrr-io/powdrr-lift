schema: https://powdrr.io/schema/changelog-v2
change_id: 1348
title: Extract post-run probe execution and policy
intent:
  problem: Frozen behavior probe execution, result interpretation, and differential verification classification
    are mixed into the legacy application package, blurring local agent effects and service-owned policy.
  goal: Run frozen probes in the local agent, exchange outcomes through public contracts, and keep probe
    result and differential classification policy in the service while preserving existing workflow behavior.
