schema: https://powdrr.io/schema/changelog-v2
change_id: 1349
title: Move probe validation policy into service
intent:
  problem: Generated probe parsing, interaction validation, test-obligation IDs, and coverage rules were
    still defined in legacy application modules, leaving proprietary verification policy in the application
    package.
  goal: Move probe validation and obligation policy into the service package, with executable probe data
    represented by public contracts, while preserving current workflow behavior and payload fields.
