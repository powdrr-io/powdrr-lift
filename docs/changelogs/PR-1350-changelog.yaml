schema: https://powdrr.io/schema/changelog-v2
change_id: 1350
title: Compact source extraction batches
intent:
  problem: Source extraction repeated block-specific cursor lists in each otherwise identical question
    contract, reducing the amount of useful work that fit into provider batches.
  goal: Share stable extraction instructions once per batch while retaining digest-bound cursor candidates
    and strict per-block answer validation.
