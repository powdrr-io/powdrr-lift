schema: https://powdrr.io/schema/changelog-v2
change_id: 1351
title: Split verification evidence execution and acceptance
intent:
  problem: Verification execution and evidence artifact writes were mixed with service acceptance policy
    in legacy application modules, and the runner depended directly on service obligation types.
  goal: Keep provider execution and evidence materialization in the local agent, represent evidence through
    public contracts, and perform freshness and acceptance decisions in service policy without changing
    serialized evidence behavior.
