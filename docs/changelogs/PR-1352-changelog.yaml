schema: https://powdrr.io/schema/changelog-v2
change_id: 1352
title: Increase planning throughput safely
intent:
  problem: Large plans spend several minutes waiting for sequential provider requests, and high-concurrency
    runs exposed weak source-citation examples and duplicate runtime records.
  goal: Raise default planning concurrency based on a passing live run, clarify multi-requirement source
    citations, and emit runtime facts in the unique form required by manifest validation.
