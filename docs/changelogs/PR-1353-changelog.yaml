change_id: 1353
title: Reduce duplicate planning structural review context
intent:
  problem: Structural review repeated every planned write in both its unit facts and its individual path facts, increasing request size.
  goal: Remove the duplicated write payload while preserving the path evidence and binding the complete unit data to the question digest.
