schema: https://powdrr.io/schema/changelog-v2
change_id: 1354
title: Increase source extraction batch throughput safely
intent:
  problem: Source extraction consumed most planning calls while shared batch and input limits prevented small independent questions from fitting together.
  goal: Raise only the source extraction batch and aggregate input bounds, preserve individual question validation, and report per-kind batch maxima.
