entities:
- id: build_extract_requirements_request
  type: Function
  action: added
- id: SourceLedgerQuestionMachine
  type: Class
  action: added
- id: parse_work_unit_proposal
  type: Function
  action: added
- id: planning-quality-regression-tests
  type: Test suite
  action: added
entity_relationships:
- id: planning-tests-verify-evidence-compilation
  type: verifies
  source: planning-quality-regression-tests
  target: SourceLedgerQuestionMachine
  action: added
  description: Regression tests verify searched evidence remains available through accepted coverage and
    plan compilation.
invariants:
- id: extraction-stays-within-active-cursor
  description: Each extraction page cites only the target block's unprocessed source range and does not
    re-emit already accepted obligations.
  action: added
- id: searched-evidence-reaches-compiled-plan
  description: Evidence found by pinned repository search is included in the compiled evidence catalog
    used to validate coverage references.
  action: added
- id: complete-coverage-has-sufficient-evidence
  description: Complete coverage requires an execution receipt or relevant implementation/configuration
    and test evidence.
  action: added
- id: work-unit-proposals-are-individually-answered
  description: Work-unit proposal questions are not batched, preventing omission of a requested proposal
    member.
  action: added
guidance:
- id: split-runtime-mixed-proposals
  description: When a proposal spans multiple implementation runtimes, split it into separate proposals
    and assign each requirement to the proposal that cites its source anchors.
  action: added
