schema: https://powdrr.io/schema/changelog-v2
change_id: 1357
title: Fix planning source and evidence quality failures
intent:
  problem: Live planning exposed repeated source extraction, incomplete evidence handoff, and ambiguous
    work-unit proposal failures.
  goal: Keep source extraction cursor-scoped, carry pinned repository evidence through planning compilation,
    and make proposal validation failures actionable.
