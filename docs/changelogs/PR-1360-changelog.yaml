schema: https://powdrr.io/schema/changelog-v2
change_id: 1360
title: Preserve source PR phases in generated plans
intent:
  problem: Explicit PR sequencing in an implementation plan was lost when the planner converted source
    requirements into work units, producing many ready workflows with missing dependencies.
  goal: Carry source-declared phases through work-unit planning, persist their metadata, and compile their
    sequencing into explicit dependencies that block workflows in source order.
human-decisions: []
structured_files: []
