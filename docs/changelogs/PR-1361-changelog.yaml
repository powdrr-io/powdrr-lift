change_id: 1361
title: Parse all-prior PR dependencies
intent:
  problem: The source plan's final phase says "All prior PRs", which the phase parser rejected instead of expanding into dependencies on every earlier phase.
  goal: Accept that documented wording so phase-aware planning can preserve the final release phase's dependency edges.
human-decisions: []
structured_files: []
files:
  - path: packages/service/src/powdrr_service/planning/source.py
    type: modified
    span: {start_line: 689, end_line: 689}
    summary: Parse "All prior PRs" as a dependency on every earlier implementation phase.
    rationale: Match the source plan's explicit dependency wording and keep the final phase blocked until its prerequisites complete.
  - path: tests/test_planning_source.py
    type: modified
    span: {start_line: 163, end_line: 163}
    summary: Exercise the exact "All prior PRs" table value and its expanded dependency set.
    rationale: Prevent future planning runs from rejecting the repository's implementation sequence.
