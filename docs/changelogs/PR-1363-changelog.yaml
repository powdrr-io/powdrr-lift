schema: https://powdrr.io/schema/changelog-v2
change_id: 1363
title: Bound evidence in work-unit questions
intent:
  problem: Repository evidence can make a work-unit proposal question exceed the planner's 24,000-character input limit even when the requirement group is already small.
  goal: Bound per-requirement evidence context while retaining one search-ranked record of each available evidence kind.
human-decisions: []
structured_files: []
files:
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 8, end_line: 8}
    summary: Import the iterable type used by deterministic evidence selection.
    rationale: Accept evidence values from both per-requirement sequences and the fallback catalog.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 44, end_line: 44}
    summary: Set the work-unit prompt evidence limit to four records per requirement.
    rationale: Bound repository context before serializing a proposal question.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 792, end_line: 794}
    summary: Select bounded per-requirement evidence when building a work-unit proposal request.
    rationale: Keep implementation, configuration, test, and receipt context without repeating lower-ranked evidence.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 797, end_line: 799}
    summary: Apply the evidence bound to the fallback catalog as well.
    rationale: Keep questions bounded when evidence is not grouped by requirement.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 1033, end_line: 1046}
    summary: Add deterministic search-ranked evidence selection for bounded work prompts.
    rationale: Retain one record of each available kind per requirement.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 9, end_line: 9}
    summary: Import the work-unit evidence bound for regression assertions.
    rationale: Keep the selection limit visible in the question test.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 34, end_line: 38}
    summary: Import question serialization helpers for the input-size regression.
    rationale: Validate the assembled request against the planner's actual size limit.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 582, end_line: 657}
    summary: Verify four requirements with eight evidence records each remain within the question input limit and retain all available evidence kinds.
    rationale: Prevent source plans with broad repository matches from blocking at work-unit proposal generation.
entities:
  - id: work-unit-evidence-selection
    type: Function
    action: added
  - id: bounded-work-unit-evidence-regression
    type: Regression test
    action: added
entity_relationships:
  - id: regression-verifies-work-unit-evidence-selection
    type: verifies
    source: bounded-work-unit-evidence-regression
    target: work-unit-evidence-selection
    action: added
    description: The test confirms bounded context preserves each evidence kind and stays under the input limit.
invariants:
  - id: work-unit-evidence-context-is-bounded
    description: Each work-unit requirement contributes at most one search-ranked evidence record per evidence kind.
    action: added
guidance: []
