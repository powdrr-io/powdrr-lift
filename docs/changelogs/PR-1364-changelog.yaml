schema: https://powdrr.io/schema/changelog-v2
change_id: 1364
title: Plan code analysis artifacts and scoped project queries
intent:
  problem: Static analysis output is retained as opaque text and current project navigation is Python-specific, making it difficult for the planner and user to distinguish actionable findings from setup noise or ask bounded questions about project structure.
  goal: Define a staged, language-neutral analysis artifact and query interface that feeds compact, revision-bound evidence to the planner while preserving complete underlying results.
