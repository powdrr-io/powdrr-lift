change_id: 1364
title: Plan revision-pinned code-symbol evidence for planning
intent:
  problem: Planning uses transient BasedPyright symbol and reference results, so questions about existing code and candidate paths lack shared artifact reuse and durable evidence provenance.
  goal: Define and stage only the Python symbol-artifact and scoped-query work needed by current planning callers, with explicit revision, coverage, replay, and verification behavior.
