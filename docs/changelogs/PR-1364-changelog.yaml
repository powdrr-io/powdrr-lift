files:
  - path: docs/plans/code-analysis-artifacts-and-scoped-queries.md
    type: added
    span: {start_line: 1, end_line: 558}
    summary: Specify a Structrr-owned code-symbol YAML index, revision-pair symbol diffs for reviewers, analysis findings, scoped queries, baseline comparison, and planner integration.
    rationale: Let planning and review use revision-pinned symbol/location evidence while keeping generated indexes separate from authoritative source and the compact Structrr snapshot.
