    type: added
    span: {start_line: 1, end_line: 391}
    summary: Specify the planning-only Python symbol index, Structrr artifact reference, bounded symbol/reference queries, caller migration, evidence journaling, reuse, and end-to-end verification.
    rationale: Let current planning flows reuse revision-pinned symbol/location evidence and cite exactly what informed their plans, without expanding this work into diagnostics, reviewer changes, or other languages.
