schema: https://powdrr.io/schema/changelog-v2
change_id: 1365
title: Allow requirements across runtime-specific work units
intent:
  problem: The planner can propose mixed-runtime work units, and data or template paths can be mistaken for files needing an implementation runtime.
  goal: Partition mixed-runtime proposals deterministically, recognize fixture binaries and known configuration templates, and retain evidence requirements for ambiguous paths.
human-decisions: []
structured_files: []
files:
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 1105, end_line: 1111}
    summary: Clarify that one requirement may be repeated across separate runtime-specific work-unit proposals.
    rationale: Let the planner split a requirement spanning multiple runtimes without combining those runtimes in one unit.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 549, end_line: 549}
    summary: Begin normalizing each parsed proposal into one or more runtime-specific work units.
    rationale: Enforce runtime boundaries deterministically after proposal generation.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 551, end_line: 553}
    summary: Flatten normalized runtime-specific proposals into the accepted work-unit page.
    rationale: Keep requirement coverage and cursor handling consistent after deterministic splitting.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 26, end_line: 26}
    summary: Import the work-unit page parser used by the mixed-runtime regression.
    rationale: Exercise deterministic splitting through the production parser path.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 184, end_line: 224}
    summary: Verify one mixed-runtime response becomes separate work units that jointly cover the requirement.
    rationale: Prevent a valid multi-runtime plan from blocking after the model fails to follow runtime-splitting guidance.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 632, end_line: 741}
    summary: Split mixed proposals by runtime and assign requirements using their cited source refs.
    rationale: Avoid repeated LLM correction failures while retaining the existing single-runtime invariant for each work unit.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 762, end_line: 765}
    summary: Inspect the underlying payload suffix for template paths.
    rationale: Preserve deterministic language inference when source files have an added template suffix.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 767, end_line: 775}
    summary: Keep fixture binaries and recognizable configuration templates runtime-neutral; infer known payload languages and retain evidence checks for ambiguous templates.
    rationale: Avoid unnecessary runtime questions without treating every template or binary path as language-neutral.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 237, end_line: 267}
    summary: Verify non-fixture binaries and unknown templates remain evidence-bound while source templates inherit a known runtime.
    rationale: Keep deterministic classification limited to recognizable data and template paths.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 295, end_line: 296}
    summary: Add binary fixture and CODEOWNERS template paths to runtime-neutral cases.
    rationale: Ensure the planner can propose these non-language data artifacts without runtime errors.
entities:
  - id: work-unit-proposal-builder
    type: Function
    action: added
  - id: runtime-specific-requirement-coverage-regression
    type: Regression test
    action: added
  - id: mixed-runtime-proposal-splitter
    type: Function
    action: added
entity_relationships:
  - id: regression-verifies-runtime-specific-coverage
    type: verifies
    source: runtime-specific-requirement-coverage-regression
    target: mixed-runtime-proposal-splitter
    action: added
    description: The regression checks that one mixed-runtime model proposal becomes runtime-homogeneous units with exact requirement coverage.
invariants:
  - id: work-units-have-one-implementation-runtime
    description: A work unit contains writes for at most one implementation runtime; one requirement may be represented in more than one runtime-specific unit.
    action: altered
