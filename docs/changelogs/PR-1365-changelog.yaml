    type: modified
    span: {start_line: 1105, end_line: 1111}
    summary: Clarify that one requirement may be repeated across separate runtime-specific work-unit proposals.
    rationale: Let the planner split a requirement spanning multiple runtimes without combining those runtimes in one unit.
  - path: packages/service/src/powdrr_service/planning/assembly.py
