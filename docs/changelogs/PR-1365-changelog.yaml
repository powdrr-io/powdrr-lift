invariants:
  - id: work-units-have-one-implementation-runtime
    description: A work unit contains writes for at most one implementation runtime; one requirement may be represented in more than one runtime-specific unit.
    action: altered
  - id: dependencies-respect-source-phase-order
    description: Inferred dependency candidates may connect source implementation phases only in their declared order; same-phase ordering is supplied deterministically.
    action: added
