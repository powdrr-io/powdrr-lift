schema: https://powdrr.io/schema/changelog-v2
change_id: 1365
title: Bound planning work units and structural queries
intent:
  problem: The planner can propose mixed-runtime work units, mistake data or template paths for implementation languages, infer dependencies that contradict a source plan's PR sequence, and build structural questions larger than the accepted input limit.
  goal: Partition mixed-runtime proposals and oversized structural queries deterministically, classify known data and template paths safely, and preserve source-declared dependency order during dependency discovery.
human-decisions: []
structured_files: []
