schema: https://powdrr.io/schema/changelog-v2
change_id: 1367
title: Bound plan publication and structural baseline queries
intent:
  problem: Large planning runs can exceed the provider question limit when a single planned write has a large baseline subject index, and can exceed GitHub's pull request body limit when the dependency graph is large. A failed plan publication can also leave the repository checked out on an unsubmitted generated plan branch, preventing clean resume.
  goal: Partition oversized baseline subject indexes without dropping records, keep generated plan pull request bodies concise, and restore the pinned base checkout after failed publication or before resuming a clean failed generated plan.
human-decisions: []
structured_files: []
