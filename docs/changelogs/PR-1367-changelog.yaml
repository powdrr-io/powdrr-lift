schema: https://powdrr.io/schema/changelog-v2
change_id: 1367
title: Persist revision-pinned code symbols for planning
intent:
  problem: Planning callers receive transient BasedPyright results, so the code evidence
    used to choose work paths is not consistently reusable or available from a clean
    checkout.
  goal: Persist deterministic Python symbol indexes as checked-in Structrr artifacts
    and route both planning entry points through bounded, provenance-aware queries.
human-decisions: []
structured_files: []
files:
- path: docs/plans/code-analysis-artifacts-and-scoped-queries.md
  type: modified
  summary: Clarify that content-addressed symbol artifacts are checked in, while ignored
    Powdrr cache files hold only local lookup metadata.
  rationale: Make source-tree digest reuse explicit so adding a tracked artifact does
    not force a redundant index build at the next commit.
  span:
    start_line: 27
    end_line: 34
