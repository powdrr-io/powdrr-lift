schema: https://powdrr.io/schema/changelog-v2
change_id: 1370
title: Carry planning symbol evidence through proposals
intent:
  problem: Planning symbol queries produce revision-pinned evidence, but selected
    symbol and file candidates can be dropped during deterministic proposal reconstruction,
    and query provenance is not retained in serialized proposals.
  goal: Preserve accepted symbol-backed candidates and their query provenance through
    structural binding, proposal compilation, and persisted proposal artifacts, with
    end-to-end coverage.
human-decisions: []
structured_files: []
