  type: modified
  span:
    start_line: 85
    end_line: 85
  summary: Carry symbol query provenance through deterministic planning subjects and
    include accepted candidates in proposal reconstruction.
  rationale: Keep symbol-backed planned subjects and the selected files in the compiled
    proposal so the plan reflects the evidence the planner considered.
