schema: https://powdrr.io/schema/changelog-v2
change_id: 1372
title: Preserve ambiguous symbols and new planned paths
intent:
  problem: Same-named declarations in different files can collide in the symbol artifact,
    and a newly planned file path can be omitted from the compiled Structrr proposal.
  goal: Give each source declaration a path-disambiguated stable identity, retain
    new planned file operations in the proposal, and prove these behaviors through
    end-to-end and artifact-freshness tests.
human-decisions: []
structured_files: []
