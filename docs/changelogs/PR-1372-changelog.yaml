- path: packages/service/src/powdrr_service/planning/driver.py
  type: modified
  span:
    start_line: 2314
    end_line: 2314
  summary: Include deterministic planned-file operations in the compiled proposal
    operation list.
  rationale: Ensure newly planned source paths are present in the persisted Structrr
    projection.
- path: packages/service/src/powdrr_service/structrr/code_symbols.py
  type: modified
  span:
    start_line: 398
    end_line: 398
  summary: Disambiguate symbol IDs using their repository-relative path.
  rationale: Allow distinct same-named declarations in different files to coexist
    in one validated artifact.
- path: tests/test_planning_evidence.py
  type: modified
  span:
