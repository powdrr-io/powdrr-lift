schema: https://powdrr.io/schema/changelog-v2
change_id: 1373
title: Journal planning symbol evidence
intent:
  problem: Planning proposal artifacts retain symbol provenance, but the durable planning
    journal records only question identities and input digests, leaving the exact
    code evidence used by each question unavailable for inspection.
  goal: Record compact code-evidence references with accepted and needs-answer checkpoints,
    and bind question replay to the evidence used to form its input.
