schema: https://powdrr.io/schema/changelog-v2
change_id: 1374
title: Report partial code-symbol coverage to planning
intent:
  problem: The code-symbol builder marked an artifact complete when its provider omitted source paths.
    Planning then saw empty symbol results without knowing whether a path had no declarations, had not
    yet been added to the source snapshot, or could not be indexed.
  goal: Record indexed and unindexed paths in the checked-in artifact, pass scoped coverage into structural
    planning questions, and persist that coverage with the question checkpoint so incomplete analysis
    is visible and replay-safe.
