schema: https://powdrr.io/schema/changelog-v2
change_id: 1375
title: Surface symbol coverage across planning search paths
intent:
  problem: Requirement searches and GitHub issue planning consume the shared code-symbol artifact but
    can lose its coverage status. A missing match could then be treated as evidence of absent code even
    when the symbol provider skipped files or failed.
  goal: Carry complete, partial, and failed symbol-index coverage through both planning search paths,
    bind requirement assessment to explicit repository-search completion, and retain that coverage in
    planning checkpoints.
human-decisions: []
structured_files: []
