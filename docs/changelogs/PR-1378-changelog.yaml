schema: https://powdrr.io/schema/changelog-v2
change_id: 1378
title: Preserve code-symbol evidence in generated issue plans
intent:
  problem: GitHub issue planning uses revision-pinned symbol evidence to select and reconcile work, but discarded artifact and query references before serializing the execution plan.
  goal: Attach bounded, validated symbol evidence references to plan items whose allowed paths include the evidence, and retain those references through YAML round trips and plan repairs.
human-decisions: []
structured_files: []
files:
  - path: packages/service/src/powdrr_service/planning/plan_models.py
    type: modified
    span:
      start_line: 26
      end_line: 26
    summary: Add a typed collection of code-evidence references to each planned work item.
    rationale: Keep artifact-backed provenance in the service-owned plan model.
  - path: packages/service/src/powdrr_service/planning/plan_document.py
    type: modified
    span:
      start_line: 19
      end_line: 33
    summary: Define exact fields and digest formats for code-evidence references.
    rationale: Identify the source revision, Structrr snapshot, artifact, query, symbol, location, and coverage state.
  - path: packages/service/src/powdrr_service/planning/plan_document.py
    type: modified
    span:
      start_line: 88
      end_line: 93
    summary: Permit code-evidence references as an optional execution-plan item field.
    rationale: Keep older plans valid while adding provenance to newly generated plans.
  - path: packages/service/src/powdrr_service/planning/plan_document.py
    type: modified
    span:
      start_line: 141
      end_line: 145
    summary: Parse validated code-evidence references into planned work items.
    rationale: Retain evidence in the typed plan after loading YAML.
  - path: packages/service/src/powdrr_service/planning/plan_document.py
    type: modified
    span:
      start_line: 151
      end_line: 157
    summary: Require evidence paths to remain inside each item's allowed paths.
    rationale: Prevent references from being attached to work items outside their scope.
  - path: packages/service/src/powdrr_service/planning/plan_document.py
    type: modified
    span:
      start_line: 218
      end_line: 221
    summary: Serialize code-evidence references in execution-plan YAML.
    rationale: Preserve query provenance in checked-in plans.
  - path: packages/service/src/powdrr_service/planning/plan_document.py
    type: modified
    span:
      start_line: 233
      end_line: 327
    summary: Validate reference bounds, uniqueness, artifact digests, revisions, and repository-relative locations.
    rationale: Ensure persisted references are complete, bounded, and safe to resolve.
  - path: packages/service/src/powdrr_service/planning/repair_service.py
    type: modified
    span:
      start_line: 434
      end_line: 443
    summary: Carry existing evidence references through plan-item repairs when paths remain in scope.
    rationale: Keep provenance when item descriptions are repaired.
  - path: packages/service/src/powdrr_service/planning/repair_service.py
    type: modified
    span:
      start_line: 475
      end_line: 486
    summary: Check evidence paths against allowed paths during repair.
    rationale: Avoid retaining references outside the repaired item's scope.
  - path: src/powdrr_lift/workrr/github_issue_plan_generation.py
    type: modified
    span:
      start_line: 1069
      end_line: 1073
    summary: Allow repository code inspection to collect artifact-backed evidence alongside model context.
    rationale: Reuse provenance returned by the shared Structrr query path.
  - path: src/powdrr_lift/workrr/github_issue_plan_generation.py
    type: modified
    span:
      start_line: 1172
      end_line: 1176
    summary: Collect each distinct symbol evidence reference from bounded query results.
    rationale: Retain stable provenance without asking the model to format identifiers.
  - path: src/powdrr_lift/workrr/github_issue_plan_generation.py
    type: modified
    span:
