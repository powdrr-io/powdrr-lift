      start_line: 1921
      end_line: 1921
    summary: Collect evidence during draft-item symbol inspection.
    rationale: Associate final items with evidence used to inspect their paths.
  - path: src/powdrr_lift/workrr/github_issue_plan_generation.py
    type: modified
