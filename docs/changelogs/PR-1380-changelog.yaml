  type: added
  span: {start_line: 1, end_line: 139}
  summary: Normalize failure signatures and identify runner-provisioning rejections that occurred before steps or runner assignment.
  rationale: Route the observed unsupported-runner case to a GitHub Actions-specific path without implying that a replacement label or owner is known.
