schema: https://powdrr.io/schema/changelog-v2
change_id: 1380
title: Add deterministic CI response observations
intent:
  problem: Failed pull-request checks may provide no job steps or runner logs when GitHub rejects runner provisioning. Powdrr needs to preserve current-head evidence and distinguish that platform failure from a locally executable failure.
  goal: Add a Procedrr entry point and CLI action that collect exact-head GitHub Actions jobs and annotations, classify known pre-runner rejections deterministically, and append a bounded idempotent checkpoint to the associated issue. Provide a pinned disposable-worktree command capability and conservative failure-signature comparison for the next response stages.
human-decisions: []
structured_files: []
