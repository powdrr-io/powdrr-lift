invariants:
- id: ci-repair-is-pinned-to-one-head-and-failure
  description: A repair prompt is emitted only when the failure ID and exact head match the service contract.
  action: added
- id: comparable-local-green-means-actions-specific-guidance
  description: A comparable local non-reproduction explicitly tells MiniSWE to treat the issue as GitHub Actions specific; an incomparable run is not described as a non-reproduction.
  action: added
- id: ci-research-is-bounded-and-official
  description: CI research creates no more than two focused searches, selects no more than three HTTPS documentation sources, and accepts only docs.github.com as the source host.
  action: added
- id: protected-worker-paths-are-enforced
  description: Changes to declared protected paths result in a policy-denied coding-agent attempt even when the path is within the broader allowed path scope.
  action: added
