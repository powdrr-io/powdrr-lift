  rationale: Give service callers the typed repair boundary.
- path: packages/service/src/powdrr_service/ci_response/__init__.py
  type: modified
  span: {start_line: 29, end_line: 32}
  summary: Export CI repair prompt, patch gate, and bounded research functions.
  rationale: Keep consumers on the public service package interface.
- path: packages/service/src/powdrr_service/ci_response/repair.py
  type: added
  span: {start_line: 1, end_line: 187}
  summary: Pin each repair to one failure and exact PR head, compile reproduction-aware MiniSWE guidance, and reject obvious test or verification weakening.
  rationale: Prevent broad or stale repair requests and deterministic ways of making CI green without fixing the failure.
- path: packages/service/src/powdrr_service/ci_response/research.py
  type: added
  span: {start_line: 1, end_line: 114}
  summary: Generate at most two focused GitHub Actions searches and select at most three HTTPS sources from docs.github.com.
  rationale: Ground workflow and runner guidance in bounded, official sources without guessing replacement configuration.
- path: packages/service/src/powdrr_service/resources/processes/execute-ci-repair.yaml
  type: added
  span: {start_line: 1, end_line: 31}
  summary: Add a typed Procedrr process that sends one prepared repair request through the coding-agent capability.
  rationale: Keep repair work in the existing agent execution boundary and make one dispatch explicit.
