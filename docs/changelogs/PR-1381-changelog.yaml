schema: https://powdrr.io/schema/changelog-v2
change_id: 1381
title: Add scoped CI repair policy and research
intent:
  problem: The first CI response stage records failures but does not yet give a coding worker an evidence-bound repair request or prevent edits to protected verification paths.
  goal: Define service-owned single-failure repair contracts and MiniSWE instructions, bound external research to official GitHub Actions documentation, and let the generic coding-agent boundary reject changes to explicitly protected paths.
human-decisions: []
structured_files: []
files:
- path: docs/architecture/agent-service-module-ownership.json
  type: modified
  span: {start_line: 3968, end_line: 4015}
  summary: Assign CI repair policy and research to the service and worker enforcement and dispatch to the agent.
  rationale: Keep proprietary diagnosis and prompting in the service while the agent enforces scope and executes the prepared repair.
- path: packages/service/src/powdrr_service/ci_response/__init__.py
  type: modified
  span: {start_line: 10, end_line: 14}
  summary: Import the CI repair contract, prompt compiler, and patch validator.
  rationale: Expose service policy through the CI response package.
- path: packages/service/src/powdrr_service/ci_response/__init__.py
  type: modified
  span: {start_line: 16, end_line: 19}
  summary: Import focused GitHub Actions research policy.
  rationale: Make bounded source selection available beside CI response policy.
- path: packages/service/src/powdrr_service/ci_response/__init__.py
  type: modified
  span: {start_line: 27, end_line: 27}
