entities:
- id: planned-pr-ci-observation
  type: Workflow
  action: added
- id: issue-ci-outcome-checkpoint
  type: Function
  action: added
- id: awaiting-ci-continuation
  type: Function
  action: added
- id: ci-outcome-queue-regression-tests
  type: Regression test
  action: added
- id: respond-to-pr-ci
  type: Workflow
  action: added
entity_relationships:
- id: planned-pr-invokes-ci-observation
  type: invokes
  source: planned-pr-ci-observation
  target: respond-to-pr-ci
  action: added
  description: Both implementation PR publication and plan-amendment PR publication trigger the same observation
    process with explicit repository, issue, and PR URL inputs.
- id: issue-checkpoint-drives-queue-state
  type: drives
  source: issue-ci-outcome-checkpoint
  target: awaiting-ci-continuation
  action: added
  description: Current required-check evidence stored on the issue determines whether execution waits for CI, awaits
    review, or remains blocked.
invariants:
- id: review-requires-current-required-checks
  description: A plan issue enters awaiting-review only when GitHub reports all required checks passing for the
    current PR head.
  action: added
- id: pending-ci-is-resumable
  description: Pending required checks produce an awaiting-ci issue that can be rechecked through github-issue-worker-continue.
  action: added
- id: task-checkpoint-is-durable-on-issue
  description: Each workflow task checkpoint is appended to the associated GitHub issue and can be deduplicated
