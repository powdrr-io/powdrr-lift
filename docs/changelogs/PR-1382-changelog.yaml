schema: https://powdrr.io/schema/changelog-v2
change_id: 1382
title: Integrate CI response with PR execution and issue state
intent:
  problem: A published implementation PR could be marked ready for review from a successful worker exit even when
    its required checks were pending or failed, and the CI response process was not connected to planned PR execution.
  goal: Run the existing observation process after each published plan PR, persist task and CI outcome checkpoints
    on the tracking issue, and only move work to review after current required checks pass.
human-decisions: []
