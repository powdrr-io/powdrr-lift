schema: https://powdrr.io/schema/changelog-v2
change_id: 1383
title: Reproduce CI failures at the pinned PR head
intent:
  problem: The CI response workflow recorded failures but did not run the task's declared verification command against
    the exact PR commit.
  goal: Run that command once in an isolated pinned worktree, record conservative per-failure comparisons durably,
    and avoid treating unmatched or generic step labels as proof that CI-only behavior occurred.
human-decisions: []
structured_files: []
