  type: modified
  span:
    start_line: 36
    end_line: 39
  summary: Bind reproduction receipts into checkpoint identity and record outcome reasons and output hashes.
  rationale: A reproduction update must create a distinct durable issue checkpoint without exposing raw command
    output.
