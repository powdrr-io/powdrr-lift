schema: https://powdrr.io/schema/changelog-v2
change_id: 1384
title: Compile scoped CI repair requests with platform evidence
intent:
  problem: CI repair policy and GitHub Actions research existed as separate helpers without a service compiler joining one failure, its local reproduction, the PR diff, and captured platform evidence into a worker request.
  goal: Compile a fingerprinted MiniSWE request restricted to a small set of non-test files in the observed PR diff, and provide bounded, mockable official-document research for one GitHub Actions failure.
human-decisions: []
structured_files: []
