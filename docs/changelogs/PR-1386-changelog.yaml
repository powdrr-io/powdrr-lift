schema: https://powdrr.io/schema/changelog-v2
change_id: 1386
title: Checkpoint CI prerequisites and retry scoped repairs
intent:
  problem: The CI repair process stopped at human prerequisites without using Powdrr's
    durable continuation checkpoint, and it rejected repair attempts without a bounded
    correction cycle.
  goal: Route manual CI setup through the existing durable handoff and continue only
    after the prerequisite is completed; retry one scoped repair using deterministic
    validation findings and publish only a validated result.
human-decisions: []
structured_files: []
