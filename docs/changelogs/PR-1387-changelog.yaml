schema: https://powdrr.io/schema/changelog-v2
change_id: 1387
title: Repair unsupported runner configuration in the observed workflow
intent:
  problem: The CI response flow treated an unsupported runner label in a checked-in
    GitHub Actions workflow as a human prerequisite and restricted repair targets to
    files already changed by the implementation PR.
  goal: Deterministically route that failure to a narrowly scoped repair of the
    workflow reported by GitHub, even when it is outside the implementation PR's
    original diff, while keeping other repair paths constrained.
