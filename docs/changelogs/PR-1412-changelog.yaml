schema: https://powdrr.io/schema/changelog-v2
change_id: 1412
title: Publish diagnostics for failed issue-worker tasks
intent:
  problem: The issue worker reported a generic failure when a task runner returned a nonzero status after writing its cause to stderr.
  goal: Include the task runner's bounded stderr diagnostic in the GitHub issue failure comment while continuing to stream it to the worker's terminal.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/workrr/pr_execution_session.py
    type: modified
    span:
      start_line: 24
      end_line: 53
    summary: Add a bounded stderr tee and typed error for returned task failures.
    rationale: Preserve the task runner's reason when it returns a failure code instead of raising.
  - path: src/powdrr_lift/workrr/pr_execution_session.py
    type: modified
    span:
      start_line: 121
      end_line: 125
    summary: Start capturing stderr while forwarding output to the caller.
    rationale: Retain diagnostics without hiding live task output.
  - path: src/powdrr_lift/workrr/pr_execution_session.py
    type: modified
    span:
      start_line: 136
      end_line: 136
    summary: Send task stderr through the capture stream.
    rationale: Make the runner's failure text available to the issue queue.
  - path: src/powdrr_lift/workrr/pr_execution_session.py
    type: modified
    span:
      start_line: 138
      end_line: 141
    summary: Raise a typed failure containing the status and captured stderr for nonzero task results.
    rationale: Route returned failures through the queue's existing exception detail reporting.
  - path: tests/test_pr_execution_session.py
    type: modified
    span:
