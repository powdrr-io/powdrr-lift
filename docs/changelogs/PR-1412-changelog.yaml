entity_relationships: []
invariants:
  - id: nonzero-task-status-includes-stderr-diagnostic
    action: added
    description: A nonzero task-runner result is reported with up to the trailing 4,000 characters of stderr, or an explicit message when stderr is empty.
    rationale: Make returned failures diagnosable from the issue checkpoint without losing live terminal output.
