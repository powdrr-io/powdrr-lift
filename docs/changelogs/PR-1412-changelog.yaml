  - path: tests/test_pr_execution_session.py
    type: modified
    span:
      start_line: 7
      end_line: 8
    summary: Import pytest for asserting the typed task failure.
    rationale: Exercise nonzero task results at the adapter boundary.
  - path: tests/test_pr_execution_session.py
    type: modified
    span:
      start_line: 13
      end_line: 13
    summary: Import the task failure type raised for nonzero results.
    rationale: Assert that returned task failures include their diagnostic.
  - path: tests/test_pr_execution_session.py
    type: modified
    span:
      start_line: 113
      end_line: 161
    summary: Verify a nonzero task result raises with its stderr diagnostic while stderr remains visible to the caller.
    rationale: Guard the failure reporting behavior at the task session boundary.
  - path: tests/test_github_issue_queue.py
    type: modified
    span:
      start_line: 1426
      end_line: 1426
    summary: Assert that exception details appear in the failure comment posted to the issue.
    rationale: Preserve coverage that the queue publishes task failure details rather than only marking the item blocked.
entities:
  - id: issue-task-failure-diagnostics
    type: Feature
