schema: https://powdrr.io/schema/changelog-v2
change_id: 1413
title: Allow bounded supporting edits across files
intent:
  problem: The coding-agent policy rejects useful small supporting edits outside the
    planned path set when they touch more than two files.
  goal: Permit supporting edits across any number of existing text files when their
    combined additions and deletions stay within the existing 20-line budget, and
    preserve that decision through later review and checkpoints.
