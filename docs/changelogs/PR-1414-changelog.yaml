- id: structrr-required-discrepancies-remain-blocking
  action: added
  description: Required source-design discrepancies remain blocking after correction
    exhaustion until source is corrected or the design is explicitly amended.
  rationale: Exhausting implementation retries does not change intended meaning.
- id: structrr-agreement-requires-current-evidence
  action: added
  description: Required design subjects are satisfied only by supported source checks
    or evidence bound to the current handoff and candidate content.
  rationale: Declarations and stale results do not prove implementation agreement.
