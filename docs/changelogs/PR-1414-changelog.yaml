schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1414
title: Make Structrr a portable desired source design contract
intent:
  problem: Design changes can lose meaning or rationale during coding handoff, and
    unresolved structural changes can be waived after retries.
  goal: Preserve intended source design and its reasons in a replayable handoff and
    require current evidence of agreement.
