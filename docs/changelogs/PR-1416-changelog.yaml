- path: packages/service/src/powdrr_service/structrr/reference_catalog.py
  type: added
  span:
    start_line: 1
    end_line: 464
  summary: Compile immutable reference catalogs and resolve exact IDs with lifecycle
    and authority provenance.
  rationale: Prevent candidate overlays, stale inputs, and implicit successor redirection
    from becoming accepted worker context.
- path: packages/service/src/powdrr_service/structrr/reference_definitions.py
  type: added
  span:
    start_line: 1
    end_line: 137
  summary: Define validated immutable canonical records for source-addressable product
    intent.
  rationale: Represent feature and assumption meaning explicitly before enabling their
    catalog adapters.
