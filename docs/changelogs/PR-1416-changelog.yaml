schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1416
title: Implement frozen Structrr reference catalogs and lifecycle resolution
intent:
  problem: Source readers lack a frozen projection of accepted canonical reference
    meaning, lifecycle history, and authorized amendments.
  goal: Compile immutable revision-bound catalogs and resolve source reference IDs
    without losing intent or confusing authority.
