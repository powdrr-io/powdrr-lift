- id: structrr-frozen-catalog-model-v1
  type: Class
  action: added
- id: structrr-authorized-reference-amendment-model-v1
  type: Class
  action: added
- id: structrr-reference-catalog-compiler-v1
  type: Function
  action: added
- id: structrr-reference-catalog-resolver-v1
  type: Function
  action: added
entity_relationships:
- id: structrr-catalog-compiler-produces-frozen-catalog
  source: structrr-reference-catalog-compiler-v1
  target: structrr-frozen-catalog-model-v1
  relationship: creates
  type: creates
  action: added
  description: The compiler projects accepted definitions and revision-bound authorized
    amendments into a sorted immutable catalog.
  rationale: Give readers stable meaning tied to exact accepted inputs.
- id: structrr-catalog-resolver-reads-frozen-catalog
  source: structrr-reference-catalog-resolver-v1
  target: structrr-frozen-catalog-model-v1
  relationship: uses
  type: uses
  action: added
  description: The resolver returns active, inactive, or unresolved exact-ID outcomes
    from the frozen catalog.
  rationale: Retain lifecycle and successor information without silently redirecting
    references.
invariants:
- id: structrr-reference-catalog-amendments-require-bound-authority
  action: added
  description: Catalog amendments require an explicit caller-authorized envelope bound
    to the exact accepted document and full base commit; replacements advance reference
    versions.
- id: structrr-reference-catalog-inactive-history-is-not-active-context
  action: added
  description: Inactive definitions remain available for diagnostics but never resolve
    as current applicability or redirect implicitly to a successor.
- id: structrr-canonical-definitions-retain-agreement-obligations
  action: added
  description: Active canonical features and invariants require current evidence in
    complete desired-design agreement checks.
