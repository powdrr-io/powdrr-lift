schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1418
title: Deliver verified Structrr context through miniSWE observations
intent:
  problem: MiniSWE cannot yet obtain independently verified accepted context while
    inspecting source in its isolated agent runtime.
  goal: Deliver exact service-owned context through actual model formatting while
    preserving execution and submission behavior.
