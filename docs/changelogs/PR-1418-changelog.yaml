entity_relationships:
- id: structrr-environment-uses-context-bridge
  source: structrr-miniswe-environment-v1
  target: structrr-local-context-bridge-v1
  relationship: uses
  type: uses
  action: added
  description: The agent environment requests observation verification over the local
    bridge.
  rationale: Keep private catalog meaning in the service while executing from the
    isolated agent package.
- id: structrr-context-bridge-uses-observation-session
  source: structrr-local-context-bridge-v1
  target: structrr-source-observation-session-v1
  relationship: uses
  type: uses
  action: added
  description: The bridge delegates reader issuance and independent observation checks
    to the service session.
  rationale: Avoid trusting catalog or context supplied in command output.
invariants:
- id: structrr-observations-require-fresh-service-verification
  action: added
  description: Reader output must match a session-issued request repeated against
    current workspace bytes and the trusted frozen catalog.
- id: structrr-context-survives-source-truncation
  action: added
  description: The session appends exact context after the configured formatter processes
    the original source view.
- id: structrr-submission-artifacts-remain-unchanged
  action: added
  description: Base submission detection passes final artifact content through unchanged
    and records a digest-only event.
