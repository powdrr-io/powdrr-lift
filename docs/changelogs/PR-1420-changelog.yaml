title: Add durable Structrr user story contracts and graph transactions
intent:
  problem: Customer behavior has no durable typed graph that survives Structrr projection
    and repository reload.
  goal: Persist story declarations, stable identities and graph changes without confusing
    design declarations with implementation evidence.
