entity_relationships:
- id: structrr-placement-compiler-creates-handoff
  source: structrr-source-reference-handoff-compiler-v1
  target: structrr-compiled-source-reference-handoff-v1
  relationship: creates
  type: creates
  action: added
  description: The compiler binds one public prompt and private manifest to accepted
    placement and preservation intent.
  rationale: Give coding and validation the same canonical obligations and input identities.
- id: structrr-placement-request-uses-public-prompt
  source: coding-agent-implementation-request-v3
  target: structrr-source-reference-prompt-v1
  relationship: uses
  type: uses
  action: added
  description: Reference-bearing v3 requests retain only the public compiled prompt
    artifact with enforce mode.
  rationale: Prevent private manifest contents from crossing the worker request boundary.
invariants:
- id: structrr-placement-handoff-shares-canonical-contract
  action: added
  description: Prompt and manifest carry the same canonical placement and preservation
    contract; artifact identities also bind private validation input digests.
- id: structrr-semantic-owner-binding-needs-independent-review
  action: added
  description: Semantic selectors retain requires_semantic_review and one_or_more
    cardinality; worker claims do not establish passing ownership.
- id: structrr-reference-requests-cannot-downgrade-or-bypass-rollout
  action: added
  description: Reference-bearing requests require v3 enforce mode and exact compiled
    prompt/scope identities; execution remains denied until placement validation and
    rollout are integrated.
