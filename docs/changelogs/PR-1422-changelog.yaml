schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1422
title: Compile Structrr source placement handoffs and versioned requests
intent:
  problem: Accepted source annotation intent lacks a canonical handoff shared by coding
    prompts and private placement validation.
  goal: Compile exact placement and preservation contracts atomically with immutable
    public prompts and private validation inputs.
human-decisions: []
