entity_relationships:
- id: story-session-uses-semantic-reviewer
  source: structrr-story-interview-session-v1
  target: structrr-story-semantic-reviewer-v1
  relationship: uses
  type: uses
  action: added
  description: The session binds semantic findings to the story, its source and dependency
    digests.
  rationale: Derive readiness from current evidence rather than a generated status.
- id: story-local-adapter-captures-user-response
  source: story-interview-local-adapter-v1
  target: structrr-story-user-response-v1
  relationship: creates
  type: creates
  action: added
  description: The adapter supplies actual synchronous or caller-validated resumed
    input.
  rationale: Keep approval authority outside generated graph metadata.
invariants:
- id: story-confirmation-requires-current-user-channel-evidence
  action: added
  description: Publication requires current semantic review and an actual response
    to the exact displayed contract and context; flags, defaults and benchmark execution
    cannot grant user confirmation.
- id: story-answer-replay-preserves-original-authority
  action: added
  description: Accepted answers retain source references across suspensions; exact
    redelivery is idempotent and conflicting redelivery cannot overwrite the recorded
    answer.
- id: story-publication-preserves-confirmed-artifact-scope
  action: added
  description: Publication checks current dependencies and exact proposal/evidence/seed/declaration
    content and requires every confirmed artifact in scope.
