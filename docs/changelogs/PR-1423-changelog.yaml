schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1423
title: Add interactive Structrr story design and actual-user confirmation
intent:
  problem: Story graphs lack an interactive path preserving real answers and separating
    user authority from generated metadata.
  goal: Draft and amend stories through typed operations, obtain current review and
    exact user confirmation, and publish normal source-linked proposals.
