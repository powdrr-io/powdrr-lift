entity_relationships: []
invariants:
- id: planning-preserves-confirmed-story-ownership
  action: added
  description: Requirement, work unit, item, workflow and proposal story references
    retain current contract, case and dependency pins; missing or changed pins reject
    compilation or execution.
- id: full-story-validation-follows-all-implementation-owners
  action: added
  description: A complete story validation item must depend transitively on every
    implementation owner; planned coverage and partial PR success do not establish
    story verification.
- id: story-amendment-impact-preserves-historical-receipts
  action: added
  description: A changed story reports affected primitives, observations, cases and
    plan items; old receipts remain unchanged historical records and cannot approve
    a changed contract.
guidance: []
