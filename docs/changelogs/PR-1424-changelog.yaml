change_id: PR-1424
title: Allocate confirmed stories through multi-PR planning and amendment impact
intent:
  problem: Confirmed stories can be dropped between source requirements, PR allocation,
    workflow execution and plan repair.
  goal: Preserve exact story and case revisions, require dependent full-story validation,
    and route behavioral amendments through approved design.
