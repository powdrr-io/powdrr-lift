entity_relationships:
- id: structrr-validation-context-uses-source-validator
  source: structrr-reference-validation-context-v1
  target: structrr-source-reference-validator-v1
  relationship: uses
  type: uses
  action: added
  description: The context acquires fresh Git/worktree snapshots and supplies frozen
    private identities to the pure validator.
  rationale: Base source proof on actual candidate bytes and complete attributable
    scope.
- id: structrr-source-validator-produces-reference-report
  source: structrr-source-reference-validator-v1
  target: structrr-reference-validation-report-v1
  relationship: creates
  type: creates
  action: added
  description: The validator emits immutable source-only findings, coverage, and bound
    semantic decisions.
  rationale: Keep ownership/preservation evidence separate from behavioral acceptance.
invariants:
- id: structrr-required-placement-is-direct-owner-bound
  action: added
  description: Required placements use direct exact or independently reviewed owner
    bindings; inherited markers and ID counts cannot satisfy another owner.
- id: structrr-baseline-reference-removal-needs-accepted-authority
  action: added
  description: Changed or deleted baseline bindings must survive or have accepted
    removal, supersession, or independently reviewed relocation.
- id: structrr-source-proof-requires-fresh-complete-evidence
  action: added
  description: Stale inputs, incomplete acquisition, ambiguous or unavailable review,
    and concurrent source mutation block acceptance.
- id: structrr-placement-proof-is-not-behavioral-proof
  action: added
  description: Reference reports never claim behavioral evidence; the reserved reference
    profile cannot replace ordinary required validation profiles.
