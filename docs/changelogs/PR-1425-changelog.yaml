schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1425
title: Validate Structrr source references against frozen placement contracts
intent:
  problem: Source annotation presence and worker claims do not prove correct ownership,
    preserved baseline bindings, or fresh validation inputs.
  goal: Independently validate placements and preservation from authoritative snapshots
    and integrate a distinct source-reference result with existing checks.
