schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1427
title: Enable protected Structrr source reference runs in Workrr
intent:
  problem: Reference-bearing handoffs cannot safely execute without bound private
    authority, verified context delivery, and independent final validation.
  goal: Enable one protected local implementation invocation with immutable inputs
    and separate behavioral and source proof.
human-decisions: []
structured_files: []
