  type: added
  span:
    start_line: 1
    end_line: 81
  summary: Document protected run authority, single invocation, artifacts, supported
    platform, and proof boundaries.
  rationale: Make the initial local rollout and its limits reviewable.
- path: docs/design/structrr-reference-validation.md
  type: modified
  span:
    start_line: 9
    end_line: 13
  summary: Describe protected orchestration and final source validation after behavioral
    commands.
  rationale: Keep the validation contract aligned with implemented execution.
