entities:
- id: structrr-protected-source-run-v1
  type: Class
  action: added
- id: structrr-source-run-terminal-v1
  type: Class
  action: added
- id: structrr-context-delivery-check-v1
  type: Function
  action: added
- id: structrr-source-run-live-smoke-v1
  type: Script
  action: added
entity_relationships:
- id: structrr-protected-run-produces-terminal-v1
  source: structrr-protected-source-run-v1
  target: structrr-source-run-terminal-v1
  relationship: creates
  type: creates
  action: added
  description: Protected execution produces a fingerprinted terminal result with input
    identities and independent validation.
  rationale: Retain attributable evidence for both accepted and failed attempts.
- id: structrr-protected-run-verifies-delivery-v1
  source: structrr-protected-source-run-v1
  target: structrr-context-delivery-check-v1
  relationship: uses
  type: uses
  action: added
  description: The run reconstructs full canonical-context coverage from trusted page
    events.
  rationale: Prevent visible markers and partial reads from claiming delivered context.
invariants:
- id: structrr-source-run-private-inputs-immutable-v1
  action: added
  description: Frozen private inputs are unreadable to worker and validation processes
    and changes invalidate the run.
- id: structrr-source-run-single-enforced-attempt-v1
  action: added
  description: Mandatory references execute once in enforce mode with no repair, resume,
    downgrade, or unprotected fallback.
- id: structrr-source-run-independent-final-proof-v1
  action: added
  description: Acceptance requires complete verified context, no design gaps, behavioral
    success, correct final source ownership, and an unchanged post-worker candidate.
guidance: []
