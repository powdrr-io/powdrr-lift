schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1428
title: Connect finite story cases and assertion links to the existing test author
intent:
  problem: Story cases and their observations lack durable linkage to independently
    authored and actually collected tests.
  goal: Compile finite case coverage and typed assertion links through existing planning,
    MiniSWE authoring, semantic review and correction paths without treating links
    as execution proof.
