- id: structrr-task-source-dispatch-never-repairs-v1
  action: added
  description: Selected source tasks execute once in enforce mode before legacy authoring,
    prompt augmentation, or automatic recovery.
- id: structrr-task-transfer-requires-accepted-snapshot-v1
  action: added
  description: Failed validation or concurrent candidate or caller edits prevent patch
    transfer and preserve caller changes.
