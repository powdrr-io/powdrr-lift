schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1430
title: Dispatch reviewed Structrr source designs through protected Workrr runs
intent:
  problem: Normal task execution rewrites prompts and uses recovery, so it cannot
    safely invoke the immutable source-reference handoff.
  goal: Route reviewed source design tasks through one protected candidate and transfer
    only independently validated source changes.
