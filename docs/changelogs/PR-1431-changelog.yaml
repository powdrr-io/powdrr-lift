invariants:
- id: structrr-linux-private-run-inputs-hidden-v1
  action: added
  description: The Linux worker sees private artifacts through an empty temporary
    mount and cannot access their host contents.
- id: structrr-linux-worker-writes-confined-v1
  action: added
  description: Only candidate and public worker artifact directories are writable;
    the rest of the host filesystem is read-only.
- id: structrr-source-run-no-unprotected-fallback-v1
  action: added
  description: Missing or unusable platform isolation blocks before model invocation.
