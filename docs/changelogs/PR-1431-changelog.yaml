schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1431
title: Add protected Linux execution for Structrr source runs
intent:
  problem: Protected source-reference runs only support macOS, so Linux Workrr hosts
    cannot execute accepted source tasks.
  goal: Add a fail-closed bubblewrap adapter that hides private run inputs, confines
    writes, and disables worker network access.
