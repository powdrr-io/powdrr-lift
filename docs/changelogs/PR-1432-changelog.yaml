schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1432
title: Bind story verification to actual candidate execution and current receipts
intent:
  problem: Passing focused tests and completed partial PRs cannot establish every
    confirmed customer story observation at the current candidate.
  goal: Bind independently authored and semantically reviewed assertion links to actual
    pytest execution, immutable candidate and runtime identities, and explicit current
    coverage through existing worker, feature, artifact and health paths.
