invariants:
- id: story-proof-requires-actual-reviewed-assertion-execution
  action: added
  description: Only a collected test whose actual call and linked assertions execute
    successfully under exact source-bound semantic review can establish a story observation;
    skipped, xfail, unavailable, missing and setup or teardown failure evidence cannot
    pass.
- id: story-receipts-bind-current-contract-candidate-and-runtime
  action: added
  description: Receipts bind story and case references, dependencies, selector and
    source digest, review and execution fingerprints, candidate Git tree, configuration
    and runtime; mismatches remain historical stale results and cannot verify the
    current story.
- id: partial-pr-success-does-not-complete-story
  action: added
  description: Whole-story verification requires every declared case observation and
    reviewed integration justification for unbound steps; assigned PR acceptance and
    design readiness remain separate states.
- id: story-baseline-policy-preserves-agreed-oracle
  action: added
  description: New behavior requires actual behavioral baseline failure or an approved
    observed missing interface; existing-behavior integration may pass baseline. Corrections
    retain the trusted policy and receive fresh source-bound review.
