schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1434
title: Freeze local validation attestation schemas and fixtures
intent:
  problem: The local validation attestation protocol needs stable cross-language wire formats and digest rules before service or signature verification is implemented.
  goal: Define versioned schemas, strict Python and Swift policy parsing, deterministic cryptographic and snapshot vectors, and standalone package verification for the first implementation slice.
human-decisions: []
structured_files: []
files:
