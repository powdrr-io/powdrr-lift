  type: added
  span: {start_line: 1, end_line: 22}
  summary: Explain protocol boundaries, fixtures, and the test-only signing seed.
  rationale: Keep the schema slice's guarantees and limitations explicit.
- path: attestation/examples/attestors.yaml
  type: added
  span: {start_line: 1, end_line: 12}
