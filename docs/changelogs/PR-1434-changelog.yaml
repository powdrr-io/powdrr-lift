invariants:
- id: attestation-policy-digest-binds-original-bytes
  action: added
  description: Policy hashes cover the original bounded UTF-8 YAML bytes, so formatting changes alter the digest even when parsed values match.
- id: attestation-parsers-reject-ambiguous-yaml
  action: added
  description: Policy and registry parsers reject duplicate keys, aliases, custom tags, unknown properties, non-string environment values, and invalid limits.
- id: attestation-digests-match-across-languages
  action: added
  description: Swift and Python implementations produce the same policy, step-definition, and byte-sorted snapshot SHA256 vectors.
- id: attestation-fixture-private-key-is-test-only
  action: added
  description: The deterministic Ed25519 private seed exists only to regenerate test fixtures and is never used by production provider code.
