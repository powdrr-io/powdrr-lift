schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1436
title: Finish Structrr source reference reconciliation
intent:
  problem: Structrr semantic source bindings and code annotations need a bounded,
    auditable reconciliation path that does not infer applicability from either
    artifact alone.
  goal: Compare both representations, record fingerprinted provider decisions,
    apply deterministic metadata edits transactionally, and support bootstrap and
    post-worker reconciliation.
