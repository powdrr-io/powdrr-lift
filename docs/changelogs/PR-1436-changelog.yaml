invariants:
- id: source-link-decisions-bind-exact-inputs-and-provenance
  action: added
  description: A source-link existence decision names one exact canonical reference and owner, binds the complete evidence fingerprint, records provider revisions, and permits only exists, absent, or unresolved results. One configured LLM fallback may run only after an unresolved primary result.
- id: link-apply-rechecks-and-preserves-recoverable-preimages
  action: added
  description: Reconciliation rechecks source and document digests, validates staged reciprocal edges, and records recoverable preimages before publishing edits. A fresh read-only consistency scan follows application.
- id: post-worker-correction-preserves-python-ast-and-frozen-catalog
  action: added
  description: A trusted Workrr correction callback runs after worker finalization and before independent validation. It cannot change Python ASTs or the frozen catalog, and its receipt is recorded separately.
