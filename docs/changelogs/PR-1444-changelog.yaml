title: Archive completed plans and finish Structrr source-reference documentation
intent:
  problem: Completed plans remain mixed with active proposals, and the source-reference plan still reads as unfinished despite all implementation stages being integrated.
  goal: Archive all plans that state their scope is complete, update active links, and document the shipped source-reference implementation and its supported scope.
