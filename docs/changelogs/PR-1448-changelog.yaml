schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1448
title: Complete bootstrap validation Markdown report details
intent:
  problem: Bootstrap Markdown reports omit stable validation IDs and discovery state, and validation evidence IDs can be rendered as broken file links.
  goal: Render the report from the normalized validation inventory with traceable check IDs, discovery coverage, execution and baseline details, and safe relative evidence links.
