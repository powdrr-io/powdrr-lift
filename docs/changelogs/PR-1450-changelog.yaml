  summary: Add discovery summary metadata to the service-backed Structrr JSON summary.
  rationale: Report the validation inventory and probe mode alongside existing snapshot counts.
- path: src/powdrr_lift/cli.py
  type: modified
  span:
    start_line: 5578
    end_line: 5603
  summary: Derive validation check count, discovery status and completeness, unresolved count, and probe mode from the Structrr document.
  rationale: Keep summary metadata consistent across the service-backed and legacy CLI paths.
