change_id: PR-1450
title: Report validation discovery in Structrr CLI summary
intent:
  problem: Structrr bootstrap JSON summaries omit validation discovery completeness, check counts, unresolved items, and whether probes ran.
  goal: Add consistent validation discovery metadata to service-backed and legacy Structrr bootstrap summaries while preserving existing fields.
