change_id: PR-1455
title: Remove orphaned CI repair workflow
intent:
  problem: The CI repair workflow remained registered with code-writing helpers and retry operations after the command was reduced to observation.
  goal: Remove CI repair implementation paths and keep CI observation/reporting without a coding worker.
