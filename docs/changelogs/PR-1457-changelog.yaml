change_id: PR-1457
title: Remove legacy feature correction loop
intent:
  problem: The feature implementation process still launched a second coding phase to correct candidate diffs after review, despite the decision to remove unsupported legacy code-writing routes.
  goal: Remove the automatic correction loop and its helpers while preserving deterministic review and fail-closed handling of unresolved obligations.
