schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1461
title: Track Structrr baseline report freshness
intent:
  problem: Structrr baseline reuse trusts the YAML section shape and may copy a supplied snapshot without its paired report or freshness evidence.
  goal: Bind each reusable baseline to its Markdown report and validation inventory/context, and create those companions whenever a supplied snapshot is copied.
human-decisions: []
structured_files: []
