  type: modified
  span:
    start_line: 5
    end_line: 5
  summary: Import SHA-256 support for baseline artifact digests.
  rationale: Bind freshness metadata to the exact persisted files.
- path: src/powdrr_lift/workrr/feature_endpoint.py
  type: modified
  span: {start_line: 77, end_line: 77}
  summary: Import the canonical Structrr Markdown renderer.
  rationale: Generate the same report format for copied baseline snapshots.
- path: src/powdrr_lift/workrr/feature_endpoint.py
  type: modified
