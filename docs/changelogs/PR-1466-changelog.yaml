schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1466
title: Preserve validation profile runtime context
intent:
  problem: The coding-agent validation handoff reduces discovered profiles to a name and argv, dropping working directory, environment identity, applicability, script details, and other execution context from the runner and its final report.
  goal: Preserve declared profile context in runtime validation and reports, run argv checks in their repository-relative working directory, and keep unsupported shell checks visibly blocked.
