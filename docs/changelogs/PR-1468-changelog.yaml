change_id: PR-1468
title: Complete source-backed behavior closure
intent:
  problem: Placement references resolved to accepted case IDs but the worker contract did not show which scenario each case named, and private source closure dropped accepted evidence provenance.
  goal: Preserve case-to-scenario identity and the accepted provenance needed to review each compiled behavior obligation, with explicit acceptance fixtures for the required behavior classes.
