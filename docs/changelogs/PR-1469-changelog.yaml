title: Preserve validation profile command context
intent:
  problem: Discovered validation declarations lose metadata and argument boundaries as they pass through the Procedrr command catalog and coding-agent runner.
  goal: Carry complete profile context and exact argv through execution, then retain it in the persisted validation report.
