schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1471
title: Bound structural change context for file entities
intent:
  problem: File entity change questions included full work-unit validation lists and sibling writes, which could exceed the planning input limit.
  goal: Keep each file candidate's structural-change context focused on its implementation and matching planned write so planning can continue within the input bound.
human-decisions: []
structured_files: []
files:
- path: packages/service/src/powdrr_service/planning/structrr.py
  type: modified
  span: {start_line: 1099, end_line: 1100}
  summary: Use focused subject facts when describing structural changes for file candidates.
  rationale: Avoid repeating identifiers already carried by the question and its context records.
- path: packages/service/src/powdrr_service/planning/structrr.py
  type: modified
  span: {start_line: 1792, end_line: 1797}
  summary: Recognize file entities by their file identity and derive the matching planned path.
  rationale: Apply the file-specific prompt bound to file entities represented in the entities section.
- path: packages/service/src/powdrr_service/planning/structrr.py
  type: modified
  span: {start_line: 1799, end_line: 1799}
  summary: Apply focused context to file entities as well as file-section subjects.
  rationale: Prevent full validation lists from exceeding the structural question input limit.
- path: packages/service/src/powdrr_service/planning/structrr.py
  type: modified
  span: {start_line: 1812, end_line: 1812}
  summary: Retain only the planned write matching the file candidate.
  rationale: Preserve implementation evidence without including sibling writes.
