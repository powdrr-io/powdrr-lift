schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1473
title: Evaluate validation profile applicability
intent:
  problem: Validation execution ignores discovered event, base-branch, and path filters, so an unresolved or out-of-scope check can be treated like a successful validation.
  goal: Evaluate supported applicability filters using the feature run context, preserve pending and not-applicable outcomes in reports, and keep unknown applicability from passing.
human-decisions: []
structured_files: []
