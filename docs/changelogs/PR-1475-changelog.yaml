schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1475
title: Bind source obligation routes to candidate trees
intent:
  problem: Compiled source-reference evidence routes do not yet produce route-specific outcomes bound to the implementation candidate.
  goal: Persist a candidate-tree-bound result for every compiled route and state explicitly when a route has no trusted evidence producer.
human-decisions: []
structured_files: []
files:
- path: src/powdrr_lift/workrr/source_reference_run.py
  type: modified
  span: {start_line: 135, end_line: 202}
  summary: Compile per-obligation route outcomes against the source-reference candidate tree.
  rationale: Bind structural diff evidence to accepted owner paths and prevent unrelated paths from counting.
- path: src/powdrr_lift/workrr/source_reference_run.py
  type: modified
  span: {start_line: 975, end_line: 975}
  summary: Add the route evidence field to the protected run result.
  rationale: Include candidate-bound route outcomes in the terminal report.
- path: src/powdrr_lift/workrr/source_reference_run.py
  type: modified
  span: {start_line: 1007, end_line: 1021}
  summary: Persist route evidence with the protected run result.
  rationale: Retain the candidate identity and route outcomes alongside validation results.
- path: tests/test_source_reference_run.py
  type: modified
  span: {start_line: 21, end_line: 21}
  summary: Import the route evidence helper for protected-run regression coverage.
  rationale: Test the route compiler directly at the source-reference run boundary.
- path: tests/test_source_reference_run.py
  type: modified
  span: {start_line: 208, end_line: 232}
  summary: Cover scoped structural evidence and uncollected behavior and review routes.
  rationale: Ensure every route carries the candidate identity and absent producers remain explicit.
