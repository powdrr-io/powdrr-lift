  rationale: Prevent an empty profile selection from satisfying readiness.
- path: src/powdrr_lift/workrr/coding_agent_validation.py
  type: modified
  span: {start_line: 806, end_line: 806}
  summary: Add a diagnostic for validation runs with no results.
