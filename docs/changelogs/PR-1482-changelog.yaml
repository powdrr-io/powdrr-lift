entity_relationships: []
invariants:
- id: behavior-route-requires-linked-story-cases
  description: A behavior route passes only when every explicitly referenced story case and observation is passing.
  action: added
- id: story-receipts-must-match-the-story-candidate
  description: Every receipt used by a behavior route must be fresh and name the candidate tree captured by story validation.
  action: added
- id: protected-candidate-remains-unchanged-during-binding
  description: Story route evidence is appended only after rechecking the protected source candidate before and after binding.
  action: added
guidance:
- id: unlinked-preservation-routes-remain-uncollected
  description: Preservation behavior routes without explicit verification case links remain not_collected; unrelated story receipts do not discharge them.
  action: added
