  description: Scope route evidence considers every committed and working-tree path in the protected candidate, including non-Python files.
  action: added
- id: scope-review-fails-on-out-of-scope-paths
  description: A compiled scope route fails when any changed path falls outside every accepted allowed-path prefix.
