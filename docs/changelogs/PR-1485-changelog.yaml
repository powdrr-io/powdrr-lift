  type: modified
  span: {start_line: 682, end_line: 683}
  summary: Attach purpose and obligation identity to review results.
  rationale: Preserve the exact review-to-route association in the validation report.
- path: packages/service/src/powdrr_service/structrr/reference_validation.py
  type: modified
  span: {start_line: 686, end_line: 687}
  summary: Keep failed or inconclusive optional reviews from changing the existing audit status.
