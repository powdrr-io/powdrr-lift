schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1485
title: Match required checks to validation inventory
intent:
  problem: Required GitHub checks are not linked to the repository's discovered validation declarations before review readiness is granted.
  goal: Require every remote required check to match a unique workflow job in the typed Structrr inventory and retain the inventory digest with the CI observation.
human-decisions: []
structured_files: []
