schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1485
title: Connect invariant reviews to candidate routes
intent:
  problem: Compiled invariant routes remain uncollected even when the protected source validator performs an independent review of baseline and candidate owner evidence.
  goal: Bind passing invariant-preservation reviews and their evidence fingerprints to the protected candidate while keeping missing or inconclusive reviews uncollected.
human-decisions: []
structured_files: []
files:
- path: packages/service/src/powdrr_service/structrr/reference_validation.py
  type: modified
  span: {start_line: 193, end_line: 195}
  summary: Direct independent review instructions to compare baseline and candidate behavior for invariants.
  rationale: Annotation presence alone cannot establish preservation.
- path: packages/service/src/powdrr_service/structrr/reference_validation.py
  type: modified
  span: {start_line: 285, end_line: 285}
  summary: Retain each source review purpose in its result.
  rationale: Distinguish invariant-preservation decisions from owner and relocation reviews.
- path: packages/service/src/powdrr_service/structrr/reference_validation.py
  type: modified
  span: {start_line: 289, end_line: 289}
  summary: Retain the exact owner evidence available to the reviewer.
  rationale: The protected route consumer can require the reviewer to cite the supplied owner evidence.
- path: packages/service/src/powdrr_service/structrr/reference_validation.py
  type: modified
  span: {start_line: 575, end_line: 575}
  summary: Add optional, nonblocking semantic review handling.
  rationale: Inconclusive invariant review must remain uncollected without changing the existing source audit gate.
- path: packages/service/src/powdrr_service/structrr/reference_validation.py
  type: modified
  span: {start_line: 578, end_line: 579}
  summary: Leave optional reviews uncollected when the review bound is reached.
  rationale: Preserve fail-closed evidence coverage without turning optional evidence into a new validation blocker.
- path: packages/service/src/powdrr_service/structrr/reference_validation.py
  type: modified
  span: {start_line: 600, end_line: 600}
  summary: Mark the unavailable-review packet with its purpose.
  rationale: Keep candidate route mapping explicit when no independent reviewer is configured.
- path: packages/service/src/powdrr_service/structrr/reference_validation.py
  type: modified
  span: {start_line: 603, end_line: 605}
  summary: Bind unavailable review records to their source obligation.
  rationale: Prevent a review result from being assigned to an unrelated invariant route.
- path: packages/service/src/powdrr_service/structrr/reference_validation.py
  type: modified
  span: {start_line: 607, end_line: 608}
  summary: Keep unavailable optional reviews out of source validation findings.
  rationale: Missing route evidence remains visible without weakening existing validation.
- path: packages/service/src/powdrr_service/structrr/reference_validation.py
  type: modified
  span: {start_line: 663, end_line: 665}
  summary: Add purpose and obligation identity to review packets.
  rationale: Allow protected route evidence to map the decision to one compiled obligation.
