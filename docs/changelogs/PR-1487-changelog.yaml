  description: Required checks only count toward review readiness when the baseline, report, freshness metadata, and recorded validation inputs agree.
  action: added
- id: validation-input-paths-stay-within-repository
  description: Fingerprinted validation inputs cannot resolve outside the repository root.
  action: added
