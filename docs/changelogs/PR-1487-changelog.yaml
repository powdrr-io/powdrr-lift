schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1487
title: Link preservation routes to accepted behavior
intent:
  problem: Preservation obligations compile behavior routes but carry no references to the accepted cases that can verify preserved behavior.
  goal: Require preservation records to link accepted cases or scenarios and allow only fresh linked story receipts to discharge their behavior routes.
