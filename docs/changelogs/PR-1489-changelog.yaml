schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1489
title: Block PR readiness on changed validation inputs
intent:
  problem: The required-CI readiness gate can trust a committed validation inventory even when a pull request changes validation discovery inputs.
  goal: Detect changed validation paths, including additions, removals, and renames, and require the committed baseline to be refreshed before review.
