schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1491
title: Record runtime identity for validation baselines
intent:
  problem: Local bootstrap validation results do not identify the source content, check recipe, or runtime that produced a pass.
  goal: Bind each baseline observation to its source, environment, interpreter, tool version, and execution recipe, then expose the identity in the report.
human-decisions: []
structured_files: []
files:
- path: docs/plans/bootstrap-validation-discovery.md
  type: modified
  span: {start_line: 26, end_line: 30}
  summary: Record runtime identity capture and the remaining freshness enforcement work.
  rationale: Keep WP8 progress aligned with the implemented observation contract.
- path: packages/service/src/powdrr_service/structrr/bootstrap.py
  type: modified
  span: {start_line: 503, end_line: 520}
  summary: Render a validation observation's identity fingerprint in the Structrr report.
  rationale: Make the runtime provenance of baseline results visible during review.
- path: src/powdrr_lift/agent_bootstrap.py
  type: modified
  span: {start_line: 6, end_line: 6}
  summary: Import JSON serialization for stable runtime identity fingerprints.
  rationale: Hash canonical identity payloads deterministically.
- path: src/powdrr_lift/agent_bootstrap.py
  type: modified
  span: {start_line: 8, end_line: 8}
  summary: Import platform details for baseline runtime identity.
  rationale: Bind observed results to the platform that executed the check.
- path: src/powdrr_lift/agent_bootstrap.py
  type: modified
  span: {start_line: 11, end_line: 11}
  summary: Import Python runtime metadata for baseline identity.
  rationale: Record the interpreter used by the bootstrap process.
