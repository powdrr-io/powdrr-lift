  type: modified
  span: {start_line: 23, end_line: 23}
  summary: Import the Structrr Markdown renderer for refreshed reports.
  rationale: Regenerate the companion report after validation outcomes are persisted.
- path: src/powdrr_lift/agent_bootstrap.py
  type: modified
  span: {start_line: 265, end_line: 273}
  summary: Rewrite the Markdown companion after source manifest and baseline results are finalized.
  rationale: Keep the report synchronized with the saved validation observation identity.
- path: src/powdrr_lift/agent_bootstrap.py
  type: modified
  span: {start_line: 692, end_line: 692}
  summary: Initialize runtime identity separately for each local validation check.
  rationale: Avoid reusing identity from a prior check when the current check cannot execute.
- path: src/powdrr_lift/agent_bootstrap.py
  type: modified
  span: {start_line: 740, end_line: 748}
  summary: Capture runtime identity before executing each supported baseline command.
  rationale: Tie the observed outcome to the source and runtime present at execution time.
- path: src/powdrr_lift/agent_bootstrap.py
  type: modified
  span: {start_line: 779, end_line: 779}
  summary: Persist runtime identity with the baseline observation.
  rationale: Preserve the inputs needed to determine whether a result is still current.
- path: src/powdrr_lift/agent_bootstrap.py
  type: modified
  span: {start_line: 800, end_line: 977}
  summary: Build a stable identity from source and validation input digests, check recipe, environment, interpreter, platform, and tool version.
  rationale: Make changes to code, lockfiles, check configuration, or runtime produce a distinct observation fingerprint.
