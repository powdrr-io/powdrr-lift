  type: modified
  span: {start_line: 7, end_line: 7}
  summary: Import the active interpreter for the deliberately shallow validation profile.
  rationale: Keep the ordinary validation check independent from the protected story tests.
- path: tests/test_story_execution.py
  type: modified
  span: {start_line: 54, end_line: 54}
  summary: Import ValidationProfile for the protected dispatch fixture.
  rationale: Configure an ordinary check that can pass while story behavior regresses.
- path: tests/test_story_execution.py
  type: modified
  span: {start_line: 649, end_line: 651}
  summary: Exercise both an accepted candidate and a body-regression candidate through protected dispatch.
  rationale: Retain the passing control while covering the failed behavior case.
- path: tests/test_story_execution.py
  type: modified
  span: {start_line: 653, end_line: 656}
  summary: Add the behavior-regression selector to the integration test.
  rationale: Choose whether the worker candidate preserves accepted decisions.
- path: tests/test_story_execution.py
  type: modified
  span: {start_line: 757, end_line: 760}
  summary: Make the regression candidate drop previously accepted decisions from its return value.
  rationale: Change implementation behavior while keeping the same source owner and placement annotation.
- path: tests/test_story_execution.py
  type: modified
  span: {start_line: 825, end_line: 825}
  summary: Use an import-only command for ordinary candidate validation.
  rationale: Prove the behavior regression is caught by story validation rather than structural validation.
- path: tests/test_story_execution.py
  type: modified
  span: {start_line: 838, end_line: 861}
  summary: Assert placement and import checks pass, story validation fails, and the candidate is not transferred.
  rationale: Verify a body-only regression blocks delivery despite passing ordinary checks.
