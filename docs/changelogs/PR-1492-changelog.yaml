invariants:
- id: body-regressions-cannot-pass-on-placement-and-import-checks-alone
  description: A protected source candidate that keeps its Structrr placement but breaks accepted story behavior is rejected before patch transfer, even when source placement and ordinary import validation pass.
  action: added
guidance:
- id: use-protected-story-receipts-for-body-behavior
  description: Require current protected story tests to establish accepted behavior independently from source placement and shallow validation commands.
  action: added
