change_id: PR-1492
title: Prove body regressions block protected handoff
intent:
  problem: Source placement and a passing ordinary validation command do not prove that an implementation preserves accepted story behavior.
  goal: Demonstrate that protected dispatch rejects a body-only behavior regression and leaves the task checkout unchanged.
human-decisions: []
structured_files: []
files:
