schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1493
title: Invalidate baseline passes on runtime identity changes
intent:
  problem: Saved validation baseline passes can remain visible after the source or runtime identity that produced them changes.
  goal: Compare prior passing observations with the active runtime identity and explicitly invalidate stale evidence.
human-decisions: []
structured_files: []
