schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1495
title: Cover source workers that submit without progress
intent:
  problem: The prepared source run rejects submissions without attributable changes, but the end-to-end protected worker fixture does not exercise that outcome.
  goal: Prove a completed no-change worker attempt returns submitted_without_progress and cannot be accepted.
human-decisions: []
structured_files: []
files:
- path: tests/test_source_reference_run.py
  type: modified
  span: {start_line: 587, end_line: 594}
  summary: Add a no-progress case to the native protected worker fixture.
  rationale: Exercise submission without an attributable candidate change through the real worker boundary.
- path: tests/test_source_reference_run.py
  type: modified
  span: {start_line: 611, end_line: 613}
  summary: Keep the baseline source unchanged in the no-progress scenario.
  rationale: Ensure the worker has no patch progress to attribute.
- path: tests/test_source_reference_run.py
  type: modified
  span: {start_line: 660, end_line: 661}
  summary: Submit the task without applying a source edit.
  rationale: Exercise finalization of a completed no-change worker attempt.
- path: tests/test_source_reference_run.py
  type: modified
  span: {start_line: 691, end_line: 691}
  summary: Skip context-completion assertions when the worker is rejected before submission reconciliation.
  rationale: Keep no-progress rejection distinct from context delivery failure.
- path: tests/test_source_reference_run.py
  type: modified
  span: {start_line: 697, end_line: 697}
  summary: Require the no-progress scenario to return submitted_without_progress.
  rationale: Verify a completed empty attempt cannot become an accepted candidate.
- path: docs/plans/implementation-contract-and-verification.md
  type: modified
  span: {start_line: 3, end_line: 3}
