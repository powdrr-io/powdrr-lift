change_id: PR-1497
title: Prove reviewed revisions own fresh retry runs
intent:
  problem: A failed protected source invocation cannot be repeated, but the route lacks an integration fixture proving that a newly reviewed design revision can start a fresh invocation without reusing old artifacts.
  goal: Verify failed runs are single-use, a new reviewed revision gets a separate run, and duplicate dispatch of that revision is rejected.
