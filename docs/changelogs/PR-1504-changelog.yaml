schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1504
title: Complete bootstrap validation freshness enforcement
intent:
  problem: Validation context is lost at provider boundaries, pytest collection mutates the orchestrator
    process, and existing tests do not exercise readiness end to end.
  goal: Preserve reviewed validation context through execution and provider evidence, collect in the declared
    component context, and prove unresolved checks cannot pass readiness.
