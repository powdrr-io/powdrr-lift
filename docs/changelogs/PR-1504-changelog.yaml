invariants:
- id: reviewed-validation-context-cannot-change-before-execution
  description: A validation profile whose serialized context differs from the reviewed request is blocked
    before execution.
  action: added
- id: unsupported-validation-applicability-cannot-pass-readiness
  description: A check with unresolved applicability remains pending and prevents the feature review gate
    from passing.
  action: added
- id: provider-inventory-fingerprint-covers-execution-context
  description: Provider inventory identity includes command, target version, cwd, environment identity,
    execution semantics, and applicability.
  action: added
guidance:
- id: unsupported-provider-execution-remains-unresolved
  description: Provider adapters execute argv profiles only; shell and script profiles must remain unresolved
    until their exact execution semantics are supported.
  action: added
