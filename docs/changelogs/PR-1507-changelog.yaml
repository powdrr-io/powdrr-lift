- path: docs/plans/intent-source-reference-lineage-spec.md
  type: added
  span: {start_line: 1, end_line: 180}
  summary: Specify the remaining lineage record and audit gate for protected source-reference runs.
  rationale: Bind accepted Structrr intent, one worker attempt, candidate evidence, and patch transfer without reopening removed routes.
- path: docs/design/source-anchored-semantic-contract-compilation.md
  type: modified
  span: {start_line: 70, end_line: 71}
  summary: Point intent ownership to the consolidated current-direction specification.
  rationale: Keep the active design map from directing readers to an archived broad plan.
- path: docs/plans/research/acceptance-criteria-template-catalog-proposal.md
  type: modified
  span: {start_line: 81, end_line: 81}
  summary: Mark the old repair-loop link as historical research and link the current intent-lineage scope.
  rationale: Avoid implying that the removed automatic correction loop is current direction.
- path: science/deepswe/acceptance_templates/catalog.json
  type: modified
  span: {start_line: 3, end_line: 3}
  summary: Refresh the frozen catalog fingerprint after changing its source proposal.
  rationale: Keep the generated experiment artifact reproducible from the checked-in proposal.
- path: docs/plans/superseded/durable-intent-implementation-plan.md
  type: added
