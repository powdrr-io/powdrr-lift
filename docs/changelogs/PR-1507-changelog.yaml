schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1507
title: Consolidate intent lineage work around protected source handoff
intent:
  problem: Intent planning documents describe overlapping and partly removed code-writing routes, while the protected source-reference route has no integrated run-bound lineage audit.
  goal: Define the remaining intent traceability work for the current route and archive outdated intent plans with clear superseded status.
human-decisions: []
structured_files: []
