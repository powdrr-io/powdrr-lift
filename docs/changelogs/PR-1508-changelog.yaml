change_id: PR-1508
title: Resolve WP9 validation corpus findings
intent:
  problem: The WP9 corpus still had missed obligations, command/context mismatches, and evidence gaps,
    while the plan's final gate did not match the merged CI workflow.
  goal: Account for every reviewed obligation, preserve dynamic and shell-driven checks as explicit unresolved
    records, and document the verified completion gate.
