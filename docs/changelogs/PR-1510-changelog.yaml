schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1510
title: Apply small supporting edits consistently
intent:
  problem: >-
    The bounded supporting-edit policy was inconsistent. One code path rejected
    all supporting edits, the line budget was aggregate rather than per file,
    and planning rejected file lists above twenty entries.
  goal: >-
    Accept existing regular text-file edits of at most twenty changed lines per
    file across any number of files, and carry that decision through source-reference
    validation, candidate review, checkpoints, and planning.
