entity_relationships: []
invariants:
- id: ci-job-sha-separation
  description: CI job records retain PR head SHA and workflow-tested SHA as separate values.
  action: added
  rationale: A workflow run may test a different commit than the current PR head.
- id: required-policy-explicitness
  description: Missing required-check policy is reported as unavailable.
  action: added
  rationale: The response path must not infer that no checks are required.
- id: failure-provenance-binding
  description: Each serialized failure unit binds to its observation, PR head, run attempt, and job.
  action: added
  rationale: Resume and diagnosis must not reuse a failure from a different observation.
