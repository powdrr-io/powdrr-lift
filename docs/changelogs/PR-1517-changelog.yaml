schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1517
title: Add versioned Procedrr CI response contracts
intent:
  problem: CI response observations and failures cross the CLI and Procedrr boundary without a single public typed envelope.
  goal: Bind normalized evidence to a PR head, retain the tested workflow SHA separately, and serialize versioned failure records with explicit required-check availability.
