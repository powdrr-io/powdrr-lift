invariants:
- id: worker-design-obligation-fidelity
  description: Source designs retain accepted typed behavior scenarios, source clauses,
    reference definitions, placements, and preservation obligations from the item
    baseline and proposal operations.
  action: added
  rationale: Protected workers must receive the exact accepted contract and its canonical
    source references.
- id: incomplete-worker-contract-replan
  description: A source design with missing typed behavior authority is marked requires_replan
    and rejected by the protected handoff compiler.
  action: added
  rationale: Legacy prose-only cases cannot be executed as if they had source-faithful
    behavior contracts.
