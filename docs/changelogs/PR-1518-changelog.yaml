schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1518
title: Preserve accepted obligations in worker designs
intent:
  problem: Accepted behavior cases and source-reference obligations were dropped or
    synthesized while compiling planning proposals into worker designs.
  goal: Preserve accepted typed cases and reference operations through serialized
    source designs and the protected worker handoff, and explicitly require replanning
    when authority is incomplete.
