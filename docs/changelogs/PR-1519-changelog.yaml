schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1519
title: Bind plan compilation to runtime execution preparation
intent:
  problem: Planning validates source-reference designs separately from the preparation that runtime reconstructs, and dependency readiness can be checked against stale remote state.
  goal: Carry one deterministic preparation contract from planning through execution and resolve dependency readiness against the refreshed execution base before a task is claimed.
human-decisions: []
