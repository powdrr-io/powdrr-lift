schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1519
title: Capture and assess exact-head required CI checks
intent:
  problem: The CI response command cannot determine current review readiness when required-check policy is not transported from GitHub.
  goal: Capture required checks for a stable PR head, preserve unavailable policy explicitly, and return a deterministic response state.
