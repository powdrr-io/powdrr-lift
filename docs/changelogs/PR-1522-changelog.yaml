entities:
- id: dispatch-source-reference-corrections
  type: Function
  action: added
- id: source-reference-run
  type: Class
  action: added
- id: implementation-correction-prompt
  type: Function
  action: added
entity_relationships: []
invariants:
- id: immutable-correction-authority
  description: Every correction keeps the accepted design, verifier, protected files,
    and original base unchanged.
  action: added
  rationale: A failed candidate cannot authorize a plan or verifier amendment.
- id: one-invocation-per-attempt
  description: A correction uses a fresh linked attempt, and restart reconciliation
    never repeats a claimed invocation.
  action: added
  rationale: Persist transitions and terminal evidence before continuing work.
- id: explicit-correction-budget
  description: Correction attempts are bounded by a configured budget and unchanged
    failure state stops with a recorded no-progress result.
  action: added
  rationale: Bound cost by explicit policy rather than elapsed time.
guidance:
- id: tool-timeout-semantics
  description: MiniSWE inactivity limits measure the interval without stdout or trajectory
    progress; validation limits remain tool-level limits. Neither is an overall active-run
    deadline.
  action: added
