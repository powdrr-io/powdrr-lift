schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1522
title: Correct failed source implementation attempts
intent:
  problem: A failed protected implementation attempt could not receive a bounded correction,
    and implicit wall-clock limits could terminate active work without a durable correction
    decision.
  goal: Create linked immutable correction attempts that preserve accepted authority,
    stop repeated failures with durable evidence, and use explicit attempt budgets.
