schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1523
title: Capture bounded failed-job log evidence
intent:
  problem: CI response observations retain annotations and failed step labels but omit the job log text needed to understand many failures.
  goal: Capture a small redacted excerpt with a raw-content digest and explicit truncation or unavailability, and carry it through typed observations.
