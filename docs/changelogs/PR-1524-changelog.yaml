invariants:
  - id: pytest-reproduction-targets-observed-node
    description: A pytest reproduction narrows only to a safe test node observed in a structured CI failure summary.
    action: added
    rationale: Keep execution focused and prevent untrusted log text from becoming shell input.
  - id: unmatched-reproduction-remains-inconclusive
    description: A local nonmatch is not reported as not-reproduced unless the relevant phase and comparable environment are established.
    action: added
    rationale: Distinguish a green unrelated command from a meaningful comparison.
