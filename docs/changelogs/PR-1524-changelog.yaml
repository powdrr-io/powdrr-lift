schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1524
title: Target CI reported pytest failures during reproduction
intent:
  problem: Failure units reduce failed steps to generic labels, so reproduction reruns a broad command without targeting or matching the reported test.
  goal: Extract safe pytest node IDs from bounded CI summaries and narrow declared pytest commands while preserving inconclusive results across incomparable environments.
