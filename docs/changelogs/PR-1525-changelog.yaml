schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1525
title: Checkpoint and wait for current-head CI
intent:
  problem: The CI response process returned immediately for pending checks and did not persist check-level state or a bounded wait outcome.
  goal: Save required-check evidence before polling, refresh only while the PR remains at the observed head, and persist the resolved or deadline state for Procedrr.
human-decisions: []
structured_files: []
files:
  - path: docs/plans/procedrr-ci-response-action.md
    type: modified
    span: {start_line: 8, end_line: 12}
    summary: Record bounded current-head waiting as implemented and queue continuation as remaining work.
    rationale: Keep the CI response plan status aligned with delivered behavior.
  - path: packages/agent/src/powdrr_agent/execution/github_actions.py
    type: modified
    span: {start_line: 421, end_line: 422}
    summary: Scope required-check reads to the requested repository.
    rationale: Avoid relying on the process working directory when observing a PR.
  - path: packages/agent/src/powdrr_agent/execution/github_actions.py
    type: modified
    span: {start_line: 431, end_line: 432}
    summary: Accept GitHub CLI's pending-check exit status while parsing valid results.
    rationale: Preserve pending checks as waitable evidence rather than policy unavailability.
  - path: packages/agent/src/powdrr_agent/execution/github_actions.py
    type: modified
    span: {start_line: 458, end_line: 484}
    summary: Refresh required checks with repository scoping, accept pending CLI results, and reject head changes.
    rationale: Ensure each wait poll observes only the originally checkpointed PR head.
  - path: packages/service/src/powdrr_service/ci_response/checkpoint.py
    type: modified
    span: {start_line: 10, end_line: 10}
    summary: Import the public required-check record for checkpoint rendering.
    rationale: Preserve validated required-check identity and status.
  - path: packages/service/src/powdrr_service/ci_response/checkpoint.py
    type: modified
    span: {start_line: 35, end_line: 37}
    summary: Accept required checks and wait progress when rendering a checkpoint.
    rationale: Include the wait lifecycle in deterministic observation identity.
  - path: packages/service/src/powdrr_service/ci_response/checkpoint.py
    type: modified
    span: {start_line: 57, end_line: 59}
    summary: Include required-check records and wait progress in the checkpoint fingerprint.
    rationale: Give each changed check state or wait transition its own stable identity.
  - path: packages/service/src/powdrr_service/ci_response/checkpoint.py
    type: modified
    span: {start_line: 89, end_line: 103}
    summary: Include individual required-check states and wait progress in deterministic issue checkpoints.
    rationale: Preserve enough state to understand pending and completed observations after interruption.
  - path: packages/service/src/powdrr_service/ci_response/checkpoint.py
    type: modified
    span: {start_line: 263, end_line: 266}
    summary: Sanitize externally supplied check labels for inline checkpoint display.
    rationale: Keep GitHub-provided values bounded and readable in issue comments.
  - path: packages/service/src/powdrr_service/resources/processes/respond-to-pr-ci.yaml
    type: modified
    span: {start_line: 3, end_line: 3}
    summary: Describe the bounded waiting behavior of the CI response process.
    rationale: Keep the process catalog description accurate for operators.
  - path: src/powdrr_lift/cli.py
    type: modified
    span: {start_line: 35, end_line: 35}
    summary: Import the public required-check contract for refreshed observations.
    rationale: Validate states before attaching them to the pinned CI observation.
  - path: src/powdrr_lift/cli.py
    type: modified
    span: {start_line: 378, end_line: 389}
    summary: Expose the wait deadline and polling interval for PR CI observation.
    rationale: Make the wait bounded and configurable at the command boundary.
  - path: src/powdrr_lift/cli.py
    type: modified
    span: {start_line: 3065, end_line: 3082}
    summary: Validate that the wait deadline and poll interval are within bounded limits.
    rationale: Prevent an accidental unbounded CI worker.
  - path: src/powdrr_lift/cli.py
    type: modified
    span: {start_line: 3208, end_line: 3213}
    summary: Persist individual required-check states and the initial wait state.
    rationale: Write the pending checkpoint before the command begins polling.
  - path: src/powdrr_lift/cli.py
    type: modified
    span: {start_line: 3226, end_line: 3308}
    summary: Persist the initial checkpoint, poll required checks, and return the final response state and wait outcome.
    rationale: Avoid losing CI evidence while waiting and give Procedrr an explicit terminal state.
  - path: src/powdrr_lift/cli.py
    type: modified
    span: {start_line: 3332, end_line: 3341}
    summary: Return checkpoint and wait timing outcomes to the Procedrr caller.
    rationale: Expose whether checks resolved or the configured deadline elapsed.
  - path: tests/test_ci_response_cli.py
    type: modified
    span: {start_line: 249, end_line: 403}
    summary: Cover checkpoint-before-wait, pending-to-success transition, and deadline exhaustion.
    rationale: Verify durable state transitions and bounded completion.
  - path: tests/test_github_actions_transport.py
    type: modified
    span: {start_line: 244, end_line: 295}
    summary: Cover pending CLI exit status and PR head movement during check refresh.
