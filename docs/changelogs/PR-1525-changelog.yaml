entities: []
entity_relationships: []
invariants:
  - id: ci-wait-is-pinned-to-observed-head
    description: A required-check refresh is accepted only when the PR head is unchanged before and after the refresh.
    action: added
    rationale: Do not mix check generations from different candidate commits.
  - id: ci-wait-is-bounded-and-checkpointed
    description: The initial pending evidence is checkpointed before polling, and polling stops at a validated deadline no longer than one hour.
    action: added
    rationale: Make interruption and timeout states recoverable without an unbounded worker.
guidance:
  - id: ci-response-wait-defaults
    description: The command waits up to 900 seconds by default and polls every 30 seconds; set a zero deadline to return immediately with awaiting_ci.
    action: added
