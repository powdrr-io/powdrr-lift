entities:
- id: publication-authorization-builder
  type: Function
  action: added
  rationale: Produce a deterministic authorization bound to candidate content and
    evidence.
- id: publication-intent-store
  type: Function
  action: added
  rationale: Retain one PR write identity and reconcile ambiguous responses.
entity_relationships: []
invariants:
- id: candidate-bound-publication
  description: A publication authorization must match the base, candidate file content,
    accepted contract, successful verification receipts, and source lineage immediately
    before commit construction.
  action: added
  rationale: Prevent unverified source edits from entering a published PR.
- id: idempotent-pr-publication
  description: A persisted publication intent is reconciled against the branch and
    existing PR before another PR is created.
  action: added
  rationale: Avoid duplicate pull requests after interrupted GitHub responses.
guidance:
- id: preparation-failure-restarts-implementation
  description: A source repair after PR preparation validation must return to implementation
    correction and regenerate candidate evidence.
  action: added
  rationale: Do not publish source changes that were not revalidated.
