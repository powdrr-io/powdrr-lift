schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1526
title: Bind publication to verified candidates
intent:
  problem: PR preparation could edit implementation files after validation, and publication
    retries did not durably bind candidate content, accepted contract, and evidence
    to one PR intent.
  goal: Publish the exact authorized candidate, preserve an idempotent publication
    intent, and validate generated changelog metadata against the pushed branch.
