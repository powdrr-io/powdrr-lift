entities: []
entity_relationships: []
invariants:
  - id: queue-review-requires-fresh-required-checks
    description: The worker's queue outcome comes from its fresh current-head required-check and validation-inventory observation, not from the workflow exit code or response result alone.
    action: added
    rationale: Keep queue review readiness tied to independently verified GitHub state.
  - id: ci-response-result-retains-head-binding
    description: Response evidence is normalized with its head SHA and explicitly records whether it matches the queue observation head.
    action: added
    rationale: Prevent a stale response state from being mistaken for evidence about a newer PR commit.
guidance:
  - id: ci-response-result-is-evidence
    description: Treat the serialized CI response as diagnostic evidence; use the queue's fresh required-check observation to assign the issue's queue state.
    action: added
