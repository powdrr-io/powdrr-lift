schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1527
title: Persist Procedrr CI response outcomes in the issue queue
intent:
  problem: The issue queue independently observed required CI but discarded the structured response result produced by the Procedrr workflow.
  goal: Preserve the response result beside the queue's fresh current-head validation observation, without treating the workflow exit code or response state as proof that review can proceed.
