schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1532
title: Assess CI research source claims
intent:
  problem: Bounded CI research captured official source excerpts but did not determine whether their claims applied to the observed runner label and repository visibility.
  goal: Bind exact source claims, record applicability or uncertainty with retrieval context, and ensure research never authorizes a repair.
