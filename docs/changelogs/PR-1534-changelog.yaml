invariants:
- id: repair-contract-head-is-exact
  description: A repair contract must bind to the same PR head and exactly one observed failed job.
  action: added
- id: repair-contract-preserves-protected-artifacts
  description: Allowed paths cannot include protected artifact paths, and every protected artifact carries a SHA-256 baseline.
  action: added
- id: repair-contract-retains-required-checks
  description: A repair contract must carry the complete observed required-check set.
  action: added
- id: repair-contract-requires-comparable-evidence
  description: Inconclusive reproductions cannot produce a repair contract; non-local failures require accepted source-backed claims.
  action: added
guidance:
- id: ci-repair-contract-is-not-dispatch-enforcement
  description: The service compiler defines a bounded contract; agent-side filesystem enforcement and correction dispatch remain separate unfinished work.
  action: added
