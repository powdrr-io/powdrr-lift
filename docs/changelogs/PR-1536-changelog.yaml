  description: Contract editable paths cannot equal, contain, or be contained by a protected artifact path.
  action: added
guidance:
- id: ci-repair-contract-enforcement-is-not-dispatch
  description: The coding worker now enforces contract-bound repairs; correction acceptance and dispatch, durable continuation, broader evidence collection, and publication integration remain unfinished.
