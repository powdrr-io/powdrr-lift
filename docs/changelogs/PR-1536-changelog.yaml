invariants:
- id: ci-repair-request-is-bound-to-contract
  description: A v4 implementation request must use the contract head, exact editable paths, required behavior, and protected artifacts.
  action: added
- id: ci-repair-contract-must-be-current
  description: Expired repair contracts are denied before worker execution.
  action: added
- id: ci-repair-protected-artifacts-remain-intact
  description: Protected artifacts must match their contract hashes before and after worker execution, and supported worker sandboxes deny writes to them.
