schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1536
title: Enforce CI repair contracts in coding workers
intent:
  problem: CI repair contracts defined a safe correction boundary, but the generic coding worker did not yet carry or enforce that boundary.
  goal: Bind repair requests to the exact contract, enforce expiry and protected artifact integrity, and deny protected writes in supported worker sandboxes.
