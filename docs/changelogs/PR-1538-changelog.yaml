- path: packages/service/src/powdrr_service/ci_response/acceptance.py
  type: added
  span: {start_line: 1, end_line: 194}
  summary: Accept candidates only when contract expiry, base, edit scope, protected hashes, worker status, and exact-diff validation receipts pass.
  rationale: Reject stale, out-of-scope, integrity-changing, incomplete, or unvalidated repair candidates with deterministic reasons.
