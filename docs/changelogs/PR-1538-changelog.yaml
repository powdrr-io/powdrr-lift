schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1538
title: Assess contract-bound CI repair candidates
intent:
  problem: Contract-bound worker requests had integrity checks, but no service policy decided whether a resulting candidate and its validation evidence were acceptable.
  goal: Add a deterministic acceptance decision that binds the worker result and required validation receipts to the live repair contract and candidate diff.
human-decisions: []
structured_files: []
