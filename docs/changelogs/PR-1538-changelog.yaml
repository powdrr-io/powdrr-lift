entity_relationships:
- id: acceptance-verifies-repair-validation
  source: assess-ci-repair-candidate
  target: ci-repair-validation
  type: consumes
- id: acceptance-decision-belongs-to-repair-contract
  source: assess-ci-repair-candidate
  target: ci-repair-acceptance
  type: returns
invariants:
- id: accepted-ci-repair-matches-contract-head-and-scope
  description: A candidate is rejected if its base differs from the contract head or any changed path falls outside the exact editable scope.
  action: added
- id: accepted-ci-repair-preserves-protected-artifacts
  description: The candidate must report every protected artifact with the contract's exact path and SHA-256 value and must not change a protected path.
  action: added
- id: accepted-ci-repair-validations-bind-to-candidate
  description: Every contract verification command must have one passing receipt bound to the candidate diff fingerprint; missing, duplicate, uncontracted, failed, or mismatched receipts are rejected.
  action: added
- id: local-repair-acceptance-does-not-confirm-github
  description: A local accepted candidate does not establish that the published PR's current required GitHub checks passed.
  action: added
guidance:
- id: ci-repair-acceptance-precedes-dispatch-and-publication
  description: Candidate acceptance is available as a service operation; MiniSWE dispatch, limited publication, durable continuation, broader evidence collection, and full publication integration remain unfinished.
  action: added
