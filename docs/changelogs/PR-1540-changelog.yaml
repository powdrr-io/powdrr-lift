schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1540
title: Dispatch contract-bound CI repairs to MiniSWE
intent:
  problem: CI response could observe, reproduce, compile, and accept repair candidates but had no bounded MiniSWE dispatch path.
  goal: Dispatch one repair for a matching failure and PR head, run its contracted validations, and return the service acceptance decision.
