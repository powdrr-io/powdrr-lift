  type: modified
  span: {start_line: 272, end_line: 274}
  summary: Pass generated source-design status into the plan readiness calculation.
  rationale: Keep plans from advertising a replan-required first item as ready.
- path: packages/service/src/powdrr_service/planning/compiler.py
  type: modified
  span: {start_line: 469, end_line: 472}
  summary: Recompute validation readiness using source-design blockers.
  rationale: Ensure compiled readiness summaries can be independently validated.
