invariants:
- id: replan-required-design-is-not-ready
  description: A source design marked requires_replan is excluded from the plan's ready item IDs and retains its amendment reason in the blocked summary.
  action: added
- id: replan-required-design-is-not-queued-as-ready
  description: Plan issue publication reads source-design status from the immutable plan commit and labels items requiring replanning as blocked.
  action: added
- id: dependency-readiness-respects-blocked-source-design
  description: A dependent item remains blocked on its dependency when that dependency's source design requires replanning.
  action: added
guidance:
- id: replan-before-running-blocked-plan-items
  description: Amend or regenerate the reviewed plan to produce accepted source designs and execution preparation, then publish a corrected plan revision before running those items.
  action: added
