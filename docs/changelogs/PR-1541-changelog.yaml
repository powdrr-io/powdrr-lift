schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1541
title: Gate plan readiness on executable source designs
intent:
  problem: Plan readiness and issue publication considered dependencies but ignored source designs explicitly marked requires_replan, allowing unexecutable items to be labeled ready.
  goal: Exclude source designs requiring replanning from ready summaries and publish their issues as blocked, using the immutable reviewed plan commit as the source of truth.
human-decisions: []
structured_files: []
files:
