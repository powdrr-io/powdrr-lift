entity_relationships:
- id: publication-revalidates-accepted-candidate
  source: publish-ci-repair-candidate
  target: assess-ci-repair-candidate
  type: consumes
- id: response-flow-publishes-before-reobserving
  source: respond-to-pr-ci-publication-flow
  target: ci-repair-publication-operation
  type: invokes
- id: publication-tests-cover-branch-safety
  source: ci-repair-publication-tests
