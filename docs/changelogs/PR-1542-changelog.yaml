invariants:
- id: ci-repair-publication-revalidates-persisted-evidence
  description: Publication requires a matching accepted dispatch result and persisted attempt manifest whose paths, diff fingerprint, protected artifacts, and contracted validation receipts still pass service acceptance.
  action: added
- id: ci-repair-push-requires-unchanged-same-repository-head
  description: Publication is blocked for fork branches, invalid branch references, mismatched origins, or a remote PR branch that no longer points to the contract head; pushes are normal fast-forward pushes without force.
  action: added
- id: ci-repair-publication-reobserves-github
  description: A successful publication triggers a fresh CI observation; only that new observation determines whether the response process succeeds or blocks.
  action: added
- id: ci-repair-local-acceptance-is-not-github-success
  description: Passing local repair validations and publishing the patch do not establish successful GitHub checks on the new PR head.
  action: added
guidance:
- id: remaining-ci-response-work-is-durable-integration
  description: Limited publication and exact-head re-observation are implemented; durable queue continuation, broader evidence collection, and automatic integration with implementation PR publication remain unfinished.
  action: altered
