invariants:
- id: ci-repair-artifacts-are-integrity-checked
  description: Continuation bundles are accepted only when every chunk hash, complete chunk set, compressed bundle digest, contract identity, and restored file hash match.
  action: added
- id: ci-repair-restoration-is-contract-bound
  description: A restored candidate must use the contract head, stay within allowed paths, preserve protected artifacts, and pass the contract validations again before publication.
  action: added
- id: ci-repair-interrupted-dispatch-remains-at-most-once
  description: A durable invocation receipt without a completed artifact blocks automatic redispatch on another worker.
  action: altered
guidance:
- id: ci-repair-checkpoint-storage-limit
  description: Compressed continuation payloads are limited to 10 MiB and stored as individually hashed issue-comment chunks; incomplete or corrupt bundles are ignored.
  action: added
- id: broader-ci-response-work-remains
  description: Broader evidence collection and full publication integration remain open in the Procedrr CI response action plan.
  action: added
