schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1548
title: Preserve terminal CI repair outcomes in queue checkpoints
intent:
  problem: The CI response process returned only its observation, so repair dispatch and publication failures could be lost before the issue queue checkpointed the result.
  goal: Return a bounded combined terminal result from every response path and preserve its repair and publication status and reasons in the durable issue outcome checkpoint.
