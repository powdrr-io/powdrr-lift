schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1551
title: Complete scoped CI repair preparation and human continuation
intent:
  problem: The normal implementation PR workflow did not supply a repair contract, so failed checks could not dispatch an eligible repair, and ambiguous cases had no durable CI-specific human continuation.
  goal: Prepare narrowly scoped contracts from reviewed context and observed evidence, preserve human-required outcomes through the issue queue, and recheck the current PR head through the existing continue command.
