- id: ci-automatic-repair-requires-exact-reviewed-evidence
  description: Automatic CI repair requires one locally reproduced failure, complete required-check policy, one log-identified changed source path inside the reviewed allowlist, and a protected failing test artifact.
  action: added
- id: ci-human-required-remains-durable-until-recheck
  description: Human-required CI outcomes retain a durable checkpoint and continue through a current-head required-check observation; passing checks move the issue to awaiting review.
  action: added
- id: ci-source-evidence-stores-hashes-only
  description: Source evidence is bounded to repository-relative file identity, size, and SHA-256 and excludes file contents and symlink targets.
  action: added
guidance:
- id: ci-response-post-merge-product-verification
