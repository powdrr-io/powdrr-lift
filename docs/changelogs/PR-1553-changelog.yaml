schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1553
title: Compile source-bound behavior scenarios during plan test design
intent:
  problem: Planned test cases contained prose only, so source-reference designs were blocked from execution for lacking typed behavior scenarios and provenance.
  goal: Require every planned case to include a validated typed behavior scenario tied to pinned source excerpts, allowing accepted plans to pass the protected execution readiness check.
