schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1554
title: Bind planned behavior scenarios to test outcomes
intent:
  problem: Planning models must duplicate test scenarios and expected outcomes in behavior fields, and paraphrases can block an otherwise valid plan.
  goal: Derive behavior scenario when and then values from each accepted test design while retaining typed dimension and source evidence validation.
