schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1556
title: Fix planning execution and completed-work detection
intent:
  problem: Runtime source-reference handoffs include a candidate checkout path that cannot appear in the stable reviewed preparation, and work-unit proposals lack the coverage assessment that identifies an already-satisfied subtask within an unresolved requirement.
  goal: Compare stable contract fields while retaining the runtime workspace path, and include the exact remaining coverage gap when proposing implementation work.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/workrr/source_reference_run.py
    type: modified
    span: {start_line: 721, end_line: 721}
    summary: Exclude the temporary workspace root from stable preparation equality.
    rationale: Candidate checkout paths vary by execution and are not part of the reviewed semantic contract.
  - path: tests/test_source_reference_run.py
    type: modified
    span: {start_line: 14, end_line: 16}
    summary: Import the deterministic preparation compiler for runtime comparison coverage.
    rationale: Construct the same accepted preparation contract used by reviewed plans.
  - path: tests/test_source_reference_run.py
    type: modified
    span: {start_line: 80, end_line: 80}
    summary: Add optional accepted preparation to the shared run fixture.
    rationale: Exercise runtime preparation validation without changing existing cases.
  - path: tests/test_source_reference_run.py
    type: modified
    span: {start_line: 183, end_line: 204}
    summary: Build the accepted preparation from the fixture's stable inputs.
    rationale: Reproduce a reviewed contract before the runtime run adds its temporary workspace path.
  - path: tests/test_source_reference_run.py
    type: modified
    span: {start_line: 209, end_line: 210}
    summary: Reuse the fixture's objective and pinned base commit.
    rationale: Keep preparation and runtime inputs identical for the regression case.
  - path: tests/test_source_reference_run.py
    type: modified
    span: {start_line: 215, end_line: 215}
    summary: Reuse the exact validation profile when compiling and running.
    rationale: Ensure any remaining contract comparison difference comes from runtime-only data.
  - path: tests/test_source_reference_run.py
    type: modified
    span: {start_line: 222, end_line: 222}
    summary: Pass the accepted preparation into source-reference run setup.
    rationale: Cover the production path that previously rejected every worker attempt.
  - path: tests/test_source_reference_run.py
    type: modified
    span: {start_line: 237, end_line: 246}
    summary: Verify a temporary workspace path does not invalidate accepted preparation.
    rationale: Preserve the actual path in the worker contract while comparing only stable reviewed fields.
  - path: packages/service/src/powdrr_service/planning/assembly.py
    type: modified
    span: {start_line: 314, end_line: 1235}
    summary: Include per-requirement coverage facts in proposal context and direct proposals to documented remaining gaps.
    rationale: Prevent proposals from repeating deliverables already satisfying part of an unresolved requirement.
  - path: packages/service/src/powdrr_service/planning/driver.py
    type: modified
    span: {start_line: 38, end_line: 1346}
    summary: Pass accepted coverage assessments into work-unit context and recognize the revised proposal contract.
    rationale: Preserve coverage reasons, evidence, and partial remainders through proposal generation.
  - path: tests/test_planning_assembly.py
    type: modified
    span: {start_line: 640, end_line: 1360}
    summary: Verify coverage-gap guidance and update proposal-context fixtures.
    rationale: Prevent proposing already-satisfied subtasks without considering coverage.
  - path: tests/test_planning_service.py
    type: modified
    span: {start_line: 1048, end_line: 1077}
    summary: Update accepted proposal fixtures to contract version 7.
    rationale: Keep service tests aligned with the coverage-aware proposal contract.
  - path: tests/test_benchmark_planning_scale.py
    type: modified
    span: {start_line: 218, end_line: 265}
    summary: Update benchmark fixtures to contract version 7.
    rationale: Keep scale planning fixtures aligned with the coverage-aware proposal contract.
entities: []
entity_relationships: []
invariants:
  - id: runtime-workspace-is-not-review-contract
    description: A runtime candidate workspace path does not affect equality with the reviewed execution preparation.
    action: added
    rationale: Temporary checkout locations vary between attempts and cannot be predeclared in a reviewed plan.
guidance:
  - id: preserve-runtime-workspace-in-handoff
    description: Exclude workspace_root only from the stable preparation comparison; retain its actual value in the runtime worker handoff.
    action: added
  - id: work-unit-proposals-address-remaining-coverage
    description: Work-unit proposals receive each unresolved requirement's coverage assessment and must target the documented remaining gap.
    action: added
    rationale: Broad source requirements can remain unresolved after a narrower subtask is already complete, so proposal generation must account for that completion evidence.
