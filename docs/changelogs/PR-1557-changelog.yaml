invariants:
  - id: proposed-work-targets-remaining-coverage
    description: Every work-unit proposal is generated with the coverage assessment for each unresolved requirement and targets its documented remaining gap.
    action: added
    rationale: A broad requirement may remain incomplete after one narrower subtask is already satisfied.
guidance:
  - id: reconcile-proposed-criteria-with-pinned-evidence
    description: Proposal generation compares each deliverable and acceptance criterion with the pinned implementation and test evidence.
    action: added
    rationale: Avoid scheduling work that already satisfies a proposed criterion.
