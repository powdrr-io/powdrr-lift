schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1557
title: Include remaining coverage in planning proposals
intent:
  problem: Requirement-level coverage can identify a broad requirement as unresolved even when an individual proposed subtask is already implemented, because work-unit proposals do not receive the coverage assessment's remaining-gap explanation.
  goal: Pass each unresolved requirement's coverage assessment into proposal generation and require proposed work to address the documented remaining gap.
