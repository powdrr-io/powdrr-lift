    type: modified
    span: {start_line: 10, end_line: 10}
    summary: Accept the optional reviewed verification command.
    rationale: Make the implementation plan's declared command available to PR preparation.
  - path: packages/service/src/powdrr_service/resources/processes/finish-pr-prep.yaml
    type: modified
    span: {start_line: 33, end_line: 33}
    summary: Branch on whether repository validation tools are available.
    rationale: Preserve discovered repository checks while enabling a declared fallback.
