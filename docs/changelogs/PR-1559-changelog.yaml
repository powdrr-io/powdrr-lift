schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1559
title: Run reviewed verification when PR prep inventory is absent
intent:
  problem: Implementation workflows can successfully run their reviewed verification command but then fail PR preparation because the repository has no validation tool labeled pr-prep.
  goal: Pass the reviewed command into PR preparation and run it when the repository validation inventory is missing.
human-decisions: []
structured_files: []
