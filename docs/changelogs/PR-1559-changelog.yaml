invariants:
  - id: pr-prep-prefers-repository-validation-inventory
    description: When repository PR-prep validation tools are available, finish-pr-prep continues to run each discovered tool.
    action: altered
    rationale: The reviewed command is only a fallback for repositories without a declared validation inventory.
  - id: pr-prep-fallback-is-reviewed
    description: The validation fallback runs only the verification command supplied by the reviewed implementation context.
    action: added
    rationale: Avoid inventing or guessing repository validation commands.
guidance:
  - id: use-reviewed-verification-as-pr-prep-fallback
    description: If a repository has no pr-prep validation inventory, pass the reviewed verification command to finish-pr-prep and execute it as the validation check.
    action: added
    rationale: Successful implementation verification should remain sufficient to prepare a PR when repository validation metadata has not been established.
