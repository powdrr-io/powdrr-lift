schema: https://powdrr.io/schema/changelog-v2
change_id: 1561
title: Reuse dependency evidence during issue queue checks
intent:
  problem: Queue discovery repeats GitHub reads for prerequisite comments and pull requests and reloads the same pinned plan and issue index for multiple items.
  goal: Reuse immutable dependency evidence and per-plan inputs within each queue evaluation pass while keeping the selected issue's queue state fresh before claim.
