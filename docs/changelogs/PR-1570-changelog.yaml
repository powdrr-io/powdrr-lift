schema: https://powdrr.io/schema/changelog-v2
change_id: 1570
title: Trace issue-worker Procedrr judge interactions
intent:
  problem: Procedrr provider attempts in the GitHub issue worker were not persisted with the process run, and content-derived trace IDs could conflate identical prompts from separate activations.
  goal: Link each judge activation to its provider requests and transport retries with run, gate, prompt fingerprint, and replay metadata.
human-decisions: []
