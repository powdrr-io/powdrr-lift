schema: https://powdrr.io/schema/changelog-v2
change_id: 1570
title: Trace durable issue worker model attempts
intent:
  problem: The durable issue worker did not persist per-attempt model telemetry or
    connect successful judge events to provider retries.
  goal: Record privacy-conscious task-scoped Procedrr attempt telemetry and summarize
    request counts, retries, usage, and trace linkage while marking unobserved routes
    explicitly.
