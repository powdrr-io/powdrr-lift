entities:
  - id: issue-worker-procedrr-interaction-tracing
    type: Feature
    action: added
entity_relationships: []
invariants:
  - id: procedrr-interaction-identity
    description: Each judge activation has a unique interaction ID; transport attempts for one logical provider request share a request trace ID.
    action: added
    rationale: Repeated prompts must remain distinct across activations while retries remain attributable to the request that caused them.
  - id: procedrr-telemetry-content-boundary
    description: Provider-attempt telemetry records identifiers, fingerprints, retry metadata, and usage without copying prompt or response content.
    action: added
    rationale: Preserve traceability while keeping private request and response data in existing run artifacts.
guidance:
  - id: link-new-judge-routes-to-interaction-traces
    description: New issue-worker judge routes should propagate caller identity and gate/path metadata through provider-attempt telemetry.
    action: added
    rationale: Keep per-route request and retry counts reconstructable as WP0 coverage expands.
