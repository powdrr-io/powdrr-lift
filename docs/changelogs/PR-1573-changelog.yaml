entities:
  - id: miniswe-inference-interaction-tracing
    type: Feature
    action: added
entity_relationships: []
invariants:
  - id: miniswe-telemetry-content-boundary
    description: MiniSWE inference telemetry records interaction identity and fingerprints without prompt, response, or provider error message content.
    action: added
    rationale: Preserve auditability without copying private model inputs or outputs into generic telemetry.
  - id: miniswe-run-summary-coverage
    description: Run telemetry counts each MiniSWE interaction separately from its transport attempts.
    action: added
    rationale: Keep issue-worker model-call totals representative of both Procedrr and MiniSWE routes.
guidance:
  - id: persist-miniswe-inference-traces
    description: Keep MiniSWE model inference behind the parent-side trace wrapper whenever diagnostics are enabled.
    action: added
    rationale: Maintain task attribution and redaction for future child-worker inference routes.
