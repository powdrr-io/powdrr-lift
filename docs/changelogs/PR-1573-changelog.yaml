schema: https://powdrr.io/schema/changelog-v2
change_id: 1573
title: Trace MiniSWE inference interactions
intent:
  problem: MiniSWE model calls run inside a child worker and were absent from issue-worker model interaction telemetry.
  goal: Persist redacted per-request MiniSWE records with task and attempt identity and include them in run telemetry summaries.
human-decisions: []
structured_files: []
