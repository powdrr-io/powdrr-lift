schema: https://powdrr.io/schema/changelog-v2
change_id: 1576
title: Remove redundant planner LLM metadata calls
intent:
  problem: The planner used model calls to render titles/objectives for frozen work
    groups and to restate provenance after confirming a dependency.
  goal: Derive item metadata and confirmed dependency edge details from accepted planning
    facts, retaining the semantic candidate decision.
