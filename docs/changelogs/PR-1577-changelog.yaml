schema: https://powdrr.io/schema/changelog-v2
change_id: 1577
title: Generate a changelog for every clean PR publication
intent:
  problem: Clean PR publication could return a draft PR without a PR-numbered changelog, leaving changelog creation to a later manual step.
  goal: Generate and validate a changelog from the actual PR diff before clean publication completes.
