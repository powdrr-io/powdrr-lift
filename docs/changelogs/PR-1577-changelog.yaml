    summary: Import regular-expression support for PR identity parsing.
    rationale: Resolve the generated changelog filename from the created PR URL.
  - path: src/powdrr_lift/clean_pr_publisher.py
    type: modified
    span: {start_line: 15, end_line: 18}
    summary: Import YAML and changelog validation support.
    rationale: Render and validate the generated PR changelog.
  - path: src/powdrr_lift/clean_pr_publisher.py
    type: modified
    span: {start_line: 395, end_line: 406}
    summary: Generate a changelog after clean publication creates or updates the draft PR.
    rationale: Ensure every clean PR has its changelog before the publisher reports success.
  - path: src/powdrr_lift/clean_pr_publisher.py
    type: modified
