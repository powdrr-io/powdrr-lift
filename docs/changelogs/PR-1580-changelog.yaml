schema: https://powdrr.io/schema/changelog-v2
change_id: 1580
title: Make source requirement paging deterministic
intent:
  problem: Requirement extraction allowed the model to choose a source cursor, which made page coverage
    and answer correlation dependent on model output.
  goal: Have the scheduler create fixed source-anchor windows and accept only semantic requirement records
    tied to each supplied window.
