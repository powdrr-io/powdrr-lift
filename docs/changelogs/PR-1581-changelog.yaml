entities:
  - id: worker-model-interaction-baseline-reporting
    type: Feature
    action: added
entity_relationships: []
invariants:
  - id: quality-review-counts-are-not-network-counts
    description: Embedded quality-review provider-call attempts are reported separately from transport-request totals.
    action: added
    rationale: Avoid claiming transport-level visibility from the JSON completion interface.
  - id: baseline-report-does-not-extrapolate
    description: Missing representative runtime artifacts produce unobserved measurements rather than inferred counts.
    action: added
    rationale: Keep static fanout estimates separate from empirical usage.
guidance:
  - id: preserve-worker-route-attribution
    description: Label MiniSWE requests with caller, gate, evidence fingerprint, evidence IDs, and check identity for each worker route.
    action: added
    rationale: Make later route-specific baseline counts reconstructable from stored attempts.
