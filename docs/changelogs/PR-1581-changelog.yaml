schema: https://powdrr.io/schema/changelog-v2
change_id: 1581
title: Report worker model-interaction baseline coverage
intent:
  problem: Per-test quality traces were not included in run summaries, MiniSWE traces lacked route attribution on implementation and CI repair, and no report distinguished instrumented routes from unobserved runtime evidence.
  goal: Aggregate quality-review call attempts, label worker routes, and document trace coverage and missing measurements without estimating production counts.
human-decisions: []
structured_files: []
files:
  - path: docs/audits/github-issue-worker-llm-audit.md
    type: modified
    span: {start_line: 588, end_line: 593}
    summary: Record that WP0 instrumentation is implemented while its empirical route measurements remain open.
    rationale: Distinguish trace availability from observed production usage.
  - path: docs/audits/github-issue-worker-llm-audit.md
    type: modified
    span: {start_line: 608, end_line: 609}
    summary: Link the WP0 baseline coverage report from the work-package exit criteria.
    rationale: Make route coverage and unobserved measurements discoverable from the audit plan.
  - path: docs/reports/github-issue-worker-model-interaction-baseline-2026-11-18.md
    type: added
    span: {start_line: 1, end_line: 71}
    summary: Document trace coverage by representative route, unavailable runtime samples, and measurement limits.
    rationale: Report missing data explicitly and avoid extrapolating static call estimates.
  - path: packages/service/src/powdrr_service/local_service.py
    type: modified
    span: {start_line: 354, end_line: 355}
    summary: Omit task and attempt identity when the service request does not supply it.
    rationale: Avoid presenting empty identity values as meaningful trace metadata.
  - path: packages/service/src/powdrr_service/local_service.py
    type: modified
    span: {start_line: 355, end_line: 359}
