schema: https://powdrr.io/schema/changelog-v2
change_id: 1583
title: Make work-unit proposal progression deterministic
intent:
  problem: Work-unit proposal answers controlled their own cursor, making coverage
    and follow-up question selection dependent on model output.
  goal: Have the scheduler create fixed requirement groups, accept semantic proposal
    records only, and schedule uncovered requirements deterministically.
