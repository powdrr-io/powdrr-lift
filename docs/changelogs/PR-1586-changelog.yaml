schema: https://powdrr.io/schema/changelog-v2
change_id: 1586
title: Make structural subject paging deterministic
intent:
  problem: Structural subject enumeration answers let the model choose whether pagination
    continued.
  goal: Have the planner request another deterministic page whenever an answer reaches
    the fixed record limit and accept subject records only.
