schema: https://powdrr.io/schema/changelog-v2
change_id: 1587
title: Derive unambiguous planner phase assignments
intent:
  problem: The work-unit planner asked the model to return implementation phase values that were already
    determined when the source declared zero or one phase.
  goal: Derive empty or sole phase assignments deterministically and retain model selection only when
    multiple source phases require a choice.
