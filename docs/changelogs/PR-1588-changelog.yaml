schema: https://powdrr.io/schema/changelog-v2
change_id: 1588
title: Render worker publication requests deterministically
intent:
  problem: Successful implementation and plan-amendment PR descriptions still depended on model judges even though their source facts were already recorded in typed plan, repair, and validation evidence.
  goal: Render both publication requests from typed evidence in code, validate all required sections and identity fields, and fail closed when required evidence is absent.
