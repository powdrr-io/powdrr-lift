    summary: Match credential assignments when sanitizing failure text.
    rationale: Prevent key and token values embedded in provider errors from being persisted.
  - path: src/powdrr_lift/workrr/coding_agent.py
    type: modified
    span: {start_line: 1584, end_line: 1642}
    summary: Extract and sanitize MiniSWE terminal failure details.
    rationale: Preserve a bounded provider cause while redacting credentials.
  - path: src/powdrr_lift/workrr/coding_agent.py
    type: modified
    span: {start_line: 2036, end_line: 2039}
    summary: Include bounded stderr details in failed coding-agent attempt errors.
    rationale: Make the structured attempt error actionable for provider and process failures.
  - path: tests/test_coding_agent.py
    type: modified
    span: {start_line: 809, end_line: 849}
    summary: Cover a MiniSWE HTTP 429 failure and embedded credential redaction.
    rationale: Ensure a failed model request keeps its diagnostic cause without exposing an API key.
