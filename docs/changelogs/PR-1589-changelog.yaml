schema: https://powdrr.io/schema/changelog-v2
change_id: 1589
title: Preserve MiniSWE provider failure details
intent:
  problem: MiniSWE provider errors were saved in its trajectory but reduced to a generic coding-agent process failure in the structured attempt result.
  goal: Preserve a bounded, credential-sanitized terminal cause so provider and worker failures can be diagnosed from the durable result.
human-decisions: []
structured_files: []
