    type: modified
    span: {start_line: 13, end_line: 13}
    summary: Add regular-expression support for credential redaction.
    rationale: Provider diagnostics must not persist embedded credential values.
  - path: src/powdrr_lift/workrr/coding_agent.py
    type: modified
    span: {start_line: 43, end_line: 43}
    summary: Use the shared diagnostic sanitizer for coding-agent errors.
    rationale: Apply common token redaction to terminal provider failures.
  - path: src/powdrr_lift/workrr/coding_agent.py
    type: modified
    span: {start_line: 1426, end_line: 1430}
    summary: Resolve the MiniSWE trajectory path for failed runs.
    rationale: Read terminal failure details from the attempt artifact.
  - path: src/powdrr_lift/workrr/coding_agent.py
    type: modified
    span: {start_line: 1434, end_line: 1445}
    summary: Attach MiniSWE's terminal trajectory error to process stderr.
    rationale: Preserve provider failures when the MiniSWE process exits unsuccessfully.
  - path: src/powdrr_lift/workrr/coding_agent.py
    type: modified
    span: {start_line: 1447, end_line: 1447}
    summary: Reuse the resolved trajectory path for successful-run checks.
