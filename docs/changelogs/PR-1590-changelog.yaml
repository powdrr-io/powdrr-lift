schema: https://powdrr.io/schema/changelog-v2
change_id: 1590
title: Bind planner batch answers by position
intent:
  problem: Combined planner requests ask the model to repeat known question IDs as answer-map keys even
    though request order and identity are already tracked by code.
  goal: Have the model return one schema-ordered answer per request and bind each position to its known
    question ID in the scheduler.
