schema: https://powdrr.io/schema/changelog-v2
change_id: 1593
title: Combine structural candidate and delta review
intent:
  problem: Existing structural candidates required a boolean relevance request followed by a desired-content
    request when relevant, repeating the same semantic judgment.
  goal: Ask one validated desired-delta question per deterministic existing candidate and let its unchanged/change
    result cover both relevance and content.
