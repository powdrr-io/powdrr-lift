schema: https://powdrr.io/schema/changelog-v2
change_id: 1595
title: Handle collected PR prep validation results
intent:
  problem: PR preparation collected validation results as nested id and result objects, but publication rendering did not read that result shape and rejected the validation command.
  goal: Render validation evidence from Procedrr's collected result so implementation PR preparation can continue after successful verification.
