schema: https://powdrr.io/schema/changelog-v2
change_id: 1596
title: Move source task bookkeeping into runtime
intent:
  problem: Source-reference worker prompts repeated exact owner metadata, reference commands, verification commands, and completion-envelope fields already known to the runtime.
  goal: Keep the worker focused on implementation and unresolved design gaps while the runtime compiles owner metadata, runs checks, and serializes completion evidence from accepted typed state.
