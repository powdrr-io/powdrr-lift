schema: https://powdrr.io/schema/changelog-v2
change_id: 1597
title: Compile typed test-authoring requests in runtime
intent:
  problem: Execute-PR test authors received broad prose and linked acceptance criteria
    with comments, while runtime metadata and actual pytest collection were validated
    separately.
  goal: Compile accepted cases into typed requests, compile coverage links from AST
    and collected selectors, and generate the test manifest and baseline policy in
    runtime code.
