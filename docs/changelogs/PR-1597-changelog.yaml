schema: https://powdrr.io/schema/changelog-v2
change_id: 1597
title: Allow additive paths in typed plan repairs
intent:
  problem: Plan repair rejected an evidence-backed addition to an item's allowed paths, even when an implementation step and acceptance criterion required a test at that path.
  goal: Let Powdrr publish a reviewed repair that adds required repository paths, preserve existing permissions, and carry the repaired paths into the generated workflow.
