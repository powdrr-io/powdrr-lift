change_id: 1598
title: Carry exact typed source test cases deterministically
intent:
  problem: P10 asks an LLM to recreate complete test designs that can already be present as typed records in pinned source.
  goal: Carry exact typed source test designs through existing validation and compilation, using model design only when the source records do not fully cover the plan criteria.
