schema: https://powdrr.io/schema/changelog-v2
change_id: 1600
title: Bind deterministic planning coverage to execution receipts
intent:
  problem: Generic execution-receipt evidence does not prove that a specific accepted requirement passed against the pinned source and candidate.
  goal: Allow deterministic completion only when one explicitly supplied typed receipt binds the exact requirement, source and candidate commits, oracle, command, observed pass, and pinned artifact evidence.
