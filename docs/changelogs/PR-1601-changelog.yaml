schema: https://powdrr.io/schema/changelog-v2
change_id: 1601
title: Reduce per-test quality review calls
intent:
  problem: Each positive test-quality decision triggered duplicate opinion and generated-test suggestion calls; registered tautological assertions also required a model decision.
  goal: Detect registered tautologies deterministically, retain semantic review for unresolved checks, and route structured findings to the independent test author.
