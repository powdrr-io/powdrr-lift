schema: https://powdrr.io/schema/changelog-v2
change_id: 1602
title: Recognize inline MiniSWE completion submissions
intent:
  problem: MiniSWE can emit its completion marker and JSON payload on the same first line, which the environment treated as an ordinary command result and caused the worker to repeat indefinitely.
  goal: Recognize the inline marker form as a submission and pass its payload to the existing submission validation flow.
