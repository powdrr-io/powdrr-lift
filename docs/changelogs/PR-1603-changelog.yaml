schema: https://powdrr.io/schema/changelog-v2
change_id: 1603
title: Route typed execute-PR failures and bind repair evidence
intent:
  problem: Execute-PR failure review relied on a model to detect known plan contradictions and accepted
    repair evidence IDs without binding them to observed gate output.
  goal: Route explicit contradictions and typed worker/environment blocks deterministically, preserve
    semantic review for ambiguous failures, and bind plan repair discovery to observed, cited evidence.
