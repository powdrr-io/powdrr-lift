schema: https://powdrr.io/schema/changelog-v2
change_id: 1606
title: Load pinned execution receipts in planning sessions
intent:
  problem: The planner has a typed receipt consumer but no supported input path for external observed execution receipts.
  goal: Let planning sessions consume a strict external receipt manifest pinned to the planning commit and requirement IDs.
