schema: https://powdrr.io/schema/changelog-v2
change_id: 1608
title: Discover planner receipt artifacts from GitHub
intent:
  problem: Planning can validate supplied execution receipt manifests but does not find manifests attached to GitHub workflow runs.
  goal: Discover a receipt artifact only from a successful workflow run for the exact pinned commit, while preserving semantic fallback when no artifact is available.
