  - {path: *agent_file, type: modified, span: {start_line: 5998, end_line: 6001}, summary: Prepare testless registered correction contracts, rationale: Admit the formatter route while keeping source scope constrained.}
  - {path: *agent_file, type: modified, span: {start_line: 6029, end_line: 6039}, summary: Validate formatter reproduction and derive its path, rationale: Bind dispatch to the reproduced source target.}
  - {path: *agent_file, type: modified, span: {start_line: 6045, end_line: 6045}, summary: Select the sole correction path, rationale: Limit the formatter operation to its registered file.}
  - {path: *agent_file, type: modified, span: {start_line: 6546, end_line: 6554}, summary: Validate restored correction attempts, rationale: Match saved results to the registered provider identity.}
  - {path: *agent_file, type: modified, span: {start_line: 6561, end_line: 6567}, summary: Report interrupted correction receipts, rationale: Prevent redispatch when an invocation has no durable result.}
  - {path: *agent_file, type: modified, span: {start_line: 6573, end_line: 6573}, summary: Distinguish correction and model dispatch records, rationale: Recover the correct provider path.}
  - {path: *agent_file, type: modified, span: {start_line: 6610, end_line: 6616}, summary: Block unsafe recovery of interrupted corrections, rationale: Avoid applying the formatter twice after an incomplete attempt.}
  - {path: *agent_file, type: modified, span: {start_line: 6622, end_line: 6622}, summary: Use the matching recovery reason, rationale: Explain why an interrupted deterministic action cannot resume automatically.}
  - {path: *agent_file, type: modified, span: {start_line: 6693, end_line: 6697}, summary: Record correction invocation receipts, rationale: Make deterministic dispatch durable before mutation begins.}
  - {path: *agent_file, type: modified, span: {start_line: 6723, end_line: 6729}, summary: Dispatch registered corrections before model invocation, rationale: Execute the fixed formatter operation through the existing attempt path.}
  - {path: *agent_file, type: modified, span: {start_line: 6731, end_line: 6731}, summary: Save the correction request, rationale: Preserve audit data for the deterministic attempt.}
  - {path: *agent_file, type: modified, span: {start_line: 6736, end_line: 6738}, summary: Persist correction dispatch state, rationale: Support safe interruption handling.}
  - {path: *agent_file, type: modified, span: {start_line: 6741, end_line: 6815}, summary: Run registered correction and save its result, rationale: Route the deterministic attempt through validation, acceptance, and publication checks.}
