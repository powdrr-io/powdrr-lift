  - {path: *agent_file, type: modified, span: {start_line: 5506, end_line: 5757}, summary: Apply and validate one registered Ruff correction, rationale: Recheck evidence, format one target, preserve AST and protected artifacts, and reject out-of-scope changes.}
  - {path: *agent_file, type: modified, span: {start_line: 5858, end_line: 5862}, summary: Restore registered correction attempts, rationale: Recognize deterministic correction providers during recovery.}
