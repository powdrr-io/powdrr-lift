schema: https://powdrr.io/schema/changelog-v2
change_id: 1610
title: Preflight issue worker CI readiness
intent:
  problem: The issue worker could run an implementation workflow and publish a PR before discovering that the repository had no fresh validation inventory or no required default-branch checks.
  goal: Block queued work with actionable diagnostics before claiming or executing it when CI readiness prerequisites are missing or cannot be verified.
human-decisions: []
structured_files: []
