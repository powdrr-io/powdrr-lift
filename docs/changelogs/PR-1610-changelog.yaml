  span:
    start_line: 752
    end_line: 832
  summary: Read active ruleset and classic branch-protection required checks from GitHub.
  rationale: Verify the default branch has required checks before the worker begins implementation.
- path: src/powdrr_lift/workrr/github_issue_queue.py
  type: modified
  span:
    start_line: 1607
    end_line: 1654
  summary: Block queued work before execution when the committed validation inventory is stale or required checks are absent.
  rationale: Prevent creating implementation PRs that the later CI readiness observer must block.
