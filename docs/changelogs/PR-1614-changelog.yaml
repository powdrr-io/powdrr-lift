schema: https://powdrr.io/schema/changelog-v2
change_id: 1614
title: Bind planned test cases to allocated requirements
intent:
  problem: Planner test cases do not identify which allocated requirements they are intended to verify.
  goal: Carry requirement IDs through the existing test-design request and into each planned test case, validating that all IDs belong to the item's allocated requirements.
