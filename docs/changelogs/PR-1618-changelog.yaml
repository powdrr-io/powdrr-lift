schema: https://powdrr.io/schema/changelog-v2
change_id: 1618
title: Carry per-case requirement bindings into planner workflows
intent:
  problem: Generated planner workflows carry item-level requirements but not the requirements each planned test case is intended to verify.
  goal: Compile accepted case-level requirement IDs into workflow descriptors with canonical requirement digests, and validate the mapping against the item allocation and accepted Structrr proposal.
