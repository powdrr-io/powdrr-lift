    type: exercises
    source: source-scope-recovery-regression-tests
    target: reviewed-source-scope-recovery
    action: added
    description: Checks exact path recovery and rejection when required repository evidence is absent or invalid.
invariants:
  - id: scope-recovery-is-path-specific
    description: Recovery adds only exact paths that are tracked regular files, are not protected, and have accepted source and test references plus a valid runtime evidence-bound review.
    action: added
