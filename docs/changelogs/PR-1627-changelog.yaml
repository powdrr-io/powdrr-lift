schema: https://powdrr.io/schema/changelog-v2
change_id: 1627
title: Recover justified source task scope mismatches
intent:
  problem: A source task can terminate when its candidate changes a generated tracked artifact that the plan omitted from allowed paths.
  goal: Review exact out-of-scope artifacts against accepted criteria and repository producer and test references, then continue validation with only paths approved by the runtime reviewer.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/workrr/source_reference_dispatch.py
    type: modified
    span: {start_line: 9, end_line: 9}
    summary: Add file mode inspection for candidate scope evidence.
    rationale: Ensure a candidate path preserves the tracked file mode before it can be reviewed.
  - path: src/powdrr_lift/workrr/source_reference_dispatch.py
    type: modified
    span: {start_line: 126, end_line: 307}
    summary: Review tracked candidate artifacts against accepted scope and allowed source references.
    rationale: Let the source task repair a derived path omission inside its current correction budget while retaining evidence and normal validation.
  - path: src/powdrr_lift/workrr/source_reference_dispatch.py
    type: modified
    span: {start_line: 647, end_line: 647}
    summary: Track the runtime approved path delta during the source task.
    rationale: Apply only reviewed exact paths to the next candidate attempt.
  - path: src/powdrr_lift/workrr/source_reference_dispatch.py
    type: modified
    span: {start_line: 660, end_line: 660}
    summary: Use the item local effective scope when preparing the follow up candidate.
    rationale: Recheck the candidate against the amended exact path set.
  - path: src/powdrr_lift/workrr/source_reference_dispatch.py
    type: modified
    span: {start_line: 691, end_line: 691}
    summary: Persist exact scope decisions and evidence before continuing.
    rationale: Preserve the scope review across worker result reporting and recovery.
  - path: src/powdrr_lift/workrr/source_reference_dispatch.py
    type: modified
    span: {start_line: 758, end_line: 786}
    summary: Requeue scope denied candidates into the existing bounded correction loop.
    rationale: Continue implementation and validation within the same worker claim.
  - path: src/powdrr_lift/workrr/source_reference_dispatch.py
    type: modified
    span: {start_line: 790, end_line: 790}
    summary: Pass approved paths and correction instructions to the coding agent.
    rationale: Preserve accepted work while the candidate proceeds through normal gates.
  - path: src/powdrr_lift/workrr/source_reference_dispatch.py
    type: modified
    span: {start_line: 842, end_line: 860}
    summary: Include the persisted scope recovery decision in the task result.
    rationale: Make the authorized path delta inspectable by later workflow stages.
  - path: src/powdrr_lift/workrr/source_reference_dispatch.py
    type: modified
    span: {start_line: 890, end_line: 890}
    summary: Include the reviewed scope decision with source execution results.
    rationale: Preserve recovery evidence for the issue worker report.
  - path: tests/test_source_reference_dispatch.py
    type: modified
    span: {start_line: 37, end_line: 198}
    summary: Cover generated artifact approval, missing consumer evidence, and rejection of unbound reviewer evidence IDs.
    rationale: Verify scope recovery depends on repository evidence and accepts only evidence IDs generated by the runtime.
entities:
  - id: reviewed-source-scope-recovery
    type: Function
    action: added
  - id: source-scope-recovery-regression-tests
    type: Regression test
    action: added
entity_relationships:
