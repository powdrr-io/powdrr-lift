schema: https://powdrr.io/schema/changelog-v2
change_id: 1629
title: Preserve unresolved planner test dimensions
intent:
  problem: Planner test-design requests had no explicit unresolved state for a behavior dimension, so uncertainty could be lost or misrepresented as not_applicable.
  goal: Carry canonical unresolved dimensions into the typed behavior scenario and invalidate answers created under the older test-design contract.
