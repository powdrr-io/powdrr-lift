    span: {start_line: 278, end_line: 287}
    summary: Tell the test-design provider how to represent unresolved dimensions.
    rationale: Keep unknown meaning explicit and prevent it from being marked not_applicable.
  - path: packages/service/src/powdrr_service/planning/test_coverage.py
    type: modified
    span: {start_line: 506, end_line: 518}
    summary: Derive unresolved dimensions from canonical unresolved values.
    rationale: Convert the semantic answer marker into the typed downstream gate field.
  - path: packages/service/src/powdrr_service/planning/test_coverage.py
    type: modified
    span: {start_line: 532, end_line: 532}
