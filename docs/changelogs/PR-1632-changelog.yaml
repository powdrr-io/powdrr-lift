schema: https://powdrr.io/schema/changelog-v2
change_id: 1632
title: Route policy-denied source edits through scope review
intent:
  problem: A MiniSWE attempt that changed out-of-scope files was marked policy_denied, but source-run finalization returned early before reporting the scope violation. Post-worker reconciliation then misclassified it as invalid_candidate, so exact-path scope review never ran. Scope review then rejected generated fixtures because it compared a resolved file path against an unresolved macOS temporary-directory alias. After implementation succeeded, clean PR publication ignored the appended issue-closing reference because it rendered the body from structured description sections, created a draft PR that CI observation could not accept, and the observer blocked when GitHub Free hid required-check policy despite reporting passing checks for the exact PR head.
  goal: Route policy-denied edits into scope review, review generated outputs using producer and fixture-test evidence, compare canonical paths safely, persist review failures and decisions, and ensure issue-worker clean publication creates a review-ready PR with an issue reference and gates on all checks GitHub reports when required-check policy is unavailable.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/workrr/coding_agent_validation.py
    type: modified
    span: {start_line: 603, end_line: 605}
    summary: Reconcile source candidates only after a completed worker attempt.
    rationale: Prevent an incomplete or policy-denied attempt from being replaced by a misleading candidate-finalization error.
  - path: src/powdrr_lift/workrr/source_reference_run.py
    type: modified
    span: {start_line: 1290, end_line: 1291}
    summary: Remove the early return that hid out-of-scope paths on incomplete attempts.
    rationale: Allow a policy-denied worker's changed paths to be classified before returning from finalization.
  - path: src/powdrr_lift/workrr/source_reference_run.py
    type: modified
    span: {start_line: 1296, end_line: 1298}
    summary: Report out-of-scope paths before handling incomplete attempts and snapshot other incomplete candidates.
    rationale: Route policy-denied out-of-scope changes into the existing exact-path scope review while keeping unrelated incomplete candidates immutable.
  - path: tests/test_source_reference_run.py
    type: modified
    span: {start_line: 608, end_line: 650}
    summary: Cover policy-denied scope reporting and incomplete candidate snapshots.
    rationale: Prevent regressions in source-run routing and candidate finalization.
  - path: src/powdrr_lift/workrr/source_reference_dispatch.py
    type: modified
    span: {start_line: 126, end_line: 300}
    summary: Include generated outputs supported by fixture tests in exact-path review, use canonical paths for containment, and persist review outcomes and exceptions.
    rationale: Avoid rejecting necessary generated fixture outputs due to path aliases and retain concrete evidence when scope recovery cannot proceed.
  - path: tests/test_source_reference_dispatch.py
    type: modified
    span: {start_line: 150, end_line: 255}
    summary: Cover generated-output review evidence, canonicalized checkout-root containment, and diagnostics for paths without sufficient provenance.
    rationale: Ensure fixture outputs can reach exact-path review and unreviewable paths are reported explicitly.
  - path: src/powdrr_lift/workrr/task_agent.py
    type: modified
    span: {start_line: 2850, end_line: 2905}
    summary: Add issue-closing references to the structured description used by clean PR publication.
    rationale: Ensure CI observation can associate a newly published issue-worker PR with its originating issue.
  - path: tests/test_workflow_task_agent.py
    type: modified
    span: {start_line: 300, end_line: 355}
    summary: Verify clean PR publication renders the issue-closing reference into its body.
    rationale: Prevent regressions where the structured publication template discards the issue reference.
  - path: src/powdrr_lift/intrinsic_git_gh.py
    type: modified
    span: {start_line: 698, end_line: 720}
    summary: Keep ordinary PR creation draft-only while publishing verified clean PRs ready for review.
    rationale: Allow the issue workflow to complete CI observation and leave its implementation PR ready for human review.
  - path: tests/test_intrinsic_git_gh.py
    type: modified
    span: {start_line: 100, end_line: 220}
    summary: Assert ordinary PR creation remains a draft and verified clean publication is not.
    rationale: Preserve draft behavior for ordinary PRs while preventing verified issue-worker PRs from being blocked as drafts.
  - path: packages/agent/src/powdrr_agent/execution/github_actions.py
    type: modified
    span: {start_line: 412, end_line: 560}
    summary: Fall back to all checks reported for the PR when required-check policy is unavailable and retain the check source and reason.
    rationale: Allow private repositories on GitHub Free to complete CI observation without inferring success from missing policy.
  - path: packages/service/src/powdrr_service/ci_response/observation.py
    type: modified
    span: {start_line: 200, end_line: 250}
    summary: Preserve the reported-check source in the normalized CI observation.
    rationale: Make fallback provenance visible in the durable CI checkpoint.
  - path: tests/test_github_actions_transport.py
    type: modified
    span: {start_line: 260, end_line: 370}
    summary: Cover GitHub Free policy denial and fallback to all reported PR checks.
    rationale: Prevent successful exact-head checks from being blocked solely because branch-protection policy is unavailable.
  - path: tests/test_ci_response_cli.py
    type: modified
    span: {start_line: 420, end_line: 540}
    summary: Verify refreshed check sources flow through CI observation.
    rationale: Keep the durable checkpoint accurate when required-check policy is unavailable during a wait.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 3876, end_line: 3911}
    summary: Recover a published PR URL from the matching issue's durable PR comment when task completion was not checkpointed.
    rationale: Let CI continuation reconcile an already-published PR after a later workflow step failed.
  - path: tests/test_github_issue_queue.py
    type: modified
    span: {start_line: 3297, end_line: 3332}
    summary: Verify CI continuation recovers and records a PR referenced only by the durable publication comment.
    rationale: Prevent completed implementation PRs from becoming unrecoverable when the task checkpoint is incomplete.
  - path: tests/test_workflow_task_agent.py
    type: modified
    span: {start_line: 1980, end_line: 2053}
    summary: Verify the issue worker attaches the issue-closing reference on the actual clean publication path.
    rationale: Ensure the CI observer can associate a newly published implementation PR with its originating issue.
entities: []
entity_relationships: []
invariants:
  - id: policy-denied-scope-changes-reach-scope-review
    description: An incomplete source worker attempt that changed paths outside accepted scope is reported as a policy violation with its exact out-of-scope paths; reconciliation does not replace that diagnosis.
    action: added
  - id: scope-review-outcomes-are-durable
    description: Each policy-denied scope review records whether paths were approved, rejected, unreviewable, or the review failed, including the affected paths and error details.
    action: added
  - id: issue-worker-pull-request-identifies-its-issue
    description: A clean implementation PR published for a GitHub issue includes a closing reference to that issue in the rendered PR body.
    action: added
  - id: verified-clean-publication-is-review-ready
    description: A clean PR published with accepted implementation and verification evidence is created ready for review; ordinary PR creation retains its draft behavior.
    action: added
  - id: free-github-pr-check-fallback
    description: When GitHub hides required-check policy, CI observation uses all checks reported for the exact PR head, records their source, and remains blocked if no usable checks are available.
    action: added
  - id: published-pr-checkpoint-recovery
    description: CI continuation can recover the published PR URL from the worker's issue comment if a later workflow failure prevented task completion from being checkpointed.
    action: added
guidance: []
