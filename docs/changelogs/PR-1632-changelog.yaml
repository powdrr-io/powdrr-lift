schema: https://powdrr.io/schema/changelog-v2
change_id: 1632
title: Route policy-denied source edits through scope review
intent:
  problem: A MiniSWE attempt that changed out-of-scope files was marked policy_denied, but source-run finalization returned early before reporting the scope violation. Post-worker reconciliation then misclassified it as invalid_candidate, so exact-path scope review never ran. Scope review then rejected generated fixtures because it compared a resolved file path against an unresolved macOS temporary-directory alias. After implementation succeeded, clean PR publication ignored the appended issue-closing reference because it rendered the body from structured description sections.
  goal: Route policy-denied edits into scope review, review generated outputs using producer and fixture-test evidence, compare canonical paths safely, persist review failures and decisions, and ensure published issue-worker PRs identify their issue in the rendered body.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/workrr/coding_agent_validation.py
    type: modified
    span: {start_line: 603, end_line: 605}
    summary: Reconcile source candidates only after a completed worker attempt.
    rationale: Prevent an incomplete or policy-denied attempt from being replaced by a misleading candidate-finalization error.
  - path: src/powdrr_lift/workrr/source_reference_run.py
    type: modified
    span: {start_line: 1290, end_line: 1291}
    summary: Remove the early return that hid out-of-scope paths on incomplete attempts.
    rationale: Allow a policy-denied worker's changed paths to be classified before returning from finalization.
  - path: src/powdrr_lift/workrr/source_reference_run.py
    type: modified
    span: {start_line: 1296, end_line: 1298}
    summary: Report out-of-scope paths before handling incomplete attempts and snapshot other incomplete candidates.
    rationale: Route policy-denied out-of-scope changes into the existing exact-path scope review while keeping unrelated incomplete candidates immutable.
  - path: tests/test_source_reference_run.py
    type: modified
    span: {start_line: 608, end_line: 650}
    summary: Cover policy-denied scope reporting and incomplete candidate snapshots.
    rationale: Prevent regressions in source-run routing and candidate finalization.
  - path: src/powdrr_lift/workrr/source_reference_dispatch.py
    type: modified
    span: {start_line: 126, end_line: 300}
    summary: Include generated outputs supported by fixture tests in exact-path review, use canonical paths for containment, and persist review outcomes and exceptions.
    rationale: Avoid rejecting necessary generated fixture outputs due to path aliases and retain concrete evidence when scope recovery cannot proceed.
  - path: tests/test_source_reference_dispatch.py
    type: modified
    span: {start_line: 150, end_line: 255}
    summary: Cover generated-output review evidence, canonicalized checkout-root containment, and diagnostics for paths without sufficient provenance.
    rationale: Ensure fixture outputs can reach exact-path review and unreviewable paths are reported explicitly.
  - path: src/powdrr_lift/workrr/task_agent.py
    type: modified
    span: {start_line: 2850, end_line: 2905}
    summary: Add issue-closing references to the structured description used by clean PR publication.
    rationale: Ensure CI observation can associate a newly published issue-worker PR with its originating issue.
  - path: tests/test_workflow_task_agent.py
    type: modified
    span: {start_line: 300, end_line: 355}
    summary: Verify clean PR publication renders the issue-closing reference into its body.
    rationale: Prevent regressions where the structured publication template discards the issue reference.
entities: []
entity_relationships: []
invariants:
  - id: policy-denied-scope-changes-reach-scope-review
    description: An incomplete source worker attempt that changed paths outside accepted scope is reported as a policy violation with its exact out-of-scope paths; reconciliation does not replace that diagnosis.
    action: added
  - id: scope-review-outcomes-are-durable
    description: Each policy-denied scope review records whether paths were approved, rejected, unreviewable, or the review failed, including the affected paths and error details.
    action: added
  - id: issue-worker-pull-request-identifies-its-issue
    description: A clean implementation PR published for a GitHub issue includes a closing reference to that issue in the rendered PR body.
    action: added
guidance: []
