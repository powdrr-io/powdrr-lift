title: Preserve source validation relations in planner test design
intent:
  problem: Planner test-design facts already carried source validation relations, but the model instructions did not explain how those accepted relations should constrain test scenarios.
  goal: Direct test design to preserve source relation semantics and invalidate answers produced under the previous prompt contract.
