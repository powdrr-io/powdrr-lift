schema: https://powdrr.io/schema/changelog-v2
change_id: 1634
title: Carry source-bound Boolean logic through planning
intent:
  problem: Requirement prose and flat source relations can lose nested conditions,
    alternatives, and ordering as planner stages transform accepted source facts.
  goal: Capture bounded nested logic as exact source-quoted atoms and carry it through
    requirement review, coverage, work-unit planning, and test design.
human-decisions: []
structured_files: []
