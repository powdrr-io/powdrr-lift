    summary: Import stable structural subject identity for net delta compilation.
    rationale: Compare projected records by the same identity rules used by Structrr state projection.
  - path: packages/service/src/powdrr_service/planning/multipr_structrr.py
    type: modified
    span: {start_line: 331, end_line: 338}
    summary: Project ordered item batches before building the plan-wide proposal.
    rationale: Derive the full-plan change from the pinned starting state and the final ordered state.
  - path: packages/service/src/powdrr_service/planning/multipr_structrr.py
    type: modified
    span: {start_line: 342, end_line: 342}
    summary: Compile the full proposal from the consolidated final-state delta.
    rationale: Avoid duplicate operations when dependent PR items update one subject in sequence.
