schema: https://powdrr.io/schema/changelog-v2
change_id: 1636
title: Collapse ordered structural edits into final state
intent:
  problem: Ordered PR items may update the same structural subject in separate steps, but the plan-wide proposal retains each step as a duplicate operation.
  goal: Preserve each item-specific projection while compiling one deterministic net change from the pinned baseline to the final state.
