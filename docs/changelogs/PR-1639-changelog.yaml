entity_relationships: []
invariants:
  - id: only-valid-requirement-bound-receipts-prove-coverage
    description: A receipt can support coverage only after its excerpt digest, schema and ID, requirement ID and digest, pinned source and candidate commits, and passed outcome are verified.
    action: added
  - id: invalid-receipts-are-not-model-context
    description: Malformed, failed, stale, or mismatched execution receipts are omitted from coverage question evidence.
    action: added
guidance: []
