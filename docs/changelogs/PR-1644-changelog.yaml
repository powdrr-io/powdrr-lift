schema: https://powdrr.io/schema/changelog-v2
change_id: 1644
title: Bind execution receipts to the full typed requirement
intent:
  problem: Requirement execution receipts were bound to the requirement ID, wording, kind, and source references but not its typed source logic or validation groups.
  goal: Invalidate a receipt when the Boolean conditions or validation-group semantics of its requirement change, and carry those fields through the persisted plan and workflow descriptor.
human-decisions: []
structured_files: []
