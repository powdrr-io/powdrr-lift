    type: modified
    span: {start_line: 12, end_line: 12}
    summary: Advance the requirement execution receipt schema to version 2.
    rationale: Make the expanded requirement binding explicit and reject old receipt payloads.
  - path: packages/service/src/powdrr_service/verification/requirement_execution.py
    type: modified
    span: {start_line: 140, end_line: 142}
    summary: Require all typed requirement fields as digest inputs.
    rationale: Ensure callers cannot silently fall back to the old incomplete identity.
  - path: packages/service/src/powdrr_service/verification/requirement_execution.py
    type: modified
