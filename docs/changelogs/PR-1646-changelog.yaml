schema: https://powdrr.io/schema/changelog-v2
change_id: 1646
title: Repair stale PR validation before review
intent:
  problem: A worker can block a published PR because its committed validation inventory
    is stale, even when the required CI checks pass, and can leave a validated draft
    unreconciled.
  goal: Deterministically refresh validation state and its changelog at the candidate
    PR head, observe checks for that exact head, and continue recoverable PR checkpoints
    without losing human-required stops.
human-decisions: []
