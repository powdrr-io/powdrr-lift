schema: https://powdrr.io/schema/changelog-v2
change_id: 1647
title: Publish pinned planner execution receipts
intent:
  problem: Planning can consume exact-commit execution receipts, but no supported producer joined observed verifier evidence to planner requirement bindings and published the artifact.
  goal: Provide a GitHub Actions producer that publishes only passed verifier evidence explicitly bound to typed requirements at the exact caller commit.
human-decisions: []
structured_files: []
