schema: https://powdrr.io/schema/changelog-v2
change_id: 1650
title: Persist requirement bindings on planned test cases
intent:
  problem: The planner allocates stable requirement IDs and digests to each test case, but issue-worker Structrr diff artifacts omit those bindings when recording selectors and outcomes.
  goal: Preserve and validate the exact planned requirement bindings on each committed required test case so downstream GitHub jobs can discover them without inferring links.
