    summary: Scan open issues for abandoned claims regardless of queue label.
    rationale: Keep inconsistent work discoverable when GitHub label projection is stale.
  - path: src/powdrr_lift/workrr/github_issue_queue.py
    type: modified
    span: {start_line: 505, end_line: 506}
    summary: State that the worker retains responsibility for reconciliation.
    rationale: Avoid handing worker bookkeeping to a human operator.
