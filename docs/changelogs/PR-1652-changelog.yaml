schema: https://powdrr.io/schema/changelog-v2
change_id: 1652
title: Build planner receipts from verifier evidence
intent:
  problem: The receipt publisher requires a hand-authored JSON file to join verifier evidence with committed requirement
    bindings.
  goal: Build requirement receipts deterministically from the verifier artifact and committed Structrr test-case
    bindings.
