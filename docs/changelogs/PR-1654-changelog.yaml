schema: https://powdrr.io/schema/changelog-v2
change_id: 1654
title: Track provider-reported planning usage and cost
intent:
  problem: Planning telemetry counts calls and tokens but omits provider-reported cost, and native decision batches discard usage metadata.
  goal: Preserve usage once per provider call, summarize cost completeness without estimating prices, and update the planning audit to reflect implemented milestones.
