invariants:
  - id: planner-cost-is-provider-reported
    action: added
    description: Planning telemetry records cost only when the provider reports a numeric amount and currency; it never estimates cost from model pricing.
  - id: planner-batch-usage-is-counted-once
    action: added
    description: A native provider batch contributes one usage record associated with the batch, not one copied record per question member.
  - id: planner-raw-messages-are-not-retained
    action: added
    description: Planning usage telemetry does not persist exact prompts or responses.
