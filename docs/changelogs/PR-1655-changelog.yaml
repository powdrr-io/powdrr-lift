change_id: 1655
title: Validate source logic at executable test design
intent:
  problem: The planner forwards source-logic objects into test design after only shallow shape checks, and excerpt limits can omit anchors needed to validate accepted quotes.
  goal: Revalidate bounded source-logic trees against all pinned requirement anchors and preserve the complete nested structure through generated execution bindings.
