schema: https://powdrr.io/schema/changelog-v2
change_id: 1659
title: Bind dependency recovery to accepted publication identity
intent:
  problem: A merged PR discovered through an issue comment can currently fulfill a dependency without proving which accepted plan contract it implemented or where it merged.
  goal: Carry the worker-computed work identity into implementation PRs and require exact contract identity and the repository default branch before recovered publication can fulfill a dependency.
