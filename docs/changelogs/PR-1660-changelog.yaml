schema: https://powdrr.io/schema/changelog-v2
change_id: 1660
title: Compare planning benchmarks with synthetic source obligations
intent:
  problem: Planning scale reports compare output shape but do not expose source-obligation extraction and work-unit assignment against the synthetic fixture; the Structrr stress profile can also reveal accepted structural work that compilation re-derives as a new question.
  goal: Report source-bound fixture checks for every scale profile and compile exactly the structural operations accepted by the scheduler.
