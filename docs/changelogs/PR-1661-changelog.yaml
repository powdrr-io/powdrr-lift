schema: https://powdrr.io/schema/changelog-v2
change_id: 1661
title: Batch bounded work-unit proposal questions
intent:
  problem: Large planning runs send one provider request for each independent work-unit proposal question even when those requests fit the existing batch contract.
  goal: Reduce proposal calls with small bounded batches while preserving per-question validation, checkpoint identity, and a singleton replay path for failed batch members.
