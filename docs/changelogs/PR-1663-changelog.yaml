schema: https://powdrr.io/schema/changelog-v2
change_id: PR-1663
title: Resume abandoned issue work after reconciliation
intent:
  problem: A worker claim fenced after process exit can leave its issue in a generic blocked state, so later runs neither re-evaluate dependencies nor discover a PR published before the worker stopped.
  goal: Reconcile fenced claims idempotently, recover existing linked PRs, and return unpublished work to dependency evaluation so Powdrr can resume eligible work without manual queue bookkeeping.
