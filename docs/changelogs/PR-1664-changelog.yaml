schema: https://powdrr.io/schema/changelog-v2
change_id: 1664
title: Batch test-design planning questions
intent:
  problem: Independent PR-item test-design questions remain separate provider calls because paired prompts exceed the generic combined input limit, and malformed batch members can be retried in the same batch after journal replay.
  goal: Batch test-design questions in bounded pairs and replay failed batch members individually while preserving each member's question identity, schema, parser, and size limit.
