    action: added
    description: The deterministic Structrr-stress benchmark verifies six-member batching and reduced structural calls while requiring successful compilation.
invariants:
  - id: structural-batches-preserve-member-contracts
    description: Every structural batch member retains its original question identity, schema, parser, and 24,000-character individual input limit.
    action: added
  - id: structural-batch-input-is-bounded
    description: Combined structural enumeration and description requests stay within their dedicated 48,000-character limits, with oversize groups split by the batcher.
    action: added
