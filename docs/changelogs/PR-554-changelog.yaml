schema: https://powdrr.io/schema/changelog-v2
change_id: 554
title: Make atomic workflow steps deterministic
intent:
  problem: Deterministic workflow operations still require LLM calls to select the only available action and confirm advancement, creating avoidable latency and opportunities for instruction drift.
  goal: Document an orchestration-first reliability model, make atomic skill steps advance under runtime control, and measure the change in the live start-feature workflow.
human-decisions:
  - id: run-deterministic-workflow-experiment
    summary: Document the workflow-reliability proposal in a pull request and run the first deterministic-execution experiment.
