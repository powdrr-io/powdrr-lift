invariants:
  - id: runtime-owns-atomic-step-advancement
    action: added
    description: An invoke_tool skill step advances after its deterministic pre-step is recorded without requiring an LLM confirmation action.
    rationale: Make fixed operations deterministic and eliminate avoidable instruction-following failure points.
guidance:
  - id: separate-workflow-judgment-from-execution
    action: added
    description: Use LLM steps for semantic judgments and runtime-owned nodes for fully declared operations and branches.
    rationale: Concentrate model variability where interpretation is useful while making procedural sequencing enforceable.
