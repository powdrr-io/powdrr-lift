entities:
  - id: pr-specification-core
    type: Module
    action: modified
    description: Proposed PR logic now compiles a constrained semantic contract into validated YAML.
    rationale: Centralize schema fields, authoritative effects, ordering, and validation in deterministic code.
entity_relationships: []
invariants:
  - id: runtime-owns-proposed-pr-structure
    action: added
    description: The model supplies only proposed PR decisions and effect assignments; deterministic runtime code owns and validates the persisted document structure.
    rationale: Make proposed PR output consistent and verifiable independently of model formatting behavior.
guidance:
  - id: collect-decisions-then-compile
    action: added
    description: Collect semantic choices in a narrow exact-key object, reject invalid references or graph structure, and compile the repository format deterministically.
    rationale: Use model judgment where it is valuable without delegating serialization and repair mechanics.
