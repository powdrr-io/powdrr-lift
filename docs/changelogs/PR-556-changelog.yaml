    type: modified
    span: {start_line: 256, end_line: 256}
    summary: Remove model-owned edit actions from proposed PR authoring.
    rationale: Prevent direct mutation of the generated YAML.
  - path: skill-definitions/start-implementing-feature.yaml
    type: modified
    span: {start_line: 260, end_line: 280}
    summary: Require a constrained semantic decision output with an exact action envelope.
    rationale: Let the runtime own document structure while making the nested-array response format explicit.
    related:
      decisions: [replace-proposed-pr-yaml-authoring]
      invariants: [runtime-owns-proposed-pr-structure]
      guidance: [collect-decisions-then-compile]
