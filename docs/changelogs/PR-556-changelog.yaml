schema: https://powdrr.io/schema/changelog-v2
change_id: 556
title: Compile proposed PR specifications from semantic decisions
intent:
  problem: Direct YAML authoring and path-based repair let model formatting mistakes create invalid proposed PR specifications and repeated repair loops.
  goal: Require a small semantic decision object, validate it before mutation, and compile the verifiable YAML structure under runtime control.
human-decisions:
  - id: replace-proposed-pr-yaml-authoring
    summary: Prioritize consistency and verifiable structure by moving proposed PR authoring and repair away from direct YAML mutation.
structured_files: []
files:
