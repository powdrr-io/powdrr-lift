schema: https://powdrr.io/schema/changelog-v2
change_id: 677
title: Link bootstrapped Structrr entities to source evidence
intent:
  problem: The initial Structrr bootstrap records semantic entities and source files separately, but does not explain which source artifacts implement, define, or verify those entities.
  goal: Add conservative deterministic source-link inference with confidence thresholds and evidence-specific relationship kinds.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/structrr/bootstrap.py
    type: modified
    summary: Import the regular-expression support used by source-link inference.
    rationale: Connect Structrr meaning to implementation evidence without treating weak matches as authoritative.
    span:
      start_line: 5
      end_line: 5
    related:
      entities:
        - structrr-source-linker
  - path: src/powdrr_lift/structrr/bootstrap.py
    type: modified
    summary: Define source evidence types and linkable semantic entity types.
    rationale: Restrict inference to entity and file categories where a source relationship is meaningful.
    span:
      start_line: 22
      end_line: 41
    related:
      entities:
        - structrr-source-linker
        - source-link-confidence
  - path: src/powdrr_lift/structrr/bootstrap.py
    type: modified
    summary: Preserve specification summaries as source-link matching evidence.
    rationale: Let deterministic matching use the semantic evidence already present in specifications.
    span:
      start_line: 307
      end_line: 307
    related:
      entities:
        - structrr-source-linker
  - path: src/powdrr_lift/structrr/bootstrap.py
    type: modified
