    rationale: Prevent documentation from being mislabeled as implementation source evidence.
    span:
      start_line: 368
      end_line: 375
    related:
      entities:
        - source-link-confidence
  - path: src/powdrr_lift/structrr/bootstrap.py
    type: modified
    summary: Add bounded source-link inference with confidence thresholds.
    rationale: Keep inferred links useful without overstating weak identifier matches.
    span:
      start_line: 464
      end_line: 465
    related:
      entities:
        - structrr-source-linker
        - source-link-confidence
  - path: src/powdrr_lift/structrr/bootstrap.py
    type: modified
    summary: Add deterministic identifier scoring and evidence-specific relationship kinds.
    rationale: Distinguish implementation, definition, and verification evidence in the product graph.
    span:
