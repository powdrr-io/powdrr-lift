title: Extract semantic Structrr records during bootstrap
intent:
  problem: The Structrr bootstrap snapshot currently captures entities and source links but loses existing invariants, guidance, tools, requirements, and approaches from specification documents.
  goal: Preserve those semantic records in typed bootstrap sections with provenance, conservative kind classification, and fail-closed validation.
