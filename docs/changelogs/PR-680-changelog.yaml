schema: https://powdrr.io/schema/changelog-v2
change_id: 680
title: Extract Python source subjects and Structrr bindings
intent:
  problem: Structrr bootstrap currently links semantic entities only to files, so source movement and symbol-level impact cannot be represented precisely.
  goal: Extract deterministic Python source subjects with exact spans and bind semantic entities to those subjects using validated evidence.
