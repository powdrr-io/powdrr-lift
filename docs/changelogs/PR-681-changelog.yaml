change_id: 681
title: Add source-aware Structrr rebase reports
intent:
  problem: Structrr proposals need a deterministic way to compare their baseline with the current design and source graph without treating unrelated changes as conflicts.
  goal: Classify design and source evolution, preserve mechanically remappable moves and renames, and emit targeted machine-readable amendment context.
