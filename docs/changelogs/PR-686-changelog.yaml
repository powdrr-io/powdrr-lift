entity_relationships:
  - id: request-bounds-worker
    source: implementation-request
    target: external-coding-agent-worker
    relationship: constrains
    description: Workrr supplies the worker with scoped paths, acceptance criteria, validation profiles, and selected context references.
    rationale: The worker should implement a validated unit without owning workflow decisions.
    action: added
  - id: attempt-observes-worker
    source: implementation-attempt
    target: external-coding-agent-worker
    relationship: observes
    description: Workrr records the worker exit result, events, changed paths, and diff fingerprint.
    rationale: Acceptance must be based on observed repository state rather than worker claims.
