entity_relationships:
  - id: attempt-produces-validation-report
    source: implementation-attempt
    target: implementation-validation-report
    relationship: produces
    description: A completed implementation attempt is followed by validation of every profile declared by its request.
    rationale: Process exit status alone is insufficient evidence that an implementation is acceptable.
    action: added
  - id: validation-report-observes-worker-result
    source: implementation-validation-report
    target: implementation-attempt
    relationship: evaluates
    description: The validation report records command-level evidence against the observed worker attempt.
    rationale: Later review must be able to distinguish worker failure, blocked validation, and failed validation.
    action: added
