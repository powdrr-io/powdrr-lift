entity_relationships:
  - id: execution-plan-compiles-request
    source: execution-plan
    target: implementation-request
    relationship: produces
    description: A selected execution-plan unit is compiled into a versioned implementation request carrying its fingerprint, paths, criteria, and validation profiles.
    rationale: The worker must receive plan-derived constraints rather than an independently authored handoff.
    action: added
  - id: request-gates-worker-base
    source: implementation-request
    target: external-coding-agent-worker
    relationship: constrains
    description: The worker may start only when the target worktree HEAD equals the request base commit.
    rationale: Prevent stale worktrees from receiving implementation authority for a newer plan.
    action: modified
