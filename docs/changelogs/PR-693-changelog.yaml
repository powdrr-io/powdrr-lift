schema: https://powdrr.io/schema/changelog-v2
change_id: 693
title: Name Structrr baselines by revision and ignore GitHub metadata
intent:
  problem: Structrr bootstrap outputs are named as changelogs even though they are repository baselines, and tracked GitHub automation is not part of the desired bootstrap evidence.
  goal: Name default bootstrap outputs with the short source revision and exclude tracked .github metadata while preserving all other tracked repository files.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/structrr/bootstrap.py
    type: modified
    summary: Exclude tracked .github paths and derive the default output filename as docs/structrr/current/baseline-<short-git-hash>.yaml.
    rationale: Keep CI automation out of the Structrr product/source baseline and make each generated baseline traceable to its Git revision.
    span:
      start_line: 21
      end_line: 28
    related:
      entities:
        - structrr-baseline-snapshot
  - path: src/powdrr_lift/structrr/bootstrap.py
    type: modified
    summary: Resolve explicit and revision-derived bootstrap output paths without changing the tracked-input boundary.
