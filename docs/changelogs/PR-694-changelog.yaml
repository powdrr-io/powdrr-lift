schema: https://powdrr.io/schema/changelog-v2
change_id: 694
title: Add validated JSON output for Structrr bootstrap
intent:
  problem: The Structrr bootstrap command only exposed human-readable output, so a Procedrr or Workrr step could not consume its validated result without parsing text; generated current snapshots could also become recursive bootstrap evidence.
  goal: Add an opt-in JSON summary contract, preserve the human-readable default, exclude generated current snapshots from future scans, and record the feature as a validated Structrr/Procedrr/Workrr handoff.
