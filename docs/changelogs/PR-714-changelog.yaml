    type: modified
    summary: Link the durable-intent foundation to the new proposal, implementation, OpenCode targeting, and reconciliation design.
    rationale: Make the relationship between durable intent retrieval and the follow-on transaction protocol discoverable.
    span:
      start_line: 30
      end_line: 35
    related:
      entities:
        - intent-preserving-change-control-design
  - path: docs/plans/opencode-inspired-agent-execution-completion-plan.md
    type: modified
    summary: Link the completed execution foundation to the follow-on intent-control design and implementation sequence.
    rationale: Show that the new control protocol builds on the existing runtime rather than replacing it with a parallel stack.
