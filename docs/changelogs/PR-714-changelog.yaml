schema: https://powdrr.io/schema/changelog-v2
change_id: 714
title: Document intent-preserving change control
intent:
  problem: Powdrr has Structrr state, Procedrr single-decision execution, and a bounded Workrr/OpenCode handoff, but it does not yet define one mandatory transaction that reviews intent changes at proposal time, revalidates them before implementation, targets the governing intent for OpenCode, and reconciles actual changes before acceptance.
  goal: Define the complete intent-preserving change-control protocol and an incremental implementation sequence grounded in the repository's existing Structrr, Procedrr, Workrr, and OpenCode boundaries.
human-decisions:
  - id: document-intent-preserving-change-control
    summary: Record the agreed intent-diff, three-gate, single-decision, drift-monitoring, and targeted OpenCode handoff design as detailed repository documentation and submit it for review.
structured_files: []
files:
  - path: docs/plans/intent-preserving-change-control.md
    type: added
    summary: Define the state model, ownership boundaries, data contracts, single-decision rules, three mandatory gates, targeted OpenCode intent packets, evidence invalidation, and cumulative drift monitoring.
    rationale: Preserve the agreed end-to-end architecture as a precise reviewable contract before implementation begins.
    span:
      start_line: 1
      end_line: 902
    related:
      entities:
        - intent-preserving-change-control-design
      decisions:
        - document-intent-preserving-change-control
