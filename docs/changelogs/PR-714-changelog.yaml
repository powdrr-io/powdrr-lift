    relationship: implements
    description: The implementation plan decomposes the intent-preserving control protocol into seven independently reviewable production change sets.
    rationale: Keep implementation sequencing traceable to the accepted architectural design.
    action: added
invariants:
  - id: procedrr-controls-intent-gates
    action: added
    description: Procedrr determines which atomic checks run and whether a transition is legal; Workrr, OpenCode, and other model-backed workers cannot select, skip, or satisfy their own control gates without valid evidence.
    rationale: Keep proposal acceptance, implementation eligibility, and resulting-state acceptance outside model discretion.
guidance:
  - id: target-opencode-with-compiled-intent
    action: added
    description: Compile the smallest complete and explainable active-intent closure for each bounded OpenCode work order, and split work rather than dropping mandatory intent when the packet is too large.
    rationale: Improve first-pass implementation accuracy without relying on an undifferentiated dump of historical instructions.
