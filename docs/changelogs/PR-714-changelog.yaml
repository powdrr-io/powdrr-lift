    type: added
    summary: Define the state model, ownership boundaries, data contracts, single-decision rules, three mandatory gates, targeted OpenCode intent packets, evidence invalidation, and cumulative drift monitoring.
    rationale: Preserve the agreed end-to-end architecture as a precise reviewable contract before implementation begins.
    span:
