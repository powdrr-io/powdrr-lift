      guidance:
        - target-opencode-with-compiled-intent
  - path: docs/plans/intent-preserving-change-implementation-plan.md
    type: added
    summary: Break the control design into seven vertical change sets tied to existing Structrr, Procedrr, Workrr, execution-runtime, and OpenCode implementation seams.
    rationale: Provide an incremental path that adds enforced production boundaries rather than disconnected schema types.
    span:
      start_line: 1
