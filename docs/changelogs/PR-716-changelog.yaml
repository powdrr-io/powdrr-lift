entity_relationships: []
invariants:
  - id: intent-control-gates-fail-closed
    action: added
    description: Missing, stale, unknown, conflicting, or unevaluable required intent-control evidence blocks the transition protected by that evidence.
    rationale: Prevent model failures, stale artifacts, or incomplete reviews from becoming implicit authorization to proceed.
guidance:
  - id: implement-intent-control-in-dependency-order
    action: added
    description: Establish the accepted proposal identity and pre-worker gate before implementing hidden-intent review, proposal rebasing, targeted intent packets, actualization, or cumulative drift auditing.
    rationale: Ensure every later control references one stable authoritative proposal transaction rather than inventing incompatible identities.
