invariants:
  - id: packet-fingerprint-covers-rendered-intent
    action: added
    description: The intent packet fingerprint covers all canonical required operations, preservation constraints, non-goals, source references, and selection explanations used to render the worker context.
    rationale: Prevent silent changes to the targeted intent context between compilation, persistence, and invocation.
  - id: worker-repair-preserves-operation-contract
    action: added
    description: A finding-specific repair prompt carries the original operation packet and instructs the worker to preserve requirements not contradicted by the finding.
    rationale: Prevent corrective attempts from fixing one validation issue by weakening an already-satisfied requirement.
guidance:
  - id: prompt-opencode-with-targeted-intent
    action: added
    description: Compile one execution unit into a packet containing required operations, must-preserve constraints, non-goals, source references, and selection explanations; do not repeat the full feature intent.
    rationale: Improve implementation accuracy for less sophisticated models by reducing inference and context breadth.
