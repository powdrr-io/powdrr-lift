schema: https://powdrr.io/schema/changelog-v2
change_id: 718
title: Add operation-scoped coding intent packets
intent:
  problem: OpenCode currently receives a broad execution-unit prompt and repair prompts can omit the original preservation contract, making weaker models more likely to broaden scope or regress already-correct behavior.
  goal: Compile each execution unit into a deterministic intent packet containing required operations, must-preserve constraints, explicit non-goals, source references, and a fingerprint, then carry that packet through implementation and repair prompts.
human-decisions:
  - id: use-operation-scoped-intent-packets
    summary: Give OpenCode the smallest complete intent context for one execution unit instead of repeating the full feature intent.
  - id: preserve-packet-contract-during-repair
    summary: Include the original operation contract in finding-specific repair prompts and require repair to preserve requirements not contradicted by the finding.
