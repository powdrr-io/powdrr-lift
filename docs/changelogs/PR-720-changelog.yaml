entity_relationships: []
invariants:
  - id: proposal-fingerprint-is-deterministic
    action: added
    description: Equivalent Structrr baseline and plan content produces the same proposal revision fingerprint regardless of mapping key order.
    rationale: Retries and validation must identify the same intent without depending on incidental serialization order.
  - id: worker-packet-identifies-proposal-revision
    action: added
    description: The OpenCode execution unit and implementation request reference the persisted proposal revision and use its fingerprint as the proposed change identity.
    rationale: Make the worker's targeted instructions auditable against a specific proposal state.
  - id: proposal-revision-precedes-worker-edit
    action: added
    description: The proposal revision artifact is committed before the OpenCode worker receives the implementation request.
    rationale: The worker must start from a clean worktree whose intent artifact is already part of the tracked state.
guidance:
  - id: use-proposal-revision-as-worker-anchor
    action: added
    description: Treat proposal-revision.json and its fingerprint as the canonical identity for the targeted OpenCode operation.
    rationale: Keep subsequent execution and validation anchored to the exact compiled Structrr change.
