schema: https://powdrr.io/schema/changelog-v2
change_id: 720
title: Persist deterministic Structrr proposal revisions
intent:
  problem: OpenCode execution packets have plan-derived context, but their proposal identity is still a slug-based placeholder and is not persisted as a canonical revision artifact.
  goal: Compile and persist a deterministic proposal revision from the Structrr baseline and plan, then bind its fingerprint and source reference into the operation packet sent to OpenCode.
human-decisions:
  - id: persist-proposal-revision-before-execution
    summary: Record the canonical proposal revision in the proposal directory before the coding worker starts.
  - id: fingerprint-all-targeted-worker-context
    summary: Derive the proposed change fingerprint from the baseline, operations, acceptance criteria, preservation constraints, exclusions, allowed paths, and source references.
structured_files: []
