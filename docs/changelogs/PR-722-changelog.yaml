entity_relationships: []
invariants:
  - id: current-intent-must-match-persisted-proposal
    action: added
    description: An OpenCode implementation attempt cannot start when the current Structrr-derived proposal fingerprint differs from the persisted proposal revision.
    rationale: Prevent implementation from proceeding against stale architecture state.
  - id: persisted-proposal-must-self-verify
    action: added
    description: A persisted proposal revision must use the supported schema and contain a fingerprint matching its canonical content.
    rationale: Ensure the execution anchor has not been malformed or tampered with.
guidance:
  - id: fail-closed-on-proposal-drift
    action: added
    description: Surface proposal revision mismatches as explicit Workrr execution errors and do not invoke OpenCode.
    rationale: Drift requires proposal reconciliation before implementation, not model-level improvisation.
