schema: https://powdrr.io/schema/changelog-v2
change_id: 722
title: Revalidate Structrr proposals before OpenCode
intent:
  problem: Persisting a proposal revision gives OpenCode a stable identity, but an existing artifact could still be stale, malformed, or tampered with when a later implementation attempt starts.
  goal: Recompile current Structrr intent at execution time and block OpenCode unless the persisted proposal revision is authentic and matches the current baseline, plan, and targeted worker context.
human-decisions:
  - id: reject-stale-proposal-before-worker
    summary: Treat a mismatch between current compiled intent and the persisted proposal revision as a hard execution failure before OpenCode is invoked.
  - id: verify-persisted-proposal-self-hash
    summary: Require the persisted proposal artifact to have a supported schema and a fingerprint matching its canonical content.
structured_files: []
