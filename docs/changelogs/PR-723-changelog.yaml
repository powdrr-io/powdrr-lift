schema: https://powdrr.io/schema/changelog-v2
change_id: 723
title: Implement Structrr operations as single OpenCode tasks
intent:
  problem: The feature endpoint still gives OpenCode one aggregate implementation request, forcing a less capable worker to interpret the entire proposal at once and making task-level progress difficult to attribute.
  goal: Compile one targeted OpenCode request per explicit Structrr operation, execute those requests sequentially with dependency order and shared preservation constraints, and keep repair requests separate from initial task decomposition.
human-decisions:
  - id: one-worker-request-per-structrr-operation
    summary: Treat each explicit Structrr addition or removal as one independently prompted OpenCode implementation task.
  - id: preserve-sequential-worktree-state
    summary: Run operation tasks in deterministic order, allowing later tasks to see accepted earlier edits while retaining the original committed base.
  - id: repair-is-not-replay
    summary: Use one aggregate repair unit for validation or review repairs instead of replaying every original operation.
