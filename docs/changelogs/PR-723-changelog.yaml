entity_relationships: []
invariants:
  - id: worker-prompt-selects-one-operation
    action: added
    description: Each initial OpenCode request contains the required operation, shared preservation constraints, and explicit non-goals for exactly one Structrr operation.
    rationale: Reduce model ambiguity and prevent sibling operations from leaking into the current task.
  - id: operation-tasks-run-in-proposal-order
    action: added
    description: Operation requests run in deterministic proposal order, with each later task allowed to observe accepted earlier worktree edits.
    rationale: Enable incremental implementation without losing a stable proposal base.
  - id: failed-operation-stops-sequence
    action: added
    description: A failed or policy-denied operation prevents subsequent initial operation requests from running.
    rationale: Do not compound an invalid intermediate state.
  - id: repairs-do-not-replay-initial-tasks
    action: added
    description: Repair invocations use one aggregate repair unit rather than rerunning all initial operation prompts.
    rationale: Target repair evidence without duplicating already completed work.
guidance:
  - id: prompt-opencode-with-smallest-intent-closure
    action: added
    description: Prefer the smallest Structrr operation-specific intent packet that fully explains the current task, while carrying shared preservation and non-goal constraints.
    rationale: Improve instruction following for less sophisticated coding models.
