change_id: 726
title: Promote merged single-task OpenCode lineage to main
intent:
  problem: The reviewed Structrr proposal identity, stale-state gate, single-operation OpenCode execution, and operation checkpoints were merged into stacked branches but had not been propagated into main.
  goal: Promote the exact reviewed implementation lineage and its validated changelog artifacts into main without introducing new behavior.
human-decisions:
  - id: promote-reviewed-lineage-without-reimplementation
    summary: Bring the already-reviewed PR #720 through PR #724 commits into main unchanged.
  - id: preserve-existing-changelog-artifacts
    summary: Retain each prior PR changelog as part of the promoted audit trail.
