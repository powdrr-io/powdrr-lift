schema: https://powdrr.io/schema/changelog-v2
change_id: PR-730
title: procedrr-step-execution-transcripts
intent:
  problem: The requested product behavior is not yet available.
  goal: Add Procedrr step execution transcripts. Extend the Procedrr evaluator so
    EvaluationResult exposes an ordered, durable transcript of every executed step,
    including step kind and path, relevant inputs, produced outputs, and succeeded
    or failed outcome. Capture transcripts consistently across operations, judges,
    loops, retries/attempts, specializations, calls, repeats, branches, terminal steps,
    gates, nested fragments/processes, and failures. Preserve existing evaluator behavior
    and public compatibility, and add focused tests proving ordering, nested execution,
    captured values, and failure outcomes. Keep the implementation scoped to src/procedrr_evaluator/evaluator.py
    and tests/test_procedrr_evaluator.py.
