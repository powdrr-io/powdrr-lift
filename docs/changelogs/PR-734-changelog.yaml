schema: https://powdrr.io/schema/changelog-v2
change_id: 734
title: Harden proposal review evidence before OpenCode
intent:
  problem: Proposal review decisions need explicit evidence requirements, deterministic structural checks, and repository-grounded active intent before they can authorize OpenCode.
  goal: Harden the existing proposal review gate without changing the single-task OpenCode boundary.
human-decisions:
  - id: evidence-is-explicit-and-verified
    summary: Bind every decision to exact evidence references and independently validate those references.
  - id: structural-checks-run-before-llm-review
    summary: Reject mechanically invalid proposals before dispatching semantic judges.
structured_files: []
