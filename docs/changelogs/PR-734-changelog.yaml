invariants:
  - id: opencode-requires-verified-evidence
    action: added
    description: OpenCode requires an accepted receipt whose evidence references and fingerprints match the current proposal worklist.
    rationale: Keep worker dispatch behind grounded review.
  - id: structural-review-precedes-semantic-review
    action: added
    description: Mechanically invalid proposals are rejected before LLM judges run.
    rationale: Do not delegate deterministic checks to the model.
guidance:
  - id: use-active-intent-in-review
    action: added
    description: Proposal worklists must include the active intent clauses loaded from the current repository state.
    rationale: Ground affected-intent decisions in durable intent.
