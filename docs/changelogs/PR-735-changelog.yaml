invariants:
  - id: review-evidence-is-content-addressed
    action: added
    description: Production proposal-review obligations reference content-fingerprinted evidence snapshots.
    rationale: A receipt is valid only for the exact state and observations it reviewed.
  - id: post-edit-intent-preservation-is-required
    action: added
    description: Every active intent clause must receive a preserved verdict supported by the captured implementation evidence before delivery.
    rationale: Passing tests and scope review alone do not prove long-lived intent was honored.
  - id: opencode-is-edit-only
    action: added
    description: The implement-feature flow invokes OpenCode only through run_opencode edit operations.
    rationale: Review reasoning and code editing are separate provider boundaries.
  - id: failed-intent-review-is-repaired
    action: added
    description: Failed post-implementation intent preservation enters a bounded repair loop that reruns implementation validation and worker-diff review.
    rationale: Intent failures require corrective code edits and fresh evidence before delivery can proceed.
guidance:
  - id: use-observed-implementation-evidence
    action: added
    description: Post-implementation judges must use the captured git diff, validation results, worker review, and current intent state.
    rationale: Make decisions reproducible from immutable artifacts.
