schema: https://powdrr.io/schema/changelog-v2
change_id: 735
title: Address implementation evidence and preserve intent after edits
intent:
  problem: Proposal review receipts need immutable evidence identities, and implementation completion currently lacks a per-intent post-edit gate.
  goal: Bind proposal decisions to content-addressed evidence, review every active intent clause after implementation, and keep OpenCode behind the single edit operation.
human-decisions:
  - id: content-addressed-review-evidence
    summary: Evidence references include immutable content fingerprints.
  - id: post-implementation-intent-gate
    summary: Every active intent clause receives an explicit post-implementation preservation decision.
  - id: opencode-edit-boundary
    summary: OpenCode is used only by edit-producing run_opencode operations.
  - id: intent-review-repair-loop
    summary: A failed post-implementation intent review triggers a targeted OpenCode repair and reruns validation before retrying the review.
