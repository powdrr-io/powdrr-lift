entity_relationships: []
invariants:
  - id: canonical-active-intent-is-non-vacuous
    action: added
    description: Proposal and post-implementation review consume the canonical active-intent inventory, including baseline invariants and guidance when they exist, rather than silently passing with only captured intent or no clauses.
    rationale: Prevent accepted repository intent from disappearing from review evidence.
  - id: conflicting-accepted-intent-fails-closed
    action: added
    description: Conflicting active clauses from accepted intent sources block canonical resolution.
    rationale: Avoid silently selecting one contradictory durable intent statement.
guidance:
  - id: use-canonical-active-intent
    action: added
    description: Later verification phases must consume the canonical active-intent resolver instead of reading IntentStore directly.
    rationale: Preserve one source-of-truth boundary as contracts and evidence are added.
