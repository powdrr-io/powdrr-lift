schema: https://powdrr.io/schema/changelog-v2
change_id: 740
title: Implement Phase 1 canonical active-intent resolution
intent:
  problem: Proposal and post-implementation reviews only consulted captured IntentStore clauses, so a normal feature worktree could have accepted Structrr invariants but an empty review inventory.
  goal: Resolve one canonical active-intent inventory from the Structrr baseline, feature proposal overlays, and captured intent, then bind both review paths and bootstrap freshness checks to it.
human-decisions:
  - id: baseline-and-captured-intent-are-merged
    summary: Treat the accepted Structrr baseline and captured IntentStore clauses as independent inputs to one canonical active-intent resolver.
  - id: feature-intent-is-an-overlay
    summary: Treat added, changed, and removed feature clauses as an explicit proposal overlay on accepted intent.
  - id: conflicting-accepted-intent-blocks
    summary: Reject conflicting active clauses from accepted sources instead of choosing one implicitly.
