schema: https://powdrr.io/schema/changelog-v2
change_id: 741
title: Add executable verification contracts for feature intent
intent:
  problem: Required test cases only carried identifiers and descriptions, so feature intent was not connected to a provider, executable selector, validation profile, or explicit expected result.
  goal: Define a provider-neutral verification contract that links required checks to active intent, validates contract completeness, preserves legacy entries during migration, and teaches feature and PR planning to emit the contract shape.
human-decisions:
  - id: extend-required-test-cases-model
    summary: Extend required test cases with intent references, execution metadata, applicability, protected inputs, and lifecycle status.
  - id: legacy-contracts-remain-readable
    summary: Keep existing identifier-and-description test cases parseable while marking them incomplete until verification metadata is supplied.
  - id: contracts-fingerprint-semantic-fields
    summary: Derive a stable content fingerprint from the versioned contract schema and normalized contract data.
