entities:
  - id: verification-contract-model
    type: Module
    action: added
entity_relationships: []
invariants:
  - id: executable-contracts-are-validated
    action: added
    description: A non-legacy required test case must declare at least one intent reference, provider, selector, profile, supported expectation, and supported lifecycle status; malformed collection fields and unknown fields are rejected.
    rationale: Make every newly authored verification requirement structurally actionable and unambiguous.
  - id: legacy-contracts-are-explicitly-incomplete
    action: added
    description: Identifier-and-description-only required test cases remain parseable for migration but are not considered complete verification contracts.
    rationale: Preserve existing documents without allowing legacy entries to claim executable intent coverage.
  - id: verification-contract-fingerprint-is-stable
    action: added
    description: A contract fingerprint is content-addressed by the versioned schema and normalized contract data, so semantic contract changes produce a different fingerprint.
    rationale: Provide a durable identity for later evidence and drift checks.
guidance:
  - id: use-verification-contracts-for-intent-evidence
    action: added
    description: Later execution and evidence phases should resolve required test cases through VerificationContract and use intent_refs, selector, profile, expectation, applicability, and protected_inputs rather than inventing parallel metadata.
    rationale: Keep intent-to-test traceability on one provider-neutral contract boundary.
  - id: migrate-legacy-required-tests
    action: added
    description: New feature and PR specifications should emit complete verification contracts; existing legacy entries should be upgraded before they are treated as executable intent evidence.
    rationale: Allow incremental adoption without silently weakening verification claims.
