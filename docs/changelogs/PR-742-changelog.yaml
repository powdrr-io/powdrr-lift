invariants:
  - id: required-test-cases-are-executable
    action: added
    description: Every required test case must provide intent_refs, provider, selector, profile, expectation, and status; descriptive-only entries are invalid.
    rationale: Ensure declared intent coverage identifies an executable check.
guidance:
  - id: do-not-add-legacy-contract-fallbacks
    action: added
    description: New verification execution and evidence code must consume complete VerificationContract values and must not reintroduce a descriptive-only compatibility path.
    rationale: Keep forward-only development strict at the verification boundary.
