schema: https://powdrr.io/schema/changelog-v2
change_id: 742
title: Require complete executable verification contracts
intent:
  problem: The initial verification-contract model still accepted identifier-and-description-only required test cases, allowing unexecutable intent coverage to pass validation.
  goal: Make every required test case an explicit executable verification contract and update affected fixtures so incomplete metadata fails immediately.
human-decisions:
  - id: require-complete-contracts
    summary: Remove legacy compatibility and reject required test cases that omit executable verification metadata.
  - id: preserve-test-intent
    summary: Add complete contract metadata to fixtures whose tests are intended to exercise unrelated validation behavior.
structured_files: []
