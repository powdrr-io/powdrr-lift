schema: https://powdrr.io/schema/changelog-v2
change_id: 743
title: Add Workrr verification provider inventory
intent:
  problem: Procedrr has discovered validation commands but cannot inventory the exact executable verifiers protected by a verification contract or distinguish a missing selector from a collected one.
  goal: Add a provider-neutral Workrr protocol and registry, collect exact pytest node IDs through pytest hooks, and persist provider inventory metadata in a versioned Structrr bootstrap section.
human-decisions:
  - id: provider-registry-owns-framework-adapters
    summary: Keep framework-specific discovery behind a Workrr provider registry so Structrr and Procedrr remain provider-neutral.
  - id: pytest-collection-uses-node-ids
    summary: Treat pytest node IDs collected through pytest hooks as the exact selector identity; do not parse decorative console output.
  - id: bootstrap-inventory-is-provider-neutral
    summary: Let Structrr bootstrap record discovered validation profiles and let Workrr enrich them with exact provider selectors.
