entities:
  - id: verification-provider-registry
    type: Module
    action: added
entity_relationships: []
invariants:
  - id: bootstrap-provider-inventory-is-typed
    action: added
    description: Structrr bootstrap validation requires every provider inventory record to identify a provider and profile and to expose selectors as a list.
    rationale: Prevent malformed discovery data from reaching contract matching.
  - id: provider-inventory-is-content-addressed
    action: added
    description: Workrr inventory fingerprints include the inventory schema, provider, profile, provider version, exact selectors, and collection errors.
    rationale: Invalidate later evidence when the executable verifier inventory changes.
  - id: unmatched-selectors-are-not-collected
    action: added
    description: A contract whose exact provider, profile, and selector identity is absent from inventory produces not_collected rather than a fuzzy match or pass.
    rationale: Make missing verifiers explicit and fail closed.
guidance:
  - id: keep-framework-logic-in-workrr
    action: added
    description: Add future verification frameworks as Workrr providers registered through the provider registry; do not add framework-specific branches to Procedrr or Structrr.
    rationale: Preserve the ownership boundary as provider coverage expands.
