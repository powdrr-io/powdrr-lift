schema: https://powdrr.io/schema/changelog-v2
change_id: 744
title: Compile affected verification obligations before implementation
intent:
  problem: Procedrr does not compile the exact intent-protecting contracts required before OpenCode changes the repository.
  goal: Compile a deterministic verification-obligation packet from read-only Structrr state and the feature proposal.
human-decisions:
  - id: structrr-intent-is-read-only
    summary: Committed Structrr is accepted read-only state; proposals are the only run-time intent overlay.
  - id: obligation-selection-is-mechanical
    summary: Select contracts through deterministic closure and exact provider inventory.
