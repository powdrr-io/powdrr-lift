schema: https://powdrr.io/schema/changelog-v2
change_id: 745
title: Record per-contract verification evidence during feature flows
intent:
  problem: Compiled verification obligations are not yet executed as independently auditable proof during implementation and repair.
  goal: Execute each exact provider selector and persist typed, identity-bound evidence and progress events before review can declare the feature complete.
human-decisions:
  - id: exact-provider-command
    summary: Execute selectors with the validation command discovered during Structrr bootstrap.
  - id: evidence-is-artifact-backed
    summary: Persist structured evidence plus bounded verifier output for every obligation.
