entities:
  - id: verification-evidence-runner
    type: Module
    action: added
entity_relationships: []
invariants:
  - id: every-obligation-produces-evidence
    action: added
    description: Each compiled verification obligation produces a typed evidence record, including non-collected and execution-error outcomes.
    rationale: Prevent silent gaps in intent verification.
  - id: evidence-is-candidate-bound
    action: added
    description: Evidence records include candidate, contract, verifier, protected-input, and command fingerprints.
    rationale: Prevent stale proof from being accepted for a different candidate.
guidance:
  - id: preserve-provider-neutral-boundary
    action: added
    description: Add provider-specific execution only behind the Workrr verification provider boundary.
    rationale: Keep Procedrr orchestration and Structrr obligations framework-neutral.
