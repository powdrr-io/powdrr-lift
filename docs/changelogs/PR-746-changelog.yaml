        - validation-does-not-mutate
      guidance: [implement-polyglot-support-in-dependency-order]
entities:
  - id: polyglot-repository-and-go-support-plan
    type: Design doc
    action: added
entity_relationships: []
invariants:
  - id: no-primary-language
    action: added
    description: Powdrr composes repository guarantees from every affected component and never uses a primary language to select analysis, context, or validation.
    rationale: Mixed-language repositories require complete coverage across component boundaries rather than one privileged implementation stack.
  - id: affected-unsupported-components-block
    action: added
    description: A proposal cannot invoke OpenCode when an affected component lacks the structural, validation, or verification capability required by that proposal.
    rationale: File-only or unavailable language support must not silently satisfy an intent-preservation gate.
  - id: validation-does-not-mutate
    action: added
    description: Commands classified as validation must leave repository contents unchanged, while formatters, generators, and dependency updates remain explicit edit operations.
    rationale: Validation is evidence about an implementation diff and must not secretly become part of that diff.
guidance:
  - id: implement-polyglot-support-in-dependency-order
    action: added
    description: Implement component inventory, extractor abstraction, validation v2, impact closure, Go structure, Go verification, targeted worker packets, and polyglot end-to-end proof in that dependency order.
    rationale: Each phase consumes fingerprinted schemas and guarantees established by its predecessor.
features: []
