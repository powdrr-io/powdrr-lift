schema: https://powdrr.io/schema/changelog-v2
change_id: 746
title: Plan polyglot repository management and Go support
intent:
  problem: Powdrr has language-neutral execution boundaries but models source structure as Python-only, represents validation without component scope, and cannot provide complete intent-preservation evidence across mixed-language repositories.
  goal: Define an implementation-ready sequence that introduces deterministic repository components and language capabilities, migrates Python behind adapter boundaries, adds Go structure and verification, and proves cross-language feature execution end to end.
human-decisions:
  - id: component-first-polyglot-model
    summary: Model a repository as a graph of independently buildable components without selecting a primary language.
  - id: explicit-language-capability-coverage
    summary: Record structural, validation, and verification support per component and block affected work when required coverage is unavailable.
  - id: python-first-go-second-adapters
    summary: Migrate Python onto general adapter contracts before adding Go as the second language implementation.
  - id: separate-edit-and-validation-commands
    summary: Restrict mutation-producing formatters and generators to OpenCode edit operations while independently enforcing read-only validation.
structured_files: []
files:
  - path: docs/plans/polyglot-repository-and-go-support.md
    type: added
    summary: Define the polyglot component model, capability contracts, eight implementation phases, Go adapter details, validation gates, failure policy, migration, and agent handoff checklist.
    rationale: Give another agent a deterministic implementation path from Python-specific source modeling to complete mixed-language and Go feature execution without weakening intent-preservation guarantees.
    span: {start_line: 1, end_line: 766}
    related:
      entities: [polyglot-repository-and-go-support-plan]
      decisions:
        - component-first-polyglot-model
