  - {path: tests/test_evidence_reconciliation.py, type: added, summary: Test fresh passing evidence, stale evidence, and remaining failures, rationale: Protect deterministic repair convergence, span: {start_line: 1, end_line: 61}}
entities:
  - id: verification-evidence-reconciliation
    type: Module
    action: added
entity_relationships: []
invariants:
  - id: one-fresh-evidence-record-per-obligation
    action: added
    description: Every compiled obligation must map to exactly one current evidence record before acceptance.
    rationale: Prevent missing, duplicated, or stale proof from passing.
  - id: repair-issues-come-from-current-results
    action: added
    description: Repair rounds use only issues produced by the latest validation and evidence reconciliation.
    rationale: Ensure resolved issues do not persist into later rounds.
guidance:
  - id: deterministic-evidence-gate
    action: added
    description: Model review output cannot turn stale or non-passing deterministic evidence into acceptance.
    rationale: Preserve forward-only development guarantees.
proposed_prs: []
