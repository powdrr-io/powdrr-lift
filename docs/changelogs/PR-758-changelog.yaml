  - {path: docs/structrr/current/baseline-5f4747b.yaml, type: modified, summary: Update current state path, rationale: Keep Structrr current state accurate, span: {start_line: 58490, end_line: 58490}}
entities:
  - id: canonical-powdrr-runtime-directory
    type: Module
    action: added
entity_relationships: []
invariants:
  - id: runtime-state-uses-powdrr
    action: added
    description: Powdrr-generated runtime state is stored under .powdrr and does not create .powdrr-lift.
    rationale: Provide one predictable location for local and remote run artifacts.
guidance:
  - id: inspect-powdrr-state
    action: added
    description: Inspect .powdrr for generated state, reports, indexes, and run artifacts.
    rationale: Make runtime diagnostics discoverable.
