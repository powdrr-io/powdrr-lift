  - {path: docs/procedrr/skill-definitions/implement-feature.yaml, type: modified, summary: Apply a contextual rule to requirement classification, rationale: Treat explicit test language as a required obligation deterministically, span: {start_line: 147, end_line: 150}}
  - {path: tests/test_procedrr.py, type: modified, summary: Verify implement-feature uses prompt rules, rationale: Protect the checked-in workflow from losing contextual guidance, span: {start_line: 413, end_line: 423}}
