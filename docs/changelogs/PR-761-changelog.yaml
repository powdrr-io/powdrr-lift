  - {path: tests/test_procedrr.py, type: modified, summary: Verify fragment prompt rules, rationale: Protect checked-in generate-fragment contextual guidance, span: {start_line: 390, end_line: 394}}
  - {path: tests/fixtures/structrr/golden-python-symbols.yaml, type: modified, summary: Update WorkflowDefinition symbol span, rationale: Keep the Structrr golden fixture aligned with the current model source after the prompt-rule additions, span: {start_line: 56, end_line: 57}}
  - {path: tests/fixtures/structrr/golden-python-symbols.yaml, type: modified, summary: Update WorkflowDefinition fingerprint span, rationale: Keep the Structrr golden fixture aligned with the current model source after the prompt-rule additions, span: {start_line: 63, end_line: 64}}
entities:
  - id: procedrr-contextual-prompt-rules
    type: Module
    action: added
entity_relationships: []
invariants:
  - id: prompt-rule-selection-is-deterministic
    action: added
    description: Prompt rules are evaluated from declared workflow context before a judge request is sent, with no model authority over rule selection.
    rationale: Make context-sensitive instructions reproducible and auditable.
guidance:
  - id: declare-prompt-rules-with-judge-context
    action: added
    description: Declare each prompt rule binding in the judge context and use append or replace mode for the selected instructions.
    rationale: Keep conditional prompt behavior explicit and structurally validated.
proposed_prs: []
