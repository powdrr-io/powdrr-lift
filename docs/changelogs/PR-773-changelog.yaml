schema: https://powdrr.io/schema/changelog-v2
change_id: 773
title: Add and harden live implement-feature smoke harness
intent:
  problem: The implement-feature flow has an end-to-end test double but no fast, repeatable command that proves the production CLI can complete a real feature run with live planning and OpenCode.
  goal: Provide an opt-in disposable-repository smoke run that invokes the production workrr-feature path and validates its complete result without opening an external pull request.
human-decisions:
  - id: use-disposable-local-origin
    summary: Create a temporary repository and local bare origin so the smoke run exercises the real branch and worktree setup without changing a developer checkout or requiring a remote repository.
  - id: preserve-failed-run-artifacts
    summary: Retain the disposable repository and Powdrr run artifacts on failure so live failures can be diagnosed from the exact proposal, requests, validation, and review evidence.
structured_files: []
