schema: https://powdrr.io/schema/changelog-v2
change_id: 773
title: Add live implement-feature smoke harness
intent:
  problem: The implement-feature flow has an end-to-end test double but no fast, repeatable command that proves the production CLI can complete a real feature run with live planning and OpenCode.
  goal: Provide an opt-in disposable-repository smoke run that invokes the production workrr-feature path and validates its complete result without opening an external pull request.
human-decisions:
  - id: use-disposable-local-origin
    summary: Create a temporary repository and local bare origin so the smoke run exercises the real branch and worktree setup without changing a developer checkout or requiring a remote repository.
  - id: preserve-failed-run-artifacts
    summary: Retain the disposable repository and Powdrr run artifacts on failure so live failures can be diagnosed from the exact proposal, requests, validation, and review evidence.
structured_files: []
files:
  - {path: scripts/live-implement-feature-smoke.py, type: added, summary: Create a disposable repository, invoke the production workrr-feature CLI with live providers, and assert the completed implementation state, rationale: Make one real implement-feature acceptance run reproducible and inspectable without PR publication, span: {start_line: 1, end_line: 270}}
  - {path: bin/test-live-implement-feature, type: added, summary: Provide a short developer command for the live smoke harness, rationale: Make the real flow fast to invoke after changing implement-feature, span: {start_line: 1, end_line: 5}}
  - {path: docs/current/real-implement-feature-smoke.md, type: added, summary: Document live smoke usage, artifacts, and acceptance conditions, rationale: Define how developers validate the production flow after changing it, span: {start_line: 1, end_line: 42}}
entities:
  - {id: live-implement-feature-smoke, type: Test harness, action: added, description: An opt-in command that runs the production implement-feature CLI against a disposable repository with live planning and OpenCode providers.}
  - {id: live-implement-feature-command, type: Command, action: added, description: The bin/test-live-implement-feature developer entry point for the live smoke harness.}
  - {id: live-implement-feature-runbook, type: Runbook, action: added, description: The documented procedure and acceptance contract for a live implement-feature smoke run.}
entity_relationships:
  - {id: command-runs-live-harness, type: invokes, source: live-implement-feature-command, target: live-implement-feature-smoke, action: added, description: The short command delegates to the Python smoke harness.}
  - {id: runbook-describes-harness, type: documents, source: live-implement-feature-runbook, target: live-implement-feature-smoke, action: added, description: The runbook defines invocation, isolation, artifacts, and pass conditions.}
invariants:
  - id: live-smoke-uses-production-cli
    action: added
    description: The live smoke run invokes the production workrr-feature CLI with the configured planning provider and OpenCode executable.
    rationale: A real acceptance run must exercise the same orchestration boundary used outside the test suite.
  - id: live-smoke-fails-closed
    action: added
    description: The live smoke command fails unless proposal evidence, verification obligations, validation, post-implementation review, expected source output, commit state, and clean worktrees all pass.
    rationale: A provider process exiting successfully is not sufficient evidence that implement-feature completed correctly.
  - id: live-smoke-isolation
    action: added
    description: The live smoke run operates on a disposable repository with a local bare origin and does not require PR publication.
    rationale: Developers must be able to run the acceptance check without mutating their working checkout or external GitHub state.
guidance:
  - id: run-live-smoke-after-flow-changes
    action: added
    description: Run bin/test-live-implement-feature after changing the production implement-feature flow; inspect the retained run directory whenever it fails.
    rationale: This is the fast real-flow validation gate, distinct from the deterministic regression suite.
proposed_prs: []
