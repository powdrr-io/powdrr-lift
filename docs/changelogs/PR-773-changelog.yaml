entities:
  - {id: live-implement-feature-smoke, type: Test harness, action: added, description: An opt-in command that runs the production implement-feature CLI against a disposable repository with live planning and OpenCode providers.}
  - {id: live-implement-feature-command, type: Command, action: added, description: The bin/test-live-implement-feature developer entry point for the live smoke harness.}
