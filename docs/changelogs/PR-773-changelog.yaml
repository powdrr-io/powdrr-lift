  - {id: runbook-describes-harness, type: documents, source: live-implement-feature-runbook, target: live-implement-feature-smoke, action: added, description: The runbook defines invocation, isolation, artifacts, and pass conditions.}
invariants:
  - id: live-smoke-uses-production-cli
    action: added
    description: The live smoke run invokes the production workrr-feature CLI with the configured planning provider and OpenCode executable.
    rationale: A real acceptance run must exercise the same orchestration boundary used outside the test suite.
  - id: live-smoke-fails-closed
    action: added
    description: The live smoke command fails unless proposal evidence, verification obligations, validation, post-implementation review, expected source output, commit state, and clean worktrees all pass.
    rationale: A provider process exiting successfully is not sufficient evidence that implement-feature completed correctly.
  - id: live-smoke-isolation
    action: added
    description: The live smoke run operates on a disposable repository with a local bare origin and does not require PR publication.
    rationale: Developers must be able to run the acceptance check without mutating their working checkout or external GitHub state.
guidance:
  - id: run-live-smoke-after-flow-changes
    action: added
    description: Run bin/test-live-implement-feature after changing the production implement-feature flow; inspect the retained run directory whenever it fails.
    rationale: This is the fast real-flow validation gate, distinct from the deterministic regression suite.
