invariants:
  - id: procedrr-references-resolve-before-execution
    action: added
    description: Control-flow subjects, judge contexts, snapshots, and collection values must resolve against statically known bindings before a workflow can execute.
    rationale: Move mechanical reference failures from runtime into deterministic validation.
  - id: procedrr-control-contracts-are-bounded
    action: added
    description: Loop, recovery, and resource-limit declarations must have valid bounded shapes before execution.
    rationale: Prevent malformed control structures from creating unpredictable runtime behavior.
  - id: procedrr-model-output-has-no-runtime-identity
    action: added
    description: LLM judge outputs must contain semantic decisions only; identity, provenance, references, versions, hashes, and fingerprints are derived by trusted runtime operations.
    rationale: Prevent model-generated metadata from becoming authoritative workflow identity or evidence.
guidance:
  - id: validate-procedrr-before-flow-edits
    action: added
    description: Run Procedrr static validation against every checked-in skill definition before changing or executing a flow.
    rationale: Make flow refactoring safe by detecting structural errors at authoring time.
