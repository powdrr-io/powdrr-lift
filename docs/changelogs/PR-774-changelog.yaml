schema: https://powdrr.io/schema/changelog-v2
change_id: 774
title: Validate Procedrr control-flow and model-output contracts statically
intent:
  problem: Procedrr definitions can reach runtime with malformed loop declarations, unresolved control-flow bindings, or LLM-owned identity metadata.
  goal: Reject mechanically invalid workflow shapes and model output contracts during static validation so flow changes fail before execution.
human-decisions:
  - id: static-procedrr-contract-validation
    summary: Validate binding dataflow and bounded control declarations before any Procedrr execution.
