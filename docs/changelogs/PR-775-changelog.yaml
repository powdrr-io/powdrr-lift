invariants:
  - id: procedrr-definitions-are-statically-valid
    action: added
    description: Procedrr definitions must use known fields, valid bindings, valid schemas, valid terminal statuses, and positive bounded loop limits before execution.
    rationale: Move mechanical flow failures from runtime into deterministic authoring-time diagnostics.
  - id: procedrr-branch-bindings-are-definite
    action: added
    description: A binding produced in only some branch paths cannot be referenced as unconditionally available after the branch.
    rationale: Prevent path-dependent runtime reference failures.
guidance:
  - id: run-static-definition-validation
    action: added
    description: Parse and validate every checked-in Procedrr definition after changing flow structure or prompt contracts.
    rationale: Make flow evolution safe by detecting structural errors before execution.
