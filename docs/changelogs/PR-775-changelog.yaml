schema: https://powdrr.io/schema/changelog-v2
change_id: 775
title: Strengthen Procedrr static validation
intent:
  problem: Procedrr flow definitions can still contain malformed fields, invalid model contracts, and branch-dependent bindings that only fail during execution.
  goal: Reject mechanically invalid flow definitions before execution so future flow changes remain safe to evolve.
human-decisions:
  - id: validate-procedrr-contracts-before-execution
    summary: Enforce static shape, dataflow, schema, and resource contracts for every checked-in Procedrr definition.
