change_id: 776
title: Unify feature instructions and obligations
intent:
  problem: The feature flow derives design decisions, requirements, reflections, and obligations through redundant passes over the same feature description.
  goal: Compile one deterministic instruction ledger into one semantic obligation stream that drives Structrr planning, active intents, required tests, and implementation verification.
human-decisions:
  - id: instruction-ledger-is-the-feature-source
    summary: Use compiler-owned instruction clauses as the single source for semantic feature obligations.
