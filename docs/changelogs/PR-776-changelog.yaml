invariants:
  - id: instruction-clause-obligation-completeness
    action: added
    description: Every instruction clause receives exactly one semantic design projection, compiler-owned obligation, acceptance criterion, and required test contract.
    rationale: Prevent feature intent from being dropped between request capture and implementation.
  - id: compiler-owned-obligation-identity
    action: added
    description: Models provide semantic prose only; clause IDs, obligation IDs, intent references, test identities, and selectors are compiler-owned.
    rationale: Preserve deterministic traceability and prevent model-authored identity metadata.
guidance:
  - id: consume-canonical-obligations
    action: added
    description: Downstream planning and implementation stages must consume canonical feature obligations rather than reinterpreting the original feature description.
    rationale: Keep the forward-only feature pipeline coherent and non-redundant.
