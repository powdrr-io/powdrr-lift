schema: https://powdrr.io/schema/changelog-v2
change_id: 779
title: Add typed Procedrr command catalog
intent:
  problem: Procedrr internal commands are dispatched through loosely typed name and parameter maps, making invalid calls and missing output contracts difficult to detect before runtime.
  goal: Define one structured command catalog that supplies command identity, input and output schemas, dispatch logic, and schema tracking for static and runtime validation.
human-decisions:
  - id: catalog-owns-command-contracts
    summary: Represent every deterministic feature-flow command as a cataloged Python object with explicit input and output contracts.
