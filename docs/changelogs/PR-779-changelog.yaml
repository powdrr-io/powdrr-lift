invariants:
  - id: cataloged-command-contract
    action: added
    description: Every cataloged command has a name, input schema, output schema, and dispatch logic contract.
    rationale: Keep deterministic command behavior explicit and inspectable.
  - id: output-schema-propagation
    action: added
    description: Explicit operation and subflow output schemas are retained on bindings for later validation.
    rationale: Prevent downstream steps from losing the shape of produced data.
guidance:
  - id: validate-before-dispatch
    action: added
    description: Feature flows should validate cataloged internal command names and parameters before dispatch.
    rationale: Catch mechanical flow errors before invoking runtime logic.
