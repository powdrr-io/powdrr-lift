schema: https://powdrr.io/schema/changelog-v2
change_id: 782
title: Support transparent code-agent targeting
intent:
  problem: Procedrr implementation steps are coupled to OpenCode, so Powdrr cannot select another coding agent or adapt the handoff prompt to that agent.
  goal: Route implementation requests through a provider-neutral code-agent boundary with configurable OpenCode and mini-SWE-agent targets and tailored prompts.
human-decisions:
  - id: provider-neutral-implementation
    summary: Keep the feature flow's implementation command independent of the selected coding-agent provider.
  - id: provider-specific-prompting
    summary: Allow configured prompt prefixes and suffixes to tailor the same bounded implementation request for a selected provider.
