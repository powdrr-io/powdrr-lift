invariants:
  - id: provider-neutral-flow-command
    action: added
    description: The implement-feature Procedrr flow invokes run_code_agent rather than naming a concrete coding-agent provider.
    rationale: Provider selection belongs to Workrr configuration, not to the reusable flow definition.
  - id: exact-targeted-prompt-recording
    action: added
    description: A configured provider prompt prefix or suffix is applied before the request and prompt artifacts are persisted.
    rationale: Diagnostics and replay must represent the prompt that the selected agent actually received.
  - id: bounded-provider-selection
    action: added
    description: Supported targets are explicitly limited to opencode and minisweagent at the common factory boundary.
    rationale: Reject unsupported worker targets before an implementation attempt starts.
guidance:
  - id: configure-code-agent
    action: added
    description: Use --code-agent together with the provider executable, model, and prompt prefix or suffix options when invoking a feature or direct coding-agent run.
    rationale: Keep provider-specific operational choices outside the shared Procedrr flow.
