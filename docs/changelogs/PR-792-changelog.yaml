schema: https://powdrr.io/schema/changelog-v2
change_id: 792
title: Document source-anchored semantic contract compilation
intent:
  problem: The design interview currently asks a general model to generate a serial chain of obligation, acceptance, population, operation, oracle, and evidence prose, allowing an early paraphrase error to propagate while leaving repository lookup and contract assembly underspecified.
  goal: Specify source-anchored atomic classifiers, exact extractors, deterministic repository matching, typed contract assembly, and a migration path to specialized local classifiers in enough detail for future agents to implement without redefining the architecture.
human-decisions:
  - id: compile-contracts-from-atomic-classifications
    summary: Build typed semantic contracts from independently validated source classifications and extractions rather than asking one model to author the complete contract.
  - id: specify-classifier-replacement-boundary
    summary: Treat bounded semantic decisions as provider-neutral contracts so suitable decisions can move from general LLMs to specialized classifiers.
structured_files: []
files:
  - path: docs/design/source-anchored-semantic-contract-compilation.md
    type: added
    summary: Define the classifier catalog, extraction rules, abstention protocol, repository inventory, candidate lookup and matching algorithms, contract assembly, projections, executable-case compilation, classifier migration, tests, and implementation slices.
    rationale: Preserve the agreed weak-model reliability architecture as an implementation-grade specification with no missing lookup or assembly decisions left for future agents to invent.
    span:
      start_line: 1
      end_line: 1669
    related:
      entities:
        - source-anchored-semantic-contract-compilation-design
      decisions:
