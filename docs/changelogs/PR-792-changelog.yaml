entities:
  - id: source-anchored-semantic-contract-compilation-design
    type: Design doc
    action: added
entity_relationships: []
invariants:
  - id: immutable-source-remains-semantic-authority
    action: added
    description: Every semantic classifier and extractor remains anchored to the immutable source proposition, and no generated paraphrase becomes authoritative input to a later semantic decision.
    rationale: Prevent early weak-model wording errors from propagating into population, operation, predicate, and verification meaning.
  - id: unresolved-semantics-never-become-guesses
    action: added
    description: A required semantic field that is ambiguous, underspecified, unsupported, or missing repository evidence remains explicitly unresolved and blocks executable-contract compilation.
    rationale: Make abstention and targeted clarification safer than pressuring a weak model to invent a complete answer.
  - id: repository-bindings-require-versioned-evidence
    action: added
    description: Subject populations, symbols, behaviors, predicates, fixtures, and test selectors are bound only from versioned Structrr, repository inventory, ontology, adapter, or human-decision evidence.
    rationale: Keep repository facts and executable identities out of unconstrained model generation.
guidance:
  - id: migrate-bounded-decisions-by-measured-reliability
    action: added
    description: Replace general-LLM decisions with deterministic rules or specialized classifiers one decision kind at a time through shared schemas, shadow evaluation, per-label metrics, calibrated abstention, and pinned model revisions.
    rationale: Improve weak-model reliability without changing Procedrr control flow or canonical semantic artifacts.
