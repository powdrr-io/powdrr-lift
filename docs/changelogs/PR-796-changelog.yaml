schema: https://powdrr.io/schema/changelog-v2
change_id: 796
title: Plan local semantic classifier implementation
intent:
  problem: The source-anchored semantic contract design identifies classifiers and extractors that could move away from general LLMs, but it does not specify model architecture, gold-data construction, training, calibration, CPU deployment, or the evidence required to prove a local model is at least as accurate.
  goal: Define an implementation-grade plan for deterministic rules and custom local clause, span, and semantic-pair models that match or exceed the current LLM baseline while running substantially faster on ordinary CPU hardware.
human-decisions:
  - id: use-cpu-first-classifier-portfolio
    summary: Build separate CPU-first clause, exact-span, and semantic-pair model bundles rather than one generative model or one model per decision.
  - id: require-llm-noninferiority-before-promotion
    summary: Promote each local decision kind only after a frozen gold evaluation shows accuracy at least as high as the current LLM with critical-label, abstention, latency, and system-level gates.
  - id: keep-gpu-training-optional-for-runtime
    summary: Recommend GPU acceleration for repeatable transformer training while requiring all production inference to qualify on ordinary CPU profiles.
structured_files: []
files:
  - path: docs/plans/local-semantic-classifier-implementation-plan.md
    type: added
    summary: Map every semantic classifier and extractor to deterministic or learned providers and define datasets, training, calibration, evaluation, CPU optimization, hardware, runtime, monitoring, and an eight-PR delivery sequence.
    rationale: Give future agents enough concrete architecture and validation detail to build faster local classifiers without redefining labels, inventing evaluation policy, or assuming GPU inference.
