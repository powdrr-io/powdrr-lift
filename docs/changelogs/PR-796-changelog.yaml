entities:
  - id: local-semantic-classifier-implementation-plan
    type: Design doc
    action: added
entity_relationships: []
invariants:
  - id: local-classifiers-preserve-provider-neutral-semantics
    action: added
    description: Deterministic rules, local models, Jev, and planning LLMs use the same decision labels, abstention outcomes, and bound semantic-decision envelope without changing Procedrr control flow.
    rationale: Allow provider replacement without changing durable intent meaning or contract assembly.
  - id: classifier-promotion-requires-noninferiority
    action: added
    description: A local classifier decision kind is promoted only when frozen held-out evidence shows accepted and hybrid accuracy at least as high as the current LLM baseline while preserving critical-label precision and intent-expansion and narrowing limits.
    rationale: Speed improvements must not come from accepting less accurate semantic decisions.
  - id: production-classification-remains-cpu-capable
    action: added
    description: Every promoted production model must satisfy accuracy, latency, memory, and semantic-equivalence gates on declared ordinary CPU profiles even when GPU acceleration is used for training.
    rationale: Keep local inference deployable without specialized production hardware.
guidance:
  - id: prefer-smallest-qualified-classifier
    action: added
    description: Start with deterministic and simple baselines, use 33M-parameter CPU-first encoders for learned tasks, and adopt ModernBERT-base only for demonstrated model-capacity failures that justify its higher resource cost.
    rationale: Minimize latency and operational complexity while meeting measured semantic accuracy.
features: []
proposed_prs: []
