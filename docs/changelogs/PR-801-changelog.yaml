schema: https://powdrr.io/schema/changelog-v2
change_id: 801
title: Target one mini-SWE-agent prompt with obligation validation
intent:
  problem: The design and coding-worker documents did not distinguish one worker-facing prompt from the private design artifacts needed to prove, obligation by obligation, that the resulting implementation and tests preserve accepted intent.
  goal: Compile each completed design into one mini-SWE-agent prompt plus an immutable private validation manifest, then require durable tests, independent evidence where possible, and a passing receipt for every obligation after coding.
human-decisions:
  - id: compile-one-terminal-implementation-prompt
    summary: Compile every resolved contract, repository fact, and verification requirement into one immutable prompt sent once to mini-SWE-agent.
  - id: preserve-private-obligation-validation-manifest
    summary: Preserve every obligation, case, oracle, baseline expectation, durable-test requirement, and evidence requirement in a private manifest that is never sent to the coding worker.
  - id: validate-every-obligation-independently
    summary: Require one fail-closed validation receipt per obligation from collected tests, candidate and baseline execution, oracle alignment, relevant diff evidence, and bounded semantic review when needed.
  - id: prefer-independent-validator-evidence
    summary: Run adapter-materialized Workrr-owned probes outside the candidate checkout whenever the typed verification case can produce them.
  - id: make-validation-failure-terminal
    summary: Treat worker and validation failures as terminal evidence rather than sources of continuation, repair, or OpenCode fallback prompts.
structured_files: []
files:
  - path: docs/design/external-coding-agent-boundary.md
    type: modified
    summary: Define the one-prompt mini-SWE-agent lifecycle and the private manifest-driven, per-obligation validation boundary.
    rationale: Give implementation agents an unambiguous handoff and acceptance model with independent evidence and no repair prompts.
    span:
      start_line: 1
      end_line: 255
    related:
      entities:
        - single-prompt-minisweagent-implementation-flow
      decisions:
        - compile-one-terminal-implementation-prompt
        - preserve-private-obligation-validation-manifest
        - validate-every-obligation-independently
        - prefer-independent-validator-evidence
        - make-validation-failure-terminal
      invariants:
        - one-design-revision-produces-one-worker-prompt
        - every-actionable-obligation-retains-a-validation-contract
        - implementation-validation-never-creates-another-prompt
        - minisweagent-is-the-only-target-editor
