entities:
  - id: single-prompt-minisweagent-implementation-flow
    type: Workflow
    action: added
entity_relationships: []
invariants:
  - id: one-design-revision-produces-one-worker-prompt
    action: added
    description: A completed and validated design revision deterministically produces exactly one immutable minisweagent-implementation-prompt-v1 artifact and exactly one mini-SWE-agent invocation.
    rationale: Preserve feature coherence and prevent obligation, file, test, or validation boundaries from multiplying coding sessions.
  - id: implementation-validation-never-creates-another-prompt
    action: added
    description: Timeout, limit, provider, scope, test, and final-validation failures terminate the implementation run and cannot generate a continuation, repair, or fallback coding prompt.
    rationale: Keep retry and design revision explicit while ensuring one failed implementation attempt cannot silently alter its accepted contract.
  - id: minisweagent-is-the-only-target-editor
    action: added
    description: The completed feature flow invokes mini-SWE-agent as its sole repository editor and never selects OpenCode as an implementation fallback.
    rationale: Remove provider-dependent ambiguity from the design-to-implementation contract.
guidance:
  - id: improve-future-runs-through-design-revision
    action: added
    description: Use durable failure evidence to improve and revalidate a future design revision or model configuration under a new run identity instead of appending instructions to the failed run.
    rationale: Preserve prompt immutability and make every implementation attempt reproducible from one accepted design.
features: []
proposed_prs: []
