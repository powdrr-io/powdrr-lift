schema: https://powdrr.io/schema/changelog-v2
change_id: 801
title: Target one mini-SWE-agent prompt after design
intent:
  problem: The semantic-contract and coding-worker designs still allowed competing downstream interpretations, including per-unit worker packets, provider selection, continuation, and validation-derived repair prompts, instead of defining one terminal implementation handoff.
  goal: Make one immutable prompt for one mini-SWE-agent invocation the explicit final output of every completed design revision, with deterministic completeness checks and terminal post-implementation validation.
human-decisions:
  - id: compile-one-terminal-implementation-prompt
    summary: Compile every resolved contract, verification case, repository fact, preservation rule, and scope constraint into one immutable mini-SWE-agent prompt after design validation completes.
  - id: invoke-minisweagent-exactly-once
    summary: Send the compiled prompt to exactly one mini-SWE-agent invocation while allowing its internal inspect, edit, and test turns to remain inside that invocation.
  - id: make-validation-failure-terminal
    summary: Treat timeout, limit, worker, and validation failures as terminal evidence for the run rather than sources of repair, continuation, or OpenCode fallback prompts.
structured_files: []
files:
  - path: docs/design/external-coding-agent-boundary.md
    type: modified
    summary: Define the normative single-prompt mini-SWE-agent lifecycle, attempt evidence, validation policy, failure semantics, and required tests.
    rationale: Give implementation agents one unambiguous worker boundary with no per-obligation sessions, repair prompts, or provider fallback.
    span:
      start_line: 1
      end_line: 188
    related:
      entities:
        - single-prompt-minisweagent-implementation-flow
      decisions:
        - compile-one-terminal-implementation-prompt
        - invoke-minisweagent-exactly-once
        - make-validation-failure-terminal
      invariants:
        - one-design-revision-produces-one-worker-prompt
        - implementation-validation-never-creates-another-prompt
        - minisweagent-is-the-only-target-editor
  - path: docs/design/source-anchored-semantic-contract-compilation.md
    type: modified
    summary: Connect semantic-contract compilation to the terminal mini-SWE-agent prompt schema, renderer, completeness gate, artifacts, and flow.
    rationale: Make the complete accepted design compile deterministically into one worker-facing prompt without exposing internal intent representations.
