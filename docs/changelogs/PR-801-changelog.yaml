entities:
  - id: single-prompt-minisweagent-implementation-flow
    type: Workflow
    action: added
entity_relationships: []
invariants:
  - id: one-design-revision-produces-one-worker-prompt
    action: added
    description: A completed design revision deterministically produces exactly one worker-facing minisweagent-implementation-prompt-v1 and exactly one mini-SWE-agent invocation.
    rationale: Preserve feature coherence and prevent obligation, file, test, or validation boundaries from multiplying coding sessions.
  - id: every-actionable-obligation-retains-a-validation-contract
    action: added
    description: The design handoff preserves every actionable obligation in a private immutable manifest with its verification cases, durable-test requirement, oracle, baseline expectation, and required evidence, and acceptance requires one passing receipt per obligation.
    rationale: Ensure the single worker prompt does not discard the structured information required to prove completeness after coding.
  - id: implementation-validation-never-creates-another-prompt
    action: added
    description: Timeout, provider, scope, test, obligation, and final-validation failures terminate the run and cannot generate a continuation, repair, or fallback coding prompt.
    rationale: Keep retry and design revision explicit while ensuring a failed implementation attempt cannot silently alter its accepted contract.
  - id: minisweagent-is-the-only-target-editor
    action: added
    description: The completed feature flow invokes mini-SWE-agent as its sole repository editor and never selects OpenCode as an implementation fallback.
    rationale: Remove provider-dependent ambiguity from the design-to-implementation contract.
guidance:
  - id: require-layered-obligation-evidence
    action: added
    description: Treat test collection and passing execution as necessary but insufficient; also require the declared durable-test diff, baseline discrimination for new behavior, oracle alignment, independent probes where materializable, and bounded per-obligation semantic review.
    rationale: Prevent tautological, unrelated, or worker-controlled tests from becoming the only evidence that an obligation was implemented.
  - id: improve-future-runs-through-design-revision
    action: added
    description: Use durable failure evidence to improve and revalidate a future design revision or model configuration under a new run identity instead of appending instructions to the failed run.
    rationale: Preserve prompt immutability and make every implementation attempt reproducible from one accepted design.
features: []
proposed_prs: []

