invariants:
- id: product-semantics-cannot-be-excluded-as-process-only
  action: added
  description: A nonactionable classification excludes text from product behavior
    only after an independent safety decision proves it process-only and binds any
    imperative to its registered Procedrr route.
  rationale: Prevent nonactionable filtering from erasing product non-goals, mixed
    clauses, or workflow requirements.
- id: behaviorally-distinct-contracts-require-contrast-evidence
  action: added
  description: Distinct observation views, lifecycle phases, precedence rules, variants,
    and behaviorally different partitions require an authority-backed case whose observations
    discriminate the intended behavior from the plausible conflation.
  rationale: Detect implementations that are broadly similar but collapse a required
    semantic boundary.
- id: worker-prompt-is-a-lossless-design-projection
  action: added
  description: The worker prompt preserves every required condition, exception, result,
    observation view, oracle, interaction, contrast, and preservation rule while removing
    only duplicate prose and private metadata.
  rationale: Ensure prompt optimization cannot strip the details needed for a correct
    first implementation attempt.
- id: prompt-and-validation-projections-remain-semantically-equal
  action: added
  description: Exact prompt byte ranges and manifest mappings cover the same contracts,
    dimensions, interactions, contrast cases, and verification predicates from one
    design revision.
  rationale: Ensure the worker is instructed to implement the same semantics that
    Powdrr independently validates afterward.
guidance:
- id: derive-boundaries-only-from-accepted-authority
  action: added
  description: Derive semantic dimensions, interaction relations, forbidden results,
    and contrast cases only from exact source spans, accepted Structrr definitions
    or invariants, repository API contracts, ontology rules, or language-adapter rules,
    and clarify unresolved meaning instead of guessing.
  rationale: Improve subtlety detection without inventing edge-case behavior from
    model familiarity or world knowledge.
