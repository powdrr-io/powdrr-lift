entities: []
entity_relationships: []
invariants:
  - id: local-validation-commands-are-executable
    action: added
    description: A validation command selected for local execution must not contain unresolved CI template or context expressions.
    rationale: CI workflow syntax cannot be executed as-is inside the task container.
  - id: new-tests-use-discovered-profiles
    action: added
    description: A new required test case uses a discovered provider profile independently of whether existing test selector collection produced inventory entries.
    rationale: A selector collection error must not erase the executable validation profile needed to run newly required tests.
guidance:
  - id: prefer-project-native-validation-fallbacks
    action: added
    description: When a workflow-derived validation command is not locally executable, continue discovery using the repository's native validation configuration.
    rationale: Keep local validation deterministic without hardcoding a particular CI matrix expansion.
