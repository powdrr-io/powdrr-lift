schema: https://powdrr.io/schema/changelog-v2
change_id: 807
title: Harden local validation command discovery
intent:
  problem: Validation discovery could select CI commands containing unresolved template expressions, and new pytest obligations depended on selector collection succeeding even when a pytest profile had already been discovered.
  goal: Select only executable local validation commands and preserve discovered pytest profiles as the execution basis for new required test cases.
