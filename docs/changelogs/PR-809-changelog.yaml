schema: https://powdrr.io/schema/changelog-v2
change_id: 809
title: Compile source classifications into semantic contracts
intent:
  problem: The design interview transformed each source clause through a chain of
    free-form obligation, acceptance, population, operation, oracle, and evidence
    paraphrases, allowing early interpretation errors to compound before coding.
  goal: Classify one bounded semantic field at a time, bind exact source spans into a
    canonical partial contract, persist the intermediate evidence, and project source
    text losslessly to existing downstream consumers during migration.
human-decisions:
  - id: replace-chained-prose-with-source-classification
    summary: Replace the seven dependent prose questions with independently validated
      source classifiers and exact-span extractors.
  - id: preserve-legacy-consumers-through-source-projection
    summary: Keep current feature-design consumers operational through a temporary
      compiler-owned projection that copies source meaning rather than asking a model
      to paraphrase it.
  - id: independently-confirm-nonactionable-exclusion
    summary: Require a separate process-only classification before a nonactionable
      disposition can exclude a clause from product obligations.
