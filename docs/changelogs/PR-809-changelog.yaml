entity_relationships:
  - id: design-interview-invokes-source-contract-compiler
    source: classification-oriented-design-interview
    target: source-semantic-contract-compiler
    relationship: invokes
    description: The design interview invokes deterministic operations around each
      bounded classifier and extractor activation.
    rationale: Put sequencing in Procedrr while keeping artifact assembly in Workrr.
    action: added
  - id: source-compiler-produces-partial-contract
    source: source-semantic-contract-compiler
    target: partial-semantic-contract
    relationship: produces
    description: The source compiler assembles validated decisions and exact extractions
      into one partial semantic contract per proposition.
    rationale: Separate provider output from canonical semantic assembly.
    action: added
  - id: semantic-contract-tests-verify-compiler
    source: semantic-contract-compilation-tests
    target: source-semantic-contract-compiler
    relationship: verifies
    description: The semantic contract tests verify compilation, persistence, and
      fail-closed conflict handling.
    rationale: Preserve the source-to-contract boundary as later slices extend it.
    action: added
invariants:
  - id: partial-contract-authority-is-source-anchored
    action: added
    description: Canonical partial-contract meaning consists only of closed decisions,
      exact proposition spans, and compiler-derived structure; generated paraphrase is
      never an authority field.
    rationale: Stop interpretation drift from compounding across model-generated prose.
  - id: exact-extractions-must-match-the-proposition
    action: added
    description: Every extracted subject, behavior, condition, exception, and result is
      case-sensitive exact text from the immutable proposition with an unambiguous
      occurrence and compiler-owned span.
    rationale: Make source evidence mechanically verifiable and replayable.
  - id: nonactionable-exclusion-requires-process-only-confirmation
    action: added
    description: A nonactionable disposition compiles only when an independent decision
      confirms the proposition is process-only; conflicting actionable and process-only
      results also fail compilation.
    rationale: Prevent classification error from silently erasing product intent.
guidance:
  - id: classifiers-abstain-instead-of-inventing
    action: added
    description: Resolve deterministic lexical cases first, then ask a provider for one
      closed value and preserve unresolved status when the proposition cannot support it.
    rationale: Make weaker providers useful without allowing them to manufacture missing
      semantics or repository identities.
