entities: []
entity_relationships: []
invariants:
  - id: behavior-dimensions-are-explicit
    action: added
    description: A public behavior contract explicitly records normal results, error propagation, continuation, unsupported capabilities, cleanup, compatibility, and boundary behavior, including not_applicable decisions.
    rationale: Prevent omitted negative or error semantics from being left for the coding worker to infer.
  - id: verifier-failures-reach-repair
    action: added
    description: Local validation and verifier failures are normalized into structured records containing expected and actual behavior, test identity, contract references, and repairability before repair is requested.
    rationale: Give repair agents the precise current failure instead of a generic incomplete-attempt status.
  - id: repair-commits-are-valid-candidates
    action: added
    description: A repair agent may advance HEAD by committing changes; Workrr validates the resulting diff from the repair base and fresh evidence rather than rejecting the commit solely because HEAD changed.
    rationale: Allow the requested repair workflow while retaining scope and evidence controls.
guidance:
  - id: render-one-behavior-matrix
    action: added
    description: Render each behavior scenario once in the worker prompt with its inputs, outputs, errors, continuation, rejection, and validator target while retaining richer provenance in the private manifest.
    rationale: Reduce duplicate prose without dropping meaning-bearing conditions or exceptions.
