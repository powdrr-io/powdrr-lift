schema: https://powdrr.io/schema/changelog-v2
change_id: 810
title: Strengthen intent contracts and repair handoffs
intent:
  problem: The implementation plan did not require behavior contracts to distinguish error propagation from continuation, supported from rejected capabilities, or local validation failures from verifier failures delivered to repair agents.
  goal: Define a lossless scenario-based handoff with explicit negative behavior, structured failure feedback, and repair commits validated by fresh evidence and diff scope.
