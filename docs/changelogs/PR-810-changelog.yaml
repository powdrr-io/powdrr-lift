    type: modified
    summary: Add PR 4A for typed behavior scenarios, capability matrices, concise prompt projection, structured verifier failures, and repair boundaries.
    rationale: Preserve observable error, continuation, rejection, cleanup, and compatibility intent through coding and repair.
    span:
      start_line: 516
      end_line: 675
  - path: docs/plans/intent-preserving-change-pr-plan.md
    type: modified
    summary: Add behavior and repair requirements to the implementation handoff checklist and dependency sequence.
    rationale: Make the new contract and repair controls part of the executable plan for subsequent agents.
    span:
