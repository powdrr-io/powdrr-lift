schema: https://powdrr.io/schema/changelog-v2
change_id: 811
title: Add source-faithfulness gate to design flow
intent:
  problem: Source classification can introduce subtly unsupported fields before a partial contract reaches downstream consumers.
  goal: Review interpreted fields against exact source text, route unsupported meaning as unresolved, and render compatibility views deterministically.
