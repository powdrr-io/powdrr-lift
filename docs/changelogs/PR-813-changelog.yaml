entity_relationships: []
invariants:
  - {id: serialized-repository-artifacts, action: added, description: Lookup queries and candidate sets are fingerprint-validated when restored from command results., rationale: Prevent stale evidence from silently crossing command boundaries.}
  - {id: subject-binding-is-explicit, action: added, description: Candidate retrieval, relation decisions, aggregation, and population enumeration are separate commands., rationale: Keep each semantic choice independently observable and testable.}
guidance:
  - {id: use-command-boundary-evidence, action: added, description: Downstream subject resolution consumes serialized inventory artifacts rather than model-authored repository descriptions., rationale: Preserve repository evidence as the authority.}
