schema: https://powdrr.io/schema/changelog-v2
change_id: 814
title: Reconcile implementation against accepted intent
intent:
  problem: Final implementation review checks validation and task receipts but does not prove that accepted proposal operations were fulfilled or retained intent was preserved.
  goal: Bind atomic post-implementation judgments to the accepted proposal and observed diff, persist an actualization report, and block PR creation when evidence is missing, stale, or failing.
