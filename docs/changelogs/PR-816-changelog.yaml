    summary: Persist, validate, and render typed behavior scenarios in implementation packets, including scenarios supplied with required test contracts.
    rationale: Bind the prompt projection to the same compiler-owned packet used for implementation handoff.
    related:
      entities: [behavior-contract-compiler, behavior-matrix-renderer]
      invariants: [behavior-prompt-matches-contract]
