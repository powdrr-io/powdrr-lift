    action: added
invariants:
  - id: behavior-dimensions-are-explicit
    action: added
    description: Every compiled scenario explicitly states all required behavior dimensions or marks a dimension not_applicable.
    rationale: An omitted behavior dimension is unresolved and cannot be treated as an implementation decision.
  - id: capability-cases-have-evidence
    action: added
    description: Each declared supported, rejected, or fallback capability has executable evidence, and rejected capabilities define their error behavior.
    rationale: Make capability boundaries testable rather than leaving them implicit in prose.
  - id: behavior-prompt-matches-contract
    action: added
    description: When typed scenarios are present, the worker prompt renders each scenario once from the validated packet.
    rationale: Avoid divergent or duplicated representations of required behavior.
  - id: repair-failures-share-one-schema
    action: added
    description: Local validation and verifier failures use the same structured fields for expected and actual behavior, contract references, and repairability.
    rationale: Preserve current evidence across bounded repair handoffs.
