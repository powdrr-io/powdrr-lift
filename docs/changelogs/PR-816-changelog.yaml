schema: https://powdrr.io/schema/changelog-v2
change_id: 816
title: Compile lossless behavior scenarios and structured repair failures
intent:
  problem: Acceptance prose can omit behavior dimensions, while validation and verifier failures lack a common evidence-rich repair shape.
  goal: Compile explicit behavior scenarios into a concise worker contract and normalize validation failures for bounded repair.
human-decisions: []
structured_files: []
files:
