schema: https://powdrr.io/schema/changelog-v2
change_id: 816
title: Author lossless behavior contracts and structured repair failures
intent:
  problem: Design interviews and acceptance prose can omit behavior dimensions, while validation and verifier failures lack a common evidence-rich repair shape.
  goal: Author explicit behavior scenarios during design, propagate them to a concise worker contract, and normalize validation failures for bounded repair.
human-decisions: []
structured_files: []
