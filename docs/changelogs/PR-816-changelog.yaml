    type: added
    span: {start_line: 1, end_line: 192}
    summary: Validate typed behavior scenarios and capability matrices, reject omitted dimensions, and render behavior contracts as a concise matrix.
    rationale: Make success, error, continuation, unsupported, cleanup, compatibility, negative-boundary, and evidence requirements explicit before worker handoff.
    related:
      entities: [behavior-contract-compiler]
      invariants: [behavior-dimensions-are-explicit, capability-cases-have-evidence]
  - path: src/powdrr_lift/core/implementation_packet.py
    type: modified
