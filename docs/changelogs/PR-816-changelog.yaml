entity_relationships:
  - id: implementation-packet-renders-behavior-contract
    source: behavior-contract-compiler
    target: behavior-matrix-renderer
    relationship: invokes
    description: Implementation packets validate behavior scenarios and render them into worker prompts.
    rationale: Keep prompt content derived from the explicit behavior contract.
    action: added
  - id: behavior-contract-tests-verify-compiler
    source: behavior-contract-tests
    target: behavior-contract-compiler
    relationship: verifies
    description: Tests verify fail-closed scenario compilation and concise behavior-matrix rendering.
