schema: https://powdrr.io/schema/changelog-v2
change_id: 817
title: Add worked examples to semantic classifiers
intent:
  problem: Semantic classifier prompts expose allowed labels but provide too few examples to distinguish them reliably.
  goal: Give every source semantic classifier at least twenty labeled examples, covering each allowed label and demonstrating abstention boundaries where appropriate.
human-decisions: []
structured_files: []
