entity_relationships:
  - id: child-classifiers-follow-root-disposition
    source: semantic-decision-tree
    target: design-interview
    relationship: constrains
    description: Source child decisions are generated and validated only after the disposition root resolves.
    rationale: Avoid incompatible classifications from independent prompts.
    action: added
  - id: design-only-runs-design-interview
    source: design-only-evaluation
    target: design-interview
    relationship: invokes
    description: The command runs the design interview and its evaluators without starting a coding agent.
    rationale: Allow safe isolated testing of generated designs.
    action: added
invariants:
  - id: child-decisions-respect-parent-branch
    action: added
    description: A resolved disposition constrains applicable child values, and incompatible semantic decisions are rejected.
    rationale: Keep the compiled semantic contract internally consistent.
  - id: context-does-not-create-obligation
    action: added
    description: Clauses classified as context do not become actionable feature obligations.
    rationale: Preserve background information without inventing requested behavior.
  - id: design-only-does-not-launch-coder
    action: added
    description: Design-only execution stops after design evaluation and does not invoke a coding agent.
    rationale: Isolate prompt quality evaluation from implementation behavior.
