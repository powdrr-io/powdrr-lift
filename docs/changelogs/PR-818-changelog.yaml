    type: modified
    span: {start_line: 244, end_line: 620}
    summary: Stage source classification behind a root disposition and add parent-aware branches for context, product, and non-goal clauses.
    rationale: Prevent inconsistent child decisions and avoid treating background context as an implementation obligation.
    related: {entities: [semantic-decision-tree, design-only-evaluation], invariants: [child-decisions-respect-parent-branch]}
  - path: src/powdrr_lift/workrr/semantic_contract_compiler.py
    type: modified
