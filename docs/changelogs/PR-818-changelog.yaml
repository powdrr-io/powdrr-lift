    rationale: Make semantic decisions conditional on already resolved parent choices.
    related: {entities: [semantic-decision-tree], invariants: [child-decisions-respect-parent-branch]}
  - path: src/powdrr_lift/core/semantic_decision.py
    type: modified
    span: {start_line: 1, end_line: 500}
