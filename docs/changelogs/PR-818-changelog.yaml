schema: https://powdrr.io/schema/changelog-v2
change_id: 818
title: Add conditional semantic decision tree and design-only evaluation
intent:
  problem: Independent semantic classifiers can contradict one another, and evaluating a design prompt currently requires entering the coding workflow.
  goal: Resolve a root disposition first, constrain dependent decisions to its branch, and allow isolated design generation without launching a coding agent.
human-decisions: []
