schema: https://powdrr.io/schema/changelog-v2
change_id: 820
title: Capture and evaluate DeepSWE worker prompts
intent:
  problem: Design-only evaluation stops before the full implement-feature flow produces task-specific worker prompts, leaving the final instructions-to-prompt handoff unmeasured.
  goal: Capture provider-ready worker prompts without invoking a coding agent, then compare their behavior coverage against the DeepSWE instruction, reference solution, and verifier tests.
human-decisions: []
structured_files: []
