entities:
  - id: deepswe-worker-prompt-evaluator
    type: Tool
    action: added
  - id: deepswe-worker-prompt-subcommand
    type: Subcommand
    action: added
  - id: harbor-worker-prompt-capture-flag
    type: Command-line flag
    action: added
  - id: deepswe-worker-prompt-evaluation-tests
    type: Test suite
    action: added
  - id: state-data-design-rubric
    type: Configuration file
    action: modified
entity_relationships:
  - id: prompt-command-invokes-evaluator
    source: deepswe-worker-prompt-subcommand
    target: deepswe-worker-prompt-evaluator
    relationship: invokes
    description: The CLI grades provider-ready worker prompts and persists a quality report.
    rationale: Provide a repeatable entry point for the final instruction-to-prompt stage.
    action: added
  - id: harbor-capture-flag-stops-before-worker
    source: harbor-worker-prompt-capture-flag
    target: deepswe-worker-prompt-evaluator
    relationship: enables
    description: The Harbor run compiles worker requests through implement-feature and captures their prompts without invoking a coding agent.
    rationale: Evaluate the real handoff while preserving the benchmark agent boundary.
    action: added
  - id: worker-prompt-evaluator-uses-rubric
    source: deepswe-worker-prompt-evaluator
    target: state-data-design-rubric
    relationship: uses
    description: Prompt criteria use solution and verifier anchors plus an explicit absence rule for delivery instructions.
    rationale: Ground prompt-quality judgments in the benchmark task.
    action: added
invariants:
  - id: prompt-capture-never-runs-worker
    action: added
    description: Prompt-capture-only executes the implement-feature prefix through request generation and never calls the coding-agent provider.
    rationale: Keep prompt evaluation separate from coding performance.
  - id: prompt-request-artifacts-match
    action: added
    description: Captured prompt hashes and request IDs must match the corresponding serialized provider-ready implementation requests.
    rationale: Ensure the evaluated text is the prompt actually prepared for a worker.
  - id: ground-truth-is-evaluator-only
    action: added
    description: DeepSWE solution and verifier references are read only by the post-generation evaluator.
    rationale: Prevent benchmark answers from leaking into prompt generation.
  - id: prompt-positive-findings-require-quotes
    action: added
    description: Positive semantic judgments require exact candidate-prompt quotes, while explicit absence criteria use a deterministic absence check.
    rationale: Keep prompt-quality findings auditable.
guidance:
  - id: capture-then-evaluate-worker-prompts
    action: added
    description: Run Harbor with POWDRR_CAPTURE_WORKER_PROMPTS_ONLY=1, then call evaluate-deepswe-prompt with the task directory and run artifact directory.
    rationale: Measure final worker handoff quality without starting the worker.
