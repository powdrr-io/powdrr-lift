change_id: 821
title: Audit dead paths and design Procedrr-only workflow migration
intent:
  problem: Workflow chat and durable task execution still use a parallel legacy skill-definition interpreter, while static analysis also identified dead code and unreachable branches.
  goal: Define a safe migration to Procedrr-only execution and remove independently verified dead paths without dropping workflow or task capabilities.
