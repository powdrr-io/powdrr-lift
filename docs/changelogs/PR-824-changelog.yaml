schema: https://powdrr.io/schema/changelog-v2
change_id: 824
title: Improve source-faithful worker prompt generation
intent:
  problem: Compiled worker prompts could replace task-relevant source requirements with generic summaries, omit task-scoped context during repair, and treat prompt-only capture as an incomplete implementation that needed repair.
  goal: Preserve exact product-requirement source text in worker objectives, keep task-scoped implementation context intact, and make prompt capture terminate at the captured worker boundary without running repair.
human-decisions: []
structured_files: []
