entities:
  - id: source-faithful-worker-objectives
    type: Capability
    action: added
  - id: prompt-capture-terminal-boundary
    type: Capability
    action: added
  - id: task-scoped-repair-prompt-rendering
    type: Capability
    action: added
  - id: worker-prompt-quality-regression-tests
    type: Test suite
    action: added
entity_relationships:
  - id: source-objective-tests-cover-compiled-objectives
    source: worker-prompt-quality-regression-tests
    target: source-faithful-worker-objectives
    relationship: tests
    description: Regression tests verify that selected instruction source spans are preserved in compiled task objectives.
    rationale: Keep instruction provenance intact from source clauses to worker prompts.
    action: added
  - id: capture-tests-cover-terminal-boundary
    source: worker-prompt-quality-regression-tests
    target: prompt-capture-terminal-boundary
    relationship: tests
    description: Regression tests verify prompt-only capture exits before the repair loop.
    rationale: Measure the generated prompt without implementation execution or repair.
    action: added
invariants:
  - id: product-objective-uses-selected-source-spans
    action: added
    description: A compiled code-task objective preserves exact source text for its selected product instruction clauses and excludes unselected workflow instructions.
    rationale: Keep generated prompts grounded in user requirements without hard-coded formatting-based process detection.
  - id: prompt-capture-stops-at-worker-prompt
    action: added
    description: Capture-only runs return after the worker prompt is captured and do not invoke implementation repair or focused validation.
    rationale: Ensure prompt evaluation observes one real worker prompt rather than downstream recovery prompts.
  - id: repairs-preserve-task-context
    action: added
    description: When repairing a code task, the prompt uses the task-specific objective and acceptance criteria instead of replaying unrelated feature context.
    rationale: Keep recovery work bounded to the selected implementation task.
guidance:
  - id: recover-requirements-by-source-span
    action: added
    description: Use instruction-ledger source spans associated with selected product obligations when constructing a worker objective; do not infer process directions from newline or phrase formatting.
    rationale: Preserve full source requirements and avoid brittle text heuristics.
  - id: evaluate-prompt-capture-at-agent-boundary
    action: added
    description: Run prompt-only capture through worker-prompt compilation and stop before execution or repair when evaluating instruction-to-prompt quality.
    rationale: Isolate prompt-generation quality from coding-agent behavior.
