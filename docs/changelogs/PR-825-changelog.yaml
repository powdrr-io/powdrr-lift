schema: https://powdrr.io/schema/changelog-v2
change_id: 825
title: Add normative clarification defaults policy
intent:
  problem: Unattended benchmark runs cannot answer clarification questions, while silently guessing would hide ambiguity and weaken source-faithful designs.
  goal: Preserve explicit human clarification as the default while allowing unattended runs to proceed with recorded, validated, provenance-aware conservative defaults.
