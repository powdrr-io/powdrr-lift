schema: https://powdrr.io/schema/changelog-v2
change_id: 851
title: Speed up instruction classification with concurrency and Jev
intent:
  problem: The instruction design interview waits for each independent clause classification to finish before starting the next one.
  goal: Reduce classification wall time with bounded concurrency and route high-confidence exception and temporal-scope decisions through Jev while preserving conservative fallback behavior.
human-decisions: []
structured_files: []
files:
  - path: docs/procedrr/skill-definitions/design-interview.yaml
    type: modified
    span: {start_line: 146, end_line: 146}
    summary: Allow up to four independent clause classifications in flight.
    rationale: Overlap model latency without changing individual prompts or decision schemas.
    related: {entities: [bounded-foreach-judgments], invariants: [parallel-judgment-order-preserved]}
  - path: src/procedrr/parser.py
    type: modified
    span: {start_line: 860, end_line: 860}
    summary: Recognize the for-each parallelism setting.
    rationale: Validate the runtime concurrency declaration as part of the workflow definition.
    related: {entities: [foreach-parallelism-validation]}
  - path: src/procedrr/parser.py
    type: modified
    span: {start_line: 1503, end_line: 1523}
    summary: Bound parallelism to one through thirty-two workers and restrict it to for-each loops.
    rationale: Reject invalid or unsupported concurrency settings before execution.
    related: {entities: [foreach-parallelism-validation], invariants: [parallel-judgment-order-preserved]}
  - path: src/procedrr_evaluator/evaluator.py
    type: modified
    span: {start_line: 13, end_line: 13}
    summary: Add a bounded thread pool for independent judge calls.
    rationale: Run classifier requests concurrently while leaving prompt construction unchanged.
    related: {entities: [bounded-foreach-judgments]}
  - path: src/procedrr_evaluator/evaluator.py
    type: modified
    span: {start_line: 725, end_line: 802}
    summary: Execute judge-only for-each bodies concurrently with isolated iteration state and ordered collection.
    rationale: Preserve per-clause decisions and deterministic outputs while overlapping provider calls.
    related: {entities: [bounded-foreach-judgments], invariants: [parallel-judgment-order-preserved]}
  - path: src/powdrr_lift/workrr/jev_classifier.py
    type: added
    span: {start_line: 1, end_line: 158}
    summary: Route selected semantic classifiers through Jev at high confidence and fall back to the configured classifier otherwise.
    rationale: Apply Jev where the existing comparison is strongest while keeping uncertain and unsupported decisions on the established provider.
    related: {entities: [jev-semantic-classifier], invariants: [jev-conservative-fallback]}
  - path: src/powdrr_lift/workrr/feature_endpoint.py
    type: modified
    span: {start_line: 104, end_line: 104}
    summary: Import the Jev semantic classifier adapter.
    rationale: Connect the Jev classifier to the design-interview runtime.
    related: {entities: [jev-semantic-classifier]}
  - path: src/powdrr_lift/workrr/feature_endpoint.py
    type: modified
    span: {start_line: 469, end_line: 469}
    summary: Construct the Jev classifier wrapper around the configured planning client.
    rationale: Retain planning as the fallback provider.
    related: {entities: [jev-semantic-classifier], invariants: [jev-conservative-fallback]}
  - path: src/powdrr_lift/workrr/feature_endpoint.py
    type: modified
    span: {start_line: 472, end_line: 472}
    summary: Use the classifier wrapper for the design-interview transport.
    rationale: Route qualifying source decisions through Jev.
    related: {entities: [jev-semantic-classifier]}
  - path: src/powdrr_lift/workrr/feature_endpoint.py
    type: modified
    span: {start_line: 480, end_line: 480}
    summary: Use the classifier wrapper for configured planning judges.
    rationale: Apply semantic decision routing to judge calls.
    related: {entities: [jev-semantic-classifier]}
  - path: tests/test_jev_classifier.py
    type: added
