    summary: Cover Jev routing, confidence fallback, and provider scope.
    rationale: Verify only qualified high-confidence semantic decisions use Jev.
    related: {entities: [jev-semantic-classifier], invariants: [jev-conservative-fallback]}
  - path: tests/test_procedrr.py
    type: modified
    span: {start_line: 633, end_line: 633}
    summary: Assert the design interview opts into four-way clause classification.
    rationale: Keep the speedup configuration explicit and covered by workflow tests.
    related: {entities: [parallel-judgment-tests]}
  - path: tests/test_procedrr.py
    type: modified
