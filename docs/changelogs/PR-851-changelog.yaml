    rationale: Guard the behavior and result contract of concurrent clause classification.
    action: added
invariants:
  - id: parallel-judgment-order-preserved
    action: added
    description: Parallel judge-only for-each iterations collect outputs and emit events in source item order, with each iteration receiving an isolated state mapping.
    rationale: Keep classification results and event traces deterministic while requests overlap.
  - id: jev-conservative-fallback
    action: added
    description: Jev is used only for has_exception and temporal_scope when confidence is at least 0.98; missing credentials, failures, unsupported decisions, and lower confidence use the configured classifier.
    rationale: Restrict Jev routing to decisions with the strongest measured agreement and preserve fallback for uncertain results.
