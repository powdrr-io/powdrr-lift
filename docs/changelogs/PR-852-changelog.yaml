invariants:
  - id: jev-conservative-fallback
    action: added
    description: Jev handles only has_exception and temporal_scope decisions when confidence is at least 0.98; missing credentials, failures, unsupported values, and lower confidence use the configured planning provider.
    rationale: Limit live routing to high-confidence outputs and preserve the current provider as fallback.
