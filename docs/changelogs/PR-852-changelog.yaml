  - path: src/powdrr_lift/workrr/jev_classifier.py
    type: added
    span: {start_line: 1, end_line: 158}
    summary: Route high-confidence has_exception and temporal_scope decisions through Jev and fall back otherwise.
    rationale: Use Jev for the source classifier kinds with the strongest exploratory agreement while preserving existing behavior for uncertain outputs.
    related: {entities: [jev-semantic-classifier], invariants: [jev-conservative-fallback]}
  - path: tests/test_jev_classifier.py
    type: added
    span: {start_line: 1, end_line: 74}
    summary: Test Jev decision routing, confidence fallback, and provider scope.
    rationale: Guard the confidence threshold and fallback behavior.
