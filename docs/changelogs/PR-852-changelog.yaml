schema: https://powdrr.io/schema/changelog-v2
change_id: 852
title: Route qualified semantic decisions through Jev
intent:
  problem: Selected semantic source classifications currently use the configured planning provider even when Jev returns a high-confidence typed decision.
  goal: Route the best-qualified exception and temporal-scope decisions through Jev while preserving the configured provider as a fallback.
human-decisions: []
structured_files: []
