  - id: classifier-provider-routing
    action: added
    description: Every classify_one judge in design-interview uses provider jev; construct_one generation and exact source-span extraction remain on planning.
    rationale: Route classification decisions to Jev while preserving the provider for generative work.
  - id: offline-test-fixtures
    action: added
    description: Deterministic end-to-end tests remove Jev API credentials so fixtures never issue billable requests.
    rationale: Keep test outcomes repeatable and independent of workstation credentials.
