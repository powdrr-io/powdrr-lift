schema: https://powdrr.io/schema/changelog-v2
change_id: 854
title: Route all design-interview classifiers through Jev
intent:
  problem: All design-interview classifier judges currently use the planning model despite Jev being available for typed choices.
  goal: Route every classify_one decision in the design interview through Jev while leaving generation and evidence-verification work on the planning model.
