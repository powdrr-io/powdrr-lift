  - path: docs/current/execute-proposed-pr-live-llm-scenarios.md
    type: modified
    span: {start_line: 52, end_line: 57}
    summary: Document the fixture extraction script.
    rationale: Keep scenario authoring instructions aligned with the new script entry point.
    related: {entities: [workflow-fixture-script]}
  - path: docs/plans/workflow-definition-iteration.md
    type: modified
    span: {start_line: 350, end_line: 365}
