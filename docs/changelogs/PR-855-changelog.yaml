    related: {entities: [script-tool-tests]}
  - path: tests/test_workflow_error_analysis.py
    type: modified
    span: {start_line: 6, end_line: 10}
    summary: Import diagnostic analyzer tests from the scripts directory.
    rationale: Keep test coverage aligned with the analyzer relocation.
    related: {entities: [script-tool-tests]}
  - path: tests/test_workflow_scenario.py
    type: modified
    span: {start_line: 39, end_line: 58}
    summary: Exercise replay-fixture extraction through its standalone script.
    rationale: Keep fixture extraction out of the product CLI.
    related: {entities: [script-tool-tests]}
  - path: tests/test_cli.py
    type: modified
    span: {start_line: 335, end_line: 381}
    summary: Exercise exchange diff through its standalone script.
    rationale: Keep transcript-diff testing aligned with its new entry point.
    related: {entities: [script-tool-tests]}
  - path: tests/test_module_boundaries.py
    type: modified
    span: {start_line: 139, end_line: 144}
    summary: Assert trial and error-analysis modules stay outside the runtime package.
    rationale: Prevent developer harnesses from returning to the shipped package.
    related: {entities: [script-tool-tests]}
  - path: docs/agent-feature-e2e.md
