schema: https://powdrr.io/schema/changelog-v2
change_id: 859
title: Fix local DeepSWE runner setup and record instruction audit findings
intent:
  problem: Local Python DeepSWE runs were blocked by an outdated adapter revision and pip user installs failing in virtual environments, while the instruction audit did not preserve task coverage and failure evidence.
  goal: Make the Pier adapter install dependencies in both system Python and virtual environments, and maintain a sourced catalog of Python task instruction patterns and observed run failures.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/integrations/harbor/_env.py
    type: modified
    span: {start_line: 5, end_line: 21}
    summary: Add a shell command builder that selects pip's user install mode only for system Python.
    rationale: DeepSWE task images may activate virtual environments where pip rejects --user.
  - path: src/powdrr_lift/integrations/harbor/powdrr_agent.py
    type: modified
    span: {start_line: 9, end_line: 12}
    summary: Import the environment-aware pip command builder.
    rationale: Keep package-install command construction in a dependency-free helper.
  - path: src/powdrr_lift/integrations/harbor/powdrr_agent.py
    type: modified
    span: {start_line: 63, end_line: 67}
    summary: Use the environment-aware installer for Powdrr and MiniSWE build steps.
    rationale: Allow Pier's generated Dockerfile to install packages into task image virtual environments.
  - path: src/powdrr_lift/integrations/harbor/powdrr_agent.py
    type: modified
    span: {start_line: 82, end_line: 87}
    summary: Use the environment-aware installer for the Powdrr package build step.
    rationale: Allow Pier's generated Dockerfile to install Powdrr into task image virtual environments.
  - path: src/powdrr_lift/integrations/harbor/powdrr_agent.py
    type: modified
    span: {start_line: 134, end_line: 139}
    summary: Use the environment-aware installer for runtime installation of Powdrr.
    rationale: Keep runtime installation consistent with Pier build-time installation.
  - path: src/powdrr_lift/integrations/harbor/powdrr_agent.py
    type: modified
    span: {start_line: 144, end_line: 149}
    summary: Build the conditional MiniSWE runtime installation command with the environment-aware installer.
    rationale: Support task containers whose Python interpreter runs in a virtual environment.
  - path: src/powdrr_lift/integrations/harbor/powdrr_agent.py
    type: modified
    span: {start_line: 154, end_line: 154}
    summary: Execute the conditional installer command when MiniSWE is unavailable.
    rationale: Keep runtime fallback installation behavior intact.
  - path: tests/test_harbor_env.py
    type: modified
    span: {start_line: 5, end_line: 8}
    summary: Import the new installer command helper for focused unit coverage.
    rationale: Keep adapter installation behavior testable without importing Pier.
  - path: tests/test_harbor_env.py
    type: modified
    span: {start_line: 19, end_line: 29}
    summary: Test the generated pip command's system-Python and virtual-environment branches.
    rationale: Prevent reintroducing the --user failure in task images with virtual environments.
  - path: docs/harbor/deepswe-python-instruction-audit.md
    type: added
    span: {start_line: 1, end_line: 154}
    summary: Catalog all Python DeepSWE tasks, capability areas, local runs, and observed prompt-generation blockers.
    rationale: Keep run evidence distinct from hypotheses about instruction clarity and guide broader follow-up coverage.
entities:
  - id: harbor-pip-install-command
    type: Function
    action: added
  - id: harbor-environment-flag-tests
    type: Test suite
    action: modified
  - id: deepswe-python-instruction-audit
    type: Design doc
    action: added
entity_relationships:
  - id: installer-tests-cover-command-builder
    source: harbor-environment-flag-tests
    target: harbor-pip-install-command
    relationship: tests
    description: The existing Harbor environment test suite asserts both installation branches emitted by the command builder.
    rationale: Preserve correct installation behavior for system Python and virtual environments.
    action: added
invariants:
  - id: pip-user-install-only-for-system-python
    action: added
    description: Adapter pip commands use --user only when Python is not running inside a virtual environment.
    rationale: Install dependencies into the active interpreter without pip rejecting user-site installs in virtual environments.
  - id: python-task-results-require-instruction-processing-evidence
    action: added
    description: A local task run is not reported as prompt-generation evidence unless the instruction reaches prompt creation and the prompt artifact is inspected.
    rationale: Distinguish setup failures and semantic compilation failures from completed prompt generation.
guidance:
  - id: resume-local-python-audit-after-adapter-fix
    action: added
    description: Continue the local audit with fresh Pier roots and record the generated worker prompt, attempt status, validation profile, and verifier result for each task.
    rationale: Build a broad capability catalog from observed task runs rather than instruction summaries alone.
