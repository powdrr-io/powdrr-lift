invariants:
  - id: jev-call-observability
    action: added
    description: Each JEV invocation emits a started event and then a response and accepted event or a fallback event, all sharing a request ID; skipped calls report a reason. Logs omit prompts, response content, and credentials.
    rationale: Distinguish skipped calls, attempted requests, received responses, accepted classifications, and fallback behavior in Pier logs.
  - id: shared-uv-cache
    action: added
    description: Temporary workflow scenarios use uv's persistent default cache unless the caller explicitly sets UV_CACHE_DIR.
    rationale: Reuse dependency artifacts between scenario runs instead of writing them inside a deleted temporary workspace.
