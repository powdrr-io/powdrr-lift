schema: https://powdrr.io/schema/changelog-v2
change_id: 860
title: Make JEV calls visible and reuse uv's shared cache
intent:
  problem: Pier runs cannot distinguish successful JEV calls from silent fallback, and isolated workflow scenarios create disposable uv caches.
  goal: Log correlated JEV call lifecycle events and use uv's persistent default cache for isolated scenarios.
