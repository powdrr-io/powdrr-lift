schema: https://powdrr.io/schema/changelog-v2
change_id: 887
title: Correct feature candidates against proposed Structrr diffs
intent:
  problem: The implementation flow did not compare its proposed Structrr diff against a bootstrap of the completed source tree or use mismatches to guide repairs.
  goal: Checkpoint and bootstrap the candidate, compare its actual structure with the proposal, make up to two focused corrections in the existing coding-agent session, then continue with the final review while retaining any remaining differences as evidence.
