schema: https://powdrr.io/schema/changelog-v2
change_id: 887
title: Compare feature candidates against proposed Structrr diffs
intent:
  problem: The implementation flow reviewed its proposed diff and final source changes through separate paths without bootstrapping the completed candidate and comparing the two.
  goal: Checkpoint the candidate, bootstrap its final structure, and require a source-derived comparison to account for every proposed structural operation before accepting the implementation.
