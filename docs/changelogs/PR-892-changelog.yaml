entity_relationships:
  - id: replay-reuses-saved-binding-evidence
    type: consumes
    source: repository-binding-replay
    target: repository-subject-binding
    action: added
    description: The replay subcommand reuses saved candidate sets and classifier results to evaluate deterministic binding behavior without new model calls.
  - id: binding-tests-cover-ambiguity
    type: verifies
    source: subject-binding-regression-tests
    target: repository-subject-binding
