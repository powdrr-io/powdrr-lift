invariants:
  - id: uncertain-candidates-never-create-bindings
    action: added
    description: An unresolved candidate judgment remains explicitly uncertain and cannot be selected as the repository subject.
    rationale: Design generation should retain unresolved links without inventing repository identity or aborting the run.
  - id: shared-generic-names-require-disambiguation
    action: added
    description: Multiple candidates with the same generic symbol name do not all become exact subject matches solely from that shared name.
    rationale: Common methods such as __str__ need qualified source or relationship evidence to distinguish their owners.
