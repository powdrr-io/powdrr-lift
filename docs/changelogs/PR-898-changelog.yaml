schema: https://powdrr.io/schema/changelog-v2
change_id: 898
title: Make product implementation extend the shared design stage
intent:
  problem: Product implementation began with validation setup before the design-only prompt and diff were compiled, so the two modes did not share the same initial prompt-building path.
  goal: Run the same design interview, initial Structrr diff, and diff-backed worker prompt first in both modes, then continue product-specific readiness checks and implementation steps.
