schema: https://powdrr.io/schema/changelog-v2
change_id: 903
title: Preserve source scope in semantic classification
intent:
  problem: Split instruction clauses can lose the original sentence that disambiguates their subject or scope, and behavior extraction can omit source-stated qualifiers.
  goal: Give semantic classifiers bounded original-sentence context while keeping each target proposition explicit, bind that context into decision identity, and preserve scope-bearing phrases in extracted behavior.
