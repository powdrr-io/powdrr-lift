schema: https://powdrr.io/schema/changelog-v2
change_id: 904
title: Classify source semantic dimensions selectively
intent:
  problem: Source clauses can mention copying, mutation propagation, object identity, persistence boundaries, or argument presence without those details reaching the worker prompt; downstream scenario generation can then guess or repeat them as guarantees.
  goal: Classify only semantic dimensions suggested by the source, preserve explicit values and source gaps through the behavior contract, and require an explicit assumption before filling a material gap.
human-decisions: []
structured_files: []
