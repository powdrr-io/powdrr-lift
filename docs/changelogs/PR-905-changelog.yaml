schema: https://powdrr.io/schema/changelog-v2
change_id: 905
title: Preserve accepted semantic decisions in behavior scenarios
intent:
  problem: Scenario generation can replace classifier decisions with assumptions or
    scenario-specific applicability, obscuring what the instruction actually stated
    and repeating derived conclusions as source facts.
  goal: Carry source semantic decisions unchanged into behavior scenarios, represent
    applicability and unresolved status separately, and validate scenario output against
    the accepted classifier result.
human-decisions: []
