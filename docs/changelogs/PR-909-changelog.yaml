schema: https://powdrr.io/schema/changelog-v2
change_id: 909
title: Forward classifier credentials and allow provider egress
intent:
  problem: Harbor's isolated task container cannot reach JEV, and the Powdrr subprocess does not receive JEV or Tavily credentials, causing silent classifier fallback during prompt generation. Scenario generation also echoes classifier-owned semantic dimensions, and its output can fail validation even when the accepted contract already contains the authoritative decisions.
  goal: Make clean benchmark captures exercise the intended classifier path and preserve accepted semantic decisions deterministically through scenario generation.
