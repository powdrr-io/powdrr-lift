schema: https://powdrr.io/schema/changelog-v2
change_id: 914
title: Separate uncertainty policy from benchmark mode
intent:
  problem: Normative defaults are coupled to Harbor benchmark mode, whose other behaviors are unsuitable for ordinary headless feature execution.
  goal: Make clarification and normative-default handling explicit in the feature flow while preserving benchmark-specific execution behavior.
