invariants:
  - id: paraphrases-preserve-base-gold
    action: altered
    description: A paraphrase keeps its source case's target proposition and gold decisions; a contrast must change at least one expected decision.
  - id: prompt-rubric-quotes-anchor-the-claim
    action: added
    description: Each prompt quality criterion uses a source excerpt that directly states the behavior being evaluated.
guidance:
  - id: prompt-coverage-is-not-solution-success
    action: added
    description: Prompt-only judge coverage measures the presence and consistency of rubric behaviors in worker prompts; it does not establish that a coding worker will implement them.
