schema: https://powdrr.io/schema/changelog-v2
change_id: 917
title: Capture semantic prompt quality baseline
intent:
  problem: The expanded semantic case generator had not been exercised against a real corpus, and the three benchmark prompts had not been scored together against source-anchored criteria.
  goal: Preserve the reviewed case expansion and prompt-only baseline, fix candidate normalization uncovered by the run, and ensure the skrub rubric evaluates exact source behaviors.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/workrr/semantic_prompt_variants.py
    type: modified
    span: {start_line: 55, end_line: 56}
    summary: Normalize equivalent model kind labels, retain base gold meaning for paraphrases, and reject unchanged candidates or incomplete contrasts.
    rationale: Prevent semantically invalid proposals and false rejections from model-specific label wording.
  - path: src/powdrr_lift/workrr/semantic_prompt_variants.py
    type: modified
    span: {start_line: 95, end_line: 97}
    summary: Preserve the original target proposition for paraphrase variants and use reviewer-confirmed targets for contrasts.
    rationale: Keep generated paraphrases from drifting away from their parent meaning.
  - path: src/powdrr_lift/workrr/semantic_prompt_variants.py
    type: modified
    span: {start_line: 133, end_line: 139}
    summary: Specify exact candidate kind labels and require changed source wording.
    rationale: Reduce avoidable model response variation and unchanged candidates.
  - path: src/powdrr_lift/workrr/semantic_prompt_variants.py
    type: modified
    span: {start_line: 171, end_line: 171}
    summary: Ask the reviewer to return a contrast target proposition.
    rationale: Require an explicit semantic claim before accepting a contrast.
  - path: src/powdrr_lift/workrr/semantic_prompt_variants.py
    type: modified
    span: {start_line: 219, end_line: 226}
    summary: Reject unchanged source wording and contrasts without a reviewer target proposition.
    rationale: Prevent variants that do not exercise the intended decision boundary.
  - path: src/powdrr_lift/workrr/semantic_prompt_variants.py
    type: modified
    span: {start_line: 228, end_line: 228}
    summary: Return an explicit rejection reason when a contrast lacks its target proposition.
    rationale: Keep invalid candidate feedback actionable.
  - path: src/powdrr_lift/workrr/semantic_prompt_variants.py
    type: modified
    span: {start_line: 259, end_line: 269}
    summary: Normalize known paraphrase and contrast kind aliases.
    rationale: Accept semantically equivalent model labels without weakening review rules.
  - path: tests/test_semantic_prompt_cases.py
    type: modified
    span: {start_line: 239, end_line: 239}
    summary: Cover equivalent kind labels, paraphrase gold preservation, and unchanged-source rejection.
    rationale: Keep the live-run failure modes covered by deterministic regression tests.
  - path: tests/test_semantic_prompt_cases.py
    type: modified
    span: {start_line: 244, end_line: 244}
    summary: Use the candidate's exact source wording as review evidence.
    rationale: Ensure evidence validation exercises the same quoting rule used for generated variants.
  - path: tests/test_semantic_prompt_cases.py
    type: modified
    span: {start_line: 256, end_line: 257}
    summary: Return a reviewer-confirmed target for contrast candidates.
    rationale: Keep test reviewers aligned with the contrast acceptance contract.
  - path: tests/test_semantic_prompt_cases.py
    type: modified
    span: {start_line: 287, end_line: 356}
    summary: Cover paraphrase gold preservation, kind aliases, and unchanged-source rejection.
    rationale: Keep the live-run failure modes covered by deterministic regression tests.
  - path: docs/evaluations/deepswe-skrub-duration-encoding.yaml
    type: modified
    span: {start_line: 58, end_line: 58}
    summary: Separate duration dtype support, non-duration rejection, and selector behavior into exact source-anchored criteria.
    rationale: Ensure prompt evaluation evidence is checked against the behavior each criterion actually names.
  - path: docs/evaluations/deepswe-skrub-duration-encoding.yaml
    type: modified
    span: {start_line: 60, end_line: 75}
    summary: Define separate source excerpts and verifier tests for type support, rejection, and selector behavior.
    rationale: Avoid false missing-evidence findings caused by a rubric quote unrelated to its criterion.
  - path: docs/evaluations/semantic-prompt-baseline-2026-10-04/README.md
