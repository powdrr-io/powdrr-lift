schema: https://powdrr.io/schema/changelog-v2
change_id: 918
title: Add evidence-based run reports
intent:
  problem: Feature run evidence is spread across artifacts, and handled failures may lack a final summary.
  goal: Write a versioned JSON report and deterministic Markdown projection for completed and handled unsuccessful runs.
