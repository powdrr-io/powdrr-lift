schema: https://powdrr.io/schema/changelog-v2
change_id: 927
title: Bound headless feature run duration and repairs
intent:
  problem: Headless feature runs can continue indefinitely, and focused candidate
    repairs use a fixed retry count that callers cannot tune.
  goal: Bound overall execution time, expose repair limits, and report configured
    limits and timeout outcomes.
