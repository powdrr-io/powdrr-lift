schema: https://powdrr.io/schema/changelog-v2
change_id: 935
title: Trace failing Procedrr provider calls
intent:
  problem: Procedrr recorded completed workflow events but omitted failed judge calls and individual provider retry attempts, leaving prompt-generation failures with an unknown stage and no call-level diagnostics.
  goal: Persist linked, prompt-safe telemetry for failed judges and provider attempts so each failure can be traced to its workflow path, judge output, and retry outcome.
human-decisions: []
structured_files: []
files:
  - path: src/procedrr_evaluator/evaluator.py
    type: modified
    span: {start_line: 11, end_line: 12}
    summary: Import hashing and JSON serialization for request trace identifiers.
    rationale: Generate stable request IDs without recording prompt contents.
  - path: src/procedrr_evaluator/evaluator.py
    type: modified
    span: {start_line: 657, end_line: 659}
    summary: Compute a hashed trace ID for each judge request.
    rationale: Correlate judge failures with provider attempt records.
  - path: src/procedrr_evaluator/evaluator.py
    type: modified
    span: {start_line: 661, end_line: 684}
    summary: Record failed judge events with workflow path, provider, output name, and a hashed trace ID.
    rationale: Preserve the identity of a failed classification call before propagating its exception.
  - path: src/powdrr_lift/workrr/procedrr.py
    type: modified
    span: {start_line: 8, end_line: 8}
    summary: Import callable telemetry typing from collections.abc.
    rationale: Type the optional provider-attempt telemetry callback.
  - path: src/powdrr_lift/workrr/procedrr.py
    type: modified
    span: {start_line: 144, end_line: 144}
    summary: Accept an optional telemetry sink in the Procedrr provider adapter.
    rationale: Allow endpoint runs to persist attempt-level provider diagnostics.
  - path: src/powdrr_lift/workrr/procedrr.py
    type: modified
    span: {start_line: 152, end_line: 152}
    summary: Retain the provider telemetry sink on the adapter.
    rationale: Emit retry records from the provider call boundary.
  - path: src/powdrr_lift/workrr/procedrr.py
    type: modified
    span: {start_line: 164, end_line: 164}
    summary: Pass the call trace ID through the provider attempt loop.
    rationale: Link every retry attempt to its judge call.
  - path: src/powdrr_lift/workrr/procedrr.py
    type: modified
    span: {start_line: 167, end_line: 167}
    summary: Start timing each provider attempt.
    rationale: Record provider latency per request attempt.
  - path: src/powdrr_lift/workrr/procedrr.py
    type: modified
    span: {start_line: 169, end_line: 169}
    summary: Capture successful provider completions for telemetry.
    rationale: Distinguish successful calls from failed or retried calls.
  - path: src/powdrr_lift/workrr/procedrr.py
    type: modified
    span: {start_line: 172, end_line: 175}
    summary: Emit telemetry for successful provider attempts.
    rationale: Provide a final outcome record for each completed provider request.
  - path: src/powdrr_lift/workrr/procedrr.py
    type: modified
    span: {start_line: 177, end_line: 187}
    summary: Classify each provider failure and record whether it will be retried.
    rationale: Make retry decisions visible in the run trace.
  - path: src/powdrr_lift/workrr/procedrr.py
    type: modified
    span: {start_line: 189, end_line: 189}
    summary: Stop retrying once the configured attempt limit is reached.
    rationale: Retain the bounded retry policy while preserving the terminal failure record.
  - path: src/powdrr_lift/workrr/procedrr.py
    type: modified
    span: {start_line: 194, end_line: 221}
    summary: Serialize attempt metadata with trace ID, retry outcome, timing, and model identifiers.
    rationale: Diagnose failing provider calls without storing request messages.
  - path: src/powdrr_lift/workrr/procedrr.py
    type: modified
