    summary: Import a lock for concurrent telemetry writes.
    rationale: Prevent interleaving JSONL event writes from parallel judge calls.
  - path: src/powdrr_lift/workrr/feature_endpoint.py
    type: modified
    span: {start_line: 486, end_line: 486}
    summary: Create a shared lock for Procedrr event writes.
    rationale: Keep concurrent workflow and provider event records intact.
  - path: src/powdrr_lift/workrr/feature_endpoint.py
