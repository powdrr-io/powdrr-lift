schema: https://powdrr.io/schema/changelog-v2
change_id: 952
title: Add typed acceptance criterion wire schema
intent:
  problem: Prompt capture failed when acceptance criteria were returned in the wrong wire shape or duplicated, and discovered validation profiles could cite evidence absent from the validation context.
  goal: Make criterion generation and repair use a bounded typed contract, preserve the persisted representation, and complete an auditable prompt-only capture.
