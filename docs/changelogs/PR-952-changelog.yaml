entities:
  - id: acceptance-criterion-wire-v2
    type: Technical specification
    action: added
  - id: typed-acceptance-criterion-binding
    type: Function
    action: added
  - id: bounded-object-array-output-schema
    type: Static analysis rule
    action: added
entity_relationships: []
invariants:
  - id: generated-and-repaired-criteria-share-one-schema
    description: Acceptance criterion generation and repair use the same bounded object schema, and the binder rejects criteria or assertions encoded as JSON strings.
    action: added
  - id: persisted-criterion-shape-remains-compatible
    description: Wire v2 event descriptions are adapted to the existing persisted event-object representation.
    action: added
  - id: duplicate-criterion-ids-require-identical-content
    description: Identical duplicate criterion IDs are collapsed, while an ID reused for different content is rejected.
    action: added
  - id: prompt-capture-evidence-does-not-imply-quality-gain
    description: The captured prompt evaluation reports zero checkable criteria and unresolved requirements without claiming a prompt-quality improvement.
    action: added
guidance:
  - id: evaluate-captured-worker-prompt
    description: Use the actual indexed provider-ready worker prompt for evaluation and treat implementation-prompt projections as non-authoritative.
    action: added
