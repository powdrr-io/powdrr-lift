schema: https://powdrr.io/schema/changelog-v2
change_id: 977
title: Add SubQ as a fallback classifier provider
intent:
  problem: The design-interview classifier can use Jev but has no typed-decision provider alternative when Jev credentials are unavailable.
  goal: Preserve Jev as the preferred classifier, use SubQ when only its key is configured, and retain planning as the fallback when neither typed-decision provider is configured or available.
human-decisions: []
structured_files: []
