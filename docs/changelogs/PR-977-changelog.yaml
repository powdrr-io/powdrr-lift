entity_relationships:
  - id: provider-selection-uses-typed-decision-client
    type: uses
    source: preferred-decision-provider-selection
    target: typed-decision-classifier-client
    action: added
    description: Provider selection returns Jev when a Jev key exists and otherwise selects SubQ when its key exists.
  - id: subq-tests-verify-provider-selection
    type: verifies
    source: subq-classifier-regression-tests
    target: preferred-decision-provider-selection
    action: added
    description: Regression tests verify Jev-first priority, SubQ fallback selection, and result mapping.
invariants:
  - id: jev-precedes-subq-when-both-keys-exist
    description: Classifier provider selection chooses Jev whenever a supported Jev key is configured, and chooses SubQ only when no Jev key is configured.
    action: added
  - id: typed-provider-absence-uses-planning
    description: When neither Jev nor SubQ credentials are configured, classifier judges continue through the planning client.
    action: added
  - id: subq-results-match-workflow-classifier-schema
    description: SubQ choices are validated against the declared labels and mapped to the existing resolved or unresolved workflow response schema.
    action: added
guidance:
  - id: configure-subq-classifier
    description: Set SUBQ_API_KEY to enable SubQ as the classifier provider when no Jev key is configured; optionally set SUBQ_BASE_URL and SUBQ_MODEL to override its endpoint and model.
    action: added
