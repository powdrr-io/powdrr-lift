    type: modified
    span: {start_line: 2647, end_line: 2647}
    summary: Record the unique slug passed to the repair call.
    rationale: Assert correction request identity independently from proposal identity.
  - path: tests/test_feature_endpoint.py
    type: modified
    span: {start_line: 2686, end_line: 2686}
    summary: Assert the correction request retains its retry-specific slug.
    rationale: Keep the accepted proposal ID separate from request naming.
