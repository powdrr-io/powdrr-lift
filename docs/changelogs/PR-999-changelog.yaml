change_id: 999
title: Guard candidate correction proposal identity
intent:
  problem: Candidate correction retries have unique request slugs, and proposal revalidation must stay bound to the accepted proposal revision.
  goal: Require the accepted proposal revision before candidate correction and cover revalidation when the request slug differs from the proposal ID.
human-decisions: []
structured_files: []
files:
  - path: src/powdrr_lift/workrr/feature_endpoint.py
    type: modified
    span: {start_line: 7198, end_line: 7202}
    summary: Require the accepted proposal revision before starting candidate correction.
    rationale: Ensure a correction cannot fall back to a request slug as its proposal identity.
  - path: tests/test_feature_endpoint.py
    type: modified
    span: {start_line: 88, end_line: 88}
    summary: Import the implementation-phase function for direct proposal-revalidation coverage.
    rationale: Exercise the real revision compilation path rather than only mocking correction dispatch.
  - path: tests/test_feature_endpoint.py
    type: modified
    span: {start_line: 2510, end_line: 2519}
    summary: Give repair-limit scenarios an accepted proposal revision.
    rationale: Model the required accepted proposal state during candidate correction.
  - path: tests/test_feature_endpoint.py
    type: modified
    span: {start_line: 2533, end_line: 2533}
    summary: Capture the unique slug used by each correction attempt.
    rationale: Verify retries remain uniquely identified as requests.
  - path: tests/test_feature_endpoint.py
    type: modified
    span: {start_line: 2539, end_line: 2539}
    summary: Record the request slug passed to the correction phase.
    rationale: Assert request uniqueness independently from proposal identity.
  - path: tests/test_feature_endpoint.py
    type: modified
