schema: https://powdrr.io/schema/changelog-v2
change_id: add_procedrr_step_execution_transcripts
title: Add Procedrr step execution transcripts
intent:
  problem: The requested product behavior is not yet available.
  goal: Add a durable transcript of every Procedrr step execution, recording the step
    identity, inputs, outputs, and outcome in order so an operator can inspect exactly
    what the flow received and produced.
