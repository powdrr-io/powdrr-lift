invariants:
- id: inv-pr-planning-excludes-effect-allocation
  description: The proposed PR planning output contains PR definitions and dependencies
    only; it never contains authoritative effects, effect assignments, or persisted-document
    fields.
  action: added
- id: inv-model-never-transcribes-authoritative-effects
  description: No model response copies or invents authoritative section, id, or action
    triples; the runtime provides and expands those values.
  action: added
- id: inv-effect-allocation-is-total-and-exact
  description: Every authoritative effect is allocated exactly once to a declared proposed
    PR, with no missing, duplicate, unknown, or modified effect.
  action: added
- id: inv-step-output-schema-precedes-mutation
  description: Planning and allocation responses must satisfy their declared machine-checkable
    schemas before handoff recording, compilation, or file mutation begins.
  action: added
- id: inv-pr-document-remains-runtime-owned
  description: Deterministic runtime code alone owns proposed PR schema fields, feature
    ids, effect ordering, YAML serialization, validation, and persistence.
  action: added
- id: inv-validation-result-selects-branch
  description: A successful proposed PR evaluation advances and a failed evaluation returns
    to semantic repair through a runtime-selected branch, without model confirmation.
  action: added
- id: inv-invalid-split-input-does-not-mutate
  description: Invalid planning, allocation, dependency, or effect-equivalence input leaves
    the existing proposed PR specification unchanged.
  action: added
- id: inv-live-harness-isolates-worktree
  description: Live harness execution occurs in an isolated disposable worktree while
    reports and transcripts remain inspectable outside the run tree.
  action: added
- id: allowed-entity-types-only
  description: Architecture specifications may only assign entity types from the entity
    type list supplied to the template generator or validator.
  action: added
- id: architecture-id-must-exist
  description: An implementation specification must reference an architecture specification
    id that exists in the selected architecture specification.
  action: added
- id: architecture-references-must-exist
  description: Any entity or relationship mentioned in an implementation spec must
    exist in the selected architecture specification.
  action: added
- id: current-decisions-only
  description: The current-decisions report must exclude superseded decisions.
  action: added
- id: current-invariants-only
  description: The invariants report must include only the currently active invariants.
  action: added
- id: decision-status-tracking
  description: SQLite must track whether each indexed decision is current or superseded.
  action: added
- id: declared-actions-executable-invariant
  description: Every non-universal action requested by a skill or workflow step is
    present in that step's explicit action contract.
  action: added
- id: default-output-path
  description: Write the snapshot to `.powdrr-lift/state/codebase-state.yaml` when
    no output path is supplied.
  action: added
- id: execution-locality-invariant
  description: Transient context, event history, checkpoints, obligations, evidence,
    and other facts specific to one execution remain under .powdrr and are not promoted
    into shared intent, plans, or tasks unless deliberately authored as a reviewed
    repository change.
  action: added
- id: explicit-supersession
  description: A decision that supersedes an earlier decision must explicitly name
    the decision it replaces.
  action: added
- id: implementation-ids-must-be-unique
  description: Feature ids and decision ids must be globally unique within an implementation
    specification.
  action: added
- id: index-only-source
  description: Build the snapshot from the changelog index and branch metadata rather
    than the live working tree.
  action: added
- id: inv-changelog-required-test-case-reference-valid
  description: Every changelog related.required_test_cases entry must resolve to a
    required_test_cases id in the current proposed PR specifications.
  action: added
- id: inv-evidence-matches-changed-source
  description: Every required test case reference in a changelog must be tied to a
    changed source file span that exists in the branch diff.
  action: added
- id: inv-forward-verbatim
  description: The proxy must forward the OpenAI request path, method, and body without
    altering the payload semantics.
  action: added
- id: inv-human-workflow-prefix-bounded
  description: Human-authored workflow IDs must use configured person-derived prefixes
    of no more than five lowercase ASCII characters.
  action: added
- id: inv-no-interaction-file-log-artifacts
  description: The repository must not contain interaction-file-log proposal or workflow
    artifacts.
  action: added
- id: inv-obligations-block-premature-completion
  description: Open execution obligations must remain visible and may block dependent
    actions, phase transitions, or publication until satisfied.
  action: added
- id: inv-observer-overrides-require-matching-advice
  description: An observer_override action is accepted only when its step or skill
    target exactly matches a pending validated observer recommendation.
  action: added
- id: inv-opaque-resource-id
  description: Resource IDs must not encode parent relationships, versions, status,
    or retry attempts.
  action: added
- id: inv-preserve-streaming
  description: Streamed upstream responses must remain streamed to the client.
  action: added
- id: inv-record-every-exchange
  description: Every successful or failed proxied exchange must be recorded exactly
    once.
  action: added
- id: inv-required-test-cases-exist-in-pr-spec
  description: Every required_test_cases entry in a proposed PR specification must
    have both an id and a description.
  action: added
- id: inv-resource-type-registry-complete
  description: Every durable resource identity and persisted resource reference must
    map to a registered Powdrr resource type.
  action: added
- id: inv-roundtrip-preserves-required-test-cases
  description: Required test case ids must survive parser, template, and index round-trips
    unchanged.
  action: added
- id: inv-single-intent-source
  description: Original user intent should receive one durable source identity and
    be referenced by derived clauses and execution context rather than duplicated
    as new state.
  action: added
- id: inv-typed-resource-reference
  description: Every durable resource reference must identify both its Powdrr resource
    type and opaque resource ID in canonical form.
  action: added
- id: referenced-entities-must-exist
  description: Any entity mentioned in an entity relationship, invariant, or guidance
    item must appear in the entities section.
  action: added
- id: replay-order
  description: Replay changelog documents in order so deleted or removed items disappear
    from the current snapshot.
  action: added
- id: runtime-owns-atomic-step-advancement
  description: An invoke_tool skill step advances after its deterministic pre-step
    is recorded without requiring an LLM confirmation action.
  action: added
- id: shared-intent-ownership-invariant
  description: Typed intent sources, clauses, contracts, and repository behavior rules
    have one versioned repository-owned source of truth; plans and tasks reference
    them by stable IDs instead of copying their wording.
  action: added
- id: shared-workflow-surface
  description: The CLI and MCP surfaces should expose the same template creation and
    validation behavior.
  action: added
- id: system-specification-state-invariant
  description: Requirement and approach items must use added, removed, or supercedes,
    with description and same-section supersedence rules enforced by the validator.
  action: added
- id: unique-changelog-ids
  description: Every decision, entity, relationship, invariant, and guidance id within
    a changelog file must be unique.
  action: added
- id: unique-proposed-pr-ids
  description: Proposed PR ids must not collide with existing PR specification files.
  action: added
- id: universal-actions-implicit-invariant
  description: Every workflow step permits prompt_user and next_step without listing
    either action explicitly.
  action: added
guidance:
- id: guide-plan-before-allocation
  description: Validate the complete ordered proposed PR plan before exposing authoritative
    effects to a separate allocation step.
  action: added
- id: guide-reference-runtime-effect-keys
  description: Let allocation output identify runtime-provided effect entries by an opaque
    positional or stable reference and supply only the target proposed PR id.
  action: added
- id: guide-derive-response-schema-from-step-contract
  description: Build strict provider response schemas from the active action and output
    contract so invalid response shapes are rejected at the exchange boundary.
  action: added
- id: guide-compile-after-both-phases-validate
  description: Invoke proposed PR compilation only after planning and effect allocation
    handoffs have each passed structural and domain validation.
  action: added
- id: guide-route-evaluator-status-directly
  description: Use evaluator return status and structured issues directly in runtime gate
    logic; provide issues as repair context only after the runtime selects the failure branch.
  action: added
- id: guide-harness-malformed-and-valid-cases
  description: Exercise invalid nesting, malformed allocation shapes, unknown PR references,
    incomplete effect coverage, and a valid end-to-end response in the live harness.
  action: added
- id: audit-step-details-against-actions
  description: When editing a skill or workflow template, compare each step's requested
    behavior with its allowed actions and validate the full collection.
  action: added
- id: cli-generation
  description: Use `powdrr-lift codebase-state` to materialize the snapshot file after
    the changelog index is updated.
  action: added
- id: commit-shared-work-products
  description: Commit shared intent, behavior rules, plans, and tasks to the repository
    so every agent and person can inspect and continue them.
  action: added
- id: create-template-first
  description: Generate the system specification template first, then fill in the
    requirements and approach sections.
  action: added
- id: generate-first
  description: Use the template-generation endpoint first, then populate the entities,
    entity relationships, invariants, and guidance sections.
  action: added
- id: guide-classify-identifiers-before-typing
  description: Classify each identifier-bearing field as a Powdrr resource reference,
    local key, or external reference before assigning a type.
  action: added
- id: guide-only-code-fixes
  description: If the plan diff shows a mismatch, change the implementation code instead
    of rewriting the plan or changelog to make the mismatch disappear.
  action: added
- id: guide-recording-format
  description: Store each exchange as a structured record with the request and response
    bodies available for later inspection.
  action: added
- id: guide-runtime-allocates-ids
  description: Runtime code allocates and validates durable IDs; the LLM may refer
    to known IDs but must not invent resource identifiers.
  action: added
- id: guide-setup-env
  description: Configure the client to point at the proxy base URL once, then keep
    using the normal OpenAI or Codex workflow.
  action: added
- id: guide-test-the-evidence-path
  description: Add tests that fail when required test case ids are missing, malformed,
    or disconnected from changed source hunks.
  action: added
- id: guide-use-new-section-first
  description: Add the required_test_cases section to the proposed PR spec before
    wiring changelog validation against it.
  action: added
- id: guide-use-resource-ref
  description: Use one ResourceRef value object and the canonical `<type>:<id>` serialization
    at persistence, CLI, MCP, logging, and prompt boundaries.
  action: added
- id: keep-run-state-local
  description: Keep .powdrr limited to state and history that belong to one execution,
    including materialized progress and transient context.
  action: added
- id: mcp-access
  description: Use `get_codebase_state` when the snapshot is needed through the MCP
    interface.
  action: added
- id: one-template-per-pr
  description: Generate one PR specification template per proposed PR.
  action: added
- id: preserve-architecture-intent
  description: When validation fails, prefer fixes that preserve the intended architecture
    and the implementation plan rather than weakening the rules.
  action: added
- id: preserve-intent
  description: When validation fails, adjust the specification to preserve the intended
    architecture rather than weakening the rules.
  action: added
- id: review-branch-invariants
  description: Call `get_invariants` and assign one subagent per invariant to check
    whether the PR still satisfies it.
  action: added
- id: review-current-decisions
  description: Call `get_current_decisions` and assign one subagent per current decision
    to check whether the PR honors it.
  action: added
- id: review-superseding-decisions
  description: Fail the review if a superseding decision does not explicitly declare
    which previous decision it replaces.
  action: added
- id: separate-workflow-judgment-from-execution
  description: Use LLM steps for semantic judgments and runtime-owned nodes for fully
    declared operations and branches.
  action: added
- id: validate-and-iterate
  description: Run the system specification validator after filling the template and
    revise the spec until it succeeds.
  action: added
features:
- id: feature-split-proposed-pr-planning
  description: Split proposed PR definition from effect allocation into two validated semantic
    workflow phases.
  functional_requirements:
  - The planning phase emits ordered PR ids, intent, justification, and dependency ids only.
  - The allocation phase runs only after the plan validates.
  - The allocation phase assigns every runtime-provided authoritative effect to one planned
    PR without reproducing the effect triple.
  action: added
- id: feature-schema-constrained-workflow-output
  description: Add step-specific machine-checkable response schemas to workflow LLM requests.
  functional_requirements:
  - Planning and allocation schemas reject unknown properties and invalid nesting.
  - Required outputs are enforced before any handoff or document mutation.
  - Shared workflow action validation remains authoritative after response parsing.
  action: added
- id: feature-split-input-pr-compilation
  description: Compile the runtime-owned proposed PR YAML from validated planning, allocation,
    and authoritative-effect inputs.
  functional_requirements:
  - Runtime code owns schema, feature ids, section ordering, and YAML serialization.
  - Compilation preserves current dependency, uniqueness, and effect-equivalence checks.
  - A failed compilation leaves the compatibility document unchanged.
  action: added
- id: feature-deterministic-pr-validation-routing
  description: Route proposed PR validation success and failure using runtime-owned workflow
    transitions.
  functional_requirements:
  - A zero-issue successful evaluation advances automatically.
  - A failed evaluation returns to the responsible semantic phase with structured repair
    context.
  - No LLM confirmation action is required for either branch.
  action: added
- id: feature-live-split-planning-harness
  description: Extend the isolated start-implementing-feature harness to verify the split
    planning pipeline with live provider responses.
  functional_requirements:
  - Invalid planning or allocation response shapes are rejected before mutation.
  - A valid split response compiles and passes deterministic evaluation.
  - Harness reports preserve actionable diagnostics and the last workflow roundtrip.
  action: added
- id: feature-context-graph
  description: Add context endpoints that answer code-relationship questions using
    the indexed graph of code and specs so agents can ask about code used together,
    updated together, and linked to features, decisions, requirements, entities, and
    lines.
  functional_requirements:
  - The platform must answer what code is used together and updated together.
  - The platform must answer what code is related to a feature, decision, requirement,
    or entity.
  - The platform must answer intent and rationale questions for a file, range, or
    line of code.
  - The platform must source answers from the changelog and specification graph, not
    just the source tree.
  action: added
- id: feature-document-families
  description: Add current-state, diff, and issues document families for system, architecture,
    implementation, and proposed-PR specs so the platform can represent the same state
    model across `specify-system`, `specify-architecture`, `specify-implementation`,
    `specify-prs`, `synthesize-system`, `synthesize-architecture`, `synthesize-implementation`,
    and review workflows.
  functional_requirements:
  - The platform must render a current-state document that represents a complete coherent
    snapshot.
  - The platform must render a diff document that can be applied to a parent current
    state.
  - The platform must render an issues document that explicitly records known incoherence.
  - The platform must validate each document family with the appropriate CLI and MCP
    surface.
  action: added
- id: feature-proposed-pr-discovery
  description: Add fuzzy search and direct inspection endpoints for proposed PR specifications
    so the implement-pr workflow can identify, inspect, and validate the right proposal
    before coding.
  functional_requirements:
  - The platform must fuzzy-match proposed PR ids, feature ids, and intent text.
  - The platform must expose a direct inspection endpoint for a proposed PR id or
    number.
  - The platform must validate the selected proposed PR before implementation begins.
  - The implement-pr workflow must inspect every section of the proposed PR before
    and after the code changes.
  action: added
- id: feature-review-workflows
  description: Add review workflows that produce diffs and inspect multiple layers
    of the system for inconsistencies across `review-system`, `review-architecture`,
    `review-implementation`, `review-pr`, and `review-pr-changelog`.
  functional_requirements:
  - Each review skill must produce a diff that describes the review target.
  - Each review skill must surface inconsistencies, weaknesses, and missing links.
  - Review output must inspect the surrounding specification layers, not only the
    changed file.
  - Review output must remain explainable enough for an agent to fix the underlying
    issue.
  action: added
- id: feature-specified-template-workflows
  description: Give each specify skill and `create-pr-changelog` a template-generation
    and validation workflow.
  functional_requirements:
  - Each specify skill must expose a template generator endpoint.
  - Each specify skill must expose a validation endpoint for the filled template.
  - The template instructions must tell the agent how to fill the document before
    validation.
  - The workflow must fail closed until the filled document validates.
  action: added
- id: feature-synthesis-workflows
  description: Add synthesis workflows that derive start state, new state, and diff
    from a parent branch and a PR for `synthesize-system`, `synthesize-architecture`,
    and `synthesize-implementation`.
  functional_requirements:
  - Each synthesize skill must expose a parent-branch current-state endpoint.
  - Each synthesize skill must expose a PR current-state endpoint.
  - Each synthesize skill must expose a diff endpoint.
  - The synthesized diff must be applicable to the parent current state to produce
    the updated current state.
  action: added
- id: feature-unified-packaging
  description: Keep the CLI, MCP, skill set, and install story aligned across macOS,
    Windows, and Linux.
  functional_requirements:
  - The platform must install with a single command on each supported platform.
  - The platform must preserve a Homebrew install path on macOS.
  - The same package content must serve Claude Code, Codex, Aider, Cursor, Antigravity,
    and OpenCode.
  - The CLI and MCP must remain behaviorally aligned through shared core logic.
  action: added
decisions:
- id: decision-separate-plan-from-effect-allocation
  description: Use one model phase for PR decomposition and a later model phase for assigning
    runtime-owned authoritative effects.
  action: added
- id: decision-authoritative-effects-are-input-not-output
  description: Pass authoritative effects as structured deterministic input and prohibit
    the model from returning their section, id, or action values.
  action: added
- id: decision-keep-runtime-owned-compatibility-yaml
  description: Retain the merged compiler-owned proposed PR YAML as the downstream compatibility
    artifact instead of exposing a new model-authored document format.
  action: added
- id: decision-use-provider-and-runtime-validation
  description: Enforce response structure with provider schemas and continue enforcing domain,
    action, and effect-equivalence rules in deterministic runtime code.
  action: added
- id: decision-runtime-owns-validation-branches
  description: Treat evaluator results as control-flow inputs whose next transition is selected
    by runtime gate semantics.
  action: added
- id: dec-interactive-loop
  description: Use an interactive loop to drive the exploration session, with explicit
    end-session detection and error handling that returns to the default prompt.
  action: added
- id: decision-explicit-incoherence
  description: Record intentional incoherence in issues documents instead of hiding
    it behind partial validation.
  action: added
- id: decision-first-class-diffs
  description: Treat diff documents as first-class artifacts rather than opaque implementation
    details.
  action: added
- id: decision-platform-install
  description: Keep the package install story single-command and cross-platform, with
    Homebrew for macOS.
  action: added
- id: decision-shared-surface
  description: Keep the CLI and MCP surfaces mirrored so agents and operators can
    use either one.
  action: added
- id: decision-single-core
  description: Keep rendering, validation, synthesis, and graph query logic in a shared
    core module.
  action: added
- id: interaction-log-location
  description: Store the interaction log in a hidden .powdrr directory with file name
    interaction-log.json.
  action: added
