# This file is read-only and should never be edited by a tool or agent.
schema: https://powdrr.io/schemas/specification-v1
id: system-map-deterministic-proposed-pr-planning
title: Deterministic proposed PR planning system map
requirements:
- id: req-separate-pr-planning-and-effect-allocation
  description: Proposed PR planning and authoritative effect allocation must be separate
    semantic phases with independently validated handoffs.
  state: added
- id: req-authoritative-effects-as-runtime-input
  description: The runtime must provide authoritative section, id, and action effects
    to the allocation phase as structured input so the model never transcribes them.
  state: added
- id: req-machine-checkable-step-output
  description: Each model-owned planning or allocation step must declare a machine-checkable
    output schema that rejects invalid nesting, unknown fields, and malformed assignments
    before mutation.
  state: added
- id: req-deterministic-validation-branching
  description: Proposed PR evaluation results must drive success and repair branches
    in runtime code without asking the model to interpret or confirm the branch.
  state: added
- id: req-preserve-runtime-owned-pr-document
  description: Preserve deterministic ownership of proposed PR YAML structure, persistence,
    and validation while splitting the semantic inputs that feed the compiler.
  state: added
- id: req-preserve-effect-equivalence
  description: The compiled specification must contain each authoritative effect exactly
    once with the same section, id, and action and with one valid proposed PR assignment.
  state: added
- id: req-agent-compatibility
  description: Ensure the produced skills work in at least Claude Code, Codex, Aider,
    Cursor, Antigravity, and OpenCode.
  state: added
- id: req-canonical-skill-bundle
  description: Maintain a canonical set of skill bundles that can be rendered into
    the agent-specific layouts required by Claude Code, Codex, Aider, Cursor, Antigravity,
    and OpenCode.
  state: added
- id: req-cross-platform-cli-mcp
  description: Provide adjoining CLI and MCP tooling that runs on macOS, Windows,
    and Linux without platform-specific behavior leaks into the user workflow.
  state: added
- id: req-shared-validation
  description: Validate generated skill packages, installer metadata, and agent-facing
    outputs before publishing them.
  state: added
- id: req-single-command-install
  description: Make the CLI and MCP installable with a single command on each supported
    platform, including a Homebrew-based install path on macOS.
  state: added
- id: req-upgrade-path
  description: Support repeatable updates so teams can refresh skill bundles and the
    accompanying CLI or MCP without hand-editing every agent installation.
  state: added
approach:
- id: app-typed-pr-planning-contract
  description: Collect ordered proposed PR ids, intent, justification, and dependencies
    in a planning-only output whose schema excludes effect assignments and YAML fields.
  state: added
- id: app-authoritative-effect-pre-step
  description: Add a deterministic pre-step that loads authoritative effects from the
    generated feature artifacts and records them as the allocation step's structured
    runtime-owned handoff.
  state: added
- id: app-typed-effect-allocation-contract
  description: Allocate the runtime-provided authoritative effects to planned PR ids
    in a second schema-constrained model output without reproducing section, id, or action
    values.
  state: added
- id: app-split-input-pr-compiler
  description: Compile the separately validated PR plan and effect allocation together
    with runtime-owned authoritative effects into the existing read-only proposed PR
    document.
  state: added
- id: app-runtime-validation-route
  description: Let evaluator return status and issues to a runtime-owned gate that advances
    on success and returns to the appropriate semantic phase on failure.
  state: added
- id: app-schema-aware-workflow-request
  description: Derive provider response schemas from each workflow step's declared output
    contract while retaining action validation at the shared workflow boundary.
  state: added
- id: app-live-planning-harness
  description: Exercise malformed and valid planning/allocation responses in the isolated
    live harness and surface structured diagnostics without mutating the source checkout.
  state: added
- id: app-agent-adapters
  description: Maintain thin adapters for Claude Code, Codex, Aider, Cursor, Antigravity,
    and OpenCode so each agent can consume the same canonical skill content.
  state: added
- id: app-canonical-authoring
  description: Author each skill once in a canonical source format, then render the
    agent-specific skill files and metadata from that source.
  state: added
- id: app-cli-mcp-parity
  description: Expose the same install, render, and validate actions through both
    the CLI and MCP so agents and operators can use whichever surface is available.
  state: added
- id: app-platform-packaging
  description: Package the CLI and MCP as native-installable artifacts for macOS,
    Windows, and Linux, with the macOS path surfaced through Homebrew.
  state: added
- id: app-validation-gates
  description: Gate publishing on validation that checks the rendered skill bundles,
    the cross-platform installer shape, and the agent compatibility matrix.
  state: added
entities:
- id: start-implementing-feature-skill
  type: Skill
  summary: Workflow contract that plans proposed PRs, allocates effects, validates the
    compiled specification, and instantiates execution workflows.
  rationale: This is the user-facing orchestration surface where the combined semantic
    response must be split into independently verifiable phases.
  action: added
- id: proposed-pr-planning-output
  type: Configuration file
  summary: Schema-constrained semantic output containing only ordered PR records and
    their dependency graph.
  rationale: Isolate creative PR decomposition from deterministic effect discovery and
    allocation.
  action: added
- id: authoritative-effect-handoff
  type: Configuration file
  summary: Runtime-owned structured collection of authoritative effect identities and
    actions loaded from generated feature specifications.
  rationale: Give allocation an exact input without asking the model to copy repository
    identifiers or actions.
  action: added
- id: proposed-pr-effect-allocation-output
  type: Configuration file
  summary: Schema-constrained mapping from authoritative runtime effect references to
    planned proposed PR ids.
  rationale: Keep assignment judgment separate from both PR planning and source-effect
    transcription.
  action: added
- id: pr-specification-core
  type: Module
  summary: Compiler and validator for the runtime-owned proposed PR specification document.
  rationale: Preserve the merged deterministic document design while accepting the new
    split semantic inputs.
  action: added
- id: workflow-chat-agent
  type: Module
  summary: Shared interactive workflow runner that builds requests, validates actions,
    records handoffs, invokes deterministic pre-steps, and applies runtime transitions.
  rationale: This is the integration boundary for response schemas, compiler invocation,
    and deterministic gate routing.
  action: added
- id: workflow-action-validator
  type: Module
  summary: Shared parser and validator for allowed workflow actions and required step outputs.
  rationale: Machine-checkable schemas must complement, not bypass, existing semantic
    workflow action validation.
  action: added
- id: proposed-pr-specification-document
  type: Template file
  summary: Read-only compatibility YAML compiled from the validated plan, allocation,
    and authoritative effect input.
  rationale: Downstream evaluators and workflow instantiation continue to consume the
    existing repository format.
  action: added
- id: start-implementing-feature-live-harness
  type: Module
  summary: Isolated multi-iteration harness for real start-implementing-feature workflow
    runs, transcripts, structured errors, and repair feedback.
  rationale: Live coverage must prove invalid outputs fail before mutation and valid split
    inputs complete deterministically.
  action: added
