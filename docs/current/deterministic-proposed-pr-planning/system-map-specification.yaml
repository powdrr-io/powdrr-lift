entity_relationships:
- id: start-feature-produces-pr-plan
  source: start-implementing-feature-skill
  target: proposed-pr-planning-output
  relationship: produces
  description: The planning phase emits only ordered PR definitions and dependency data.
  rationale: Keep planning independent from authoritative effect allocation.
  action: added
- id: workflow-runtime-provides-authoritative-effects
  source: workflow-chat-agent
  target: authoritative-effect-handoff
  relationship: produces
  description: A deterministic pre-step loads and records authoritative effects as structured
    input for the allocation phase.
  rationale: The runtime can preserve exact repository values without model transcription.
  action: added
- id: effect-allocation-references-authoritative-handoff
  source: proposed-pr-effect-allocation-output
  target: authoritative-effect-handoff
  relationship: references
  description: Allocation selects a planned PR for each runtime-owned effect reference.
  rationale: References retain exact effect identity while the model supplies only assignment
    judgment.
  action: added
- id: effect-allocation-targets-pr-plan
  source: proposed-pr-effect-allocation-output
  target: proposed-pr-planning-output
  relationship: assigns_to
  description: Every authoritative effect reference is assigned to exactly one PR declared
    by the validated plan.
  rationale: Reject unknown PR ids and incomplete or duplicate allocations before compilation.
  action: added
- id: compiler-consumes-split-semantic-inputs
  source: pr-specification-core
  target: proposed-pr-effect-allocation-output
  relationship: consumes
  description: The compiler combines validated planning and allocation outputs with the
    authoritative effect handoff.
  rationale: Preserve deterministic compilation without a monolithic model response.
  action: added
- id: compiler-writes-read-only-pr-document
  source: pr-specification-core
  target: proposed-pr-specification-document
  relationship: produces
  description: The compiler owns schema fields, ordering, effect expansion, validation,
    and YAML serialization.
  rationale: Downstream compatibility does not require model-authored YAML.
