# This file is read-only and should never be edited by a tool or agent.
schema: https://powdrr.io/schemas/specification-v1
id: 2026-08-12
title: Interaction File Logging Architecture Specification
entities:
  - id: interaction-log-writer
    type: Module
    action: added
    summary: Captures and writes all human and LLM interaction inputs and outputs to JSON log files.
    rationale: Ensure every interaction is persisted in JSON format per "interaction-file-logging-capture-all" and "interaction-file-logging--format".
  - id: interaction-log-reader
    type: Module
    action: added
    summary: Reads and retrieves interaction records from JSON log files.
    rationale: Support retrieval and verification of stored interactions per "interaction-file-logging-binary-data" and "interaction-file-logging-zero-size-data".
  - id: binary-data-handler
    type: Module
    action: added
    summary: Encodes and decodes binary data for JSON-safe storage and retrieval.
    rationale: Ensure binary data can be stored and retrieved properly per "interaction-file-logging-binary-data".
modules:
  - id: interaction-log-writer
    action: added
    parent_module: null
    relative_location: src/powdrr_lift/interaction_logging/writer.py
    related_modules:
      - binary-data-handler
    purpose: Write interaction records to per-session timestamped JSON log files in the .powdrr directory per "interaction-file-logging-timestamped-files" and "interaction-file-logging-hidden-directory".
  - id: interaction-log-reader
    action: added
    parent_module: null
    relative_location: src/powdrr_lift/interaction_logging/reader.py
    related_modules:
      - binary-data-handler
    purpose: Read and retrieve interaction records from JSON log files, handling binary and zero-size data per "interaction-file-logging-binary-data" and "interaction-file-logging-zero-size-data".
  - id: binary-data-handler
    action: added
    parent_module: null
    relative_location: src/powdrr_lift/interaction_logging/binary_handler.py
    related_modules: []
    purpose: Encode binary data as JSON-safe strings on write and decode back to binary on read per "interaction-file-logging-binary-data".
tools: []
entity_relationships:
  - id: writer-uses-binary-handler
    source: interaction-log-writer
    target: binary-data-handler
    relationship: depends_on
    description: The log writer delegates binary data encoding to the binary data handler.
    rationale: Binary data must be encoded before JSON serialization per "interaction-file-logging-binary-data".
  - id: reader-uses-binary-handler
    source: interaction-log-reader
    target: binary-data-handler
    relationship: depends_on
    description: The log reader delegates binary data decoding to the binary data handler.
    rationale: Binary data must be decoded after JSON deserialization per "interaction-file-logging-binary-data".
invariants:
  - id: inv-all-interactions-captured
    description: Every human and LLM interaction input and output must be written to the log file.
    rationale: No interaction may be lost per "interaction-file-logging-capture-all".
    related:
      entities:
        - interaction-log-writer
      entity_relationships: []
  - id: inv-binary-data-round-trip
    description: Binary data written to the log must be retrievable in its original form.
    rationale: Binary data integrity must be preserved per "interaction-file-logging-binary-data".
    related:
      entities:
        - binary-data-handler
        - interaction-log-writer
        - interaction-log-reader
      entity_relationships:
        - writer-uses-binary-handler
        - reader-uses-binary-handler
  - id: inv-zero-size-data-handled
    description: Zero-size data must be stored and retrieved without error.
    rationale: Zero-size data is a valid edge case that must not cause failures per "interaction-file-logging-zero-size-data".
    related:
      entities:
        - interaction-log-writer
        - interaction-log-reader
      entity_relationships: []
  - id: inv--format
    description: All log files must be valid JSON.
    rationale: The log format must be JSON per "interaction-file-logging--format".
    related:
      entities:
        - interaction-log-writer
      entity_relationships: []
  - id: inv-per-session-files
    description: Each CLI session must produce its own timestamped log file in the .powdrr directory.
    rationale: Sessions are isolated per "interaction-file-logging-timestamped-files" and "interaction-file-logging-hidden-directory".
    related:
      entities:
        - interaction-log-writer
      entity_relationships: []
guidance:
  - id: guide-use-binary-handler-for-binary-data
    description: Route all binary data through the binary data handler before writing to or reading from the log.
    rationale: Consistent encoding ensures binary data round-trips correctly per "interaction-file-logging-binary-data".
    related:
      entities:
        - binary-data-handler
        - interaction-log-writer
        - interaction-log-reader
      entity_relationships:
        - writer-uses-binary-handler
        - reader-uses-binary-handler
  - id: guide-handle-zero-size-explicitly
    description: Add explicit checks for zero-size data in both the writer and reader to avoid silent failures.
    rationale: Zero-size data must be handled correctly per "interaction-file-logging-zero-size-data".
    related:
      entities:
        - interaction-log-writer
        - interaction-log-reader
      entity_relationships: []
  - id: guide-timestamp-format
    description: Use a consistent timestamp format in log file names to ensure each CLI session gets a unique file.
    rationale: Per-session files require unambiguous timestamps per "interaction-file-logging-timestamped-files".
    related:
      entities:
        - interaction-log-writer
      entity_relationships: []
