# This file is read-only and should never be edited by a tool or agent.
schema: https://powdrr.io/schemas/specification-v1
title: Interaction File Logging Implementation Specification
architecture_id: "2026-08-12"
entities:
  - id: interaction-log-writer
    action: added
    rationale: Add the log writer module to capture and write all human and LLM interaction inputs and outputs to JSON log files per "interaction-file-logging-capture-all" and "interaction-file-logging--format".
  - id: interaction-log-reader
    action: added
    rationale: Add the log reader module to retrieve interaction records from JSON log files per "interaction-file-logging-binary-data" and "interaction-file-logging-zero-size-data".
  - id: binary-data-handler
    action: added
    rationale: Add the binary data handler module to encode and decode binary data for JSON-safe storage and retrieval per "interaction-file-logging-binary-data".
modules:
  - id: interaction-log-writer
    action: added
    relative_location: src/powdrr_lift/interaction_logging/writer.py
    related_modules:
      - binary-data-handler
    purpose: Write interaction records to per-session timestamped JSON log files in the .powdrr directory per "interaction-file-logging-timestamped-files" and "interaction-file-logging-hidden-directory".
  - id: interaction-log-reader
    action: added
    relative_location: src/powdrr_lift/interaction_logging/reader.py
    related_modules:
      - binary-data-handler
    purpose: Read and retrieve interaction records from JSON log files, handling binary and zero-size data per "interaction-file-logging-binary-data" and "interaction-file-logging-zero-size-data".
  - id: binary-data-handler
    action: added
    relative_location: src/powdrr_lift/interaction_logging/binary_handler.py
    purpose: Encode binary data as JSON-safe strings on write and decode back to binary on read per "interaction-file-logging-binary-data".
entity_relationships:
  - id: writer-uses-binary-handler
    action: added
    rationale: The log writer must delegate binary data encoding to the binary data handler before JSON serialization per "interaction-file-logging-binary-data".
  - id: reader-uses-binary-handler
    action: added
    rationale: The log reader must delegate binary data decoding to the binary data handler after JSON deserialization per "interaction-file-logging-binary-data".
features:
  - id: feature-interaction-capture
    action: added
    description: Capture and persist all human and LLM interaction inputs and outputs to per-session JSON log files.
    functional_requirements:
      - All human and LLM inputs and outputs must be written to the log file.
      - Log files must be in JSON format.
      - Each CLI session must produce its own timestamped log file in the .powdrr directory.
  - id: feature-binary-data-handling
    action: added
    description: Store and retrieve binary data in JSON log files without data loss.
    functional_requirements:
      - Binary data must be encoded as JSON-safe strings before writing.
      - Binary data must be decoded back to its original form after reading.
      - Binary data round-trip must preserve data integrity.
  - id: feature-zero-size-data-handling
    action: added
    description: Handle zero-size data inputs and outputs without errors.
    functional_requirements:
      - Zero-size data must be stored without error.
      - Zero-size data must be retrieved without error.
      - Zero-size data must not cause silent failures.
decisions:
  - id: decision--format
    action: added
    description: Use JSON as the log file format for structured, human-readable interaction records.
  - id: decision-hidden-directory
    action: added
    description: Store log files in the hidden .powdrr directory to keep them separate from user-visible files.
  - id: decision-per-session-timestamped-files
    action: added
    description: Append a timestamp to each log file name so each CLI session gets its own file.
  - id: decision-binary-encoding
    action: added
    description: Use base64 encoding for binary data to ensure JSON-safe storage and accurate retrieval.
