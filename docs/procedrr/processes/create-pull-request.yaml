version: 1
name: create-pull-request
description: Publish only the approved implementation files from a clean draft pull-request branch.
inputs:
  - {name: user_request, type: string, required: true}
  - {name: workflow_context, type: object, required: true}
  - {name: files_to_publish, type: array, required: true}
outputs:
  pull_request_url:
    type: string
    minLength: 1
    pattern: ^https?://[^ ]+/pull/[0-9]+$
limits: {llm_activations: 1, tool_calls: 1, context_chars: 12000, context_value_chars: 8000}
steps:
  - operation:
      tool: invoke_tool
      parameters:
        tool: gh
        parameters:
          operation: pr_publish_clean
          files_to_publish: {type: reference, value: files_to_publish}
          base: {type: reference, value: workflow_context.base-branch}
          publication_branch: {type: reference, value: workflow_context.publication-branch}
          title: {type: reference, value: workflow_context.feature-name}
          body: {type: reference, value: workflow_context.populated-pr-description}
          commit_message: {type: reference, value: workflow_context.commit-message}
      returns:
        type: string
        minLength: 1
        pattern: ^https?://[^ ]+/pull/[0-9]+$
      bind: pull_request_url
  - terminal: succeeded
