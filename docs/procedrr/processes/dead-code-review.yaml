version: 1
name: dead-code-review
description: When the user asks whether a pull request leaves dead, obsolete, or unreachable
  code behind. When a pull request may duplicate existing behavior, helpers, configuration,
  tests, or documentation and the redundant path should be identified. When the review must
  report actionable dead-code or duplication findings directly on GitHub as inline pull-request
  comments.
inputs:
- name: user_request
  type: string
  required: true
- name: workflow_context
  type: object
  required: true
limits:
  llm_activations: 260
  tool_calls: 260
  context_chars: 60000
  context_value_chars: 16000
steps:
- specialize:
    process: generate-fragment
    max_steps: 120
    question: "Execute this named workflow for the supplied user request. Treat the embedded\
      \ workflow document as task-specific requirements and preserve its ordering, gates,\
      \ outputs, and user-facing questions. Map its actions to the allowed Procedrr operation\
      \ tools. Replace legacy invoke_skill references with calls to matching declared Procedrr\
      \ processes. Use only current bindings and evidence. Do not invent results or claim\
      \ an operation succeeded without its returned result.\n\nEmbedded workflow document:\n\
      ---\nname: dead-code-review\ninteraction_style: observational_review\nwhen_to_use:\n\
      - When the user asks whether a pull request leaves dead, obsolete, or unreachable code\
      \ behind.\n- When a pull request may duplicate existing behavior, helpers, configuration,\
      \ tests, or\n  documentation and the redundant path should be identified.\n- When the\
      \ review must report actionable dead-code or duplication findings directly on GitHub\n\
      \  as inline pull-request comments.\nsteps:\n- description: Discover the pull request\
      \ and establish the exact change surface.\n  actions: [invoke_tool, edit, yaml_edit,\
      \ read_document]\n  step_type: governed\n  llm_type: long_context\n  details: >-\n \
      \   Inspect the referenced pull request's title, body, labels, commits, complete\n \
      \   diff, changed files, base and head branches, head SHA, review history, and\n   \
      \ current state. Resolve the repository owner and name, the base revision, and\n   \
      \ the current PR revision. Read the complete diff rather than only the changed\n   \
      \ hunks, then inspect surrounding implementations, callers, tests, configuration,\n\
      \    generated files, and documentation. Fetch or compare the base revision when\n \
      \   needed so that code introduced, removed, renamed, or made unreachable by this\n\
      \    PR is distinguished from pre-existing code. Build a ledger of changed symbols,\n\
      \    behavior paths, and candidate obsolete or duplicate artifacts. Do not begin\n \
      \   posting findings until the candidate ledger has evidence from both the diff and\n\
      \    the current repository.\n  tool_invocation_packages: [gh_readonly]\n  tool_invocations:\n\
      \  - tool: shell\n    command:\n    - git\n    - diff\n    - --name-status\n    - <base-sha>\n\
      \    - <head-sha>\n- description: Identify code made dead or duplicative by the pull\
      \ request.\n  actions: [invoke_tool, edit, yaml_edit, read_document]\n  step_type: governed\n\
      \  llm_type: high_reasoning\n  details: >-\n    For every candidate, trace definitions\
      \ to all call sites, imports, registrations,\n    routes, handlers, configuration keys,\
      \ fixtures, tests, generated outputs, and\n    documentation references using repository\
      \ search and the language's available\n    static-analysis conventions. For Python files,\
      \ use the typed\n    `basedpyright-symbol` and `basedpyright-structure` tools to resolve\
      \ symbols\n    and module structure before relying on text matches. Check both sides\
      \ of the\n    diff and relevant history\n    when intent or compatibility is unclear.\
      \ Report a dead-code finding only when\n    the PR makes the code unreachable, leaves\
      \ an obsolete implementation after\n    replacing it, removes its last consumer, or\
      \ strands a test/configuration path.\n    Report a duplication finding only when the\
      \ PR creates or preserves a second\n    implementation of the same behavior and the\
      \ overlap is evidenced by matching\n    callers, inputs, outputs, or invariants. Distinguish\
      \ intentional compatibility\n    shims, public extension points, migrations, feature\
      \ flags, generated code,\n    fallback paths, and test fixtures from accidental leftovers.\
      \ Do not report\n    pre-existing cleanup opportunities, stylistic similarity, speculative\
      \ future\n    maintenance, or a finding that cannot be tied to the current PR. Rank\
      \ each\n    candidate by confidence and impact, and collapse comments that share one\
      \ root\n    cause.\n  tool_invocations:\n  - tool: shell\n    command:\n    - rg\n \
      \   - -n\n    - <symbol-or-behavior-search-pattern>\n    - <repository-paths>\n  - tool:\
      \ shell\n    command:\n    - git\n    - log\n    - --oneline\n    - --follow\n    -\
      \ --\n    - <candidate-path>\n  - tool: basedpyright-symbol\n    command:\n    - query=<candidate-symbol>\n\
      \  - tool: basedpyright-structure\n    command:\n    - path=<candidate-python-file>\n\
      - description: Validate each candidate and prepare precise inline findings.\n  actions:\
      \ [invoke_tool, edit, yaml_edit, read_document]\n  step_type: governed\n  llm_type:\
      \ high_reasoning\n  details: >-\n    Validate the candidate with the narrowest useful\
      \ checks: inspect call-graph or\n    reference results, run the relevant tests or static\
      \ checks, and compare the\n    base and head behavior when a duplicate path is alleged.\
      \ Require concrete\n    evidence such as zero reachable consumers, an old branch left\
      \ beside its new\n    replacement, two active implementations serving the same caller,\
      \ or a test and\n    configuration path that no longer participates in execution. For\
      \ each retained\n    finding record the changed file and smallest changed line to anchor,\
      \ the exact\n    dead or duplicate symbol/path, evidence, user or maintenance impact,\
      \ confidence,\n    and a concise removal or consolidation direction. If the obsolete\
      \ code is not\n    itself changed, select the nearest relevant changed line and explain\
      \ the actual\n    location in the comment. Keep findings scoped to the PR and do not\
      \ propose\n    unrelated cleanup.\n  tool_invocations:\n  - tool: shell\n    command:\n\
      \    - git\n    - diff\n    - <base-sha>\n    - <head-sha>\n    - --check\n  - tool:\
      \ shell\n    command:\n    - rg\n    - --files-with-matches\n    - <candidate-symbol>\n\
      \    - <repository-paths>\n- description: Post every actionable dead-code or duplication\
      \ finding inline.\n  actions: [invoke_tool, edit, yaml_edit, read_document]\n  step_type:\
      \ governed\n  llm_type: simple_task\n  details: >-\n    Check the target PR's existing\
      \ review threads and inline comments before\n    posting. Do not repeat an unresolved\
      \ finding, a resolved finding with the same\n    root cause, or an informational observation.\
      \ Post each retained finding\n    directly to the PR as an inline comment anchored to\
      \ the smallest relevant\n    changed line on the RIGHT side of the current head SHA.\
      \ Start the body with\n    `Dead code:` or `Duplicate implementation:` and include the\
      \ exact symbol or\n    path, concrete evidence, why the PR makes it obsolete or redundant,\
      \ the impact,\n    and a concise fix direction. Use a nearby changed line only when\
      \ the obsolete\n    code is not changed, and include its actual path and line in the\
      \ comment. Do\n    not post speculative cleanup, broad review summaries, praise, or\
      \ duplicate\n    comments. Do not approve, merge, close, label, or modify the pull request's\n\
      \    code as part of this skill.\n  tool_invocations:\n  - tool: shell\n    command:\n\
      \    - gh\n    - api\n    - repos/<owner>/<repo>/pulls/<number>/comments\n    - --paginate\n\
      \  - tool: shell\n    command:\n    - gh\n    - api\n    - repos/<owner>/<repo>/pulls/<number>/comments\n\
      \    - --method\n    - POST\n    - -f\n    - body=<finding>\n    - -f\n    - commit_id=<current-head-sha>\n\
      \    - -f\n    - path=<changed-file>\n    - -F\n    - line=<changed-line>\n    - -f\n\
      \    - side=RIGHT\n- description: Verify the posted review and report the audit result.\n\
      \  actions: [invoke_tool, edit, yaml_edit, read_document]\n  step_type: governed\n \
      \ llm_type: standard_reasoning\n  details: >-\n    Re-read the target PR's inline comments\
      \ after posting and verify every intended\n    finding is attached to the current head\
      \ SHA, changed file, and intended line.\n    Report the PR, base and head revisions,\
      \ files and symbols examined, candidate\n    count, rejected speculative candidates,\
      \ dead-code findings, duplication\n    findings, and comments posted. If no actionable\
      \ findings remain, report that\n    the review completed with zero findings and summarize\
      \ the evidence checked. If\n    GitHub write access or inline anchoring fails, report\
      \ the exact prepared finding\n    and the posting failure; never claim it was posted.\
      \ Never merge the PR or\n    resolve review threads as part of this skill.\n  tool_invocations:\n\
      \  - tool: shell\n    command:\n    - gh\n    - api\n    - repos/<owner>/<repo>/pulls/<number>/comments\n\
      \    - --paginate"
    context:
    - user_request
    - workflow_context
    allowed_tools:
    - edit
    - invoke_tool
    - read_document
    - yaml_edit
    bind: workflow_program
- call:
    fragment: ${workflow_program}
    max_steps: 120
- terminal: succeeded
