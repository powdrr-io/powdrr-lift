version: 1
name: execute-proposed-pr
inputs:
  - {name: task_context, type: object, required: true}
outputs:
  coding_attempt:
    type: object
    required: [passed, changed_paths]
    properties:
      passed: {type: boolean}
      changed_paths: {type: array, items: {type: string}}
      validation: {type: object}
      error: {type: [string, "null"]}
description: >-
  Implement one reviewed plan item with the configured coding agent, run the
  plan's verification command, and complete the durable workflow only after
  implementation changed the repository and validation passed.
limits: {max_epochs: 1, context_chars: 12000, context_value_chars: 4000}
steps:
  - operation:
      tool: invoke_tool
      parameters:
        tool: coding-agent
        parameters: {}
      bind: coding_attempt
  - gate:
      subject: coding_attempt.passed
      equals: true
      on_failure: {terminal: failed}
  - terminal: succeeded
