version: 1
name: finish-pr-prep
description: >-
  Confirm the staged PR scope, discover validation commands from repository
  guidance, run every declared command, and repair failures before succeeding.
inputs:
  - {name: files_to_publish, type: array, required: true}
  - {name: language_labels, type: array, required: true}
outputs:
  validation_results:
    type: array
    items: {type: object}
limits: {llm_activations: 24, tool_calls: 100, context_chars: 20000, context_value_chars: 8000}
steps:
  - operation:
      tool: invoke_tool
      parameters:
        tool: shell
        parameters: {command: [git, status, --short]}
      bind: repository_status_before
  - operation:
      tool: invoke_tool
      parameters:
        tool: git
        parameters: {operation: add, paths: "${files_to_publish}"}
      bind: stage_result
  - gate:
      subject: stage_result.returncode
      equals: 0
      on_failure: {retry: {max_attempts: 1, on_exhausted: failed}}
  - operation:
      tool: invoke_tool
      parameters:
        tool: shell
        parameters: {command: [git, diff, --cached, --name-only]}
      bind: staged_file_names
  - operation:
      tool: invoke_tool
      parameters:
        tool: shell
        parameters: {command: [git, diff, --name-only, main...HEAD]}
      bind: committed_file_names
  - judge:
      kind: construct_one
      question: Does the staged pull-request scope match files_to_publish?
      subject: staged_file_names
      prompt_system: Return only the declared JSON object.
      instructions:
        - Compare staged_file_names and committed_file_names with the exact files_to_publish input.
        - Confirm only when every files_to_publish path is already committed relative to main or staged now, and no unrelated path is staged.
        - A path in committed_file_names is already part of the feature branch and does not need to be staged again.
        - repository_status_before is pre-staging context. Unstaged or untracked paths outside files_to_publish remain excluded from the commit and do not fail this scope check.
        - Name every unexpected staged path or missing intended staged path in findings.
      context: [files_to_publish, repository_status_before, staged_file_names, committed_file_names]
      output:
        name: scope_review
        schema:
          type: object
          required: [confirmed, findings]
          additionalProperties: false
          properties:
            confirmed: {type: boolean}
            findings: {type: array, items: {type: string}}
      validation: {kind: json_schema}
  - gate:
      subject: scope_review.confirmed
      equals: true
      on_failure: {retry: {max_attempts: 1, on_exhausted: failed}}
  - judge:
      kind: construct_one
      question: Which repository validation labels apply to these staged files?
      subject: files_to_publish
      prompt_system: Return only the declared JSON object.
      instructions:
        - Derive every programming-language label from files_to_publish and language_labels.
        - Always include pr-prep so repository-discovered PR validation tools are selected.
        - Do not add labels unsupported by the staged files.
      context: [files_to_publish, language_labels]
      output:
        name: validation_labels
        schema:
          type: object
          required: [labels]
          additionalProperties: false
          properties:
            labels:
              type: array
              minItems: 1
              contains: {const: pr-prep}
              items: {type: string, minLength: 1}
      validation: {kind: json_schema}
  - operation:
      tool: gather_context
      parameters:
        types: [tools]
        filters: {labels: "${validation_labels.labels}"}
      bind: validation_tools
  - attempt:
      id: pr-prep-validation
      max_attempts: 5
      body:
        - for_each:
            snapshot: {name: validation_tools.matches, max_items: 32}
            item_binding: validation_tool
            collect: {binding: validation_results, mode: list, key: id, value: validation_result}
            body:
              - operation:
                  tool: invoke_tool
                  parameters:
                    tool: "${validation_tool.item.validation_action.tool}"
                    parameters: "${validation_tool.item.validation_action.parameters}"
                  bind: validation_result
              - gate:
                  subject: validation_result.returncode
                  equals: 0
                  on_failure: {retry: {max_attempts: 1, on_exhausted: failed}}
      on_failure: {recovery: pr-prep-validation-repair, resume: pr-prep-validation}
  - terminal: succeeded

recoveries:
  pr-prep-validation-repair:
    steps:
      - judge:
          kind: construct_one
          question: What exact source repairs address this failed validation?
          subject: failure
          prompt_system: Return only the declared JSON object.
          instructions:
            - Treat failure.validation as authoritative evidence of the failed command and its output.
            - Inspect only files_to_publish and the reported failure surface.
            - Return one repair record per required file, naming its repository-relative path and the reason for the correction.
            - Do not repeat a materially unchanged repair when the same validation state recurs.
          context: [failure, files_to_publish, validation_tools]
          output:
            name: repair_plan
            schema:
              type: object
              required: [repairs]
              additionalProperties: false
              properties:
                repairs:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required: [file_path, reason]
                    additionalProperties: false
                    properties:
                      file_path: {type: string, minLength: 1}
                      reason: {type: string, minLength: 1}
          validation: {kind: json_schema}
      - for_each:
          snapshot: {name: repair_plan.repairs, max_items: 16}
          item_binding: repair
          collect: {binding: repair_results, mode: list}
          body:
            - operation:
                tool: read_document
                parameters: {file_path: "${repair.file_path}"}
                bind: repair_source
            - judge:
                kind: plan_one_repair
                question: What one semantic edit corrects this validation failure?
                subject: failure.validation
                prompt_system: Return only the declared JSON object.
                instructions:
                  - Use repair.reason and the exact current repair_source to choose one concrete edit.
                  - Return a one-based inclusive line range and a non-empty replacement that implements the correction.
                  - Do not use whitespace-only or no-op edits, alter unrelated content, or guess a line range outside repair_source.
                context: [failure, repair, repair_source, files_to_publish]
                output:
                  name: repair_edit
                  schema:
                    type: object
                    required: [file_path, start, end, new_text]
                    additionalProperties: false
                    properties:
                      file_path: {type: string, minLength: 1}
                      start: {type: integer, minimum: 1}
                      end: {type: integer, minimum: 1}
                      new_text: {type: string, minLength: 1}
                validation: {kind: json_schema}
            - operation:
                tool: edit
                parameters:
                  operation: replace_lines
                  file_path: "${repair_edit.file_path}"
                  start_line: "${repair_edit.start}"
                  end_line: "${repair_edit.end}"
                  replacement: "${repair_edit.new_text}"
                bind: repair_result
      - operation:
          tool: invoke_tool
          parameters:
            tool: git
            parameters: {operation: add, paths: "${files_to_publish}"}
          bind: restage_result
