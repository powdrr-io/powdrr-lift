version: 1
name: specify-implementation
description: When an architecture specification already exists and you need implementation
  detail. When the TUI should guide the user through a synchronous implementation flow.
inputs:
- name: user_request
  type: string
  required: true
- name: workflow_context
  type: object
  required: true
limits:
  llm_activations: 260
  tool_calls: 260
  context_chars: 60000
  context_value_chars: 16000
steps:
- specialize:
    process: generate-fragment
    max_steps: 120
    question: "Execute this named workflow for the supplied user request. Treat the embedded\
      \ workflow document as task-specific requirements and preserve its ordering, gates,\
      \ outputs, and user-facing questions. Map its actions to the allowed Procedrr operation\
      \ tools. Replace legacy nested-process requests with calls to matching declared Procedrr\
      \ processes. Use only current bindings and evidence. Do not invent results or claim\
      \ an operation succeeded without its returned result.\n\nEmbedded workflow document:\n\
      ---\nname: specify-implementation\ninputs:\n- name: work-item-name\n- name: architecture-id\n\
      when_to_use:\n- When an architecture specification already exists and you need implementation\
      \ detail.\n- When the TUI should guide the user through a synchronous implementation\
      \ flow.\nsteps:\n- id: review-implementation-context\n  description: Review the system\
      \ and architecture context first.\n  step_type: uses_process\n  llm_type: high_reasoning\n\
      \  details: Confirm the source architecture id and the relevant entities before drafting\n\
      \    implementation detail.\n  uses_process:\n    process: review-system\n- id: review-architecture-context\n\
      \  description: Review the architecture context before drafting implementation detail.\n\
      \  step_type: uses_process\n  llm_type: high_reasoning\n  details: Confirm the source\
      \ architecture id and relevant entities before drafting\n    implementation detail.\n\
      \  uses_process:\n    process: review-architecture\n- id: generate-implementation\n  description:\
      \ Generate the implementation specification template.\n  actions: []\n  step_type: invoke_tool\n\
      \  llm_type: simple_task\n  pre_step:\n    action: invoke_tool\n    template:\n    \
      \  tool: internal\n      command:\n      - powdrr-lift\n      - implementation-specification\n\
      \      - \"--work-item-name\"\n      - \"<work-item-name>\"\n  outputs:\n  - name: implementation_specification_template\n\
      \    type: any\n    required_for_next_step: true\n    schema: {type: object, additionalProperties:\
      \ true}\n- id: fill-implementation\n  description: Fill out the feature and decision\
      \ sections so they stay aligned with\n    the architecture id.\n  actions: [edit, yaml_edit,\
      \ file_management, read_document]\n  step_type: governed\n  llm_type: standard_reasoning\n\
      \  details: >-\n    Use the yaml_edit action for every YAML change. Its shape is\n \
      \   {\"action\":\"yaml_edit\",\"file_path\":\"docs/proposals/<work-item-name>/implementation-specification.yaml\"\
      ,\"operations\":[{\"op\":\"set_value\",\"path\":[\"architecture_id\"],\"value\":\"<architecture-id>\"\
      },{\"op\":\"upsert_item\",\"section\":\"features\",\"id\":\"feature-id\",\"value\":{\"\
      action\":\"added\",\"description\":\"...\",\"functional_requirements\":[\"...\"]}},{\"\
      op\":\"upsert_item\",\"section\":\"decisions\",\"id\":\"decision-id\",\"value\":{\"\
      action\":\"added\",\"description\":\"...\"}}]}. Use set_value with a JSON path array\
      \ for scalar fields and upsert_item with section, id, and a complete value mapping for\
      \ list entries. Keep the implementation spec aligned with the source architecture version\
      \ and do not invent new ids. The exact file_path above is generated by the preceding\
      \ step; verify that it exists before editing. yaml_edit cannot create a missing document.\
      \ Never use an invented path such as requirements.yaml; if the generated file is absent,\
      \ invoke the declared generator or inspect the repository before retrying.\n- id: evaluate-implementation\n\
      \  description: Deterministically evaluate the filled implementation specification.\n\
      \  actions: []\n  step_type: invoke_tool\n  llm_type: simple_task\n  pre_step:\n   \
      \ action: invoke_tool\n    template:\n      tool: internal\n      command:\n      -\
      \ powdrr-lift\n      - evaluate\n      - docs/proposals/<work-item-name>/implementation-specification.yaml\n\
      \  outputs:\n  - name: implementation_evaluation\n    type: any\n    required_for_next_step:\
      \ true\n    schema: {type: object, additionalProperties: true}\n- id: repair-implementation\n\
      \  description: Use yaml_edit to fix every issue reported by the implementation evaluator.\n\
      \  actions: [edit, yaml_edit, file_management, read_document, goto_step]\n  step_type:\
      \ governed\n  llm_type: fast_iteration\n  details: >-\n    Review the deterministic\
      \ evaluator result and correct every reported issue\n    with yaml_edit actions. Each\
      \ action must include the YAML file_path and a\n    non-empty operations array. Use\
      \ set_value with a JSON path array for scalar\n    changes; use upsert_item with section,\
      \ id, and a complete value mapping for\n    entities, relationships, modules, tools,\
      \ features, or decisions. For example: {\"action\":\"yaml_edit\",\"file_path\":\"docs/proposals/<work-item-name>/implementation-specification.yaml\"\
      ,\"operations\":[{\"op\":\"set_value\",\"path\":[\"architecture_id\"],\"value\":\"architecture-id\"\
      },{\"op\":\"upsert_item\",\"section\":\"features\",\"id\":\"feature-id\",\"value\":{\"\
      action\":\"added\",\"description\":\"...\",\"functional_requirements\":[\"...\"]}}]}.\
      \ Do not use edit or rewrite the YAML as prose. If there are no issues, choose next_step\
      \ without changing the file and return {\"action\":\"next_step\"}. If the evaluator\
      \ reports invalid YAML/structure or you are stuck, restart generation with {\"action\"\
      :\"goto_step\",\"step_id\":\"generate-implementation\"}; do not keep repeating the same\
      \ repair. The generator will overwrite unreadable content and merge valid existing fields\
      \ back into the restored template.\n- id: gate-implementation\n  description: Confirm\
      \ that implementation evaluation reports zero issues.\n  actions: []\n  step_type: gate\n\
      \  llm_type: simple_task\n  details: The gate passes only when the evaluator exits successfully\
      \ with zero issues.\n  pre_step:\n    action: invoke_tool\n    template:\n      tool:\
      \ internal\n      command:\n      - powdrr-lift\n      - evaluate\n      - docs/proposals/<work-item-name>/implementation-specification.yaml\n\
      \  gate:\n    outcome:\n      path: returncode\n      equals: 0\n    goto_step: evaluate-implementation\n\
      \    retry_context: >-\n      The gate failed because implementation evaluation still\
      \ reports issues.\n      Inspect the latest evaluator result, use yaml_edit to fix every\
      \ issue, and\n      then allow the deterministic evaluate-implementation step to run\
      \ again."
    context:
    - user_request
    - workflow_context
    allowed_tools:
    - edit
    - file_management
    - read_document
    - yaml_edit
    - invoke_tool
    bind: workflow_program
- call:
    fragment: ${workflow_program}
    max_steps: 120
- terminal: succeeded
