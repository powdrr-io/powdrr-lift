      \ add\n      paths:\n      - docs/proposals/<feature-name>\n      - docs/workflows\n\
      - id: verify-staged-artifacts\n  description: Verify the staged artifact set.\n  actions:\
      \ []\n  step_type: invoke_tool\n  llm_type: simple_task\n  pre_step:\n    action: invoke_tool\n\
      \    template:\n      tool: internal\n      command:\n      - powdrr-lift\n      - repository-state\n\
      \  outputs:\n  - name: staged_artifact_repository_state\n    type: any\n    required_for_next_step:\
      \ true\n    schema: {type: object, additionalProperties: true}\n- id: prepare-feature-pull-request-dependency\n\
      \  description: Run finish-pr-prep on the validated planning artifacts.\n  step_type:\
