      \ {type: boolean}\n            required:\n            - workflow_id\n            - path\n\
      \            - expected_dependencies\n            - actual_dependencies\n          \
      \  - matches\n        all_match: {type: boolean}\n      required: [workflows, all_match]\n\
      - id: inspect-workflow-repository-state\n  description: Inspect generated workflow repository\
