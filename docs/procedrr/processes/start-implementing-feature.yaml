      \ proposed_pr dependent_prs predecessor appears in the matching workflow's\n    depends_on_workflows\
      \ list, that workflows with no planned predecessors have\n    no dependency entries,\
      \ and that no undeclared dependency was added. Do not\n    infer dependencies from ordering,\
