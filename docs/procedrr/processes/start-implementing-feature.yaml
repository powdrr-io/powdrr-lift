      outputs\":{\"workflow_dependency_report\":{\"workflows\":[{\"workflow_id\":\"<id>\"\
      ,\"path\":\"<exact path>\",\"expected_dependencies\":[],\"actual_dependencies\":[],\"\
      matches\":true}],\"all_match\":true}},\"decisions_and_context\":\"Verified every workflow\
      \ dependency against the unified proposed-PR plan.\"}\n    Do not put the report only\
      \ in decisions_and_context and do not advance\n    without the declared output.\n  outputs:\n\
      \  - name: workflow_dependency_report\n    type: any\n    required_for_next_step: true\n\
      \    schema:\n      type: object\n      additionalProperties: false\n      properties:\n\
      \        workflows:\n          type: array\n          items:\n            type: object\n\
      \            additionalProperties: false\n            properties:\n              workflow_id:\
      \ {type: string}\n              path: {type: string}\n              expected_dependencies:\n\
