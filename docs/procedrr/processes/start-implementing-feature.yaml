      :\"Recorded every successful workflow instantiation result.\"}\n    Do not advance after\
      \ a failed invocation, do not invoke a new instance name,\n    and do not put the successful\
      \ identities only in decisions_and_context.\n  tool_invocations:\n  - tool: internal\n\
      \    command:\n    - powdrr-lift\n    - instantiate-workflow\n    - --work-item-name\n\
      \    - <feature-name>\n    - --workflow-instance-name\n    - <proposed-pr-name>\n  \
      \  - --template-value\n    - proposed-pr-id=<proposed-pr-name>\n    - --template-value\n\
      \    - verification-command=<verification-command>\n    - --template\n    - templates/execute-proposed-pr.yaml\n\
      \  - tool: internal\n    command:\n    - powdrr-lift\n    - instantiate-workflow\n \
      \   - --work-item-name\n    - <feature-name>\n    - --workflow-instance-name\n    -\
      \ <proposed-pr-name>\n    - --template-value\n    - proposed-pr-id=<proposed-pr-name>\n\
      \    - --template-value\n    - verification-command=<verification-command>\n    - --template\n\
      \    - templates/execute-proposed-pr.yaml\n    - --force\n  outputs:\n  - name: workflow_instantiation_report\n\
      \    type: any\n    required_for_next_step: true\n    schema:\n      type: object\n\
      \      additionalProperties: false\n      properties:\n        workflows:\n        \
      \  type: array\n          items:\n            type: object\n            additionalProperties:\
      \ false\n            properties:\n              workflow_id: {type: string}\n      \
      \        workflow_directory: {type: string}\n              integration_branch: {type:\
      \ string}\n              integration_worktree: {type: string}\n              task_count:\
      \ {type: integer}\n              reused: {type: boolean}\n            required:\n  \
      \          - workflow_id\n            - workflow_directory\n            - integration_branch\n\
      \            - integration_worktree\n            - task_count\n            - reused\n\
      \      required: [workflows]\n- id: verify-workflow-dependencies\n  description: Verify\
