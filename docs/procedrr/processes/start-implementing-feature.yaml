version: 1
name: start-implementing-feature
description: When the user is ready to begin implementing a feature. When the feature needs
  proposed PR planning and durable execution workflows before implementation starts. When
  the generated planning artifacts and first task should be placed in a pull request for user
  review.
inputs:
- name: user_request
  type: string
  required: true
- name: workflow_context
  type: object
  required: true
limits:
  llm_activations: 260
  tool_calls: 260
  context_chars: 60000
  context_value_chars: 16000
steps:
- specialize:
    process: generate-fragment
    max_steps: 120
    question: "Execute this named workflow for the supplied user request. Treat the embedded\
      \ workflow document as task-specific requirements and preserve its ordering, gates,\
      \ outputs, and user-facing questions. Map its actions to the allowed Procedrr operation\
      \ tools. Replace legacy nested-process requests with calls to matching declared Procedrr\
      \ processes. Use only current bindings and evidence. Do not invent results or claim\
      \ an operation succeeded without its returned result.\n\nEmbedded workflow document:\n\
      ---\nname: start-implementing-feature\ninputs:\n- name: canonical-feature-name\n- name:\
      \ candidate-names\n- name: proposed_pr_id\n- name: proposed-pr-id\n- name: proposed-pr-name\n\
      - name: workflow-id\n- name: id\n- name: path\n- name: pull-request-title\ninteraction_style:\
      \ engineering\nwhen_to_use:\n- When the user is ready to begin implementing a feature.\n\
      - When the feature needs proposed PR planning and durable execution workflows\n  before\
      \ implementation starts.\n- When the generated planning artifacts and first task should\
      \ be placed in a\n  pull request for user review.\nsteps:\n- id: capture-feature-query\n\
      \  description: Capture the feature name to search for.\n  actions: []\n  step_type:\
      \ governed\n  llm_type: simple_task\n  details: >-\n    Extract the feature name or\
      \ identifier from the user's request without\n    selecting a canonical repository feature.\
      \ Normalize surrounding prose but\n    preserve the meaningful words in the requested\
      \ name. If the request does\n    not identify any feature, ask one specific question.\
      \ Otherwise advance with\n    exactly one output named feature_query. The following\
      \ deterministic steps\n    use this value only as a search query; they select nothing.\n\
      \  outputs:\n  - name: feature_query\n    type: string\n    required_for_next_step:\
      \ true\n    schema: {type: string}\n- id: discover-proposed-feature\n  description:\
      \ Discover proposed feature specification candidates.\n  actions: []\n  step_type: invoke_tool\n\
      \  llm_type: simple_task\n  inputs:\n  - name: feature_query\n    type: string\n   \
      \ required: true\n    source: previous_step\n  pre_step:\n    action: invoke_tool\n\
      \    template:\n      tool: fuzzy-match\n      command:\n      - fuzzy-match\n     \
      \ - docs/proposals\n      - -name\n      - <feature-query>\n      - -type\n      - d\n\
      \      - -maxdepth\n      - \"2\"\n      - -print\n  outputs:\n  - name: proposed_feature_candidates\n\
      \    type: any\n    required_for_next_step: true\n    schema: {type: array, items: {type:\
      \ object}}\n- id: discover-current-feature\n  description: Discover current feature\
      \ specification candidates.\n  actions: []\n  step_type: invoke_tool\n  llm_type: simple_task\n\
      \  inputs:\n  - name: feature_query\n    type: string\n    required: true\n    source:\
      \ previous_step\n  pre_step:\n    action: invoke_tool\n    template:\n      tool: fuzzy-match\n\
      \      command:\n      - fuzzy-match\n      - docs/current\n      - -name\n      - <feature-query>\n\
      \      - -type\n      - d\n      - -maxdepth\n      - \"2\"\n      - -print\n  outputs:\n\
      \  - name: current_feature_candidates\n    type: any\n    required_for_next_step: true\n\
      \    schema: {type: array, items: {type: object}}\n- id: discover-feature-workflows\n\
      \  description: Discover execution workflow candidates.\n  actions: []\n  step_type:\
      \ invoke_tool\n  llm_type: simple_task\n  inputs:\n  - name: feature_query\n    type:\
      \ string\n    required: true\n    source: previous_step\n  pre_step:\n    action: invoke_tool\n\
      \    template:\n      tool: fuzzy-match\n      command:\n      - fuzzy-match\n     \
      \ - docs/workflows\n      - -name\n      - <feature-query>\n      - -type\n      - d\n\
      \      - -maxdepth\n      - \"3\"\n      - -print\n  outputs:\n  - name: workflow_candidates\n\
      \    type: any\n    required_for_next_step: true\n    schema: {type: array, items: {type:\
      \ object}}\n- id: select-feature-context\n  description: Select the canonical feature\
      \ and workflow context.\n  actions: [goto_step]\n  step_type: governed\n  llm_type:\
      \ standard_reasoning\n  details: >-\n    Inputs are the exact proposed_feature_candidates,\n\
      \    current_feature_candidates, workflow_candidates, and feature_query outputs\n  \
      \  from the preceding discovery steps. Normalize case, spaces, underscores,\n    and\
      \ hyphens. If exactly one proposal or current-feature directory matches\n    feature_query,\
      \ select it, use the matching directory's basename as the\n    canonical feature_name,\
      \ and emit the exact\n    document paths. A workflow directory is never an independent\
      \ choice: its\n    only valid path is docs/workflows/<canonical-feature-name>. If no\
      \ candidate\n    matches, emit one prompt_user action. If multiple candidates remain\
      \ tied,\n    emit one prompt_user action naming the candidate paths. If the user supplies\n\
      \    a new identifier, emit one goto_step action for the relevant discovery step;\n\
      \    do not combine it with another action. For example:\n    {\"action\":\"prompt_user\"\
      ,\"text\":\"Which feature or workflow should I use from these candidates: <candidate-names>?\"\
      }\n    Never ask the user to choose a missing workflow directory; do not ask the\n \
      \   user which workflow path to use. Do not ask whether\n    documents exist before\
      \ searching. Emit feature_name only after selecting a\n    canonical feature. Pass the\
      \ selected specification documents,\n    workflow documents, canonical feature name,\
      \ and missing-document findings\n    to the next step. Emit `specification_documents`\
      \ as the exact existing\n    file paths for the canonical documents, `workflow_documents`\
      \ as the exact\n    existing workflow file paths, and `missing_documents` as exact paths\
      \ that\n    are absent. These are arrays of file paths, never directory paths. The\n\
      \    canonical specification filenames are exactly\n    system-specification.yaml, architecture-specification.yaml,\n\
      \    implementation-specification.yaml, and proposed-pr-specification.yaml;\n    never\
      \ invent specification-v1.yaml or another filename from the schema name.\n  outputs:\n\
      \  - name: feature_name\n    type: string\n    required_for_next_step: true\n    schema:\
      \ {type: string}\n  - name: specification_documents\n    type: array\n    required_for_next_step:\
      \ true\n    schema:\n      type: array\n      items:\n        type: string\n  - name:\
      \ workflow_documents\n    type: array\n    required_for_next_step: true\n    schema:\n\
      \      type: array\n      items:\n        type: string\n  - name: missing_documents\n\
      \    type: array\n    required_for_next_step: true\n    schema:\n      type: array\n\
      \      items:\n        type: string\n  inputs:\n  - name: feature_query\n    type: string\n\
      \    required: true\n    source: previous_step\n  - name: proposed_feature_candidates\n\
      \    type: array\n    required: true\n    source: previous_step\n  - name: current_feature_candidates\n\
      \    type: array\n    required: true\n    source: previous_step\n  - name: workflow_candidates\n\
      \    type: array\n    required: true\n    source: previous_step\n- id: bootstrap-project-structure\n\
      \  description: Bootstrap the project-wide module and tool structure.\n  actions: [task_run_process]\n\
      \  step_type: governed\n  llm_type: standard_reasoning\n  pre_step:\n    action: invoke_tool\n\
      \    template:\n      tool: shell\n      command:\n      - test\n      - -f\n      -\
      \ docs/project_structure/project-structure.yaml\n  details: >-\n    The engine-owned\
      \ pre-step result is authoritative; do not reread it. If the\n    artifact exists, emit\
      \ one next_step action and reuse it. If it is missing,\n    emit one task_run_process action\
      \ for the exact process id\n    `bootstrap-code-structure`; after that action returns,\
      \ emit next_step in the\n    following turn. The nested process is project-wide\n    and\
      \ must not ask for a feature or target module. Never invoke bootstrap\n    merely because\
      \ this step is present: the gate result is authoritative.\n- id: confirm-project-structure\n\
      \  description: Confirm the project-structure artifact is available.\n  actions: []\n\
      \  step_type: gate\n  llm_type: simple_task\n  details: The gate passes only when the\
      \ project-structure artifact exists in the active worktree.\n  pre_step:\n    action:\
      \ invoke_tool\n    template:\n      tool: shell\n      command:\n      - test\n    \
      \  - -f\n      - docs/project_structure/project-structure.yaml\n  gate:\n    outcome:\n\
      \      path: returncode\n      equals: 0\n    goto_step: bootstrap-project-structure\n\
      \    retry_context: >-\n      The project-structure artifact is not available in the\
      \ active worktree.\n      Rerun bootstrap-project-structure so the nested bootstrap\
      \ process can\n      create the artifact in the same worktree, then retry this gate.\n\
      - id: plan-proposed-prs\n  description: Plan the proposed PR implementation sequence.\n\
      \  actions: [invoke_tool, read_document]\n  step_type: governed\n  llm_type: high_reasoning\n\
      \  tool_invocations:\n  - tool: basedpyright-structure\n    operation: inspect_structure\n\
      \  - tool: basedpyright-symbol\n    operation: resolve_symbol\n  inputs:\n  - name:\
      \ feature_name\n    type: string\n    required: true\n    source: previous_step\n  -\
      \ name: specification_documents\n    type: array\n    required: true\n    source: previous_step\n\
      \  - name: workflow_documents\n    type: array\n    required: true\n    source: previous_step\n\
      \  details: >-\n    This is a planning-only step. Do not create, edit, rename, or delete\
      \ the\n    proposed PR specification; the following deterministic generation step owns\n\
      \    creation of that file. Use only the exact specification document paths handed off\
      \ by\n    select-feature-context; do not synthesize a filename from a schema,\n    template\
      \ id, or feature description. If the unified proposed-PR specification already exists\
      \ in the selected\n    feature context, inspect and reuse its ordered `proposed_prs`\
      \ entries and\n    pass their stable names and paths onward. Otherwise analyze the feature\n\
      \    context and the project structure to define ordered proposed PRs\n    with incremental\
      \ validation, clear boundaries, low risk, dependencies, and\n    stable names for the\
      \ later single proposed-pr-specification.yaml file. For each proposed\n    PR, record\
      \ its goal, scope, files, tests, acceptance criteria, validation\n    commands, dependencies,\
      \ and risks. Record every action-bearing id from the\n    feature-wide specification-v1\
      \ sections after the proposed_prs section,\n    preserving source order and action.\
      \ Label every change item with the\n    proposed_pr_id that will deliver it. Use the\n\
      \    read_document action to inspect templates/execute-proposed-pr.yaml; do not\n  \
      \  use shell commands to read the template. A proposed PR dependency means\n    the\
      \ predecessor workflow is complete only after its integration pull\n    request is merged;\
      \ completion of the predecessor's final task or creation\n    of its pull request is\
      \ not sufficient. Preserve these workflow-level\n    dependencies in the instantiation\
      \ plan. Do not generate one proposed-PR\n    file per PR. Before next_step, return\n\
      \    exactly one output named proposed_pr_names containing every stable proposed\n \
      \   PR name. Do not rely on decisions_and_context for this handoff. When a\n    proposed\
      \ PR touches Python source or tests, inspect each implementation area\n    with the\
      \ bounded `basedpyright-structure` tool and resolve key symbols with\n    `basedpyright-symbol`\
      \ before finalizing its file and dependency plan. Use\n    those read-only tools instead\
      \ of inferring module boundaries from text\n    matches alone. Skip them only when the\
      \ proposed PR has no Python paths. Use\n    BasedPyright only after an exact repository-relative\
      \ Python file path is\n    present in the selected specification or inspected project\
      \ context. The\n    `path` parameter must end in `.py` and must name a file, never a\
      \ directory,\n    proposal folder, glob, or guessed path. If no concrete Python file\
      \ is known,\n    do not invoke BasedPyright yet; read the relevant context or choose\
      \ a\n    materially different allowed action. After a capability error, do not\n   \
      \ reread a document that already succeeded; use the diagnostic candidate file\n    list\
      \ or another declared discovery action to select a different exact file.\n    these\
      \ exact action shapes:\n    {\"action\":\"invoke_tool\",\"tool\":\"basedpyright-structure\"\
      ,\"parameters\":{\"operation\":\"inspect_structure\",\"path\":\"src/example.py\"}}\n\
      \    and {\"action\":\"invoke_tool\",\"tool\":\"basedpyright-symbol\",\"parameters\"\
      :{\"operation\":\"resolve_symbol\",\"query\":\"Example\"}}.\n  outputs:\n  - name: proposed_pr_names\n\
      \    type: any\n    required_for_next_step: true\n    schema: {type: array, items: {type:\
      \ string}}\n- id: generate-proposed-pr-specification\n  description: Generate the single\
      \ proposed PR specification template.\n  actions: []\n  step_type: invoke_tool\n  llm_type:\
      \ simple_task\n  inputs:\n  - name: feature_name\n    type: string\n    required: true\n\
      \    source: previous_step\n  pre_step:\n    action: invoke_tool\n    template:\n  \
      \    tool: internal\n      command:\n      - powdrr-lift\n      - pr-specification\n\
      \      - --work-item-name\n      - <feature-name>\n      - --output\n      - docs/proposals/<feature-name>/proposed-pr-specification.yaml\n\
      \  outputs:\n  - name: proposed_pr_specification_template\n    type: any\n    required_for_next_step:\
      \ true\n    schema: {type: object, additionalProperties: true}\n- id: plan-proposed-pr-specification\n\
      \  description: Define the ordered proposed PR plan.\n  actions: [read_document]\n \
      \ step_type: governed\n  llm_type: high_reasoning\n  details: >-\n    This is a planning-only\
      \ judgment. Do not edit YAML and do not inspect,\n    copy, assign, or mention authoritative\
      \ effects. Return exactly one object\n    in `next_step.outputs.proposed_pr_plan`. It\
      \ contains only one ordered\n    `proposed_prs` array. Every entry contains exactly\
      \ `id`, `intent`,\n    `justification`, and `dependent_pr_ids`; use an empty dependency\
      \ array when\n    there are no prerequisites. Do not supply effect references, assignments,\n\
      \    section/id/action triples, schema, work-item id, feature ids, paths,\n    comments,\
      \ or persisted-document fields. The runtime validates the complete\n    plan before\
      \ exposing authoritative effects to the later allocation phase.\n    Return exactly\
      \ {\"action\":\"next_step\",\"outputs\":{\"proposed_pr_plan\":{\"proposed_prs\":[{\"\
      id\":\"proposed-pr-id\",\"intent\":\"Implement the change\",\"justification\":\"Required\
      \ by the feature\",\"dependent_pr_ids\":[]}]}}}.\n  outputs:\n  - name: proposed_pr_plan\n\
      \    type: object\n    required_for_next_step: true\n    schema:\n      type: object\n\
      \      additionalProperties: false\n      required: [proposed_prs]\n      properties:\n\
      \        proposed_prs:\n          type: array\n          minItems: 1\n          items:\n\
      \            type: object\n            additionalProperties: false\n            required:\
      \ [id, intent, justification, dependent_pr_ids]\n            properties:\n         \
      \     id: {type: string, minLength: 1}\n              intent: {type: string, minLength:\
      \ 1}\n              justification: {type: string, minLength: 1}\n              dependent_pr_ids:\n\
      \                type: array\n                items: {type: string, minLength: 1}\n\
      - id: load-authoritative-pr-effects\n  description: Load authoritative effects for allocation.\n\
      \  actions: []\n  step_type: invoke_tool\n  llm_type: simple_task\n  pre_step:\n   \
      \ action: invoke_tool\n    template:\n      tool: internal\n      command:\n      -\
      \ powdrr-lift\n      - authoritative-pr-effects\n      - --work-item-name\n      - <feature-name>\n\
      \  outputs:\n  - name: authoritative_effects\n    type: object\n    required_for_next_step:\
      \ true\n    schema:\n      type: object\n      additionalProperties: false\n      required:\
      \ [effects]\n      properties:\n        effects:\n          type: array\n          items:\n\
      \            type: object\n            additionalProperties: false\n            required:\
      \ [effect_ref, section, id, action]\n            properties:\n              effect_ref:\
      \ {type: string, minLength: 1}\n              section: {type: string, minLength: 1}\n\
      \              id: {type: string, minLength: 1}\n              action: {type: string,\
      \ minLength: 1}\n- id: allocate-proposed-pr-effects\n  description: Allocate authoritative\
      \ effects to the planned PRs.\n  actions: []\n  step_type: governed\n  llm_type: high_reasoning\n\
      \  details: >-\n    Use the validated proposed_pr_plan and runtime-owned authoritative_effects\n\
      \    handoffs. Return exactly one object in\n    `next_step.outputs.effect_allocation`,\
      \ containing only `assignments`. Return\n    every supplied effect_ref exactly once\
      \ with one target proposed_pr_id from\n    the validated plan. Never return, copy, or\
      \ invent section, id, action, YAML,\n    schema, feature ids, or other persisted-document\
      \ fields. Runtime code\n    resolves each reference, validates total and exact allocation,\
      \ compiles the\n    read-only compatibility document, validates it, and only then writes\
      \ it.\n    Return exactly {\"action\":\"next_step\",\"outputs\":{\"effect_allocation\"\
      :{\"assignments\":[{\"effect_ref\":\"effect-ref\",\"proposed_pr_id\":\"proposed-pr-id\"\
      }]}}}.\n  inputs:\n  - name: proposed_pr_plan\n    type: object\n    source: previous_step\n\
      \  - name: authoritative_effects\n    type: object\n    source: previous_step\n  outputs:\n\
      \  - name: effect_allocation\n    type: object\n    required_for_next_step: true\n \
      \   schema:\n      type: object\n      additionalProperties: false\n      required:\
      \ [assignments]\n      properties:\n        assignments:\n          type: array\n  \
      \        minItems: 1\n          items:\n            type: object\n            additionalProperties:\
      \ false\n            required: [effect_ref, proposed_pr_id]\n            properties:\n\
      \              effect_ref: {type: string, minLength: 1}\n              proposed_pr_id:\
      \ {type: string, minLength: 1}\n- id: evaluate-proposed-pr-specification\n  description:\
      \ Route proposed PR evaluation deterministically.\n  actions: []\n  step_type: gate\n\
      \  llm_type: simple_task\n  details: >-\n    Runtime code evaluates the compiled proposed\
      \ PR document exactly once. A\n    successful result advances directly to workflow planning\
      \ without an LLM\n    confirmation. A failure routes to semantic repair with the complete\n\
      \    structured evaluator issues.\n  pre_step:\n    action: invoke_tool\n    template:\n\
      \      tool: internal\n      command:\n      - powdrr-lift\n      - evaluate\n     \
      \ - docs/proposals/<feature-name>\n  gate:\n    outcome:\n      path: returncode\n \
      \     equals: 0\n    goto_step: repair-proposed-pr-specification\n    success_goto_step:\
      \ plan-workflow-instantiation\n    retry_context: >-\n      Use the structured evaluator\
      \ issues to identify whether the proposed PR\n      plan or effect allocation must change.\
      \ Do not edit the generated YAML.\n- id: repair-proposed-pr-specification\n  description:\
      \ Repair every reported proposed PR specification issue.\n  actions: [read_document,\
      \ goto_step]\n  next_step_override: evaluate-proposed-pr-specification\n  step_type:\
      \ governed\n  llm_type: fast_iteration\n  details: >-\n    Do not repair YAML. Review\
      \ the structured issues selected by the runtime\n    gate. Use goto_step with `plan-proposed-pr-specification`\
      \ when PR ids,\n    intent, justification, or dependencies must change. Use goto_step\
      \ with\n    `allocate-proposed-pr-effects` when only effect ownership must change. The\n\
      \    selected phase must return a complete replacement decision object and the\n   \
      \ runtime will compile and evaluate the whole document again. Do not\n    instantiate\
      \ workflows, stage artifacts, request approval, or create a pull\n    request while\
      \ the proposed PR file is invalid.\n- id: plan-workflow-instantiation\n  description:\
      \ Plan execution workflow instantiation.\n  actions: [gather_context, edit, yaml_edit,\
      \ file_management, read_document]\n  step_type: governed\n  llm_type: simple_task\n\
      \  inputs:\n  - name: proposed_pr_names\n    type: array\n    required: true\n    source:\
      \ previous_step\n  - name: feature_name\n    type: string\n    required: true\n    source:\
      \ previous_step\n  - name: proposed_pr_specification_template\n    type: object\n  \
      \  required: true\n    source: previous_step\n  details: >-\n    Use the `proposed_pr_names`,\
      \ `feature_name`, and\n    `proposed_pr_specification_template` inputs from the preceding\
      \ steps. For each\n    validated proposed PR, inspect whether its matching workflow\n\
      \    already exists and reuse it when present. For each missing workflow,\n    inspect\
      \ templates/execute-proposed-pr.yaml with read_document, resolve\n    every task input_state\
      \ placeholder from the matching validated proposed PR,\n    and prepare the complete\
      \ instantiation\n    values. Use the fixed template, canonical feature name, distinct\
      \ workflow\n    instance names, proposed-PR order, and dependency relationships. Before\n\
      \    finalizing the values, use gather_context with type `tools` for the\n    selected\
      \ feature to discover the repository's authoritative test command.\n    Include that\
      \ command as the `verification-command` template value for every\n    execute-proposed-pr\
      \ workflow.\n    The workflow metadata file is named exactly\n    `<proposed_pr_id>-workflow.yaml`\
      \ inside\n    `docs/workflows/<canonical-feature-name>/`; `<proposed_pr_id>` is the\
      \ exact\n    id from `proposed_prs`, such as `interaction-log-core`. Do not prepend\
      \ the\n    template id (`execute-proposed-pr`), the template filename, or a branch name.\n\
      \    Use the exact path returned by instantiation or an exact filename listed by\n \
      \   the workflow directory; never compose a filename from memory. Do not\n    pass workflow\
      \ dependencies manually: instantiate-workflow derives them from\n    dependent_prs in\
      \ the matching proposed PR specification. The resulting\n    workflow state must preserve\
      \ those derived dependencies so its integration\n    PR must be MERGED before any task\
      \ in the dependent workflow is selected.\n    Do not model this only as an upstream\
      \ task dependency. Never ask the user\n    for a template path, leave a required placeholder\
      \ empty, or overwrite an\n    existing workflow without approval. Pass an invocation\
      \ plan containing\n    every created or reused workflow and its proposed-PR relationship\
      \ onward.\n  outputs:\n  - name: verification-command\n    type: string\n    required_for_next_step:\
      \ true\n    schema: {type: string}\n  - name: invocation-plan\n    type: object\n  \
      \  required_for_next_step: true\n    schema: {type: object, additionalProperties: true}\n\
      - id: instantiate-execution-workflows\n  description: Instantiate each missing execution\
      \ workflow.\n  actions: [invoke_tool, edit, yaml_edit, read_document]\n  step_type:\
      \ governed\n  llm_type: simple_task\n  tool_invocation_packages: [git_readonly_and_additive]\n\
      \  inputs:\n  - name: invocation-plan\n    type: object\n    required: true\n    source:\
      \ previous_step\n  - name: verification-command\n    type: string\n    required: true\n\
      \    source: previous_step\n  - name: feature_name\n    type: string\n    required:\
      \ true\n    source: previous_step\n  details: >-\n    Invoke instantiate-workflow once\
      \ for each missing workflow listed in the\n    `invocation-plan` input. Use templates/execute-proposed-pr.yaml,\
      \ pass every\n    template-specific value with repeated --template-value NAME=VALUE\
      \ options,\n    Do not pass workflow dependencies manually: instantiate-workflow derives\n\
      \    them from the unified proposed-PR specification. The dependency graph is\n    the\
      \ source of truth; do not claim dependencies were applied unless they\n    are present\
      \ in the persisted workflow state.\n    Use the `feature_name` input as the shared work-item\
      \ name. The\n    command must create the powdrr/<proposed-pr-id> integration branch\
      \ while\n    writing workflow files into this active worktree. Stop if a returned\n\
      \    workflow directory is outside the active worktree. Pass every created or\n    reused\
      \ workflow identity onward. Relationships use semantic identifiers;\n    never add file\
      \ or directory pointers. If initialization reports a\n    non-fast-forward merge because\
      \ the dedicated integration branch is stale,\n    retry the exact invocation once with\
      \ `--force`; this resets only that\n    dedicated integration branch to the current\
      \ generated source commit and\n    uses lease-protected push. Do not use `--force` for\
      \ any other command.\n    After every invocation succeeds, record its exact returned\
      \ workflow identity.\n    Before advancing, emit one `workflow_instantiation_report`\
      \ output containing\n    every requested workflow exactly once. Each entry must copy\
      \ the command result\n    fields without invention and include `workflow_id`, `workflow_directory`,\n\
      \    `integration_branch`, `integration_worktree`, `task_count`, and `reused`.\n   \
      \ Set `reused` to true when the command reports an existing idempotent workflow\n  \
