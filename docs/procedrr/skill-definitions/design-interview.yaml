version: 1
name: design-interview
description: >-
  Compile the feature request into one deterministic instruction ledger, then
  ask one bounded semantic question per instruction clause. The compiler owns
  clause identity, obligations, acceptance criteria, and test contracts.
inputs:
  - {name: work_item_name, type: string, required: true}
  - {name: feature_description, type: string, required: true}
outputs:
  feature_design:
    type: object
    required: [path, fingerprint, obligations, required_test_cases]
    additionalProperties: false
    properties:
      path:
        type: string
        x-powdrr-type: SchematizedPath
        minLength: 1
        x-powdrr-schema:
          type: object
          required: [schema_version, fingerprint, obligations, required_test_cases]
          additionalProperties: false
      fingerprint: {type: string, minLength: 1}
      obligations:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, description, design]
          additionalProperties: false
          properties:
            id: {type: string, minLength: 1}
            description: {type: string, minLength: 1}
            design: {type: object}
      required_test_cases:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, description, intent_refs, provider, profile, name_hint, selector, expectation, applicability, status]
          additionalProperties: false
          properties:
            id: {type: string, minLength: 1}
            description: {type: string, minLength: 1}
            intent_refs: {type: array, minItems: 1, items: {type: string, minLength: 1}}
            provider: {type: string, minLength: 1}
            profile: {type: string, minLength: 1}
            name_hint: {type: string, minLength: 1}
            selector: {type: string, minLength: 1}
            expectation: {type: string, enum: [pass]}
            applicability: {type: object}
            status: {type: string, enum: [active]}
steps:
  - operation:
      tool: internal
      command: [compile_instruction_ledger]
      parameters:
        work_item_name: {type: reference, value: work_item_name}
        feature_description: {type: reference, value: feature_description}
      returns:
        type: object
        required: [path, fingerprint, clauses]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          clauses: {type: array, minItems: 1}
      bind: instruction_ledger
  - for_each:
      snapshot: {name: instruction_ledger.clauses, max_items: 128}
      item_binding: instruction_clause
      collect: {binding: semantic_designs, mode: list, value: semantic_design}
      body:
        - judge:
            kind: classify_one
            provider: planning
            question: What kind of obligation does this instruction clause express?
            subject: instruction_clause.text
            prompt_system: Return only the declared JSON object.
            instructions:
              - Classify only this clause as entity, feature, interface, invariant, guidance, non_goal, or nonactionable.
              - Use nonactionable for process, tooling, delivery, or meta-instructions that do not describe product behavior. Examples include "create a branch from main", "commit everything", "open a PR", "run this with tool X", and "report the result".
              - A statement that a capability is missing, manual, unsafe, or currently absent is not nonactionable; it is feature context when the surrounding request asks for that capability.
              - Use non_goal only for an explicit product prohibition or scope exclusion, such as "do not change the transport" or "this feature must not add retries". Do not infer a non-goal from words such as "lacks", "without", or "manual".
              - Do not return IDs, references, selectors, hashes, or fingerprints; Powdrr assigns them.
            context: [feature_description, instruction_clause]
            output:
              name: semantic_kind
              schema:
                type: object
                required: [kind]
                additionalProperties: false
                properties:
                  kind:
                    type: string
                    enum: [entity, feature, interface, invariant, guidance, non_goal, nonactionable]
            validation: {kind: json_schema}
        - judge:
            kind: construct_one
            provider: planning
            question: What is the one concrete semantic obligation expressed by this instruction clause?
            subject: instruction_clause.text
            prompt_system: Return only the declared JSON object.
            instructions:
              - Use the supplied kind classification and translate only this clause into one semantic obligation.
              - If the kind is nonactionable, produce a trace-only disposition; it must not describe an implementation obligation or a required test.
              - For a normal clause, write description as one short imperative sentence naming one behavior, API, invariant, or constraint to implement.
              - For a normal clause, write acceptance_criterion as one short observable assertion that proves the described obligation.
              - Preserve concrete names, values, conditions, and prohibitions from the clause, but do not explain, summarize, enumerate scenarios, or add design choices not present in the clause.
              - Do not return IDs, references, selectors, hashes, or fingerprints; Powdrr assigns them.
            prompt_rules:
              - when: {binding: semantic_kind.kind, equals: non_goal}
                instructions:
                  - Treat this as an explicit non-goal, not an implementation task.
                  - Write description as one short sentence beginning with "Do not implement" that names only the excluded behavior.
                  - Write acceptance_criterion as one short observable assertion that proves the excluded behavior was not introduced.
              - when: {binding: semantic_kind.kind, equals: nonactionable}
                instructions:
                  - State that the clause is ignored as a process or meta-instruction and must not become a product obligation or test contract.
            context: [feature_description, instruction_clause, semantic_kind]
            output:
              name: semantic_obligation
              schema:
                type: object
                required: [description, acceptance_criterion]
                additionalProperties: false
                properties:
                  description: {type: string, minLength: 1, maxLength: 500}
                  acceptance_criterion: {type: string, minLength: 1, maxLength: 500}
            validation: {kind: json_schema}
        - judge:
            kind: construct_one
            provider: planning
            question: What one test contract proves this classified obligation and acceptance criterion?
            subject: instruction_clause.text
            prompt_system: Return only the declared JSON object.
            instructions:
              - State one short concrete expected test that proves the supplied obligation and acceptance criterion.
              - Name the observable behavior or assertion the test must exercise; do not provide test code, a test plan, or multiple test cases.
              - Do not return IDs, references, selectors, hashes, or fingerprints; Powdrr assigns them.
            prompt_rules:
              - when: {binding: semantic_kind.kind, equals: non_goal}
                instructions:
                  - State one short test or guard that proves the excluded behavior is not introduced.
              - when: {binding: semantic_kind.kind, equals: nonactionable}
                instructions: ["Return a trace-only statement: no product test is required because this clause is not actionable."]
            context: [feature_description, instruction_clause, semantic_kind, semantic_obligation]
            output:
              name: semantic_test_contract
              schema:
                type: object
                required: [expected_test]
                additionalProperties: false
                properties:
                  expected_test: {type: string, minLength: 1, maxLength: 400}
            validation: {kind: json_schema}
        - operation:
            tool: internal
            command: [merge_semantic_design]
            parameters:
              kind: {type: reference, value: semantic_kind.kind}
              description: {type: reference, value: semantic_obligation.description}
              acceptance_criterion: {type: reference, value: semantic_obligation.acceptance_criterion}
              expected_test: {type: reference, value: semantic_test_contract.expected_test}
            returns:
              type: object
              required: [kind, description, acceptance_criterion, expected_test]
              properties:
                kind: {type: string}
                description: {type: string}
                acceptance_criterion: {type: string}
                expected_test: {type: string}
            bind: semantic_design
  - operation:
      tool: internal
      command: [compile_canonical_feature_design]
      parameters:
        work_item_name: {type: reference, value: work_item_name}
        design_decisions: {type: reference, value: semantic_designs}
      returns:
        type: object
        required: [path, fingerprint, obligations, required_test_cases]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          obligations: {type: array, minItems: 1}
          required_test_cases: {type: array, minItems: 1}
      bind: feature_design
  - terminal: succeeded
