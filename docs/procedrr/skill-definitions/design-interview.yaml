version: 1
name: design-interview
description: >-
  Compile the feature request into one deterministic instruction ledger,
  decompose every multi-requirement clause through bounded single-decision
  questions, then ask one bounded semantic question at a time to define each
  atomic clause's durable obligation and verification shape. The compiler owns
  identity, references, selectors, fingerprints, executable test contracts,
  and aggregation.
inputs:
  - {name: work_item_name, type: string, required: true}
  - {name: feature_description, type: string, required: true}
outputs:
  feature_design:
    type: object
    required: [path, fingerprint, obligations, verification_contracts, required_test_cases]
    additionalProperties: false
    properties:
      path:
        type: string
        x-powdrr-type: SchematizedPath
        minLength: 1
        x-powdrr-schema:
          type: object
          required: [schema_version, fingerprint, obligations, verification_contracts, required_test_cases]
          additionalProperties: false
      fingerprint: {type: string, minLength: 1}
      obligations:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, description, design]
          additionalProperties: false
          properties:
            id: {type: string, minLength: 1}
            description: {type: string, minLength: 1}
            design: {type: object}
      verification_contracts:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, obligation_ref, population, operation, oracle, evidence_case]
          additionalProperties: false
          properties:
            id: {type: string, minLength: 1}
            obligation_ref: {type: string, minLength: 1}
            population: {type: string, minLength: 1}
            operation: {type: string, minLength: 1}
            oracle: {type: string, minLength: 1}
            evidence_case: {type: string, minLength: 1}
      required_test_cases:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, description, intent_refs, provider, profile, name_hint, selector, expectation, applicability, status]
          additionalProperties: false
          properties:
            id: {type: string, minLength: 1}
            description: {type: string, minLength: 1}
            intent_refs: {type: array, minItems: 1, items: {type: string, minLength: 1}}
            provider: {type: string, minLength: 1}
            profile: {type: string, minLength: 1}
            name_hint: {type: string, minLength: 1}
            selector: {type: string, minLength: 1}
            expectation: {type: string, enum: [pass]}
            applicability: {type: object}
            status: {type: string, enum: [active]}
steps:
  - operation:
      tool: internal
      command: [compile_instruction_ledger]
      parameters:
        work_item_name: {type: reference, value: work_item_name}
        feature_description: {type: reference, value: feature_description}
      returns:
        type: object
        required: [path, fingerprint, clauses]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          clauses: {type: array, minItems: 1}
      bind: instruction_ledger
  - for_each:
      snapshot: {name: instruction_ledger.clauses, max_items: 128}
      item_binding: atomicity_clause
      collect: {binding: atomicity_decisions, mode: list, value: atomicity_decision}
      body:
        - judge:
            kind: classify_one
            provider: planning
            question: Does this one instruction clause contain more than one independently verifiable requirement?
            subject: atomicity_clause.text
            prompt_system: Return only the declared JSON object.
            instructions:
              - Answer true only when this clause requires two or more behaviors, APIs, constraints, lifecycle events, error cases, or observable results that could be verified separately.
              - Answer false when the clause expresses one behavior with its necessary condition, value, or outcome.
              - Do not rewrite, classify, design, prioritize, or propose implementation work.
              - Do not return IDs, references, selectors, hashes, fingerprints, or statements.
              - >-
                Example: "On entry, data initializes as a fresh copy of the defaults."
                contains one requirement, so multiple is false.
              - >-
                Example: "On exit, data is removed. Re-entering a state resets data
                to the original defaults." is already two clauses and each is judged
                separately; do not combine neighboring clauses.
              - >-
                Example: "set_state_data validates active state, declared key, and
                DataVar type constraints, raising InvalidDefinition on violation."
                contains independently verifiable validations and an error outcome, so
                multiple is true.
            context: [atomicity_clause]
            output:
              name: atomicity_decision
              schema:
                type: object
                required: [multiple]
                additionalProperties: false
                properties:
                  multiple: {type: boolean}
            validation: {kind: json_schema}
  - operation:
      tool: internal
      command: [prepare_atomicity_split_requests]
      parameters:
        decisions: {type: reference, value: atomicity_decisions}
      returns:
        type: object
        required: [split_requests]
        properties:
          split_requests: {type: array}
      bind: atomicity_plan
  - for_each:
      snapshot: {name: atomicity_plan.split_requests, max_items: 128}
      item_binding: atomicity_split_request
      collect: {binding: atomicity_splits, mode: list, value: atomicity_split}
      body:
        - judge:
            kind: construct_one
            provider: planning
            question: What are the smallest independently verifiable requirements contained in this one instruction clause?
            subject: atomicity_split_request.clause.text
            prompt_system: Return only the declared JSON object.
            instructions:
              - Return an ordered list of 2 to 8 short statements, and nothing else.
              - Each statement must express exactly one behavior, API result, constraint, lifecycle event, error condition, or prohibition that can be verified separately.
              - Preserve every concrete API name, value, condition, constraint, and required error from the source clause.
              - Do not add requirements, choose implementation details, weaken a requirement, or infer an opposite behavior.
              - Do not return IDs, references, selectors, hashes, fingerprints, source spans, or parent fields; Powdrr assigns structure.
              - >-
                Example source: "set_state_data validates active state, declared key,
                and DataVar type constraints, raising InvalidDefinition on violation."
              - >-
                Example statements: ["set_state_data rejects an inactive state.",
                "set_state_data rejects an undeclared key.", "set_state_data enforces
                the declared DataVar type constraint.", "An invalid set_state_data
                call raises InvalidDefinition."]
            context: [atomicity_split_request]
            output:
              name: atomicity_split
              schema:
                type: object
                required: [statements]
                additionalProperties: false
                properties:
                  statements:
                    type: array
                    minItems: 2
                    maxItems: 8
                    items: {type: string, minLength: 1, maxLength: 500}
            validation: {kind: json_schema}
  - operation:
      tool: internal
      command: [apply_atomicity_splits]
      parameters:
        decisions: {type: reference, value: atomicity_decisions}
        splits: {type: reference, value: atomicity_splits}
      returns:
        type: object
        required: [path, fingerprint, clauses]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          clauses: {type: array, minItems: 1}
      bind: atomic_instruction_ledger
  - for_each:
      snapshot: {name: atomic_instruction_ledger.clauses, max_items: 128}
      item_binding: instruction_clause
      collect: {binding: semantic_designs, mode: list, value: semantic_design}
      body:
        - judge:
            kind: classify_one
            provider: planning
            question: What kind of obligation does this instruction clause express?
            subject: instruction_clause.text
            prompt_system: Return only the declared JSON object.
            instructions:
              - Classify only this clause as entity, feature, interface, invariant, guidance, non_goal, or nonactionable.
              - Use nonactionable for process, tooling, delivery, or meta-instructions that do not describe product behavior. Examples include "create a branch from main", "commit everything", "open a PR", "run this with tool X", and "report the result".
              - A statement that a capability is missing, manual, unsafe, or currently absent is not nonactionable; it is feature context when the surrounding request asks for that capability.
              - Treat a universal behavioral rule as an invariant when it uses words such as "all", "every", "always", "must", or "should" to require behavior across an existing population. The words "should" and "must" do not by themselves make a clause a feature.
              - Use non_goal only for an explicit product prohibition or scope exclusion, such as "do not change the transport" or "this feature must not add retries". Do not infer a non-goal from words such as "lacks", "without", or "manual".
              - Do not return IDs, references, selectors, hashes, or fingerprints; Powdrr assigns them.
              - >-
                Examples: "A saved report has an owner and a timestamp" → entity.
              - >-
                Examples: "Users can export a report as CSV" → feature.
              - >-
                Examples: "The export endpoint accepts a report ID and returns CSV" → interface.
              - >-
                Examples: "A report can always be loaded after it is saved" → invariant.
              - >-
                Examples: "All persisted data entities should support pickle round-tripping" → invariant.
              - >-
                Examples: "Every API response must include a request ID" → invariant.
              - >-
                Counterexample: "Add CSV export for users" → feature; it requests a new capability rather than a rule that must hold for an existing population.
              - >-
                Examples: "Prefer the existing repository serialization helper" → guidance.
              - >-
                Examples: "Do not add retries to report exports" → non_goal.
              - >-
                Examples: "Open a PR after the implementation" → nonactionable.
              - >-
                Counterexample: "The exporter currently has no retry handling" is feature context when the request asks to add retry handling; it is not nonactionable or automatically a non_goal.
            context: [feature_description, instruction_clause]
            output:
              name: semantic_kind
              schema:
                type: object
                required: [kind]
                additionalProperties: false
                properties:
                  kind:
                    type: string
                    enum: [entity, feature, interface, invariant, guidance, non_goal, nonactionable]
            validation: {kind: json_schema}
        - judge:
            kind: construct_one
            provider: planning
            question: What is the one concrete semantic obligation expressed by this instruction clause?
            subject: instruction_clause.text
            prompt_system: Return only the declared JSON object.
            instructions:
              - Use the supplied kind classification and translate only this clause into one semantic obligation.
              - If the kind is nonactionable, produce a trace-only disposition; it must not describe an implementation obligation or a required test.
              - For a normal clause, write description as one short imperative sentence naming one behavior, API, invariant, or constraint to implement.
              - Preserve concrete names, values, conditions, and prohibitions from the clause, but do not explain, summarize, enumerate scenarios, or add design choices not present in the clause.
              - Do not return IDs, references, selectors, hashes, or fingerprints; Powdrr assigns them.
              - >-
                Examples: "Users can export reports" → "Allow users to export reports."
              - >-
                Examples: "All data should pickle" → "Make every applicable data entity support pickle round-tripping."
              - >-
                Examples: "Do not change the transport" → "Do not implement transport changes."
              - >-
                Counterexample: do not turn one clause into a list of implementation tasks such as "add a class, add a route, add tests".
            prompt_rules:
              - when: {binding: semantic_kind.kind, equals: non_goal}
                instructions:
                  - Treat this as an explicit non-goal, not an implementation task.
                  - Write description as one short sentence beginning with "Do not implement" that names only the excluded behavior.
              - when: {binding: semantic_kind.kind, equals: nonactionable}
                instructions:
                  - State that the clause is ignored as a process or meta-instruction and must not become a product obligation or test contract.
            context: [feature_description, instruction_clause, semantic_kind]
            output:
              name: semantic_obligation
              schema:
                type: object
                required: [description]
                additionalProperties: false
                properties:
                  description: {type: string, minLength: 1, maxLength: 500}
            validation: {kind: json_schema}
        - judge:
            kind: construct_one
            provider: planning
            question: What one observable result would prove this one semantic obligation?
            subject: semantic_obligation.description
            prompt_system: Return only the declared JSON object.
            instructions:
              - Write one short observable assertion that proves only the supplied obligation.
              - State the required result, not the operation used to produce it and not implementation mechanics.
              - Preserve concrete names, values, conditions, and prohibitions from the clause.
              - Do not return IDs, references, selectors, hashes, or fingerprints; Powdrr assigns them.
              - >-
                Examples: obligation "users can export reports" → "The requested report is returned in the requested export format."
              - >-
                Examples: obligation "all data supports pickle round-tripping" → "The restored value has the same semantic state as the original value."
              - >-
                Examples: obligation "do not add retries" → "A failed export produces no retry attempt."
              - >-
                Counterexample: do not write "the implementation is correct"; that is not an observable result.
            prompt_rules:
              - when: {binding: semantic_kind.kind, equals: non_goal}
                instructions: ["State one observable result proving the excluded behavior was not introduced."]
              - when: {binding: semantic_kind.kind, equals: nonactionable}
                instructions: ["Return a trace-only statement: this clause has no product acceptance result."]
            context: [feature_description, instruction_clause, semantic_kind, semantic_obligation]
            output:
              name: semantic_acceptance
              schema:
                type: object
                required: [acceptance_criterion]
                additionalProperties: false
                properties:
                  acceptance_criterion: {type: string, minLength: 1, maxLength: 500}
            validation: {kind: json_schema}
        - judge:
            kind: construct_one
            provider: planning
            question: What exact population of subjects does this one obligation apply to?
            subject: instruction_clause.text
            prompt_system: Return only the declared JSON object.
            instructions:
              - Describe only the complete set of subjects quantified by this obligation.
              - For a singular obligation, name the one subject or invocation class to which it applies.
              - For a universal obligation such as "all data should pickle", identify the category whose current and future members must be enumerated.
              - Do not choose repository files, symbols, fixtures, commands, selectors, or implementation tasks.
              - Do not return IDs, references, selectors, hashes, or fingerprints; Powdrr assigns them.
              - >-
                Examples: "all data should pickle" → "every persisted domain-data entity registered by Structrr."
              - >-
                Examples: "users can export reports" → "each supported report export request."
              - >-
                Examples: "the export endpoint accepts report IDs" → "all requests handled by the report export interface."
              - >-
                Examples: "do not add retries to exports" → "all failed report export attempts."
              - >-
                Counterexample: "the Report class in reports.py" is an implementation location, not a subject population.
            prompt_rules:
              - when: {binding: semantic_kind.kind, equals: non_goal}
                instructions:
                  - Identify the population across which absence of the excluded behavior must be checked.
              - when: {binding: semantic_kind.kind, equals: nonactionable}
                instructions: ["Return a trace-only statement: this clause has no product subject population."]
            context: [feature_description, instruction_clause, semantic_kind, semantic_obligation, semantic_acceptance]
            output:
              name: semantic_population
              schema:
                type: object
                required: [population]
                additionalProperties: false
                properties:
                  population: {type: string, minLength: 1, maxLength: 400}
            validation: {kind: json_schema}
        - judge:
            kind: construct_one
            provider: planning
            question: What single observable operation exercises this one obligation?
            subject: semantic_obligation.description
            prompt_system: Return only the declared JSON object.
            instructions:
              - Name one externally observable operation applied to one member of the supplied population.
              - Describe the stimulus or action, not the expected result and not implementation mechanics.
              - Do not provide test code, repository paths, commands, selectors, IDs, hashes, or fingerprints.
              - >-
                Examples: population "persisted domain-data entities" → "pickle.dumps followed by pickle.loads on one valid entity instance."
              - >-
                Examples: population "supported report export requests" → "submit one export request for a supported report and format."
              - >-
                Examples: population "failed export attempts" → "cause one export attempt to fail and observe the resulting request behavior."
              - >-
                Counterexample: "edit reports.py" is an implementation action, not an observable operation.
            prompt_rules:
              - when: {binding: semantic_kind.kind, equals: non_goal}
                instructions: ["Name the one operation during which the excluded behavior could otherwise appear."]
              - when: {binding: semantic_kind.kind, equals: nonactionable}
                instructions: ["Return a trace-only statement: this clause has no product operation."]
            context: [feature_description, instruction_clause, semantic_kind, semantic_obligation, semantic_acceptance, semantic_population]
            output:
              name: semantic_operation
              schema:
                type: object
                required: [operation]
                additionalProperties: false
                properties:
                  operation: {type: string, minLength: 1, maxLength: 400}
            validation: {kind: json_schema}
        - judge:
            kind: construct_one
            provider: planning
            question: What single observable predicate proves this one obligation for one population member?
            subject: semantic_acceptance.acceptance_criterion
            prompt_system: Return only the declared JSON object.
            instructions:
              - State one pass/fail predicate over the result of the supplied operation.
              - Include the required equivalence or comparison semantics when success means preserving state.
              - Do not add another behavior, operation, scenario, or implementation choice.
              - Do not provide test code, repository paths, commands, selectors, IDs, hashes, or fingerprints.
              - >-
                Examples: pickle round-trip → "loads(dumps(value)) is semantically equivalent to value."
              - >-
                Examples: report export → "The response status is successful and its body contains the requested report in the requested format."
              - >-
                Examples: no-retry invariant → "The count of retry attempts remains zero after the initial failure."
              - >-
                Counterexample: "the test passes" is not an oracle because it does not state what the test must prove.
            prompt_rules:
              - when: {binding: semantic_kind.kind, equals: non_goal}
                instructions: ["State the one predicate proving the excluded behavior is absent."]
              - when: {binding: semantic_kind.kind, equals: nonactionable}
                instructions: ["Return a trace-only statement: this clause has no product success predicate."]
            context: [feature_description, instruction_clause, semantic_kind, semantic_obligation, semantic_acceptance, semantic_population, semantic_operation]
            output:
              name: semantic_oracle
              schema:
                type: object
                required: [oracle]
                additionalProperties: false
                properties:
                  oracle: {type: string, minLength: 1, maxLength: 400}
            validation: {kind: json_schema}
        - judge:
            kind: construct_one
            provider: planning
            question: What one concrete evidence case demonstrates this operation and predicate?
            subject: semantic_obligation.description
            prompt_system: Return only the declared JSON object.
            instructions:
              - Describe one representative input or setup, the supplied operation, and the supplied predicate.
              - This is an evidence example from which Powdrr compiles executable contracts; it is not the complete population and does not prove universal coverage by itself.
              - Do not provide test code, a multi-step test plan, repository paths, commands, selectors, IDs, hashes, or fingerprints.
              - >-
                Examples: pickle → "Construct one UserRecord with representative fields, round-trip it, and compare its semantic fields."
              - >-
                Examples: report export → "Submit an export request for a report containing two rows and verify the returned CSV contains both rows."
              - >-
                Examples: no retries → "Use a transport that fails once, invoke one export, and verify only one transport call occurred."
              - >-
                Counterexample: "run the full test suite" is not an evidence case; it does not identify a subject, operation, or oracle.
            prompt_rules:
              - when: {binding: semantic_kind.kind, equals: non_goal}
                instructions: ["Describe one evidence case that would detect introduction of the excluded behavior."]
              - when: {binding: semantic_kind.kind, equals: nonactionable}
                instructions: ["Return a trace-only statement: no product evidence case is required."]
            context: [feature_description, instruction_clause, semantic_kind, semantic_obligation, semantic_acceptance, semantic_population, semantic_operation, semantic_oracle]
            output:
              name: semantic_evidence_case
              schema:
                type: object
                required: [evidence_case]
                additionalProperties: false
                properties:
                  evidence_case: {type: string, minLength: 1, maxLength: 500}
            validation: {kind: json_schema}
        - operation:
            tool: internal
            command: [merge_semantic_design]
            parameters:
              kind: {type: reference, value: semantic_kind.kind}
              description: {type: reference, value: semantic_obligation.description}
              acceptance_criterion: {type: reference, value: semantic_acceptance.acceptance_criterion}
              population: {type: reference, value: semantic_population.population}
              operation: {type: reference, value: semantic_operation.operation}
              oracle: {type: reference, value: semantic_oracle.oracle}
              evidence_case: {type: reference, value: semantic_evidence_case.evidence_case}
            returns:
              type: object
              required: [kind, description, acceptance_criterion, population, operation, oracle, evidence_case]
              properties:
                kind: {type: string}
                description: {type: string}
                acceptance_criterion: {type: string}
                population: {type: string}
                operation: {type: string}
                oracle: {type: string}
                evidence_case: {type: string}
            bind: semantic_design
  - operation:
      tool: internal
      command: [compile_canonical_feature_design]
      parameters:
        work_item_name: {type: reference, value: work_item_name}
        design_decisions: {type: reference, value: semantic_designs}
      returns:
        type: object
        required: [path, fingerprint, obligations, verification_contracts, required_test_cases]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          obligations: {type: array, minItems: 1}
          verification_contracts: {type: array, minItems: 1}
          required_test_cases: {type: array, minItems: 1}
      bind: feature_design
  - terminal: succeeded
