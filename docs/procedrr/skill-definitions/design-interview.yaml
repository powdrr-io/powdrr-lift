version: 1
name: design-interview
description: >-
  Compile the feature request into one deterministic instruction ledger,
  decompose every multi-requirement clause through bounded single-decision
  questions, then ask one bounded semantic question at a time to define each
  atomic clause's durable obligation and verification shape. The compiler owns
  identity, references, selectors, fingerprints, executable test contracts,
  and aggregation.
inputs:
  - {name: work_item_name, type: string, required: true}
  - {name: feature_description, type: string, required: true}
outputs:
  feature_design:
    type: object
    required: [path, fingerprint, obligations, verification_contracts, required_test_cases]
    additionalProperties: false
    properties:
      path:
        type: string
        x-powdrr-type: SchematizedPath
        minLength: 1
        x-powdrr-schema:
          type: object
          required: [schema_version, fingerprint, obligations, verification_contracts, required_test_cases]
          additionalProperties: false
      fingerprint: {type: string, minLength: 1}
      obligations:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, description, design]
          additionalProperties: false
          properties:
            id: {type: string, minLength: 1}
            description: {type: string, minLength: 1}
            design: {type: object}
      verification_contracts:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, obligation_ref, population, operation, oracle, evidence_case]
          additionalProperties: false
          properties:
            id: {type: string, minLength: 1}
            obligation_ref: {type: string, minLength: 1}
            population: {type: string, minLength: 1}
            operation: {type: string, minLength: 1}
            oracle: {type: string, minLength: 1}
            evidence_case: {type: string, minLength: 1}
      required_test_cases:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, description, intent_refs, provider, profile, name_hint, selector, expectation, applicability, status]
          additionalProperties: false
          properties:
            id: {type: string, minLength: 1}
            description: {type: string, minLength: 1}
            intent_refs: {type: array, minItems: 1, items: {type: string, minLength: 1}}
            provider: {type: string, minLength: 1}
            profile: {type: string, minLength: 1}
            name_hint: {type: string, minLength: 1}
            selector: {type: string, minLength: 1}
            expectation: {type: string, enum: [pass]}
            applicability: {type: object}
            status: {type: string, enum: [active]}
steps:
  - operation:
      tool: internal
      command: [compile_instruction_ledger]
      parameters:
        work_item_name: {type: reference, value: work_item_name}
        feature_description: {type: reference, value: feature_description}
      returns:
        type: object
        required: [path, fingerprint, clauses]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          clauses: {type: array, minItems: 1}
      bind: instruction_ledger
  - for_each:
      snapshot: {name: instruction_ledger.clauses, max_items: 128}
      item_binding: atomicity_clause
      collect: {binding: atomicity_decisions, mode: list, value: atomicity_decision}
      body:
        - judge:
            kind: classify_one
            provider: planning
            question: Does this one instruction clause contain more than one independently verifiable requirement?
            subject: atomicity_clause.text
            prompt_system: Return only the declared JSON object.
            instructions:
              - Answer true only when this clause requires two or more behaviors, APIs, constraints, lifecycle events, error cases, or observable results that could be verified separately.
              - Answer false when the clause expresses one behavior with its necessary condition, value, or outcome.
              - Do not rewrite, classify, design, prioritize, or propose implementation work.
              - Do not return IDs, references, selectors, hashes, fingerprints, or statements.
              - >-
                Example: "On entry, data initializes as a fresh copy of the defaults."
                contains one requirement, so multiple is false.
              - >-
                Example: "On exit, data is removed. Re-entering a state resets data
                to the original defaults." is already two clauses and each is judged
                separately; do not combine neighboring clauses.
              - >-
                Example: "set_state_data validates active state, declared key, and
                DataVar type constraints, raising InvalidDefinition on violation."
                contains independently verifiable validations and an error outcome, so
                multiple is true.
            context: [atomicity_clause]
            output:
              name: atomicity_decision
              schema:
                type: object
                required: [multiple]
                additionalProperties: false
                properties:
                  multiple: {type: boolean}
            validation: {kind: json_schema}
  - operation:
      tool: internal
      command: [prepare_atomicity_split_requests]
      parameters:
        decisions: {type: reference, value: atomicity_decisions}
      returns:
        type: object
        required: [split_requests]
        properties:
          split_requests: {type: array}
      bind: atomicity_plan
  - for_each:
      snapshot: {name: atomicity_plan.split_requests, max_items: 128}
      item_binding: atomicity_split_request
      collect: {binding: atomicity_splits, mode: list, value: atomicity_split}
      body:
        - judge:
            kind: construct_one
            provider: planning
            question: What are the smallest independently verifiable requirements contained in this one instruction clause?
            subject: atomicity_split_request.clause.text
            prompt_system: Return only the declared JSON object.
            instructions:
              - Return an ordered list of 2 to 8 short statements, and nothing else.
              - Each statement must express exactly one behavior, API result, constraint, lifecycle event, error condition, or prohibition that can be verified separately.
              - Preserve every concrete API name, value, condition, constraint, and required error from the source clause.
              - Do not add requirements, choose implementation details, weaken a requirement, or infer an opposite behavior.
              - Do not return IDs, references, selectors, hashes, fingerprints, source spans, or parent fields; Powdrr assigns structure.
              - >-
                Example source: "set_state_data validates active state, declared key,
                and DataVar type constraints, raising InvalidDefinition on violation."
              - >-
                Example statements: ["set_state_data rejects an inactive state.",
                "set_state_data rejects an undeclared key.", "set_state_data enforces
                the declared DataVar type constraint.", "An invalid set_state_data
                call raises InvalidDefinition."]
            context: [atomicity_split_request]
            output:
              name: atomicity_split
              schema:
                type: object
                required: [statements]
                additionalProperties: false
                properties:
                  statements:
                    type: array
                    minItems: 2
                    maxItems: 8
                    items: {type: string, minLength: 1, maxLength: 500}
            validation: {kind: json_schema}
  - operation:
      tool: internal
      command: [apply_atomicity_splits]
      parameters:
        decisions: {type: reference, value: atomicity_decisions}
        splits: {type: reference, value: atomicity_splits}
      returns:
        type: object
        required: [path, fingerprint, clauses]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          clauses: {type: array, minItems: 1}
      bind: atomic_instruction_ledger
  - for_each:
      snapshot: {name: atomic_instruction_ledger.clauses, max_items: 128}
      item_binding: instruction_clause
      collect: {binding: semantic_designs, mode: list, value: semantic_design}
      body:
        - operation:
            tool: internal
            command: [prepare_source_semantic_decisions]
            parameters:
              clause: {type: reference, value: instruction_clause}
            returns:
              type: object
              required: [resolved_decisions, pending_specs]
              additionalProperties: false
              properties:
                resolved_decisions: {type: array}
                pending_specs: {type: array}
            bind: semantic_decision_plan
        - for_each:
            snapshot: {name: semantic_decision_plan.pending_specs, max_items: 16}
            item_binding: semantic_decision_request
            collect: {binding: semantic_decision_results, mode: list, value: semantic_decision_result}
            body:
              - judge:
                  kind: classify_one
                  provider: planning
                  question: Resolve only the one semantic classification specified in this request.
                  subject: semantic_decision_request.subject_text
                  prompt_system: Return only the declared JSON object.
                  instructions:
                    - Follow the request's question, instructions, and allowed_values exactly.
                    - Return resolved with exactly one allowed value when the source supports it.
                    - Return unresolved with a closed reason_code when the source does not support one value.
                    - Never return IDs, evidence, provenance, source spans, explanations, confidence, or additional fields.
                  context: [semantic_decision_request]
                  output:
                    name: semantic_decision_result
                    schema:
                      type: object
                      required: [status, value, reason_code]
                      additionalProperties: false
                      properties:
                        status: {type: string, enum: [resolved, unresolved]}
                        value:
                          type: [string, 'null']
                          enum: [entity, feature, interface, invariant, guidance, non_goal, nonactionable, required, prohibited, permitted, descriptive, one, some, every, unspecified, must, should, may, present, absent, current, future, current_and_future, event_bound, explicit, implied_by_registered_term, not_stated, process_only, product_semantics_present, mixed, null]
                        reason_code:
                          type: [string, 'null']
                          enum: [source_ambiguous, source_underspecified, no_candidate, multiple_candidates, repository_evidence_missing, unsupported_concept, classifier_abstained, invalid_response, conflicting_evidence, null]
                  validation: {kind: json_schema}
        - operation:
            tool: internal
            command: [bind_source_semantic_decisions]
            parameters:
              clause: {type: reference, value: instruction_clause}
              plan: {type: reference, value: semantic_decision_plan}
              results: {type: reference, value: semantic_decision_results}
            returns:
              type: object
              required: [path, decisions]
              properties:
                path: {type: string, minLength: 1}
                decisions: {type: array, minItems: 1}
            bind: bound_semantic_decisions
        - operation:
            tool: internal
            command: [prepare_source_extractions]
            parameters:
              clause: {type: reference, value: instruction_clause}
              decisions: {type: reference, value: bound_semantic_decisions.decisions}
            returns:
              type: object
              required: [requests]
              properties:
                requests: {type: array, minItems: 2, maxItems: 5}
            bind: source_extraction_plan
        - for_each:
            snapshot: {name: source_extraction_plan.requests, max_items: 5}
            item_binding: source_extraction_request
            collect: {binding: source_extraction_results, mode: list, value: source_extraction_result}
            body:
              - judge:
                  kind: construct_one
                  provider: planning
                  question: Copy only the one exact source span specified in this extraction request.
                  subject: source_extraction_request.spec.proposition_text
                  prompt_system: Return only the declared JSON object.
                  instructions:
                    - Follow the request's question and instructions exactly.
                    - quote must be a non-empty, case-sensitive, exact substring of the proposition.
                    - occurrence is one-based when the same quote occurs more than once; otherwise return null.
                    - Never paraphrase, normalize, explain, or return IDs, spans, fingerprints, or extra fields.
                  context: [source_extraction_request]
                  output:
                    name: source_extraction_result
                    schema:
                      type: object
                      required: [quote, occurrence]
                      additionalProperties: false
                      properties:
                        quote: {type: string, minLength: 1, maxLength: 500}
                        occurrence: {type: [integer, 'null'], minimum: 1}
                  validation: {kind: json_schema}
        - operation:
            tool: internal
            command: [bind_source_extractions]
            parameters:
              clause: {type: reference, value: instruction_clause}
              requests: {type: reference, value: source_extraction_plan.requests}
              results: {type: reference, value: source_extraction_results}
            returns:
              type: object
              required: [path, extractions]
              properties:
                path: {type: string, minLength: 1}
                extractions: {type: array, minItems: 2, maxItems: 5}
            bind: bound_source_extractions
        - operation:
            tool: internal
            command: [prepare_behavior_family_decision]
            parameters:
              clause: {type: reference, value: instruction_clause}
              extractions: {type: reference, value: bound_source_extractions.extractions}
            returns:
              type: object
              required: [spec, question, instructions, allowed_values, subject_text]
              properties:
                spec: {type: object}
                question: {type: string, minLength: 1}
                instructions: {type: array, minItems: 1}
                allowed_values: {type: array, minItems: 1}
                subject_text: {type: string, minLength: 1}
            bind: behavior_family_request
        - judge:
            kind: classify_one
            provider: planning
            question: Classify only the extracted behavior into one registered behavior family.
            subject: behavior_family_request.subject_text
            prompt_system: Return only the declared JSON object.
            instructions:
              - Follow the request's question, instructions, and allowed_values exactly.
              - Return resolved with one allowed value or unresolved with one closed reason_code.
              - Do not infer a broader behavior, implementation, predicate, or repository identity.
              - Never return IDs, evidence, provenance, explanations, confidence, or extra fields.
            context: [behavior_family_request]
            output:
              name: behavior_family_result
              schema:
                type: object
                required: [status, value, reason_code]
                additionalProperties: false
                properties:
                  status: {type: string, enum: [resolved, unresolved]}
                  value:
                    type: [string, 'null']
                    enum: [create, read, update, delete, list, search, validate, transform, serialize, deserialize, round_trip, persist, retrieve, compare, invoke, emit, receive, authorize, authenticate, retry, render, configure, other, null]
                  reason_code:
                    type: [string, 'null']
                    enum: [source_ambiguous, source_underspecified, no_candidate, multiple_candidates, repository_evidence_missing, unsupported_concept, classifier_abstained, invalid_response, conflicting_evidence, null]
            validation: {kind: json_schema}
        - operation:
            tool: internal
            command: [compile_partial_semantic_contract]
            parameters:
              clause: {type: reference, value: instruction_clause}
              decisions: {type: reference, value: bound_semantic_decisions.decisions}
              extractions: {type: reference, value: bound_source_extractions.extractions}
              behavior_family_request: {type: reference, value: behavior_family_request}
              behavior_family_result: {type: reference, value: behavior_family_result}
            returns:
              type: object
              required: [kind, description, acceptance_criterion, expected_test, population, operation, oracle, evidence_case, partial_contract_path, partial_contract_fingerprint]
              additionalProperties: false
              properties:
                kind: {type: string}
                description: {type: string}
                acceptance_criterion: {type: string}
                expected_test: {type: string}
                population: {type: string}
                operation: {type: string}
                oracle: {type: string}
                evidence_case: {type: string}
                partial_contract_path: {type: string, minLength: 1}
                partial_contract_fingerprint: {type: string, minLength: 1}
            bind: semantic_design
  - operation:
      tool: internal
      command: [compile_canonical_feature_design]
      parameters:
        work_item_name: {type: reference, value: work_item_name}
        design_decisions: {type: reference, value: semantic_designs}
      returns:
        type: object
        required: [path, fingerprint, obligations, verification_contracts, required_test_cases]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          obligations: {type: array, minItems: 1}
          verification_contracts: {type: array, minItems: 1}
          required_test_cases: {type: array, minItems: 1}
      bind: feature_design
  - terminal: succeeded
