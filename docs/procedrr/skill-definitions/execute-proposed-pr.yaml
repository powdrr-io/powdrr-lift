version: 1
name: execute-proposed-pr
inputs:
  - {name: work_item_name, type: string, required: true}
  - {name: proposed_pr_id, type: string, required: true}
  - {name: feature_description, type: string, required: true}
description: >-
  Execute one proposed PR through planning, a Workrr-validated JSON Procedrr
  implementation fragment, mechanical validation, and completeness, invariant,
  and security review.
limits: {llm_activations: 128, tool_calls: 256, max_epochs: 3, context_chars: 24000, context_value_chars: 6000}
steps:
  - operation:
      tool: internal
      command: [powdrr-lift, show-proposed-pr, "${proposed_pr_id}"]
      bind: proposed_pr
  - operation:
      tool: gather_context
      parameters:
        types: [requirements, approach, entities, modules, tools, invariants]
        feature_id: "${work_item_name}"
      bind: repository_context
  - operation:
      tool: read_document
      parameters:
        file_path: docs/proposals/${work_item_name}/proposed-pr-specification.yaml
      bind: proposed_pr_source
  - operation:
      tool: read_document
      parameters:
        file_path: docs/proposals/${work_item_name}/implementation-specification.yaml
      bind: implementation_specification_source
  - operation:
      tool: invoke_tool
      parameters:
        tool: basedpyright
        paths: [src]
      bind: initial_static_analysis
  - judge:
      kind: request_source
      question: Which exact repository files must be read before planning this proposed PR?
      subject: repository_context
      prompt_system: Return only the declared JSON object.
      instructions:
        - Request only files needed to resolve symbols, interfaces, and integration points.
        - Use repository-relative paths and give a reason for every request.
        - Request no more than 16 files.
      context: [proposed_pr, repository_context, proposed_pr_source, implementation_specification_source]
      output:
        name: planning_source_request
        schema:
          type: object
          required: [file_path, reason]
          additionalProperties: false
          properties:
            file_path: {type: string, minLength: 1}
            reason: {type: string, minLength: 1}
      validation: {kind: json_schema}
  - operation:
      tool: read_document
      parameters: {file_path: "${planning_source_request.file_path}"}
      bind: source_document
  - judge:
      kind: construct_one
      question: What is the smallest ordered implementation plan for this proposed PR?
      subject: proposed_pr
      prompt_system: >-
        You are the implementation planner. Return only the declared JSON
        object. Every action must be independently executable and scoped to the
        proposed PR.
      instructions:
        - Use the proposed PR and gathered repository context as the only evidence.
        - Name exact repository-relative files for every coding action.
        - Order actions so each action leaves the tree buildable and testable.
        - Include the command-level validation needed after the actions.
        - Do not include unrelated refactors or speculative work.
      context: [work_item_name, proposed_pr_id, feature_description, proposed_pr, proposed_pr_source, implementation_specification_source, repository_context, source_document, initial_static_analysis]
      output:
        name: implementation_plan
        schema:
          type: object
          required: [validation_commands, acceptance_conditions]
          additionalProperties: false
          properties:
            validation_commands:
              type: array
              minItems: 1
              maxItems: 16
              items: {type: array, items: {type: string, minLength: 1}}
            acceptance_conditions:
              type: array
              minItems: 1
              items: {type: string, minLength: 1}
      validation: {kind: json_schema}
  - specialize:
      process: generate-fragment
      max_steps: 32
      question: >-
        Generate the validated Procedrr implementation fragment for this
        proposed feature. The fragment must inspect source on demand, make one
        edit decision at a time, validate each edit, repair failures, and finish
        only after all acceptance conditions are evidenced.
      context: [work_item_name, proposed_pr_id, feature_description, implementation_plan, repository_context, source_document, initial_static_analysis]
      allowed_tools: [gather_context, internal, edit, read_document, invoke_tool, list_files]
      bind: implementation_program
  - call:
      fragment: "${implementation_program}"
      max_steps: 128
  - for_each:
      snapshot: {name: implementation_plan.validation_commands, max_items: 16}
      item_binding: validation_command
      collect: {binding: current_validation_results, mode: list, key: command, value: validation_result}
      body:
        - operation:
            tool: internal
            parameters: {command: "${validation_command}"}
            bind: validation_result
  - for_each:
      snapshot: {name: current_validation_results, max_items: 16}
      item_binding: validation_record
      collect: {binding: repair_actions, mode: list, value: repair_action}
      body:
        - branch:
            subject: validation_record.result.returncode
            cases:
              0: []
            default:
              - judge:
                  kind: plan_one_repair
                  question: What is the smallest safe repair for this one validation failure?
                  subject: validation_record
                  prompt_system: >-
                    Return only the declared JSON object. Return one concrete
                    one-based inclusive line edit. The valid response shape is
                    {"file_path":"test_hello.py","start":7,"end":7,"new_text":"    assert ..."}.
                  instructions:
                    - Use only this validation record as failure evidence.
                    - Return the exact one-based line range and replacement text.
                  context: [feature_description, validation_record]
                  output:
                    name: repair_action
                    schema:
                      type: object
                      required: [file_path, start, end, new_text]
                      additionalProperties: false
                      properties:
                        file_path: {type: string, minLength: 1}
                        start: {type: integer, minimum: 1}
                        end: {type: integer, minimum: 1}
                        new_text: {type: string, minLength: 1}
                  validation: {kind: json_schema}
              - operation:
                  tool: edit
                  parameters:
                    file_path: "${repair_action.file_path}"
                    edits:
                      - start: "${repair_action.start}"
                        end: "${repair_action.end}"
                        new_text: "${repair_action.new_text}"
                  bind: repair_result
  - operation:
      tool: gather_context
      parameters:
        types: [requirements, features, invariants, expected_tests, expected_outcomes]
        feature_id: "${work_item_name}"
      bind: final_repository_context
  - judge:
      kind: verify_completeness
      question: Does the implemented tree satisfy every acceptance condition and requested behavior?
      subject: implementation_plan.acceptance_conditions
      prompt_system: Return only the declared JSON object.
      instructions:
        - Judge against the actual final repository context and validation results.
        - Mark complete only when every condition is evidenced.
        - List each missing condition precisely.
      context: [feature_description, implementation_plan, current_validation_results, final_repository_context]
      output:
        name: completeness_review
        schema:
          type: object
          required: [complete, missing]
          additionalProperties: false
          properties:
            complete: {type: boolean}
            missing: {type: array, items: {type: string}}
      validation: {kind: json_schema}
  - judge:
      kind: verify_invariants
      question: Are all declared invariants preserved by the implementation?
      subject: repository_context.invariants
      prompt_system: Return only the declared JSON object.
      instructions:
        - Use repository evidence and validation results, not assumptions.
        - Report every violated or unevidenced invariant.
      context: [implementation_plan, repository_context, final_repository_context, current_validation_results]
      output:
        name: invariant_review
        schema:
          type: object
          required: [preserved, violations]
          additionalProperties: false
          properties:
            preserved: {type: boolean}
            violations: {type: array, items: {type: string}}
      validation: {kind: json_schema}
  - judge:
      kind: verify_security
      question: Did the implementation introduce a security regression?
      subject: final_repository_context
      prompt_system: Return only the declared JSON object.
      instructions:
        - Inspect only the changed scope and its security-relevant effects.
        - Treat unknown security behavior as a finding, not as approval.
      context: [implementation_plan, final_repository_context, current_validation_results]
      output:
        name: security_review
        schema:
          type: object
          required: [safe, findings]
          additionalProperties: false
          properties:
            safe: {type: boolean}
            findings: {type: array, items: {type: string}}
      validation: {kind: json_schema}
  - attempt:
      id: final-validation
      max_attempts: 2
      body:
        - gate:
            subject: completeness_review.complete
            equals: true
            on_failure: {retry: {max_attempts: 1, on_exhausted: failed}}
        - gate:
            subject: invariant_review.preserved
            equals: true
            on_failure: {retry: {max_attempts: 1, on_exhausted: failed}}
        - gate:
            subject: security_review.safe
            equals: true
            on_failure: {retry: {max_attempts: 1, on_exhausted: failed}}
      on_failure: {recovery: final-validation-repair, resume: final-validation}
  - terminal: succeeded

recoveries:
  final-validation-repair:
    steps:
      - judge:
          kind: construct_repair_plan
          question: What minimal edits correct the failed final validation gate?
          subject: failure
          prompt_system: Return only the declared JSON object.
          instructions:
            - Use the failure, review findings, and repository evidence to identify the smallest correction.
            - Return no more than 4 independently executable file actions.
            - Include one verification_command for every action.
            - Include the exact structured failure record and a failure_id on every action.
            - If actions affect the same file, combine them or order them so each later action uses the prior action's result.
            - Do not broaden the proposed PR or change unrelated behavior.
          context: [failure, feature_description, implementation_plan, completeness_review, invariant_review, security_review, final_repository_context]
          output:
            name: final_repair_action
            schema:
              type: object
              required: [id, failure_id, failure, file_path, intent, verification_command]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                failure_id: {type: string, minLength: 1}
                failure: {type: object}
                file_path: {type: string, minLength: 1}
                intent: {type: string, minLength: 1}
                verification_command: {type: array, minItems: 1, items: {type: string, minLength: 1}}
          validation: {kind: json_schema}
      - operation:
          tool: read_document
          parameters: {file_path: "${final_repair_action.file_path}"}
          bind: final_repair_source
      - attempt:
          id: final-repair-action
          max_attempts: 2
          body:
            - judge:
                kind: construct_repair_edit
                question: What one edit corrects this exact final validation finding?
                subject: final_repair_action
                prompt_system: Return only one safe, minimal file edit as JSON.
                instructions:
                  - Target exactly the proposed repair file.
                  - Preserve unrelated content and existing invariants.
                context: [final_repair_action, final_repair_source]
                output:
                  name: final_repair_edit
                  schema:
                    type: object
                    required: [file_path, edit]
                    additionalProperties: false
                    properties:
                      file_path: {type: string, minLength: 1}
                      edit:
                        type: object
                        required: [old_text, new_text]
                        additionalProperties: false
                        properties:
                          old_text: {type: string}
                          new_text: {type: string}
                validation: {kind: json_schema}
            - operation:
                tool: edit
                parameters:
                  file_path: "${final_repair_edit.file_path}"
                  edits: ["${final_repair_edit.edit}"]
                bind: final_repair_result
            - operation:
                tool: internal
                parameters: {command: "${final_repair_action.verification_command}"}
                bind: final_repair_validation
            - gate:
                subject: final_repair_validation.returncode
                equals: 0
                on_failure: {retry: {max_attempts: 1, on_exhausted: failed}}
          on_failure: {recovery: final-repair-action-retry, resume: final-repair-action}
      - for_each:
          snapshot: {name: implementation_plan.validation_commands, max_items: 16}
          item_binding: final_revalidation_command
          collect: {binding: final_revalidation_results, mode: list, key: command, value: final_revalidation_result}
          body:
            - operation:
                tool: internal
                parameters: {command: "${final_revalidation_command}"}
                bind: final_revalidation_result
      - operation:
          tool: gather_context
          parameters:
            types: [requirements, features, invariants, expected_tests, expected_outcomes]
            feature_id: "${work_item_name}"
          bind: final_repository_context
      - judge:
          kind: verify_completeness
          question: Does the corrected tree satisfy every acceptance condition and requested behavior?
          subject: implementation_plan.acceptance_conditions
          prompt_system: Return only the declared JSON object.
          instructions:
            - Judge against the corrected repository context and latest structured validation results.
            - Mark complete only when every condition is evidenced.
            - List each missing condition precisely.
          context: [feature_description, implementation_plan, current_validation_results, final_revalidation_results, final_repository_context]
          output:
            name: completeness_review
            schema:
              type: object
              required: [complete, missing]
              additionalProperties: false
              properties:
                complete: {type: boolean}
                missing: {type: array, items: {type: string}}
          validation: {kind: json_schema}
      - judge:
          kind: verify_invariants
          question: Are all declared invariants preserved after the correction?
          subject: repository_context.invariants
          prompt_system: Return only the declared JSON object.
          instructions:
            - Use current repository evidence and latest validation results.
            - Report every violated or unevidenced invariant.
          context: [implementation_plan, repository_context, final_repository_context, current_validation_results, final_revalidation_results]
          output:
            name: invariant_review
            schema:
              type: object
              required: [preserved, violations]
              additionalProperties: false
              properties:
                preserved: {type: boolean}
                violations: {type: array, items: {type: string}}
          validation: {kind: json_schema}
      - judge:
          kind: verify_security
          question: Did the correction introduce a security regression?
          subject: final_repository_context
          prompt_system: Return only the declared JSON object.
          instructions:
            - Inspect only the changed scope and security-relevant effects.
            - Treat unknown security behavior as a finding, not approval.
          context: [implementation_plan, final_repository_context, current_validation_results, final_revalidation_results]
          output:
            name: security_review
            schema:
              type: object
              required: [safe, findings]
              additionalProperties: false
              properties:
                safe: {type: boolean}
                findings: {type: array, items: {type: string}}
          validation: {kind: json_schema}
  final-repair-action-retry:
    inputs: [final_repair_action, final_repair_validation, final_repair_source]
    steps:
      - judge:
          kind: construct_repair_edit
          question: What revised single edit fixes this same failure after the previous edit did not verify?
          subject: final_repair_action
          prompt_system: Return only one safe, minimal file edit as JSON.
          instructions:
            - Use the failed verification result and failure details as evidence.
            - Do not edit any other file or address a different failure.
          context: [final_repair_action, final_repair_source, final_repair_validation, failure]
          output:
            name: final_repair_edit
            schema:
              type: object
              required: [file_path, edit]
              additionalProperties: false
              properties:
                file_path: {type: string, minLength: 1}
                edit:
                  type: object
                  required: [old_text, new_text]
                  additionalProperties: false
                  properties:
                    old_text: {type: string}
                    new_text: {type: string}
          validation: {kind: json_schema}
      - operation:
          tool: edit
          parameters:
            file_path: "${final_repair_edit.file_path}"
            edits: ["${final_repair_edit.edit}"]
          bind: final_repair_result
      - operation:
          tool: internal
          parameters: {command: "${final_repair_action.verification_command}"}
          bind: final_repair_validation
      - gate:
          subject: final_repair_validation.returncode
          equals: 0
          on_failure: {retry: {max_attempts: 1, on_exhausted: failed}}
