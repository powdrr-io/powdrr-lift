version: 1
name: feature-delivery
description: >-
  End-to-end feature delivery in procedrr's single-decision normal form.
  The kernel owns sequencing, fan-out, admission, validation, publication,
  and termination. LLM activations answer exactly one typed question.
limits:
  llm_activations: 2048
  tool_calls: 4096
  max_epochs: 3

steps:
  - id: specify-a-feature
    call: specify-a-feature
    steps:
      - operation: {name: capture_user_request, bind: request}
      - operation: {name: extract_feature_name_candidates, bind: feature_name_candidates}
      - judge:
          kind: construct_one
          question: What stable identifier names this feature?
          subject: feature_name_candidates
          output: {name: feature_name, type: string}
          validator: validate_feature_name
      - operation: {name: gather_repository_context, bind: repository_context}
      - judge:
          kind: construct_one
          question: What is the one intended feature behavior?
          subject: request
          output: {name: feature_intent, type: string}
          validator: validate_feature_intent
      - operation: {name: gather_design_interview_categories, bind: interview_categories}
      - for_each:
          snapshot: interview_categories
          item_binding: category
          max_items: 12
          steps:
            - operation: {name: gather_category_evidence, bind: category_evidence}
            - judge:
                kind: construct_one
                question: What one requirement follows from this category evidence?
                subject: category_evidence
                output: {name: category_decision, type: string}
                validator: validate_category_decision
            - operation: {name: store_category_input}
      - operation: {name: construct_feature_specification, bind: feature_specification}
      - operation: {name: validate_feature_specification}
      - operation: {name: stage_specification_changes}
      - operation: {name: create_specification_pr, bind: specification_pr}

  - id: start-implementing-feature
    call: start-implementing-feature
    steps:
      - operation: {name: capture_accepted_specification, bind: accepted_specification}
      - operation: {name: gather_implementation_context, bind: implementation_context}
      - judge:
          kind: construct_one
          question: What one decomposition best covers this feature?
          subject: accepted_specification
          output: {name: implementation_shape, type: string}
          validator: validate_implementation_shape
      - operation: {name: construct_change_units, bind: change_units}
      - for_each:
          snapshot: change_units
          item_binding: change_unit
          max_items: 16
          steps:
            - judge:
                kind: construct_one
                question: What one proposed PR implements this change unit?
                subject: change_unit
                output: {name: proposed_pr, type: string}
                validator: validate_proposed_pr
            - operation: {name: validate_proposed_pr}
            - operation: {name: persist_proposed_pr_workflow}
      - operation: {name: validate_proposed_pr_dependency_graph}
      - operation: {name: publish_implementation_plan_pr, bind: plan_pr}

  - id: execute-ready-proposed-prs
    for_each:
      snapshot: ready_proposed_prs
      item_binding: proposed_pr
      max_items: 16
      steps:
        - call: execute-proposed-pr
          steps:
            - operation: {name: capture_proposed_pr_context, bind: pr_context}
            - operation: {name: inspect_target_structure, bind: target_structure}
            - operation: {name: inspect_target_symbols, bind: target_symbols}
            - operation: {name: load_change_units, bind: pr_change_units}
            - for_each:
                snapshot: pr_change_units
                item_binding: change_unit
                max_items: 32
                steps:
                  - judge:
                      kind: construct_one
                      question: What one authoritative effect does this change unit require?
                      subject: change_unit
                      output: {name: change_effect, type: string}
                      validator: validate_change_effect
                  - operation: {name: apply_change_unit}
                  - operation: {name: run_targeted_validation, bind: targeted_validation}
                  - judge:
                      kind: classify_one
                      question: Does this one validation result identify a defect?
                      subject: targeted_validation
                      output: {name: validation_finding, type: string}
                      validator: validate_validation_finding
                  - operation: {name: record_change_unit_receipt}
            - operation: {name: run_full_validation}
            - operation: {name: run_invariant_checks}
            - operation: {name: run_security_checks}
            - operation: {name: review_diff, bind: review_diff}
            - judge:
                kind: classify_one
                question: Is this one reviewed diff ready for publication?
                subject: review_diff
                output: {name: review_disposition, type: string}
                validator: validate_review_disposition
            - operation: {name: stage_proposed_pr_changes}
            - operation: {name: publish_proposed_pr}

  - operation: {name: run_feature_acceptance}
  - operation: {name: verify_feature_invariants}
  - operation: {name: verify_feature_security}
  - terminal: succeeded
