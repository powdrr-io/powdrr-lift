version: 1
name: implement-feature
inputs:
  - {name: feature_description, type: string, required: true}
  - {name: work_item_name, type: string, required: true}
steps:
  - operation:
      tool: internal
      command: [ensure_current_structrr]
      returns:
        type: object
        required: [path]
        properties: {path: {type: string, minLength: 1}}
      bind: baseline
  - operation:
      tool: internal
      command: [discover_validation_profiles]
      parameters:
        baseline: {type: reference, value: baseline.path}
      returns: {type: array}
      bind: validation_profiles
  - call:
      process: design-interview
      inputs:
        work_item_name: {type: reference, value: work_item_name}
        feature_description: {type: reference, value: feature_description}
      outputs:
        feature_design: feature_design
        feature_obligations: feature_design
  - operation:
      tool: internal
      command: [plan_structrr_diff]
      parameters:
        baseline: {type: reference, value: baseline.path}
        work_item_name: {type: reference, value: work_item_name}
        feature_description: {type: reference, value: feature_description}
        feature_design: {type: reference, value: feature_design}
      returns:
        type: object
        required: [path]
        properties: {path: {type: string, minLength: 1}}
      bind: plan
  - operation:
      tool: internal
      command: [materialize_feature_intents]
      parameters:
        plan: {type: reference, value: plan.path}
        obligations: {type: reference, value: feature_obligations}
      returns:
        type: object
        required: [path, updated, intent_clauses]
        properties:
          path: {type: string, minLength: 1}
          updated: {type: integer, minimum: 0}
          intent_clauses: {type: array, minItems: 1}
      bind: feature_intents
  - operation:
      tool: internal
      command: [compile_verification_obligations]
      parameters:
        baseline: {type: reference, value: baseline.path}
        plan: {type: reference, value: plan.path}
        feature_description: {type: reference, value: feature_description}
      returns:
        type: object
        required: [path, fingerprint, closure, obligations, failures]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          closure: {type: object}
          obligations: {type: array}
          failures: {type: array}
      bind: verification_obligations
  - operation:
      tool: internal
      command: [assert_verification_obligations_complete]
      parameters:
        verification_obligations: {type: reference, value: verification_obligations}
      returns:
        type: object
        required: [passed, failure_count]
        properties:
          passed: {type: boolean}
          failure_count: {type: integer, minimum: 0}
      bind: verification_obligations_gate
  - gate:
      subject: verification_obligations_gate.passed
      equals: true
      on_failure: {terminal: failed}
  - operation:
      tool: internal
      command: [prepare_proposal_review]
      parameters:
        baseline: {type: reference, value: baseline.path}
        plan: {type: reference, value: plan.path}
        feature_description: {type: reference, value: feature_description}
        verification_obligations: {type: reference, value: verification_obligations}
      returns:
        type: object
        required: [proposal_revision_path, proposal_fingerprint, worklist_path, worklist, active_intent_clauses]
        properties:
          proposal_revision_path: {type: string, minLength: 1}
          proposal_fingerprint: {type: string, minLength: 1}
          worklist_path: {type: string, minLength: 1}
          worklist: {type: object}
          active_intent_clauses: {type: array}
      bind: proposal_review
  - for_each:
      snapshot: {name: proposal_review.worklist.specifications}
      item_binding: proposal_decision
      collect: {binding: proposal_decisions, mode: list, value: proposal_decision_result}
      body:
        - judge:
            kind: verify_proposal_decision
            question: Does this one proposal decision pass based on the supplied evidence?
            subject: proposal_decision.predicate
            prompt_system: Return only the declared JSON object.
            instructions:
              - Evaluate exactly the one predicate in proposal_decision.
              - Do not evaluate sibling decisions or provide an aggregate verdict.
              - Return only the semantic outcome and explanation; Powdrr binds all decision identity and evidence fields.
              - Use pass only when the evidence proves the predicate; otherwise use fail, unknown, or clarification.
              - An unknown or clarification outcome blocks proposal acceptance.
            context: [proposal_decision, feature_description, baseline, plan, feature_design]
            output:
              name: proposal_decision_result
              schema:
                type: object
                required: [outcome, explanation]
                additionalProperties: false
                properties:
                  outcome: {type: string, enum: [pass, fail, unknown, clarification]}
                  explanation: {type: string, minLength: 1}
            validation: {kind: json_schema}
  - operation:
      tool: internal
      command: [bind_proposal_decision_results]
      parameters:
        worklist: {type: reference, value: proposal_review.worklist}
        decisions: {type: reference, value: proposal_decisions}
      returns: {type: object}
      bind: proposal_decision_results
  - operation:
      tool: internal
      command: [finalize_proposal_review]
      parameters:
        proposal_revision_path: {type: reference, value: proposal_review.proposal_revision_path}
        worklist_path: {type: reference, value: proposal_review.worklist_path}
        decisions: {type: reference, value: proposal_decision_results.decisions}
      returns:
        type: object
        required: [accepted, receipt_path, proposal_fingerprint, worklist_fingerprint]
        properties:
          accepted: {type: boolean}
          receipt_path: {type: string, minLength: 1}
          proposal_fingerprint: {type: string, minLength: 1}
          worklist_fingerprint: {type: string, minLength: 1}
      bind: proposal_review_result
  - gate:
      subject: proposal_review_result.accepted
      equals: true
      on_failure: {terminal: failed}
  - operation:
      tool: internal
      command: [run_opencode]
      parameters:
        baseline: {type: reference, value: baseline.path}
        plan: {type: reference, value: plan.path}
        proposal_review_receipt: {type: reference, value: proposal_review_result.receipt_path}
        work_item_name: {type: reference, value: work_item_name}
        feature_description: {type: reference, value: feature_description}
        obligations: {type: reference, value: feature_obligations}
        verification_obligations: {type: reference, value: verification_obligations}
      returns:
        type: object
        required: [request_id, attempt]
        properties:
          request_id: {type: string, minLength: 1}
          attempt: {type: object}
      bind: implementation
  - for_each:
      snapshot: {name: validation_profiles}
      item_binding: validation_profile
      collect: {binding: validation_results, mode: list, value: validation_result}
      body:
        - operation:
            tool: internal
            command: [run_validation_profile]
            parameters:
              profile: {type: reference, value: validation_profile}
              implementation: {type: reference, value: implementation}
            returns: {type: object}
            bind: validation_result
  - operation:
      tool: internal
      command: [aggregate_validation]
      parameters:
        implementation: {type: reference, value: implementation}
        results: {type: reference, value: validation_results}
      returns: {type: object}
      bind: validation
  - operation:
      tool: internal
      command: [validate_required_test_cases]
      parameters:
        plan: {type: reference, value: plan.path}
      returns:
        type: object
        required: [passed, failures, cases]
        properties:
          passed: {type: boolean}
          failures: {type: array}
          cases: {type: array}
      bind: required_test_case_validation
  - gate:
      subject: required_test_case_validation.passed
      equals: true
      on_failure: {terminal: failed}
  - operation:
      tool: internal
      command: [run_verification_evidence]
      parameters:
        obligations: {type: reference, value: verification_obligations.obligations}
      returns:
        type: object
        required: [candidate_tree, evidence, progress_events, passed]
        properties:
          candidate_tree: {type: string, minLength: 1}
          evidence: {type: array}
          progress_events: {type: array}
          passed: {type: boolean}
      bind: verification_evidence
  - operation:
      tool: internal
      command: [reconcile_verification_evidence]
      parameters:
        obligations: {type: reference, value: verification_obligations.obligations}
        evidence: {type: reference, value: verification_evidence.evidence}
        candidate_tree: {type: reference, value: verification_evidence.candidate_tree}
      returns: {type: object}
      bind: verification_reconciliation
  - operation:
      tool: internal
      command: [review_worker_diff]
      parameters:
        implementation: {type: reference, value: implementation}
        validation: {type: reference, value: validation}
      returns:
        type: object
        required: [passed]
        properties: {passed: {type: boolean}}
      bind: review
  - attempt:
      id: worker-validation-review
      max_attempts: 4
      body:
        - gate:
            subject: review.passed
            equals: true
            on_failure: {retry: {max_attempts: 1, on_exhausted: failed}}
      on_failure: {recovery: worker-repair, resume: worker-validation-review}
  - attempt:
      id: intent-preservation-review
      max_attempts: 4
      body:
        - operation:
            tool: internal
            command: [prepare_implementation_review]
            parameters:
              implementation: {type: reference, value: implementation}
              validation: {type: reference, value: validation}
              review: {type: reference, value: review}
            returns:
              type: object
              required: [evidence_path, evidence_fingerprint, evidence_refs, active_intent_clauses]
              properties:
                evidence_path: {type: string, minLength: 1}
                evidence_fingerprint: {type: string, minLength: 1}
                evidence_refs: {type: array, minItems: 1, items: {type: string, minLength: 1}}
                active_intent_clauses: {type: array}
                git_diff: {type: string}
                changed_paths: {type: array}
                validation: {type: object}
                worker_review: {type: object}
            bind: implementation_review
        - operation:
            tool: internal
            command: [compile_obligation_review_packets]
            parameters:
              obligations: {type: reference, value: feature_obligations}
              evidence: {type: reference, value: implementation_review}
            returns:
              type: object
              required: [packets]
              properties:
                path: {type: string, minLength: 1}
                packets: {type: array, minItems: 1}
            bind: obligation_review_packets
        - for_each:
            snapshot: {name: obligation_review_packets.packets}
            item_binding: obligation_packet
            collect: {binding: intent_reviews, mode: list, value: intent_review}
            body:
              - judge:
                  kind: verify_implemented_intent
                  question: Is this one obligation preserved by the implementation and its bounded evidence?
                  subject: obligation_packet.obligation_id
                  prompt_system: Return only the declared JSON object.
                  instructions:
                    - Evaluate exactly this one obligation.
                    - Compare only the obligation with its evidence packet.
                    - Return preserved only when the obligation remains honored; otherwise return altered or unknown.
                    - Do not return obligation IDs or evidence references; Powdrr binds both from the packet.
                  context: [obligation_packet, feature_description, proposal_review, proposal_review_result, implementation_review, implementation, validation, review]
                  output:
                    name: intent_review
                    schema:
                      type: object
                      required: [verdict, explanation]
                      additionalProperties: false
                      properties:
                        verdict: {type: string, enum: [preserved, altered, unknown]}
                        explanation: {type: string, minLength: 1}
                  validation: {kind: json_schema}
        - operation:
            tool: internal
            command: [bind_obligation_reviews]
            parameters:
              packets: {type: reference, value: obligation_review_packets.packets}
              decisions: {type: reference, value: intent_reviews}
            returns: {type: object}
            bind: bound_obligation_reviews
        - operation:
            tool: internal
            # Migration marker for consumers that still recognize the old command:
            # command: [aggregate_intent_review]
            command: [aggregate_obligation_reviews]
            parameters:
              packets: {type: reference, value: obligation_review_packets.packets}
              reviews: {type: reference, value: bound_obligation_reviews.reviews}
              verification_reconciliation: {type: reference, value: verification_reconciliation}
            returns:
              type: object
              required: [passed, failures]
              properties:
                passed: {type: boolean}
                failures: {type: array}
            bind: intent_review_result
        - gate:
            subject: intent_review_result.passed
            equals: true
            on_failure: {retry: {max_attempts: 1, on_exhausted: failed}}
      on_failure: {recovery: intent-repair, resume: intent-preservation-review}
  - judge:
      kind: verify_completeness
      provider: planning
      question: Does the implementation satisfy every requirement in the feature specification?
      subject: feature_description
      prompt_system: Return only the declared JSON object.
      instructions:
        - Compare the implementation and validation evidence with the complete feature specification.
        - Check every compiled feature obligation individually and require concrete implementation and validation evidence for each one.
        - Mark complete only when every requested behavior is implemented and validated.
        - >-
          Return one verdict: satisfied or missing.
      context: [feature_description, plan, feature_obligations, implementation, validation, review]
      output:
        name: completeness_review
        schema:
          type: object
          required: [verdict]
          additionalProperties: false
          properties:
            verdict: {type: string, enum: [satisfied, missing]}
      validation: {kind: json_schema}
  - attempt:
      id: specification-completeness-review
      max_attempts: 2
      body:
        - gate:
            subject: completeness_review.verdict
            equals: satisfied
            on_failure: {retry: {max_attempts: 1, on_exhausted: failed}}
      on_failure: {recovery: completeness-repair, resume: specification-completeness-review}
  - judge:
      kind: verify_scope
      provider: planning
      question: Is every changed file and hunk justified by the feature specification?
      subject: review
      prompt_system: Return only the declared JSON object.
      instructions:
        - Inspect the complete implementation diff, not only the worker summary.
        - Mark justified only when every change is required by the specification or its validation.
        - Treat unrelated refactors, cleanup, and speculative improvements as findings.
        - The review.changed_paths and review.out_of_scope_paths are the
          authoritative mechanical scope result. If review.passed is true and
          review.out_of_scope_paths is empty, return justified. Required test
          files and generated test artifacts under an allowed validation path
          are justified by the feature's validation obligations.
        - >-
          Return one verdict: justified or unjustified.
      context: [feature_description, plan, feature_obligations, implementation, validation, review, completeness_review]
      output:
        name: scope_review
        schema:
          type: object
          required: [verdict]
          additionalProperties: false
          properties:
            verdict: {type: string, enum: [justified, unjustified]}
      validation: {kind: json_schema}
  - attempt:
      id: change-scope-review
      max_attempts: 2
      body:
        - gate:
            subject: scope_review.verdict
            equals: justified
            on_failure: {retry: {max_attempts: 1, on_exhausted: failed}}
      on_failure: {recovery: scope-repair, resume: change-scope-review}
  - operation:
      tool: internal
      command: [open_pull_request]
      parameters:
        review: {type: reference, value: review}
        plan: {type: reference, value: plan.path}
        work_item_name: {type: reference, value: work_item_name}
        feature_description: {type: reference, value: feature_description}
      returns: {type: [string, 'null']}
      bind: pull_request
  - operation:
      tool: internal
      command: [create_pr_changelog]
      parameters:
        pull_request: {type: reference, value: pull_request}
        plan: {type: reference, value: plan.path}
        work_item_name: {type: reference, value: work_item_name}
        feature_description: {type: reference, value: feature_description}
      returns: {type: [string, 'null']}
      bind: changelog
  - operation:
      tool: internal
      command: [update_pull_request]
      parameters:
        pull_request: {type: reference, value: pull_request}
        changelog: {type: reference, value: changelog}
      returns: {type: [string, 'null']}
      bind: updated_pull_request
  - terminal: succeeded

recoveries:
  worker-repair:
    steps:
      - repeat:
          max_iterations: 4
          until: {subject: review.passed, equals: true}
          body:
            - operation:
                tool: internal
                command: [collect_repair_issues]
                parameters:
                  validation: {type: reference, value: validation}
                  review: {type: reference, value: review}
                  reconciliation: {type: reference, value: verification_reconciliation}
                returns: {type: array}
                bind: repair_issues
            - for_each:
                snapshot: {name: repair_issues}
                item_binding: repair_issue
                collect: {binding: repair_outputs, mode: list}
                body:
                  - operation:
                      tool: internal
                      command: [run_opencode]
                      parameters:
                        baseline: {type: reference, value: baseline.path}
                        plan: {type: reference, value: plan.path}
                        work_item_name: {type: reference, value: work_item_name}
                        feature_description: {type: reference, value: feature_description}
                        obligations: {type: reference, value: feature_obligations}
                        repair_issue: {type: reference, value: repair_issue}
                      returns: {type: object}
                      bind: implementation
            - for_each:
                snapshot: {name: validation_profiles}
                item_binding: validation_profile
                collect: {binding: validation_results, mode: list, value: validation_result}
                body:
                  - operation:
                      tool: internal
                      command: [run_validation_profile]
                      parameters:
                        profile: {type: reference, value: validation_profile}
                        implementation: {type: reference, value: implementation}
                      returns: {type: object}
                      bind: validation_result
            - operation:
                tool: internal
                command: [aggregate_validation]
                parameters:
                  implementation: {type: reference, value: implementation}
                  results: {type: reference, value: validation_results}
                returns: {type: object}
                bind: validation
            - operation:
                tool: internal
                command: [validate_required_test_cases]
                parameters:
                  plan: {type: reference, value: plan.path}
                returns: {type: object}
                bind: required_test_case_validation
            - gate:
                subject: required_test_case_validation.passed
                equals: true
                on_failure: {terminal: failed}
            - operation:
                tool: internal
                command: [run_verification_evidence]
                parameters:
                  obligations: {type: reference, value: verification_obligations.obligations}
                returns: {type: object}
                bind: verification_evidence
            - operation:
                tool: internal
                command: [reconcile_verification_evidence]
                parameters:
                  obligations: {type: reference, value: verification_obligations.obligations}
                  evidence: {type: reference, value: verification_evidence.evidence}
                  candidate_tree: {type: reference, value: verification_evidence.candidate_tree}
                returns: {type: object}
                bind: verification_reconciliation
            - operation:
                tool: internal
                command: [review_worker_diff]
                parameters:
                  implementation: {type: reference, value: implementation}
                  validation: {type: reference, value: validation}
                returns: {type: object}
                bind: review
  completeness-repair:
    steps:
      - judge:
          kind: construct_repair_plan
          provider: planning
          question: What one repair request should be sent to OpenCode for the incomplete implementation?
          subject: completeness_review
          prompt_system: Return only the declared JSON object.
          instructions:
            - Address only the completeness failure identified by the review verdict.
            - Preserve the feature scope and do not rewrite unrelated code.
          context: [feature_description, plan, implementation, validation, completeness_review]
          output:
            name: completeness_repair
            schema:
              type: object
              required: [request]
              additionalProperties: false
              properties:
                request: {type: string, minLength: 1}
          validation: {kind: json_schema}
      - operation:
          tool: internal
          command: [run_opencode]
          parameters:
            baseline: {type: reference, value: baseline.path}
            plan: {type: reference, value: plan.path}
            work_item_name: {type: reference, value: work_item_name}
            feature_description: {type: reference, value: feature_description}
            obligations: {type: reference, value: feature_obligations}
            repair_request: {type: reference, value: completeness_repair.request}
            review_verdict: {type: reference, value: completeness_review.verdict}
          returns: {type: object}
          bind: implementation
      - for_each:
          snapshot: {name: validation_profiles}
          item_binding: validation_profile
          collect: {binding: validation_results, mode: list, value: validation_result}
          body:
            - operation:
                tool: internal
                command: [run_validation_profile]
                parameters:
                  profile: {type: reference, value: validation_profile}
                  implementation: {type: reference, value: implementation}
                returns: {type: object}
                bind: validation_result
      - operation:
          tool: internal
          command: [aggregate_validation]
          parameters:
            implementation: {type: reference, value: implementation}
            results: {type: reference, value: validation_results}
          returns: {type: object}
          bind: validation
      - operation:
          tool: internal
          command: [validate_required_test_cases]
          parameters:
            plan: {type: reference, value: plan.path}
          returns: {type: object}
          bind: required_test_case_validation
      - gate:
          subject: required_test_case_validation.passed
          equals: true
          on_failure: {terminal: failed}
      - operation:
          tool: internal
          command: [run_verification_evidence]
          parameters:
            obligations: {type: reference, value: verification_obligations.obligations}
          returns: {type: object}
          bind: verification_evidence
      - operation:
          tool: internal
          command: [reconcile_verification_evidence]
          parameters:
            obligations: {type: reference, value: verification_obligations.obligations}
            evidence: {type: reference, value: verification_evidence.evidence}
            candidate_tree: {type: reference, value: verification_evidence.candidate_tree}
          returns: {type: object}
          bind: verification_reconciliation
  scope-repair:
    steps:
      - judge:
          kind: construct_repair_plan
          provider: planning
          question: What one repair request should be sent to OpenCode for the unjustified change scope?
          subject: scope_review
          prompt_system: Return only the declared JSON object.
          instructions:
            - Remove or revert only the change scope identified by the review verdict.
            - Preserve all behavior required by the specification.
          context: [feature_description, plan, implementation, validation, scope_review]
          output:
            name: scope_repair
            schema:
              type: object
              required: [request]
              additionalProperties: false
              properties:
                request: {type: string, minLength: 1}
          validation: {kind: json_schema}
      - operation:
          tool: internal
          command: [run_opencode]
          parameters:
            baseline: {type: reference, value: baseline.path}
            plan: {type: reference, value: plan.path}
            work_item_name: {type: reference, value: work_item_name}
            feature_description: {type: reference, value: feature_description}
            obligations: {type: reference, value: feature_obligations}
            repair_request: {type: reference, value: scope_repair.request}
            review_verdict: {type: reference, value: scope_review.verdict}
          returns: {type: object}
          bind: implementation
      - for_each:
          snapshot: {name: validation_profiles}
          item_binding: validation_profile
          collect: {binding: validation_results, mode: list, value: validation_result}
          body:
            - operation:
                tool: internal
                command: [run_validation_profile]
                parameters:
                  profile: {type: reference, value: validation_profile}
                  implementation: {type: reference, value: implementation}
                returns: {type: object}
                bind: validation_result
      - operation:
          tool: internal
          command: [aggregate_validation]
          parameters:
            implementation: {type: reference, value: implementation}
            results: {type: reference, value: validation_results}
          returns: {type: object}
          bind: validation
      - operation:
          tool: internal
          command: [validate_required_test_cases]
          parameters:
            plan: {type: reference, value: plan.path}
          returns: {type: object}
          bind: required_test_case_validation
      - gate:
          subject: required_test_case_validation.passed
          equals: true
          on_failure: {terminal: failed}
      - operation:
          tool: internal
          command: [run_verification_evidence]
          parameters:
            obligations: {type: reference, value: verification_obligations.obligations}
          returns: {type: object}
          bind: verification_evidence
      - operation:
          tool: internal
          command: [reconcile_verification_evidence]
          parameters:
            obligations: {type: reference, value: verification_obligations.obligations}
            evidence: {type: reference, value: verification_evidence.evidence}
            candidate_tree: {type: reference, value: verification_evidence.candidate_tree}
          returns: {type: object}
          bind: verification_reconciliation
  intent-repair:
    steps:
      - judge:
          kind: construct_intent_repair_plan
          question: What one targeted repair request should OpenCode apply to preserve the failed intent clauses?
          subject: intent_review_result
          prompt_system: Return only the declared JSON object.
          instructions:
            - Address only the failed intent preservation findings.
            - Preserve the accepted proposal and do not rewrite unrelated code.
            - Return one concrete code-edit request for OpenCode.
          context: [feature_description, plan, proposal_review, implementation, validation, review]
          output:
            name: intent_repair
            schema:
              type: object
              required: [request]
              additionalProperties: false
              properties:
                request: {type: string, minLength: 1}
          validation: {kind: json_schema}
      - operation:
          tool: internal
          command: [run_opencode]
          parameters:
            baseline: {type: reference, value: baseline.path}
            plan: {type: reference, value: plan.path}
            work_item_name: {type: reference, value: work_item_name}
            feature_description: {type: reference, value: feature_description}
            repair_request: {type: reference, value: intent_repair.request}
          returns: {type: object}
          bind: implementation
      - for_each:
          snapshot: {name: validation_profiles}
          item_binding: validation_profile
          collect: {binding: validation_results, mode: list, value: validation_result}
          body:
            - operation:
                tool: internal
                command: [run_validation_profile]
                parameters:
                  profile: {type: reference, value: validation_profile}
                  implementation: {type: reference, value: implementation}
                returns: {type: object}
                bind: validation_result
      - operation:
          tool: internal
          command: [aggregate_validation]
          parameters:
            implementation: {type: reference, value: implementation}
            results: {type: reference, value: validation_results}
          returns: {type: object}
          bind: validation
      - operation:
          tool: internal
          command: [validate_required_test_cases]
          parameters:
            plan: {type: reference, value: plan.path}
          returns: {type: object}
          bind: required_test_case_validation
      - gate:
          subject: required_test_case_validation.passed
          equals: true
          on_failure: {terminal: failed}
      - operation:
          tool: internal
          command: [run_verification_evidence]
          parameters:
            obligations: {type: reference, value: verification_obligations.obligations}
          returns: {type: object}
          bind: verification_evidence
      - operation:
          tool: internal
          command: [reconcile_verification_evidence]
          parameters:
            obligations: {type: reference, value: verification_obligations.obligations}
            evidence: {type: reference, value: verification_evidence.evidence}
            candidate_tree: {type: reference, value: verification_evidence.candidate_tree}
          returns: {type: object}
          bind: verification_reconciliation
      - operation:
          tool: internal
          command: [review_worker_diff]
          parameters:
            implementation: {type: reference, value: implementation}
            validation: {type: reference, value: validation}
          returns: {type: object}
          bind: review
