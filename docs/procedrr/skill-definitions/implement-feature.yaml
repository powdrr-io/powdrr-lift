version: 1
name: implement-feature
description: >-
  Convert an accepted Structrr intent diff into obligation verification
  contracts, baseline evidence, and independently verifiable code tasks. Every
  review asks one question about one subject. Workrr owns evidence collection
  and deterministic evaluation; a coding agent is invoked only for an accepted
  task that requires repository edits.
inputs:
  - {name: feature_description, type: string, required: true}
  - {name: work_item_name, type: string, required: true}
steps:
  - operation:
      tool: internal
      command: [ensure_current_structrr]
      returns:
        type: object
        required: [path]
        properties: {path: {type: string, minLength: 1}}
      bind: baseline
  - operation:
      tool: internal
      command: [discover_validation_profiles]
      parameters:
        baseline: {type: reference, value: baseline.path}
      returns: {type: array}
      bind: validation_profiles
  - call:
      process: design-interview
      inputs:
        work_item_name: {type: reference, value: work_item_name}
        feature_description: {type: reference, value: feature_description}
      outputs:
        feature_design: feature_design
        feature_obligations: feature_design
  - operation:
      tool: internal
      command: [plan_structrr_diff]
      parameters:
        baseline: {type: reference, value: baseline.path}
        work_item_name: {type: reference, value: work_item_name}
        feature_description: {type: reference, value: feature_description}
        feature_design: {type: reference, value: feature_design}
      returns:
        type: object
        required: [path]
        properties: {path: {type: string, minLength: 1}}
      bind: plan
  - operation:
      tool: internal
      command: [materialize_feature_intents]
      parameters:
        plan: {type: reference, value: plan.path}
        obligations: {type: reference, value: feature_obligations}
      returns:
        type: object
        required: [path, updated, intent_clauses]
        properties:
          path: {type: string, minLength: 1}
          updated: {type: integer, minimum: 0}
          intent_clauses: {type: array, minItems: 1}
      bind: feature_intents

  # The accepted proposal remains the authority for intent additions,
  # removals, and preservation. These existing gates precede all execution
  # planning.
  - operation:
      tool: internal
      command: [compile_verification_obligations]
      parameters:
        baseline: {type: reference, value: baseline.path}
        plan: {type: reference, value: plan.path}
        feature_description: {type: reference, value: feature_description}
      returns:
        type: object
        required: [path, fingerprint, closure, obligations, failures]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          closure: {type: object}
          obligations: {type: array}
          failures: {type: array}
      bind: verification_obligations
  - operation:
      tool: internal
      command: [assert_verification_obligations_complete]
      parameters:
        verification_obligations: {type: reference, value: verification_obligations}
      returns:
        type: object
        required: [passed, failure_count]
        properties:
          passed: {type: boolean}
          failure_count: {type: integer, minimum: 0}
      bind: verification_obligations_gate
  - gate:
      subject: verification_obligations_gate.passed
      equals: true
      on_failure: {terminal: failed}
  - operation:
      tool: internal
      command: [prepare_proposal_review]
      parameters:
        baseline: {type: reference, value: baseline.path}
        plan: {type: reference, value: plan.path}
        feature_description: {type: reference, value: feature_description}
        verification_obligations: {type: reference, value: verification_obligations}
      returns:
        type: object
        required: [proposal_revision_path, proposal_fingerprint, worklist_path, worklist, active_intent_clauses]
        properties:
          proposal_revision_path: {type: string, minLength: 1}
          proposal_fingerprint: {type: string, minLength: 1}
          worklist_path: {type: string, minLength: 1}
          worklist: {type: object}
          active_intent_clauses: {type: array}
      bind: proposal_review
  - for_each:
      snapshot: {name: proposal_review.worklist.specifications, max_items: 1024}
      item_binding: proposal_decision
      collect: {binding: proposal_decisions, mode: list, value: proposal_decision_result}
      body:
        - judge:
            kind: verify_proposal_decision
            provider: planning
            question: Does this one proposal predicate pass based only on its supplied evidence?
            subject: proposal_decision.predicate
            prompt_system: Return only the declared JSON object.
            instructions:
              - Evaluate exactly the one predicate in proposal_decision.
              - Do not evaluate sibling predicates or provide an aggregate verdict.
              - Use pass only when the supplied evidence proves this predicate.
              - Return fail, unknown, or clarification when the evidence does not prove it.
              - Do not return IDs, references, or fingerprints; Powdrr binds them.
            context: [proposal_decision, feature_description, baseline, plan, feature_design]
            output:
              name: proposal_decision_result
              schema:
                type: object
                required: [outcome, explanation]
                additionalProperties: false
                properties:
                  outcome: {type: string, enum: [pass, fail, unknown, clarification]}
                  explanation: {type: string, minLength: 1}
            validation: {kind: json_schema}
  - operation:
      tool: internal
      command: [bind_proposal_decision_results]
      parameters:
        worklist: {type: reference, value: proposal_review.worklist}
        decisions: {type: reference, value: proposal_decisions}
      returns: {type: object}
      bind: proposal_decision_results
  - operation:
      tool: internal
      command: [finalize_proposal_review]
      parameters:
        proposal_revision_path: {type: reference, value: proposal_review.proposal_revision_path}
        worklist_path: {type: reference, value: proposal_review.worklist_path}
        decisions: {type: reference, value: proposal_decision_results.decisions}
      returns:
        type: object
        required: [accepted, receipt_path, proposal_fingerprint, worklist_fingerprint]
        properties:
          accepted: {type: boolean}
          receipt_path: {type: string, minLength: 1}
          proposal_fingerprint: {type: string, minLength: 1}
          worklist_fingerprint: {type: string, minLength: 1}
      bind: proposal_review_result
  - gate:
      subject: proposal_review_result.accepted
      equals: true
      on_failure: {terminal: failed}

  # Compile each durable obligation into a population, one observable
  # operation, one oracle, and executable evidence contracts. This operation
  # does not edit product or test code. Its structural decisions ask one
  # question each: is there one population selector, one operation, one oracle,
  # an executable contract, and a current source fingerprint?
  - operation:
      tool: internal
      command: [compile_obligation_verification_plans]
      parameters:
        baseline: {type: reference, value: baseline.path}
        plan: {type: reference, value: plan.path}
        proposal_review_receipt: {type: reference, value: proposal_review_result.receipt_path}
        feature_design: {type: reference, value: feature_design}
        obligations: {type: reference, value: verification_obligations.obligations}
      returns:
        type: object
        required: [path, fingerprint, plans, structural_decisions]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          plans: {type: array, minItems: 1}
          structural_decisions: {type: array, minItems: 1}
      bind: obligation_verification_plans
  - for_each:
      snapshot: {name: obligation_verification_plans.structural_decisions, max_items: 4096}
      item_binding: verification_plan_decision
      collect: {binding: verification_plan_decisions, mode: list, value: verification_plan_decision_result}
      body:
        - operation:
            tool: internal
            command: [evaluate_deterministic_decision]
            parameters:
              decision: {type: reference, value: verification_plan_decision}
            returns:
              type: object
              required: [outcome, explanation]
              properties:
                outcome: {type: string, enum: [pass, fail, blocked]}
                explanation: {type: string, minLength: 1}
            bind: verification_plan_decision_result
  - operation:
      tool: internal
      command: [finalize_obligation_verification_plan_review]
      parameters:
        plans: {type: reference, value: obligation_verification_plans}
        decisions: {type: reference, value: verification_plan_decisions}
      returns:
        type: object
        required: [accepted, receipt_path]
        properties:
          accepted: {type: boolean}
          receipt_path: {type: string, minLength: 1}
      bind: obligation_verification_plan_review
  - gate:
      subject: obligation_verification_plan_review.accepted
      equals: true
      on_failure: {terminal: failed}

  # Resolve the complete current population for every obligation. Universal
  # obligations are not considered covered by one representative example. The
  # generated decisions check one member at a time, then a deterministic reducer
  # checks set equality between applicable members and contract cases.
  - operation:
      tool: internal
      command: [resolve_obligation_populations]
      parameters:
        baseline: {type: reference, value: baseline.path}
        plans: {type: reference, value: obligation_verification_plans.plans}
      returns:
        type: object
        required: [path, fingerprint, populations, completeness_decisions]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          populations: {type: array, minItems: 1}
          completeness_decisions: {type: array, minItems: 1}
      bind: obligation_populations
  - for_each:
      snapshot: {name: obligation_populations.completeness_decisions, max_items: 4096}
      item_binding: population_decision
      collect: {binding: population_decisions, mode: list, value: population_decision_result}
      body:
        - operation:
            tool: internal
            command: [evaluate_deterministic_decision]
            parameters:
              decision: {type: reference, value: population_decision}
            returns:
              type: object
              required: [outcome, explanation]
              properties:
                outcome: {type: string, enum: [pass, fail, blocked]}
                explanation: {type: string, minLength: 1}
            bind: population_decision_result
  - operation:
      tool: internal
      command: [finalize_population_review]
      parameters:
        populations: {type: reference, value: obligation_populations}
        decisions: {type: reference, value: population_decisions}
      returns:
        type: object
        required: [accepted, receipt_path]
        properties:
          accepted: {type: boolean}
          receipt_path: {type: string, minLength: 1}
      bind: population_review
  - gate:
      subject: population_review.accepted
      equals: true
      on_failure: {terminal: failed}

  # Run approved contracts before editing. Passing cases require no coding
  # task; failing cases are the only inputs to task compilation.
  - operation:
      tool: internal
      command: [run_obligation_baseline]
      parameters:
        plans: {type: reference, value: obligation_verification_plans.plans}
        populations: {type: reference, value: obligation_populations.populations}
        population_review_receipt: {type: reference, value: population_review.receipt_path}
      returns:
        type: object
        required: [path, candidate_tree, case_results, failing_cases]
        properties:
          path: {type: string, minLength: 1}
          candidate_tree: {type: string, minLength: 1}
          case_results: {type: array}
          failing_cases: {type: array}
      bind: obligation_baseline

  # A CodeTask is the smallest independently verifiable repository transition.
  # It may satisfy several obligations, and one obligation may require several
  # CodeTasks. Pure Structrr metadata operations produce no CodeTask. Structural
  # decisions separately check failing-case assignment, obligation references,
  # validator presence, target-symbol resolution, bounded paths, protected
  # verification artifacts, and dependency acyclicity.
  - operation:
      tool: internal
      command: [compile_code_task_plan]
      parameters:
        baseline: {type: reference, value: baseline.path}
        plan: {type: reference, value: plan.path}
        proposal_review_receipt: {type: reference, value: proposal_review_result.receipt_path}
        verification_plans: {type: reference, value: obligation_verification_plans.plans}
        populations: {type: reference, value: obligation_populations.populations}
        baseline_evidence: {type: reference, value: obligation_baseline}
      returns:
        type: object
        required: [path, fingerprint, tasks, structural_decisions, semantic_worklist]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          tasks: {type: array}
          structural_decisions: {type: array, minItems: 1}
          semantic_worklist: {type: object}
      bind: code_task_plan
  - for_each:
      snapshot: {name: code_task_plan.structural_decisions, max_items: 4096}
      item_binding: code_task_structural_decision
      collect: {binding: code_task_structural_decisions, mode: list, value: code_task_structural_result}
      body:
        - operation:
            tool: internal
            command: [evaluate_deterministic_decision]
            parameters:
              decision: {type: reference, value: code_task_structural_decision}
            returns:
              type: object
              required: [outcome, explanation]
              properties:
                outcome: {type: string, enum: [pass, fail, blocked]}
                explanation: {type: string, minLength: 1}
            bind: code_task_structural_result
  - for_each:
      snapshot: {name: code_task_plan.semantic_worklist.specifications, max_items: 2048}
      item_binding: code_task_semantic_decision
      collect: {binding: code_task_semantic_decisions, mode: list, value: code_task_semantic_result}
      body:
        - judge:
            kind: verify_code_task_decision
            provider: planning
            question: Does this one code-task predicate pass based only on its supplied repository evidence?
            subject: code_task_semantic_decision.predicate
            prompt_system: Return only the declared JSON object.
            instructions:
              - Evaluate exactly the one predicate in code_task_semantic_decision.
              - Do not evaluate the whole task, sibling tasks, or the complete feature.
              - Use pass only when the supplied evidence proves this predicate.
              - Treat unrelated cleanup, speculative scope, and an unexecutable validator as failures.
              - Do not propose edits or return IDs, references, paths, selectors, or fingerprints.
            context: [code_task_semantic_decision, feature_description, plan, obligation_baseline, code_task_plan]
            output:
              name: code_task_semantic_result
              schema:
                type: object
                required: [outcome, explanation]
                additionalProperties: false
                properties:
                  outcome: {type: string, enum: [pass, fail, unknown, clarification]}
                  explanation: {type: string, minLength: 1}
            validation: {kind: json_schema}
  - operation:
      tool: internal
      command: [finalize_code_task_plan_review]
      parameters:
        task_plan: {type: reference, value: code_task_plan}
        structural_decisions: {type: reference, value: code_task_structural_decisions}
        semantic_decisions: {type: reference, value: code_task_semantic_decisions}
      returns:
        type: object
        required: [accepted, receipt_path]
        properties:
          accepted: {type: boolean}
          receipt_path: {type: string, minLength: 1}
      bind: code_task_plan_review
  - gate:
      subject: code_task_plan_review.accepted
      equals: true
      on_failure: {terminal: failed}

  # Each accepted task gets one bounded coding-agent invocation. The coding
  # agent never selects its own task, scope, validator, or success verdict.
  # Preconditions separately check current fingerprints, accepted dependencies,
  # a still-failing focused contract, resolvable target symbols, and available
  # validation commands.
  - for_each:
      snapshot: {name: code_task_plan.tasks, max_items: 512}
      item_binding: code_task
      collect: {binding: code_task_receipts, mode: list, value: code_task_receipt}
      body:
        - operation:
            tool: internal
            command: [compile_code_task_preconditions]
            parameters:
              task: {type: reference, value: code_task}
              task_plan_review_receipt: {type: reference, value: code_task_plan_review.receipt_path}
            returns:
              type: object
              required: [decisions]
              properties:
                decisions: {type: array, minItems: 1}
            bind: code_task_preconditions
        - for_each:
            snapshot: {name: code_task_preconditions.decisions, max_items: 256}
            item_binding: code_task_precondition
            collect: {binding: code_task_precondition_results, mode: list, value: code_task_precondition_result}
            body:
              - operation:
                  tool: internal
                  command: [evaluate_deterministic_decision]
                  parameters:
                    decision: {type: reference, value: code_task_precondition}
                  returns:
                    type: object
                    required: [outcome, explanation]
                    properties:
                      outcome: {type: string, enum: [pass, fail, blocked]}
                      explanation: {type: string, minLength: 1}
                  bind: code_task_precondition_result
        - operation:
            tool: internal
            command: [finalize_code_task_preconditions]
            parameters:
              task: {type: reference, value: code_task}
              decisions: {type: reference, value: code_task_precondition_results}
            returns:
              type: object
              required: [accepted, receipt_path]
              properties:
                accepted: {type: boolean}
                receipt_path: {type: string, minLength: 1}
            bind: code_task_precondition_review
        - gate:
            subject: code_task_precondition_review.accepted
            equals: true
            on_failure: {terminal: failed}
        - operation:
            tool: internal
            command: [capture_code_task_before_state]
            parameters:
              task: {type: reference, value: code_task}
            returns:
              type: object
              required: [path, fingerprint]
              properties:
                path: {type: string, minLength: 1}
                fingerprint: {type: string, minLength: 1}
            bind: code_task_before_state
        - operation:
            tool: internal
            command: [run_code_task_agent]
            parameters:
              task: {type: reference, value: code_task}
              before_state: {type: reference, value: code_task_before_state}
              precondition_receipt: {type: reference, value: code_task_precondition_review.receipt_path}
            returns:
              type: object
              required: [request_id, attempt]
              properties:
                request_id: {type: string, minLength: 1}
                attempt: {type: object}
            bind: code_task_implementation
        - operation:
            tool: internal
            command: [compile_code_task_postconditions]
            parameters:
              task: {type: reference, value: code_task}
              before_state: {type: reference, value: code_task_before_state}
              implementation: {type: reference, value: code_task_implementation}
            returns:
              type: object
              required: [path, fingerprint, decisions]
              properties:
                path: {type: string, minLength: 1}
                fingerprint: {type: string, minLength: 1}
                decisions: {type: array, minItems: 1}
            bind: code_task_postconditions
        # Postconditions are emitted as separate deterministic decisions for:
        # worker completion, a nonempty task-local diff, allowed-path scope,
        # protected-path preservation, git diff validity, focused-validator
        # success, each preservation validator, and evidence currency.
        - for_each:
            snapshot: {name: code_task_postconditions.decisions, max_items: 512}
            item_binding: code_task_postcondition
            collect: {binding: code_task_postcondition_results, mode: list, value: code_task_postcondition_result}
            body:
              - operation:
                  tool: internal
                  command: [evaluate_deterministic_decision]
                  parameters:
                    decision: {type: reference, value: code_task_postcondition}
                  returns:
                    type: object
                    required: [outcome, explanation]
                    properties:
                      outcome: {type: string, enum: [pass, fail, blocked]}
                      explanation: {type: string, minLength: 1}
                  bind: code_task_postcondition_result
        - operation:
            tool: internal
            command: [finalize_code_task_receipt]
            parameters:
              task: {type: reference, value: code_task}
              before_state: {type: reference, value: code_task_before_state}
              implementation: {type: reference, value: code_task_implementation}
              postconditions: {type: reference, value: code_task_postconditions}
              decisions: {type: reference, value: code_task_postcondition_results}
            returns:
              type: object
              required: [accepted, receipt_path, task_id, diff_fingerprint]
              properties:
                accepted: {type: boolean}
                receipt_path: {type: string, minLength: 1}
                task_id: {type: string, minLength: 1}
                diff_fingerprint: {type: string, minLength: 1}
            bind: code_task_receipt
        - gate:
            subject: code_task_receipt.accepted
            equals: true
            on_failure: {terminal: failed}

  # Re-run complete obligation contracts over the final candidate tree. Task
  # receipts are evidence of local transitions, not substitutes for universal
  # population coverage or final-state evidence.
  - operation:
      tool: internal
      command: [run_final_obligation_evidence]
      parameters:
        plans: {type: reference, value: obligation_verification_plans.plans}
        populations: {type: reference, value: obligation_populations.populations}
        task_receipts: {type: reference, value: code_task_receipts}
      returns:
        type: object
        required: [path, candidate_tree, evidence, closure_decisions]
        properties:
          path: {type: string, minLength: 1}
          candidate_tree: {type: string, minLength: 1}
          evidence: {type: array}
          closure_decisions: {type: array, minItems: 1}
      bind: final_obligation_evidence
  - for_each:
      snapshot: {name: final_obligation_evidence.closure_decisions, max_items: 8192}
      item_binding: obligation_closure_decision
      collect: {binding: obligation_closure_decisions, mode: list, value: obligation_closure_result}
      body:
        - operation:
            tool: internal
            command: [evaluate_deterministic_decision]
            parameters:
              decision: {type: reference, value: obligation_closure_decision}
            returns:
              type: object
              required: [outcome, explanation]
              properties:
                outcome: {type: string, enum: [pass, fail, blocked]}
                explanation: {type: string, minLength: 1}
            bind: obligation_closure_result
  - operation:
      tool: internal
      command: [finalize_obligation_closure]
      parameters:
        evidence: {type: reference, value: final_obligation_evidence}
        decisions: {type: reference, value: obligation_closure_decisions}
      returns:
        type: object
        required: [accepted, receipt_path]
        properties:
          accepted: {type: boolean}
          receipt_path: {type: string, minLength: 1}
      bind: obligation_closure
  - gate:
      subject: obligation_closure.accepted
      equals: true
      on_failure: {terminal: failed}

  - for_each:
      snapshot: {name: validation_profiles, max_items: 128}
      item_binding: validation_profile
      collect: {binding: validation_results, mode: list, value: validation_result}
      body:
        - operation:
            tool: internal
            command: [run_validation_profile]
            parameters:
              profile: {type: reference, value: validation_profile}
              task_receipts: {type: reference, value: code_task_receipts}
            returns: {type: object}
            bind: validation_result
  - operation:
      tool: internal
      command: [aggregate_validation]
      parameters:
        task_receipts: {type: reference, value: code_task_receipts}
        results: {type: reference, value: validation_results}
      returns:
        type: object
        required: [passed]
        properties: {passed: {type: boolean}}
      bind: validation
  - gate:
      subject: validation.passed
      equals: true
      on_failure: {terminal: failed}

  # Final review is still decomposed into one semantic predicate per decision.
  # The reducer, not the reviewing model, issues the aggregate verdict.
  - operation:
      tool: internal
      command: [prepare_final_implementation_review]
      parameters:
        plan: {type: reference, value: plan.path}
        proposal_review_receipt: {type: reference, value: proposal_review_result.receipt_path}
        obligation_closure_receipt: {type: reference, value: obligation_closure.receipt_path}
        task_receipts: {type: reference, value: code_task_receipts}
        validation: {type: reference, value: validation}
      returns:
        type: object
        required: [path, fingerprint, deterministic_decisions, semantic_worklist]
        properties:
          path: {type: string, minLength: 1}
          fingerprint: {type: string, minLength: 1}
          deterministic_decisions: {type: array, minItems: 1}
          semantic_worklist: {type: object}
      bind: final_implementation_review
  - for_each:
      snapshot: {name: final_implementation_review.deterministic_decisions, max_items: 4096}
      item_binding: final_deterministic_decision
      collect: {binding: final_deterministic_decisions, mode: list, value: final_deterministic_result}
      body:
        - operation:
            tool: internal
            command: [evaluate_deterministic_decision]
            parameters:
              decision: {type: reference, value: final_deterministic_decision}
            returns:
              type: object
              required: [outcome, explanation]
              properties:
                outcome: {type: string, enum: [pass, fail, blocked]}
                explanation: {type: string, minLength: 1}
            bind: final_deterministic_result
  - for_each:
      snapshot: {name: final_implementation_review.semantic_worklist.specifications, max_items: 4096}
      item_binding: final_semantic_decision
      collect: {binding: final_semantic_decisions, mode: list, value: final_semantic_result}
      body:
        - judge:
            kind: verify_implementation_decision
            provider: planning
            question: Does this one final-state predicate pass based only on its bounded evidence?
            subject: final_semantic_decision.predicate
            prompt_system: Return only the declared JSON object.
            instructions:
              - Evaluate exactly the one predicate in final_semantic_decision.
              - Do not evaluate sibling predicates or issue an aggregate implementation verdict.
              - Use pass only when the supplied evidence proves this predicate in the final candidate tree.
              - Return fail or unknown when evidence is missing, stale, or contradictory.
              - Do not propose repairs or return IDs, references, paths, selectors, or fingerprints.
            context: [final_semantic_decision, feature_description, plan, final_obligation_evidence, validation, final_implementation_review]
            output:
              name: final_semantic_result
              schema:
                type: object
                required: [outcome, explanation]
                additionalProperties: false
                properties:
                  outcome: {type: string, enum: [pass, fail, unknown]}
                  explanation: {type: string, minLength: 1}
            validation: {kind: json_schema}
  - operation:
      tool: internal
      command: [finalize_implementation_review]
      parameters:
        review: {type: reference, value: final_implementation_review}
        deterministic_decisions: {type: reference, value: final_deterministic_decisions}
        semantic_decisions: {type: reference, value: final_semantic_decisions}
      returns:
        type: object
        required: [accepted, receipt_path]
        properties:
          accepted: {type: boolean}
          receipt_path: {type: string, minLength: 1}
      bind: final_review
  - gate:
      subject: final_review.accepted
      equals: true
      on_failure: {terminal: failed}

  - operation:
      tool: internal
      command: [open_pull_request]
      parameters:
        review: {type: reference, value: final_review}
        plan: {type: reference, value: plan.path}
        work_item_name: {type: reference, value: work_item_name}
        feature_description: {type: reference, value: feature_description}
      returns: {type: [string, 'null']}
      bind: pull_request
  - operation:
      tool: internal
      command: [create_pr_changelog]
      parameters:
        pull_request: {type: reference, value: pull_request}
        plan: {type: reference, value: plan.path}
        work_item_name: {type: reference, value: work_item_name}
        feature_description: {type: reference, value: feature_description}
      returns: {type: [string, 'null']}
      bind: changelog
  - operation:
      tool: internal
      command: [update_pull_request]
      parameters:
        pull_request: {type: reference, value: pull_request}
        changelog: {type: reference, value: changelog}
      returns: {type: [string, 'null']}
      bind: updated_pull_request
  - terminal: succeeded
