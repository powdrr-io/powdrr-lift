# This file is read-only and should never be edited by a tool or agent.
schema: https://powdrr.io/schemas/specification-v1
id: powdrr-lift
modules:
  - id: powdrr-lift-core
    action: added
    relative_location: src/powdrr_lift/core/
    purpose: Core domain logic for specification management, validation, and project structure.
  - id: powdrr-lift-cli
    action: added
    relative_location: src/powdrr_lift/cli.py
    purpose: CLI entry point for powdrr-lift commands.
  - id: powdrr-lift-workflow-chat-agent
    action: added
    relative_location: src/powdrr_lift/workflow_chat_agent.py
    purpose: Agent that drives workflow execution and skill orchestration.
  - id: powdrr-lift-workflow-chat-tui
    action: added
    relative_location: src/powdrr_lift/workflow_chat_tui.py
    purpose: Terminal UI for interactive workflow chat sessions.
  - id: powdrr-lift-mcp-server
    action: added
    relative_location: src/powdrr_lift/mcp_server.py
    purpose: MCP server exposing powdrr-lift tools to external clients.
  - id: powdrr-lift-change-log-parser
    action: added
    relative_location: src/powdrr_lift/change_log_parser/
    purpose: Parse and validate change log entries.
  - id: powdrr-lift-tests
    action: added
    relative_location: tests/
    purpose: Test suite for all powdrr-lift modules.
tools:
  - id: ruff-format
    action: added
    when_to_use: Format Python source files with ruff.
    template: uv run --extra dev ruff format .
    validation_action:
      kind: invoke_tool
      tool: shell
      parameters:
        command: uv run --extra dev ruff format .
    how_to_use: Run from repository root.
    labels:
      - format
      - pr-prep
  - id: ruff-format-check
    action: added
    when_to_use: Check Python source formatting without modifying files.
    template: uv run --extra dev ruff format --check .
    validation_action:
      kind: invoke_tool
      tool: shell
      parameters:
        command: uv run --extra dev ruff format --check .
    how_to_use: Run from repository root.
    labels:
      - format
      - pr-prep
  - id: ruff-lint
    action: added
    when_to_use: Lint Python source files with ruff.
    template: uv run --extra dev ruff check .
    validation_action:
      kind: invoke_tool
      tool: shell
      parameters:
        command: uv run --extra dev ruff check .
    how_to_use: Run from repository root.
    labels:
      - lint
      - pr-prep
  - id: pytest
    action: added
    when_to_use: Run the test suite.
    template: uv run --extra dev pytest
    validation_action:
      kind: invoke_tool
      tool: shell
      parameters:
        command: uv run --extra dev pytest
    how_to_use: Run from repository root.
    labels:
      - test
      - pr-prep
  - id: mypy
    action: added
    when_to_use: Type-check Python source and test files.
    template: uv run --extra dev mypy src tests
    validation_action:
      kind: invoke_tool
      tool: shell
      parameters:
        command: uv run --extra dev mypy src tests
    how_to_use: Run from repository root.
    labels:
      - type-check
      - pr-prep
  - id: intrinsic-git
    action: added
    when_to_use: Read status, stage explicit paths, or move a file within the active worktree.
    template: '{"action":"invoke_tool","tool":"git","parameters":{"operation":"status"}}'
    validation_action:
      kind: invoke_tool
      tool: git
      parameters:
        operation: status
    how_to_use: >-
      This intrinsic tool is always available. Use operation status, add, or
      move. For staging, pass paths as an array; for moving, pass source and
      destination relative paths. It cannot run arbitrary Git commands.
    labels:
      - git
      - workflow
      - pr-prep
  - id: intrinsic-gh
    action: added
    when_to_use: Create or inspect a GitHub pull request from the active worktree.
    template: '{"action":"invoke_tool","tool":"gh","parameters":{"operation":"pr_view","pr_reference":"394"}}'
    validation_action:
      kind: invoke_tool
      tool: gh
      parameters:
        operation: pr_view
        pr_reference: '394'
    how_to_use: >-
      This intrinsic tool is always available. Use pr_create, pr_view,
      pr_diff, pr_checks, pr_edit, or pr_comments. It is limited to pull
      request operations and cannot run arbitrary gh commands.
    labels:
      - github
      - pull-request
      - workflow
  - id: validate-pr-files
    action: added
    when_to_use: Validate every recognized repository-format file changed on the checked-out branch or in a pull request.
    template: uv run powdrr-lift validate-pr-files --repo-root .
    validation_action:
      kind: invoke_tool
      tool: shell
      parameters:
        command: uv run powdrr-lift validate-pr-files --repo-root .
    how_to_use: Run from the checked-out worktree; by default it validates files changed by the current branch relative to main, including staged and unstaged changes. Use --pr-number only when a GitHub pull request number is available. It validates changed skill, workflow, project-structure, workflow-template, and specification-v1 files and returns non-zero when any validator fails.
    labels:
      - validation
      - pr-prep
      - yaml
