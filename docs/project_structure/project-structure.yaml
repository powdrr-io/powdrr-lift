      Project configuration including dependencies (basedpyright, mypy, pytest,
      ruff), pytest options, ruff format/lint settings, and mypy configuration.
    evidence: "rg -n pytest|ruff|mypy pyproject.toml"
  - id: makefile
    path: Makefile
    parent_module: null
    related_modules: [ci-workflow]
    purpose: >
      Make targets for format, format-check, lint, test, and type-check
      commands.
    evidence: "rg -n 'uv run' Makefile"
tools:
  - id: ruff-format
    related_modules: [project-config, makefile]
    labels: [formatting, python]
    when_to_use: "Format Python code before committing."
    template: "uv run ruff format ."
    how_to_use: "Run from the repository root to auto-format all Python files."
    evidence: "Makefile:4, .github/workflows/ci.yml:50"
  - id: ruff-format-check
    related_modules: [project-config, ci-workflow]
    labels: [formatting, ci, python]
    when_to_use: "Verify formatting in CI without modifying files."
    template: "uv run ruff format --check ."
    how_to_use: "Run from the repository root; exits non-zero if formatting is needed."
    evidence: "Makefile:7, .github/workflows/ci.yml:50"
  - id: ruff-lint
    related_modules: [project-config, makefile]
    labels: [linting, python]
    when_to_use: "Lint Python code for style and error detection."
    template: "uv run ruff check ."
    how_to_use: "Run from the repository root to lint all Python files."
    evidence: "Makefile:10, .github/workflows/ci.yml:53"
  - id: mypy-type-check
    related_modules: [project-config, makefile]
    labels: [type-checking, python]
    when_to_use: "Static type-check source and test code."
    template: "uv run mypy src tests"
    how_to_use: "Run from the repository root to type-check src/ and tests/."
    evidence: "Makefile:16, .github/workflows/ci.yml:56"
  - id: pytest
    related_modules: [test-suite, project-config]
    labels: [testing, python]
    when_to_use: "Run the test suite."
    template: "uv run pytest"
    how_to_use: "Run from the repository root to execute all tests."
    evidence: "Makefile:13, .github/workflows/ci.yml:59"
