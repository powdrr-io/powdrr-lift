schema: https://powdrr.io/schemas/specification-v1
id: bootstrap-json-output-v1
title: Bootstrap Structrr JSON output
entities:
- id: bootstrap-json-summary
  type: Feature
  action: added
  rationale: Supports "req-json-summary" by defining the machine-readable bootstrap
    result.
  name: Bootstrap JSON Summary
  description: A stable JSON representation of a validated Structrr bootstrap result.
- id: bootstrap-structrr-command
  type: Command
  action: changed
  rationale: Supports "req-json-summary" by exposing the summary through the CLI.
  name: Bootstrap Structrr Command
  description: The command that generates and validates a Structrr snapshot.
- id: bootstrap-cli-module
  type: Module
  action: changed
  rationale: Supports "appr-json-serialization" by implementing the CLI output mode.
  name: Bootstrap CLI Module
  description: The CLI module that parses options and formats bootstrap results.
modules:
- id: mod-bootstrap-cli
  action: changed
  relative_location: src/powdrr_lift/cli.py
  purpose: Parse the JSON option and serialize the validated result.
entity_relationships:
- id: rel-command-produces-summary
  description: The bootstrap command produces the validated JSON summary.
  rationale: Supports "req-json-summary" by connecting the command to its output.
  source: bootstrap-structrr-command
  target: bootstrap-json-summary
  relationship: produces
  action: added
  from: bootstrap-structrr-command
  to: bootstrap-json-summary
invariants:
- id: inv-json-only-after-validation
  description: JSON output is emitted only after the bootstrap snapshot validates
    successfully.
  rationale: Supports "req-json-summary" by preventing consumers from accepting invalid
    state.
  related:
    entities:
    - bootstrap-json-summary
    entity_relationships:
    - rel-command-produces-summary
  action: added
guidance:
- id: guid-human-default
  description: Preserve human-readable output when --json is not requested.
  rationale: Supports "req-human-default" by keeping the existing operator-facing
    interface stable.
  related:
    entities:
    - bootstrap-structrr-command
  action: added
