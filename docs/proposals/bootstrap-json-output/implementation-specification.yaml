schema: https://powdrr.io/schemas/specification-v1
title: Bootstrap Structrr JSON output
architecture_id: bootstrap-json-output-v1
entities:
- id: bootstrap-json-summary
  action: added
  rationale: Carries the validated snapshot path and deterministic evidence counts
    to automation.
- id: bootstrap-structrr-command
  action: changed
  rationale: Exposes the JSON summary mode while retaining the existing human-readable
    default.
modules:
- id: mod-bootstrap-cli
  action: changed
  relative_location: src/powdrr_lift/cli.py
  purpose: Parse --json and serialize the validated bootstrap result.
entity_relationships:
- id: rel-command-produces-summary
  action: added
  rationale: The command produces the summary after validation succeeds.
features:
- id: feat-bootstrap-json-output
  action: added
  description: Emit a stable JSON object containing the validated bootstrap summary.
  functional_requirements:
  - --json emits valid JSON on stdout after successful validation.
  - The JSON contains the output path and all five evidence counts.
  - The default invocation preserves the existing human-readable output.
  - Bootstrap excludes generated current Structrr snapshots from future evidence scans.
decisions:
- id: dec-preserve-human-bootstrap-output
  action: added
  description: Keep human-readable output as the default and make JSON opt-in for
    automation.
