schema: https://powdrr.io/schemas/specification-v1
id: bootstrap-json-output
feature_ids:
- feature-document-families
intent:
  problem: The bootstrap command only exposes human-readable output, so automation
    cannot consume validated bootstrap state without parsing text.
  goal: Add a machine-readable summary mode to bootstrap-structrr for Procedrr and
    Workrr consumers.
  reasoning: A validated JSON handoff lets later steps consume bootstrap state without
    parsing human output.
acceptance_criteria:
- id: ac-json-summary
  description: The --json option emits output_path and all five evidence counts after
    validation succeeds.
- id: ac-human-default
  description: The default invocation remains human-readable.
expected_tests:
- id: test-json-summary
  description: Exercise the JSON output contract through the CLI.
- id: test-current-snapshot-filter
  description: Verify tracked generated current snapshots are excluded from later
    bootstrap scans.
expected_outcomes:
- id: outcome-typed-bootstrap-handoff
  description: Workrr can consume the validated bootstrap summary as structured data.
