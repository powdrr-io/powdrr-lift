schema: https://powdrr.io/schemas/specification-v1
id: interaction-file-log
title: "Feature: interaction-file-logging \u2014 capture all human and LLM interaction\
  \ inputs and outputs to a file log. Requirements: (1) Log every interaction with\
  \ the user and with the LLM, recording both the input and the output of each interaction.\
  \ (2) Store the log in JSON format. (3) Use a hidden directory named .powdrr and\
  \ a file named interaction-log.json within it (i.e., .powdrr/interaction-log.json).\
  \ The log should capture the full input and output of each human or LLM interaction."
