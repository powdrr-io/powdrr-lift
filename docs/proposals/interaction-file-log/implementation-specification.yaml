schema: https://powdrr.io/schemas/specification-v1
title: Interaction File Log Implementation
architecture_id: interaction-file-log-architecture
entities:
- id: entity-interaction-log
  action: added
  rationale: Stores all human and LLM interactions as JSONL entries.
- id: entity-log-writer
  action: added
  rationale: Writes each interaction entry to the log file.
- id: entity-interaction-entry
  action: added
  rationale: Represents a single interaction with timestamp, actor, input, output,
    errors, skill, and step.
- id: entity-error-handler
  action: added
  rationale: Handles logging failures without crashing the workflow.
- id: entity-repository-root
  action: added
  rationale: Location where the JSONL log file is written.
- id: entity-test-suite
  action: added
  rationale: Verifies the feature with unit tests and an end-to-end workflow run.
modules:
- id: module-log-writer
  action: added
  relative_location: src/log_writer.py
  purpose: Serializes interaction entries to JSONL and writes them to the repository
    root.
- id: module-error-handler
  action: added
  relative_location: src/error_handler.py
  purpose: Catches logging failures and continues the workflow without crashing.
tools:
- id: tool-jsonl-writer
  action: added
  when_to_use: Whenever an interaction entry needs to be appended to the log.
  template: JSONL format with one entry per line.
  how_to_use: Call the log writer with the interaction entry data.
entity_relationships:
- id: rel-log-writer-writes-entry
  action: added
  rationale: The log writer serializes each interaction entry to JSONL.
- id: rel-log-writer-writes-to-root
  action: added
  rationale: The log writer places the JSONL log at the repository root.
- id: rel-error-handler-wraps-writer
  action: added
  rationale: The error handler catches logging failures without crashing the workflow.
- id: rel-test-suite-verifies-log
  action: added
  rationale: The test suite verifies the log with unit tests and an end-to-end workflow
    run.
features:
- id: feature-interaction-logging
  action: added
  description: Log all human and LLM interactions to a JSONL file at the repository
    root.
  functional_requirements:
  - Record every human and LLM input and output, including errors, the active skill,
    and the current workflow step.
  - Write entries in JSONL format to a file at the repository root.
  - Handle logging failures without crashing the workflow.
decisions:
- id: decision-jsonl-format
  action: added
  description: Use JSONL for the log format to support append-only, line-delimited
    entries.
