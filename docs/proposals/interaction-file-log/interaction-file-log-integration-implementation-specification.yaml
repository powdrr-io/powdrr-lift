schema: https://powdrr.io/schemas/specification-v1
title: Interaction File Log Integration Implementation
architecture_id: '2026-08-22'
entities:
- id: interaction-log
  action: changed
  rationale: Central log file storing all interaction entries, now integrated into
    the workflow.
- id: interaction-entry
  action: changed
  rationale: A single recorded interaction with input and output, now written by the
    integrated log writer.
- id: log-writer
  action: changed
  rationale: Writes interaction entries to the log file, now invoked from the workflow.
- id: interaction-source
  action: changed
  rationale: Origin of an interaction, human or LLM, now captured by the integrated
    log writer.
modules:
- id: mod-log-writer
  action: changed
  relative_location: src/log_writer/
  purpose: Writes interaction entries to the JSON log file in the hidden .powdrr directory,
    integrated into the workflow.
tools:
- id: tool-log-writer
  action: changed
  when_to_use: Whenever an interaction with a human or LLM occurs and needs to be
    logged, now invoked automatically by the workflow.
  template: interaction-log-writer
  how_to_use: Invoke the log writer to append the interaction input and output to
    the log file, now called from the workflow.
entity_relationships:
- id: rel-writer-appends
  action: changed
  rationale: The log writer appends entries to the log, now integrated into the workflow.
- id: rel-log-contains
  action: changed
  rationale: The log contains interaction entries, now populated by the integrated
    log writer.
- id: rel-source-feeds
  action: changed
  rationale: Interaction sources feed entries to the writer, now captured by the integrated
    log writer.
features:
- id: feat-integrated-log-writer
  action: changed
  description: Integrated log writer that appends interaction entries as JSON to the
    log file from the workflow.
  functional_requirements:
  - Append interaction input and output as a JSON entry from the workflow.
  - Store the log in the hidden .powdrr directory.
  - Support human and LLM interaction sources from the workflow.
decisions:
- id: dec-json-format
  action: changed
  description: Use JSON Lines format for the interaction log, now integrated into
    the workflow.
