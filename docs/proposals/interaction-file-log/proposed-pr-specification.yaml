schema: https://powdrr.io/schemas/proposed-pr-specification-v1
id: interaction-file-log
feature_ids:
- interaction-log-json
proposed_prs:
- id: interaction-file-log-pr-1
  intent: Add the interaction-log entity, its writer module/tool, and the interaction-log-file
    entity with the writer writing the file.
  justification: Establishes the core interaction log data model and the writer that
    produces the log file, forming the foundation for the feature.
- id: interaction-file-log-pr-2
  intent: Add the interaction-log-has-writer and interaction-log-writer-writes-file
    relationships.
  justification: Documents the structural relationships between the interaction log,
    its writer, and the log file, making the model explicit and verifiable.
  dependent_prs:
  - interaction-file-log-pr-1
- id: interaction-file-log-pr-3
  intent: Add the interaction-log-json feature and the interaction-log-location decision.
  justification: Declares the feature-level capability and records the decision on
    where interaction logs are stored, completing the specification.
  dependent_prs:
  - interaction-file-log-pr-2
entities:
- id: interaction-log
  action: added
  proposed_pr_id: interaction-file-log-pr-1
- id: interaction-log-writer
  action: added
  proposed_pr_id: interaction-file-log-pr-1
- id: interaction-log-file
  action: added
  proposed_pr_id: interaction-file-log-pr-1
modules:
- id: interaction-log-writer
  action: added
  proposed_pr_id: interaction-file-log-pr-1
tools:
- id: interaction-log-writer
  action: added
  proposed_pr_id: interaction-file-log-pr-1
entity_relationships:
- id: interaction-log-has-writer
  action: added
  proposed_pr_id: interaction-file-log-pr-2
- id: interaction-log-writer-writes-file
  action: added
  proposed_pr_id: interaction-file-log-pr-2
features:
- id: interaction-log-json
  action: added
  proposed_pr_id: interaction-file-log-pr-3
decisions:
- id: interaction-log-location
  action: added
  proposed_pr_id: interaction-file-log-pr-3
