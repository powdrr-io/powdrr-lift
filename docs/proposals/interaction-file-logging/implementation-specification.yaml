schema: https://powdrr.io/schemas/specification-v1
# Architecture id: 2026-08-14
# Available entities:
# - interaction-log-entry
# Available relationships:
# - rel-log-entry-to-file
# Available modules:
# - logging-module
# Available tools:
# - interaction-log-validator
title: Interaction File Logging Implementation
architecture_id: "2026-08-14"
entities:
  - id: interaction-log-entry
    action: added
    rationale: 'Core entity for the interaction-file-logging feature, required by "req-1" and "app-1".'
modules:
  - id: logging-module
    action: added
    relative_location: src/powdrr_lift/interaction_log.py
    purpose: 'Provides the logging module that intercepts interactions, serializes them as JSON, and writes them to the log file.'
tools:
  - id: interaction-log-validator
    action: added
    when_to_use: 'When validating that a log file contains valid JSON entries with the expected structure.'
    how_to_use: 'Run the validator against the log file path to check JSON validity and entry structure.'
entity_relationships:
  - id: rel-log-entry-to-file
    action: added
    rationale: 'Each interaction log entry is written to the log file by the logging module, required by "app-1".'
features:
  - id: feature-interaction-capture
    action: added
    description: 'Capture and persist all human and LLM interaction inputs and outputs to per-session JSON log files.'
    functional_requirements:
      - 'All human and LLM inputs and outputs must be written to the log file.'
      - 'Log files must be in JSON format.'
      - 'Each CLI session must produce its own timestamped log file in the .powdrr directory.'
decisions:
  - id: decision-non-blocking-write
    action: added
    description: 'Use asynchronous I/O or a background queue to write log entries so the interaction flow is never blocked.'
