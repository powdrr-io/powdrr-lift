# This file is read-only and should never be edited by a tool or agent.
schema: https://powdrr.io/schemas/specification-v1
# Architecture id: interaction-file-logging-architecture
# Available entities:
# - interaction-log-writer
# - interaction-log-reader
# - binary-data-handler
# Available relationships:
# - writer-uses-binary-handler
# - reader-uses-binary-handler
# Available modules:
# - interaction-log-writer
# - interaction-log-reader
# - binary-data-handler
# Available tools:
# - interaction-log-writer
# - interaction-log-reader
# - binary-data-handler
title: Interaction File Logging Implementation
architecture_id: interaction-file-logging-architecture
entities:
  - id: interaction-log-writer
    action: added
    rationale: Add the log writer module to capture and write all human and LLM interaction inputs and outputs to JSON log files per 'req-1' and 'app-1'.
  - id: interaction-log-reader
    action: added
    rationale: Add the log reader module to retrieve interaction records from JSON log files per 'req-1'.
  - id: binary-data-handler
    action: added
    rationale: Add the binary data handler module to encode and decode binary data for JSON-safe storage and retrieval per 'req-1'.
modules:
  - id: interaction-log-writer
    action: added
    relative_location: src/interaction_logging/writer.py
    purpose: Write interaction records to JSON log files.
  - id: interaction-log-reader
    action: added
    relative_location: src/interaction_logging/reader.py
    purpose: Read interaction records from JSON log files.
  - id: binary-data-handler
    action: added
    relative_location: src/interaction_logging/binary_handler.py
    purpose: Encode and decode binary data for JSON-safe storage.
tools:
  - id: interaction-log-writer
    action: added
    when_to_use: When an interaction needs to be persisted to the log file.
    how_to_use: Call the write method with the interaction data.
  - id: interaction-log-reader
    action: added
    when_to_use: When stored interactions need to be retrieved or inspected.
    how_to_use: Call the read method with optional filters.
  - id: binary-data-handler
    action: added
    when_to_use: When binary data is part of an interaction that must be stored or retrieved.
    how_to_use: Use encode before writing and decode after reading.
entity_relationships:
  - id: writer-uses-binary-handler
    action: added
    rationale: The writer uses the binary data handler to encode binary data before writing per 'req-1'.
  - id: reader-uses-binary-handler
    action: added
    rationale: The reader uses the binary data handler to decode binary data after reading per 'req-1'.
features:
  - id: feature-interaction-capture
    action: added
    description: Capture and persist all human and LLM interaction inputs and outputs to per-session JSON log files.
    functional_requirements:
      - All human and LLM inputs and outputs must be written to the log file.
      - Log files must be in JSON format.
      - Each CLI session must produce its own timestamped log file in the .powdrr directory.
  - id: feature-binary-data-handling
    action: added
    description: Store and retrieve binary data in JSON log files without data loss.
    functional_requirements:
      - Binary data must be encoded as JSON-safe strings before writing.
      - Binary data must be decoded back to its original form after reading.
      - Binary data round-trip must preserve data integrity.
decisions:
  - id: decision-use-json-format
    action: added
    description: Use JSON as the log file format for interoperability and ease of inspection.
  - id: decision-use-hidden-directory
    action: added
    description: Store log files in the .powdrr hidden directory to avoid cluttering the user workspace.
  - id: decision-per-session-files
    action: added
    description: Use per-session timestamped log files to prevent data loss across multiple CLI sessions.
