schema: https://powdrr.io/schemas/specification-v1
title: Interactive Entity Exploration
architecture_id: '2026-08-24'
entities:
- id: entity-exploration-session
  action: added
  rationale: Represents the interactive session state for exploring entities, supporting
    filtering, sorting, pagination, and detail selection per req-1.
- id: entity-list-view
  action: added
  rationale: Displays the filtered, sorted, and paginated list of entities during
    the exploration session per req-1.
- id: entity-detail-view
  action: added
  rationale: Shows detailed information for a selected entity during the exploration
    session per req-1.
- id: default-prompt
  action: added
  rationale: The default prompt that asks the user what they want to do, returned
    to when the session ends or fails per req-2 and req-3.
- id: exploration-loop
  action: added
  rationale: The interactive loop that drives the exploration session, handling user
    inputs for filtering, sorting, pagination, and detail selection per appr-1.
- id: end-session-detector
  action: added
  rationale: Detects when the user requests to end the session and transitions back
    to the default prompt per appr-2.
- id: error-handler
  action: added
  rationale: Handles failures gracefully and returns to the default prompt per appr-3.
modules:
- id: mod-exploration-loop
  action: added
  relative_location: src/exploration/loop.py
  purpose: Implements the interactive exploration loop with filtering, sorting, pagination,
    and detail selection.
- id: mod-end-session-detector
  action: added
  relative_location: src/exploration/end_session.py
  purpose: Detects end-session requests and transitions back to the default prompt.
- id: mod-error-handler
  action: added
  relative_location: src/exploration/error_handler.py
  purpose: Handles errors gracefully and returns to the default prompt.
tools:
- id: tool-entity-listing
  action: added
  when_to_use: When the user requests to see existing entities and needs a filtered,
    sorted, or paginated list.
  template: List entities with filters, sort order, and page number.
  how_to_use: Invoke with filter, sort, and pagination parameters to display the entity
    list.
- id: tool-entity-detail
  action: added
  when_to_use: When the user selects an entity from the list to view its details.
  template: Show detailed information for the selected entity.
  how_to_use: Invoke with the selected entity id to display its details.
entity_relationships:
- id: rel-exploration-loop-entity-list
  action: added
  rationale: The exploration loop drives the entity list view per appr-1.
- id: rel-exploration-loop-entity-detail
  action: added
  rationale: The exploration loop drives the entity detail view per req-1.
- id: rel-end-session-default-prompt
  action: added
  rationale: The end-session detector transitions back to the default prompt per req-2.
- id: rel-error-handler-default-prompt
  action: added
  rationale: The error handler returns to the default prompt per req-3.
features:
- id: feat-interactive-exploration
  action: added
  description: Support an interactive back-and-forth exploration of existing entities
    with filtering, sorting, pagination, and entity detail selection.
  functional_requirements:
  - Support filtering entities by type or other attributes.
  - Support sorting entities by a chosen field.
  - Support pagination through the entity list.
  - Support selecting an entity to view its details.
  - Return to the default prompt when the user ends the session.
  - Return to the default prompt on graceful failure.
decisions:
- id: dec-interactive-loop
  action: added
  description: Use an interactive loop to drive the exploration session, with explicit
    end-session detection and error handling that returns to the default prompt.
