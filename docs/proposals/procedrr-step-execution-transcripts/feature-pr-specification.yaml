expected_outcomes:
- id: outcome-durable-transcript
  description: The evaluator exposes an ordered, durable transcript of every executed
    step, including step kind and path, relevant inputs, produced outputs, and succeeded
    or failed outcome.
risks:
- description: The new transcript capture must not break existing evaluator behavior,
    so regression risk from adding ordered step recording across all execution paths
    must be tracked.
  id: risk-transcript-regression
