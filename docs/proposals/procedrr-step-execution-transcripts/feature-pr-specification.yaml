schema: https://powdrr.io/schemas/specification-v1
id: procedrr-step-execution-transcripts
title: Add Procedrr step execution transcripts. Extend the Procedrr evaluator so EvaluationResult
  exposes an ordered, durable transcript of every executed step, including step kind
  and path, relevant inputs, produced outputs, and succeeded or failed outcome. Capture
  transcripts consistently across operations, judges, loops, retries/attempts, specializations,
  calls, repeats, branches, terminal steps, gates, nested fragments/processes, and
  failures. Preserve existing evaluator behavior and public compatibility, and add
  focused tests proving ordering, nested execution, captured values, and failure outcomes.
  Keep the implementation scoped to src/procedrr_evaluator/evaluator.py and tests/test_procedrr_evaluator.py.
requirements:
- description: Add Procedrr step execution transcripts. Extend the Procedrr evaluator
    so EvaluationResult exposes an ordered, durable transcript of every executed step,
    including step kind and path, relevant inputs, produced outputs, and succeeded
    or failed outcome. Capture transcripts consistently across operations, judges,
    loops, retries/attempts, specializations, calls, repeats, branches, terminal steps,
    gates, nested fragments/processes, and failures. Preserve existing evaluator behavior
    and public compatibility, and add focused tests proving ordering, nested execution,
    captured values, and failure outcomes. Keep the implementation scoped to src/procedrr_evaluator/evaluator.py
    and tests/test_procedrr_evaluator.py.
  id: req-step-execution-transcripts
  state: added
approach:
- description: Extend the Procedrr evaluator so EvaluationResult exposes an ordered,
    durable transcript of every executed step, including step kind and path, relevant
