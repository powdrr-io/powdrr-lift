schema: https://powdrr.io/schemas/pr-workflow-record-v1
pull_request: 315
title: Record workflow steps and tool calls in every agent PR
branch: codex/add-pr-workflow-record
base_branch: main
workflow:
  name: pr-workflow-record
  path: src/powdrr_lift/pr_workflow_record.py
  skills:
  - pr-workflow-record
  steps:
  - id: implement
    status: completed
    description: Implement automatic PR workflow record generation
  - id: verify
    status: completed
    description: Run tests, formatting, lint, and diff validation
  - id: publish
    status: completed
    description: Commit, push, and open the pull request
tool_calls:
- tool: shell
  parameters:
    command:
    - git
    - status
    - --short
  why: Confirm the dedicated worktree contains only the requested change before staging.
  returncode: 0
- tool: shell
  parameters:
    command:
    - uv
    - run
    - pytest
    - -q
  why: Verify the full repository test suite before publishing.
  returncode: 0
- tool: shell
  parameters:
    command:
    - gh
    - pr
    - create
    - --draft
  why: Open the required reviewable pull request for the feature branch.
  returncode: 0
explanation: This record is generated by the same workflow-record helper introduced
  in this PR. It documents the implementation, validation, and publication steps so
  the pull request is auditable.
