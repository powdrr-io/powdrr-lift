schema: https://powdrr.io/schemas/pr-workflow-record-v1
pull_request: 315
title: Record workflow steps and tool calls in every agent PR
branch: codex/add-pr-workflow-record
base_branch: main
workflow:
  name: pr-workflow-record
  path: src/powdrr_lift/pr_workflow_record.py
  skills:
  - pr-workflow-record
  steps:
  - id: implement
    status: completed
    description: Implement automatic PR workflow record generation
  - id: review-fix
    status: completed
    description: Record every workflow tool invocation and preserve validation compatibility
  - id: verify
    status: completed
    description: Run the full test, formatting, lint, and diff checks
tool_calls:
- tool: shell
  parameters:
    command:
    - git
    - status
    - --short
  why: Confirm the dedicated worktree contains only the requested change before staging.
  returncode: 0
- tool: shell
  parameters:
    command:
    - uv
    - run
    - pytest
    - -q
  why: Verify the full repository test suite before publishing.
  returncode: 0
- tool: shell
  parameters:
    command:
    - gh
    - pr
    - create
    - --draft
  why: Open the required reviewable pull request for the feature branch.
  returncode: 0
- tool: shell
  parameters:
    command:
    - gh
    - api
    - graphql
    - reviewThreads
  why: Inspect the authoritative review thread before changing the implementation.
  returncode: 0
- tool: shell
  parameters:
    command:
    - apply_patch
  why: Remove the shell-only gate and retain complete tool metadata in workflow events.
  returncode: 0
- tool: shell
  parameters:
    command:
    - uv
    - run
    - pytest
    - -q
  why: Verify the review fix against the full test suite before pushing.
  returncode: 0
explanation: This record documents the original implementation and the subsequent
  review-fix cycle, including why the tool-event changes were made and how they were
  validated.
