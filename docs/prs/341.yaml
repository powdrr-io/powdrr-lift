workflow:
  name: create-pull-request
  path: /Users/gregory/code/powdrr-lift/skill-definitions/create-pull-request.yaml
  skills:
  - create-pull-request
  steps:
  - description: Generate the pull request description template.
    step_type: invoke_tool
    details: Invoke `powdrr-lift pull-request-description --kind feature` exactly
      once. Keep the returned template in workflow context for the next step. Do not
      print the template, its sections, or a draft body to the chat or status window.
      Preserve the current branch and existing pull request context.
    llm_type: simple_task
    pre_step:
      action: invoke_tool
      template:
        tool: internal
        command:
        - powdrr-lift
        - pull-request-description
        - --kind
        - feature
  - description: Fill in the pull request description template.
    step_type: freeform
    details: Fill every section of the returned template using the validated work
      item, changed files, decisions, review or CI evidence, and exact checks that
      were actually run. Preserve useful existing pull request content when updating
      an existing PR; do not discard sections that are not part of the generated template.
      Include the problem and before/after behavior, scope and non-goals, implementation
      details, compatibility impact, validation commands and results, risks and mitigations,
      reviewer focus, follow-up, and references. Include any kind-specific evidence
      requested by the template. If a section does not apply, write Not applicable
      and why. Never leave a placeholder or claim an unrun check passed. Keep the
      completed body in workflow context and do not print it to the chat or status
      window.
    llm_type: high_reasoning
  - description: Stage the exact files that belong in the pull request.
    step_type: freeform
    details: Read the `files_to_publish` list from workflow context. It is authoritative
      for this pull request. Verify every listed path exists or is an intended new
      file, then invoke `git add` with exactly those paths. Do not use `git add .`,
      `git add --all`, or stage logs, caches, or unrelated files. Verify the staged
      names with `git diff --cached --name-only`; do not advance until every intended
      path is staged and no unintended path is staged.
    llm_type: simple_task
    tool_invocations:
    - tool: shell
      command:
      - git
      - add
      - <files-to-publish>
  - description: Commit the validated changes.
    step_type: freeform
    details: Confirm with `git diff --cached --name-only` that the exact `files_to_publish`
      list is staged and that the staged diff is non-empty. If any intended file is
      missing or any unrelated file is staged, correct the staging before continuing.
      Commit with `<commit-message>`, then verify that `HEAD` advanced. Never create
      an empty commit. Do not push or invoke any GitHub command in this step.
    llm_type: simple_task
    tool_invocations:
    - tool: internal
      command:
      - powdrr-lift
      - repository-state
    - tool: shell
      command:
      - git
      - commit
      - -m
      - <commit-message>
  - description: Push the committed changes.
    step_type: freeform
    details: Push the current feature branch with its upstream set. Verify that the
      remote branch contains the committed `HEAD` before continuing. Do not create
      or update a pull request in this step; leave the completed body in workflow
      context for the next step.
    llm_type: simple_task
    tool_invocations:
    - tool: shell
      command:
      - git
      - push
      - -u
      - origin
      - HEAD
  - description: Create a draft pull request when none exists.
    step_type: freeform
    details: 'First verify that the current branch has at least one committed change
      relative to the exact base branch. If `git rev-list --count <base-branch>..HEAD`
      is zero, do not invoke `gh pr create`: inspect `git status`, stage the intended
      files, commit them, push the branch, and retry this step. Uncommitted files
      alone are not sufficient for a pull request. Confirm that the pushed `HEAD`
      contains every `files_to_publish` path. Use this step only when no pull request
      exists for the current branch. Invoke `gh pr create --draft --title <pull-request-title>
      --body <populated-pr-description>` using the completed body from the previous
      steps. Do not print the body, edit an existing PR, or run any other tool. Do
      not report completion until the command succeeds and its output includes the
      pull request URL. Never merge the PR or push directly to main.'
    llm_type: simple_task
    tool_invocations:
    - tool: shell
      command:
      - gh
      - pr
      - create
      - --draft
      - --title
      - <pull-request-title>
      - --body
      - <populated-pr-description>
  - description: Update the existing pull request.
    step_type: freeform
    details: Use this step only when a pull request already exists for the current
      branch. Invoke `gh pr edit <pr-reference> --title <pull-request-title> --body
      <populated-pr-description>` using the completed body from the previous steps.
      Do not print the body, create a second PR, or run any other tool. Do not report
      completion until the command succeeds and its output identifies the pull request.
      Never merge the PR or push directly to main.
    llm_type: simple_task
    tool_invocations:
    - tool: shell
      command:
      - gh
      - pr
      - edit
      - <pr-reference>
      - --title
      - <pull-request-title>
      - --body
      - <populated-pr-description>
