- tool: shell
  parameters:
    command:
    - gh
    - pr
    - create
    - --draft
    - --title
    - Add interaction file log specifications
    - --body
    - '# Pull Request Description


      ## Summary


      Adds specification documents for the interaction-file-log feature, which captures
      all human and LLM interaction inputs and outputs in a JSON file log stored in
      a hidden .powdrr directory as interaction-log.json.


      ## Problem


      Human and LLM interactions are not currently recorded, making it impossible
      to audit or debug the full input/output history of each interaction.


      ## Behavior


      ### Before


      - No record of human or LLM interaction inputs and outputs exists.


      ### After


      - All human and LLM interaction inputs and outputs are captured in a JSON file
      log.

      - The log is stored in a hidden .powdrr directory as interaction-log.json.

      - New interactions are appended without overwriting existing entries.


      ## Scope


      ### Included


      - Architecture specification for the interaction-file-log feature.

      - Implementation specification for the interaction-file-log feature.

      - Proposed PR specification for the interaction-file-log feature.

      - System specification for the interaction-file-log feature.


      ### Explicitly not included


      - No user interface for viewing the log is included.

      - Log rotation or archival is not included.


      ## Implementation


      - The feature records every interaction with the user or LLM, capturing both
      inputs and outputs.

      - The log format is JSON, stored in a hidden directory with a fixed filename.

      - The log is append-only to preserve the full interaction history.


      ### Data, API, schema, or workflow changes


      - New JSON log file format introduced at .powdrr/interaction-log.json.


      ### Compatibility considerations


      - No existing behavior is broken; the feature adds new logging capability.


      ## Validation


      | Check | Command | Result |

      | --- | --- | --- |

      | Focused tests | Not applicable | No source code changes; specification documents
      only |

      | Full tests | Not applicable | No source code changes; specification documents
      only |

      | Formatting | uv run --extra dev ruff format . | Passed (111 files left unchanged)
      |

      | Lint | uv run --extra dev ruff check . | Passed |

      | Type checks | uv run --extra dev mypy src tests | Passed |


      ## Risks and Mitigations


      | Risk | Impact | Mitigation or evidence |

      | --- | --- | --- |

      | The log may grow large and fill the disk | High | Log rotation is a non-goal;
      future work can address archival |

      | Writing to the log may fail and must not break the interaction flow | Medium
      | Failure handling is specified in the implementation specification |


      ## Reviewer Guide


      Please focus on:


      - Verify the acceptance criteria cover JSON format, hidden directory, fixed
      filename, and capture of both human and LLM inputs and outputs.

      - Confirm the append-only behavior is correctly specified.

      - Review the test cases for completeness.


      Open questions or decisions needing review:


      - None.


      ## Dependencies and Follow-up


      - Depends on: None

      - Follow-up work: Implementation of the interaction-file-log feature

      - Rollback considerations: No runtime changes; specifications only


      ## References


      - Feature/specification: docs/proposals/interaction-file-log/

      - Related PRs/issues: None

      - Review comments addressed: None


      ## Feature Plan


      1. Architecture specification (docs/proposals/interaction-file-log/architecture-specification.yaml)

      2. Implementation specification (docs/proposals/interaction-file-log/implementation-specification.yaml)

      3. Proposed PR specification (docs/proposals/interaction-file-log/proposed-pr-specification.yaml)

      4. System specification (docs/proposals/interaction-file-log/system-specification.yaml)'
  returncode: 0
