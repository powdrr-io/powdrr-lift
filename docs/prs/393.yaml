- tool: shell
  parameters:
    command:
    - gh
    - pr
    - create
    - --draft
    - --title
    - Add interaction file log integration implementation specification
    - --body
    - '## Summary


      Adds the integration implementation specification for the interaction file log
      feature, defining the log writer, entities, tools, and relationships needed
      to integrate interaction logging into the workflow.


      ## Problem


      Interaction logging was not integrated into the workflow, requiring manual invocation
      of the log writer and leaving the log file disconnected from automated interaction
      capture.


      ## Behavior


      ### Before


      - The log writer was not automatically invoked by the workflow.

      - Interaction entries were not consistently captured from human and LLM sources.


      ### After


      - The log writer is invoked automatically from the workflow.

      - Interaction entries are appended as JSON Lines to the hidden .powdrr directory.

      - Human and LLM interaction sources are captured by the integrated log writer.


      ## Scope


      ### Included


      - Integration implementation specification for the interaction file log feature.


      ### Explicitly not included


      - Implementation of the log writer source code.

      - Workflow definition files.


      ## Implementation


      - Defines the log writer module and tool, entities, and relationships for integrated
      interaction logging.

      - Specifies JSON Lines format for the log file stored in the hidden .powdrr
      directory.


      ### Data, API, schema, or workflow changes


      - No source code or API changes; this is a specification document only.


      ### Compatibility considerations


      - No breaking changes; the specification describes intended integration behavior.


      ## Validation


      | Check | Command | Result |

      | --- | --- | --- |

      | Focused tests | Not applicable | No source code changes |

      | Full tests | uv run --extra dev pytest | Passed |

      | Formatting | uv run --extra dev ruff format --check . | Passed |

      | Lint | uv run --extra dev ruff check . | Passed |

      | Type checks | uv run --extra dev mypy src tests | Passed |

      | PR files | uv run powdrr-lift validate-pr-files --repo-root . | Passed |


      ## Risks and Mitigations


      | Risk | Impact | Mitigation or evidence |

      | --- | --- | --- |

      | Specification drift from implementation | Future implementation may diverge
      | Validation gate passed; implementation will reference this spec |


      ## Reviewer Guide


      Please focus on:


      - Confirm the entities, modules, tools, and relationships accurately describe
      the intended integration.

      - Verify the JSON Lines format and .powdrr storage location are appropriate.


      Open questions or decisions needing review:


      - None.


      ## Dependencies and Follow-up


      - Depends on: None

      - Follow-up work: Implement the log writer integration and workflow definition.

      - Rollback considerations: Specification only; no runtime impact.


      ## References


      - Feature/specification: Interaction File Log Integration Implementation

      - Related PRs/issues: None

      - Review comments addressed: None


      ## Feature Plan


      - This specification defines the integration implementation for the interaction
      file log feature.'
  returncode: 0
