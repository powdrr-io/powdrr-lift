schema: https://powdrr.io/schemas/pr-workflow-record-v1
pull_request: 589
title: Agent-created pull request
branch: workflow-chat-20260908-235228-123332
base_branch: main
workflow:
  name: specify-a-feature
  path: /Users/gregory/code/powdrr-lift/.powdrr/agent-feature-run/skills/specify-a-feature/specify-a-feature.yaml
  skills:
  - specify-a-feature
  - review-system
  - review-architecture
  - finish-pr-prep
  - create-pull-request
  steps:
  - description: Capture the feature name.
    step_type: governed
    id: capture-feature-name
    details: 'Choose a stable kebab-case feature name and reuse this exact name as
      the work-item name for every generated document. If the name is clear from the
      request, choose it directly. Otherwise ask the user with a prompt_user action,
      for example: {"action":"prompt_user","text":"What short kebab-case name should
      identify this feature in its specification files?"} This step declares the required
      output work_item_name. When the name is clear, advance only with an outputs
      object containing that exact field, for example: {"action":"next_step","outputs":{"work_item_name":"interaction-file-log"},"decisions_and_context":"Captured
      the feature name."}'
    llm_type: high_reasoning
    actions:
    - edit
    - yaml_edit
    - file_management
    - read_document
    outputs:
    - name: work_item_name
      type: string
      required_for_next_step: true
      scope: skill
      schema:
        type: string
  - description: Capture the feature goal and success criteria.
    step_type: governed
    id: capture-feature-context
    details: 'Parse the request and conversation for the named feature''s outcomes,
      edge cases, tests, constraints, and any other details needed for a properly
      detailed plan. Use your best judgment to identify what is still missing. If
      the request already provides a detail, retain it without asking again. Otherwise
      ask one focused question with a prompt_user action; repeat this step after each
      answer until the plan has enough context. For example: {"action":"prompt_user","text":"What
      should this feature record, what should happen when it fails, and how will we
      test it?"}'
    llm_type: high_reasoning
    actions:
    - edit
    - yaml_edit
    - file_management
    - read_document
  - description: Generate the system specification template.
    step_type: invoke_tool
    id: generate-system-specification
    details: Invoke the declared system-specification generator exactly once; do not
      edit the generated file. It overwrites unreadable/invalid existing content and
      merges readable values into the fresh template while restoring instructions
      and missing default fields.
    llm_type: simple_task
    actions: []
    pre_step:
      action: invoke_tool
      template:
        tool: internal
        command:
        - powdrr-lift
        - system-specification
        - --work-item-name
        - <work-item-name>
    outputs:
    - name: system_specification_template
      type: any
      required_for_next_step: true
      scope: skill
      schema:
        type: object
        additionalProperties: true
  - description: Fill the system requirements and approach.
    step_type: governed
    id: fill-system-specification
    details: Use yaml_edit to fill the generated YAML with the feature's requirements
      and approach; do not invoke tools or rewrite the YAML as prose, then choose
      next_step. For example, add a requirement describing durable interaction records
      and an approach describing the log writer.
    llm_type: standard_reasoning
    actions:
    - edit
    - yaml_edit
    - file_management
    - read_document
  - description: Review the system context before deciding the feature shape.
    step_type: uses_skill
    id: review-system-context
    details: Run the nested system review skill and use its result to decide whether
      the current system context remains appropriate.
    llm_type: simple_task
    uses_skill:
      skill: review-system
  - description: Gate the filled system specification.
    step_type: gate
    id: evaluate-system-specification
    details: The gate passes only when the system evaluator reports zero issues.
    llm_type: simple_task
    actions: []
    pre_step:
      action: invoke_tool
      template:
        tool: internal
        command:
        - powdrr-lift
        - evaluate
        - docs/proposals/<work-item-name>/system-specification.yaml
    gate:
      outcome:
        path: returncode
        equals: 0
      goto_step: repair-feature-specifications
      retry_context: System evaluation reported issues. Repair the affected YAML with
        yaml_edit, then rerun the complete specification evaluation gate.
  - description: Generate the architecture specification template.
    step_type: invoke_tool
    id: generate-architecture-specification
    details: Invoke the declared architecture-specification generator exactly once
      with all entity types; do not edit the generated file. It overwrites unreadable/invalid
      existing content and merges readable values into the fresh template while restoring
      instructions and missing default fields.
    llm_type: simple_task
    actions: []
    pre_step:
      action: invoke_tool
      template:
        tool: internal
        command:
        - powdrr-lift
        - architecture-specification
        - --work-item-name
        - <work-item-name>
        - --all-entity-types
    outputs:
    - name: architecture_specification_template
      type: any
      required_for_next_step: true
      scope: skill
      schema:
        type: object
        additionalProperties: true
  - description: Fill the architecture entities and relationships.
    step_type: governed
    id: fill-architecture-specification
    details: 'Use yaml_edit to capture the entity model before review; do not invoke
      tools or rewrite the YAML as prose, then choose next_step. Keep the model small:
      derive entities, modules, tools, relationships, invariants, and guidance only
      from the current feature requirements and approach. Do not copy example domain
      entities, relationships, or ids from another feature. Every entity and relationship
      must explain which current requirement or approach it serves.'
    llm_type: high_reasoning
    actions:
    - edit
    - yaml_edit
    - file_management
    - read_document
  - description: Review architecture before implementation.
    step_type: uses_skill
    id: review-architecture-context
    details: Run the nested architecture review skill and use its result to decide
      whether the current architecture remains appropriate.
    llm_type: high_reasoning
    uses_skill:
      skill: review-architecture
  - description: Gate the filled architecture specification.
    step_type: gate
    id: evaluate-architecture-specification
    details: The gate passes only when the architecture evaluator reports zero issues.
    llm_type: simple_task
    actions: []
    pre_step:
      action: invoke_tool
      template:
        tool: internal
        command:
        - powdrr-lift
        - evaluate
        - docs/proposals/<work-item-name>/architecture-specification.yaml
    gate:
      outcome:
        path: returncode
        equals: 0
      goto_step: repair-feature-specifications
      retry_context: Architecture evaluation reported issues. Repair the affected
        YAML with yaml_edit, then rerun the complete specification evaluation gate.
  - description: Generate the implementation specification template.
    step_type: invoke_tool
    id: generate-implementation-specification
    details: Invoke the declared implementation-specification generator exactly once;
      do not edit the generated file. It overwrites unreadable/invalid existing content
      and merges readable values into the fresh template while restoring instructions
      and missing default fields.
    llm_type: simple_task
    actions: []
    pre_step:
      action: invoke_tool
      template:
        tool: internal
        command:
        - powdrr-lift
        - implementation-specification
        - --work-item-name
        - <work-item-name>
    outputs:
    - name: implementation_specification_template
      type: any
      required_for_next_step: true
      scope: skill
      schema:
        type: object
        additionalProperties: true
  - description: Fill the implementation features and decisions.
    step_type: governed
    id: fill-implementation-specification
    details: Use yaml_edit to complete the generated implementation template; do not
      invoke tools or rewrite the YAML as prose, then choose next_step.
    llm_type: standard_reasoning
    actions:
    - edit
    - yaml_edit
    - file_management
    - read_document
  - description: Gate the filled implementation specification.
    step_type: gate
    id: evaluate-implementation-specification
    details: The gate passes only when the implementation evaluator reports zero issues.
    llm_type: simple_task
    actions: []
    pre_step:
      action: invoke_tool
      template:
        tool: internal
        command:
        - powdrr-lift
        - evaluate
        - docs/proposals/<work-item-name>/implementation-specification.yaml
    gate:
      outcome:
        path: returncode
        equals: 0
      goto_step: repair-feature-specifications
      retry_context: Implementation evaluation reported issues. Repair the affected
        YAML with yaml_edit, then rerun the complete specification evaluation gate.
  - description: Deterministically evaluate every generated specification before implementation.
    step_type: invoke_tool
    id: evaluate-feature-specifications
    details: Invoke the declared evaluator exactly once for the specification directory.
      It discovers every recognized spec-v1 YAML file. Pass the complete result to
      the repair step; do not edit files here.
    llm_type: simple_task
    actions: []
    pre_step:
      action: invoke_tool
      template:
        tool: internal
        command:
        - powdrr-lift
        - evaluate
        - docs/proposals/<work-item-name>
    outputs:
    - name: specification_evaluation
      type: any
      required_for_next_step: true
      scope: skill
      schema:
        type: object
        additionalProperties: true
  - description: Fix every reported specification issue with yaml_edit.
    step_type: governed
    id: repair-feature-specifications
    details: 'Review only the latest deterministic evaluator result and fix every
      reported issue with yaml_edit; do not reuse an older LLM explanation after the
      gate has rerun. Each action must include the YAML file_path and a non-empty
      operations array. Use set_value with a JSON path array for scalar changes and
      upsert_item with section, id, and a complete value mapping for list entries.
      If any evaluator reports invalid YAML/structure or you are stuck, restart the
      matching generator with a goto_step action. Use {"action":"goto_step","step_id":"generate-system-specification"},
      {"action":"goto_step","step_id":"generate-architecture-specification"}, {"action":"goto_step","step_id":"generate-implementation-specification"},
      for the affected file. Do not repeat the same repair indefinitely. For example:
      {"action":"yaml_edit","file_path":"docs/proposals/<work-item-name>/system-specification.yaml","operations":[{"op":"set_value","path":["id"],"value":"system-id"},{"op":"upsert_item","section":"requirements","id":"requirement-id","value":{"description":"...","state":"added"}}]}.
      Repeat the repair/evaluation loop until every required spec-v1 document evaluates
      cleanly. Do not begin implementation or create a pull request while any required
      specification remains invalid. Do not invoke tools other than gather_context
      in this repair step; gather_context is allowed when the latest evaluator result
      reports a missing or unknown id. Use the evaluator''s suggested context types
      and keywords, then apply the correction without guessing. The evaluator result
      is the authoritative issue context and the next gate reruns the deterministic
      evaluator. If an exact existing id is needed, use gather_context or read_document,
      then apply yaml_edit without guessing. For entity_type_not_allowed, use the
      exact allowed_entity_types list from the latest evaluator result and edit only
      the reported entities[N].type path. Never confuse that field with entity_relationships[*].source
      or target: those fields contain entity ids and must not be changed to entity
      type names. Never alternate between File and Source file, change a different
      entity, or modify a value that already matches the latest allowed list. After
      the edit, choose next_step so deterministic evaluation can verify the current
      file; do not claim that your own reasoning proves validation passed.'
    llm_type: fast_iteration
    actions:
    - edit
    - yaml_edit
    - file_management
    - read_document
    - gather_context
    - goto_step
  - description: Confirm that every generated specification evaluates cleanly.
    step_type: gate
    id: gate-feature-specifications
    details: The gate passes only when the directory evaluator exits successfully
      with zero issues.
    llm_type: simple_task
    actions: []
    pre_step:
      action: invoke_tool
      template:
        tool: internal
        command:
        - powdrr-lift
        - evaluate
        - docs/proposals/<work-item-name>
    gate:
      outcome:
        path: returncode
        equals: 0
      goto_step: evaluate-feature-specifications
      retry_context: The specification gate failed because one or more spec-v1 files
        still have validation issues. Inspect the latest evaluator result, repair
        the affected YAML with yaml_edit, and rerun deterministic evaluation before
        continuing.
  - description: Stage the validated specification artifacts for pull request preparation.
    step_type: governed
    id: stage-specification-artifacts
    details: Inspect the worktree and stage only the validated specification artifacts
      under docs/proposals/<work-item-name>/. Do not commit or create the pull request
      yet.
    llm_type: simple_task
    tool_invocations:
    - tool: internal
      command:
      - powdrr-lift
      - repository-state
    - tool: git
      command:
      - add
      - docs/proposals/<work-item-name>
    actions:
    - invoke_tool
    - edit
    - yaml_edit
    - read_document
  - description: Run finish-pr-prep before creating the pull request.
    step_type: uses_skill
    id: prepare-pull-request
    details: Run finish-pr-prep after the intended specification artifacts are staged
      by returning an invoke_skill action for the listed finish-pr-prep skill. Do
      not invoke it through the internal CLI tool. If cleanup changes files, restage
      only the validated specification artifacts before continuing. Do not begin implementation
      in this skill. Do not advance until the nested skill returns both final_repository_state
      and an accepted readiness_report. The readiness report must include the current
      staged-file scope and the complete results of every validation obligation; do
      not synthesize it from memory or treat a successful repository-state check as
      a substitute.
    llm_type: fast_iteration
    uses_skill:
      skill: finish-pr-prep
  - description: Create or update the pull request for the validated feature.
    step_type: uses_skill
    id: create-feature-pull-request
    details: Invoke create-pull-request with pr-kind `feature`, commit message `Add
      <work-item-name> feature specification`, and pull-request title `<pull-request-title>`.
      Pass a `files_to_publish` context list containing every validated specification
      document, along with the validated specification documents, feature intent,
      and the accepted readiness_report. The nested skill must stage exactly that
      list. Do not begin implementation in this skill, and do not invoke it if readiness_report
      is missing or not accepted.
    llm_type: simple_task
    uses_skill:
      skill: create-pull-request
