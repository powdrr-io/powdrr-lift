schema: https://powdrr.io/schemas/specification-v1
id: 2026-08-06
title: Interaction File Log Architecture Specification
entities:
  - id: log-entry
    type: log-entry
    summary: A single interaction record containing timestamp, role, and content (input or output) from human or LLM interactions.
    rationale: 'Cites "log-interactions" and "append-interactions" - every interaction input and output must be logged as a discrete entry.'
entity_relationships: []
invariants:
  - id: l-format
    description: Each log entry must be a single valid JSON object on its own line in the log file.
    rationale: 'Cites "l-format" and "l-encoding" - the log must use JSONL format with one JSON object per line.'
    related:
      entities:
        - log-entry
      entity_relationships: []
  - id: binary-content-preservation
    description: Binary content in interactions must be encoded (e.g., base64) within the JSONL entry to preserve data integrity.
    rationale: 'Cites "handle-binary-content" and "binary-content-encoding" - binary content must be safely encoded in the JSONL structure.'
    related:
      entities:
        - log-entry
      entity_relationships: []
  - id: hidden-directory-location
    description: The log file must reside in the .powdrr hidden directory.
    rationale: 'Cites "hidden-directory" - the log file must be stored in a hidden .powdrr directory.'
    related:
      entities:
        - log-entry
      entity_relationships: []
guidance:
  - id: append-only-writes
    description: Writes to the log file should be append-only to prevent data corruption and ensure every interaction is recorded.
    rationale: 'Cites "append-interactions" and "log-interactions" - every interaction must be appended to the log.'
    related:
      entities:
        - log-entry
      entity_relationships: []
  - id: directory-creation
    description: The .powdrr directory should be created if it does not already exist when writing the first log entry.
    rationale: 'Cites "hidden-directory" - the system must ensure the hidden directory exists before writing.'
    related:
      entities:
        - log-entry
      entity_relationships: []
