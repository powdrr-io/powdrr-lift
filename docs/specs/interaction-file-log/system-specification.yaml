# This file is read-only and should never be edited by a tool or agent.
schema: https://powdrr.io/schemas/specification-v1
id: interaction-file-log-system-spec
title: Interaction File Log System Specification
requirements:
  - id: log-interactions
    description: Log all human and LLM interactions (input and output) to a file.
    state: added
  - id: l-format
    description: Use JSONL (JSON Lines) format for the log file.
    state: added
  - id: hidden-directory
    description: Store the log file in a hidden .powdrr directory.
    state: added
  - id: handle-binary-content
    description: Handle both JSON and binary content in interactions.
    state: added
approach:
  - id: append-interactions
    description: Append every interaction to the log file as a new line.
    state: added
  - id: l-encoding
    description: Encode each interaction as a single JSON object per line in the log file.
    state: added
  - id: binary-content-encoding
    description: Encode binary content within JSONL entries to preserve data integrity.
    state: added
