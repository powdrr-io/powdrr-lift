[project]
name = "powdrr-agent"
version = "0.1.0"
description = "Open-source local Powdrr agent capabilities and user interaction."
requires-python = ">=3.12"
dependencies = ["powdrr-contracts"]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "powdrr_agent"

[tool.uv.sources]
powdrr-contracts = { workspace = true }
