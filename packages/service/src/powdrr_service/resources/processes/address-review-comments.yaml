version: 1
name: address-review-comments
description: Inspect an existing PR's review threads, evaluate feedback against its original feature and proposed-PR scope, implement in-scope corrections or reply with evidence, and keep deferred work out of the current PR.
inputs:
  - {name: user_request, type: string, required: true}
  - {name: workflow_context, type: object, required: true}
limits:
  llm_activations: 260
  tool_calls: 260
  context_chars: 60000
  context_value_chars: 60000
steps:
  - specialize:
      process: generate-fragment
      max_steps: 120
      question: |-
        Execute the named workflow below for the supplied user request. Preserve its
        order, gates, and outputs. Use only declared tools and returned evidence. Do
        not claim a reply, push, or resolution succeeded unless its operation returned
        success. Ask the user when the PR's intended scope cannot be established or
        reviewer feedback would change the feature's original intent.

        Embedded workflow document:
        ---
        name: address-review-comments
        when_to_use:
          - When an existing pull request has review feedback to address.
          - When a review response must be grounded in the feature and proposed-PR plan.
        steps:
          - id: inspect-pr-and-review-threads
            description: Inspect the existing PR and collect current review threads.
            actions: [invoke_tool, read_document, edit]
            step_type: governed
            llm_type: long_context
            details: >-
              Use the service-prepared workflow_context.review_feedback_ledger as
              the complete review-thread snapshot. Its status must be ready or empty;
              a missing or invalid ledger means evidence preparation failed and no
              review work may proceed. Use gh pr_view to capture number, URL, title,
              body, state, base/head branch, current head SHA, labels, files, commits,
              and reviews; use gh pr_diff for the complete current diff. Require the PR
              number and head SHA to match the ledger's pull_request.number and
              captured_head_sha. If the identity differs, stop before edits or public
              replies and ask for a fresh review-feedback run. Build one reasoning
              entry per ledger.threads item, preserving its thread ID, root comment
              ID, author, path/line anchor, and complete conversation. An empty
              ledger means there are no current unresolved threads to address; report
              that result and finish without recovering scope or attempting changes.
              Do not re-filter the service ledger or infer that evidence is empty when
              preparation failed. Do not post replies or change code until the PR
              metadata, diff, and service ledger agree on the same PR head.
            tool_invocation_packages: [gh_readonly]
          - id: recover-original-intent
            description: Recover the feature and proposed-PR contract from Structrr.
            actions: [gather_context, invoke_tool, read_document, edit, prompt_user]
            step_type: governed
            llm_type: high_reasoning
            details: >-
              Identify the exact feature ID and proposed-PR ID targeted by this PR
              from the PR body, changed specification paths, commits, and
              workflow_context. Invoke gather_context for features, requirements,
              proposed_prs, decisions, entities, entity-relationships, invariants,
              risks, and guidance, filtered by the exact feature ID. Include the
              proposed-PR ID in keywords when supported. Record the returned source
              paths, original user intent, acceptance criteria, non-goals, ordered
              proposed PRs, dependencies, and this PR's place in that order in the
              review ledger. Treat the proposed-PR specification and feature
              definition as the scope contract. If the target or its relationship
              to the feature cannot be established from returned records, stop
              before changes or public replies and ask the user for the missing
              reference. Do not infer intent from the reviewer comment alone.
          - id: classify-each-thread
            description: Decide whether each comment needs a fix, an answer, or a deferral.
            actions: [gather_context, invoke_tool, edit, read_document, prompt_user]
            step_type: governed
            llm_type: high_reasoning
            details: >-
              For every ledger entry, compare the request with the PR diff and the
              feature/proposed-PR contract. Classify it as: informational feedback
              requiring no action; current-scope code or test correction; current-scope
              documentation correction; question
              answerable from the implementation or specifications; work explicitly
              assigned to another proposed PR; new work that belongs in a separate
              PR; or conflict/ambiguity requiring the user. Collapse comments with
              one root cause while preserving every thread ID. A request that adds
              behavior, changes acceptance criteria, or contradicts the original
              intent is not made current-PR scope by editing the specification. Do
              not silently rewrite the feature or proposed-PR contract to absorb
              scope. For a scheduled follow-up, record its exact proposed-PR ID,
              title, and ordering. For unscheduled work better handled separately,
              record why it is outside this PR and the smallest separate follow-up
              needed. If reasonable interpretations would change intent or scope,
              stop that item and ask the user rather than guessing.
          - id: implement-current-scope-corrections
            description: Implement only corrections covered by this PR's contract.
            actions: [invoke_tool, edit, yaml_edit, read_document, goto_step]
            step_type: governed
            llm_type: high_reasoning
            details: >-
              For current-scope code, test, or documentation corrections, edit the
              existing PR worktree and keep every changed path traceable to ledger
              entries. Add or update tests required by the target specification.
              Do not switch branches, create another PR, implement work assigned to
              a later proposed PR, or expand acceptance criteria. Do not edit feature
              intent to justify a reviewer request. If feedback reveals that the
              existing specification itself needs an intent change, pause that
              item and ask the user. Re-read the final diff and verify each fix
              against the originating comment.
            tool_invocation_packages: [git_readonly_and_additive]
          - id: validate-current-pr-corrections
            description: Validate staged corrections before publishing them.
            step_type: uses_process
            llm_type: fast_iteration
            details: >-
              Invoke finish-pr-prep for every staged code, test, and documentation
              correction, passing the exact changed-file list and applicable
              language labels. If validation fails, repair the cause in
              implement-current-scope-corrections and rerun this step. Skip this
              step when the review is answered without changing files.
            uses_process:
              process: finish-pr-prep
          - id: publish-current-pr-corrections
            description: Push validated corrections to the existing PR branch.
            actions: [invoke_tool, edit, read_document]
            step_type: governed
            llm_type: fast_iteration
            details: >-
              If this workflow made code, test, or documentation changes, verify the
              current branch and PR identity still match the captured ledger, commit
              only the reviewed files with message `Address pull request review
              comments`, and push that existing branch. Do not use the clean-branch
              PR publisher and do not create a new pull request. Capture the resulting
              head SHA. If the PR head changed since inspection, refresh its metadata,
              diff, and review threads and reconcile the ledger before pushing.
              If there are no file changes, skip commit, validation, and push.
            tool_invocation_packages: [git_readonly_and_additive]
          - id: reply-and-resolve-threads
            description: Reply with evidence and resolve only fully addressed threads.
            actions: [invoke_tool, edit, read_document]
            step_type: governed
            llm_type: simple_task
            details: >-
              Use gh pr_review_reply with the thread ID and reply body. For a code
              correction, reply to its review thread with the concrete change and
              pushed commit SHA, then resolve that thread only after the
              push and validation succeeded. For a question fully answered by the
              current implementation or authoritative specification, reply with
              the direct answer and supporting file/spec path, then resolve the
              thread. If the request belongs to a later proposed PR, reply with its
              exact ID and title and explain that it remains outside this PR's scope.
              If the work is not yet scheduled but belongs in a separate PR, explain
              why and name the smallest follow-up; do not claim it is scheduled.
              Leave deferred, blocked, or clarification-needed threads unresolved.
              Re-read the threads after each write and verify reply text and resolved
              state. Use gh pr_review_resolve only after verification shows the
              thread is fully addressed. Never resolve a thread before its code is
              pushed or its question is fully answered. Never merge or close the PR.
            tool_invocation_packages: [gh_readonly_and_write]
          - id: report-review-outcomes
            description: Report what was fixed, answered, deferred, or blocked.
            actions: [edit, read_document, respond]
            step_type: governed
            llm_type: standard_reasoning
            details: >-
              Report the existing PR URL and captured head SHA, the feature and
              proposed-PR context used, and one outcome per actionable review
              thread: code/test/documentation change and validation, answer and
              resolution, scheduled follow-up ID/title with thread left open,
              separate-PR recommendation with thread left open, or user decision
              required. Include exact validation results. Do not claim deferred work
              is implemented or scheduled unless Structrr records it.
      context: [user_request, workflow_context]
      bind: workflow_program
      allowed_tools:
        - edit
        - file_management
        - gather_context
        - invoke_tool
        - prompt_user
        - read_document
        - respond
        - yaml_edit
  - call:
      fragment: ${workflow_program}
      max_steps: 120
  - terminal: succeeded
