version: 1
name: amend-plan-and-open-pr
inputs:
  - {name: task_context, type: object, required: true}
  - {name: implementation_result, type: object, required: true}
  - {name: failure_review, type: object, required: true}
outputs:
  pull_request_url:
    type: string
    minLength: 1
    pattern: ^https?://[^ ]+/pull/[0-9]+$
steps:
  - judge:
      kind: construct_one
      question: What minimal typed plan repair is justified by the recorded failure evidence?
      subject: failure_review
      prompt_system: Return only the declared JSON object. Do not edit or rewrite plan files.
      instructions:
        - Use only the exact plan, item, requirement, unit, validation, and evidence IDs supplied in task_context, implementation_result, and failure_review.
        - Put only IDs from failure_review.evidence_ids in discovery.evidence_ids. The runtime rejects references not present in the observed failure evidence catalog.
        - Describe one concrete discovery and the directly affected subjects. Do not widen impact to the whole plan.
        - Prefer a dependency correction when an existing dependency is missing or wrong. Use update_item only when the reviewed item text itself prevents correct execution.
        - For update_item, return a complete replacement item for the same item ID, preserving its workflow ID and workflow file. Do not invent a new ID or change requirement allocation.
        - "Each operation object must use the exact key `operation` (never `op`) and one of: add_item, update_item, retire_item, set_dependency, update_requirement, assign_setup."
        - Preserve dependencies, planned paths, implementation steps, setup instructions, and inline adjustments unless the cited evidence establishes that one is defective.
        - Return no setup, requirement, unit, or Structrr replacements unless concrete evidence and supplied IDs require them.
        - If the evidence does not support a concrete typed correction, return an empty operations list; the repair operation will reject it for human review.
        - Do not include compare-and-swap digests or repair envelope fields; Powdrr binds them to the loaded reviewed plan.
      context: [task_context, implementation_result, failure_review]
      output:
        name: repair_request
        schema:
          type: object
          required: [discovery, subjects, operations, replacement_items, replacement_units, replacement_requirements]
          additionalProperties: false
          properties:
            discovery:
              type: object
              required: [kind, summary, requirement_ids, item_ids, evidence_ids, requested_outcome]
              additionalProperties: false
              properties:
                kind: {type: string, enum: [source_change, existing_implementation, scope_defect, dependency_defect, human_setup_required, structrr_conflict, external_constraint]}
                summary: {type: string, minLength: 1}
                requirement_ids: {type: array, items: {type: string}}
                item_ids: {type: array, minItems: 1, items: {type: string}}
                evidence_ids: {type: array, items: {type: string}}
                requested_outcome: {type: string, minLength: 1}
            subjects:
              type: array
              minItems: 1
              items:
                type: object
                required: [subject_kind, reason]
                additionalProperties: false
                properties:
                  subject_kind: {type: string, enum: [requirement, item]}
                  reason: {type: string, minLength: 1}
            operations:
              type: array
              items:
                type: object
                required: [operation]
                properties:
                  operation: {type: string, enum: [add_item, update_item, retire_item, set_dependency, update_requirement, assign_setup]}
            replacement_items:
              type: object
              additionalProperties:
                type: object
                required: [title, objective, scope, acceptance_criteria]
                properties:
                  title: {type: string, minLength: 1}
                  objective: {type: string, minLength: 1}
                  scope: {type: array, minItems: 1, items: {type: string}}
                  acceptance_criteria: {type: array, minItems: 1, items: {type: string}}
                  dependencies: {type: array, items: {type: string}}
                  workflow_directory: {type: [string, "null"]}
                  implementation_steps: {type: array, items: {type: string}}
                  allowed_paths: {type: array, items: {type: string}}
                  manual_prerequisite: {type: [object, "null"]}
                  inline_adjustments: {type: array, items: {type: object}}
            replacement_units: {type: array, items: {type: object}}
            replacement_requirements: {type: object, additionalProperties: {type: object}}
      validation: {kind: json_schema}
  - operation:
      tool: invoke_tool
      parameters:
        tool: coding-agent
        parameters:
          mode: plan-amendment
          task_context: {type: reference, value: task_context}
          implementation_result: {type: reference, value: implementation_result}
          failure_review: {type: reference, value: failure_review}
          repair_request: {type: reference, value: repair_request}
      bind: amendment_result
  - gate:
      subject: amendment_result.passed
      equals: true
      on_failure: {terminal: failed}
  - call:
      process: finish-pr-prep
      inputs:
        files_to_publish: {type: reference, value: amendment_result.changed_paths}
      outputs:
        validation_results: validation_results
  - operation:
      tool: invoke_tool
      parameters:
        tool: gh
        parameters:
          operation: pr_render_request
          publication_kind: plan-amendment
          task_context: {type: reference, value: task_context}
          failure_review: {type: reference, value: failure_review}
          repair_request: {type: reference, value: repair_request}
          amendment_result: {type: reference, value: amendment_result}
          validation_results: {type: reference, value: validation_results}
      returns:
        type: object
        required: [user_request, workflow_context]
      bind: amendment_pull_request_request
  - call:
      process: create-pull-request
      inputs:
        user_request: {type: reference, value: amendment_pull_request_request.user_request}
        workflow_context: {type: reference, value: amendment_pull_request_request.workflow_context}
        files_to_publish: {type: reference, value: amendment_result.changed_paths}
      outputs:
        pull_request_url: pull_request_url
  - terminal: succeeded
