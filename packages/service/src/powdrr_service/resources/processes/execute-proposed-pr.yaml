version: 1
name: execute-proposed-pr
inputs:
  - {name: task_context, type: object, required: true}
outputs:
  coding_attempt:
    type: object
    properties:
      passed: {type: boolean}
      status: {type: string}
      changed_paths: {type: array, items: {type: string}}
      out_of_scope_paths: {type: array, items: {type: string}}
      supporting_edit_paths: {type: array, items: {type: string}}
      error: {type: [string, "null"]}
      retryable: {type: boolean}
      plan_defect_evidence: {type: array, items: {type: string}}
      structrr:
        type: object
        required: [passed]
        properties:
          passed: {type: boolean}
          proposal_fingerprint: {type: string}
          baseline_fingerprint: {type: string}
          planning_decision_review: {type: array}
          implementation_decision_review: {type: array}
          repair_findings: {type: array}
      integration_tests:
        type: object
        properties:
          passed: {type: boolean}
          generation_method: {type: string}
          paths: {type: array, items: {type: string}}
          test_sha256: {type: object}
          test_obligations: {type: array, items: {type: object}}
          coverage_references: {type: object}
          quality_review: {type: object}
          correction_quality_reviews: {type: array, items: {type: object}}
          corrections: {type: array, items: {type: object}}
          quality_notes: {type: array, items: {type: string}}
          authoring_attempts: {type: array, items: {type: object}}
          baseline: {type: object}
          correction_baseline: {type: [object, "null"]}
          candidate: {type: object}
          story_coverage: {type: object}
          story_receipts: {type: array, items: {type: object}}
          execution_context: {type: object}
          repair_findings: {type: array, items: {type: string}}
      validation: {type: object}
description: >-
  Have MiniSWE author independent integration tests before coding. For new story
  behavior require a behavioral failure or a classified approved missing public
  interface on baseline; the compiler-owned existing-behavior integration item
  may pass on baseline. Preserve the agreed oracle. Implement one
  reviewed plan item. Permit one bounded correction to generated tests when
  they conflict with their linked criterion or repository evidence; require
  each corrected test to satisfy its original baseline policy and pass
  on the candidate, then review each test with the configured decision provider
  and the LLM. Story assertion quality must explicitly pass before receipts count;
  legacy acceptance-criterion quality findings remain advisory. Bind actual
  executed assertion evidence to the candidate tree, test source, story and case
  digests, configuration and runtime. Retain failed, blocked, not-run and stale
  evidence separately. A partial PR cannot complete the whole story; the final
  integration item requires every declared case observation. Publish the coverage
  matrix and immutable receipts alongside the existing Structrr diff. Validate the
  re-bootstrapped candidate against its accepted Structrr diff and inherited
  decision reviews.
limits: {max_epochs: 1, context_chars: 12000, context_value_chars: 4000}
steps:
  - operation:
      tool: invoke_tool
      parameters:
        tool: coding-agent
        parameters: {}
      bind: coding_attempt
  - terminal: succeeded
