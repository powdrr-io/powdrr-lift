version: 1
name: plan-repair-execution
description: >-
  Apply one typed repair patch to an unpublished planning draft after the
  deterministic impact set and accepted replacement records are ready.
inputs:
  - {name: repair_id, type: string, required: true}
  - {name: base_plan_digest, type: string, required: true}
steps:
  - operation:
      tool: internal
      command: [planning_repair_apply]
      parameters:
        repair_id: {type: reference, value: repair_id}
        base_plan_digest: {type: reference, value: base_plan_digest}
      returns:
        type: object
        required: [status, repair_id, base_plan_digest]
        properties:
          status: {type: string, enum: [applied, stale, invalid]}
          repair_id: {type: string, minLength: 1}
          base_plan_digest: {type: string, minLength: 1}
          result_plan_digest: {type: [string, "null"]}
          error: {type: [string, "null"]}
      bind: repair
  - branch:
      subject: repair.status
      cases:
        applied:
          - terminal: succeeded
        stale:
          - terminal: blocked
        invalid:
          - terminal: blocked
