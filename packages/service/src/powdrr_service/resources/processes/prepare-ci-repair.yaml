version: 1
name: prepare-ci-repair
description: Research one observed CI failure and compile a narrowly scoped repair request or explicit stop disposition.
inputs:
  - {name: ci_observation_result, type: object, required: true}
  - {name: pull_request_url, type: string, required: true}
  - {name: implementation_context, type: object, required: true}
  - {name: verification_command, type: string, required: true}
outputs:
  repair_preparation:
    type: object
    additionalProperties: true
limits: {llm_activations: 1, tool_calls: 16, context_chars: 12000, context_value_chars: 5000}
steps:
  - operation:
      tool: ci_repair_research
      parameters:
        observation: {type: reference, value: ci_observation_result}
      returns: {type: object, additionalProperties: true}
      bind: research_result
  - branch:
      subject: research_result.status
      cases:
        no_failure:
          - operation:
              tool: ci_repair_compile
              parameters:
                observation: {type: reference, value: ci_observation_result}
                research_result: {type: reference, value: research_result}
                decision: {type: literal, value: {}}
                verification_command: {type: reference, value: verification_command}
              returns: {type: object, additionalProperties: true}
              bind: repair_preparation
        failure_selected:
          - judge:
              kind: construct_one
              question: Which changed files and preserved behavior address this one observed CI failure, or does the evidence require a human prerequisite or remain unresolved?
              subject: research_result.failure
              prompt_system: Return only the declared JSON object.
              instructions:
                - Use only the selected failure, its bounded official-source excerpts, the implementation context, and the changed paths from the observation.
                - Choose one to three changed non-test paths that directly address the observed failure. Do not add paths that are absent from the PR diff.
                - State the required behavior from the implementation context and the correction needed to satisfy it. Do not delete, weaken, skip, or make tests tautological.
                - Choose human_prerequisite when repository code cannot provide a missing permission, credential, organization setting, or external setup requirement.
                - For human_prerequisite, provide manual_prerequisite with title, actionable instructions that do not expose secret values, a verification step, trigger exactly after_implementation_before_validation, and the condition it unblocks. For repository_change or unresolved, set manual_prerequisite to null.
                - Choose unresolved when the evidence does not justify a scoped repository correction. Do not guess.
                - Cite the failure evidence or captured source references in the explanation.
              context: [research_result.failure, research_result.evidence, implementation_context, ci_observation_result.changed_paths]
              output:
                name: repair_target_decision
                schema:
                  type: object
                  required: [disposition, target_paths, required_behavior, explanation, manual_prerequisite]
                  additionalProperties: false
                  properties:
                    disposition: {type: string, enum: [repository_change, human_prerequisite, unresolved]}
                    target_paths: {type: array, maxItems: 3, items: {type: string, minLength: 1}}
                    required_behavior: {type: string, minLength: 1}
                    explanation: {type: string, minLength: 1}
                    manual_prerequisite:
                      oneOf:
                        - type: "null"
                        - type: object
                          required: [title, instructions, verification, trigger, unblocks]
                          additionalProperties: false
                          properties:
                            title: {type: string, minLength: 1, maxLength: 160}
                            instructions: {type: array, minItems: 1, items: {type: string, minLength: 1}}
                            verification: {type: string, minLength: 1}
                            trigger: {type: string, const: after_implementation_before_validation}
                            unblocks: {type: string, minLength: 1}
              validation: {kind: json_schema}
          - operation:
              tool: ci_repair_compile
              parameters:
                observation: {type: reference, value: ci_observation_result}
                research_result: {type: reference, value: research_result}
                decision: {type: reference, value: repair_target_decision}
                verification_command: {type: reference, value: verification_command}
              returns: {type: object, additionalProperties: true}
              bind: repair_preparation
      default:
        - operation:
            tool: ci_repair_compile
            parameters:
              observation: {type: reference, value: ci_observation_result}
              research_result: {type: reference, value: research_result}
              decision: {type: literal, value: {}}
              verification_command: {type: reference, value: verification_command}
            returns: {type: object, additionalProperties: true}
            bind: repair_preparation
  - branch:
      subject: repair_preparation.status
      cases:
        human_prerequisite:
          - operation:
              tool: task_handoff
              parameters:
                question: {type: reference, value: repair_preparation.explanation}
                continuation_instructions:
                  type: literal
                  value: >-
                    After completing the external setup, run
                    `powdrr-lift github-issue-worker-continue` for this issue.
                    Powdrr will verify the staged PR checks and resume this
                    workflow from the same checkpoint.
                manual_prerequisite:
                  {type: reference, value: repair_preparation.manual_prerequisite}
              returns: {type: object, additionalProperties: true}
              bind: ci_human_handoff
          - terminal: succeeded
        repository_change:
          - operation:
              tool: ci_repair_retry_start
              parameters:
                repair_request: {type: reference, value: repair_preparation.repair_request}
              returns: {type: object, additionalProperties: true}
              bind: repair_loop
          - repeat:
              max_iterations: 2
              until: {subject: repair_loop.done, equals: true}
              body:
                - call:
                    process: execute-ci-repair
                    inputs:
                      repair_request: {type: reference, value: repair_loop.repair_request}
                    outputs:
                      repair_attempt: repair_attempt
                - operation:
                    tool: ci_repair_validate
                    parameters:
                      repair_request: {type: reference, value: repair_loop.repair_request}
                      attempt: {type: reference, value: repair_attempt}
                    returns: {type: object, additionalProperties: true}
                    bind: repair_validation
                - operation:
                    tool: ci_repair_retry
                    parameters:
                      repair_request: {type: reference, value: repair_loop.repair_request}
                      attempt: {type: reference, value: repair_attempt}
                      validation: {type: reference, value: repair_validation}
                      max_attempts: {type: literal, value: 2}
                    returns: {type: object, additionalProperties: true}
                    bind: repair_loop
          - branch:
              subject: repair_validation.passed
              cases:
                true:
                  - operation:
                      tool: invoke_tool
                      parameters:
                        tool: gh
                        parameters:
                          operation: pr_publish_clean
                          files_to_publish: {type: reference, value: repair_attempt.changed_paths}
                          base: {type: reference, value: ci_observation_result.pull_request_metadata.base_ref}
                          publication_branch: {type: reference, value: ci_observation_result.pull_request_metadata.head_ref}
                          title: {type: reference, value: ci_observation_result.pull_request_metadata.title}
                          body: {type: reference, value: ci_observation_result.pull_request_metadata.body}
                          commit_message: {type: literal, value: Repair CI failure}
                      returns: {type: string, minLength: 1, pattern: '^https?://[^ ]+/pull/[0-9]+$'}
                      bind: repaired_pull_request_url
                  - operation:
                      tool: ci_observe
                      parameters:
                        repository: {type: reference, value: ci_observation_result.repository}
                        issue_number: {type: reference, value: ci_observation_result.issue}
                        pull_request_url: {type: reference, value: pull_request_url}
                        verification_command: {type: reference, value: verification_command}
                      returns: {type: object, additionalProperties: true}
                      bind: follow_up_observation
                  - operation:
                      tool: ci_repair_finalize
                      parameters:
                        preparation: {type: reference, value: repair_preparation}
                        attempt: {type: reference, value: repair_attempt}
                        validation: {type: reference, value: repair_validation}
                        publication_url: {type: reference, value: repaired_pull_request_url}
                        follow_up_observation: {type: reference, value: follow_up_observation}
                      returns: {type: object, additionalProperties: true}
                      bind: repair_preparation
              default:
                - operation:
                    tool: ci_repair_finalize
                    parameters:
                      preparation: {type: reference, value: repair_preparation}
                      attempt: {type: reference, value: repair_attempt}
                      validation: {type: reference, value: repair_validation}
                    returns: {type: object, additionalProperties: true}
                    bind: repair_preparation
      default:
        - terminal: succeeded
  - terminal: succeeded
