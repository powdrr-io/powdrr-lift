[project]
name = "powdrr-lift"
version = "0.1.0"
description = "Parse structured change logs."
readme = "README.md"
authors = [
    { name = "Greg Fee", email = "fee.gregory@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.2",
    "huggingface-hub>=0.26.0",
    "mcp>=1.0.0",
    "basedpyright>=1.33.0",
    # Textual 8.2 adds Kitty keyboard protocol negotiation and CSI-u parsing,
    # which is required for Cmd/ Super key events in supported terminals.
    "textual>=8.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-PyYAML>=6.0.12",
]
local = [
    "llama-cpp-python>=0.3.16",
]

[project.scripts]
powdrr-lift = "powdrr_lift.cli:main"
powdrr-lift-mcp = "powdrr_lift.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_coding_loop: opt-in live-LLM coding-loop integration test",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
