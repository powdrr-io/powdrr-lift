---
name: address-review-comments
when_to_use:
- When an existing pull request has review comments that must be addressed.
- When review feedback may require both implementation changes and updates to the
  feature's v1 specifications.
- When the addressed changes must be validated and pushed back to the existing
  pull request.
steps:
- description: Inspect the pull request and collect its review comments.
  llm_type: long_context
  details: >-
    Resolve the current pull request from the worktree branch and inspect its
    title, body, feature and proposed-PR references, changed files, commits,
    review history, unresolved review threads, and inline comments. Use the
    thread-aware review API so resolved, outdated, and current comments can be
    distinguished. Build a comment ledger with one entry per actionable comment,
    including its file and line anchor, requested outcome, and relationship to
    the feature definition and proposed-PR specification. Do not duplicate a
    root cause or act on informational, resolved, or outdated feedback.
  tool_invocations:
  - tool: shell
    command:
    - gh
    - pr
    - view
    - <pr-reference>
    - --json
    - number,title,body,baseRefName,headRefName,headRefOid,state,isDraft,labels,files,commits,reviews
  - tool: shell
    command:
    - gh
    - pr
    - diff
    - <pr-reference>
    - --patch
  - tool: shell
    command:
    - gh
    - api
    - graphql
    - -f
    - query=<review-thread-query>
- description: Classify each comment against the feature contract.
  llm_type: high_reasoning
  details: >-
    For every actionable comment, read the relevant feature definition and
    proposed-PR specification before deciding what to change. Record whether
    the comment is an implementation correction, a test or validation correction,
    documentation-only feedback, or a change to feature design, entities,
    relationships, decisions, intent, acceptance criteria, scope, risks, or
    proposed-PR sequencing. Treat structured v1 specification data as the
    contract and preserve existing ids and relationships unless the feedback
    explicitly changes them. If a comment conflicts with the feature contract
    or another comment, identify the conflict and resolve it from the most
    authoritative specification rather than silently guessing.
- description: Update the v1 specification for design-level feedback.
  llm_type: standard_reasoning
  details: >-
    For each comment classified as a design-level change, generate or reuse the
    appropriate v1 specification template in docs/proposals/<work-item-name>/ using
    the repository's powdrr-lift template command, then fill the template with
    the approved change while preserving the existing specification content.
    Use system-specification for system entities and intent, architecture-
    specification for entities and relationships, implementation-specification
    for implementation decisions, and pr-specification for proposed-PR intent,
    acceptance criteria, tests, outcomes, non-goals, or risks. Validate every
    changed specification with its matching evaluate-* command before treating
    the comment as addressed. Do not create a specification for an
    implementation-only or test-only correction.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - <specification-template-command>
    - --work-item-name
    - <work-item-name>
  - tool: internal
    command:
    - powdrr-lift
    - <evaluate-specification-command>
    - --work-item-name
    - <work-item-name>
- description: Implement and test every actionable review correction.
  llm_type: high_reasoning
  details: >-
    Apply the requested code, test, documentation, and specification changes in
    the current worktree. Keep each edit traceable to its comment ledger entry,
    update or add tests required by the revised feature contract, and avoid
    unrelated cleanup. Re-read the changed files and diff against the PR so that
    every actionable comment is either addressed or explicitly recorded as
    blocked with its reason. Stage only the intended files after the changes are
    complete; do not create a new pull request for this workflow.
  tool_invocations:
  - tool: shell
    command:
    - git
    - diff
    - --check
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
- description: Run finish-pr-prep on the final staged changes.
  llm_type: fast_iteration
  details: >-
    Invoke finish-pr-prep after all implementation, test, documentation, and
    v1 specification files are staged. If validation or cleanup changes files,
    inspect the edits, restage only the intended files, and rerun finish-pr-prep
    until the final staged state is clean. Do not push while any required check
    is failing.
  uses_skills:
  - finish-pr-prep
- description: Commit and push the addressed changes to the existing pull request.
  llm_type: simple_task
  details: >-
    Confirm the final staged diff contains every addressed review change and no
    unrelated files, commit it with a message describing the review update, and
    push the current feature branch to its existing upstream. Verify that the
    push succeeds and that the pull request head now points to the new commit.
    Update the existing PR body by first invoking `powdrr-lift
    pull-request-description --kind review-comments`. Fill every section
    returned by that command and pass the completed text as the `--body` value,
    preserving the core sections and completing the Review Feedback Addressed
    section with one row per actionable comment containing its location, requested
    outcome, resolution, and validation. Include residual risks and reviewer
    focus. If a section does not apply, write Not applicable and why; never
    leave placeholders or claim an unrun check passed. Resolve each review
    thread only after its requested change is present and pushed, and report any
    comment that remains open or blocked. Never merge the pull request or push
    directly to main.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - pull-request-description
    - --kind
    - review-comments
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
  - tool: shell
    command:
    - git
    - commit
    - -m
    - "Address pull request review comments"
  - tool: shell
    command:
    - git
    - push
