---
name: adversarial-pr-review
when_to_use:
- When the user asks for an adversarial engineering review of a pull request.
- When a pull request should be challenged for unnecessary frameworks, reduced
  readability, or branching that is becoming difficult to reason about.
- When review findings must be reported directly on GitHub as inline pull-request
  comments.
steps:
- description: Discover the pull request and establish the exact change surface.
  llm_type: long_context
  details: >-
    This is an adversarial review. Select the adversarial LLM provider before
    reasoning and preserve `provider_role: adversarial` on every subsequent
    workflow action unless the workflow explicitly cannot do so. Inspect the
    referenced pull request's title, body, labels, commits, complete diff,
    changed files, base and head branches, head SHA, review history, and current
    state. Read the complete diff and the surrounding implementations, callers,
    tests, configuration, and documentation. Establish the PR's intended
    behavior and constraints before challenging its design; adversarial means
    rigorous and evidence-driven, not reflexively negative.
  tool_invocations:
  - tool: shell
    command:
    - gh
    - pr
    - view
    - <pr-reference>
    - --json
    - number,title,body,baseRefName,headRefName,headRefOid,state,isDraft,labels,files,commits,reviews
  - tool: shell
    command:
    - gh
    - pr
    - diff
    - <pr-reference>
    - --patch
  - tool: shell
    command:
    - git
    - diff
    - --name-status
    - <base-sha>
    - <head-sha>
- description: Challenge framework and dependency choices.
  llm_type: high_reasoning
  details: >-
    Act as a senior engineer educating a junior engineer on production-level
    design. For every new framework, library, abstraction layer, service, or
    custom mechanism, search the repository and its existing dependencies for
    an established solution that can meet the requirement. Challenge the new
    choice when an existing framework or local pattern can do the job without
    losing a clearly documented capability. Compare operational cost, security,
    failure modes, maintenance burden, team familiarity, migration risk, and
    testability. Do not demand reuse merely because two tools are superficially
    similar: retain a new dependency when the PR demonstrates a material
    capability gap or a justified boundary. Cite concrete repository evidence,
    and do not report preference as a defect.
  tool_invocations:
  - tool: shell
    command:
    - rg
    - -n
    - -i
    - "framework|library|dependency|adapter|client|router|parser|middleware|plugin"
    - <changed-files-or-repository>
  - tool: shell
    command:
    - git
    - diff
    - <base-sha>
    - <head-sha>
    - --
    - <changed-files>
- description: Challenge readability and control-flow complexity.
  llm_type: high_reasoning
  details: >-
    Review all added and materially changed code for readability regressions:
    misleading names, dense expressions, hidden side effects, excessive
    indirection, duplicated condition checks, clever abstractions, long methods,
    and APIs whose usage is harder to understand than the behavior they replace.
    Specifically trace every new if/elif/else, nested conditional, flag, early
    return, exception branch, callback, and state transition. Challenge code
    that creates spaghetti control flow or makes the happy path and failure
    paths difficult to follow. Prefer a small number of explicit, cohesive
    functions, guard clauses where they clarify the contract, and named
    predicates or data-driven dispatch where they remove branching. Require
    evidence from the changed code and its callers; do not flag subjective style
    preferences, necessary domain branching, or complexity that the PR clearly
    isolates and tests.
  tool_invocations:
  - tool: shell
    command:
    - rg
    - -n
    - "if |elif |else:|match |case |try:|except |finally:|and |or "
    - <changed-files>
  - tool: shell
    command:
    - git
    - diff
    - <base-sha>
    - <head-sha>
    - --check
- description: Validate findings and teach the production-level alternative.
  llm_type: high_reasoning
  details: >-
    Validate each candidate against the complete diff, surrounding call sites,
    existing framework capabilities, tests, configuration, and relevant history.
    Keep a finding only when the current PR causes a concrete maintainability,
    reliability, or delivery risk and a simpler production-level alternative is
    available. For each finding record the changed file and smallest changed
    line, the exact evidence, why the current choice is harmful, the existing
    framework or design pattern that could work, and a focused remediation.
    Write as a senior engineer coaching a junior: explain the principle and the
    consequence so the author can learn, while remaining specific and respectful.
    Consolidate comments with one root cause. Reject speculative redesign,
    generic clean-code slogans, “I would write it differently” opinions, and
    findings that are merely pre-existing or not introduced or worsened by the PR.
  tool_invocations:
  - tool: shell
    command:
    - git
    - diff
    - <base-sha>
    - <head-sha>
  - tool: shell
    command:
    - rg
    - --files-with-matches
    - <existing-framework-or-pattern>
    - <repository-paths>
- description: Post actionable findings as inline pull-request comments.
  llm_type: simple_task
  details: >-
    Check existing review threads and inline comments before posting. Post each
    retained finding to the current PR as an inline comment anchored to the
    smallest relevant changed line on the RIGHT side of the current head SHA.
    Start each body with one of `Framework choice:`, `Readability:`, or
    `Control flow:`. State the concrete evidence, production impact, the
    existing framework or simpler pattern to consider when applicable, and a
    specific fix direction. Use a nearby changed line only when the problematic
    code is not itself changed, and explain the actual location. Do not repeat
    unresolved or resolved findings, post broad summaries or praise, approve,
    merge, close, label, or modify the target PR. Keep the teaching tone
    direct, respectful, and useful to a junior engineer learning production
    practices.
  tool_invocations:
  - tool: shell
    command:
    - gh
    - api
    - repos/<owner>/<repo>/pulls/<number>/comments
    - --paginate
  - tool: shell
    command:
    - gh
    - api
    - repos/<owner>/<repo>/pulls/<number>/comments
    - --method
    - POST
    - -f
    - body=<finding>
    - -f
    - commit_id=<current-head-sha>
    - -f
    - path=<changed-file>
    - -F
    - line=<changed-line>
    - -f
    - side=RIGHT
- description: Verify the adversarial review and report the result.
  llm_type: standard_reasoning
  details: >-
    Re-read the target PR's comments and verify every intended finding is
    attached to the current head SHA, a changed file, and the intended line.
    Report the PR, revisions, files and decisions examined, frameworks
    challenged, readability and control-flow candidates, rejected speculative
    candidates, findings posted, and any residual design risk. If no actionable
    findings remain, report zero findings and summarize the evidence checked.
    If GitHub write access or inline anchoring fails, report the exact prepared
    finding and posting failure; never claim it was posted. Preserve the
    adversarial provider role through this final review action. Never merge the
    PR or resolve review threads as part of this skill.
  tool_invocations:
  - tool: shell
    command:
    - gh
    - api
    - repos/<owner>/<repo>/pulls/<number>/comments
    - --paginate
