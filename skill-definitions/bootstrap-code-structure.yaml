---
name: bootstrap-code-structure
when_to_use:
- When implementation is about to begin and the project's code structure needs current codebase evidence.
- When the workflow needs reliable application modules, test modules, tools, and validation commands for the whole repository.
- When no project-structure artifact exists and a durable template should be created under docs/project_structure.
steps:
- description: Discover the project-wide modules, tools, tests, and development commands.
  llm_type: long_context
  details: >-
    Treat the repository as the scope. Do not ask the user to identify a
    feature, work item, or target module. Inspect the complete source and test
    layout, existing project-structure documents, configuration, build files,
    CI workflows, scripts, and documentation. Identify application modules,
    test modules, their relationships and locations, and the commands used for
    tests, formatting, linting, type checking, packaging, and other repository
    validation. Use basedpyright-symbol and basedpyright-structure for Python
    source when available. Record paths, symbols, commands, and evidence in
    decisions_and_context before continuing. Use the gather-context workflow
    action to look for an existing project-structure artifact:
    {"kind":"gather-context","types":["modules","tools"],"keywords":[]}
    Inspect returned match paths for docs/project_structure and carry the
    result into the next step.
  tool_invocations:
  - tool: shell
    command:
    - rg
    - --files
    - src
    - tests
    - scripts
    - .github
    - docs/project_structure
  - tool: shell
    command:
    - rg
    - -n
    - "pytest|ruff|mypy|pyright|basedpyright|uv run|make |npm test|cargo test|go test"
    - pyproject.toml
    - Makefile
    - .github
    - scripts
    - README.md
- description: Reuse an existing project-structure artifact or create its template.
  llm_type: simple_task
  details: >-
    If docs/project_structure contains an existing project-structure document,
    inspect and reuse it without overwriting it. If it does not exist, create
    the directory and the template at
    docs/project_structure/project-structure.yaml. The template must contain
    a clear schema marker, project-wide modules, tools, relationships, and
    evidence sections, with empty lists where discovery will fill details. Do
    not create a feature-specific architecture specification and do not ask a
    question merely because the project-structure document is absent. Pass the
    exact artifact path to the next step. Use the prior gather-context result
    to decide whether the artifact exists.
  tool_invocations:
  - tool: shell
    command:
    - test
    - -f
    - docs/project_structure/project-structure.yaml
  - tool: shell
    command:
    - mkdir
    - -p
    - docs/project_structure
- description: Populate the project-structure artifact from codebase evidence.
  llm_type: high_reasoning
  details: >-
    Compare the discovered repository structure with the existing artifact or
    template. Add or update project-wide module entries for application,
    test, tooling, configuration, and integration areas, including stable ids,
    paths, parent/related modules, purpose, and evidence. Add or update tool
    entries for test, formatting, linting, type-check, build, and relevant
    development commands, including stable ids, related modules, labels,
    when_to_use, template, how_to_use, and evidence. Preserve accurate
    existing ids and descriptions. Do not invent modules or tools unsupported
    by repository evidence. Use the edit action to write the artifact and pass
    the changed path and edit summary onward.
- description: Validate the project-structure artifact and discovery evidence.
  llm_type: fast_iteration
  details: >-
    Confirm that the project-structure artifact is valid YAML, contains the
    discovered project-wide module and tool records, uses paths that exist or
    are explicitly documented as generated, and has no conflict markers. Check
    that every listed tool has a command and every module has a purpose and
    location. Fix any omissions or inconsistencies and repeat validation until
    the artifact is internally consistent. Do not run a feature-specific
    architecture validator or require a feature/work-item name.
  tool_invocations:
  - tool: shell
    command:
    - rg
    - -n
    - "^(<<<<<<<|=======|>>>>>>>)"
    - docs/project_structure/project-structure.yaml
  - tool: shell
    command:
    - git
    - diff
    - --check
  - tool: shell
    command:
    - git
    - status
    - --short
- description: Stage the validated project-structure artifact.
  llm_type: simple_task
  details: >-
    Confirm that the validated project-structure artifact is the only intended
    bootstrap output, inspect its diff, and stage the exact path under
    docs/project_structure. Do not stage unrelated files, feature-specific
    specifications, or generated caches. Do not commit here.
  tool_invocations:
  - tool: shell
    command:
    - git
    - status
    - --short
  - tool: shell
    command:
    - git
    - add
    - docs/project_structure/project-structure.yaml
