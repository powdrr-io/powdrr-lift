---
name: bootstrap-code-structure
when_to_use:
- When implementation is about to begin and the project's code structure needs current codebase evidence.
- When the workflow needs reliable application modules, test modules, tools, and validation commands for the whole repository.
- When no project-structure artifact exists and a durable template should be created under docs/project_structure.
steps:
- description: Discover the project-wide modules, tools, tests, and development commands.
  llm_type: long_context
  details: >-
    Treat the repository as the scope. Do not ask the user to identify a
    feature, work item, or target module. Inspect the complete source and test
    layout, existing project-structure documents, configuration, build files,
    CI workflows, scripts, and documentation. Identify application modules,
    test modules, their relationships and locations, and the commands used for
    tests, formatting, linting, type checking, packaging, and other repository
    validation. Use basedpyright-symbol and basedpyright-structure for Python
    source when available. Record paths, symbols, commands, and evidence in
    decisions_and_context before continuing. Use the gather_context workflow
    action to look for an existing project-structure artifact:
    {"kind":"gather_context","types":["modules","tools"],"keywords":[]}
    Inspect returned match paths for docs/project_structure and carry the
    result into the next step. After discovering each tool, try its command
    with the smallest safe invocation that exercises its syntax and working
    directory. For commands that require project inputs, use a read-only,
    help, dry-run, or otherwise non-destructive invocation. If a discovered
    tool fails because of command syntax, flags, paths, working directory, or
    invocation shape, inspect the error, correct the command, and retry it
    before recording the tool. Do not pass an untested or failing command to
    the next step; record the successful command, required inputs, and
    validation evidence in decisions_and_context.
  tool_invocations:
  - tool: shell
    command:
    - rg
    - --files
    - src
    - tests
    - scripts
    - .github
    - docs/project_structure
  - tool: shell
    command:
    - rg
    - -n
    - "pytest|ruff|mypy|pyright|basedpyright|uv run|make |npm test|cargo test|go test"
    - pyproject.toml
    - Makefile
    - .github
    - scripts
    - README.md
- description: Reuse an existing project-structure artifact or create its template.
  llm_type: simple_task
  details: >-
    If docs/project_structure contains an existing project-structure document,
    inspect and reuse it without overwriting it. If it does not exist, invoke
    the shell tool with command [powdrr-lift, project-structure]. The CLI
    creates both the parent directory and the template. The template must
    use the repository's `https://powdrr.io/schemas/specification-v1` schema.
    Generate the template with the CLI and follow its instructions. Use only
    the specification sections needed by the project structure; all sections
    are optional.
    Do not create a feature-specific architecture specification and do not ask
    a question merely because the project-structure document is absent. Pass
    the exact artifact path to the next step. Use the prior gather_context
    result to decide whether the artifact exists.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - project-structure
- description: Populate the project-structure artifact from codebase evidence.
  llm_type: high_reasoning
  details: >-
    Compare the discovered repository structure with the existing artifact or
    template. Add or update project-wide module entries for application,
    test, tooling, configuration, and integration areas, including stable ids,
    paths, parent/related modules, and purpose. Add or update tool
    entries for test, formatting, linting, type-check, build, and relevant
    development commands, including stable ids, related modules, labels,
    when_to_use, template, how_to_use, and evidence. Every tool entry MUST
    include a non-empty `labels` list with at least one meaningful, stable
    category label. Never leave `labels` out and never use `labels: []`.
    Choose labels that describe the tool's role, such as `test`, `format`,
    `lint`, `type-check`, `build`, or `development`; add all labels supported
    by repository evidence. Include the `pr-prep` label on every testing,
    linting, and formatting tool so finish-pr-prep can discover it. Omit only
    `pr-prep` when repository evidence shows that the tool is intended for ad
    hoc or one-off use, and record that rationale in the tool entry's
    evidence. Preserve accurate existing ids and descriptions. Do not invent
    modules or tools unsupported by repository evidence. Verify every tool
    command against the successful invocation evidence from the discovery
    step, including its working directory and required arguments. If a
    command cannot be run safely, document the exact reason and the safest
    verified syntax instead of guessing. Use the edit action to write the
    artifact and pass the changed path and edit summary onward.
- description: Validate the project-structure artifact and discovery evidence.
  llm_type: fast_iteration
  details: >-
    Run [powdrr-lift, validate-project-structure, --input,
    docs/project_structure/project-structure.yaml] and require a successful
    specification-v1 schema report. Confirm that the artifact contains the
    discovered project-wide module and tool records, uses paths that exist or
    are explicitly documented as generated, and has no conflict markers. Check
    that every listed tool has a command, a non-empty `labels` list, and every
    module has a purpose and location. Confirm that testing, linting, and
    formatting tools have the `pr-prep` label unless their evidence explicitly
    supports ad hoc or one-off use. Fix any validator failures or
    inconsistencies and repeat validation until the schema validator succeeds.
    Do not run a
    feature-specific architecture validator or require a feature/work-item
    name.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - validate-project-structure
    - --input
    - docs/project_structure/project-structure.yaml
  - tool: shell
    command:
    - rg
    - -n
    - "^(<<<<<<<|=======|>>>>>>>)"
    - docs/project_structure/project-structure.yaml
  - tool: shell
    command:
    - git
    - diff
    - --check
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
- description: Stage the validated project-structure artifact.
  llm_type: simple_task
  details: >-
    Confirm that the validated project-structure artifact is the only intended
    bootstrap output, inspect its diff, and stage the exact path under
    docs/project_structure. Do not stage unrelated files, feature-specific
    specifications, or generated caches. Do not commit here.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
  - tool: shell
    command:
    - git
    - add
    - docs/project_structure/project-structure.yaml
- description: Run finish-pr-prep on the validated project-structure artifact.
  llm_type: fast_iteration
  details: >-
    Run finish-pr-prep after the validated project-structure artifact is
    staged. If cleanup changes files, restage only
    docs/project_structure/project-structure.yaml before continuing. Do not
    include unrelated files or begin feature implementation.
  uses_skills:
  - finish-pr-prep
- description: Commit the project-structure artifact and open a draft pull request.
  llm_type: simple_task
  details: >-
    Review the staged project-structure artifact, commit it, and push the
    current feature branch with its upstream set. Then create or update a
    draft pull request by first invoking `powdrr-lift pull-request-description
    --kind project-structure`. Fill every section returned by that command and
    pass the completed text as the `--body` value. Populate
    every core section with the project-structure problem, before/after
    behavior, discovered scope, implementation details, compatibility impact,
    exact discovery and validation commands and results, risks, reviewer focus,
    follow-up, and references. Add a Project Structure Evidence section naming
    the generated artifact and the evidence used to derive it. If a section does
    not apply, write Not applicable and why; never leave placeholders or claim
    an unrun check passed. If a pull request already exists for the branch,
    update it instead of creating a second one. Do not report completion until
    the GitHub command succeeds and its output includes the pull request URL.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - pull-request-description
    - --kind
    - project-structure
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
  - tool: shell
    command:
    - git
    - commit
    - -m
    - Add project structure artifact
  - tool: shell
    command:
    - git
    - push
    - -u
    - origin
    - HEAD
  - tool: shell
    command:
    - gh
    - pr
    - create
    - --draft
    - --title
    - <pull-request-title>
    - --body
    - <populated-pr-description>
