name: create-pull-request
when_to_use:
- When validated staged changes must be committed, pushed, and published as a draft pull request.
- When an existing pull request for the current branch must receive the prescribed description and updated commit.
steps:
- description: Generate the pull request description template.
  actions:
    - name: next_step
      instructions: Advance after the deterministic step result is available.
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Invoke `powdrr-lift pull-request-description --kind feature` exactly once.
    Keep the returned template in workflow context for the next step. Do not
    print the template, its sections, or a draft body to the chat or status
    window. Preserve the current branch and existing pull request context.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - pull-request-description
      - --kind
      - feature
- description: Fill in the pull request description template.
  actions:
    - name: edit
      instructions: Apply a known line-based change to a file.
    - name: yaml_edit
      instructions: Apply a structural change to a YAML file.
    - name: file_management
      instructions: Move, rename, or delete one relative file.
    - name: read_document
      instructions: Read a bounded range from a known document.
    - name: prompt_user
      instructions: Ask one necessary human question.
    - name: next_step
      instructions: Advance after this step is complete.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Fill every section of the returned template using the validated work item,
    changed files, decisions, review or CI evidence, and exact checks that were
    actually run. Preserve useful existing pull request content when updating
    an existing PR; do not discard sections that are not part of the generated
    template. Include the problem and before/after behavior, scope and
    non-goals, implementation details, compatibility impact, validation
    commands and results, risks and mitigations, reviewer focus, follow-up, and
    references. Include any kind-specific evidence requested by the template.
    If a section does not apply, write Not applicable and why. Never leave a
    placeholder or claim an unrun check passed. Keep the completed body in
    workflow context and do not print it to the chat or status window.
- description: Stage the exact files that belong in the pull request.
  actions:
    - name: invoke_tool
      instructions: Run the declared command or validation obligation for this step.
    - name: edit
      instructions: Apply the required correction to a file.
    - name: yaml_edit
      instructions: Apply the required structural YAML correction.
    - name: read_document
      instructions: Read the exact file range needed for this step.
    - name: prompt_user
      instructions: Ask one necessary human question.
    - name: next_step
      instructions: Advance after this step is complete.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Read the `files_to_publish` list from workflow context. It is authoritative
    for this pull request. Verify every listed path exists or is an intended
    new file, then invoke the intrinsic git tool with exactly those paths. The
    exact action shape is
    {"action":"invoke_tool","tool":"git","parameters":{"operation":"add","paths":["path/to/file"]}}.
    Do not use `git add .`, `git add --all`, or stage logs, caches, or unrelated
    files. If `git status --short` shows an untracked or modified path that is
    not in `files_to_publish`, delete that path before staging. Delete it with
    the intrinsic file-management action exactly as
    {"action":"file_management","operation":"delete","file_path":"path/to/unintended-file"}.
    Do not stage or preserve unintended diagnostic logs, generated artifacts,
    or other files in the pull request. Verify the staged names with `git
    diff --cached --name-only`; do not advance until every intended path is
    staged and no unintended path is staged.
  tool_invocations:
  - tool: git
    command:
    - add
    - <files-to-publish>
- description: Commit the validated changes.
  actions:
    - name: invoke_tool
      instructions: Run the declared command or validation obligation for this step.
    - name: edit
      instructions: Apply the required correction to a file.
    - name: yaml_edit
      instructions: Apply the required structural YAML correction.
    - name: read_document
      instructions: Read the exact file range needed for this step.
    - name: prompt_user
      instructions: Ask one necessary human question.
    - name: next_step
      instructions: Advance after this step is complete.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Confirm with `git diff --cached --name-only` that the exact
    `files_to_publish` list is staged. If any intended file is missing or any
    unrelated file is staged, correct the staging before continuing. Commit
    with `<commit-message>`, then verify the result. If the commit reports
    "nothing to commit" and `git status --short` is empty, treat that as a
    successful no-change outcome: an earlier action already committed the
    exact state, so continue without creating an empty commit. If status shows
    unstaged or untracked paths, stop and correct each one: stage an intended
    path with the intrinsic git add action. For every unstaged or untracked path
    that is not in `files_to_publish`, delete it with the intrinsic
    file-management action before retrying. Use exactly
    {"action":"file_management","operation":"delete","file_path":"path/to/unintended-file"}
    for each unintended path; never add an unintended file to the commit.
    Rerun status, then retry the commit only after the worktree is clean or
    the intended changes are staged. Do not push or invoke any GitHub command
    in this step.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
  - tool: shell
    command:
    - git
    - commit
    - -m
    - <commit-message>
- description: Push the committed changes.
  actions:
    - name: invoke_tool
      instructions: Run the declared command or validation obligation for this step.
    - name: edit
      instructions: Apply the required correction to a file.
    - name: yaml_edit
      instructions: Apply the required structural YAML correction.
    - name: read_document
      instructions: Read the exact file range needed for this step.
    - name: prompt_user
      instructions: Ask one necessary human question.
    - name: next_step
      instructions: Advance after this step is complete.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Push the current feature branch with its upstream set. Verify that the
    remote branch contains the committed `HEAD` before continuing. Do not
    create or update a pull request in this step; leave the completed body in
    workflow context for the next step.
  tool_invocations:
  - tool: shell
    command:
    - git
    - push
    - -u
    - origin
    - HEAD
- description: Create a draft pull request when none exists.
  actions:
    - name: invoke_tool
      instructions: Run the declared command or validation obligation for this step.
    - name: edit
      instructions: Apply the required correction to a file.
    - name: yaml_edit
      instructions: Apply the required structural YAML correction.
    - name: read_document
      instructions: Read the exact file range needed for this step.
    - name: prompt_user
      instructions: Ask one necessary human question.
    - name: next_step
      instructions: Advance after this step is complete.
  step_type: freeform
  llm_type: simple_task
  details: >-
    First verify that the current branch has at least one committed change
    relative to the exact base branch. If `git rev-list --count
    <base-branch>..HEAD` is zero, do not invoke `gh pr create`: inspect
    `git status`, stage the intended files, commit them, push the branch, and
    retry this step. Uncommitted files alone are not sufficient for a pull
    request. Confirm that the pushed `HEAD` contains every `files_to_publish`
    path. Use this step only when no pull request exists for the current
    branch.
    Invoke `gh pr create --draft --title <pull-request-title> --body
    <populated-pr-description>` using the completed body from the previous
    steps. Do not print the body, edit an existing PR, or run any other tool.
    Do not report completion until the command succeeds and its output includes
    the pull request URL. Never merge the PR or push directly to main.
  tool_invocations:
  - tool: gh
    command:
    - pr
    - create
    - --draft
    - --title
    - <pull-request-title>
    - --body
    - <populated-pr-description>
- description: Update the existing pull request.
  actions:
    - name: invoke_tool
      instructions: Run the declared command or validation obligation for this step.
    - name: edit
      instructions: Apply the required correction to a file.
    - name: yaml_edit
      instructions: Apply the required structural YAML correction.
    - name: read_document
      instructions: Read the exact file range needed for this step.
    - name: prompt_user
      instructions: Ask one necessary human question.
    - name: next_step
      instructions: Advance after this step is complete.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Use this step only when a pull request already exists for the current
    branch. Invoke `gh pr edit <pr-reference> --title <pull-request-title>
    --body <populated-pr-description>` using the completed body from the
    previous steps. Do not print the body, create a second PR, or run any other
    tool. Do not report completion until the command succeeds and its output
    identifies the pull request. Never merge the PR or push directly to main.
  tool_invocations:
  - tool: gh
    command:
    - pr
    - edit
    - <pr-reference>
    - --title
    - <pull-request-title>
    - --body
    - <populated-pr-description>
