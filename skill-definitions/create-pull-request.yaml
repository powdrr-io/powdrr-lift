name: create-pull-request
when_to_use:
- When validated staged changes must be committed, pushed, and published as a draft pull request.
- When an existing pull request for the current branch must receive the prescribed description and updated commit.
inputs:
- name: feature-name
- name: commit-message
- name: populated-pr-description
- name: files-to-publish
- name: base-branch
steps:
- description: Generate the pull request description template.
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Invoke `powdrr-lift pull-request-description --kind feature` exactly once.
    Keep the returned template in workflow context for the next step. Do not
    print the template, its sections, or a draft body to the chat or status
    window. Preserve the current branch and existing pull request context.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - pull-request-description
      - --kind
      - feature
  outputs:
  - name: pull_request_description_template
    type: any
    required_for_next_step: true
    schema: {type: object, additionalProperties: true}
- description: Fill in the pull request description template.
  actions: [edit, yaml_edit, file_management, read_document]
  step_type: governed
  llm_type: high_reasoning
  details: >-
    Fill every section of the returned template using the validated work item,
    changed files, decisions, review or CI evidence, and exact checks that were
    actually run. Preserve useful existing pull request content when updating
    an existing PR; do not discard sections that are not part of the generated
    template. Include the problem and before/after behavior, scope and
    non-goals, implementation details, compatibility impact, validation
    commands and results, risks and mitigations, reviewer focus, follow-up, and
    references. Include any kind-specific evidence requested by the template.
    If a section does not apply, write Not applicable and why. Never leave a
    placeholder or claim an unrun check passed. Keep the completed body in
    workflow context and do not print it to the chat or status window.
- description: Inspect repository state before staging the pull request.
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Capture the current short repository status before any cleanup or staging.
    Preserve the result in workflow context for the next step.
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command: [git, status, --short]
  outputs:
  - name: repository_status_before_staging
    type: any
    required_for_next_step: true
    schema: {type: string}
- id: remove-unintended-files
  description: Remove unintended files before staging.
  actions: [delete_file]
  step_type: governed
  llm_type: simple_task
  details: >-
    Compare the captured repository status with `files_to_publish`. If an
    untracked or modified path is not in `files_to_publish`, delete exactly one
    such path with {"action":"delete_file","file_path":"path/to/file"} and
    verify the repository status before advancing. If no unintended path is
    present, choose {"action":"next_step"}. Do not stage files in this step.
  outputs:
  - name: cleanup_result
    type: string
    required_for_next_step: false
    schema: {type: string}
- id: verify-clean-worktree
  description: Confirm the worktree is clean after cleanup.
  actions: []
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when the worktree has no unstaged or untracked files.
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command: [sh, -c, 'test -z "$(git status --porcelain)"']
  gate:
    outcome: {path: returncode, equals: 0}
    goto_step: remove-unintended-files
    retry_context: >-
      The worktree is not clean. Return to remove-unintended-files and delete
      one unintended path with delete_file before retrying this gate.
- description: Stage the exact files that belong in the pull request.
  id: stage-exact-files
  actions: [invoke_tool]
  step_type: governed
  llm_type: simple_task
  details: >-
    Invoke the intrinsic git tool exactly once with the authoritative
    `files_to_publish` list. Use exactly
    {"action":"invoke_tool","tool":"git","parameters":{"operation":"add","paths":["path/to/file"]}}.
    Do not use `git add .`, `git add --all`, or stage logs, caches, or unrelated
    files.
  tool_invocation_packages: [git_readonly_and_additive]
- description: Verify the staged pull request file set.
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Capture the staged file names after staging and preserve the result in
    workflow context. The next step will verify it against `files_to_publish`.
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command: [git, diff, --cached, --name-only]
  outputs:
  - name: staged_file_names
    type: any
    required_for_next_step: true
    schema: {type: string}
- description: Commit the validated changes.
  actions: [invoke_tool, edit, yaml_edit, delete_file, read_document]
  step_type: governed
  llm_type: simple_task
  details: >-
    Confirm with `git diff --cached --name-only` that the exact
    `files_to_publish` list is staged. If any intended file is missing or any
    unrelated file is staged, correct the staging before continuing. Commit
    with `<commit-message>`, then verify the result. If the commit reports
    "nothing to commit" and `git status --short` is empty, treat that as a
    successful no-change outcome: an earlier action already committed the
    exact state, so continue without creating an empty commit. If status shows
    unstaged or untracked paths, stop and correct each one: stage an intended
    path with the intrinsic git add action. For every unstaged or untracked path
    that is not in `files_to_publish`, delete it with the dedicated delete
    action before retrying. Use exactly
    {"action":"delete_file","file_path":"path/to/unintended-file"}
    for each unintended path; never add an unintended file to the commit.
    Rerun status, then retry the commit only after the worktree is clean or
    the intended changes are staged. Do not push or invoke any GitHub command
    in this step.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
  - tool: shell
    command:
    - git
    - commit
    - -m
    - <commit-message>
- description: Push the committed changes.
  actions: [invoke_tool, edit, yaml_edit, read_document]
  step_type: governed
  llm_type: simple_task
  details: >-
    Push the current feature branch with its upstream set. Verify that the
    remote branch contains the committed `HEAD` before continuing. Do not
    create or update a pull request in this step; leave the completed body in
    workflow context for the next step.
  tool_invocations:
  - tool: shell
    command:
    - git
    - push
    - -u
    - origin
    - HEAD
- description: Create a draft pull request when none exists.
  actions: [invoke_tool, edit, yaml_edit, read_document]
  step_type: governed
  llm_type: simple_task
  details: >-
    First verify that the current branch has at least one committed change
    relative to the exact base branch. If `git rev-list --count
    <base-branch>..HEAD` is zero, do not invoke `gh pr create`: inspect
    `git status`, stage the intended files, commit them, push the branch, and
    retry this step. Uncommitted files alone are not sufficient for a pull
    request. Confirm that the pushed `HEAD` contains every `files_to_publish`
    path. Use this step only when no pull request exists for the current
    branch.
    Invoke the registered gh intrinsic with exactly
    {"action":"invoke_tool","tool":"gh","parameters":{"operation":"pr_create","title":"Add <feature-name> implementation workflow","body":"<populated-pr-description>"}}.
    For this operation, provide only the title and body. The runtime determines
    the repository, current branch, base branch, and pull-request identity;
    never provide `pr_reference`, `head`, or `base`.
    The title must be the non-empty value `Add <feature-name> implementation
    workflow`; never pass a placeholder or shell command array. Use the
    completed body from the previous steps. Do not print the body, edit an
    existing PR, or run any other tool.
    Do not report completion until the command succeeds and its output includes
    the pull request URL. Never merge the PR or push directly to main.
  tool_invocation_packages: [gh_write]
- description: Update the existing pull request.
  actions: [invoke_tool, edit, yaml_edit, read_document]
  step_type: governed
  llm_type: simple_task
  details: >-
    Use this step only when a pull request already exists for the current
    branch. Invoke the registered gh intrinsic with exactly
    {"action":"invoke_tool","tool":"gh","parameters":{"operation":"pr_edit","title":"Add <feature-name> implementation workflow","body":"<populated-pr-description>"}}.
    For this operation, provide only the title and body. The runtime resolves
    the existing pull request from the current branch; never provide
    `pr_reference`, `head`, or `base`, and never use a proposed PR id as a
    GitHub pull-request reference.
    Do not print the body, create a second PR, or run any other tool. Do not
    report completion until the command succeeds and its output
    identifies the pull request. Never merge the PR or push directly to main.
  tool_invocation_packages: [gh_write]
