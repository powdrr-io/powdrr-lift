- id: generate-proposal-template
  description: Generate the specification-v1 proposal template from interview outputs.
  inputs:
  - name: work_item_name
    type: string
    required: true
  - name: feature_description
    type: string
    required: true
  - name: requirements_edits
    type: any
    required: true
  - name: approach_edits
    type: any
    required: true
  - name: entities_edits
    type: any
    required: true
  - name: entity_relationships_edits
    type: any
    required: true
  - name: invariants_edits
    type: any
    required: true
  - name: guidance_edits
    type: any
    required: true
  - name: features_edits
    type: any
    required: true
  - name: human_decisions_edits
    type: any
    required: true
  - name: intent_edits
    type: any
    required: true
  - name: intents_edits
    type: any
    required: true
  - name: acceptance_criteria_edits
    type: any
    required: true
  - name: expected_tests_edits
    type: any
    required: true
  - name: required_test_cases_edits
    type: any
    required: true
  - name: expected_outcomes_edits
    type: any
    required: true
  - name: non_goals_edits
    type: any
    required: true
  - name: risks_edits
    type: any
    required: true
  - name: decisions_edits
    type: any
    required: true
  - name: proposed_prs_edits
    type: any
    required: true
  - name: modules_edits
    type: any
    required: true
  - name: tools_edits
    type: any
    required: true
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    The 20 preceding *_edits inputs are the complete interview result. Invoke
    the feature-pr specification template generator exactly once for
    <work-item-name>; it creates docs/proposals/<work-item-name>/feature-pr-specification.yaml.
    Do not edit the YAML in this step. The next step will apply the interview
    outputs to that generated template.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command: [powdrr-lift, feature-pr-specification, --work-item-name, <work-item-name>]
  outputs:
  - name: proposal_template
    type: any
    required_for_next_step: true
- id: apply-proposal-edits
  description: Apply all interview outputs to the generated proposal YAML.
  inputs:
  - name: proposal_template
    type: any
    required: true
  - name: feature_description
    type: string
    required: true
  - name: requirements_edits
    type: any
    required: true
  - name: approach_edits
    type: any
    required: true
  - name: entities_edits
    type: any
    required: true
  - name: entity_relationships_edits
    type: any
    required: true
  - name: invariants_edits
    type: any
    required: true
  - name: guidance_edits
    type: any
    required: true
  - name: features_edits
    type: any
    required: true
  - name: human_decisions_edits
    type: any
    required: true
  - name: intent_edits
    type: any
    required: true
  - name: intents_edits
    type: any
    required: true
  - name: acceptance_criteria_edits
    type: any
    required: true
  - name: expected_tests_edits
    type: any
    required: true
  - name: required_test_cases_edits
    type: any
    required: true
  - name: expected_outcomes_edits
    type: any
    required: true
  - name: non_goals_edits
    type: any
    required: true
  - name: risks_edits
    type: any
    required: true
  - name: decisions_edits
    type: any
    required: true
  - name: proposed_prs_edits
    type: any
    required: true
  - name: modules_edits
    type: any
    required: true
  - name: tools_edits
    type: any
    required: true
  actions: [yaml_edit]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Use all 20 *_edits inputs and the generated proposal_template. Return exactly
    one yaml_edit action targeting docs/proposals/<work-item-name>/feature-pr-specification.yaml.
    Its operations must apply every added and deleted item from the interview;
    do not edit current-state documents and do not invent changes.
- id: evaluate-proposal
  description: Deterministically validate the completed proposal.
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: Invoke the declared evaluator exactly once and pass its complete result onward.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command: [powdrr-lift, evaluate, docs/proposals/<work-item-name>/feature-pr-specification.yaml]
  outputs:
  - name: proposal_evaluation
    type: any
    required_for_next_step: true
- id: repair-proposal
  description: Repair every issue reported by the evaluator.
  actions: [yaml_edit, read_document, gather_context, goto_step]
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Review only the latest evaluator result and use yaml_edit to fix every issue
    in the proposal. Use gather_context only for missing or unknown references.
    Then choose next_step so evaluate-proposal reruns.
- id: gate-proposal
  description: Confirm that the proposal validates cleanly.
  actions: []
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when proposal evaluation exits successfully with zero issues.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command: [powdrr-lift, evaluate, docs/proposals/<work-item-name>/feature-pr-specification.yaml]
  gate:
    outcome: {path: returncode, equals: 0}
    goto_step: evaluate-proposal
    retry_context: Repair the exact evaluator issues with yaml_edit, then rerun evaluation.
