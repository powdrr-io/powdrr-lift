name: design-interview
when_to_use:
- When a calling skill has a feature description and needs a specification-v1
  proposal grounded in the repository's existing context.
steps:
- id: gather-requirements
  description: Gather requirements and return proposal changes.
  inputs:
  - name: work_item_name
    type: string
    required: true
    source: caller
  - name: feature_description
    type: string
    required: true
    source: caller
  actions: [gather_context]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly {"action":"gather_context","types":["requirements"]}.
    Examine the exact returned list for the feature_description. Then return a
    JSON dictionary as the output requirements_edits, with exactly added and
    deleted lists. Each added requirement has {"id":"requirement-id","description":"...","state":"added"};
    each deleted item has {"id":"existing-requirement-id"}. Do not edit files.
  outputs:
  - name: requirements_edits
    type: any
    required_for_next_step: true
- id: gather-approach
  description: Gather approach and return proposal changes.
  actions: [gather_context]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly {"action":"gather_context","types":["approach"]}.
    Examine the exact returned list, then return output approach_edits as a JSON
    dictionary with exactly added and deleted lists. Each added approach item has
    {"id":"approach-id","description":"...","state":"added"}; each deleted
    item has {"id":"existing-approach-id"}. Do not edit files.
  outputs:
  - name: approach_edits
    type: any
    required_for_next_step: true
- id: gather-entities
  description: Gather entities and return proposal changes.
  actions: [gather_context]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly {"action":"gather_context","types":["entities"]}.
    Examine the exact returned list, then return output entities_edits as a JSON
    dictionary with exactly added and deleted lists. Each added entity has
    {"id":"entity-id","type":"allowed entity type","summary":"..."}; each
    deleted item has {"id":"existing-entity-id"}. Do not edit files.
  outputs:
  - name: entities_edits
    type: any
    required_for_next_step: true
- id: gather-entity-relationships
