- id: gather-non-goals
  description: Gather non-goals and return proposal changes.
  actions: [gather_context]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly {"action":"gather_context","types":["non_goals"]} and
    present the exact returned list. Then return output non_goals_edits as a JSON
