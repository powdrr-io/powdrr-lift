name: design-interview
when_to_use:
- When a calling skill has a feature description and needs a specification-v1
  proposal grounded in the repository's existing context.
steps:
- id: capture-feature
  description: Accept the required feature description and identify the work item.
  inputs:
  - name: feature_description
    type: string
    required: true
    source: caller
  - name: work_item_name
    type: string
    required: false
    source: caller
  actions: []
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    The caller-provided feature_description is required input. Choose a stable
    kebab-case work_item_name and advance with outputs containing exactly
    work_item_name and feature_description. Do not ask the user for the feature
    description and do not gather context in this step.
  outputs:
  - name: work_item_name
    type: string
    required_for_next_step: true
  - name: feature_description
    type: string
    required_for_next_step: true
- id: generate-proposal
  description: Create the empty specification-v1 proposal template.
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: Invoke the feature-pr specification generator exactly once; do not edit its output.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command: [powdrr-lift, feature-pr-specification, --work-item-name, <work-item-name>]
  outputs:
  - name: proposal_template
    type: any
    required_for_next_step: true

- id: gather-requirements
  description: Gather requirements, present them, and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly this action:
    {"action":"gather_context","types":["requirements"],"keywords":["FEATURE_DESCRIPTION"]}.
    Present the exact returned match list. Then return exactly one yaml_edit action
    with this shape: {"action":"yaml_edit","file_path":"docs/proposals/<work-item-name>/feature-pr-specification.yaml","operations":[{"op":"upsert_item","section":"requirements","id":"REQUIREMENT_ID","value":{"description":"DESCRIPTION","state":"added"}}]}.
    Include all additions and deletions in that operations list, preserve prior
    proposal edits, and do not edit current-state files.
- id: gather-approach
  description: Gather approach, present it, and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly {"action":"gather_context","types":["approach"]} and
    present its exact match list. Then return one yaml_edit action targeting
    docs/proposals/<work-item-name>/feature-pr-specification.yaml with an
    operations list of upsert_item or remove_item entries for section approach.
    An added item has {"id":"APPROACH_ID","description":"DESCRIPTION","state":"added"}.
- id: gather-entities
  description: Gather entities, present them, and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly {"action":"gather_context","types":["entities"]} and
    present its exact match list. Then return one yaml_edit targeting the proposal
    with operations shaped as {"op":"upsert_item","section":"entities","id":"ENTITY_ID","value":{"id":"ENTITY_ID","type":"ENTITY_TYPE","summary":"SUMMARY","action":"added"}} or remove_item for deletions.
- id: gather-entity-relationships
  description: Gather entity relationships, present them, and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly {"action":"gather_context","types":["entity-relationships"]}
    and present its exact match list. Then return one yaml_edit targeting the
    proposal with operations shaped as {"op":"upsert_item","section":"entity_relationships","id":"RELATIONSHIP_ID","value":{"id":"RELATIONSHIP_ID","source":"SOURCE_ENTITY_ID","target":"TARGET_ENTITY_ID","relationship":"RELATIONSHIP"}} or remove_item.
- id: gather-invariants
  description: Gather invariants, present them, and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly {"action":"gather_context","types":["invariants"]} and
    present its exact match list. Then return one yaml_edit targeting the proposal
    with upsert_item or remove_item operations for section invariants. An added
    item has {"id":"INVARIANT_ID","description":"DESCRIPTION","related":{"entities":[],"entity_relationships":[]}}.
- id: gather-guidance
  description: Gather guidance, present it, and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly {"action":"gather_context","types":["guidance"]} and
    present its exact match list. Then return one yaml_edit targeting the proposal
    with upsert_item or remove_item operations for section guidance, using an item
    shaped {"id":"GUIDANCE_ID","description":"DESCRIPTION","related":{"entities":[],"entity_relationships":[]}}.
- id: gather-features
  description: Gather features, present them, and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly {"action":"gather_context","types":["features"]} and
    present its exact match list. Then return one yaml_edit targeting the proposal
    with upsert_item or remove_item operations for section features. An added item
    has {"id":"FEATURE_ID","action":"added","description":"DESCRIPTION","functional_requirements":[]}.
- id: gather-human-decisions
  description: Gather human decisions, present them, and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly {"action":"gather_context","types":["human-decisions"]}
    and present its exact match list. Then return one yaml_edit targeting the
    proposal with upsert_item or remove_item operations for section
    human-decisions. An added item has {"id":"DECISION_ID","action":"added","description":"DESCRIPTION"}.
- id: gather-intent
  description: Gather intent, present it, and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    First call exactly {"action":"gather_context","types":["intent"]}
