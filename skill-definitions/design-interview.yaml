- id: evaluate-proposal
  description: Deterministically validate the completed proposal.
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: Invoke the declared evaluator exactly once and pass its complete result onward.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command: [powdrr-lift, evaluate, docs/proposals/<work-item-name>/feature-pr-specification.yaml]
  outputs:
  - name: proposal_evaluation
    type: any
    required_for_next_step: true
- id: repair-proposal
  description: Repair every issue reported by the evaluator.
  actions: [yaml_edit, read_document, gather_context, goto_step]
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Review only the latest evaluator result and use yaml_edit to fix every issue
    in the proposal. Use gather_context only when a current reference is missing
    or unknown. Then choose next_step so evaluate-proposal reruns.
- id: gate-proposal
  description: Confirm that the proposal validates cleanly.
  actions: []
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when proposal evaluation exits successfully with zero issues.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command: [powdrr-lift, evaluate, docs/proposals/<work-item-name>/feature-pr-specification.yaml]
  gate:
    outcome: {path: returncode, equals: 0}
    goto_step: evaluate-proposal
    retry_context: Repair the exact evaluator issues with yaml_edit, then rerun evaluation.
