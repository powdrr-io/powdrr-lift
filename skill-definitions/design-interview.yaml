name: design-interview
when_to_use:
- When a feature description should be reconciled with current specification-v1
  context before producing a proposal.
- When each supported gather_context category should be reviewed independently
  and converted into explicit proposal edits.
steps:
- id: capture-feature
  description: Capture the feature description used by the interview.
  actions: []
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Treat the feature description as an input to this skill. If it is already
    present in task context, preserve it; otherwise ask one focused question with
    prompt_user. Choose a stable kebab-case work_item_name. When both are known,
    advance with outputs containing exactly work_item_name and feature_description.
  outputs:
  - name: work_item_name
    type: string
    required_for_next_step: true
  - name: feature_description
    type: string
    required_for_next_step: true
- id: generate-proposal
  description: Create the empty specification-v1 proposal template.
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: Invoke the feature-pr specification generator exactly once; do not edit its output.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - feature-pr-specification
      - --work-item-name
      - <work-item-name>
  outputs:
  - name: proposal_template
    type: any
    required_for_next_step: true

- id: gather-requirements
  description: Gather requirements and edit the proposal from that result.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [requirements], using the feature
    description as a keyword when useful. Present that returned match list as the
    current requirements, then return one yaml_edit containing the complete set
    of proposal edits required by the feature. Edit only
    docs/proposals/<work-item-name>/feature-pr-specification.yaml. Do not edit
    before the gather_context result is available.
- id: gather-approach
  description: Gather approach items and edit the proposal from that result.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [approach]. Present the returned
    current approach list, then use one yaml_edit to add, update, or remove the
    proposal approach items needed for the feature. Preserve prior proposal edits.
- id: gather-entities
  description: Gather entities and edit the proposal from that result.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [entities]. Present the returned
    current entity list, then use one yaml_edit with the complete entity changes
    needed for the feature. Keep exact ids for dependencies and deletions.
- id: gather-entity-relationships
  description: Gather entity relationships and edit the proposal from that result.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [entity-relationships]. Present
    the returned relationship list, then use one yaml_edit to add, update, or
    remove every relationship required by the feature. Use exact entity ids.
- id: gather-invariants
  description: Gather invariants and edit the proposal from that result.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [invariants]. Present the result,
    then use one yaml_edit for the complete invariant changes required by the
    feature. Keep related entity and relationship references explicit.
- id: gather-guidance
  description: Gather guidance and edit the proposal from that result.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [guidance]. Present the result,
    then use one yaml_edit for all feature-specific guidance changes in the
    proposal.
- id: gather-features
  description: Gather features and edit the proposal from that result.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [features]. Present the returned
    feature list, then use one yaml_edit for the proposal feature changes. Keep
    feature ids unique.
- id: gather-human-decisions
  description: Gather human decisions and edit the proposal from that result.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [human-decisions]. Present the
    result, then use one yaml_edit for decisions that must be preserved in the
    proposal.
- id: gather-intent
  description: Gather intent and edit the proposal from that result.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [intent, intents]. Present the
    returned intent records, then use one yaml_edit for proposal intent changes.
- id: gather-acceptance-criteria
  description: Gather acceptance criteria and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [acceptance_criteria]. Present
    the result, then use one yaml_edit to add or update criteria proving the
    feature outcomes.
- id: gather-expected-tests
  description: Gather expected tests and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [expected_tests]. Present the
    result, then use one yaml_edit to capture feature-specific expected tests.
- id: gather-required-test-cases
  description: Gather required test cases and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [required_test_cases]. Present
    the result, then use one yaml_edit to capture required feature test cases.
- id: gather-expected-outcomes
  description: Gather expected outcomes and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [expected_outcomes]. Present the
    result, then use one yaml_edit to make feature outcomes explicit.
- id: gather-non-goals
  description: Gather non-goals and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [non_goals]. Present the result,
    then use one yaml_edit to define what this feature will not change.
- id: gather-risks
  description: Gather risks and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [risks]. Present the result,
    then use one yaml_edit to capture feature risks.
- id: gather-decisions
  description: Gather decisions and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [decisions]. Present the result,
    then use one yaml_edit for feature decisions and tradeoffs.
- id: gather-proposed-prs
  description: Gather proposed PRs and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [proposed_prs]. Present the
    result, then use one yaml_edit to align with existing proposed work.
- id: gather-modules
  description: Gather modules and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [modules]. Present the current
    module list, then use one yaml_edit for module changes or dependencies.
- id: gather-tools
  description: Gather tools and edit the proposal.
  actions: [gather_context, yaml_edit, read_document]
  step_type: freeform
  llm_type: high_reasoning
  prompt_catalogs: [context_types]
  details: >-
    First call gather_context with exactly types [tools]. Present the current tool
    list, then use one yaml_edit for validation or operational tool changes.
- id: evaluate-proposal
  description: Deterministically validate the completed proposal.
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: Invoke the declared evaluator exactly once and pass its complete result onward.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>/feature-pr-specification.yaml
  outputs:
  - name: proposal_evaluation
    type: any
    required_for_next_step: true
- id: repair-proposal
  description: Repair every issue reported by the evaluator.
  actions: [yaml_edit, read_document, gather_context, goto_step]
  step_type: freeform
  llm_type: fast_iteration
  prompt_catalogs: [context_types]
  details: >-
    Review only the latest deterministic evaluator result. Repair every issue in
    the proposal with yaml_edit, preserving valid prior edits. Use gather_context
    only for missing or unknown current references. After editing, choose
    next_step so evaluate-proposal reruns. Use goto_step to restart
    capture-feature only when the feature input itself must be reconsidered.
- id: gate-proposal
  description: Confirm that the proposal validates cleanly.
  actions: []
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when proposal evaluation exits successfully with zero issues.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>/feature-pr-specification.yaml
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: evaluate-proposal
    retry_context: >-
      The proposal still has validation issues. Repair the exact reported paths
      with yaml_edit and let evaluation rerun.
