---
name: feature-test-coverage-review
when_to_use:
- When the user asks for a test coverage review of a feature pull request.
- When a pull request implements one or more proposed PRs from a feature definition
  and the requested tests need to be reconciled with the implementation.
- When the review must report missing, insufficient, or unjustified tests as inline
  pull-request comments.
steps:
- description: Discover the referenced pull request and its feature relationship.
  step_type: freeform-skill-invoke
  llm_type: long_context
  details: >-
    Inspect the referenced PR's title, body, labels, commits, changed files,
    base and head branches, and review history using the connected GitHub
    repository. Locate the canonical feature definition and its ordered proposed
    PR specifications from the PR body, changelog entries, specification paths,
    commit messages, and changed files. Build a ledger containing the feature
    definition, requested tests, proposed PRs in order, the current PR's state,
    and the implementation and test files it changes. Treat structured feature
    and proposed-PR metadata as authoritative. If the relationship is ambiguous,
    prepare one inline finding on the nearest relevant changed line and do not
    continue with an assumed feature.
  tool_invocations:
  - tool: shell
    command:
    - gh
    - pr
    - view
    - <pr-reference>
    - --json
    - number,title,body,baseRefName,headRefName,headRefOid,state,isDraft,labels,files,commits,reviews
  - tool: shell
    command:
    - gh
    - pr
    - diff
    - <pr-reference>
    - --patch
- description: Select the feature test scope for the current pull request.
  step_type: freeform-skill-invoke
  prompt_catalogs: [context_types]
  llm_type: high_reasoning
  details: >-
    Determine whether the current PR is intermediate or final in the ordered
    proposed-PR plan. For an intermediate PR, review only the feature tests
    assigned to that proposed PR and its explicit dependencies. For a final PR,
    review the complete feature definition, every related proposed-PR
    specification, and the landed implementation and test diffs. Use the
    invoke the gather_context workflow action with the proposed-PR entity type
    filtered by the canonical feature id:
    {"kind":"gather_context","types":["proposed_prs"],"keywords":["<feature-id>"]}.
    Use the returned records to confirm scope and ordering rather than relying
    only on PR prose. Record the exact requested
    test cases, acceptance criteria that require tests, and validation commands.
- description: Build the requested-test coverage matrix.
  step_type: freeform-skill-invoke
  llm_type: high_reasoning
  details: >-
    Read the feature definition and selected proposed-PR specifications, then
    inspect the complete implementation and test diffs plus surrounding tests.
    Build one row for every requested test, required test case, acceptance
    criterion with testable behavior, and explicit edge or error case. For each
    row record the source requirement, implementation evidence, exact test file
    and test name or a precise reason it is absent, and status: covered,
    partially covered, missing, contradicted, or not applicable. Confirm that
    tests exercise behavior rather than merely increasing line coverage. Check
    positive, negative, boundary, empty-state, compatibility, persistence,
    authorization, integration, and regression cases whenever the feature
    contract requests them. Then inventory every changed or newly added test and
    map it to a feature requirement. Treat an extra test with no supported
    requirement, acceptance criterion, regression, or necessary safety coverage
    as an unjustified scope finding. Do not demand tests for behavior explicitly
    outside the feature's scope. The matrix is the basis for findings.
- description: Post every actionable test coverage finding inline.
  step_type: freeform-skill-invoke
  llm_type: simple_task
  details: >-
    Check existing unresolved review threads before posting. Post each actionable
    finding directly to the referenced PR as an inline comment anchored to the
    smallest relevant changed line. Findings must identify the missing or
    unjustified test, cite the feature or proposed-PR requirement, explain the
    risk, and give a concise fix direction. Anchor missing-test findings to the
    nearest changed implementation line or changed test area when no test line
    exists, and explain that the anchor represents a coverage gap. Do not report
    already-covered rows, do not duplicate an unresolved root cause, and do not
    post a general summary instead of inline findings. Do not approve, merge,
    close, label, or modify code as part of this skill.
  tool_invocations:
  - tool: shell
    command:
    - gh
    - api
    - repos/<owner>/<repo>/pulls/<number>/comments
    - --paginate
  - tool: shell
    command:
    - gh
    - api
    - repos/<owner>/<repo>/pulls/<number>/comments
    - --method
    - POST
    - -f
    - body=<finding>
    - -f
    - commit_id=<current-head-sha>
    - -f
    - path=<changed-file>
    - -F
    - line=<changed-line>
    - -f
    - side=RIGHT
- description: Verify the posted coverage review and report the audit result.
  step_type: freeform-skill-invoke
  llm_type: standard_reasoning
  details: >-
    Confirm that every intended finding exists on the target PR, is attached to
    the current diff, and is not merely present in an unposted draft or summary.
    Verify each posted comment's path, line, commit id, and body with the GitHub
    API. Report the PR, intermediate or final review scope, requested-test row
    count, covered and missing row counts, unjustified-extra-test count, and
    inline findings posted. If GitHub write access is unavailable, do not claim
    completion; report the exact prepared findings and posting failure.
  tool_invocations:
  - tool: shell
    command:
    - gh
    - api
    - repos/<owner>/<repo>/pulls/<number>/comments
    - --paginate
