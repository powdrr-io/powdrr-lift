---
name: finish-pr-prep
when_to_use:
- When staged changes must be validated immediately before creating or updating a
  pull request.
- When tests, formatting, lint, and type checks must be rerun after the final
  staged file set is known.
steps:
- description: Deterministically inspect the staged file set.
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    The deterministic pre-step records the staged file names for the next step.
    An empty result is valid: `git diff --cached --name-only` returns success
    even when no files are staged. Do not invoke the command again; use the
    deterministic_context result and choose `next_step`.
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - git
      - diff
      - --cached
      - --name-only
- description: Confirm the staged pull request scope and validation commands.
  step_type: freeform
  prompt_catalogs: [context_types]
  llm_type: high_reasoning
  details: >-
    Inspect the staged and unstaged diff before final validation. Confirm that
    the intended pull-request files are staged and remove unrelated files from
    the staged set. First invoke the declared `git diff --cached --stat` shell
    command and use its result; do not substitute `git diff --cached --name-only`
    or another Git command. Then use the gather_context action with type `tools` and filters
    for label `pr-prep` and for every programming-language label represented by
    the changed code. Discover those language labels from the staged files and
    repository context; do not hard-code a language. Use the returned tool
    references and their templates/how_to_use fields to determine the exact
    test, formatting, lint, and type-check commands. The label filters must be
    combined so each selected tool has the `pr-prep` label and every touched
    language label. Do not infer commands from convention or hard-code
    repository tooling. The deterministic_context from the prior step is
    authoritative for the staged file names; an empty staged-file list is valid
    and must not be treated as a command failure. If the intended scope or
    applicable tool references are unclear, ask one precise question before
    continuing. Before choosing next_step, perform the validation discovery
    action exactly once as {"action":"gather_context","types":["tools"],
    "filters":{"labels":["pr-prep"]}}; do not vary the filter key or add
    keywords, because this discovery must register the next step's validation
    obligations.
  tool_invocations:
  - tool: ref
    label: pr-prep
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
  - tool: shell
    command:
    - git
    - diff
    - --cached
    - --stat
- description: Run the final formatting, lint, type-check, and test passes.
  step_type: freeform
  validation_gate:
    id: pr-prep-validation
    discovery:
      action:
        kind: gather_context
        types:
        - tools
        filters:
          labels:
          - pr-prep
      result_path: matches
    obligations:
      source: matches
      filter:
        section: tools
      language_filter:
        labels_by_id:
          ruff-format: [python]
          ruff-format-check: [python]
          ruff-lint: [python]
          pytest: [python]
          mypy: [python]
      id: item.id
      action: item.validation_action
  llm_type: fast_iteration
  details: >-
    Run every validation command returned by the matching tool references for
    the staged pull-request scope. The runtime validation gate is authoritative:
    First perform its exact discovery action once as
    {"action":"gather_context","types":["tools"],"filters":{"labels":["pr-prep"]}};
    do not vary the filter key, use a singular label key, or add keywords.
    Only after that discovery succeeds may you invoke its returned obligations.
    invoke every discovered obligation and do not choose next_step, goto_step, or
    complete until all obligations pass in the current validation epoch. If any
    obligation fails, apply its corrective action, then rerun every discovered
    obligation; a previously passing obligation must also be rerun after a correction.
    If no obligations are discovered, the gate passes explicitly with an empty set. If any
    formatter or cleanup step changes files, inspect those edits, restage only
    the intended files, and rerun the complete discovered tool set.
- description: Leave the branch ready for pull request creation.
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Invoke the listed `powdrr-lift repository-state` tool exactly once. Use its
    result to confirm that the intended files remain staged, the worktree has
    no unintended leftovers, and the final commands and results are recorded
    for the upcoming pull request summary. After receiving that result, choose
    `next_step` immediately; do not invoke `repository-state` again unless a
    file or staging state changed after the first check. Do not create or
    update the pull request in this skill.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - repository-state
