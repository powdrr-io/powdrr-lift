---
name: finish-pr-prep
when_to_use:
- When staged changes must be validated immediately before creating or updating a
  pull request.
- When tests, formatting, lint, and type checks must be rerun after the final
  staged file set is known.
steps:
- description: Deterministically inspect the staged file set.
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    The deterministic pre-step records the staged file names for the next step.
    An empty result is valid: `git diff --cached --name-only` returns success
    even when no files are staged. Do not invoke the command again; use the
    deterministic_context result and choose `next_step`.
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - git
      - diff
      - --cached
      - --name-only
- description: Confirm the staged pull request scope.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Invoke the declared `git diff --cached --stat` command once. Confirm from
    its result that the staged set is the intended pull-request scope, then
    choose next_step. Do not invoke another Git command in this step.
  tool_invocations:
  - tool: shell
    command:
    - git
    - diff
    - --cached
    - --stat
- description: Discover validation tools for the staged languages.
  step_type: freeform
  prompt_catalogs: [context_types]
  llm_type: high_reasoning
  details: >-
    Read the staged file names from deterministic_context and derive every
    programming-language label they represent. Invoke gather_context exactly
    once with types [tools] and a labels filter containing pr-prep plus those
    language labels. If no language labels are present, use only pr-prep. Do
    not hard-code a language, tool, or command. For example, the action shape
    is {"kind":"gather_context","types":["tools"],"filters":{"labels":["pr-prep","<language-label>"]}}.
    Choose next_step after the gather_context result is returned; that result
    seeds both the validation tools shown to the next step and its runtime
    obligations.
  outputs:
  - name: validation_tools
    type: any
    required_for_next_step: true
- description: Run the final formatting, lint, type-check, and test passes.
  step_type: freeform
  inputs:
  - name: validation_tools
    type: any
    required: true
    source: previous_step
  validation_gate:
    id: pr-prep-validation
    discovery:
      action:
        kind: gather_context
        types:
        - tools
      filters_from_action: true
      discovery_output: validation_tools
      result_path: matches
    obligations:
      source: matches
      filter:
        section: tools
      id: item.id
      action: item.validation_action
  llm_type: fast_iteration
  details: >-
    Use the validation_tools handoff input as the sole validation action list.
    Invoke every listed action and satisfy its corresponding runtime obligation
    before choosing next_step, goto_step, or complete. If an obligation fails,
    apply its corrective action and rerun every listed action, including actions
    that passed previously. An empty validation_tools list is a valid passing
    result. If a formatter or cleanup action changes files, inspect the edits,
    restage only the intended files, and rerun the complete validation_tools list.
- description: Leave the branch ready for pull request creation.
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Invoke the listed `powdrr-lift repository-state` tool exactly once. Use its
    result to confirm that the intended files remain staged, the worktree has
    no unintended leftovers, and the final commands and results are recorded
    for the upcoming pull request summary. After receiving that result, choose
    `next_step` immediately; do not invoke `repository-state` again unless a
    file or staging state changed after the first check. Do not create or
    update the pull request in this skill.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - repository-state
