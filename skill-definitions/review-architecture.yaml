---
name: review-architecture
when_to_use:
- When new needs may require updating the current architecture specification.
- When the TUI should evaluate whether the architecture still fits the system needs.
steps:
- description: Gather the entities, entity relationships, invariants, and guidance
    context.
  step_type: freeform
  prompt_catalogs: [context_types]
  llm_type: simple_task
  details: Use the architecture context to understand the current model before judging
    whether it needs to change.
- description: Decide whether the current architecture specification needs to change.
  step_type: freeform
  llm_type: high_reasoning
  details: Compare the gathered entity model against the new needs. If the existing
    spec already covers them, report that no update is needed and stop.
- description: Generate and fill the architecture specification template only when
    changes are required.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Run the architecture specification command, then fill the generated template
    with the required updates using the first-class yaml_edit action. Return
    complete operations with set_value paths or upsert_item section, id, and
    value fields; do not use invoke_tool for YAML edits.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - architecture-specification
    - "--work-item-name"
    - "<work-item-name>"
    - "--entity-type"
    - "<type>"
- description: Validate the updated architecture specification and confirm it is still
    consistent.
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Invoke the generic evaluator exactly once after the specification
    edits. If it succeeds, use its result to confirm that no inconsistencies
    remain and choose `next_step` immediately. If it reports validation errors,
    edit the specification to address them before invoking the validator again;
    never repeat the same validation command unchanged.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate
    - docs/proposals/<work-item-name>/architecture-specification.yaml
