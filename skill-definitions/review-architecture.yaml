---
name: review-architecture
interaction_style: observational_review
when_to_use:
- When new needs may require updating the current architecture specification.
- When the TUI should evaluate whether the architecture still fits the system needs.
steps:
- description: Gather the entities, entity relationships, invariants, and guidance
    context.
  actions: [gather_context, edit, yaml_edit, file_management, read_document]
  step_type: freeform
  prompt_catalogs: [context_types]
  llm_type: simple_task
  details: >-
    Use gather_context with exactly the types entities, entity-relationships,
    invariants, and guidance to understand the current architecture model before
    judging whether it needs to change. Do not use architecture or relationships
    as context types; those are not valid catalog tokens.
- description: Decide whether the current architecture specification needs to change.
  actions: [edit, yaml_edit, file_management, read_document, complete]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Compare the gathered entity model against the new needs. If the existing
    specification already covers them, return the complete action, for example
    {"action":"complete","text":"The existing architecture covers the new needs."};
    otherwise choose next_step.
- id: generate-architecture
  description: Deterministically generate the architecture specification template.
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Invoke the declared generator exactly once; do not edit the generated file.
    The generator overwrites an unreadable/invalid existing file and merges
    readable values into the fresh template while restoring instructions and
    missing default fields.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - architecture-specification
      - "--work-item-name"
      - "<work-item-name>"
      - "--all-entity-types"
  outputs:
  - name: architecture_specification_template
    type: any
    required_for_next_step: true
- id: fill-architecture
  description: Fill the architecture specification with the required updates.
  actions: [edit, yaml_edit, file_management, read_document]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Use yaml_edit for every YAML change. Include complete operations using
    set_value paths or upsert_item section, id, and value fields. Do not use
    invoke_tool for YAML edits.
- id: evaluate-architecture
  description: Deterministically evaluate the updated architecture specification.
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: Invoke the evaluator exactly once; do not edit the file in this step.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>/architecture-specification.yaml
  outputs:
  - name: architecture_evaluation
    type: any
    required_for_next_step: true
- id: repair-architecture
  description: Repair every reported architecture specification issue.
  actions: [edit, yaml_edit, file_management, read_document, goto_step]
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Use yaml_edit actions to fix every issue reported by evaluation. If there
    are no issues, choose next_step without changing the file. Do not use
    invoke_tool in this freeform repair step; the next deterministic step reruns
    the evaluator. If evaluation reports invalid YAML/structure or you are
    stuck, restart generation with {"action":"goto_step","step_id":"generate-architecture"}
    instead of repeating the same repair.
- id: gate-architecture
  description: Confirm that architecture evaluation reports zero issues.
  actions: []
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when evaluation exits successfully with zero issues.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>/architecture-specification.yaml
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: evaluate-architecture
    retry_context: >-
      The gate failed because evaluation still reports issues. Repair every
      issue with yaml_edit, then let the deterministic evaluator run again.
