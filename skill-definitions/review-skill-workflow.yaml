---
name: review-skill-workflow
inputs:
- name: skill-definitions-or-workflow-root
- name: target-name
- name: target-definition
- name: rewrite-context
- name: accepted-rewrites
- name: target-definition-path
- name: staged-definition
- name: files-to-publish
- name: review-report
- name: validation-result
when_to_use:
- When the user wants to review or rewrite a skill definition for directive,
  concise, consistently executable instructions.
- When the user wants to review a workflow definition or generated workflow task
  sequence for excessive tool calls, hidden substeps, or ambiguous instructions.
- When the review should produce an improved definition rather than only a prose
  critique.
steps:
- id: resolve-target
  actions: [invoke_tool, edit, yaml_edit, read_document]
  step_type: governed
  prompt_catalogs: [skills]
  description: Resolve and read the target definition.
  llm_type: long_context
  details: >-
    Select exactly one target from the user's explicit path or name. If the
    user provides neither, ask them to identify the skill or workflow before
    using a tool. If the name is not an exact path, use fuzzy-match once to
    locate candidates, then ask one specific question if more than one
    candidate is plausible. Read the complete target definition with
    read_document. Do not edit it during this step. Record its goal, inputs,
    outputs, dependencies, steps or tasks, and existing validation
    requirements.
  tool_invocations:
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - <skill-definitions-or-workflow-root>
    - -name
    - <target-name>
    - -type
    - f
    - -print
- id: inventory-steps
  actions: [edit, yaml_edit, file_management, read_document]
  step_type: governed
  description: Inventory every target step and its execution surface.
  llm_type: standard_reasoning
  details: >-
    Read the `target_definition` input and build an inventory table with one row
    for each target step or task. Preserve
    source order and quote the description and English instructions in that
    row. For each row count explicit
    tool_invocations, uses_skill steps or nested workflow calls, and distinct action
    clauses in the English instructions. Count an action clause whenever the
    text tells the LLM to inspect, decide, edit, invoke, validate, record, ask,
    or report; count conditional branches separately. Mark whether every tool
    call has a concrete purpose, complete arguments or placeholders, timing,
    expected result, and failure or retry rule. Treat a tool command plus an
    unmentioned follow-up command as separate calls. Do not infer missing
    instructions from repository conventions.
- id: score-steps
  actions: [edit, yaml_edit, file_management, read_document]
  step_type: governed
  description: Score directive quality and identify scope-preserving rewrites.
  llm_type: high_reasoning
  details: >-
    Review each inventory row against four gates: tool economy, substep
    economy, invocation specificity, and goal fidelity. Prefer zero tool calls
    for reasoning-only steps and one tool call for an atomic operation. Flag
    every step with more than one independent tool call, more than three action
    clauses, vague verbs, mixed decisions and execution, repeated context,
    missing inputs or outputs, implicit data handoffs between steps or skills,
    unbounded retry language, or a tool call whose
    arguments and success condition are not explicit. Distinguish a real
    prerequisite from unnecessary orchestration. Do not remove a required
    validation or evidence check merely to lower a count. For each finding,
    state the smallest safe change and the requirement it preserves.
- id: draft-rewrites
  actions: [edit, yaml_edit, file_management, read_document]
  step_type: governed
  description: Draft concise, directive replacement steps.
  llm_type: high_reasoning
  details: >-
    Rewrite only steps that fail a gate. Keep the original goal, required
    evidence, dependencies, safety constraints, and output. Give each rewritten
    step one observable outcome and at most one tool invocation. Use imperative
    sentences with explicit inputs, exact command arguments or placeholders,
    expected result, and one bounded correction rule. Favor explicit
    instructions on what data to pass between steps and skills. Move rationale and
    background out of execution instructions. Do not combine unrelated actions
    into a single step and do not invent a tool, file, field, or dependency.
    Present original text, proposed text, tool count, action-clause count, and
    preserved requirements for every rewrite.
- id: independent-review
  actions: [edit, yaml_edit, file_management, read_document, invoke_skill]
  step_type: governed
  description: Obtain an independent adversarial completeness review.
  llm_type: high_reasoning
  details: >-
    Return this exact action shape to invoke the independent review:
    {"action":"invoke_skill","skill":"independent-skill-workflow-review",
    "provider_role":"adversarial","clean":true,"context":["<target goal>",
    "<original step text>","<proposed replacement text>",
    "<preserved requirements>","<inventory counts>"],
    "decisions_and_context":"Compare the rewrite with the original."}.
    Keep clean=true so the reviewer receives no inherited task or parent-skill
    context. Pass the target goal, original step text, proposed replacement
    text, preserved-requirement list, and inventory counts from `rewrite_context`
    in the context array;
    do not omit any of these entries or rely on inherited context.
    Ask it to compare the rewrite with the original without seeing this skill's
    findings or preferred answer. Require it to identify omitted goals,
    dependencies, safety checks, outputs, hidden tool calls, or instructions
    that remain ambiguous. Do not edit the target while the independent review
    is running.
- id: reconcile-rewrites
  actions: [edit, yaml_edit, file_management, read_document, goto_step]
  step_type: governed
  description: Reconcile feedback and iterate until the rewrite is complete.
  llm_type: high_reasoning
  details: >-
    Compare the independent review with the original inventory. For each changed
    step, invoke independent-review once and wait for its result. Restore every
    requirement the independent reviewer proves was omitted, then shorten or
    split the replacement without increasing unnecessary tool calls. Repeat the
    independent review for any changed step; do not proceed while an actionable
    omission or ambiguity remains. If a changed rewrite needs another
    independent check, use goto_step with step_id `independent-review` and
    return here after that check. Stop only when every changed step has zero or
    one tool call, no more than three action clauses unless justified, explicit
    invocation instructions, and a complete preserved-requirement list.
- id: apply-and-publish
  actions: [edit, yaml_edit, file_management, read_document]
  step_type: governed
  description: Apply and validate the accepted definition.
  llm_type: fast_iteration
  details: >-
    Apply the accepted rewrites to the target definition with the appropriate
    structured edit. Preserve unrelated steps and formatting. Validate the
    complete skill or workflow definition once after editing. If validation
    fails, correct the target and rerun validation only after a change; never
    repeat the same validation command unchanged. Emit one structured
    `apply_and_publish` output with fields `per_step_counts`,
    `remaining_justified_exceptions`, `validation_result`, and `file_changed`.
    Keep the changed definition, final review report, and validation
    result in workflow context for the pull-request steps. Do not create or
    update a pull request in this step.
  outputs:
  - name: apply_and_publish
    type: object
    required_for_next_step: true
    schema: {type: object, additionalProperties: true}

- id: verify-target-change
  actions: [invoke_tool]
  step_type: governed
  description: Confirm the reviewed definition changed before preparing a pull request.
  llm_type: simple_task
  details: >-
    Invoke the declared shell command to list changes for the exact
    `target_definition_path`. If the command returns no target path, the review produced no
    file change; choose `complete` with a concise no-change result and do not
    invoke staging, pull-request preparation, or pull-request creation. If the
    target path is listed, set output_state.files_to_publish to that exact path and choose
    `next_step` to continue. Do not treat an unchanged existing file as a
    publishable artifact. Return
    {"action":"complete","text":"No target definition changed."} when no
    target path is listed, or {"action":"next_step"} when it is listed.
  tool_invocations:
  - tool: shell
    command:
    - git
    - diff
    - --name-only
    - --
    - <target-definition-path>

- id: stage-for-pull-request
  step_type: invoke_tool
  description: Stage the reviewed definition for pull-request preparation.
  llm_type: simple_task
  details: >-
    Use the target path confirmed by `verify-target-change` as
    `files_to_publish`, then invoke `git add <target-definition-path>` with that
    path only.
    Verify the staged names with `git diff --cached --name-only`; do not stage
    logs, caches, or unrelated files. Do not create or update a pull request in
    this step.
  pre_step:
    action: invoke_tool
    template:
      tool: git
      operation: add
      paths: [<target-definition-path>]

- id: finish-pull-request-prep
  step_type: uses_skill
  description: Run final pull-request preparation checks.
  llm_type: simple_task
  details: >-
    Invoke `finish-pr-prep` with `staged_definition` and the
    `apply_and_publish.validation_result`
    result from `apply-and-publish`. Do not create or update a pull request in
    this step; continue only when the nested skill confirms the final staged
    scope and required checks are clean.
  uses_skill:
    skill: finish-pr-prep

- id: create-pull-request
  step_type: uses_skill
  description: Create or update the pull request for the reviewed definition.
  llm_type: simple_task
  details: >-
    Invoke `create-pull-request` with pr-kind `skill-workflow-review`, a commit
    message of at most 72 characters, a title containing the target definition
    filename, and a Markdown description containing the review summary, changed
    files, and validation result. Pass the exact `files_to_publish`,
    `review_report`, and `validation_result` inputs to the nested skill. Do not
    report completion until it returns a pull-request URL. Never merge the PR
    or push directly to main.
  uses_skill:
    skill: create-pull-request
