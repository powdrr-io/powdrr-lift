---
name: review-skill-workflow
when_to_use:
- When the user wants to review or rewrite a skill definition for directive,
  concise, consistently executable instructions.
- When the user wants to review a workflow definition or generated workflow task
  sequence for excessive tool calls, hidden substeps, or ambiguous instructions.
- When the review should produce an improved definition rather than only a prose
  critique.
steps:
- description: Resolve and read the target definition.
  llm_type: long_context
  details: >-
    Identify exactly one target skill or workflow from the user's path, name, or
    context. If the target is not an exact path, use fuzzy-match once to locate
    candidates, then ask one specific question if more than one candidate is
    plausible. Read the complete target definition with read_document. Do not
    edit it during this step. Record its goal, inputs, outputs, dependencies,
    steps or tasks, and any existing validation requirements.
  tool_invocations:
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - <skill-definitions-or-workflow-root>
    - -name
    - <target-name>
    - -type
    - f
    - -print
- description: Inventory every target step and its execution surface.
  llm_type: standard_reasoning
  details: >-
    Create one row per target step or task. Preserve source order and quote the
    description and English instructions. For each row count explicit
    tool_invocations, uses_skills or nested workflow calls, and distinct action
    clauses in the English instructions. Count an action clause whenever the
    text tells the LLM to inspect, decide, edit, invoke, validate, record, ask,
    or report; count conditional branches separately. Mark whether every tool
    call has a concrete purpose, complete arguments or placeholders, timing,
    expected result, and failure or retry rule. Treat a tool command plus an
    unmentioned follow-up command as separate calls. Do not infer missing
    instructions from repository conventions.
- description: Score directive quality and identify scope-preserving rewrites.
  llm_type: high_reasoning
  details: >-
    Review each inventory row against four gates: tool economy, substep
    economy, invocation specificity, and goal fidelity. Prefer zero tool calls
    for reasoning-only steps and one tool call for an atomic operation. Flag
    every step with more than one independent tool call, more than three action
    clauses, vague verbs, mixed decisions and execution, repeated context,
    missing inputs or outputs, unbounded retry language, or a tool call whose
    arguments and success condition are not explicit. Distinguish a real
    prerequisite from unnecessary orchestration. Do not remove a required
    validation or evidence check merely to lower a count. For each finding,
    state the smallest safe change and the requirement it preserves.
- description: Draft concise, directive replacement steps.
  llm_type: high_reasoning
  details: >-
    Rewrite only steps that fail a gate. Keep the original goal, required
    evidence, dependencies, safety constraints, and output. Give each rewritten
    step one observable outcome and at most one tool invocation. Use imperative
    sentences with explicit inputs, exact command arguments or placeholders,
    expected result, and one bounded correction rule. Move rationale and
    background out of execution instructions. Do not combine unrelated actions
    into a single step and do not invent a tool, file, field, or dependency.
    Present original text, proposed text, tool count, action-clause count, and
    preserved requirements for every rewrite.
- description: Obtain an independent adversarial completeness review.
  llm_type: high_reasoning
  details: >-
    Invoke the independent-skill-workflow-review skill with provider_role
    adversarial and clean=true. Pass the target goal, original step text,
    proposed replacement text, preserved-requirement list, and inventory counts.
    Ask it to compare the rewrite with the original without seeing this skill's
    findings or preferred answer. Require it to identify omitted goals,
    dependencies, safety checks, outputs, hidden tool calls, or instructions
    that remain ambiguous. Do not edit the target while the independent review
    is running.
- description: Reconcile feedback and iterate until the rewrite is complete.
  llm_type: high_reasoning
  details: >-
    Compare the independent review with the original inventory. Restore every
    requirement the independent reviewer proves was omitted, then shorten or
    split the replacement without increasing unnecessary tool calls. Repeat the
    independent review for any changed step; do not proceed while an actionable
    omission or ambiguity remains. Stop only when every changed step has zero or
    one tool call, no more than three action clauses unless justified, explicit
    invocation instructions, and a complete preserved-requirement list.
- description: Apply and validate the accepted definition.
  llm_type: fast_iteration
  details: >-
    Apply the accepted rewrites to the target definition with the appropriate
    structured edit. Preserve unrelated steps and formatting. Validate the
    complete skill or workflow definition once after editing. If validation
    fails, correct the target and rerun validation only after a change; never
    repeat the same validation command unchanged. Report the final per-step
    counts, remaining justified exceptions, validation result, and exact file
    changed.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate
    - <target-definition-path>
