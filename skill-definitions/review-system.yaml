---
name: review-system
when_to_use:
- When new needs may require updating the current system specification.
- When the TUI should evaluate whether the system requirements and approach still
  fit.
steps:
- description: Gather the requirements and approach context.
  step_type: freeform
  prompt_catalogs: [context_types]
  llm_type: simple_task
  details: Use the requirements and approach context to understand the new needs before
    judging the system specification.
- description: Decide whether the current system specification needs to change.
  step_type: freeform
  llm_type: high_reasoning
  details: Compare the gathered requirements and approach against the new needs. If
    the existing spec already covers them, report that no update is needed and stop.
- description: Generate and fill the system specification template only when changes
    are required.
  step_type: freeform
  llm_type: standard_reasoning
  details: >-
    Run the system specification command, then fill the generated template with
    the required updates. Use the first-class `yaml_edit` action directly for
    edits; never route `powdrr-lift yaml-edit` through `invoke_tool`, `tool:
    internal`, or `tool: shell`. For example:
    {"action":"yaml_edit","file_path":"docs/proposals/<work-item-name>/system-specification.yaml","operations":[{"op":"set_value","path":["title"],"value":"Updated title"}]}.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - system-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: Validate the updated system specification and confirm it is still consistent.
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Invoke the generic evaluator exactly once after the specification
    edits. If it succeeds, use its result to confirm that no inconsistencies
    remain and choose `next_step` immediately. If it reports validation errors,
    use the first-class `yaml_edit` action to address them before invoking the
    validator again; never route YAML edits through `invoke_tool` or repeat the
    same validation command unchanged. For example:
    {"action":"yaml_edit","file_path":"docs/proposals/<work-item-name>/system-specification.yaml","operations":[{"op":"upsert_item","section":"requirements","id":"requirement-id","value":{"description":"...","state":"added"}}]}.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate
    - docs/proposals/<work-item-name>/system-specification.yaml
