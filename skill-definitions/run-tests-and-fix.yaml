---
name: run-tests-and-fix
when_to_use:
- When implementation and generated tests are present and the complete test suite must pass.
- When test failures require focused edits followed by deterministic reruns.
steps:
- id: run-all-tests
  description: Run the complete test suite and preserve its raw tool result.
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    The pre-step has already run the complete test suite. Do not run it again,
    inspect files, or diagnose failures in this step. Preserve the exact shell
    tool result so the following deterministic enrich step can consume it.
    Return next_step with a concise statement that the test result is ready.
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - uv
      - run
      - --extra
      - dev
      - pytest
      - -q
- id: enrich-test-results
  description: Convert the preceding test tool result into structured failure data.
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    The pre-step deterministically calls the intrinsic enrich tool. It receives
    the exact result from run-all-tests through the previous_tool_output wiring
    shown below. Do not run pytest, call enrich yourself, inspect files, or
    reconstruct the result. Return next_step after confirming that the
    structured result is ready for diagnosis. The enriched result is available
    to the next step as the latest deterministic tool result, under output.
  pre_step:
    action: invoke_tool
    template:
      tool: enrich
      format: pytest
      tool_output:
        source: previous_tool_output
  outputs:
  - name: test_result
    type: any
    required_for_next_step: true
- id: diagnose-test-results
  description: Produce a traceback-supported diagnosis from the structured test result.
  step_type: freeform
  inputs:
  - name: test_result
    type: any
    required: true
  llm_type: high_reasoning
  details: >-
    Use the structured output from the deterministic enrich step as the
    authoritative test result. Do not run tests or shell commands, call enrich,
    or rediscover the failure by parsing raw output. If status is passed, or
    the result identifies an environment failure, produce empty root_causes.
    Otherwise explain every failure using its node_id, exception, message,
    traceback_file, traceback_line, and source_files. List only exact files
    requiring changes and give one focused repair strategy per root cause. Never
    weaken or delete tests to conceal a defect. Return next_step with exactly:
    {"action":"next_step","outputs":{"test_diagnosis":{"classification":"product_or_test_failure","failing_tests":["tests/test_example.py::test_case"],"root_causes":[{"cause":"Explain the traceback-supported cause.","files_to_change":["src/example.py"],"repair_strategy":"Make one focused correction."}]}},"decisions_and_context":"Produced a traceback-supported diagnosis from the deterministic enriched test result."}
  outputs:
  - name: test_diagnosis
    type: any
    required_for_next_step: true
- id: repair-test-failures
  description: Apply the diagnosed focused repair and record evidence.
  step_type: freeform
  inputs:
  - name: test_diagnosis
    type: any
    required: true
  llm_type: standard_reasoning
  details: >-
    Use only the test_diagnosis handoff. If classification is passing or
    environment_or_infrastructure_failure, make no edit and return the
    no-change repair evidence shown below. Otherwise make the smallest complete
    correction for every listed root cause, and edit only files listed in
    root_causes[*].files_to_change. Use the edit action with exact line ranges.
    Do not run tests in this step; the deterministic rerun gate is authoritative.
    Never weaken or delete a failing test to conceal a product defect. If the
    diagnosis is incomplete, contradictory, or names no approved file, return
    complete with an explicit blocked explanation rather than guessing.
    Before advancing, verify that each diagnosed product root cause has a
    concrete edit and return next_step with exactly this shape:
    {"action":"next_step","outputs":{"repair_evidence":{"status":"repaired","changed_files":["src/example.py"],"root_causes_addressed":["Explain which diagnosis item was fixed."],"repair_summary":"Describe the focused correction."}},"decisions_and_context":"Applied a focused repair; the deterministic rerun gate must verify it."}
    For a passing or environment diagnosis, return exactly:
    {"action":"next_step","outputs":{"repair_evidence":{"status":"no_repair_needed","changed_files":[],"root_causes_addressed":[],"repair_summary":"The complete suite already passed or cannot run because of the environment."}},"decisions_and_context":"No files were changed because no product repair was required."}
    The changed_files list must contain only files actually changed by this
    step. A narrative claim without an edit is not repair evidence. If the
    correct fix requires multiple files, edit all of them and list all of them.
  outputs:
  - name: repair_evidence
    type: any
    required_for_next_step: true
- id: rerun-all-tests
  description: Rerun the complete suite after the focused repair.
  step_type: gate
  llm_type: simple_task
  details: >-
    This pre-step is the only authoritative proof that the repair made
    progress. If it passes, the skill is complete. If it fails, return to
    diagnose-test-results with the new deterministic result. Never advance based
    on repair_evidence alone. After a correction, every test is rerun, including
    tests that passed before. An empty or unchanged repair is not progress.
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - uv
      - run
      - --extra
      - dev
      - pytest
      - -q
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: diagnose-test-results
    retry_context: >-
      The repaired complete suite still failed. Use the new deterministic
      enriched result, identify remaining or regressed failures, and choose a
      materially different focused repair. Do not repeat the previous edit
      unchanged. If the same fingerprint remains, revise the root-cause
      diagnosis before editing.
