---
name: security-review
interaction_style: devils_advocate
when_to_use:
- When the user asks for a security review of a referenced pull request.
- When a pull request changes authentication, authorization, data handling, dependencies, deployment, integrations, or security-sensitive behavior.
- When security findings must be reported directly on GitHub as inline pull-request comments.
steps:
- description: Discover the pull request, feature scope, and security-relevant change surface.
  actions: [invoke_tool, edit, yaml_edit, read_document, prompt_user, next_step]
  step_type: freeform
  prompt_catalogs: [context_types]
  llm_type: long_context
  details: >-
    Inspect the referenced PR's title, body, labels, commits, complete diff,
    changed files, review history, base/head SHA, and current state with the
    connected GitHub repository. Identify the feature, system component, entry
    points, data stores, external services, privileged operations, and related
    proposed PRs. If a feature specification exists, resolve its ordered
    proposed-PR list and use the feature definition, architecture, system,
    implementation, and relevant previous PRs to establish scope. Invoke the
    gather_context action for requirements, entities, entity-relationships,
    features, decisions, risks, and proposed_prs filtered by the feature id
    when one is known. Treat structured repository specifications as
    authoritative and record missing security context as a review gap.
  tool_invocations:
  - tool: gh
    command:
    - pr
    - view
    - <pr-reference>
    - --json
    - number,title,body,baseRefName,headRefName,headRefOid,state,isDraft,labels,files,commits,reviews
  - tool: gh
    command:
    - pr
    - diff
    - <pr-reference>
    - --patch
- description: Build a threat model for the changed behavior.
  actions: [invoke_tool, edit, yaml_edit, read_document, prompt_user, next_step]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Use OWASP's methodology-neutral four questions: what are we working on,
    what can go wrong, what are we going to do about it, and did we do a good
    job? Identify assets and their confidentiality, integrity, and availability
    needs; actors and trust levels; authentication subjects; authorization
    boundaries; entry and exit points; data flows; storage; external
    dependencies; and privileged operations. Enumerate abuse cases using
    STRIDE or another explicit method, including unauthorized access,
    impersonation, tampering, data disclosure, replay, resource exhaustion,
    malicious configuration, and supply-chain compromise. Record assumptions,
    threats, existing controls, required mitigations, and evidence needed to
    validate each mitigation. Do not assume an internal caller, hidden route,
    trusted database, or successful input is safe without code or configuration
    evidence.
  tool_invocations:
  - tool: shell
    command:
    - rg
    - -n
    - -i
    - "auth|permission|role|scope|token|secret|password|credential|encrypt|decrypt|upload|download|deserialize|subprocess|shell|eval|exec|url|redirect|sql|query|template|cookie|session|cors|csrf|rate.limit|audit|log"
    - <changed-files-or-repository>
- description: Review identity, access control, and session boundaries.
  actions: [edit, yaml_edit, file_management, read_document, prompt_user, next_step]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Check authentication flows, token and session lifecycle, password or key
    handling, MFA or recovery behavior, issuer/audience/expiry/nonce checks,
    logout and revocation, impersonation, replay resistance, and fail-closed
    behavior. For every endpoint, command, job, resolver, file, object, and
    administrative operation, verify server-side authorization at the actual
    resource boundary, tenant isolation, least privilege, object ownership,
    role/scope checks, and protection against IDOR/BOLA and privilege
    escalation. Check default identities, service accounts, background jobs,
    webhooks, and internal APIs as attacker-reachable unless proven otherwise.
    Require negative tests for unauthenticated, cross-user, cross-tenant, and
    insufficient-privilege cases where applicable.
- description: Review input, output, and execution safety.
  actions: [edit, yaml_edit, file_management, read_document, prompt_user, next_step]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Trace every untrusted source, including HTTP parameters and headers,
    cookies, files, URLs, messages, environment values, database content,
    generated content, and upstream API responses. Verify canonicalization,
    allowlist validation, size and complexity limits, parser safety, type and
    encoding handling, and rejection on validation failure. Check SQL/NoSQL,
    OS-command, template, expression, path, LDAP, XML, regular-expression,
    SSRF, header, CRLF, XSS, and deserialization injection boundaries. Verify
    context-appropriate output encoding, safe redirects, safe file handling,
    archive limits, and that error paths cannot turn data into executable
    input. Look for unsafe dynamic evaluation, shell construction, format
    strings, and confused-deputy behavior.
- description: Review cryptography, secrets, privacy, and data lifecycle.
  actions: [edit, yaml_edit, file_management, read_document, prompt_user, next_step]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Check that cryptography uses approved, authenticated algorithms and safe
    key sizes, modes, randomness, key storage, rotation, separation, and
    failure handling. Reject custom crypto, hard-coded keys, weak hashes,
    plaintext credentials, tokens in URLs, and secrets in source, logs,
    artifacts, fixtures, or error messages. Trace sensitive data at collection,
    processing, transit, storage, caching, backup, export, and deletion. Check
    minimization, tenant separation, retention, masking, access logging, TLS
    validation, certificate handling, and whether analytics or third-party
    integrations receive more data than intended.
- description: Review configuration, dependencies, and supply-chain controls.
  actions: [invoke_tool, edit, yaml_edit, read_document, prompt_user, next_step]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Check secure defaults, production configuration, debug behavior, CORS,
    CSRF, security headers, cookie flags, TLS, error exposure, network
    exposure, admin interfaces, feature flags, and fail-open behavior. Inspect
    dependency manifests and lockfiles for new or changed packages, pinning,
    provenance, transitive risk, vulnerable versions, install scripts, and
    untrusted generated artifacts. Check CI workflows, action versions,
    permissions, fork/PR secrets exposure, artifact publication, release
    signing, update mechanisms, and whether untrusted input can influence the
    build or deployment. Do not mark a dependency safe solely because a scan
    is green; assess how the code uses it.
  tool_invocations:
  - tool: shell
    command:
    - git
    - diff
    - --name-only
    - <base-sha>
    - <head-sha>
- description: Review resilience, observability, and security test evidence.
  actions: [invoke_tool, edit, yaml_edit, read_document, prompt_user, next_step]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Check denial-of-service surfaces: unbounded input, expensive parsing or
    regexes, fan-out, concurrency, retries, queues, uploads, decompression,
    pagination, and rate limits. Check race conditions, replay, idempotency,
    atomicity, quota enforcement, timeouts, cancellation, and resource cleanup.
    Verify that security events are logged with useful non-sensitive context,
    correlated, monitored, and protected from injection or tampering, while
    secrets and personal data are not logged. Review security regression tests,
    abuse-case tests, authorization matrix tests, dependency scans, static or
    dynamic analysis, and deployment checks. A missing test is a finding when
    the security control is otherwise unverified or the changed risk requires
    a regression test.
  tool_invocations:
  - tool: ref
    label: security
  - tool: ref
    label: security-review
- description: Evaluate findings against current OWASP guidance and severity.
  actions: [invoke_tool, edit, yaml_edit, read_document, prompt_user, next_step]
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Use OWASP ASVS 5.0.0 as the detailed verification baseline and cite the
    versioned requirement when applicable. Use OWASP Top 10:2025 as a risk
    taxonomy, not as a completeness checklist: A01 Broken Access Control, A02
    Security Misconfiguration, A03 Software Supply Chain Failures, A04
    Cryptographic Failures, A05 Injection, A06 Insecure Design, A07
    Authentication Failures, A08 Software or Data Integrity Failures, A09
    Security Logging and Alerting Failures, and A10 Mishandling of Exceptional
    Conditions. For each candidate finding record evidence, attack precondition,
    exploit path, impacted asset, confidentiality/integrity/availability or
    privacy impact, likelihood, severity, and whether the current PR caused or
    exposed it. Do not report speculative concerns without a plausible path and
    local evidence. Avoid duplicate findings for one root cause.
  tool_invocations:
  - tool: shell
    command:
    - curl
    - -sS
    - https://owasp.org/www-project-application-security-verification-standard/
  - tool: shell
    command:
    - curl
    - -sS
    - https://owasp.org/Top10/
  - tool: shell
    command:
    - curl
    - -sS
    - https://owasp.org/www-project-threat-modeling/
- description: Post actionable security findings as inline pull-request comments.
  actions: [invoke_tool, edit, yaml_edit, read_document, prompt_user, next_step]
  step_type: freeform
  llm_type: simple_task
  details: >-
    Check existing unresolved review threads before posting. Post every
    actionable finding directly to the PR as an inline comment anchored to the
    smallest relevant changed line. Each comment must state severity, the
    security property violated, concrete local evidence, a plausible attack
    path and impact, and a specific remediation or test. Use blocking/high
    severity only for issues that can materially enable compromise, data loss,
    privilege escalation, or unacceptable exposure; use lower severity for
    defense-in-depth gaps. If the vulnerable code is not changed, anchor to the
    nearest relevant changed line and explain why the current PR exposes or
    worsens the risk. Do not post generic OWASP summaries, praise, duplicates,
    or speculative concerns. Do not approve, merge, close, label, or modify
    code as part of this skill.
  tool_invocations:
  - tool: shell
    command:
    - gh
    - api
    - repos/<owner>/<repo>/pulls/<number>/comments
    - --paginate
  - tool: shell
    command:
    - gh
    - api
    - repos/<owner>/<repo>/pulls/<number>/comments
    - --method
    - POST
    - -f
    - body=<finding>
    - -f
    - commit_id=<current-head-sha>
    - -f
    - path=<changed-file>
    - -F
    - line=<changed-line>
    - -f
    - side=RIGHT
- description: Verify the security review and report residual risk.
  actions: [invoke_tool, edit, yaml_edit, read_document, prompt_user, next_step]
  step_type: freeform
  llm_type: standard_reasoning
  details: >-
    Confirm every intended finding is posted to the current PR diff, each
    anchor is valid, and no finding exists only in a draft or summary. Keep an
    audit record of the scope, threat model, checklist coverage, evidence,
    OWASP references, findings, unresolved assumptions, and residual risks.
    Report the PR, number and severity of inline findings, checks performed,
    and any areas that could not be verified. If GitHub write access is
    unavailable, do not claim completion; report the exact prepared findings
    and posting failure.
  tool_invocations:
  - tool: shell
    command:
    - gh
    - api
    - repos/<owner>/<repo>/pulls/<number>/comments
    - --paginate
