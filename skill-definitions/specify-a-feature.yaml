---
name: specify-a-feature
when_to_use:
- When the user needs a concrete feature plan.
- When the flow must gather context and drive implementation.
steps:
- description: Capture the feature name, goal, and success criteria.
  llm_type: high_reasoning
  details: Choose a stable kebab-case feature name and ask about outcomes, edge cases, tests, and constraints. Reuse this exact feature name as the work-item name for every generated document.
- description: Generate the system template and fill it out.
  llm_type: simple_task
  details: Fill the system template before review.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - system-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: Review the system context before deciding the feature shape.
  llm_type: high_reasoning
  details: Confirm requirements, approach, and constraints after fill.
  uses_skills:
  - review-system
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate-system-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: Generate the architecture template and fill it out.
  llm_type: simple_task
  details: Capture the entity model before review.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - architecture-specification
    - "--work-item-name"
    - "<work-item-name>"
    - "--entity-type"
    - "<type>"
- description: Review architecture before implementation.
  llm_type: high_reasoning
  details: Confirm model, relationships, invariants, and guidance after fill.
  uses_skills:
  - review-architecture
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate-architecture-specification
    - "--work-item-name"
    - "<work-item-name>"
    - "--entity-type"
    - "<type>"
- description: Generate the implementation template and fill it out.
  llm_type: simple_task
  details: Complete the template with decisions and reasoning.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - implementation-specification
    - "--work-item-name"
    - "<work-item-name>"
  - tool: internal
    command:
    - powdrr-lift
    - evaluate-implementation-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: Decide on proposed PRs and fill each template.
  llm_type: high_reasoning
  details: Fill PR templates with intent, criteria, tests, and risks.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - pr-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: Prompt the user to review the result.
  llm_type: standard_reasoning
  details: Show the draft plan and confirm it still matches.
- description: Incorporate the user's approved feedback into the feature plan.
  llm_type: high_reasoning
  details: Update the specifications and proposed PRs only when the user confirms
    a change.
- description: Validate every generated specification before implementation.
  llm_type: fast_iteration
  details: Run every validation command below in order. If any command fails, fix
    the reported issue and restart this validation step; advance only when all three
    validated documents agree.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate-system-specification
    - "--work-item-name"
    - "<work-item-name>"
  - tool: internal
    command:
    - powdrr-lift
    - evaluate-architecture-specification
    - "--work-item-name"
    - "<work-item-name>"
    - "--entity-type"
    - "<type>"
  - tool: internal
    command:
    - powdrr-lift
    - evaluate-implementation-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: If any specification validation fails, fix it and return to the validation
    step.
  llm_type: fast_iteration
  details: Do not begin implementation or create a pull request while any required
    specification remains invalid.
- description: Stage the validated specification artifacts for pull request preparation.
  llm_type: simple_task
  details: Inspect the worktree and stage only the validated specification
    artifacts under docs/proposals/<work-item-name>/. Do not commit or create the
    pull request yet.
  tool_invocations:
  - tool: shell
    command:
    - git
    - status
    - "--short"
  - tool: shell
    command:
    - git
    - add
    - docs/proposals/<work-item-name>
- description: Run finish-pr-prep before creating the pull request.
  llm_type: fast_iteration
  details: Run finish-pr-prep after the intended specification artifacts are staged.
    If cleanup changes files, restage only the validated specification artifacts
    before continuing. Do not begin implementation in this skill.
  uses_skills:
  - finish-pr-prep
- description: Create or update the pull request for the validated feature.
  llm_type: simple_task
  details: Review the staged specification artifacts, commit them, and push the
    current feature branch with its upstream set. Then create or update the draft
    pull request with the validated specification documents, feature intent,
    proposed PR scope, and validation evidence. If a pull request already exists
    for the branch, update it instead of attempting to create a second one. Do
    not report this step complete until the GitHub command succeeds and its output
    includes the pull request URL. Do not begin implementation in this skill.
  tool_invocations:
  - tool: shell
    command:
    - git
    - status
    - "--short"
  - tool: shell
    command:
    - git
    - commit
    - -m
    - "Add <work-item-name> feature specification"
  - tool: shell
    command:
    - git
    - push
    - -u
    - origin
    - HEAD
  - tool: shell
    command:
    - gh
    - pr
    - create
    - "--draft"
    - "--fill"
