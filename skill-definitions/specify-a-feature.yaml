---
name: specify-a-feature
when_to_use:
- When the user needs a concrete feature plan.
- When the flow must gather context and drive implementation.
steps:
- description: Capture the feature name, goal, and success criteria.
  step_type: freeform
  llm_type: high_reasoning
  details: Choose a stable kebab-case feature name and ask about outcomes, edge cases, tests, and constraints. Reuse this exact feature name as the work-item name for every generated document.
- description: Generate the system template and fill it out.
  step_type: freeform
  llm_type: simple_task
  details: >-
    First invoke the declared system-specification command successfully. Then
    fill the generated YAML using one or more yaml_edit actions; yaml_edit is a
    first-class action, not a command. Return it directly with action: yaml_edit;
    never wrap it in invoke_tool, tool: internal, tool: shell, or a
    powdrr-lift yaml-edit command. yaml_edit remains allowed even though the
    declared tool_invocations list contains only the generator command. For example:
    {"action":"yaml_edit","file_path":"docs/proposals/<work-item-name>/system-specification.yaml","operations":[{"op":"set_value","path":["title"],"value":"..."}]}.
    Never use edit or invoke_tool to rewrite the YAML file. The yaml_edit action must contain
    an operations array. Use set_value with a JSON array of mapping keys, such
    as ["title"] or ["id"], never a JSON-pointer string such as "/title".
    Use one upsert_item operation per requirement or approach item, with the
    section name, `id` field, and complete value mapping. The top-level field is
    `operations`; never use `yaml_operations` or `item_id`. Do not replace an entire
    list section with set_value. After the structural edits succeed, continue
    to the review step.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - system-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: Review the system context before deciding the feature shape.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    After the nested system review completes, invoke the system validator once
    for the current file. If it succeeds, record that the requirements,
    approach, and constraints remain valid and choose `next_step` immediately;
    rerun only after editing the file to address a reported validation error. If
    a repair is needed, use the first-class yaml_edit action directly; never
    invoke powdrr-lift yaml-edit through invoke_tool or an internal command.
    For example:
    {"action":"yaml_edit","file_path":"docs/proposals/<work-item-name>/system-specification.yaml","operations":[{"op":"upsert_item","section":"requirements","id":"requirement-id","value":{"description":"...","state":"added"}}]}.
  uses_skills:
  - review-system
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate
    - docs/proposals/<work-item-name>
- description: Generate the architecture template and fill it out.
  step_type: freeform
  llm_type: simple_task
  details: Capture the entity model before review.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - architecture-specification
    - "--work-item-name"
    - "<work-item-name>"
    - "--entity-type"
    - "<type>"
- description: Review architecture before implementation.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    After the nested architecture review completes, invoke the architecture
    validator once for the current file. If it succeeds, record that the model,
    relationships, invariants, and guidance remain valid and choose `next_step`
    immediately; rerun only after editing the file to address a reported
    validation error.
  uses_skills:
  - review-architecture
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate
    - docs/proposals/<work-item-name>
- description: Generate the implementation template and fill it out.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Invoke the implementation-specification tool once, complete the generated
    template with decisions and reasoning, then invoke its validator once. If
    validation succeeds, choose `next_step` immediately; rerun validation only
    after editing the file to address a reported error.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - implementation-specification
    - "--work-item-name"
    - "<work-item-name>"
  - tool: internal
    command:
    - powdrr-lift
    - evaluate
    - docs/proposals/<work-item-name>
- description: Decide on proposed PRs and fill each template.
  step_type: freeform
  llm_type: high_reasoning
  details: Fill PR templates with intent, criteria, tests, and risks.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - pr-specification
    - "--work-item-name"
    - "<work-item-name>"
- id: evaluate-feature-specifications
  description: Deterministically evaluate every generated specification before implementation.
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Invoke the declared evaluator exactly once for the specification directory.
    It discovers every recognized spec-v1 YAML file. Pass the complete result to
    the repair step; do not edit files here.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>
- id: repair-feature-specifications
  description: Fix every reported specification issue with yaml_edit.
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Review the deterministic evaluator result and fix every reported issue with
    yaml_edit. Each action must include the YAML file_path and a non-empty
    operations array. Use set_value with a JSON path array for scalar changes and
    upsert_item with section, id, and a complete value mapping for list entries.
    For example: {"action":"yaml_edit","file_path":"docs/proposals/<work-item-name>/system-specification.yaml","operations":[{"op":"set_value","path":["id"],"value":"system-id"},{"op":"upsert_item","section":"requirements","id":"requirement-id","value":{"description":"...","state":"added"}}]}. Repeat the repair/evaluation loop until every required spec-v1 document evaluates cleanly. Do not begin implementation or create a pull request while any required specification remains invalid.
- id: gate-feature-specifications
  description: Confirm that every generated specification evaluates cleanly.
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when the directory evaluator exits successfully with zero issues.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: evaluate-feature-specifications
    retry_context: >-
      The specification gate failed because one or more spec-v1 files still have
      validation issues. Inspect the latest evaluator result, repair the affected
      YAML with yaml_edit, and rerun deterministic evaluation before continuing.
- description: Stage the validated specification artifacts for pull request preparation.
  step_type: freeform
  llm_type: simple_task
  details: Inspect the worktree and stage only the validated specification
    artifacts under docs/proposals/<work-item-name>/. Do not commit or create the
    pull request yet.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
  - tool: shell
    command:
    - git
    - add
    - docs/proposals/<work-item-name>
- description: Run finish-pr-prep before creating the pull request.
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Run finish-pr-prep after the intended specification artifacts are staged by
    returning an invoke_skill action for the listed finish-pr-prep skill. Do not
    invoke it through the internal CLI tool. If cleanup changes files, restage
    only the validated specification artifacts before continuing. Do not begin
    implementation in this skill.
  uses_skills:
  - finish-pr-prep
- description: Create or update the pull request for the validated feature.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Invoke create-pull-request with pr-kind `feature`, commit message `Add
    <work-item-name> feature specification`, and pull-request title
    `<pull-request-title>`. Pass a `files_to_publish` context list containing
    every validated specification document, along with the validated
    specification documents and feature intent. The nested skill must stage
    exactly that list. Do not begin implementation in this skill.
  uses_skills:
  - create-pull-request
