---
name: specify-a-feature
when_to_use:
- When the user needs a concrete feature plan.
- When the flow must gather context and drive implementation.
steps:
- id: capture-feature-name
  description: Capture the feature name.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Choose a stable kebab-case feature name and reuse this exact name as the
    work-item name for every generated document. For example, name a request
    to record human and LLM interactions in a file `interaction-file-log`.
    If the name is unclear, ask: "What short kebab-case name should identify
    this feature in its specification files?"
  outputs:
  - name: work_item_name
    type: string
    required_for_next_step: true
- id: capture-feature-context
  description: Capture the feature goal and success criteria.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Ask the user about outcomes, edge cases, tests, and constraints for the
    named feature. For example: "What should interaction-file-log record,
    what should happen when logging fails, and how will we test the log?"
- id: generate-system-specification
  description: Generate the system specification template.
  step_type: invoke_tool
  llm_type: simple_task
  details: Invoke the declared system-specification generator exactly once; do not edit the generated file.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - system-specification
      - "--work-item-name"
      - "<work-item-name>"
- id: fill-system-specification
  description: Fill the system requirements and approach.
  step_type: freeform
  llm_type: standard_reasoning
  details: >-
    Use yaml_edit to fill the generated YAML with the feature's requirements
    and approach; do not invoke tools or rewrite the YAML as prose, then choose
    next_step. For example, add a requirement describing durable interaction
    records and an approach describing the log writer.
- id: review-system-context
  description: Review the system context before deciding the feature shape.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Run the nested system review skill and use its result to decide whether the
    current system context remains appropriate.
  uses_skills:
  - review-system
- id: evaluate-system-specification
  description: Gate the filled system specification.
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when the system evaluator reports zero issues.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>/system-specification.yaml
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: repair-feature-specifications
    retry_context: >-
      System evaluation reported issues. Repair the affected YAML with yaml_edit,
      then rerun the complete specification evaluation gate.
- id: generate-architecture-specification
  description: Generate the architecture specification template.
  step_type: invoke_tool
  llm_type: simple_task
  details: Invoke the declared architecture-specification generator exactly once with all entity types; do not edit the generated file.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - architecture-specification
      - "--work-item-name"
      - "<work-item-name>"
      - "--all-entity-types"
- id: fill-architecture-specification
  description: Fill the architecture entities and relationships.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Use yaml_edit to capture the entity model before review; do not invoke tools
    or rewrite the YAML as prose, then choose next_step. Keep the model small:
    for example, define `related-photo` and `gallery-photo` entities plus one
    `groups_with` relationship, and add invariants or guidance only when they
    constrain those entities or that relationship.
- id: review-architecture-context
  description: Review architecture before implementation.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Run the nested architecture review skill and use its result to decide
    whether the current architecture remains appropriate.
  uses_skills:
  - review-architecture
- id: evaluate-architecture-specification
  description: Gate the filled architecture specification.
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when the architecture evaluator reports zero issues.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>/architecture-specification.yaml
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: repair-feature-specifications
    retry_context: >-
      Architecture evaluation reported issues. Repair the affected YAML with
      yaml_edit, then rerun the complete specification evaluation gate.
- id: generate-implementation-specification
  description: Generate the implementation specification template.
  step_type: invoke_tool
  llm_type: simple_task
  details: Invoke the declared implementation-specification generator exactly once; do not edit the generated file.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - implementation-specification
      - "--work-item-name"
      - "<work-item-name>"
- id: fill-implementation-specification
  description: Fill the implementation features and decisions.
  step_type: freeform
  llm_type: standard_reasoning
  details: Use yaml_edit to complete the generated implementation template; do not invoke tools or rewrite the YAML as prose, then choose next_step.
- id: evaluate-implementation-specification
  description: Gate the filled implementation specification.
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when the implementation evaluator reports zero issues.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>/implementation-specification.yaml
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: repair-feature-specifications
    retry_context: >-
      Implementation evaluation reported issues. Repair the affected YAML with
      yaml_edit, then rerun the complete specification evaluation gate.
- id: generate-pr-specification
  description: Generate the proposed PR specification template.
  step_type: invoke_tool
  llm_type: simple_task
  details: Invoke the declared pr-specification generator exactly once; do not edit the generated file.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - pr-specification
      - "--work-item-name"
      - "<work-item-name>"
- id: fill-pr-specification
  description: Fill the proposed PR specification template.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Fill the generated PR template with intent, criteria, tests, and risks using
    yaml_edit. Do not invoke tools in this step; after the YAML edit choose
    next_step and let the later deterministic evaluation step validate the file.
- id: evaluate-feature-specifications
  description: Deterministically evaluate every generated specification before implementation.
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Invoke the declared evaluator exactly once for the specification directory.
    It discovers every recognized spec-v1 YAML file. Pass the complete result to
    the repair step; do not edit files here.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>
- id: repair-feature-specifications
  description: Fix every reported specification issue with yaml_edit.
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Review the deterministic evaluator result and fix every reported issue with
    yaml_edit. Each action must include the YAML file_path and a non-empty
    operations array. Use set_value with a JSON path array for scalar changes and
    upsert_item with section, id, and a complete value mapping for list entries.
    For example: {"action":"yaml_edit","file_path":"docs/proposals/<work-item-name>/system-specification.yaml","operations":[{"op":"set_value","path":["id"],"value":"system-id"},{"op":"upsert_item","section":"requirements","id":"requirement-id","value":{"description":"...","state":"added"}}]}. Repeat the repair/evaluation loop until every required spec-v1 document evaluates cleanly. Do not begin implementation or create a pull request while any required specification remains invalid. Do not use gather_context or invoke_tool in this repair step; the evaluator result is the authoritative issue context and the next gate reruns the deterministic evaluator. If an exact existing id is needed, use read_document, then apply yaml_edit without guessing.
- id: gate-feature-specifications
  description: Confirm that every generated specification evaluates cleanly.
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when the directory evaluator exits successfully with zero issues.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: evaluate-feature-specifications
    retry_context: >-
      The specification gate failed because one or more spec-v1 files still have
      validation issues. Inspect the latest evaluator result, repair the affected
      YAML with yaml_edit, and rerun deterministic evaluation before continuing.
- id: stage-specification-artifacts
  description: Stage the validated specification artifacts for pull request preparation.
  step_type: freeform
  llm_type: simple_task
  details: Inspect the worktree and stage only the validated specification
    artifacts under docs/proposals/<work-item-name>/. Do not commit or create the
    pull request yet.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
  - tool: shell
    command:
    - git
    - add
    - docs/proposals/<work-item-name>
- id: prepare-pull-request
  description: Run finish-pr-prep before creating the pull request.
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Run finish-pr-prep after the intended specification artifacts are staged by
    returning an invoke_skill action for the listed finish-pr-prep skill. Do not
    invoke it through the internal CLI tool. If cleanup changes files, restage
    only the validated specification artifacts before continuing. Do not begin
    implementation in this skill.
  uses_skills:
  - finish-pr-prep
- id: create-feature-pull-request
  description: Create or update the pull request for the validated feature.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Invoke create-pull-request with pr-kind `feature`, commit message `Add
    <work-item-name> feature specification`, and pull-request title
    `<pull-request-title>`. Pass a `files_to_publish` context list containing
    every validated specification document, along with the validated
    specification documents and feature intent. The nested skill must stage
    exactly that list. Do not begin implementation in this skill.
  uses_skills:
  - create-pull-request
