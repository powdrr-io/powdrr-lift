---
name: specify-a-feature
when_to_use:
- When the user needs a concrete feature plan.
- When the flow must gather context and drive implementation.
steps:
- description: Capture the feature name, goal, and success criteria.
  llm_type: high_reasoning
  details: Choose a stable kebab-case feature name and ask about outcomes, edge cases, tests, and constraints. Reuse this exact feature name as the work-item name for every generated document.
- description: Generate the system template and fill it out.
  llm_type: simple_task
  details: Fill the system template before review.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - system-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: Review the system context before deciding the feature shape.
  llm_type: high_reasoning
  details: >-
    After the nested system review completes, invoke the system validator once
    for the current file. If it succeeds, record that the requirements,
    approach, and constraints remain valid and choose `next_step` immediately;
    rerun only after editing the file to address a reported validation error.
  uses_skills:
  - review-system
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate-system-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: Generate the architecture template and fill it out.
  llm_type: simple_task
  details: Capture the entity model before review.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - architecture-specification
    - "--work-item-name"
    - "<work-item-name>"
    - "--entity-type"
    - "<type>"
- description: Review architecture before implementation.
  llm_type: high_reasoning
  details: >-
    After the nested architecture review completes, invoke the architecture
    validator once for the current file. If it succeeds, record that the model,
    relationships, invariants, and guidance remain valid and choose `next_step`
    immediately; rerun only after editing the file to address a reported
    validation error.
  uses_skills:
  - review-architecture
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate-architecture-specification
    - "--work-item-name"
    - "<work-item-name>"
    - "--entity-type"
    - "<type>"
- description: Generate the implementation template and fill it out.
  llm_type: simple_task
  details: >-
    Invoke the implementation-specification tool once, complete the generated
    template with decisions and reasoning, then invoke its validator once. If
    validation succeeds, choose `next_step` immediately; rerun validation only
    after editing the file to address a reported error.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - implementation-specification
    - "--work-item-name"
    - "<work-item-name>"
  - tool: internal
    command:
    - powdrr-lift
    - evaluate-implementation-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: Decide on proposed PRs and fill each template.
  llm_type: high_reasoning
  details: Fill PR templates with intent, criteria, tests, and risks.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - pr-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: Prompt the user to review the result.
  llm_type: standard_reasoning
  details: Show the draft plan and confirm it still matches.
- description: Incorporate the user's approved feedback into the feature plan.
  llm_type: high_reasoning
  details: Update the specifications and proposed PRs only when the user confirms
    a change.
- description: Validate every generated specification before implementation.
  llm_type: fast_iteration
  details: >-
    Run each validation command below once in order. If a command reports a
    validation error, edit the affected document before rerunning that command;
    never repeat an unchanged validation command. After all three commands
    succeed and the documents agree, record the results and choose `next_step`
    immediately.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate-system-specification
    - "--work-item-name"
    - "<work-item-name>"
  - tool: internal
    command:
    - powdrr-lift
    - evaluate-architecture-specification
    - "--work-item-name"
    - "<work-item-name>"
    - "--entity-type"
    - "<type>"
  - tool: internal
    command:
    - powdrr-lift
    - evaluate-implementation-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: If any specification validation fails, fix it and return to the validation
    step.
  llm_type: fast_iteration
  details: Do not begin implementation or create a pull request while any required
    specification remains invalid.
- description: Stage the validated specification artifacts for pull request preparation.
  llm_type: simple_task
  details: Inspect the worktree and stage only the validated specification
    artifacts under docs/proposals/<work-item-name>/. Do not commit or create the
    pull request yet.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
  - tool: shell
    command:
    - git
    - add
    - docs/proposals/<work-item-name>
- description: Run finish-pr-prep before creating the pull request.
  llm_type: fast_iteration
  details: Run finish-pr-prep after the intended specification artifacts are staged.
    If cleanup changes files, restage only the validated specification artifacts
    before continuing. Do not begin implementation in this skill.
  uses_skills:
  - finish-pr-prep
- description: Create or update the pull request for the validated feature.
  llm_type: simple_task
  details: >-
    Review the staged specification artifacts, commit them, and push the
    current feature branch with its upstream set. Then create or update the draft
    pull request by first invoking `powdrr-lift pull-request-description
    --kind feature`. Keep the generated template in workflow context; do not
    print the template or completed PR body as a chat/status response. Fill every
    section returned by that command and pass the completed text as the `--body`
    value for the `gh pr create` command. Populate every
    core section with the validated specification documents, feature intent,
    behavior before and after, explicit scope and non-goals, implementation
    details, compatibility considerations, exact validation commands and
    results, risks and mitigations, reviewer focus, dependencies, follow-up, and
    references. If a section does not apply, write Not applicable and why; never
    leave placeholders or claim an unrun check passed. If a pull request already
    exists for the branch, update its body instead of attempting to create a
    second one. Do not report this step complete until the GitHub command
    succeeds and its output includes the pull request URL. Do not begin
    implementation in this skill.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - pull-request-description
    - --kind
    - feature
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
  - tool: shell
    command:
    - git
    - commit
    - -m
    - "Add <work-item-name> feature specification"
  - tool: shell
    command:
    - git
    - push
    - -u
    - origin
    - HEAD
  - tool: shell
    command:
    - gh
    - pr
    - create
    - "--draft"
    - "--title"
    - <pull-request-title>
    - "--body"
    - <populated-pr-description>
