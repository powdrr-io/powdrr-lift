---
name: specify-architecture
when_to_use:
- When the work item already has requirements and approach and needs an architecture
  specification.
- When the TUI should guide the user through a synchronous architecture flow.
steps:
- description: Review the system context first.
  step_type: freeform-skill-invoke
  llm_type: high_reasoning
  details: Use the system review flow to confirm the requirements, approach, and current
    constraints.
  uses_skills:
  - review-system
- description: Generate the architecture specification template.
  step_type: freeform-skill-invoke
  llm_type: simple_task
  details: Generate the architecture template with the full allowed entity type set
    so validation can enforce the schema.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - architecture-specification
    - "--work-item-name"
    - "<work-item-name>"
    - "--entity-type"
    - "<type>"
- description: Fill out entities, relationships, invariants, and guidance using only
    the allowed entity types.
  step_type: freeform-skill-invoke
  llm_type: high_reasoning
  details: Keep references explicit and make sure every invariant or guidance item
    points at listed entities or relationships.
- description: Validate the filled architecture template and fix any validation errors.
  step_type: freeform-skill-invoke
  llm_type: fast_iteration
  details: >-
    Invoke the generic evaluator once for the current file. If it
    succeeds, record that there are no unknown types or broken references and
    choose `next_step` immediately. If it reports validation errors, edit the
    file to address them before invoking the validator again; never repeat the
    same validation command unchanged.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate
    - docs/proposals/<work-item-name>/architecture-specification.yaml
