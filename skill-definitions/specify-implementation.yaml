---
name: specify-implementation
when_to_use:
- When an architecture specification already exists and you need implementation detail.
- When the TUI should guide the user through a synchronous implementation flow.
steps:
- description: Review the system and architecture context first.
  prompt_catalogs: []
  llm_type: high_reasoning
  details: Confirm the source architecture id and the relevant entities before drafting
    implementation detail.
  uses_skills:
  - review-system
  - review-architecture
- description: Generate the implementation specification template.
  prompt_catalogs: []
  llm_type: simple_task
  details: Use the generated implementation template as the canonical place to capture
    feature and decision detail.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - implementation-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: Fill out the feature and decision sections so they stay aligned with
    the architecture id.
  prompt_catalogs: []
  llm_type: standard_reasoning
  details: Keep the implementation spec aligned with the source architecture version
    and do not invent new ids.
- description: Validate the filled implementation template and resolve any reported
    issues.
  prompt_catalogs: []
  llm_type: fast_iteration
  details: >-
    Invoke the generic evaluator once for the current file. If it
    succeeds, record that architecture mismatches and duplicate ids are
    resolved and choose `next_step` immediately. If it reports validation
    errors, edit the file to address them before invoking the validator again;
    never repeat the same validation command unchanged.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate
    - docs/proposals/<work-item-name>/implementation-specification.yaml
