---
name: specify-system
when_to_use:
- When you need to define the system requirements and implementation approach for
  a work item.
- When the TUI should guide the user through a synchronous requirements-and-approach
  flow.
steps:
- description: Ask for the work item name and the minimum context needed to draft
    the requirements and approach.
  step_type: freeform-skill-invoke
  llm_type: high_reasoning
  details: Collect just enough context to make the template specific without overloading
    the user with questions.
- description: Generate the system specification template.
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Invoke the declared system-specification tool exactly once. Pass its generated
    file to the next step for completion; do not edit the file in this step.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - system-specification
      - "--work-item-name"
      - "<work-item-name>"
- description: Fill out the requirements and approach sections with concise, testable
    statements.
  step_type: freeform-skill-invoke
  llm_type: standard_reasoning
  details: Keep each statement concrete enough that it can be validated against the
    work item without interpretation.
- description: Validate the filled template and resolve any reported issues.
  step_type: freeform-skill-invoke
  llm_type: fast_iteration
  details: >-
    Invoke the generic evaluator once for the current file. If it succeeds,
    record that the system specification is valid and choose `next_step`
    immediately. If it reports validation errors, edit the file to address
    them before invoking the validator again; never repeat the same validation
    command unchanged.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate
    - docs/proposals/<work-item-name>/system-specification.yaml
