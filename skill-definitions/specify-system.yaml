---
name: specify-system
when_to_use:
- When you need to define the system requirements and implementation approach for
  a work item.
- When the TUI should guide the user through a synchronous requirements-and-approach
  flow.
steps:
- id: capture-system-context
  description: Ask for the work item name and the minimum context needed to draft
    the requirements and approach.
  actions: [edit, yaml_edit, design_edit, discover_design, file_management, read_document]
  step_type: freeform
  llm_type: high_reasoning
  details: Collect just enough context to make the template specific without overloading
    the user with questions.
- id: generate-system
  description: Generate the system specification template.
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Invoke the declared system-specification tool exactly once. The generator is
    restart-safe: it overwrites an unreadable/invalid existing file and merges
    readable existing values into the fresh template while restoring all
    instructions and missing default fields. Pass its generated file to the next
    step for completion; do not edit the file in this step.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - system-specification
      - "--work-item-name"
      - "<work-item-name>"
  outputs:
  - name: system_specification_template
    type: any
    required_for_next_step: true
- id: fill-system
  description: Fill out the requirements and approach sections with concise, testable
    statements.
  actions: [edit, yaml_edit, file_management, read_document]
  step_type: freeform
  llm_type: standard_reasoning
  details: >-
    Use design_edit for updates to an existing design. Keep current-state YAML
    read-only and store an ordered operation log in
    docs/proposals/<work-item-name>/design-proposal.yaml. Operations must be
    graph-native add_node, update_node, remove_node, add_edge, update_edge, or
    remove_edge, each with a stable id. Use discover_design to expand the
    connected graph when needed, then validate the merged graph before advancing.
    Use yaml_edit only for standalone generated specification files.
- id: evaluate-system
  description: Deterministically evaluate the filled system specification.
  actions: []
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Invoke the declared evaluator exactly once for the current file and pass its
    complete result to the next step. Do not edit the file in this step.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>/system-specification.yaml
  outputs:
  - name: system_evaluation
    type: any
    required_for_next_step: true
- id: repair-system
  description: Use yaml_edit to fix every issue reported by the system evaluator.
  actions: [edit, yaml_edit, design_edit, discover_design, file_management, read_document, goto_step]
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    For an existing design, repair the proposal operation log with design_edit;
    never edit current-state YAML. Use graph-native operations and
    discover_design for missing connected context. For standalone specification
    files, use yaml_edit and let the deterministic evaluator verify the result.
    If there are no issues, choose next_step without changing the file.
- id: gate-system
  description: Confirm that system evaluation reports zero issues.
  actions: []
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when the evaluator exits successfully with zero issues.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<work-item-name>/system-specification.yaml
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: evaluate-system
    retry_context: >-
      The gate failed because system evaluation still reports issues. Inspect the
      latest evaluator result, use yaml_edit to fix every issue, and then allow
      the deterministic evaluate-system step to run again.
