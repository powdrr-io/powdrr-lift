---
name: start-implementing-feature
when_to_use:
- When the user is ready to begin implementing a feature.
- When the feature needs implementation specifications and durable execution
  workflows before implementation starts.
- When the generated planning artifacts and first task should be placed in a
  pull request for user review.
steps:
- description: Discover the feature specification and execution workflows.
  llm_type: standard_reasoning
  details: >-
    Invoke the fuzzy-match tool first to discover candidates for the feature
    specification and its execution workflows. Search docs/specs and
    docs/workflows using the feature name from the user's request. Filter the
    results to the best matching feature directory and workflow directories.
    Treat an absent search root or an empty result as "no matches", not as a
    tool failure. If exactly one feature specification is the best match, use
    it. If exactly one workflow set is the best match, use it. If the best
    match is uncertain, ask the user one specific question that identifies the
    correct feature or workflow. Do not ask whether documents exist before
    searching for them. If the matches are sufficiently certain, do not ask a
    question: pass the selected specification documents, workflow documents,
    canonical feature name, and any uncertainty or missing-document findings
    as context to the next step. The next step invokes
    bootstrap-code-structure with this feature context.
  tool_invocations:
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/specs
    - -name
    - <feature-name>
    - -type
    - d
    - -maxdepth
    - "2"
    - -print
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/workflows
    - -name
    - <feature-name>
    - -type
    - d
    - -maxdepth
    - "3"
    - -print
- description: Bootstrap the project-wide module and tool structure from codebase evidence.
  llm_type: standard_reasoning
  uses_skills:
  - bootstrap-code-structure
  details: >-
    Invoke bootstrap-code-structure using the repository context from the
    preceding discovery step. The nested skill is project-wide and must not
    ask for a feature or target module. Wait for it to complete, then confirm
    that its staged project-structure artifact is available before continuing.
  tool_invocations:
  - tool: shell
    command:
    - test
    - -f
    - docs/project_structure/project-structure.yaml
- description: Create implementation specifications for the proposed PRs.
  llm_type: high_reasoning
  details: >-
    If proposed PR specifications or implementation specifications already
    exist in the selected feature context, inspect them, reuse them, and skip
    this step. Otherwise analyze the feature specification to determine a set
    of proposed PRs that implement the feature as ordered steps with
    incremental validation, clear boundaries, and low risk. For each proposed
    PR, define its goal, implementation scope, files, tests, acceptance
    criteria, validation commands, dependencies, and risks. Then invoke the
    implementation-specification tool once for each proposed PR and fill out
    the generated template with that PR's implementation plan. Keep each PR's
    specification separate and give each one a stable proposed-PR name. Pass
    the complete set of proposed PRs and every created or reused
    implementation-specification file as context to the next step.
  tool_invocations:
  - tool: shell
    command:
    - powdrr-lift
    - implementation-specification
    - --work-item-name
    - <feature-name>
    - --output
    - docs/specs/<feature-name>/<proposed-pr-name>-implementation-specification.yaml
- description: Instantiate an execution workflow for every proposed PR.
  llm_type: simple_task
  details: >-
    If an execution workflow already exists for every proposed PR, inspect the
    matching workflow directories, reuse them, and skip this step. Otherwise
    invoke the workflow instantiation tool once for each proposed PR that does
    not already have a workflow. Before invoking it, inspect the selected
    workflow template and identify every placeholder used in task input_state.
    Resolve each placeholder from the matching proposed PR and pass every
    template-specific value explicitly with a repeated
    --template-value NAME=VALUE option. Use the fixed
    templates/execute-proposed-pr.yaml template, the canonical feature name as
    the shared work-item name, and a distinct workflow instance name derived
    from each proposed PR. Preserve the proposed-PR order and encode each
    dependency in the workflow task dependencies and input state. Never leave
    a required input_state placeholder empty. Never ask the user for a template
    path. Do not overwrite an existing workflow instance without user approval.
    Pass every created or reused workflow file and its proposed-PR relationship
    as context to the next step.
  tool_invocations:
  - tool: shell
    command:
    - powdrr-lift
    - instantiate-workflow
    - --work-item-name
    - <feature-name>
    - --workflow-instance-name
    - <proposed-pr-name>
    - --template-value
    - proposed-pr-id=<proposed-pr-name>
    - --template
    - templates/execute-proposed-pr.yaml
- description: Review and approve the implementation plan and workflows.
  llm_type: high_reasoning
  details: >-
    Present the discovered feature documents, every proposed PR
    implementation-specification, every execution workflow, and the dependency
    order to the user. Ask the user to approve the complete implementation
    plan or identify specific changes. If the user requests changes, update
    the affected specifications or workflows and review them again. Do not
    commit artifacts, create a pull request, or begin implementation until the
    user explicitly approves the PR boundaries, implementation files, tests,
    acceptance criteria, validation commands, risks, and dependency order.
    Pass the approved artifact paths and approval decision to the next step.
- description: Stage the approved artifacts for pull request preparation.
  llm_type: simple_task
  details: >-
    Only after explicit user approval, inspect the worktree and stage the
    approved implementation specifications under docs/specs/<feature-name>/ and
    execution workflows under docs/workflows/. Review the staged paths and do
    not commit or create a pull request yet.
  tool_invocations:
  - tool: shell
    command:
    - git
    - status
    - --short
  - tool: shell
    command:
    - git
    - add
    - docs/specs/<feature-name>
    - docs/workflows
- description: Run finish-pr-prep before creating the draft pull request.
  llm_type: fast_iteration
  details: >-
    Run finish-pr-prep after the approved planning artifacts are staged. If
    cleanup changes files, restage only the approved planning artifacts before
    continuing. Do not implement any proposed PR in this skill.
  uses_skills:
  - finish-pr-prep
- description: Commit the approved artifacts and open a draft pull request.
  llm_type: simple_task
  details: >-
    Review the staged planning artifacts, commit them, and push the current
    feature branch with its upstream set. Then create or update a draft pull
    request describing the feature, proposed PRs, execution workflows,
    dependencies, and validation evidence. If a pull request already exists for
    the branch, update it rather than creating a second one. Do not implement
    any proposed PR. Do not report this step complete until the GitHub command
    succeeds and its output includes the pull request URL.
  tool_invocations:
  - tool: shell
    command:
    - git
    - status
    - --short
  - tool: shell
    command:
    - git
    - commit
    - -m
    - Add <feature-name> implementation workflow
  - tool: shell
    command:
    - git
    - push
    - -u
    - origin
    - HEAD
  - tool: shell
    command:
    - gh
    - pr
    - create
    - --draft
    - --fill
- description: Hand the draft pull request to the user for review.
  llm_type: standard_reasoning
  details: >-
    Show the pull request URL. Summarize the feature specification used, every
    proposed PR implementation-specification, every execution workflow, and
    their dependency relationships. State that implementation has not begun
    and wait for the user's review and approval before any implementation work.
