---
name: start-implementing-feature
interaction_style: engineering
when_to_use:
- When the user is ready to begin implementing a feature.
- When the feature needs proposed PR planning and durable execution workflows
  before implementation starts.
- When the generated planning artifacts and first task should be placed in a
  pull request for user review.
steps:
- id: discover-proposed-feature
  description: Discover proposed feature specification candidates.
  step_type: freeform
  llm_type: standard_reasoning
  details: >-
    Invoke only the declared fuzzy-match command once for docs/proposals using
    the feature name from the user's request. Do not invoke internal, shell, or
    any other tool in this step. Treat a missing root or empty result as no
    matches; do not select the feature yet.
  tool_invocations:
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/proposals
    - -name
    - <feature-name>
    - -type
    - d
    - -maxdepth
    - "2"
    - -print
- id: discover-current-feature
  description: Discover current feature specification candidates.
  step_type: freeform
  llm_type: standard_reasoning
  details: >-
    Invoke only the declared fuzzy-match command once for docs/current using
    the feature name from the user's request. Do not invoke internal, shell, or
    any other tool in this step. Treat a missing root or empty result as no
    matches; do not select the feature yet.
  tool_invocations:
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/current
    - -name
    - <feature-name>
    - -type
    - d
    - -maxdepth
    - "2"
    - -print
- id: discover-feature-workflows
  description: Discover execution workflow candidates.
  step_type: freeform
  llm_type: standard_reasoning
  details: >-
    Invoke only the declared fuzzy-match command once for docs/workflows using
    the feature name from the user's request. Do not invoke internal, shell, or
    any other tool in this step. Treat a missing root or empty result as no
    matches; do not select the workflow yet.
  tool_invocations:
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/workflows
    - -name
    - <feature-name>
    - -type
    - d
    - -maxdepth
    - "3"
    - -print
- id: select-feature-context
  description: Select the canonical feature and workflow context.
  step_type: freeform
  llm_type: standard_reasoning
  details: >-
    Review all three deterministic search results. Filter them to the best
    matching feature directory and workflow directories. Normalize case,
    spaces, underscores, and hyphens when comparing the user's feature name to
    candidate directory names. If exactly one proposal or current-feature
    directory is the best normalized match, select it without asking and use
    that directory's basename as the canonical feature_name. A workflow
    directory is never an independent choice: its only valid path is
    docs/workflows/<canonical-feature-name>. If that directory is absent, record
    it as missing and let the later instantiation step create it; do not ask
    the user which workflow path to use. If no proposal or current-feature
    candidate is found, do not claim that a canonical feature was selected and
    do not use next_step or complete: ask one specific question identifying the
    missing feature. If the user supplies an identifier or path, use goto_step
    to rerun the relevant deterministic discovery step(s), then select from
    those results. Ask a question only when multiple normalized feature
    candidates remain tied and cannot be resolved from the user's request or
    the search results. For example:
    {"action":"prompt_user","text":"Which feature or workflow should I use from these candidates: <candidate-names>?"}
    Never ask the user to choose between a found proposal and a missing
    workflow directory.
    Do not ask whether documents exist before searching. The feature_name
    output is required for this step; emit it only when this step has actually
    selected a canonical feature. Pass the selected specification documents,
    workflow documents, canonical feature name, and missing-document findings
    to the next step.
  outputs:
  - name: feature_name
    type: string
    required_for_next_step: true
- id: bootstrap-project-structure
  description: Bootstrap the project-wide module and tool structure.
  step_type: freeform
  llm_type: standard_reasoning
  uses_skills:
  - bootstrap-code-structure
  details: Invoke bootstrap-code-structure with the selected feature context. The nested skill is project-wide and must not ask for a feature or target module.
- id: confirm-project-structure
  description: Confirm the project-structure artifact is available.
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when the project-structure artifact exists in the active worktree.
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - test
      - -f
      - docs/project_structure/project-structure.yaml
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: bootstrap-project-structure
    retry_context: >-
      The project-structure artifact is not available in the active worktree.
      Rerun bootstrap-code-structure, then retry this gate.
- id: plan-proposed-prs
  description: Plan the proposed PR implementation sequence.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    If the unified proposed-PR specification already exists in the selected
    feature context, inspect and reuse its ordered `proposed_prs` entries and
    pass their stable names and paths onward. Otherwise analyze the feature
    context and the project structure to define ordered proposed PRs
    with incremental validation, clear boundaries, low risk, dependencies, and
    stable names in one proposed-pr-specification.yaml file. For each proposed
    PR, record its goal, scope, files, tests, acceptance criteria, validation
    commands, dependencies, and risks. Record every action-bearing id from the
    feature-wide specification-v1 sections after the proposed_prs section,
    preserving source order and action. Label every change item with the
    proposed_pr_id that will deliver it. Use the
    read_document action to inspect templates/execute-proposed-pr.yaml; do not
    use shell commands to read the template. A proposed PR dependency means
    the predecessor workflow is complete only after its integration pull
    request is merged; completion of the predecessor's final task or creation
    of its pull request is not sufficient. Preserve these workflow-level
    dependencies in the instantiation plan. Do not generate one proposed-PR
    file per PR. Before next_step, return
    exactly one output named proposed_pr_names containing every stable proposed
    PR name. Do not rely on decisions_and_context for this handoff.
  outputs:
  - name: proposed_pr_names
    type: any
    required_for_next_step: true
- id: generate-proposed-pr-specification
  description: Generate the single proposed PR specification template.
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Invoke the declared proposed-pr-specification command exactly once for the
    selected feature. It must create or reuse exactly one feature-level file at
    docs/proposals/<feature-name>/proposed-pr-specification.yaml containing all
    proposed_prs entries in the planned order. Generate only the template; do
    not fill, validate, instantiate, stage, or commit it. Do not create one
    file per proposed PR.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - pr-specification
      - --work-item-name
      - <feature-name>
      - --output
      - docs/proposals/<feature-name>/proposed-pr-specification.yaml
- id: fill-proposed-pr-specification
  description: Fill the complete proposed PR specification.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    In docs/proposals/<feature-name>/proposed-pr-specification.yaml, replace
    every placeholder and fill every required field using the selected feature,
    project-structure, and planned
    proposed-PR context. Fill one ordered proposed_prs entry for every planned
    proposed PR in the same file. Each entry must contain only its stable id,
    intent, justification, and dependent_prs. In the feature-wide
    specification-v1 sections, list every entity/module/tool/relationship/
    feature/decision change exactly once and label it with a declared
    proposed_pr_id. Keep the generated id/action pairs exactly as provided by
    the authoritative proposal specs; only fill proposed_pr_id. Do not put
    change lists inside individual proposed PR entries.
    Remove generator
    instructions and instructional comments. Do not leave null, empty, example,
    or TODO values in required fields. Use yaml_edit for all YAML changes in
    this active worktree. Do not validate or instantiate workflows until this
    single file is fully populated.
- id: evaluate-proposed-pr-specification
  description: Evaluate the proposed PR specification deterministically.
  step_type: invoke_tool
  llm_type: simple_task
  details: Invoke the evaluator exactly once for the selected feature directory; do not edit files in this step.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<feature-name>
- id: repair-proposed-pr-specification
  description: Repair every reported proposed PR specification issue.
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Review the deterministic evaluator result and repair every reported issue in
    the single proposed-pr-specification.yaml with yaml_edit. Use the
    evaluator's corrective guidance and exact paths. Do not instantiate
    workflows, stage artifacts, request approval, or create a pull request while
    the proposed PR file is invalid. After changing the YAML, choose next_step
    so deterministic evaluation runs again; if no repair is needed, proceed to
    the validation gate.
- id: gate-proposed-pr-specification
  description: Confirm the proposed PR specification is valid.
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when the directory evaluator exits successfully with zero issues.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<feature-name>
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: repair-proposed-pr-specification
    retry_context: >-
      The proposed-PR specification gate failed. Inspect the latest evaluator
      result, repair the single proposed-pr-specification.yaml with yaml_edit, and
      rerun deterministic evaluation before continuing.
- id: plan-workflow-instantiation
  description: Plan execution workflow instantiation.
  step_type: freeform
  llm_type: simple_task
  details: >-
    For each validated proposed PR, inspect whether its matching workflow
    already exists and reuse it when present. For each missing workflow,
    inspect templates/execute-proposed-pr.yaml with read_document, resolve
    every task input_state placeholder from the matching validated proposed PR,
    and prepare the complete instantiation
    values. Use the fixed template, canonical feature name, distinct workflow
    instance names, proposed-PR order, and dependency relationships. Do not
    pass workflow dependencies manually: instantiate-workflow derives them from
    dependent_prs in the matching proposed PR specification. The resulting
    workflow state must preserve those derived dependencies so its integration
    PR must be MERGED before any task in the dependent workflow is selected.
    Do not model this only as an upstream task dependency. Never ask the user
    for a template path, leave a required placeholder empty, or overwrite an
    existing workflow without approval. Pass an invocation plan containing
    every created or reused workflow and its proposed-PR relationship onward.
- id: instantiate-execution-workflows
  description: Instantiate each missing execution workflow.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Invoke instantiate-workflow once for each missing workflow using the
    invocation plan. Use templates/execute-proposed-pr.yaml, pass every
    template-specific value with repeated --template-value NAME=VALUE options,
    Do not pass workflow dependencies manually: instantiate-workflow derives
    them from the unified proposed-PR specification. The dependency graph is
    the source of truth; do not claim dependencies were applied unless they
    are present in the persisted workflow state.
    Use the canonical feature name as the shared work-item name. The
    command must create the powdrr/<proposed-pr-id> integration branch while
    writing workflow files into this active worktree. Stop if a returned
    workflow directory is outside the active worktree. Pass every created or
    reused workflow identity onward. Relationships use semantic identifiers;
    never add file or directory pointers.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - instantiate-workflow
    - --work-item-name
    - <feature-name>
    - --workflow-instance-name
    - <proposed-pr-name>
    - --template-value
    - proposed-pr-id=<proposed-pr-name>
    - --template
    - templates/execute-proposed-pr.yaml
- id: verify-workflow-dependencies
  description: Verify workflow-level dependency metadata.
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Compare the dependency relationships in the unified proposed-PR file with every
    generated or reused <workflow-id>-workflow.yaml in
    docs/workflows/<feature-name>/. Read each workflow state document and build
    an exact table of workflow id to depends_on_workflows. Confirm that every
    proposed_pr dependent_prs predecessor appears in the matching workflow's
    depends_on_workflows list, that workflows with no planned predecessors have
    no dependency entries, and that no undeclared dependency was added. Do not
    infer dependencies from ordering, filenames, task upstream_task_ids, or
    prose. If any mismatch exists, do not stage or create a pull request; use
    goto_step with step_id `plan-workflow-instantiation` and include the exact
    workflow id, expected dependency list, actual dependency list, and file
    path. Continue only after the persisted metadata exactly matches the plan.
- id: inspect-workflow-repository-state
  description: Inspect generated workflow repository state.
  step_type: invoke_tool
  llm_type: simple_task
  details: Inspect the active repository state after workflow instantiation.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - repository-state
- id: verify-workflow-artifacts
  description: Verify workflow artifacts are in the active worktree.
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Confirm from the repository-state result that every generated workflow task
    file and <workflow-id>-workflow.yaml is under docs/workflows/ in this active
    worktree, that each integration branch is powdrr/<proposed-pr-id>, and that
    no required artifact exists only below .worktrees/. If any file is missing
    or outside the active worktree, stop and report the inconsistency; do not
    stage or create a pull request.
- id: review-workflow-proposed-pr-links
  description: Review the bidirectional workflow and proposed-PR mapping.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Build an exact mapping table from every validated proposed-PR specification
    in docs/proposals/<feature-name>/ to its execution workflow in
    docs/workflows/<feature-name>/. Confirm that every proposed PR has exactly
    one matching workflow and that every workflow has exactly one matching
    proposed PR. Match only stable proposed-PR ids and the workflow's
    proposed-pr-id metadata; do not infer matches from ordering, directory
    names, branch names, or fuzzy similarity. Check both directions explicitly:
    proposed PR -> workflow and workflow -> proposed PR. If any proposed PR is
    missing a workflow, or any workflow is missing its proposed PR, do not stage
    artifacts or continue to pull-request preparation; return to the relevant
    planning or instantiation step with the mismatch and exact paths. For
    example, return
    `{"action":"goto_step","step_id":"plan-workflow-instantiation","decisions_and_context":"Proposed PR <id> has no matching workflow at <path>."}`
    when a proposed PR has no workflow, or
    `{"action":"goto_step","step_id":"plan-proposed-prs","decisions_and_context":"Workflow <path> has no matching proposed PR."}`
    when a workflow has no proposed PR. After the mapping is complete, unique,
    and recorded in workflow context, return
    `{"action":"next_step","decisions_and_context":"Every proposed PR maps to exactly one workflow, and every workflow maps to exactly one proposed PR."}`.
- id: evaluate-workflow-artifacts
  description: Evaluate workflow tasks and relationship invariants deterministically.
  step_type: invoke_tool
  llm_type: simple_task
  details: >-
    Run the generic evaluator against files changed on the current branch. The
    evaluator is authoritative: it
    requires every task to name an existing workflow template and checks every
    relationship invariant declared by those templates. Do not replace a
    failure with a prose claim; repair the reported task, template, relationship,
    or target artifact and rerun the evaluator.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<feature-name>
- id: stage-validated-artifacts
  description: Stage the validated implementation and workflow artifacts.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Stage only docs/proposals/<feature-name>/ and docs/workflows/ with the
    intrinsic git add action, review the staged paths, and do not commit or
    create a pull request yet. Use
    {"action":"invoke_tool","tool":"git","parameters":{"operation":"add","paths":["docs/proposals/<feature-name>","docs/workflows"]}}.
  tool_invocations:
  - tool: git
    command:
    - add
    - docs/proposals/<feature-name>
    - docs/workflows
- id: verify-staged-artifacts
  description: Verify the staged artifact set.
  step_type: invoke_tool
  llm_type: simple_task
  details: Confirm that only the validated planning artifacts are staged before pull request preparation.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - repository-state
- id: prepare-feature-pull-request
  description: Run finish-pr-prep on the validated planning artifacts.
  step_type: freeform
  llm_type: fast_iteration
  details: Run finish-pr-prep after the validated planning artifacts are staged. If cleanup changes files, restage only those artifacts before continuing. Do not implement any proposed PR in this skill.
  uses_skills:
  - finish-pr-prep
- id: create-feature-pull-request
  description: Commit the validated artifacts and open a draft pull request.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Invoke create-pull-request with pr-kind `feature`, commit message `Add
    <feature-name> implementation workflow`, and pull-request title
    `<pull-request-title>`. Pass files_to_publish containing exactly every
    validated file under docs/proposals/<feature-name>/ and docs/workflows/,
    plus the validated planning artifacts and Feature Plan context. The nested
    skill must stage exactly that list. Do not advance until it has committed,
    pushed, and created or updated a pull request successfully. Never claim a
    PR is ready without a returned PR URL.
  uses_skills:
  - create-pull-request
- id: handoff-feature-pull-request
  description: Hand the draft pull request to the user for review.
  step_type: freeform
  llm_type: standard_reasoning
  details: Show the pull request URL. Summarize the selected feature, every proposed PR, every execution workflow, and their dependency relationships. State that implementation has not begun and the draft pull request is ready for review.
