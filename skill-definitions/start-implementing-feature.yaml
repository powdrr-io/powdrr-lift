---
name: start-implementing-feature
when_to_use:
- When the user is ready to begin implementing a feature.
- When the feature needs a durable implement-a-feature workflow instantiated from
  the plan before implementation starts.
- When the generated workflow and first task should be placed in a pull request for
  user review.
steps:
- description: Confirm the feature name, approved plan documents, and workflow template.
  llm_type: standard_reasoning
  details: First inspect docs/specs/<feature-name>/ using the exact feature name
    or naturally matched existing work-item name from the user's request. Reuse the canonical
    name and existing specification documents when that directory contains them;
    inspect for proposed PR specification files before asking whether any already
    exist. The workflow template is fixed at templates/execute-proposed-pr.yaml;
    use that path without asking the user. Only ask a question after inspection
    shows what is missing or available.
  tool_invocations:
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/specs/<feature-name>
    - -name
    - proposed PR specification
    - -type
    - f
    - -maxdepth
    - "1"
    - -print
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/workflows
    - -name
    - <feature-name>
    - -type
    - d
    - -maxdepth
    - "3"
    - -print
- description: Generate the proposed PR specification templates.
  llm_type: simple_task
  details: If the approved proposed PR specifications already exist under
    docs/specs/<feature-name>/, inspect and reuse them and skip generation. Otherwise,
    generate and fill the proposed PR specification templates for the approved
    feature plan. For every proposed PR, capture the implementation files, tests,
    acceptance criteria, validation commands, risks, and dependencies between PRs.
  tool_invocations:
  - tool: shell
    command:
    - powdrr-lift
    - pr-specification
    - "--work-item-name"
    - "<work-item-name>"
- description: Instantiate an execute-proposed-pr workflow for every approved PR.
  llm_type: simple_task
  details: For each approved proposed PR, first inspect docs/workflows for a
    matching existing execute workflow. If one exists, reuse it; if none exists,
    that is expected because this skill creates the workflow, so immediately
    instantiate a separate docs/workflows/<execute-work-item-name>/ workflow from
    templates/execute-proposed-pr.yaml. This is the required template; never ask the
    user to provide or choose a template path. Use a distinct execute work-item name for each
    PR, preserve the proposed PR order, and capture dependencies between PRs in the
    generated workflows' task dependencies and input state. Do not overwrite an
    existing workflow directory without user approval.
  tool_invocations:
  - tool: shell
    command:
    - powdrr-lift
    - instantiate-workflow
    - "--work-item-name"
    - "<execute-work-item-name>"
    - "--template"
    - templates/execute-proposed-pr.yaml
- description: Validate the overall implementation approach with the user.
  llm_type: high_reasoning
  details: Review every generated proposed PR specification and execute-proposed-pr
    workflow with the user. Confirm the PR boundaries, implementation files, tests,
    acceptance criteria, validation commands, risks, and dependency ordering. Update
    the artifacts when the user identifies a needed change, and do not create the
    pull request until the overall approach is approved.
- description: Commit all generated planning artifacts and open a draft pull request.
  llm_type: simple_task
  details: After the user approves the overall approach, inspect the worktree and
    stage every generated proposed PR specification under docs/specs/<feature-name>/
    and every generated execution workflow under docs/workflows/. Commit all of those
    artifacts, push the current feature branch with its upstream set, and create or
    update a draft pull request describing the proposed PRs and their execution
    workflows. If a pull request already exists for the branch, update it instead of
    attempting to create a second one. Do not report this step complete until the
    GitHub command succeeds and its output includes the pull request URL. Do not
    implement a proposed PR or merge the pull request.
  tool_invocations:
  - tool: shell
    command:
    - git
    - status
    - "--short"
  - tool: shell
    command:
    - git
    - add
    - docs/specs/<feature-name>
    - docs/workflows
  - tool: shell
    command:
    - git
    - commit
    - -m
    - "Add <feature-name> implementation workflow"
  - tool: shell
    command:
    - git
    - push
    - -u
    - origin
    - HEAD
  - tool: shell
    command:
    - gh
    - pr
    - create
    - "--draft"
    - "--fill"
- description: Hand the pull request to the user for review.
  llm_type: standard_reasoning
  details: Show the pull request URL and summarize every proposed PR specification,
    execution workflow, and dependency relationship. Wait for the user's approval
    before beginning implementation.
