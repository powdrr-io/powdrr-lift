---
name: start-implementing-feature
when_to_use:
- When the user is ready to begin implementing a feature.
- When the feature needs implementation specifications and durable execution
  workflows before implementation starts.
- When the generated planning artifacts and first task should be placed in a
  pull request for user review.
steps:
- description: Discover the feature specification and execution workflows.
  step_type: freeform-skill-invoke
  llm_type: standard_reasoning
  details: >-
    Invoke the fuzzy-match tool first to discover candidates for the feature
    specification and its execution workflows. Search docs/proposals and
    docs/current and
    docs/workflows using the feature name from the user's request. Filter the
    results to the best matching feature directory and workflow directories.
    Treat an absent search root or an empty result as "no matches", not as a
    tool failure. If exactly one feature specification is the best match, use
    it. If exactly one workflow set is the best match, use it. If the best
    match is uncertain, ask the user one specific question that identifies the
    correct feature or workflow. Do not ask whether documents exist before
    searching for them. If the matches are sufficiently certain, do not ask a
    question: pass the selected specification documents, workflow documents,
    canonical feature name, and any uncertainty or missing-document findings
    as context to the next step. The next step invokes
    bootstrap-code-structure with this feature context.
  tool_invocations:
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/proposals
    - -name
    - <feature-name>
    - -type
    - d
    - -maxdepth
    - "2"
    - -print
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/current
    - -name
    - <feature-name>
    - -type
    - d
    - -maxdepth
    - "2"
    - -print
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/workflows
    - -name
    - <feature-name>
    - -type
    - d
    - -maxdepth
    - "3"
    - -print
- description: Bootstrap the project-wide module and tool structure from codebase evidence.
  step_type: freeform-skill-invoke
  llm_type: standard_reasoning
  uses_skills:
  - bootstrap-code-structure
  details: >-
    Invoke bootstrap-code-structure using the repository context from the
    preceding discovery step. The nested skill is project-wide and must not
    ask for a feature or target module. Wait for it to complete, then confirm
    from its returned context that the staged project-structure artifact is
    available before continuing.
- description: Generate implementation specification templates for the proposed PRs.
  step_type: freeform-skill-invoke
  llm_type: high_reasoning
  details: >-
    If proposed PR specifications or implementation specifications already
    exist in the selected feature context, inspect them, reuse them, and skip
    this step. Otherwise analyze the feature specification to determine a set
    of proposed PRs that implement the feature as ordered steps with
    incremental validation, clear boundaries, and low risk. For each proposed
    PR, define its goal, implementation scope, files, tests, acceptance
    criteria, validation commands, dependencies, and risks. Invoke the
    implementation-specification tool once for each proposed PR. This step
    only generates the files; do not fill in, validate, instantiate, stage, or
    commit them. Keep each PR's specification separate and give each one a
    stable proposed-PR name. Record every generated path and its proposed-PR
    relationship for the next step.
    Use the always-available read_document action to inspect
    templates/execute-proposed-pr.yaml; do not invoke sed or another shell
    command to read the file.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - implementation-specification
    - --work-item-name
    - <feature-name>
    - --output
    - docs/proposals/<feature-name>/<proposed-pr-name>-implementation-specification.yaml
- description: Fill every generated implementation specification completely.
  step_type: freeform-skill-invoke
  llm_type: high_reasoning
  details: >-
    For each generated implementation-specification file, replace every
    placeholder and fill every required field using the selected feature,
    project-structure, and proposed-PR context. Remove all generator
    instructions and instructional comments from the resulting YAML. Do not
    leave null, empty, example, or TODO values in a required field. Keep each
    proposed PR in its own file and preserve its stable proposed-PR id. Use
    yaml_edit for edits and make all edits in this active worktree. Do not
    validate or instantiate workflows until every file is fully populated.
    Pass the exact filled paths and proposed-PR mapping to the validation step.
- description: Validate every implementation specification before creating execution workflows.
  step_type: freeform-skill-invoke
  llm_type: fast_iteration
  details: >-
    Run the single evaluate command once on the selected feature specification
    directory. It discovers every recognized spec-v1 YAML file and validates
    each file against its schema and cross-document rules. If it reports an
    error, use its corrective guidance to edit the affected document with
    yaml_edit, then rerun evaluate only after the document has changed. Do not
    instantiate workflows, stage artifacts, request approval, or create a pull
    request while any spec-v1 document is invalid. Confirm that validation
    passed for every filled implementation-specification path and record the
    successful results before continuing.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - evaluate
    - docs/proposals/<feature-name>
- description: Instantiate an execution workflow for every validated proposed PR.
  step_type: freeform-skill-invoke
  llm_type: simple_task
  details: >-
    If an execution workflow already exists for every proposed PR, inspect the
    matching workflow directories, reuse them, and skip this step. Otherwise
    invoke the workflow instantiation tool once for each validated proposed PR
    that does not already have a workflow. Before invoking it, inspect the
    selected workflow template and identify every placeholder used in task
    input_state. Resolve each placeholder from the matching validated
    proposed-PR specification and pass every template-specific value
    explicitly with a repeated --template-value NAME=VALUE option. Use the
    fixed templates/execute-proposed-pr.yaml template, the canonical feature
    name as the shared work-item name, and a distinct workflow instance name
    derived from each proposed PR. Preserve the proposed-PR order and encode
    each dependency in the workflow task dependencies and input state. Never
    leave a required input_state placeholder empty. Never ask the user for a
    template path. Do not overwrite an existing workflow instance without
    user approval. The command must create the powdrr/<proposed-pr-id>
    integration branch, while writing the generated workflow files into this
    active worktree so they are included in this PR. Treat a returned workflow
    directory outside the active worktree as an inconsistency and stop.
    Pass every created or reused workflow file and its proposed-PR relationship
    as context to the next step.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - instantiate-workflow
    - --work-item-name
    - <feature-name>
    - --workflow-instance-name
    - <proposed-pr-name>
    - --template-value
    - proposed-pr-id=<proposed-pr-name>
    - --template
    - templates/execute-proposed-pr.yaml
  - tool: internal
    command:
    - powdrr-lift
    - instantiate-workflow
    - --work-item-name
    - <feature-name>
    - --template-value
    - proposed-pr-id=<proposed-pr-name>
    - --template
    - templates/execute-proposed-pr.yaml
- description: Verify workflow artifacts are in the active worktree.
  step_type: freeform-skill-invoke
  llm_type: fast_iteration
  details: >-
    Inspect the instantiate-workflow result and the active repository state.
    Confirm that every generated workflow JSON file and .workflow-git.json is
    present under docs/workflows/ in this active worktree, that the integration
    branch is powdrr/<proposed-pr-id>, and that no required artifact exists
    only below .worktrees/. If any file is missing or the paths are outside the
    active worktree, stop and report the inconsistency; do not stage or create
    a pull request.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
- description: Stage the validated artifacts for pull request preparation.
  step_type: freeform-skill-invoke
  llm_type: simple_task
  details: >-
    Inspect the worktree and stage the validated implementation specifications
    under docs/proposals/<feature-name>/ and execution workflows under
    docs/workflows/. Review the staged paths and do not commit or create a pull
    request yet.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - repository-state
  - tool: shell
    command:
    - git
    - add
    - docs/proposals/<feature-name>
    - docs/workflows
- description: Run finish-pr-prep before creating the draft pull request.
  step_type: freeform-skill-invoke
  llm_type: fast_iteration
  details: >-
    Run finish-pr-prep after the validated planning artifacts are staged. If
    cleanup changes files, restage only the validated planning artifacts before
    continuing. Do not implement any proposed PR in this skill.
  uses_skills:
  - finish-pr-prep
- description: Commit the validated artifacts and open a draft pull request.
  step_type: freeform-skill-invoke
  llm_type: simple_task
  details: >-
    You must invoke create-pull-request with pr-kind `feature`, commit message
    `Add <feature-name> implementation workflow`, and pull-request title
    `<pull-request-title>`. Pass a `files_to_publish` context list containing
    every validated file under `docs/proposals/<feature-name>/` and
    `docs/workflows/`, plus the validated planning artifacts and Feature Plan
    context. The nested skill must stage exactly that list. Do not summarize or print a proposed PR description,
    and do not advance to the handoff step until the nested skill has actually
    committed, pushed, and created or updated a pull request successfully. If
    the nested skill reports an error, continue its corrective steps or stop
    with the error; never claim that a PR is ready without a returned PR URL.
  uses_skills:
  - create-pull-request
- description: Hand the draft pull request to the user for review.
  step_type: freeform-skill-invoke
  llm_type: standard_reasoning
  details: >-
    Show the pull request URL. Summarize the feature specification used, every
    proposed PR implementation-specification, every execution workflow, and
    their dependency relationships. State that implementation has not begun;
    the draft pull request is ready for the user's review.
