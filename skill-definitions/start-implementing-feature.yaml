---
name: start-implementing-feature
interaction_style: engineering
when_to_use:
- When the user is ready to begin implementing a feature.
- When the feature needs implementation specifications and durable execution
  workflows before implementation starts.
- When the generated planning artifacts and first task should be placed in a
  pull request for user review.
steps:
- id: discover-proposed-feature
  description: Discover proposed feature specification candidates.
  step_type: freeform
  llm_type: standard_reasoning
  details: >-
    Invoke only the declared fuzzy-match command once for docs/proposals using
    the feature name from the user's request. Do not invoke internal, shell, or
    any other tool in this step. Treat a missing root or empty result as no
    matches; do not select the feature yet.
  tool_invocations:
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/proposals
    - -name
    - <feature-name>
    - -type
    - d
    - -maxdepth
    - "2"
    - -print
- id: discover-current-feature
  description: Discover current feature specification candidates.
  step_type: freeform
  llm_type: standard_reasoning
  details: >-
    Invoke only the declared fuzzy-match command once for docs/current using
    the feature name from the user's request. Do not invoke internal, shell, or
    any other tool in this step. Treat a missing root or empty result as no
    matches; do not select the feature yet.
  tool_invocations:
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/current
    - -name
    - <feature-name>
    - -type
    - d
    - -maxdepth
    - "2"
    - -print
- id: discover-feature-workflows
  description: Discover execution workflow candidates.
  step_type: freeform
  llm_type: standard_reasoning
  details: >-
    Invoke only the declared fuzzy-match command once for docs/workflows using
    the feature name from the user's request. Do not invoke internal, shell, or
    any other tool in this step. Treat a missing root or empty result as no
    matches; do not select the workflow yet.
  tool_invocations:
  - tool: fuzzy-match
    command:
    - fuzzy-match
    - docs/workflows
    - -name
    - <feature-name>
    - -type
    - d
    - -maxdepth
    - "3"
    - -print
- id: select-feature-context
  description: Select the canonical feature and workflow context.
  step_type: freeform
  llm_type: standard_reasoning
  details: >-
    Review all three deterministic search results. Filter them to the best
    matching feature directory and workflow directories. Normalize case,
    spaces, underscores, and hyphens when comparing the user's feature name to
    candidate directory names. If exactly one proposal or current-feature
    directory is the best normalized match, select it without asking and use
    that directory's basename as the canonical feature_name. A workflow
    directory is never an independent choice: its only valid path is
    docs/workflows/<canonical-feature-name>. If that directory is absent, record
    it as missing and let the later instantiation step create it; do not ask
    the user which workflow path to use. If no proposal or current-feature
    candidate is found, do not claim that a canonical feature was selected and
    do not use next_step or complete: ask one specific question identifying the
    missing feature. If the user supplies an identifier or path, use goto_step
    to rerun the relevant deterministic discovery step(s), then select from
    those results. Ask a question only when multiple normalized feature
    candidates remain tied and cannot be resolved from the user's request or
    the search results. For example:
    {"action":"prompt_user","text":"Which feature or workflow should I use from these candidates: <candidate-names>?"}
    Never ask the user to choose between a found proposal and a missing
    workflow directory.
    Do not ask whether documents exist before searching. The feature_name
    output is required for this step; emit it only when this step has actually
    selected a canonical feature. Pass the selected specification documents,
    workflow documents, canonical feature name, and missing-document findings
    to the next step.
  outputs:
  - name: feature_name
    type: string
    required_for_next_step: true
- id: bootstrap-project-structure
  description: Bootstrap the project-wide module and tool structure.
  step_type: freeform
  llm_type: standard_reasoning
  uses_skills:
  - bootstrap-code-structure
  details: Invoke bootstrap-code-structure with the selected feature context. The nested skill is project-wide and must not ask for a feature or target module.
- id: confirm-project-structure
  description: Confirm the project-structure artifact is available.
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when the project-structure artifact exists in the active worktree.
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - test
      - -f
      - docs/project_structure/project-structure.yaml
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: bootstrap-project-structure
    retry_context: >-
      The project-structure artifact is not available in the active worktree.
      Rerun bootstrap-code-structure, then retry this gate.
- id: plan-proposed-prs
  description: Plan the proposed PR implementation sequence.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    If proposed PR specifications or implementation specifications already
    exist in the selected feature context, inspect them, reuse them, and pass
    their stable names and paths onward. Otherwise analyze the feature
    specification and the project structure to define ordered proposed PRs
    with incremental validation, clear boundaries, low risk, dependencies, and
    stable names. For each proposed PR, record its goal, scope, files, tests,
    acceptance criteria, validation commands, dependencies, and risks. Use the
    read_document action to inspect templates/execute-proposed-pr.yaml; do not
    use shell commands to read the template. A proposed PR dependency means
    the predecessor workflow is complete only after its integration pull
    request is merged; completion of the predecessor's final task or creation
    of its pull request is not sufficient. Preserve these workflow-level
    dependencies in the instantiation plan. Do not generate or edit
    implementation-specification files in this step. Before next_step, return
    exactly one output named proposed_pr_names containing every stable proposed
    PR name. Do not rely on decisions_and_context for this handoff.
  outputs:
  - name: proposed_pr_names
    type: any
    required_for_next_step: true
- id: generate-implementation-specifications
  description: Generate one implementation specification per proposed PR.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    For each name in proposed_pr_names that lacks an implementation
    specification,
    invoke the declared implementation-specification command exactly once with
    its stable proposed-PR name and output path. Reuse existing files. Generate
    only the templates; do not fill, validate, instantiate, stage, or commit
    them. Pass every generated path and proposed-PR relationship onward. Before
    next_step, return exactly one output named
    implementation_specification_paths containing every generated or reused
    path; do not repeat proposed_pr_names from the previous step and do not
    include any other output name.
  inputs:
  - name: proposed_pr_names
    type: any
    source: previous_step
  outputs:
  - name: implementation_specification_paths
    type: any
    required_for_next_step: true
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - implementation-specification
    - --work-item-name
    - <feature-name>
    - --output
    - docs/proposals/<feature-name>/<proposed-pr-name>-implementation-specification.yaml
- id: fill-implementation-specifications
  description: Fill every implementation specification.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    For each path in implementation_specification_paths, replace every
    placeholder and fill every required field using the selected feature,
    project-structure, and proposed-PR context. Remove generator instructions
    and instructional comments. Do not leave null, empty, example, or TODO
    values in required fields. Keep each proposed PR in its own file and
    preserve its stable proposed-PR id. Use yaml_edit for all YAML changes in
    this active worktree. Do not validate or instantiate workflows until every
    file is populated. Pass the exact filled paths and proposed-PR mapping
    onward.
  inputs:
  - name: implementation_specification_paths
    type: any
    source: previous_step
- id: evaluate-implementation-specifications
  description: Evaluate all implementation specifications deterministically.
  step_type: invoke_tool
  llm_type: simple_task
  details: Invoke the evaluator exactly once for the selected feature directory; do not edit files in this step.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<feature-name>
- id: repair-implementation-specifications
  description: Repair every reported implementation specification issue.
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Review the deterministic evaluator result and repair every reported issue
    with yaml_edit. Use the evaluator's corrective guidance and exact file
    paths. Do not instantiate workflows, stage artifacts, request approval, or
    create a pull request while any specification is invalid. After changing
    the affected YAML, choose next_step so the deterministic evaluation step
    runs again; if no repair is needed, proceed to the validation gate.
- id: gate-implementation-specifications
  description: Confirm all implementation specifications are valid.
  step_type: gate
  llm_type: simple_task
  details: The gate passes only when the directory evaluator exits successfully with zero issues.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - evaluate
      - docs/proposals/<feature-name>
  gate:
    outcome:
      path: returncode
      equals: 0
    goto_step: repair-implementation-specifications
    retry_context: >-
      The implementation-specification gate failed. Inspect the latest
      evaluator result, repair every affected YAML with yaml_edit, and rerun
      deterministic evaluation before continuing.
- id: plan-workflow-instantiation
  description: Plan execution workflow instantiation.
  step_type: freeform
  llm_type: simple_task
  details: >-
    For each validated proposed PR, inspect whether its matching workflow
    already exists and reuse it when present. For each missing workflow,
    inspect templates/execute-proposed-pr.yaml with read_document, resolve
    every task input_state placeholder from the matching validated
    implementation specification, and prepare the complete instantiation
    values. Use the fixed template, canonical feature name, distinct workflow
    instance names, proposed-PR order, and dependency relationships. For every
    dependent workflow, pass each predecessor workflow id with
    --depends-on-workflow. This records a workflow-level prerequisite whose
    integration PR must be MERGED before any task in the dependent workflow is
    selected. Do not model this only as an upstream task dependency. Never ask
    the user for a template path, leave a required placeholder empty, or
    overwrite an existing workflow without approval. Pass an invocation plan
    containing every created or reused workflow and its proposed-PR relationship
    onward.
- id: instantiate-execution-workflows
  description: Instantiate each missing execution workflow.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Invoke instantiate-workflow once for each missing workflow using the
    invocation plan. Use templates/execute-proposed-pr.yaml, pass every
    template-specific value with repeated --template-value NAME=VALUE options,
    and use the canonical feature name as the shared work-item name. The
    command must create the powdrr/<proposed-pr-id> integration branch while
    writing workflow files into this active worktree. Stop if a returned
    workflow directory is outside the active worktree. Pass every created or
    reused workflow path onward.
  tool_invocations:
  - tool: internal
    command:
    - powdrr-lift
    - instantiate-workflow
    - --work-item-name
    - <feature-name>
    - --workflow-instance-name
    - <proposed-pr-name>
    - --template-value
    - proposed-pr-id=<proposed-pr-name>
    - --template
    - templates/execute-proposed-pr.yaml
- id: inspect-workflow-repository-state
  description: Inspect generated workflow repository state.
  step_type: invoke_tool
  llm_type: simple_task
  details: Inspect the active repository state after workflow instantiation.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - repository-state
- id: verify-workflow-artifacts
  description: Verify workflow artifacts are in the active worktree.
  step_type: freeform
  llm_type: fast_iteration
  details: >-
    Confirm from the repository-state result that every generated workflow task
    file and <workflow-id>-workflow.yaml is under docs/workflows/ in this active
    worktree, that each integration branch is powdrr/<proposed-pr-id>, and that
    no required artifact exists only below .worktrees/. If any file is missing
    or outside the active worktree, stop and report the inconsistency; do not
    stage or create a pull request.
- id: review-workflow-proposed-pr-links
  description: Review the bidirectional workflow and proposed-PR mapping.
  step_type: freeform
  llm_type: high_reasoning
  details: >-
    Build an exact mapping table from every validated proposed-PR specification
    in docs/proposals/<feature-name>/ to its execution workflow in
    docs/workflows/<feature-name>/. Confirm that every proposed PR has exactly
    one matching workflow and that every workflow has exactly one matching
    proposed PR. Match only stable proposed-PR ids and the workflow's
    proposed-pr-id metadata; do not infer matches from ordering, directory
    names, branch names, or fuzzy similarity. Check both directions explicitly:
    proposed PR -> workflow and workflow -> proposed PR. If any proposed PR is
    missing a workflow, or any workflow is missing its proposed PR, do not stage
    artifacts or continue to pull-request preparation; return to the relevant
    planning or instantiation step with the mismatch and exact paths. For
    example, use `goto_step: plan-workflow-instantiation` when a proposed PR
    has no workflow, or `goto_step: plan-proposed-prs` when a workflow has no
    proposed PR. Continue only after the mapping is complete, unique, and
    recorded in workflow context.
- id: stage-validated-artifacts
  description: Stage the validated implementation and workflow artifacts.
  step_type: freeform
  llm_type: simple_task
  details: Stage only docs/proposals/<feature-name>/ and docs/workflows/ with the shell tool, review the staged paths, and do not commit or create a pull request yet.
  tool_invocations:
  - tool: shell
    command:
    - git
    - add
    - docs/proposals/<feature-name>
    - docs/workflows
- id: verify-staged-artifacts
  description: Verify the staged artifact set.
  step_type: invoke_tool
  llm_type: simple_task
  details: Confirm that only the validated planning artifacts are staged before pull request preparation.
  pre_step:
    action: invoke_tool
    template:
      tool: internal
      command:
      - powdrr-lift
      - repository-state
- id: prepare-feature-pull-request
  description: Run finish-pr-prep on the validated planning artifacts.
  step_type: freeform
  llm_type: fast_iteration
  details: Run finish-pr-prep after the validated planning artifacts are staged. If cleanup changes files, restage only those artifacts before continuing. Do not implement any proposed PR in this skill.
  uses_skills:
  - finish-pr-prep
- id: create-feature-pull-request
  description: Commit the validated artifacts and open a draft pull request.
  step_type: freeform
  llm_type: simple_task
  details: >-
    Invoke create-pull-request with pr-kind `feature`, commit message `Add
    <feature-name> implementation workflow`, and pull-request title
    `<pull-request-title>`. Pass files_to_publish containing exactly every
    validated file under docs/proposals/<feature-name>/ and docs/workflows/,
    plus the validated planning artifacts and Feature Plan context. The nested
    skill must stage exactly that list. Do not advance until it has committed,
    pushed, and created or updated a pull request successfully. Never claim a
    PR is ready without a returned PR URL.
  uses_skills:
  - create-pull-request
- id: handoff-feature-pull-request
  description: Hand the draft pull request to the user for review.
  step_type: freeform
  llm_type: standard_reasoning
  details: Show the pull request URL. Summarize the selected feature specification, every proposed-PR implementation specification, every execution workflow, and their dependency relationships. State that implementation has not begun and the draft pull request is ready for review.
