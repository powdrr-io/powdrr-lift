---
name: start-implementing-feature
when_to_use:
- When the user is ready to begin implementing a feature.
- When the feature needs a durable implement-a-feature workflow instantiated from
  the plan before implementation starts.
- When the generated workflow and first task should be placed in a pull request for
  user review.
steps:
- description: Confirm the feature name and workflow template.
  details: Capture the exact feature name used by specify-a-feature and fill out templates/implement-a-feature.yaml
    from the approved plan documents in docs/specs/<feature-name>/. Ask the user for
    the feature name if it is missing before continuing.
- description: Read the selected workflow template and explain the generated task
    graph.
  details: Inspect the selected template's task templates, dependencies, input state,
    output state types, and dependent state. Tell the user what workflow and first
    task will be generated before making repository changes.
  tool_invocations:
  - tool: shell
    command:
    - sed
    - "-n"
    - 1,260p
    - templates/implement-a-feature.yaml
- description: Instantiate the workflow and generate its first task.
  details: Use the repository's workflow-template and workflow-task models to create
    docs/workflows/<feature-name>/ with one persisted task per template task. Pass the
    same feature name as --work-item-name. Keep
    tasks open, preserve the template dependencies and state, and verify that task-001
    is the only ready task. Do not overwrite an existing workflow directory without
    user approval.
  tool_invocations:
  - tool: shell
    command:
    - powdrr-lift
    - instantiate-workflow
    - "--work-item-name"
    - "<work-item-name>"
    - "--template"
    - templates/implement-a-feature.yaml
- description: Review the generated workflow and first task with the user.
  details: Inspect the generated files and show the first task's description, inputs,
    dependencies, and expected output. If the workflow or first task is not appropriate,
    ask what should change and update the artifacts before creating the pull request.
- description: Commit the generated workflow and open a draft pull request.
  details: After the user confirms the generated workflow looks correct, commit only
    the workflow artifacts, push the feature branch, and create a draft pull request
    describing the selected template and first task. Do not implement the first task
    or merge the pull request.
  tool_invocations:
  - tool: shell
    command:
    - gh
    - pr
    - create
    - "--draft"
    - "--fill"
- description: Hand the pull request to the user for review.
  details: Show the pull request URL and summarize the generated workflow and first
    task. Wait for the user's approval before beginning implementation.
- description: Prepare an implementation checklist from each approved proposed PR.
  llm_type: high_reasoning
  details: For every proposed PR, identify the code files, tests, acceptance criteria,
    dependencies, and validation commands before making changes. Keep each item traceable
    to the approved specifications.
- description: Implement the approved feature changes and their tests.
  llm_type: standard_reasoning
  details: Keep the specifications and implementation aligned as the code changes
    are made.
- description: Run local formatting, linting, type checks, and tests.
  llm_type: fast_iteration
  details: Fix local failures before creating or updating the implementation pull request.
  tool_invocations:
  - tool: shell
    command:
    - uv
    - run
    - ruff
    - format
    - "--check"
    - "."
  - tool: shell
    command:
    - uv
    - run
    - ruff
    - check
    - "."
  - tool: shell
    command:
    - uv
    - run
    - mypy
    - src
    - tests
  - tool: shell
    command:
    - uv
    - run
    - pytest
    - "-q"
- description: Create or update the implementation pull request.
  llm_type: simple_task
  details: Create or update the pull request with the implementation scope, validation
    evidence, and remaining risks.
  tool_invocations:
  - tool: shell
    command:
    - gh
    - pr
    - create
    - "--draft"
    - "--fill"
- description: Wait 30 seconds for CI to make progress.
  llm_type: simple_task
  details: This is the first checkpoint in the CI monitoring loop.
- description: If CI has finished, check its result.
  llm_type: fast_iteration
  details: Inspect all required checks for the pull request before deciding whether
    the loop can exit.
  tool_invocations:
  - tool: shell
    command:
    - gh
    - pr
    - checks
    - "<pr-number>"
- description: If CI passed, break out of the CI monitoring loop.
  llm_type: simple_task
  details: Record the successful checks and continue to the final user handoff.
- description: If CI failed, fix the reported failures and return to the wait step.
  llm_type: standard_reasoning
  details: Apply only fixes supported by the failure evidence, rerun local validation,
    and keep the pull request updated.
- description: If CI is still running, return to the wait step.
  llm_type: simple_task
  details: Do not treat pending checks as a failure or as completion.
- description: Prompt the user to review the implementation and CI result.
  llm_type: standard_reasoning
  details: Show the final pull request, validation evidence, and CI outcome for approval.
