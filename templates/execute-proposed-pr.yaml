---
when_to_use:
- When an approved proposed PR is ready to execute.
- When implementation must be validated against the proposed PR specification
  before creating the PR.
how_to_fill_this_out:
- Keep the tasks in this order. Each task must complete before the next task
  starts.
- Use the listed tool invocations as the preferred commands. Use invoke_tool
  with tool=shell for repository commands and tool=fuzzy-match for fuzzy path
  discovery. A task may invoke another safe command when the listed command
  needs a concrete path discovered from its context.
- Do not modify product code before the test-generation and test-failure
  validation tasks complete. Do not create a pull request before all validation
  and review tasks complete.
task_templates:
- description: Gather context about the proposed PR
  step_type: invoke_tool
  prompt_catalogs: [context_types]
  complexity: high
  assignee_type: agent
  assignee_role: architect
  llm_type: long_context
  input_state:
    proposed_pr: <proposed-pr-id>
    # This is the proposal directory under docs/proposals, not a semantic
    # feature entity ID from feature_ids or a nested features section.
    feature_id: <work-item-name>
  pre_step:
    action: gather_context
    template:
      feature_id: <feature_id>
      types:
      - proposed_prs
      - requirements
      - features
      - acceptance_criteria
      - expected_tests
      - intent
      - risks
      - decisions
  details: >-
    Use the deterministic gathered context as the input for this step. Treat
    input_state.feature_id as the proposal directory scope and
    input_state.proposed_pr as the candidate to filter against the returned
    proposed_prs matches and identify the canonical proposed PR. Then
    summarize its goals, scope, acceptance criteria, tests, dependencies, risks,
    and related requirements into the declared task output. If the candidate is
    a workflow label, resolve it to the canonical proposed PR id from the
    gathered matches. Preserve the exact specification path and record only the
    relevant implementation context in output_state. Use read_document only
    when a specific section of a known document is needed. If the result is
    ambiguous or has no matching proposed PR, choose prompt_user with one
    precise question instead of guessing. Do not invoke gather_context again or
    guess a path.
  output_state_type: proposed-pr-context-state
  dependent_state:
  - proposed-pr-context-gathered
- description: Create a detailed execution plan
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: architect
  llm_type: high_reasoning
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    execution_plan: []
  details: >-
    Read the gathered proposed PR specification and all referenced documents.
    Create a detailed, ordered execution plan before changing files. Map every
    acceptance criterion to one or more tests, identify the exact test files
    and product files to change, describe the expected initially failing test
    command, define the implementation sequence, and define the final
    validation commands. Detect missing requirements, conflicts, excessive
    scope, or unsafe assumptions. If the plan is not implementable, use
    get-human-input for a specific decision. Otherwise record the complete plan
    in output_state and pass it to the next task.
  tool_invocations:
  - tool: shell
    command:
    - git
    - diff
    - --stat
  output_state_type: detailed-execution-plan-state
  dependent_state:
  - execution-plan-created
- description: Generate tests that will validate the new functionality
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: coder
  llm_type: standard_reasoning
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    execution_plan: <upstream-task-1>.detailed-execution-plan-state
    test_plan: []
  details: >-
    Implement only the tests described by the execution plan. Add focused tests
    for the required behavior, edge cases, and acceptance criteria. Keep the
    tests deterministic and consistent with existing repository conventions.
    Do not implement product behavior yet. Inspect the changed test files and
    record the test paths, test names, and expected failure reasons in
    output_state. Use the shell tool for repository inspection and edits.
  tool_invocations:
  - tool: shell
    command:
    - git
    - status
    - --short
  output_state_type: generated-test-diffs-state
  dependent_state:
  - tests-generated
- description: Validate the tests do not pass
  step_type: freeform
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: fast_iteration
  input_state:
    test_plan: <upstream-task-2>.generated-test-diffs-state
    generated_test_diffs: <upstream-task-2>.generated-test-diffs-state
    expected_failure_reasons: <upstream-task-2>.generated-test-diffs-state
  details: >-
    Run the targeted tests generated by the previous task before writing any
    product code. Use the pytest command below, or the narrower command from
    the test plan when one is specified. Confirm that the tests fail because
    the requested behavior is not implemented, not because of a syntax error,
    broken fixture, malformed test, or unrelated environment failure. If the
    tests pass, revise the tests to ensure they actually validate the new
    functionality. Record the exact command and result in output_state.
  tool_invocations:
  - tool: shell
    command:
    - pytest
    - -q
  output_state_type: tests-proven-failing-state
  dependent_state:
  - tests-proven-failing
- description: Generate product code changes
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: coder
  llm_type: standard_reasoning
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    execution_plan: <upstream-task-1>.detailed-execution-plan-state
    generated_test_diffs: <upstream-task-2>.generated-test-diffs-state
    tests_proven_failing: <upstream-task-3>.tests-proven-failing-state
    implementation_diffs: {}
  details: >-
    Implement the smallest safe product-code change that satisfies the
    proposed PR specification and the failing tests. Follow the execution plan
    and existing architecture. Do not weaken, delete, or bypass tests. Inspect
    the complete diff after editing, keep scope limited to the approved files,
    and record the implementation files, key design decisions, and resulting
    diff in output_state. Use shell for all repository inspection and edits.
  tool_invocations:
  - tool: shell
    command:
    - git
    - diff
    - "--"
    - tests
  output_state_type: generated-product-code-state
  dependent_state:
  - product-code-generated
- description: Validate all tests pass
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: reviewer
  llm_type: fast_iteration
  input_state:
    implementation_diffs: <upstream-task-4>.generated-product-code-state
    test_results: []
  details: >-
    Run the targeted tests first and then the full repository test suite. Use
    pytest through the shell tool. Diagnose and fix failures caused by the
    implementation or tests, rerunning the relevant tests after each fix.
    Do not declare success from a partial run. Record every command, result,
    failure diagnosis, and final passing result in output_state.
  tool_invocations:
  - tool: shell
    command:
    - pytest
    - -q
  output_state_type: all-tests-passing-state
  dependent_state:
  - all-tests-passing
- description: Confirm functional completeness against the specification
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: architect
  llm_type: high_reasoning
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    execution_plan: <upstream-task-1>.detailed-execution-plan-state
    implementation_diffs: <upstream-task-4>.generated-product-code-state
    test_results: <upstream-task-5>.all-tests-passing-state
    acceptance_criteria: <upstream-task-0>.proposed-pr-context-state
  details: >-
    Re-read the proposed PR specification and compare it line by line with the
    implementation diff and passing test results. Confirm that every goal,
    acceptance criterion, required file change, error case, and validation
    requirement is covered. Identify accidental scope, missing behavior,
    untested behavior, and contradictions. If anything is incomplete, make the
    required scoped correction and send it back through validation. Otherwise
    record an explicit criterion-by-criterion completeness result in
    output_state.
  tool_invocations:
  - tool: shell
    command:
    - git
    - diff
    - "--check"
  output_state_type: specification-completeness-state
  dependent_state:
  - specification-complete
- description: Run lint, type checks, and cleanup
  step_type: freeform
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: fast_iteration
  input_state:
    implementation_diffs: <upstream-task-4>.generated-product-code-state
    test_results: <upstream-task-5>.all-tests-passing-state
    completeness_review: <upstream-task-6>.specification-completeness-state
    lint_results: []
  details: >-
    Run repository formatting checks, lint checks, and type checks using the
    shell tool. Review the complete diff for debug code, generated artifacts,
    unrelated edits, formatting issues, and accidental secrets. Fix only
    issues within the approved scope, rerun all affected checks, and record
    the final commands and results in output_state.
  tool_invocations:
  - tool: shell
    command:
    - ruff
    - format
    - "--check"
    - .
  - tool: shell
    command:
    - ruff
    - check
    - .
  - tool: shell
    command:
    - mypy
    - src
  output_state_type: linted-and-cleaned-state
  dependent_state:
  - lint-and-cleanup-complete
- description: Promote the implemented feature documents to current state
  step_type: freeform
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: simple_task
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    implementation_diffs: <upstream-task-4>.generated-product-code-state
    completeness_review: <upstream-task-6>.specification-completeness-state
    feature_id: <work-item-name>
    promoted_documents: {}
  details: >-
    After implementation and validation are complete, move the feature's
    specification directory from docs/proposals/<feature_id>/ to
    docs/current/<feature_id>/. Use git mv so the committed implementation
    records the transition and preserves history. Move only the documents for
    the completed feature; leave unrelated proposals in place. If the proposal
    directory does not exist or the current directory already exists, inspect
    the exact contents and resolve the situation before continuing. Record the
    moved paths in output_state.
  tool_invocations:
  - tool: shell
    command:
    - git
    - mv
    - docs/proposals/<work-item-name>
    - docs/current/<work-item-name>
  output_state_type: promoted-current-state-documents
  dependent_state:
  - current-state-documents-promoted
- description: Stage the pull request changes
  step_type: freeform
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: simple_task
  input_state:
    implementation_diffs: <upstream-task-4>.generated-product-code-state
    test_results: <upstream-task-5>.all-tests-passing-state
    completeness_review: <upstream-task-6>.specification-completeness-state
    lint_results: <upstream-task-7>.linted-and-cleaned-state
    promoted_documents: <upstream-task-8>.promoted-current-state-documents
    staged_changes: {}
  details: >-
    Inspect the final diff and stage only the intended pull-request files.
    Ensure the staged set matches the approved scope and record the staged paths
    in output_state before final pull-request preparation.
  tool_invocations:
  - tool: shell
    command:
    - git
    - status
    - --short
  output_state_type: staged-pull-request-state
  dependent_state:
  - staged-for-pull-request
- description: Finish pull request preparation
  step_type: freeform
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: fast_iteration
  uses_skills:
  - finish-pr-prep
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    implementation_diffs: <upstream-task-4>.generated-product-code-state
    test_results: <upstream-task-5>.all-tests-passing-state
    completeness_review: <upstream-task-6>.specification-completeness-state
    lint_results: <upstream-task-7>.linted-and-cleaned-state
    promoted_documents: <upstream-task-8>.promoted-current-state-documents
    staged_changes: <upstream-task-9>.staged-pull-request-state
  details: >-
    Run finish-pr-prep after the intended pull-request files are staged. If the
    prep step changes files, restage only the approved files and rerun any
    affected checks before continuing. Record the final validation evidence in
    output_state for the pull-request handoff.
  tool_invocations:
  - tool: shell
    command:
    - git
    - status
    - --short
  output_state_type: pull-request-prep-state
  dependent_state:
  - pull-request-prep-complete
- description: Create the pull request
  step_type: freeform
  complexity: high
  assignee_type: human
  assignee_role: reviewer
  llm_type: standard_reasoning
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    implementation_diffs: <upstream-task-4>.generated-product-code-state
    test_results: <upstream-task-5>.all-tests-passing-state
    completeness_review: <upstream-task-6>.specification-completeness-state
    lint_results: <upstream-task-10>.pull-request-prep-state
    pull_request: {}
  details: >-
    Present the proposed PR specification, implementation summary, changed
    files, acceptance-criteria results, test commands and results, lint and
    type-check results, risks, and remaining caveats. Ask the human reviewer to
    confirm that the work is ready for a pull request. After approval, create
    the pull request using the repository's normal Git workflow and record its
    URL and final status in output_state. Do not create a pull request before
    the human explicitly approves it.
  output_state_type: pull-request-created-state
  dependent_state:
  - pull-request-created
