---
id: execute-proposed-pr
when_to_use:
- When an approved proposed PR is ready to execute.
- When implementation must be validated against the proposed PR specification
  before creating the PR.
how_to_fill_this_out:
- Keep the tasks in this order. Each task has one responsibility and must
  complete before the next task starts.
- A freeform task performs one LLM-directed action. Do not combine discovery,
  editing, validation, review, and repair in one task.
- An invoke_tool task performs the one declared command. The command result is
  authoritative; do not replace it with a prose claim.
- Use the exact top-level JSON field `action`. Never use `kind`, `action_input`,
  or markdown. Use `next_step` when the task has performed its edit and is
  handing the declared outputs to the next task; use `complete` when the task
  has finished its responsibility and is recording a final handoff.
- For an edit, return one `edit` or `yaml_edit` action, then finish with
  `complete` after the edit result is returned. For a file move, return one
  `file_management` action, then finish with `complete`. For a review, return
  one `complete` action with the review in its declared output. Examples below
  are complete JSON shapes, not pseudocode.
- Do not modify product code before the test-generation task completes. After
  product code is emitted, the test-run/fix skill must report a passing full
  suite before the remaining validation and review tasks begin. Do not create
  a pull request before all validation and review tasks complete.
invariants:
- id: workflow-implements-target
  relationship: implements
  source_type: workflow
  target_type: proposed_pr
  target_id: <proposed-pr-id>
  cardinality: exactly_one
task_templates:
- description: Gather context about the proposed PR
  step_type: invoke_tool
  prompt_catalogs: [context_types]
  complexity: high
  assignee_type: agent
  assignee_role: architect
  llm_type: long_context
  input_state:
    proposed_pr: <proposed-pr-id>
    # This is the proposal directory under docs/proposals, not a semantic
    # feature entity ID from feature_ids or a nested features section.
    feature_id: <work-item-name>
  pre_step:
    action: gather_context
    template:
      feature_id: <feature_id>
      types:
      - proposed_prs
      - requirements
      - features
      - acceptance_criteria
      - expected_tests
      - intent
      - risks
      - decisions
  details: >-
    The deterministic pre-step already gathered the context. Assign that exact
    result to proposed-pr-context-state. Do not search for, rediscover, or
    reinterpret the proposed PR. Complete this task with a complete action,
    for example:
    {"action":"complete","output_state":{"proposed-pr-context-state":"the exact gathered result"},"decisions_and_context":"Assigned the deterministic proposed PR context for planning."}
  output_state_type: proposed-pr-context-state
  dependent_state:
  - proposed-pr-context-gathered
- description: Create the execution plan
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: architect
  llm_type: high_reasoning
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    execution_plan: []
  details: >-
    Perform exactly one action: create the ordered execution plan. Read the
    supplied proposed PR context, map every acceptance criterion to tests and
    implementation work, and record exact paths and validation commands in the
    plan. Do not edit files, run commands, or call gather_context in this step.
    If a required decision is missing, use one prompt_user action instead of
    inventing it. When the plan is complete, return exactly this complete shape,
    replacing the example execution_plan with the ordered plan:
    {"action":"complete","output_state":{"detailed-execution-plan-state":{"execution_plan":{"criteria_to_tests":[],"implementation_files":[],"test_commands":[],"validation_commands":[],"risks":[]}}},"decisions_and_context":"Created the ordered plan and mapped each acceptance criterion to validation."}
  output_state_type: detailed-execution-plan-state
  dependent_state:
  - execution-plan-created
- description: Generate the planned tests
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: coder
  llm_type: standard_reasoning
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    execution_plan: <upstream-task-1>.detailed-execution-plan-state
    test_plan: []
  details: >-
    Perform exactly one action: edit only the test files named by the execution
    plan. Add focused tests for the acceptance criteria and required edge cases;
    do not edit product code, run tests, or review unrelated files. Use one
    edit action, with file_edits when more than one test file is required. A
    valid response after the edit looks like:
    {"action":"edit","file_edits":[{"file_path":"tests/test_feature.py","edits":[{"kind":"add","start_line":1,"end_line":1,"text":"new test code"}]}],"decisions_and_context":"Added the planned failing tests without changing product code."}
    After the edit result is returned, complete the task with
    output_state.generated-test-diffs-state containing the test paths, test
    names, and expected failure reasons. Do not use next_step.
  output_state_type: generated-test-diffs-state
  dependent_state:
  - tests-generated
- description: Implement the planned product code
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: coder
  llm_type: standard_reasoning
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    execution_plan: <upstream-task-1>.detailed-execution-plan-state
    generated_test_diffs: <upstream-task-2>.generated-test-diffs-state
    implementation_diffs: {}
  details: >-
    Perform exactly one action: edit the approved product files to implement the
    proposed behavior and satisfy the failing tests. Make the smallest safe
    change; do not weaken or delete tests, run validation, or clean unrelated
    files. Use one edit action, with file_edits for multiple files. A valid
    response looks like:
    {"action":"edit","file_edits":[{"file_path":"src/feature.py","edits":[{"kind":"replace","start_line":10,"end_line":12,"text":"implementation code"}]}],"decisions_and_context":"Implemented the planned behavior in the approved product file."}
    After the edit succeeds, return next_step and record implementation files
    and the resulting diff in generated-product-code-state for the next task.
  output_state_type: generated-product-code-state
  dependent_state:
  - product-code-generated
- description: Run all tests and fix failures
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: reviewer
  llm_type: fast_iteration
  uses_skills:
  - run-tests-and-fix
  input_state:
    implementation_diffs: <upstream-task-3>.generated-product-code-state
    generated_test_diffs: <upstream-task-2>.generated-test-diffs-state
    test_results: {}
  details: >-
    Invoke run-tests-and-fix. It runs the complete test suite, permits edits to
    approved product and test files to address failures, and repeats the
    deterministic run/fix gate until every test passes. Do not independently
    run tests or edit files in this task. Complete with
    all-tests-results-state containing the exact final command, return code,
    and test summary.
  output_state_type: all-tests-results-state
  dependent_state:
  - all-tests-passed
- description: Review specification completeness
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: architect
  llm_type: high_reasoning
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    execution_plan: <upstream-task-1>.detailed-execution-plan-state
    implementation_diffs: <upstream-task-3>.generated-product-code-state
    all_tests_results: <upstream-task-4>.all-tests-results-state
    completeness_review: {}
  details: >-
    Perform exactly one action: compare the implementation and test evidence to
    every proposed PR requirement and acceptance criterion. Do not edit files or
    run commands. Return a criterion-by-criterion review in one next_step
    action, using this shape:
    {"action":"next_step","outputs":{"specification-completeness-state":{"complete":true,"criteria":[]}},"decisions_and_context":"Compared every criterion with implementation and test evidence."}
    Set complete false and list exact missing behavior or paths when anything is
    incomplete. Do not claim completeness because tests pass alone.
  output_state_type: specification-completeness-state
  dependent_state:
  - specification-complete
- description: Repair specification completeness gaps
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: coder
  llm_type: standard_reasoning
  input_state:
    completeness_review: <upstream-task-5>.specification-completeness-state
    repair_result: {}
  details: >-
    Perform exactly one action only when the completeness review identifies a
    gap: edit the approved files to close the listed gap. Do not run tests or
    broaden scope here; later deterministic checks provide evidence. If the
    review is complete, make no edit. A repair uses one edit action, for example:
    {"action":"edit","file_path":"tests/test_feature.py","edits":[{"kind":"add","start_line":1,"end_line":1,"text":"missing acceptance test"}],"decisions_and_context":"Added the missing coverage identified by completeness review."}
  output_state_type: completeness-repair-state
  dependent_state:
  - completeness-repair-complete
- description: Run formatting checks
  step_type: invoke_tool
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: simple_task
  input_state:
    completeness_repair: <upstream-task-6>.completeness-repair-state
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - ruff
      - format
      - --check
      - .
  details: >-
    Assign the deterministic formatter result to formatting-check-state. Do not
    fix files in this step. Use exactly one next_step action with the command,
    return code, and result.
  output_state_type: formatting-check-state
  dependent_state:
  - formatting-checked
- description: Run lint checks
  step_type: invoke_tool
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: simple_task
  input_state:
    formatting_check: <upstream-task-7>.formatting-check-state
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - ruff
      - check
      - .
  details: >-
    Assign the deterministic lint result to lint-check-state. Do not fix files in
    this step. Use exactly one next_step action with the command, return code,
    and result.
  output_state_type: lint-check-state
  dependent_state:
  - lint-checked
- description: Run type checks
  step_type: invoke_tool
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: simple_task
  input_state:
    lint_check: <upstream-task-8>.lint-check-state
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - mypy
      - src
  details: >-
    Assign the deterministic type-check result to type-check-state. Do not fix
    files in this step. Use exactly one next_step action with the command, return
    code, and result.
  output_state_type: type-check-state
  dependent_state:
  - type-checked
- description: Review the final diff for scope
  step_type: freeform
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: high_reasoning
  input_state:
    formatting_check: <upstream-task-7>.formatting-check-state
    lint_check: <upstream-task-8>.lint-check-state
    type_check: <upstream-task-9>.type-check-state
    scope_review: {}
  details: >-
    Perform exactly one action: inspect the complete diff and identify debug
    code, generated artifacts, secrets, unrelated edits, or missing intended
    files. Do not edit or stage files. Return one next_step action with an
    explicit clean boolean and every finding, for example:
    {"action":"next_step","outputs":{"final-scope-review-state":{"clean":true,"findings":[]}},"decisions_and_context":"Reviewed the complete diff and found no out-of-scope changes."}
    A clean review requires an empty findings list, not merely passing checks.
  output_state_type: final-scope-review-state
  dependent_state:
  - final-scope-reviewed
- description: Repair final diff scope issues
  step_type: freeform
  complexity: medium
  assignee_type: agent
  assignee_role: coder
  llm_type: standard_reasoning
  input_state:
    scope_review: <upstream-task-10>.final-scope-review-state
    scope_repair: {}
  details: >-
    Perform exactly one action only when the scope review identifies a finding:
    edit or remove only the reported out-of-scope content. Do not run checks or
    stage files here. If the review is clean, make no edit. For a file removal,
    use one file_management action such as:
    {"action":"file_management","operation":"delete","file_path":"tmp/debug.log","decisions_and_context":"Removed the reported generated artifact."}
    For a code correction, use one edit action. Record the repair in the
    output_state and let the final checks rerun after this task.
  output_state_type: final-scope-repair-state
  dependent_state:
  - final-scope-repair-complete
- description: Promote the feature documents
  step_type: invoke_tool
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: simple_task
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    completeness_review: <upstream-task-5>.specification-completeness-state
    scope_repair: <upstream-task-11>.final-scope-repair-state
    feature_id: <work-item-name>
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - mv
      - docs/proposals/<work-item-name>
      - docs/current/<work-item-name>
  details: >-
    The deterministic git mv already ran. Assign its complete result and moved
    paths to promoted-current-state-documents. Do not edit, stage, or resolve a
    different feature in this step. If the command reports an inconsistent
    proposal/current directory, stop and report that exact inconsistency.
  output_state_type: promoted-current-state-documents
  dependent_state:
  - current-state-documents-promoted
- description: Verify the pull request file set
  step_type: invoke_tool
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: simple_task
  input_state:
    implementation_diffs: <upstream-task-3>.generated-product-code-state
    promoted_documents: <upstream-task-12>.promoted-current-state-documents
    type_check: <upstream-task-9>.type-check-state
  pre_step:
    action: invoke_tool
    template:
      tool: git
      command:
      - status
      - --short
  details: >-
    Assign the deterministic repository status to staged-pull-request-state.
    Verify that every changed path is within the approved implementation,
    test, and promoted-document scope. Do not stage or commit in this step. Use
    one next_step action with the exact path list; report an inconsistency rather
    than silently accepting an unexpected file.
  output_state_type: staged-pull-request-state
  dependent_state:
  - pull-request-files-verified
- description: Finish pull request preparation
  step_type: freeform
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: fast_iteration
  uses_skills:
  - finish-pr-prep
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    implementation_diffs: <upstream-task-3>.generated-product-code-state
    all_tests_results: <upstream-task-4>.all-tests-results-state
    completeness_review: <upstream-task-5>.specification-completeness-state
    formatting_check: <upstream-task-7>.formatting-check-state
    lint_check: <upstream-task-8>.lint-check-state
    type_check: <upstream-task-9>.type-check-state
    promoted_documents: <upstream-task-12>.promoted-current-state-documents
    staged_changes: <upstream-task-13>.staged-pull-request-state
  details: >-
    Perform exactly one action: invoke the listed finish-pr-prep skill. Do not
    independently edit, stage, commit, push, or create a pull request here; the
    nested skill owns those operations. After it returns, pass its complete
    evidence to the next workflow boundary with one next_step action, for
    example:
    {"action":"next_step","outputs":{"pull-request-prep-state":{"checks":[],"files_to_publish":[]}},"decisions_and_context":"finish-pr-prep completed with the recorded validation evidence."}
  output_state_type: pull-request-prep-state
  dependent_state:
  - pull-request-prep-complete
