---
id: execute-proposed-pr
when_to_use:
- When an approved proposed PR is ready to execute.
- When implementation must be validated against the proposed PR specification
  before creating the PR.
how_to_fill_this_out:
- Keep the tasks in this order. Each task has one responsibility and must
  complete before the next task starts.
- The execute-proposed-pr template requires the `verification-command` template
  value. Discover the repository's test command from the gathered `tools`
  context, then pass that command when instantiating this template.
- An invoke_tool task performs the one declared command. The command result is
  authoritative; do not replace it with a prose claim.
- Use the exact top-level JSON field `action`. Never use `kind`, `action_input`,
  or markdown. Use `next_step` when the current task is finished and its
  declared `output_state` should be persisted before the next task starts. Use
  `complete` only for an early workflow termination where no later task should
  run, such as when the proposed PR is superseded. It is not the normal action
  for finishing an individual task.
- For an edit, return one `edit` or `yaml_edit` action, then finish with
  `next_step` after the edit result is returned. For a file move, return one
  `file_management` action, then finish with `next_step`. For a review, return
  one `next_step` action with the review in its declared output. Examples below
  are complete JSON shapes, not pseudocode.
- The final task should use `next_step` after persisting its output; the runner
  observes that all tasks are complete and finishes the workflow. Use `complete`
  only for an early termination condition.
- The coding_loop task must add or update focused tests before claiming the
  implementation is complete, and its declared verification must pass before
  the remaining validation and review tasks begin. Do not create a pull request
  before all validation and review tasks complete.
invariants:
- id: workflow-implements-target
  relationship: implements
  source_type: workflow
  target_type: proposed_pr
  target_id: <proposed-pr-id>
  cardinality: exactly_one
task_templates:
- description: Gather context about the proposed PR
  phase_type: intake
  persona_id: architect
  actions: []
  step_type: invoke_tool
  prompt_catalogs: [context_types]
  complexity: high
  assignee_type: agent
  assignee_role: architect
  llm_type: long_context
  input_state:
    proposed_pr: <proposed-pr-id>
    # This is the proposal directory under docs/proposals, not a semantic
    # feature entity ID from feature_ids or a nested features section.
    feature_id: <work-item-name>
  pre_step:
    action: gather_context
    template:
      feature_id: <feature_id>
      types:
      - proposed_prs
      - requirements
      - features
      - acceptance_criteria
      - expected_tests
      - tools
      - intent
      - risks
      - decisions
  details: >-
    The deterministic pre-step already gathered the context. Assign that exact
    result to proposed-pr-context-state. Do not search for, rediscover, or
    reinterpret the proposed PR. Complete this task with a next_step action,
    for example:
    {"action":"next_step","output_state":{"proposed-pr-context-state":"the exact gathered result"},"decisions_and_context":"Assigned the deterministic proposed PR context for planning."}
  output_state_type: proposed-pr-context-state
  dependent_state:
  - proposed-pr-context-gathered
- description: Create the execution plan
  phase_type: plan_pr
  persona_id: engineer
  actions: [edit, yaml_edit, file_management, read_document]
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: architect
  llm_type: high_reasoning
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    execution_plan: []
  details: >-
    Perform exactly one action: create the ordered execution plan. Read the
    supplied proposed PR context, map every acceptance criterion to tests and
    implementation work, and record exact paths and validation commands in the
    plan. Do not edit files, run commands, or call gather_context in this step.
    If a required decision is missing, use one prompt_user action instead of
    inventing it. When the plan is complete, return exactly this next_step shape,
    replacing the example execution_plan with the ordered plan:
    {"action":"next_step","output_state":{"detailed-execution-plan-state":{"execution_plan":{"criteria_to_tests":[],"implementation_files":[],"test_commands":[],"validation_commands":[],"risks":[]}}},"decisions_and_context":"Created the ordered plan and mapped each acceptance criterion to validation."}
  output_state_type: detailed-execution-plan-state
  dependent_state:
  - execution-plan-created
- description: Implement, test, and repair the proposed PR
  phase_type: validate
  persona_id: engineer
  actions: [invoke_tool, edit, yaml_edit, file_management, read_document]
  step_type: coding_loop
  complexity: high
  assignee_type: agent
  assignee_role: coder
  llm_type: standard_reasoning
  coding_loop:
    goal: Implement the proposed PR, add focused tests, and make the complete test suite pass.
    verification:
    - id: full-test-suite
      command: <verification-command>
    stopping_conditions:
    - The complete test suite passes.
    - No approved implementation or test issue remains unresolved.
    max_iterations: 100
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    execution_plan: <upstream-task-1>.detailed-execution-plan-state
    implementation_and_test_diffs: {}
    test_results: {}
  details: >-
    Work as a bounded inspect, implement, test, and repair loop. Use the
    proposed PR context and execution plan to decide what product behavior and
    focused tests are needed. Make the smallest safe edits in the approved
    scope; do not weaken tests or claim success from prose. After every edit,
    the harness automatically runs the declared full-test-suite verification
    command and records its exact result. Use failures as evidence, repair the
    implementation or tests when justified, and repeat until the suite passes.
    Finish with next_step and implementation-and-test-state containing the
    changed paths, test coverage, and final verification evidence; next_step is
    rejected until the latest automatic verification passes.
    Use only the documented top-level action shapes. For edits, use
    {"action":"edit","file_path":"relative/path","edits":[{"kind":"replace","start_line":1,"end_line":1,"text":"..."}]}; for multiple files use file_edits with one file_path per entry. For commands, use invoke_tool with tool shell and parameters.command as a string or argv array. Do not nest action fields under parameters or use old/new/content edit fields.
  output_state_type: implementation-and-test-state
  dependent_state:
  - implementation-and-tests-passed
- description: Review specification completeness
  phase_type: review_specifications
  persona_id: specification-reviewer
  actions: [edit, yaml_edit, file_management, read_document]
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: architect
  llm_type: high_reasoning
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    execution_plan: <upstream-task-1>.detailed-execution-plan-state
    implementation_and_test_diffs: <upstream-task-2>.implementation-and-test-state
    all_tests_results: <upstream-task-2>.implementation-and-test-state
    completeness_review: {}
  details: >-
    Perform exactly one action: compare the implementation and test evidence to
    every proposed PR requirement and acceptance criterion. Do not edit files or
    run commands. Return a criterion-by-criterion review in one next_step action,
    using the declared output_state field and this shape:
    {"action":"next_step","output_state":{"specification-completeness-state":{"complete":true,"criteria":[]}},"decisions_and_context":"Compared every criterion with implementation and test evidence."}
    Set complete false and list exact missing behavior or paths when anything is
    incomplete. Do not claim completeness because tests pass alone.
  output_state_type: specification-completeness-state
  dependent_state:
  - specification-complete
- description: Repair specification completeness gaps
  phase_type: specify
  persona_id: architect
  actions: [edit, yaml_edit, file_management, read_document]
  step_type: freeform
  complexity: high
  assignee_type: agent
  assignee_role: coder
  llm_type: standard_reasoning
  input_state:
    completeness_review: <upstream-task-3>.specification-completeness-state
    repair_result: {}
  details: >-
    Perform exactly one action only when the completeness review identifies a
    gap: edit the approved files to close the listed gap. Do not run tests or
    broaden scope here; later deterministic checks provide evidence. If the
    review is complete, make no edit. A repair uses one edit action, for example:
    {"action":"edit","file_path":"tests/test_feature.py","edits":[{"kind":"add","start_line":1,"end_line":1,"text":"missing acceptance test"}],"decisions_and_context":"Added the missing coverage identified by completeness review."}
    After the edit result is returned, or immediately when no repair is needed,
    finish this task with next_step and output_state containing
    completeness-repair-state.
  output_state_type: completeness-repair-state
  dependent_state:
  - completeness-repair-complete
- description: Run formatting checks
  phase_type: validate
  persona_id: engineer
  actions: []
  step_type: invoke_tool
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: simple_task
  input_state:
    completeness_repair: <upstream-task-4>.completeness-repair-state
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - ruff
      - format
      - --check
      - .
  details: >-
    Assign the deterministic formatter result to formatting-check-state. Do not
    fix files in this step. Finish with next_step and output_state exactly
    containing that typed state, including the command, return code, and result.
  output_state_type: formatting-check-state
  dependent_state:
  - formatting-checked
- description: Run lint checks
  phase_type: validate
  persona_id: engineer
  actions: []
  step_type: invoke_tool
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: simple_task
  input_state:
    formatting_check: <upstream-task-5>.formatting-check-state
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - ruff
      - check
      - .
  details: >-
    Assign the deterministic lint result to lint-check-state. Do not fix files in
    this step. Finish with next_step and output_state exactly containing that
    typed state, including the command, return code, and result.
  output_state_type: lint-check-state
  dependent_state:
  - lint-checked
- description: Run type checks
  phase_type: validate
  persona_id: engineer
  actions: []
  step_type: invoke_tool
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: simple_task
  input_state:
    lint_check: <upstream-task-6>.lint-check-state
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - mypy
      - src
  details: >-
    Assign the deterministic type-check result to type-check-state. Do not fix
    files in this step. Finish with next_step and output_state exactly containing
    that typed state, including the command, return code, and result.
  output_state_type: type-check-state
  dependent_state:
  - type-checked
- description: Review the final diff for scope
  phase_type: review_pr
  persona_id: code-reviewer
  actions: [edit, yaml_edit, file_management, read_document]
  step_type: freeform
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: high_reasoning
  input_state:
    formatting_check: <upstream-task-5>.formatting-check-state
    lint_check: <upstream-task-6>.lint-check-state
    type_check: <upstream-task-7>.type-check-state
    scope_review: {}
  details: >-
    Perform exactly one action: inspect the complete diff and identify debug
    code, generated artifacts, secrets, unrelated edits, or missing intended
    files. Do not edit or stage files. Use the structured Git intrinsic for
    status, never a raw git command: 
    {"action":"invoke_tool","tool":"git","parameters":{"operation":"status"},"decisions_and_context":"Inspected the repository status for the complete scope review."}
    After the status result, return one next_step action with an explicit clean
    boolean and every finding, for example:
    {"action":"next_step","output_state":{"final-scope-review-state":{"clean":true,"findings":[]}},"decisions_and_context":"Reviewed the complete diff and found no out-of-scope changes."}
    A clean review requires an empty findings list, not merely passing checks.
    Ignore workflow-llm-errors.jsonl during this review: it is runtime
    observability state written outside the deliverable and must not be treated
    as a scope finding or repaired by repeatedly deleting it. Treat other
    diagnostic artifacts such as agent_error.txt as out of scope when present.
  output_state_type: final-scope-review-state
  dependent_state:
  - final-scope-reviewed
- description: Repair final diff scope issues
  phase_type: resolve_findings
  persona_id: engineer
  actions: [edit, yaml_edit, file_management, read_document]
  step_type: freeform
  complexity: medium
  assignee_type: agent
  assignee_role: coder
  llm_type: standard_reasoning
  input_state:
    scope_review: <upstream-task-8>.final-scope-review-state
    scope_repair: {}
  details: >-
    Perform exactly one action only when the scope review identifies a finding:
    edit or remove only the reported out-of-scope content. Do not run checks or
    stage files here. If the review is clean, make no edit. For a file removal,
    use one file_management action such as:
    {"action":"file_management","operation":"delete","file_path":"tmp/debug.log","decisions_and_context":"Removed the reported generated artifact."}
    For a code correction, use one edit action. Record the repair in the
    output_state and let the final checks rerun after this task. Finish with
    next_step.
  output_state_type: final-scope-repair-state
  dependent_state:
  - final-scope-repair-complete
- description: Promote the feature documents
  phase_type: confirm_readiness
  persona_id: code-reviewer
  actions: []
  step_type: invoke_tool
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: simple_task
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    completeness_review: <upstream-task-3>.specification-completeness-state
    scope_repair: <upstream-task-9>.final-scope-repair-state
    feature_id: <work-item-name>
  pre_step:
    action: invoke_tool
    template:
      tool: shell
      command:
      - mv
      - docs/proposals/<work-item-name>
      - docs/current/<work-item-name>
  details: >-
    The deterministic git mv already ran. Assign its complete result and moved
    paths to promoted-current-state-documents. Do not edit, stage, or resolve a
    different feature in this step. If the command reports an inconsistent
    proposal/current directory, stop and report that exact inconsistency.
  output_state_type: promoted-current-state-documents
  dependent_state:
  - current-state-documents-promoted
- description: Verify the pull request file set
  phase_type: confirm_readiness
  persona_id: code-reviewer
  actions: []
  step_type: invoke_tool
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: simple_task
  input_state:
    implementation_and_test_diffs: <upstream-task-2>.implementation-and-test-state
    promoted_documents: <upstream-task-10>.promoted-current-state-documents
    type_check: <upstream-task-7>.type-check-state
  pre_step:
    action: invoke_tool
    template:
      tool: git
      command:
      - status
      - --short
  details: >-
    The deterministic repository status is authoritative. Verify that every
    changed path is within the approved implementation, test, and
    promoted-document scope. Stage exactly those approved paths with the
    intrinsic Git add action; do not use a shell command and do not stage logs,
    caches, or unrelated files. For example:
    {"action":"invoke_tool","tool":"git","parameters":{"operation":"add","paths":["src/feature.py","tests/test_feature.py","docs/current/feature"]},"decisions_and_context":"Staged the verified pull-request files."}
    After the add succeeds, use next_step with the exact staged path list in
    the declared output_state. Report an inconsistency rather than silently
    accepting an unexpected file. This next_step finishes the task and advances
    the workflow.
  output_state_type: staged-pull-request-state
  dependent_state:
  - pull-request-files-verified
- description: Finish pull request preparation
  phase_type: publish_pr
  persona_id: engineering-manager
  actions: [invoke_skill]
  step_type: freeform
  complexity: medium
  assignee_type: agent
  assignee_role: reviewer
  llm_type: fast_iteration
  uses_skills:
  - finish-pr-prep
  input_state:
    proposed_pr_context: <upstream-task-0>.proposed-pr-context-state
    implementation_and_test_diffs: <upstream-task-2>.implementation-and-test-state
    all_tests_results: <upstream-task-2>.implementation-and-test-state
    completeness_review: <upstream-task-3>.specification-completeness-state
    formatting_check: <upstream-task-5>.formatting-check-state
    lint_check: <upstream-task-6>.lint-check-state
    type_check: <upstream-task-7>.type-check-state
    promoted_documents: <upstream-task-10>.promoted-current-state-documents
    staged_changes: <upstream-task-11>.staged-pull-request-state
  details: >-
    The listed finish-pr-prep skill runs automatically because it is declared
    in uses_skills. Do not return invoke_skill for it; doing so is recursive and
    will be rejected. Do not independently edit, stage, commit, push, or create
    a pull request here; the attached skill owns its validation operations.
    After the attached skill returns, pass its complete evidence to the next
    workflow boundary with a separate next_step action,
    for example:
    {"action":"next_step","output_state":{"pull-request-prep-state":{"checks":[],"files_to_publish":[]}},"decisions_and_context":"finish-pr-prep completed with the recorded validation evidence."}
  output_state_type: pull-request-prep-state
  dependent_state:
  - pull-request-prep-complete
