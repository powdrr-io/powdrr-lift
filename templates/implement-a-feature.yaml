when_to_use:
  - When a feature has plan documents and is ready to become implementation work.
  - When the work should confirm requirements before splitting the plan into proposed PRs.

how_to_fill_this_out:
  - Review the existing plan documents before making implementation decisions.
  - Keep the confirmed requirements explicit in the task state.
  - Generate one execute-proposed-pr workflow for each approved proposed PR.

task_templates:
  - description: Review plan documents
    complexity: high
    assignee_type: agent
    assignee_role: architect
    llm_type: high_reasoning
    details: Read and validate every listed plan document before summarizing the implementation scope.
    # Fill these paths from the work-item's approved specification documents.
    input_state:
      plan_documents:
        - docs/specs/<feature-name>/system-specification.yaml
        - docs/specs/<feature-name>/architecture-specification.yaml
        - docs/specs/<feature-name>/implementation-specification.yaml
        - docs/specs/<feature-name>/proposed-pr-specification.yaml
    output_state_type: reviewed-plan-documents-state
    upstream_task_template_indexes: []
    dependent_state:
      - plan-documents-reviewed

  - description: Confirm requirements
    complexity: medium
    assignee_type: human
    assignee_role: decider
    llm_type: standard_reasoning
    details: Confirm that the requirements, constraints, and success criteria still match the reviewed plan documents.
    input_state:
      requirements: []
      constraints: []
      success_criteria: []
    output_state_type: confirmed-requirements-state
    upstream_task_template_indexes:
      - 0
    dependent_state:
      - requirements-confirmed

  - description: Generate proposed PRs
    complexity: high
    assignee_type: agent
    assignee_role: architect
    llm_type: high_reasoning
    details: >-
      Turn the confirmed requirements into proposed PRs and generate an
      execute-proposed-pr workflow template for each approved PR. The
      instantiation command supplies work-item and workflow-instance context;
      the first execute task must use that context to locate and verify the
      actual proposed PR rather than assuming a path or id.
    tool_invocations:
      - tool: shell
        command:
          - powdrr-lift
          - instantiate-workflow
          - --work-item-name
          - <work-item-name>
          - --workflow-instance-name
          - <workflow-instance-name>
          - --template
          - templates/execute-proposed-pr.yaml
    input_state:
      proposed_prs: []
    output_state_type: proposed-prs-and-execution-workflows-state
    upstream_task_template_indexes:
      - 1
    dependent_state:
      - proposed-prs-generated
      - execute-proposed-pr-workflows-generated
