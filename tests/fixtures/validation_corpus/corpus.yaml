schema_version: validation-corpus-v1
corpus_revision: 2026-11-14
review_policy:
  scope: Pull-request validation declarations and their local wrapper/configuration evidence.
  requiredness: unknown unless repository branch-protection or ruleset evidence is recorded; this corpus does not query repository rules.
  license_source: GitHub repository metadata SPDX identifier, cross-checked against the named license file where one exists.
  expected_inventory: Expected obligations below were reviewed against the pinned workflow/configuration paths. A selected subset is used for exact command comparison; other discovered candidates are reported as unreviewed, never promoted to required checks.
repositories:
  - id: powdrr-lift
    repository: https://github.com/powdrr-io/powdrr-lift
    revision: 7e1d8c2c7a0d4ca9aa82c887061858a22c82ccef
    default_branch: main
    license: NOASSERTION
    license_evidence: GitHub repository metadata reported no SPDX license identifier; the repository has no top-level license file at this revision.
    coverage: [this-repository, Ruff, mypy, pytest, custom-CI, package-distribution, workflow-scenarios, Windows-portable-locks]
    evidence: [.github/workflows/ci.yml, pyproject.toml]
    obligations:
      - id: formatter
        profile: ruff-format-check
        command: [uv, run, ruff, format, --check, .]
        cwd: .
        state: executable
        requiredness: unknown
        evidence: [.github/workflows/ci.yml]
      - id: lint
        profile: ruff-check
        command: [uv, run, ruff, check, .]
        cwd: .
        state: executable
        requiredness: unknown
        evidence: [.github/workflows/ci.yml]
      - id: types
        profile: mypy
        provider: mypy
        command: [uv, run, mypy, src, tests]
        cwd: .
        state: executable
        requiredness: unknown
        evidence: [.github/workflows/ci.yml]
      - id: tests
        profile: ci-root-test-3
        provider: pytest
        command: [uv, run, pytest, -n, auto, --cov=powdrr_lift, --cov=powdrr_service, --cov=powdrr_contracts, --cov=powdrr_local, --cov=powdrr_agent, --cov-branch, --cov-report=term-missing, --cov-report=xml, tests]
        cwd: .
        state: executable
        requiredness: unknown
        evidence: [.github/workflows/ci.yml]
      - id: procedural-catalog
        profile: validate-procedrr-processes
        command: [uv, run, powdrr-lift, validate-procedrr-processes]
        cwd: .
        state: executable
        requiredness: unknown
        evidence: [.github/workflows/ci.yml]
      - id: deterministic-workflow-scenarios
        profile: workflow-scenario-suite
        command: [./scripts/run-deterministic-workflow-suite.sh]
        cwd: .
        state: executable
        requiredness: unknown
        evidence: [.github/workflows/ci.yml, scripts/run-deterministic-workflow-suite.sh]
      - id: portable-lock-tests
        profile: pytest
        provider: pytest
        command: [uv, run, pytest, tests/test_file_lock.py, -q]
        cwd: .
        state: executable
        requiredness: unknown
        evidence: [.github/workflows/ci.yml]
      - id: agent-distribution-verification
        profile: script-verify-agent-distribution
        provider: custom
        command: [uv, run, python, scripts/verify-agent-distribution.py]
        cwd: .
        state: executable
        requiredness: unknown
        evidence: [.github/workflows/ci.yml, scripts/verify-agent-distribution.py]

